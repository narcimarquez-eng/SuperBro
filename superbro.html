    if (this.onGround) this.glideT = PHYS.glideTime;

    // --- Gravedad: más suave si se mantiene salto subiendo (salto variable) ---
    const subiendoConSalto = this.vy < 0 && held.jump && this.jumping;
    const g = subiendoConSalto ? PHYS.jumpHoldG : GRAVITY;
    if (!this.trepando && !(this.cape && held.jump && this.glideT > 0 && this.vy >= 0 && this.vy <= PHYS.glideV)) {
      this.vy += g * dt;
    }
    if (this.vy > MAX_FALL) this.vy = MAX_FALL;
    if (this.vy >= 0) this.jumping = false;
    if (!held.jump && this.vy < -120 && !this.rebotando) this.vy = -120; // corta el salto al soltar

    // --- Colisiones ---
    const vyAntes = this.vy, enAireAntes = !this.onGround, yAntes = this.y;
    const r = moverEntidad(lvl, this, dt);
    if (r.pared) this.vx = 0;
    if (r.techo) {
      game.golpearDesdeAbajo(this);
    } else if (vyAntes < 0 && lvl.golpearOculto) {
      lvl.golpearOculto(this, yAntes, game);
    }
    // Plataformas de una dirección: solo paran al caer desde arriba
    if (!r.suelo && this.vy >= 0 && aterrizaEnDireccional(lvl, this, this.prevBottom)) { r.suelo = true; this.vy = 0; }
    this.onGround = r.suelo;
    if (r.suelo || this.vy >= 0) this.rebotando = false;
    // Muelle: al pisarlo, salta muy alto
    if (r.suelo && vyAntes >= 0 && bajoPies(lvl, this, "M")) {
      // Sin "jumping" la gravidad es la normal: la altura no depende de mantener salto
      this.vy = -PHYS.springV;
      this.onGround = false;
      this.jumping = false;
      this.rebotando = true;
      game.sfx("salto");
      emitir(this.x + this.w / 2, this.y + this.h, 6, [PAL.y, PAL.w], { up: 80, spread: 60, life: 0.3, size: 2 });
    }
    // Pinchos: solo hacen daño al caer sobre ellos (tocarlos de lado no); el jugador rebota
    if (r.suelo && vyAntes >= 0 && bajoPies(lvl, this, "H")) {
      game.recibirDano(this);
      // El rebote de pinchos sube lo justo para salir del hoyo andando (unos 32 px)
      if (!this.dead) { this.vy = -PHYS.jumpV * 0.8; this.onGround = false; this.jumping = false; this.rebotando = true; }
    }
    // Aterrizaje fuerte: aplastamiento y polvo
    if (r.suelo && enAireAntes && vyAntes > 150) {
      this.aterrizajeT = 0.12;
      emitir(this.x + this.w / 2, this.y + this.h, 6, ["#e8e8f0", "#c8c8d8"], { up: 40, spread: 70, life: 0.35, size: 2 });
    }
    if (this.aterrizajeT > 0) this.aterrizajeT -= dt;
    if (r.suelo) this.jumping = false;

    // Caer fuera del nivel
    if (this.y > lvl.rows * TILE + 40) this.dead = true;

    this.calcularPose(dt);

    // Límite izquierdo del nivel
    if (this.x < 0) { this.x = 0; this.vx = 0; }
  }

  // Elige la pose visual según el estado (la dibuja dibujarJugador) y avanza las piernas al andar
  calcularPose(dt) {
    if (this.dead) this.pose = "muerto";
    else if (this.hurtT > 0) this.pose = "dano";
    else if (this.spinT > 0) this.pose = "giro";
    else if (this.duck) this.pose = "agachado";
    else if (!this.onGround) this.pose = this.vy < 0 ? "salto" : "caida";
    else if (this.frenadoT > 0) this.pose = "frenado";
    else if (Math.abs(this.vx) > 120 && held.run) this.pose = "correr";
    else if (Math.abs(this.vx) > 25) this.pose = "andar";
    else this.pose = "quieto";
    if (this.onGround && (this.pose === "andar" || this.pose === "correr")) this.zancada += Math.abs(this.vx) * dt;
  }
}

/* =====================================================================
   10. ENEMIGOS, JEFE, MONEDAS, OBJETOS Y PARTÍCULAS
   ===================================================================== */

/* Jefe del castillo: uno por mundo, con sus ataques (jefes.js). Esta clase lo une al nivel:
   lo mueve dentro de su arena, le quita una vida con cada pisotón y dice cuándo cae. */
class Boss {
  constructor(x, y, tipo) {
    // x: centro del jefe en la arena; los pies quedan sobre el suelo del nivel
    this.j = Jefes.create(tipo || "koopa", x + TILE, GY * TILE, { dir: -1 });
  }

  get alive() { return this.j.estado !== "muerto"; }
  get hp() { return this.j.hp; }
  // Nombre para el aviso de la pantalla, sin tildes (la fuente no las tiene)
  get nombre() { return Jefes.NOMBRES[this.j.tipo].normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase(); }
  caja() { return Jefes.caja(this.j); }

  // Pisotón: Jefes.golpear devuelve "herido", "muerto" o "ignorado" (si aún es invulnerable)
  pisado(player, game) {
    const r = Jefes.golpear(this.j);
    if (r === "herido") game.sfx("pisar");
    if (r === "muerto") {
      game.puntos(1000);
      game.efectoEnemigo(this.j.x, this.j.y - this.j.h / 2);
      game.sfx("meta");
    }
    return r;
  }

  update(dt, lvl, game, player) {
    // La arena es el suelo llano del castillo: el jefe no sale por la izquierda, donde hay huecos
    const mundo = {
      solid: (x, y) => x < lvl.arenaX0 || lvl.solidoEn(x, y),
      tile: TILE,
      ancho: lvl.cols * TILE,
      jugador: { x: player.x + player.w / 2, y: player.y + player.h / 2 },
    };
    Jefes.update(this.j, dt, mundo);
  }
}

/* Moneda: se recoge al tocarla. Gira con 3 fotogramas. */
class Coin {
  constructor(x, y, suelta = false) {
    this.x = x; this.y = y; this.w = 8; this.h = 10;
    this.alive = true;
    this.anim = Math.random() * 3;
    this.suelta = suelta;   // salió de un bloque (sube y desaparece)
    this.vy = suelta ? -150 : 0;
    this.vidaT = suelta ? 0.5 : Infinity;
  }
  update(dt) {
    this.anim += dt * 8;
    if (this.suelta) {
      this.y += this.vy * dt;
      this.vy += 600 * dt;
      this.vidaT -= dt;
      if (this.vidaT <= 0) this.alive = false;
    }
  }
}

/* Objeto de bloque ?: hongo, flor, pluma o estrella. Sale del bloque y avanza. */
class PowerUp {
  constructor(tipo, x, y) {
    this.tipo = tipo;
    this.x = x; this.y = y;
    this.w = 14; this.h = 14;
    this.vx = tipo === "flor" ? 0 : 50;
    this.vy = 0;
    this.alive = true;
    this.saliendoT = 0.4;  // sube un poco antes de empezar a moverse
    this.yDestino = y - 16;
  }
  update(dt, lvl) {
    if (this.saliendoT > 0) {
      this.saliendoT -= dt;
      this.y -= 40 * dt;
      return;
    }
    if (this.tipo === "flor") return;
    this.vy += GRAVITY * dt;
    if (this.vy > MAX_FALL) this.vy = MAX_FALL;
    const r = moverEntidad(lvl, this, dt);
    if (r.pared) this.vx = -this.vx;
    if (this.y > lvl.rows * TILE) this.alive = false;
  }
}

/* Partículas pixeladas: cuadrados que caen y se desvanecen */
const particulas = [];
function emitir(x, y, n, colores, opts = {}) {
  for (let i = 0; i < n; i++) {
    particulas.push({
      x, y,
      vx: rnd(-(opts.spread || 80), opts.spread || 80),
      vy: rnd(-(opts.up || 140), -(opts.up || 40)),
      g: opts.g === undefined ? 500 : opts.g,
      vida: rnd(0.3, opts.life || 0.6),
      max: opts.life || 0.6,
      color: colores[rndi(0, colores.length - 1)],
      size: opts.size || 2,
    });
  }
}
function actualizarParticulas(dt) {
  for (let i = particulas.length - 1; i >= 0; i--) {
    const p = particulas[i];
    p.vy += p.g * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vida -= dt;
    if (p.vida <= 0) particulas.splice(i, 1);
  }
}
function dibujarParticulas(cam) {
  for (const p of particulas) {
    rect(p.x - cam.x, p.y - cam.y, p.size, p.size, p.color);
  }
}

/* =====================================================================
   7d. PLATAFORMAS MÓVILES Y QUE CAEN
   Son de una dirección: se pisan desde arriba. Una móvil va y viene entre x0 y x1.
   Una que cae tiembla un momento al pisarla, se hunde y reaparece unos segundos después.
   ===================================================================== */
class Plataforma {
  constructor(d) {
    this.t = d.t;                   // "movil" | "caida"
    this.x = d.x; this.y = d.y;
    this.w = d.w; this.h = d.h;
    this.x0 = d.x0; this.x1 = d.x1;
    this.eje = d.eje || "x";        // "y": ascensor que sube y baja entre y0 (arriba) e y1 (abajo)
    this.y0 = d.y0; this.y1 = d.y1;
    this.vel = d.vel || 36;
    this.dir = 1;
    this.homeX = d.x; this.homeY = d.y;
    this.dx = 0; this.dy = 0;       // desplazamiento de este frame (lo lleva consigo al jugador)
    this.vy = 0;
    this.pisada = false;            // la pisó el jugador en el frame anterior
    this.temblor = 0;               // tiempo que tiembla antes de caer
    this.caida = false;             // ya cae
    this.vivo = true;
    this.respawn = 0;
    this.grupo = d.grupo || null;   // tramos de un mismo puente: al pisar uno caen todos en cascada
    this.indice = d.indice || 0;    // posición del tramo dentro del puente
    this.tCaida = d.tCaida || 0.45; // segundos que tiembla antes de caer
    this.retraso = 0;               // espera extra de un tramo lejano del pisado
    this.madera = !!d.madera;       // se dibuja con tablones de madera
  }

  update(dt, lvl) {
    const x0 = this.x, y0 = this.y;
    if (this.t === "movil" && this.eje === "y") {
      this.y -= this.dir * this.vel * dt;
      if (this.y <= this.y0) { this.y = this.y0; this.dir = -1; }
      if (this.y >= this.y1) { this.y = this.y1; this.dir = 1; }
    } else if (this.t === "movil") {
      this.x += this.dir * this.vel * dt;
      if (this.x >= this.x1) { this.x = this.x1; this.dir = -1; }
      if (this.x <= this.x0) { this.x = this.x0; this.dir = 1; }
    } else if (this.vivo) {
      if (this.pisada && this.temblor <= 0 && !this.caida) this.temblor = this.tCaida + this.retraso;
      if (this.temblor > 0) {
        this.temblor -= dt;
        if (this.temblor <= 0) this.caida = true;
      } else if (this.caida) {
        this.vy += GRAVITY * dt;
        this.y += this.vy * dt;
        if (this.y > lvl.rows * TILE + 40) { this.vivo = false; this.respawn = 2.5; }
      }
    } else {
      this.respawn -= dt;
      if (this.respawn <= 0) {
        this.vivo = true; this.caida = false; this.temblor = 0; this.vy = 0;
        this.x = this.homeX; this.y = this.homeY;
      }
    }
    this.dx = this.x - x0;
    this.dy = this.y - y0;
    this.pisada = false;
  }

  // Si el jugador cae desde arriba sobre la franja superior, queda de pie sobre la plataforma
  pisa(p, basePrev) {
    if (!this.vivo || p.vy < 0) return false;
    if (p.x + p.w <= this.x + 2 || p.x >= this.x + this.w - 2) return false;
    const base = p.y + p.h;
    if (basePrev > this.y + 0.5 || base < this.y) return false;
    p.y = this.y - p.h;
    p.vy = 0;
    p.onGround = true;
    return true;
  }
}

// Muelle (tile "M"): base oscura, resorte de espiral y plato rojo arriba
let muelleCache = null;
function muelleSprite() {
  if (!muelleCache) {
    const filas = [
      "", "", "",
      "  rrrrrrrrrrrr  ",
      " rwwrrrrrrrrrrr ",
      " rwrrrrrrrrrrrr ",
      "  rrrrrrrrrrrr  ",
      "      gggg      ", "      ssss      ", "      gggg      ", "      ssss      ", "      gggg      ", "      ssss      ", "      gggg      ",
      "  dddddddddddd  ",
      " dddddddddddddd ",
    ];
    const rows = filas.map((f) => f.padEnd(16, " ").replace(/ /g, "."));
    muelleCache = spriteFromRows(expandir(rows), { r: "#e52521", w: "#ffb3a8", g: "#c8c8d8", s: "#8a8aa0", d: "#5a5a6e" });
  }
  return muelleCache;
}

/* Mezcla un color hex con negro o blanco en proporción t (sombreado) */
function mezclar(hex, t, hacia = "#000000") {
  const a = parseInt(hex.slice(1), 16), b = parseInt(hacia.slice(1), 16);
  const out = [16, 8, 0].map((s) => {
    const x = (a >> s) & 255, y = (b >> s) & 255;
    return Math.round(x + (y - x) * t);
  });
  return "#" + out.map((v) => v.toString(16).padStart(2, "0")).join("");
}

/* =====================================================================
   13. ESCENARIO CON VOLUMEN (estilo consola de 16 bits, colores vivos)
   Todo se genera como matrices y pasa por spriteFromRows: el contorno
   y el bisel salen solos. Las texturas se cachean y se repiten en X
   con desplazamiento de parallax.
   ===================================================================== */
const mod = (a, n) => ((a % n) + n) % n;
const texturas = new Map();
function textura(key, fabricar) {
  if (!texturas.has(key)) texturas.set(key, fabricar());
  return texturas.get(key);
}

// Matriz de un círculo relleno (para soles, arbustos, etc.)
function circuloRows(r, ch) {
  const rows = [];
  for (let y = -r; y <= r; y++) {
    let f = "";
    for (let x = -r; x <= r; x++) f += x * x + y * y <= r * r ? ch : ".";
    rows.push(f);
  }
  return rows;
}

// Colina periódica: fnAlt(x) da la altura de la cima en cada columna
function texColinas(key, ancho, color, fnAlt, contorno = false) {
  return textura(key, () => {
    const alto = H_MIN; // las capas son de diseño: no dependen del tamaño de pantalla
    const rows = [];
    for (let y = 0; y < alto; y++) rows.push("");
    for (let x = 0; x < ancho; x++) {
      const top = Math.round(fnAlt(x));
      for (let y = 0; y < alto; y++) rows[y] += y >= top ? "c" : ".";
    }
    const sp = spriteFromRows(expandir(rows), { c: color }, contorno, true);
    sp.tw = ancho;
    return sp;
  });
}

// Pinta una capa periódica con parallax (factor = fracción de la cámara)
function capaPeriodica(sp, camX, factor, y) {
  const off = mod(Math.floor(camX * factor), sp.tw);
  for (let x = -off; x < W; x += sp.tw) drawSprite(sp, x, y);
}

// Sol con borde de luz y contorno
function dibujarSol(pal, x, y) {
  const color = pal.sol || "#ffe36b";
  const sp = textura("sol-" + color, () => spriteFromRows(expandir(circuloRows(11, "c")), { c: color }));
  drawSprite(sp, x, y);
}

// Pirámide con bloques de piedra: cara iluminada a la izquierda, sombra a la derecha
function texPiramide(alto, base, pal) {
  return textura("piramide-" + alto + "-" + base, () => {
    const rows = [];
    const cx = base / 2;
    for (let y = 0; y < alto; y++) {
      const mitad = ((y + 1) / alto) * cx;
      let f = "";
      for (let x = 0; x < base; x++) {
        const dx = x + 0.5 - cx;
        if (Math.abs(dx) > mitad) { f += "."; continue; }
        const hilada = y % 7 === 6;
        f += hilada ? "m" : dx < 0 ? "l" : "d";
      }
      rows.push(f);
    }
    return spriteFromRows(expandir(rows), { l: pal.piedraClara, d: pal.piedraOscura, m: pal.piedraJunta }, true);
  });
}

// Escenario de desierto: pirámides, dunas y sol fuerte
function escenaDesierto(cam, pal) {
  const pir = texPiramide(74, 96, pal);
  const off = mod(cam.x * 0.3, 360);
  for (let k = -1; k < 4; k++) drawSprite(pir, k * 170 - off, 176 - 74);
  const dunas = texColinas("dunas-" + pal.cerca, 512, pal.cerca,
    (x) => 130 + Math.sin((x / 512) * Math.PI * 4) * 16 + Math.sin((x / 512) * Math.PI * 9) * 5, true);
  capaPeriodica(dunas, cam.x, 0.45, 0);
}

// Suelo de bloques.js bajo el área de diseño (solo si la pantalla es más alta)
function pintarExtension(pal, tema) {
  const ch = TERRENO_DE_TEMA[tema] || "#";
  for (let y = OY + H_MIN; y < H; y += TILE) {
    const sp = Bloques.sprite(ch + "|" + (y === OY + H_MIN ? "1000" : "0000"));
    for (let x = 0; x < W; x += TILE) drawSprite(sp, x, y);
  }
}

// Escala del fondo de bloques.js: su horizonte (144 unidades) cae sobre el suelo del nivel
const ESC_FONDO = (GY * TILE) / 144;

// Fondo del escenario. El cielo, el sol o la luna, las nubes y las montañas vienen de bloques.js
// y cambian con la hora (0 amanecer, 0.25 día, 0.5 atardecer, 0.75 noche); la cueva usa roca.
// lv (opcional): el nivel, de donde salen su clima, su cascada y si hay hojas y luciérnagas
function dibujarFondo(cam, pal, tema, hora, lv) {
  const clima = lv ? lv.clima : null, t = performance.now() / 1000;
  if (tema === "castillo") {
    escenaCastillo(cam, pal);
    if (clima) Bloques.clima(ctx, W, H, t, clima);   // niebla del foso: entre el castillo y las piezas
    return;
  }
  // El cielo llega hasta arriba de la pantalla, también en las pantallas altas (OY > 0)
  ctx.save();
  ctx.translate(0, OY);
  ctx.scale(ESC_FONDO, ESC_FONDO);
  Bloques.fondo(ctx, cam.x, 0, W / ESC_FONDO, (H - OY) / ESC_FONDO, t,
    { hora: hora, ambiente: tema === "cueva" ? "cueva" : "cielo", clima: clima, cascada: !!(lv && lv.cascada),
      colinas: tema !== "desierto", arriba: OY / ESC_FONDO });
  // Hojas que caen y luciérnagas: solo en el bosque y sin clima (como en la demo de bloques.js)
  if (lv && lv.particulas && !clima) Bloques.particulas(ctx, W / ESC_FONDO, (H - OY) / ESC_FONDO, t, cam.x, hora);
  ctx.restore();
  // En el desierto, las dunas y las pirámides van encima del cielo
  if (tema === "desierto") {
    ctx.save();
    ctx.translate(0, OY);
    escenaDesierto(cam, pal);
    ctx.restore();
  }
  if (H > OY + H_MIN) pintarExtension(pal, tema);
}

/* =====================================================================
   13b. TILES CON BISELADO (cacheados por tema y por "tiene hierba")
   ===================================================================== */
// Castillo del mapa: dos hileras de almenas, cuerpo liso y puerta oscura
function castilloRows() {
  const rows = [];
  for (let y = 0; y < 16; y++) {
    let f = "";
    for (let x = 0; x < 16; x++) {
      const dentro = x > 0 && x < 15;
      if (y < 3 && (!dentro || x % 4 >= 2)) f += ".";           // huecos entre almenas
      else if (!dentro) f += ".";
      else if (y >= 10 && x >= 6 && x <= 9) f += "d";            // puerta
      else f += "c";
    }
    rows.push(f);
  }
  return rows;
}

/* =====================================================================
   13c. ESCENARIO DE CASTILLO: atardecer, torres lejanas, muro de piedra y antorchas
   ===================================================================== */
// Torres recortadas contra el cielo (periódicas, apoyadas en el suelo de diseño)
function texTorres() {
  return textura("torres", () => {
    const ancho = 512, base = 176;
    const torres = [[30, 46, 120], [150, 34, 96], [262, 52, 136], [390, 40, 104]]; // [x, ancho, alto]
    const rows = [];
    for (let y = 0; y < H_MIN; y++) {
      let f = "";
      for (let x = 0; x < ancho; x++) {
        let ch = ".";
        for (const [tx, tw, th] of torres) {
          if (x < tx || x >= tx + tw || y < base - th || y >= base) continue;
          const merlon = y < base - th + 8 && (x - tx) % 8 >= 5;   // almenas en lo alto
          if (merlon) continue;
          const ventana = x >= tx + tw / 2 - 2 && x <= tx + tw / 2 + 1 && y >= base - th + 16 && y <= base - th + 26;
          ch = ventana ? "w" : "c";
        }
        f += ch;
      }
      rows.push(f);
    }
    const sp = spriteFromRows(expandir(rows), { c: "#3a2b52", w: "#ffd23f" }, false, true, false);
    sp.tw = ancho;
    return sp;
  });
}

// Muro de piedra con hiladas de ladrillos desfasadas (periódico)
function texMuro() {
  return textura("muro", () => {
    const ancho = 512, alto = 80;   // solo el muro de la base: de y=96 al suelo
    const rows = [];
    for (let y = 0; y < alto; y++) {
      const hilada = Math.floor(y / 8), yy = y % 8, desfase = (hilada % 2) * 8;
      let f = "";
      for (let x = 0; x < ancho; x++) {
        const bx = (x + desfase) % 16;
        f += yy === 0 || bx === 0 ? "d" : yy === 1 || bx === 1 ? "l" : "m";   // juntas, bisel de luz, piedra
      }
      rows.push(f);
    }
    const sp = spriteFromRows(expandir(rows), { m: "#4b4a5c", l: "#62617a", d: "#2c2b3b" }, false, true, false);
    sp.tw = ancho;
    return sp;
  });
}

// Antorcha con llama de tres frames (parpadeo)
const FILAS_ANTORCHA = [
  ["..r..", ".oyo.", "oyyyo", "oyyyo", ".oyo.", "..o..", "..k..", ".kkk."],
  [".r...", ".ory.", ".oyo.", "oyyyo", ".yyy.", ".oyo.", "..k..", ".kkk."],
  ["...r.", "..ryo", ".oyo.", "oyyyo", "oyyy.", "..o..", "..k..", ".kkk."],
];
function antorchaSprite(f) {
  return textura("antorcha" + f, () => spriteFromRows(expandir(FILAS_ANTORCHA[f]), { k: "#2a2a30", o: "#ff8a1e", y: "#ffe066", r: "#e0392b" }, true, false, false));
}

function escenaCastillo(cam, pal) {
  // Atardecer: de índigo arriba a malva y naranja cerca del horizonte
  const horizonte = OY + 176;
  const cielo = ctx.createLinearGradient(0, 0, 0, horizonte);
  cielo.addColorStop(0, "#2a1f4f");
  cielo.addColorStop(0.5, "#7a4a86");
  cielo.addColorStop(1, "#ff9a5a");
  ctx.fillStyle = cielo;
  ctx.fillRect(0, 0, W, H);
  dibujarSol(pal, W - 70, 56 + OY * 0.2);
  ctx.save();
  ctx.translate(0, OY);
  capaPeriodica(texTorres(), cam.x, 0.2, 0);
  capaPeriodica(texMuro(), cam.x, 0.5, 96);
  // Sombra del muro: más oscura bajo las almenas y junto al suelo
  const sombra = ctx.createLinearGradient(0, 96, 0, 176);
  sombra.addColorStop(0, "rgba(20,10,30,0.35)");
  sombra.addColorStop(0.35, "rgba(20,10,30,0.05)");
  sombra.addColorStop(1, "rgba(20,10,30,0.4)");
  ctx.fillStyle = sombra;
  ctx.fillRect(0, 96, W, 80);
  // Estandartes morados con emblema dorado, colgados del muro entre las antorchas
  const off = mod(cam.x * 0.5, 96);
  for (let k = -1; k < 6; k++) {
    const bx = k * 96 + 92 - off;
    ctx.fillStyle = "#3d1a57";
    ctx.fillRect(bx - 9, 106, 18, 42);
    ctx.fillStyle = "#6a2c91";
    ctx.fillRect(bx - 8, 107, 16, 40);
    ctx.beginPath(); ctx.moveTo(bx - 8, 147); ctx.lineTo(bx, 141); ctx.lineTo(bx + 8, 147); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#f2c14e";
    ctx.beginPath(); ctx.moveTo(bx, 116); ctx.lineTo(bx + 3, 122); ctx.lineTo(bx, 128); ctx.lineTo(bx - 3, 122); ctx.closePath(); ctx.fill();
  }
  // Antorchas sobre el muro, con parpadeo y un halo de luz cálida alrededor
  const fr = Math.floor(performance.now() / 110) % 3;
  for (let k = -1; k < 6; k++) {
    const tx = k * 96 + 44 - off;
    const brillo = 0.45 + 0.1 * Math.sin(performance.now() / 150 + k);
    const halo = ctx.createRadialGradient(tx + 4, 88, 2, tx + 4, 88, 42);
    halo.addColorStop(0, "rgba(255,170,80," + brillo.toFixed(3) + ")");
    halo.addColorStop(1, "rgba(255,170,80,0)");
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(tx + 4, 88, 42, 0, Math.PI * 2); ctx.fill();
    drawSprite(antorchaSprite(fr), tx, 84);
  }
  ctx.restore();
  pintarExtension(pal, "castillo");
}

/* =====================================================================
   11. SONIDO SENCILLO (ondas cuadradas con Web Audio, sin archivos)
   ===================================================================== */
const SFX = {
  salto: [440, 660, 0.08], giro: [520, 300, 0.12], pisar: [320, 640, 0.07],
  patear: [200, 120, 0.1], moneda: [880, 1320, 0.06], hongo: [400, 800, 0.2],
  rompe: [150, 60, 0.12], golpe: [200, 80, 0.25], vida: [500, 1000, 0.3],
  meta: [600, 900, 0.5], muerte: [400, 60, 0.7], estrella: [700, 1400, 0.4],
  control: [660, 990, 0.25], grande: [990, 1980, 0.35],
};
let audioCtx = null;
function tocar(nombre) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const [f0, f1, dur] = SFX[nombre] || SFX.salto;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(f0, audioCtx.currentTime);
    o.frequency.linearRampToValueAtTime(f1, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(0.04, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* sin audio: el juego sigue */ }
}
// Desbloquea el audio con la primera tecla (requisito de los navegadores)
addEventListener("keydown", () => { if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); }, { once: false });

/* =====================================================================
   11b. MÚSICA DE FONDO
   Tema propio generado con ondas, sin archivos. Sol mayor, 8 compases
   en bucle a 150 BPM: melodía en cuadrada, bajo en triángulo y
   percusión con ruido (bombo y charles). Se programa unas décimas por
   delante del reloj de audio para que no cruja.
   ===================================================================== */
const MUSICA_BPM = 150;
const MUSICA_LOOP = 64;     // corcheas por vuelta: 8 compases de 8
const MUSICA_ADELANTO = 0.15;
// Melodía: "nota:corcheas". Nota = letra, # opcional y octava (C4 = do central)
const MELODIA = [
  "G5:2", "E5:1", "G5:1", "A5:2", "G5:1", "E5:1",
  "E5:2", "C5:1", "E5:1", "G5:2", "E5:1", "C5:1",
  "F#5:1", "A5:1", "D6:2", "C6:1", "A5:1", "F#5:2",
  "G5:1", "B5:1", "D6:2", "B5:1", "G5:1", "A5:2",
  "E5:2", "G5:1", "B5:1", "E6:2", "D6:1", "B5:1",
  "C6:2", "A5:1", "G5:1", "E5:2", "G5:2",
  "F#5:1", "E5:1", "D5:1", "F#5:1", "A5:2", "F#5:2",
  "G5:4", "D5:2", "G5:2"
];
// Raíz del bajo en cada compás (una raíz por compás, octava 2 o 3)
const BAJO_COMPASES = ["G2", "C3", "D3", "G2", "E3", "C3", "D3", "G2"];
const NOTAS_BASE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

function frecuencia(nombre) {   // "F#5" -> Hz (A4 = 440)
  const m = /^([A-G])(#?)(\d)$/.exec(nombre);
  const midi = (+m[3] + 1) * 12 + NOTAS_BASE[m[1]] + (m[2] ? 1 : 0);
  return 440 * Math.pow(2, (midi - 69) / 12);
}
// Pasos (corchea a corchea) de la melodía y del bajo, para consultarlos al programar
const pasosMelodia = new Map();   // paso -> { f, d }
const pasosBajo = new Map();      // paso -> frecuencia
(function prepararMusica() {
  let p = 0;
  for (const tok of MELODIA) {
    const [n, d] = tok.split(":");
    pasosMelodia.set(p, { f: frecuencia(n), d: +d });
    p += +d;
  }
  BAJO_COMPASES.forEach((raiz, c) => {
    const base = frecuencia(raiz);
    [1, 1, 2, 1, 1, 2, 1, 1].forEach((mult, k) => pasosBajo.set(c * 8 + k, base * mult));
  });
})();

let musicaGain = null;       // la música usa el mismo audioCtx que los efectos
let bufRuido = null;
let musicaNotas = 0;         // notas programadas (para comprobar que suena)
let gestoAudio = false;      // el navegador exige un gesto del usuario antes de sonar
function marcarGesto() {
  gestoAudio = true;
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
}
addEventListener("pointerdown", marcarGesto);
addEventListener("keydown", marcarGesto);

function asegurarAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    if (!musicaGain) {
      musicaGain = audioCtx.createGain();
      musicaGain.gain.value = 0.5;
      musicaGain.connect(audioCtx.destination);
    }
    return true;
  } catch (e) { return false; }
}
function ruidoBuffer() {
  if (!bufRuido) {
    bufRuido = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.06), audioCtx.sampleRate);
    const d = bufRuido.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return bufRuido;
}
function nota(freq, t, dur, tipo, vol) {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = tipo;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.setValueAtTime(vol, t + dur * 0.75);
  g.gain.linearRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(musicaGain);
  o.start(t); o.stop(t + dur + 0.02);
  musicaNotas++;
}
function bombo(t) {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  g.gain.setValueAtTime(0.9, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  o.connect(g); g.connect(musicaGain);
  o.start(t); o.stop(t + 0.16);
  musicaNotas++;
}
function charles(t) {
  const src = audioCtx.createBufferSource();
  src.buffer = ruidoBuffer();
  const filtro = audioCtx.createBiquadFilter();
  filtro.type = "highpass";
  filtro.frequency.value = 7000;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  src.connect(filtro); filtro.connect(g); g.connect(musicaGain);
  src.start(t); src.stop(t + 0.05);
  musicaNotas++;
}
function programarPaso(p, t, dur) {
  const m = pasosMelodia.get(p);
  if (m) nota(m.f, t, m.d * dur * 0.92, "square", 0.035);
  const b = pasosBajo.get(p);
  if (b) nota(b, t, dur * 0.9, "triangle", 0.2);
  if (p % 8 === 0 || p % 8 === 4) bombo(t);
  if (p % 2 === 1) charles(t);
}

const musica = { activa: false, paso: 0, siguiente: 0, timer: null };
function planificar() {
  const dur = 60 / MUSICA_BPM / 2;
  // Si la pestaña estuvo oculta, el reloj de audio ya pasó: no se programa en el pasado
  if (musica.siguiente < audioCtx.currentTime) musica.siguiente = audioCtx.currentTime + 0.05;
  while (musica.siguiente < audioCtx.currentTime + MUSICA_ADELANTO) {
    programarPaso(musica.paso, musica.siguiente, dur);
    musica.siguiente += dur;
    musica.paso = (musica.paso + 1) % MUSICA_LOOP;
  }
}
function musicaArrancar() {
  if (musica.activa || !ajustes.musica || !gestoAudio) return;
  if (!asegurarAudio()) return;
  musica.activa = true;
  musica.paso = 0;
  musica.siguiente = audioCtx.currentTime + 0.05;
  planificar();
  musica.timer = setInterval(planificar, 25);
}
function musicaParar() {
  if (!musica.activa) return;
  musica.activa = false;
  clearInterval(musica.timer);
}
// Suena en el título, el mapa y el nivel; se calla en pausa, al final y si se apaga en ajustes
function musicaSegunEstado() {
  const callada = !ajustes.musica || game.estado === "pausa" || game.estado === "final";
  if (callada) musicaParar(); else musicaArrancar();
}

/* =====================================================================
   12. CÁMARA CON SUAVIZADO Y LÍMITES
   ===================================================================== */
class Camera {
  constructor() { this.x = 0; this.y = 0; }
  seguir(objetivo, lvl, dt) {
    const destino = objetivo.x + objetivo.w / 2 - W / 2;
    // Suavizado exponencial: se acerca rápido pero sin tirones
    this.x += (destino - this.x) * Math.min(1, dt * 7);
    this.x = clamp(this.x, 0, lvl.cols * TILE - W);
    this.y = clamp(this.y, 0, Math.max(0, lvl.rows * TILE - H));
  }
  // Fijar cámara de golpe (al empezar el nivel)
  centrar(objetivo, lvl) {
    this.x = clamp(objetivo.x + objetivo.w / 2 - W / 2, 0, lvl.cols * TILE - W);
    this.y = 0;
  }
}

/* =====================================================================
   14. NIVEL EN EJECUCIÓN
   Crea entidades a partir de los datos, actualiza y dibuja.
   ===================================================================== */
// Tipos del juego -> tipos de enemigos.js (ver TIPOS allí)
const TIPO_ENEMIGO = {
  walker: "erizo", shell: "caracol", flyer: "abeja", plant: "planta",
  hormiga: "hormiga", esqueleto: "esqueleto",
  erizo_zombie: "erizo_zombie", caracol_zombie: "caracol_zombie", planta_zombie: "planta_zombie",
  // Enemigos de mundo: el nombre del juego es el mismo que el de enemigos.js
  pinguino: "pinguino", cangrejo: "cangrejo", pez: "pez", medusa: "medusa", escorpion: "escorpion",
  seta: "seta", jabali: "jabali", murcielago: "murcielago", arana: "arana", fantasma: "fantasma",
};

// Crea el enemigo de enemigos.js sobre la entidad (e.x, e.y = esquina superior izquierda)
function crearEnemigo(e) {
  const tipo = TIPO_ENEMIGO[e.t] || "erizo";
  // La planta sale de la tubería: su maceta queda dentro del tubo (centro de los dos bloques)
  if (tipo === "planta" || tipo === "planta_zombie") return Enemigos.create(tipo, e.x + TILE - 1, e.y + 8);
  return Enemigos.create(tipo, e.x + TILE / 2, e.y + TILE / 2);
}

// Bola de fuego de la flor de fuego: tamaño, velocidad, rebote en el suelo, duración y máximo en pantalla
const BOLA = { w: 6, h: 6, vx: 190, rebote: -150, vida: 2.2, max: 2 };

// Contorno de una estrella de cinco puntas (radio exterior r1, interior r2)
function rutaEstrella(cx, cy, r1, r2) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? r2 : r1, a = -Math.PI / 2 + (i * Math.PI) / 5;
    ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
  }
  ctx.closePath();
}

/* Moneda estrella: moneda grande con una estrella, que gira. (x, y): esquina del tile.
   fantasma: ya estaba guardada de otra partida (se ve azulada y translúcida) */
function dibujarGrande(x, y, t, fantasma) {
  const ancho = Math.max(0.2, Math.abs(Math.cos(t * 2.4)));
  ctx.save();
  ctx.globalAlpha = fantasma ? 0.5 : 1;
  ctx.translate(x + 8, y + 8);
  ctx.scale(ancho, 1);
  ctx.fillStyle = fantasma ? "#3a5a8a" : "#7a4a00";
  ctx.beginPath(); ctx.arc(0, 0, 7.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = fantasma ? "#7ab0e8" : "#f2a000";
  ctx.beginPath(); ctx.arc(0, 0, 6.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = fantasma ? "#cfe6ff" : "#ffd23f";
  ctx.beginPath(); ctx.arc(-0.5, -0.5, 5.4, 0, Math.PI * 2); ctx.fill();
  if (ancho > 0.45) {
    ctx.fillStyle = fantasma ? "#ffffff" : "#fff6c8";
    rutaEstrella(0, 0.3, 4, 1.7); ctx.fill();
    ctx.strokeStyle = fantasma ? "#3a5a8a" : "#c07000"; ctx.lineWidth = 0.6; ctx.stroke();
  }
  ctx.restore();
}

// Icono pequeño de moneda estrella para el marcador y el mapa: "si" (cogida), "antes" (guardada) o "no"
function iconoGrande(x, y, estado) {
  ctx.fillStyle = estado === "no" ? PAL.dgr : "#7a4a00";
  ctx.beginPath(); ctx.arc(x + 4, y + 4, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = estado === "si" ? PAL.y : estado === "antes" ? "#b88a30" : "#24273a";
  ctx.beginPath(); ctx.arc(x + 4, y + 4, 3, 0, Math.PI * 2); ctx.fill();
  if (estado !== "no") { ctx.fillStyle = estado === "si" ? PAL.w : "#e0c890"; rutaEstrella(x + 4, y + 4.2, 2.2, 0.9); ctx.fill(); }
}

// Banderín del punto de control: gris y abajo hasta que se pasa; morado (el color de BRO) y arriba después
function dibujarControl(x, pie, activo, t) {
  rect(x + 5, pie - 2, 6, 2, PAL.dgr);
  rect(x + 7, pie - 30, 2, 28, PAL.w);
  rect(x + 8, pie - 30, 1, 28, PAL.gr);
  rect(x + 6, pie - 33, 4, 3, PAL.y);
  const y = activo ? pie - 29 : pie - 12, ola = Math.sin(t * 6) * 0.8;
  ctx.fillStyle = activo ? "#8e44d6" : PAL.gr;
  ctx.beginPath(); ctx.moveTo(x + 9, y); ctx.lineTo(x + 19, y + 3.5 + ola); ctx.lineTo(x + 9, y + 7); ctx.closePath(); ctx.fill();
  if (activo) { ctx.fillStyle = PAL.y; rutaEstrella(x + 12.5, y + 3.5 + ola / 2, 1.8, 0.8); ctx.fill(); }
}

class Level {
  constructor(def, mundo) {
    const data = construirNivel(def, mundo.tema);
    this.def = def;
    this.nombre = data.nombre;
    this.cols = data.cols;
    this.rows = data.rows;
    this.tiles = data.tiles;
    this.decor = data.decor;
    this.goalX = data.goalX;
    this.boss = data.boss;
    this.tiempo = data.tiempo;
    this.entradaSecreta = data.entradaSecreta || null;   // boca de la zona secreta: { col, row, sala }
    this.salidaSecreta = data.salidaSecreta || null;     // tubería por la que se vuelve de la zona secreta: { col, row }
    this.esSala = !!def.sala;                              // las salas secretas no tienen meta: se sale por su tubería
    this.tuberias = encontrarTuberias(this.tiles);
    this.hm = data.hm || null;   // colinas: altura del suelo por columna (px); Infinity en los huecos
    // Los niveles marcados como castillo usan piedra y atardecer en vez del tema del mundo
    this.castillo = !!def.castillo;
    this.pal = this.castillo ? PALETA_CASTILLO : mundo.paleta;
    this.temaKey = this.castillo ? "castillo" : mundo.tema;   // separa la caché de sprites por tema
    this.hora = def.hora !== undefined ? def.hora : mundo.hora;   // momento del día del fondo
    this.clima = def.clima || null;          // lluvia, nieve, niebla... (bloques.js)
    this.cascada = !!def.cascada;            // cascada en el fondo (el río del bosque)
    this.particulas = !!mundo.particulas;    // hojas y luciérnagas (el bosque)
    this.avisoT = 0;   // tiempo que se muestra el aviso "derrota al jefe"
    this.player = new Player(data.start.x, data.start.y);
    this.enemigos = [];   // { e: objeto de enemigos.js, llevado: true si el jugador lo lleva }
    this.plats = (data.plats || []).map((d) => new Plataforma(d));   // plataformas móviles y que caen
    this.mundo = { tile: TILE, jugador: null, solid: (x, y) => this.solidoEn(x, y) };   // lo que usan los enemigos
    this.terreno = TERRENO_DE_TEMA[this.temaKey] || "#";   // carácter de bloques.js para el suelo
    this.coins = [];
    this.items = [];
    this.qItems = new Map();   // "col,fila" -> objeto del bloque ? (o del bloque oculto)
    this.multi = new Map();    // "col,fila" -> monedas que quedan en un ladrillo multimoneda
    this.textos = [];          // textos que suben y se desvanecen ("1UP"): { x, y, t, s }
    this.grandes = [];         // monedas estrella: { x, y, w, h, idx, fantasma, cogida }
    this.control = data.control || null;   // punto de control: { x, pie } (columna del banderín y altura del suelo)
    this.controlActivo = false;
    this.bonusBandera = null;  // premio según la altura a la que se toca el poste: puntos o "1UP"
    this.metaInicio = 0;       // momento en que se tocó el poste: la bandera baja desde entonces
    this.bossRef = null;
    this.bolas = [];           // bolas de fuego del jugador (flor de fuego)
    // Cañones de pared: disparan a su altura; la bala para en el primer bloque sólido
    this.canones = (data.canones || []).map((c) => ({ col: c.col, row: c.row, dir: c.dir || 1, cada: c.cada || 2.4,
                                                       velocidad: c.velocidad || 90, t: c.inicio !== undefined ? c.inicio : 1.2 }));
    this.balas = [];
    this.jefeTipo = mundo.jefeTipo || "koopa";   // jefe de este mundo (jefes.js)
    this.arenaX0 = data.arenaX0 || 0;            // el jefe no sale por la izquierda de su arena
    this.introJefeT = data.boss ? 3 : 0;         // tiempo que se muestra el nombre del jefe
    for (const e of data.ents) this.spawn(e);
    this.cam = new Camera();
    this.cam.centrar(this.player, this);
    this.meta = false;         // true cuando el jugador toca el poste
    this.metaT = 0;
    this.tiempoRest = this.tiempo;
  }

  spawn(e) {
    if (e.t === "coin") this.coins.push(new Coin(e.x, e.y));
    else if (e.t === "qitem" && e.item === "multi") this.multi.set(Math.floor(e.x / TILE) + "," + Math.floor(e.y / TILE), MONEDAS_MULTI);
    else if (e.t === "qitem") this.qItems.set(Math.floor(e.x / TILE) + "," + Math.floor(e.y / TILE), e.item);
    else if (e.t === "boss") this.bossRef = new Boss(e.x, e.y, this.jefeTipo);
    else if (e.t === "grande") this.grandes.push({ x: e.x + 2, y: e.y + 1, w: 12, h: 14, idx: e.idx, fantasma: false, cogida: false });
    else this.enemigos.push({ e: crearEnemigo(e), llevado: false });
  }

  // Suelo para los enemigos: a los lados hay pared; por debajo, vacío (y caen)
  solidoEn(x, y) {
    const c = Math.floor(x / TILE), r = Math.floor(y / TILE);
    if (c < 0 || c >= this.cols) return true;
    if (this.hm && y >= superficieEn(this, x)) return true;   // colinas: bajo la superficie hay tierra
    if (r < 0 || r >= this.rows) return false;
    return !!SOLIDOS[this.tiles[r][c]];
  }

  // Golpe desde abajo a un tile (el jugador salta contra él)
  golpearBloque(c, r, player, game) {
    const t = tileAt(this, c, r);
    const k = c + "," + r;
    if (t === "Q" || t === "Z") {
      this.tiles[r][c] = "U";
      const item = this.qItems.get(k) || "moneda";
      this.qItems.delete(k);
      if (item === "moneda") {
        this.coins.push(new Coin(c * TILE + 4, r * TILE - 8, true));
        game.puntos(200);
        game.sumarMonedas(1, c * TILE, r * TILE);
      } else {
        this.items.push(new PowerUp(item, c * TILE + 2, r * TILE));
        game.sfx("hongo");
      }
      emitir(c * TILE + 8, r * TILE, 4, [PAL.y], { up: 60, life: 0.4 });
    } else if (t === "B" && this.multi.has(k)) {
      // Ladrillo multimoneda: da una moneda por golpe y, vacío, queda como bloque usado
      const quedan = this.multi.get(k) - 1;
      this.coins.push(new Coin(c * TILE + 4, r * TILE - 8, true));
      game.puntos(200);
      game.sumarMonedas(1, c * TILE, r * TILE);
      emitir(c * TILE + 8, r * TILE, 3, [PAL.y], { up: 60, life: 0.3 });
      if (quedan > 0) this.multi.set(k, quedan);
      else { this.multi.delete(k); this.tiles[r][c] = "U"; }
    } else if (t === "B") {
      if (player.big) {
        this.tiles[r][c] = ".";
        emitir(c * TILE + 8, r * TILE + 8, 10, [this.pal.O, PAL.w], { up: 120, spread: 110, life: 0.6, size: 2 });
        game.sfx("rompe");
      } else {
        emitir(c * TILE + 8, r * TILE, 3, [this.pal.O], { up: 40, life: 0.3 });
        game.sfx("golpe");
      }
    }
  }

  // Bloque oculto ("Z"): no se ve ni se toca, salvo con la cabeza al subir desde debajo de él.
  // Devuelve true si el jugador lo ha golpeado (y deja la cabeza justo debajo)
  golpearOculto(p, yAntes, game) {
    const r = Math.floor(p.y / TILE);
    if (yAntes < (r + 1) * TILE - 0.01) return false;   // ya estaba a su altura: lo atraviesa
    for (const c of [Math.floor((p.x + 2) / TILE), Math.floor((p.x + p.w - 2) / TILE)]) {
      if (tileAt(this, c, r) !== "Z") continue;
      p.y = (r + 1) * TILE;
      p.vy = 0;
      this.golpearBloque(c, r, p, game);
      game.sfx("golpe");
      return true;
    }
    return false;
  }

  // Texto que sube y se desvanece sobre el nivel (por ejemplo "1UP")
  textoFlotante(s, x, y) { this.textos.push({ s, x, y, t: 1.2 }); }
  actualizarTextos(dt) {
    for (const tx of this.textos) { tx.t -= dt; tx.y -= 24 * dt; }
    this.textos = this.textos.filter((tx) => tx.t > 0);
  }

  // Rompe ladrillos al pasar por encima con salto giratorio
  romperConGiro(player, game) {
    const c0 = Math.floor(player.x / TILE), c1 = Math.floor((player.x + player.w) / TILE);
    const r0 = Math.floor(player.y / TILE), r1 = Math.floor((player.y + player.h) / TILE);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      if (tileAt(this, c, r) === "B" && !this.multi.has(c + "," + r)) {
        this.tiles[r][c] = ".";
        emitir(c * TILE + 8, r * TILE + 8, 10, [this.pal.O, PAL.w], { up: 120, spread: 110, life: 0.6 });
        game.sfx("rompe");
      }
    }
  }

  actualizar(dt, game) {
    const p = this.player;
    // Temporizador del nivel
    if (!this.meta) {
      this.tiempoRest -= dt;
      if (this.tiempoRest <= 0) { this.tiempoRest = 0; p.dead = true; }
    }
    if (this.avisoT > 0) this.avisoT -= dt;
    if (this.introJefeT > 0) this.introJefeT -= dt;
    // Plataformas móviles y que caen: se mueven antes y llevan consigo al jugador que está de pie sobre ellas
    for (const pl of this.plats) pl.update(dt, this);
    if (p.plat) { p.x += p.plat.dx; p.y += p.plat.dy; }
    p.update(dt, this, game);
    let sobre = null;
    for (const pl of this.plats) if (pl.pisa(p, p.prevBottom)) { sobre = pl; break; }
    if (sobre) sobre.pisada = true;
    // Puentes: al pisar un tramo, los demás del mismo puente empiezan a temblar y caen en cascada
    if (sobre && sobre.grupo) {
      sobre.retraso = 0;
      for (const q of this.plats) if (q !== sobre && q.grupo === sobre.grupo && !q.caida) { q.pisada = true; q.retraso = 0.15 * Math.abs(q.indice - sobre.indice); }
    }
    p.plat = sobre;
    if (p.spinT > 0) this.romperConGiro(p, game);

    // Enemigos (enemigos.js) y jefe
    this.mundo.jugador = { x: p.x + p.w / 2, y: p.y + p.h / 2 };
    for (const w of this.enemigos) {
      if (w.llevado) continue;                     // el caparazón que lleva el jugador se mueve con él
      Enemigos.update(w.e, dt, this.mundo);
      if (w.e.y > this.rows * TILE + 60) w.e.remove = true;   // se cayó del nivel
    }
    this.enemigos = this.enemigos.filter((w) => !w.e.remove);
    if (this.bossRef) this.bossRef.update(dt, this, game, p);
    this.actualizarBolas(dt, game);
    for (const c of this.coins) c.update(dt);
    this.coins = this.coins.filter((c) => c.alive);
    this.actualizarTextos(dt);
    for (const it of this.items) it.update(dt, this);
    this.items = this.items.filter((it) => it.alive);

    this.actualizarCanones(dt, game);
    game.colisionesJugador(this);
    this.cam.seguir(p, this, dt);

    // Punto de control: se activa al pasar junto al banderín (también al salir de la zona secreta por delante)
    if (this.control && !this.controlActivo && p.x + p.w / 2 >= this.control.x + 8) {
      this.controlActivo = true;
      game.activarControl(this);
    }

    // Poste de meta: al llegar, termina el nivel; cuanto más alto se toca, más premio
    if (!this.meta && p.x + p.w >= this.goalX) {
      this.meta = true;
      this.metaInicio = performance.now();
      this.bonusBandera = game.premioBandera(this, p);
      game.sfx("meta");
    }
  }

  // Dibuja el nivel completo con la cámara actual
  dibujar(game) {
    const cam = this.cam;
    dibujarFondo(cam, this.pal, this.temaKey, this.hora, this);
    // El área de diseño se desplaza según la pantalla (OY); el HUD se dibuja aparte, arriba
    ctx.save();
    ctx.translate(0, OY);
    if (this.hm) this.dibujarColinas(cam);
    // Decoración de bloques.js (arbustos, flores, árboles, rocas): detrás de los bloques y de los personajes
    for (const d of this.decor) {
      const x = d.c * TILE - cam.x;
      if (x < -TILE || x > W) continue;
      drawSprite(Bloques.sprite(d.ch), x, d.r * TILE - cam.y);
    }
    // Tiles visibles
    const c0 = Math.max(0, Math.floor(cam.x / TILE));
    const c1 = Math.min(this.cols - 1, Math.floor((cam.x + W) / TILE) + 1);
    for (let r = 0; r < this.rows; r++) {
      for (let c = c0; c <= c1; c++) {
        const t = this.tiles[r][c];
        if (t === "." || t === "Z") continue;   // el bloque oculto no se ve
        const x = c * TILE - cam.x, y = r * TILE - cam.y;
        this.dibujarTile(t, x, y, c, r);
      }
    }
    // Pista de la zona secreta: una flecha amarilla que flota sobre la boca cuando el jugador está cerca
    {
      // En las salas, todas las tuberías son salidas; en los niveles, solo la boca secreta
      const marcas = this.esSala ? this.tuberias : this.entradaSecreta ? [this.entradaSecreta] : [];
      const pj = this.player;
      for (const e of marcas) {
        if (Math.abs(pj.x + pj.w / 2 - (e.col + 1) * TILE) >= 3 * TILE) continue;
        const fx = (e.col + 1) * TILE - cam.x, fy = e.row * TILE - cam.y - 10 + Math.round(Math.sin(performance.now() / 180) * 2);
        ctx.fillStyle = PAL.y;
        ctx.beginPath(); ctx.moveTo(fx - 4, fy - 4); ctx.lineTo(fx + 4, fy - 4); ctx.lineTo(fx, fy); ctx.closePath(); ctx.fill();
      }
    }
    // Plataformas móviles (tablones) y que caen (piedra): tres bloques de ancho
    for (const pl of this.plats) {
      if (!pl.vivo) continue;
      for (let k = 0; k < pl.w / TILE; k++) {
        drawSprite(Bloques.sprite(pl.t === "movil" || pl.madera ? "W|1000" : "X"), pl.x + k * TILE - cam.x, pl.y - cam.y);
      }
    }
    // Punto de control y monedas estrella
    const ahora = performance.now() / 1000;
    if (this.control) dibujarControl(this.control.x - cam.x, this.control.pie - cam.y, this.controlActivo, ahora);
    for (const g of this.grandes) dibujarGrande(g.x - 2 - cam.x, g.y - 1 - cam.y, ahora + g.idx, g.fantasma);
    // Monedas: arte de bloques.js (8 frames de giro), centradas en su hitbox
    for (const c of this.coins) {
      drawSprite(Bloques.sprite("o" + (Math.floor(c.anim) % 8)), c.x + c.w / 2 - 8 - cam.x, c.y + c.h / 2 - 8 - cam.y);
    }
    for (const it of this.items) {
      const sp = objetoSprite(it.tipo);
      drawSprite(sp, it.x + it.w / 2 - sp.lw / 2 - cam.x, it.y + it.h - sp.lh - cam.y);
    }
    // Enemigos dibujados por enemigos.js, en coordenadas del mundo
    ctx.save();
    ctx.translate(-cam.x, 0);
    for (const w of this.enemigos) Enemigos.draw(ctx, w.e);
    ctx.restore();
    if (this.bossRef) this.dibujarJefe(this.bossRef, cam);
    this.dibujarBolas(cam);
    this.dibujarCanones(cam);
    this.dibujarJugador(game, cam);
    dibujarParticulas(cam);
    for (const tx of this.textos) {
      ctx.globalAlpha = Math.min(1, tx.t * 2);
      txt(tx.s, Math.round(tx.x + 8 - cam.x), Math.round(tx.y - cam.y), PAL.g, "center");
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  // Terreno de colinas: una superficie continua (pendientes sin escalones) con tierra, hierba y la textura de los bloques
  dibujarColinas(cam) {
    const hm = this.hm, fondo = this.rows * TILE - cam.y;
    const tierra = this.pal.G || PAL.br, hierba = this.pal.g || PAL.g;
    const cIni = Math.max(0, Math.floor(cam.x / TILE) - 2), cFin = Math.min(this.cols - 1, Math.floor((cam.x + W) / TILE) + 2);
    const x = (k) => k * TILE - cam.x;
    // Tramos de suelo continuo: entre dos huecos la superficie es una sola línea
    for (let c = cIni; c <= cFin; ) {
      if (hm[c] === Infinity) { c++; continue; }
      let b = c;
      while (b + 1 < this.cols && hm[b + 1] !== Infinity && b + 1 <= cFin) b++;
      const linea = [];
      for (let k = c; k <= b; k++) linea.push([x(k), hm[k] - cam.y]);
      linea.push([x(b + 1), hm[b] - cam.y]);   // borde vertical al final del tramo
      // Tierra bajo la superficie
      ctx.beginPath();
      ctx.moveTo(x(c), fondo);
      for (const [px, py] of linea) ctx.lineTo(px, py);
      ctx.lineTo(x(b + 1), fondo);
      ctx.closePath();
      ctx.fillStyle = tierra; ctx.fill();
      // Textura de bloques (interior), recortada a la tierra
      ctx.save(); ctx.clip();
      for (let k = c; k <= b; k++) {
        for (let y = Math.floor((hm[k] - cam.y - TILE) / TILE) * TILE; y < fondo; y += TILE) {
          drawSprite(Bloques.sprite(this.terreno + "|0000"), Math.round(x(k)), Math.round(y));
        }
      }
      ctx.restore();
      // Banda de hierba de 5 px bajo la superficie
      ctx.beginPath();
      linea.forEach(([px, py], i) => { if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); });
      for (let i = linea.length - 1; i >= 0; i--) ctx.lineTo(linea[i][0], linea[i][1] + 5);
      ctx.closePath();
      ctx.fillStyle = hierba; ctx.fill();
      // Borde oscuro de la superficie
      ctx.beginPath();
      linea.forEach(([px, py], i) => { if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); });
      ctx.strokeStyle = PAL.k; ctx.lineWidth = 1; ctx.stroke();
      c = b + 1;
    }
  }

  // Tubería cuya boca pisa el jugador (o null): la boca es la fila de arriba de cada tubo
  tuberiaBajo(p) {
    if (!p.onGround) return null;
    const fila = Math.round((p.y + p.h) / TILE), mitad = Math.floor((p.x + p.w / 2) / TILE);
    return this.tuberias.find((t) => t.row === fila && (mitad === t.col || mitad === t.col + 1)) || null;
  }

  // Bloques con el arte de bloques.js. El borde de un terreno depende de los vecinos que dan al aire
  dibujarTile(t, x, y, c, r) {
    if (t === "T") {
      // Tubería: boca arriba (P/Q) y cuerpo debajo (p/q); la mitad derecha tiene tubo a la izquierda
      const cuerpo = tileAt(this, c, r - 1) === "T", derecha = tileAt(this, c - 1, r) === "T";
      drawSprite(Bloques.sprite(cuerpo ? (derecha ? "q" : "p") : (derecha ? "Q" : "P")), x, y);
    } else if (t === "F") {
      // Poste de meta: la bandera va en el bloque de arriba; el resto es poste. Al tocarlo, la bandera baja
      if (tileAt(this, c, r - 1) === "F") this.dibujarPoste(x, y);
      else {
        let bajada = 0;
        if (this.meta) {
          let fin = r; while (tileAt(this, c, fin + 1) === "F") fin++;
          bajada = Math.min(1, (performance.now() - this.metaInicio) / 900) * (fin - r) * TILE;
        }
        if (bajada > 0) { this.dibujarPoste(x, y); rect(x + 2, y - 1, 3, 3, PAL.y); }
        drawSprite(Bloques.sprite("E"), x, y + bajada);
      }
    } else if (t === "G") {
      drawSprite(Bloques.sprite(this.terreno + "|" + this.aireDe(c, r)), x, y);
    } else if (t === "S") {
      drawSprite(Bloques.sprite("X"), x, y);        // piedra suelta
    } else if (t === "H") {
      drawSprite(Bloques.sprite("^"), x, y);        // pinchos
    } else if (t === "V") {
      drawSprite(Bloques.sprite("~"), x, y);        // lava
    } else if (t === "L") {
      drawSprite(Bloques.sprite("L"), x, y);        // escalera
    } else if (t === "D") {
      drawSprite(Bloques.sprite("-"), x, y);        // plataforma de una dirección
    } else if (t === "M") {
      drawSprite(muelleSprite(), x, y);             // muelle
    } else {
      drawSprite(Bloques.sprite({ B: "=", Q: "?", U: "x" }[t]), x, y);   // ladrillo, interrogación, usado
    }
  }

  // Lados que dan al aire (arriba, izquierda, derecha, abajo): "1" = aire, "0" = bloque
  aireDe(c, r) {
    const aire = (cc, rr) => (SOLIDOS[tileAt(this, cc, rr)] ? "0" : "1");
    return aire(c, r - 1) + aire(c - 1, r) + aire(c + 1, r) + aire(c, r + 1);
  }

  // Poste de la meta: en las columnas 2 a 4 del tile, igual que el poste de la bandera de bloques.js
  dibujarPoste(x, y) {
    rect(x + 2, y, 2, 16, PAL.w);
    rect(x + 3, y, 1, 16, PAL.gr);
  }

  // Bolas de fuego (flor de fuego): avanzan, rebotan en el suelo y se apagan al chocar con un muro,
  // al tocar un enemigo o un jefe, o al cabo de un rato
  actualizarBolas(dt, game) {
    for (const b of this.bolas) {
      b.t += dt;
      if (b.t > BOLA.vida) { b.dead = true; continue; }
      if (this.solidoEn(b.x + Math.sign(b.vx) * (b.w / 2 + 1), b.y)) { b.dead = true; continue; }
      b.x += b.vx * dt;
      // Vertical: al tocar el suelo rebota; tras varios rebotes se apaga
      b.vy += GRAVITY * dt;
      const pie = b.y + b.h / 2 + b.vy * dt;
      if (b.vy > 0 && this.solidoEn(b.x, pie)) {
        b.y = Math.floor(pie / TILE) * TILE - b.h / 2;
        b.vy = BOLA.rebote;
        if (++b.rebotes > 4) { b.dead = true; continue; }
      } else {
        b.y += b.vy * dt;
      }
      if (b.y > this.rows * TILE + 40) { b.dead = true; continue; }
      const caja = { x: b.x - b.w / 2, y: b.y - b.h / 2, w: b.w, h: b.h };
      // Enemigos: caen igual que con la estrella
      for (const w of this.enemigos) {
        const e = w.e;
        if (w.llevado || e.dead || e.remove) continue;
        const eb = Enemigos.box(e);
        if (eb && aabb(caja, eb)) {
          e.dead = true; e.deadT = 0; e.vx = 0; e.vy = 0;
          game.puntos(200);
          game.efectoEnemigo(eb.x + eb.w / 2, eb.y + eb.h / 2);
          b.dead = true;
          break;
        }
      }
      // Jefe: cada bola cuenta como un pisotón (con la misma protección entre golpes)
      if (!b.dead && this.bossRef && this.bossRef.alive && aabb(caja, this.bossRef.caja())) {
        this.bossRef.pisado(this.player, game);
        b.dead = true;
      }
    }
    this.bolas = this.bolas.filter((b) => !b.dead);
  }

  // Cañones: disparan cada cierto tiempo en línea recta; la bala para en el primer bloque sólido y
  // hace daño al jugador (no con la estrella)
  actualizarCanones(dt, game) {
    const p = this.player;
    for (const c of this.canones) {
      c.t -= dt;
      if (c.t <= 0) {
        c.t += c.cada;
        this.balas.push({ x: c.dir > 0 ? (c.col + 1) * TILE : c.col * TILE - 8, y: c.row * TILE + 5,
                          w: 8, h: 6, vx: c.dir * c.velocidad, vida: 7, muerta: false });
      }
    }
    const caja = { x: p.x, y: p.y, w: p.w, h: p.h };
    for (const b of this.balas) {
      b.x += b.vx * dt;
      b.vida -= dt;
      const frente = b.vx > 0 ? b.x + b.w : b.x;
      if (b.vida <= 0 || b.x < -32 || b.x > this.cols * TILE + 32 ||
          SOLIDOS[tileAt(this, Math.floor(frente / TILE), Math.floor((b.y + b.h / 2) / TILE))]) { b.muerta = true; continue; }
      if (!p.dead && aabb(caja, b)) {
        b.muerta = true;
        if (p.star <= 0) game.recibirDano(p);
      }
    }
    this.balas = this.balas.filter((b) => !b.muerta);
  }

  // Cañones y balas dibujados con bloques.js
  dibujarCanones(cam) {
    for (const c of this.canones) {
      ctx.save();
      ctx.translate(c.col * TILE - cam.x, c.row * TILE - cam.y);
      Bloques.canon(ctx, c.dir);
      ctx.restore();
    }
    for (const b of this.balas) {
      ctx.save();
      ctx.translate(Math.round(b.x - cam.x), Math.round(b.y - cam.y));
      Bloques.bala(ctx, b.vx > 0);
      ctx.restore();
    }
  }

  // Bola de fuego: disco naranja con centro amarillo que parpadea al girar
  dibujarBolas(cam) {
    for (const b of this.bolas) {
      const x = Math.round(b.x - cam.x - b.w / 2), y = Math.round(b.y - cam.y - b.h / 2);
      rect(x + 1, y, 4, 6, PAL.o);
      rect(x, y + 1, 6, 4, PAL.o);
      rect(x + 2, y + 2, 2, 2, Math.floor(b.t * 16) % 2 ? PAL.y : PAL.w);
    }
  }

  // Jefe dibujado por jefes.js (con sus proyectiles y su barra de vida), en coordenadas del mundo
  dibujarJefe(b, cam) {
    ctx.save();
    ctx.translate(-cam.x, 0);
    Jefes.dibujar(ctx, b.j, performance.now() / 1000, { barra: true });
    ctx.restore();
  }

  dibujarJugador(game, cam) {
    const p = this.player;
    if (p.hurtT > 0 && Math.floor(p.hurtT * 14) % 2 === 0) return; // parpadeo de daño
    // Pivote en los pies (centro del hitbox): ahí se aplican el giro, la inclinación y el aplastamiento
    const px = p.x + p.w / 2 - cam.x, py = p.y + p.h - cam.y;
    const aplasta = p.aterrizajeT > 0;
    // Las piernas avanzan con la distancia recorrida; al correr avanzan más deprisa
    dibujarProtagonista(px, py, p.h, {
      estado: POSE_PROTA[p.pose] || "quieto",
      dir: p.facing,
      tiempo: p.zancada / (p.pose === "correr" ? 50 : 60),
      sx: p.pose === "giro" ? Math.cos((PHYS.spinTime - p.spinT) * 15) : aplasta ? 1.15 : 1,
      sy: p.pose === "agachado" ? 0.72 : aplasta ? 0.85 : 1,
      inclina: p.pose === "frenado" ? p.facing * 0.12 : 0,
      camisa: p.fire ? "fuego" : undefined,
    });
    // Estrella: destello de colores sobre la cabeza
    if (p.star > 0) {
      const c = [PAL.r, PAL.y, PAL.lb, PAL.g][Math.floor(p.animT * 16) % 4];
      rect(px - 1, py - p.h - 4, 2, 2, c);
    }
  }
}

/* =====================================================================
   15. JUEGO: estados, colisiones y progreso
   Estados: "titulo" | "selMundo" | "overworld" | "nivel" | "pausa"
            | "muerte" | "nivelOK" | "mundoOK" | "gameover" | "final" | "minijuego"
   ===================================================================== */
class Game {
  constructor() {
    this.estado = "titulo";
    this.mundoIdx = 0;        // índice en MUNDOS
    this.nivelIdx = 0;        // índice en MUNDOS[mundoIdx].niveles
    this.lvl = null;          // Level en ejecución
    this.vidas = 3;
    this.monedas = 0;
    this.score = 0;
    this.timerEstado = 0;     // para pantallas que pasan solas (muerte, nivelOK...)
    this.selMundo = 0;        // cursor en la pantalla de selección de mundo
    this.ov = null;           // Overworld activo
    this.completados = {};    // "mundo:fase" -> true
    this.bonus = {};          // "mundo:fase" -> casa de minijuegos ya jugada
    this.reserva = { seta: 0, estrella: 0, flor: 0, pluma: 0 };   // potenciadores guardados (tecla Q)
    this.pruebaTodo = false;  // modo prueba: todos los mundos y fases abiertos (ITEM en la selección de mundo)
    this.mini = null;         // minijuego en curso
    this.secreta = null;      // zona secreta en curso: { lvl: nivel de origen, tuberia, sala }
    this.transicion = null;   // entrada o salida de una tubería: { tipo, t, dur, y0, tuberia }
    this.esperarSoltar = false;   // tras cambiar de sitio por una tubería, hay que soltar ↓ antes de volver a usarla
    this.avisoSecretaT = 0;   // tiempo que se muestra el aviso "zona secreta"
    this.secretosHallados = new Set();   // zonas secretas halladas ("mundo:fase"): se guardan y se ven en el mapa
    this.grandes = {};        // "mundo:fase" -> [bool, bool, bool]: monedas estrella guardadas
    this.intento = null;      // fase en curso: { clave, grandes: Set de las cogidas, control: null | { grandes } }
    this.cargarProgreso();
  }

  // ---------- Progreso (localStorage, envuelto en try/catch) ----------
  cargarProgreso() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      this.completados = d.completados || {};
      this.bonus = d.bonus || {};
      this.reserva = Object.assign({ seta: 0, estrella: 0, flor: 0, pluma: 0 }, d.reserva);
      this.mundoIdx = clamp(d.mundoIdx || 0, 0, MUNDOS.length - 1);
      this.vidas = clamp(d.vidas || 3, 1, 99);
      this.monedas = d.monedas || 0;
      this.grandes = d.grandes || {};
      this.secretosHallados = new Set(d.secretos || []);
      // Partidas guardadas antes de que 100 monedas reiniciaran el contador
      while (this.monedas >= 100) { this.monedas -= 100; this.vidas = Math.min(99, this.vidas + 1); }
      this.score = d.score || 0;
    } catch (e) { /* save corrupto o bloqueado: empezamos de cero */ }
  }
  guardarProgreso() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        completados: this.completados, bonus: this.bonus, reserva: this.reserva,
        mundoIdx: this.mundoIdx, vidas: this.vidas, monedas: this.monedas, score: this.score,
        grandes: this.grandes, secretos: [...this.secretosHallados],
      }));
    } catch (e) { /* sin almacenamiento: el juego sigue funcionando */ }
  }
  borrarProgreso() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* nada que borrar */ }
    this.completados = {}; this.bonus = {}; this.reserva = { seta: 0, estrella: 0, flor: 0, pluma: 0 };
    this.mundoIdx = 0; this.vidas = 3; this.monedas = 0; this.score = 0;
    this.grandes = {}; this.secretosHallados = new Set();
  }

  // Una fase está desbloqueada si es la primera del mundo (y el mundo está abierto) o la anterior está completada
  nivelDesbloqueado(mIdx, ref) {
    if (this.pruebaTodo) return true;
    if (ref === 0) return this.mundoDesbloqueado(mIdx);
    return this.completados[mIdx + ":" + (ref - 1)] === true;
  }
  mundoDesbloqueado(mIdx) {
    if (this.pruebaTodo || mIdx === 0) return true;
    // Cada mundo se desbloquea al completar el castillo del anterior
    const prev = MUNDOS[mIdx - 1];
    const castillo = prev.niveles.length - 1;
    return this.completados[(mIdx - 1) + ":" + castillo] === true;
  }

  // ---------- Utilidades llamadas por las entidades ----------
  puntos(n) { this.score += n; }
  // Suma monedas; cada 100 dan una vida y el contador vuelve a empezar. (x, y): dónde se dice "1UP"
  sumarMonedas(n, x, y) {
    this.monedas += n;
    let vida = false;
    while (this.monedas >= 100) { this.monedas -= 100; this.ganarVida(x, y); vida = true; }
    if (!vida) this.sfx("moneda");
  }
  // Punto de control: al morir se vuelve aquí, con las monedas estrella que se llevaban al pasarlo
  activarControl(lvl) {
    if (this.intento) this.intento.control = { grandes: new Set(this.intento.grandes) };
    this.sfx("control");
    emitir(lvl.control.x + 12, lvl.control.pie - 26, 10, ["#8e44d6", PAL.y, PAL.w], { up: 110, spread: 70, life: 0.5 });
  }
  // Premio del poste de meta según la altura de los pies sobre el suelo; por encima del poste, una vida
  premioBandera(lvl, p) {
    const altura = GY * TILE - (p.y + p.h);
    const premio = [[112, "1UP"], [88, 5000], [64, 2000], [40, 800], [16, 400], [-Infinity, 100]].find(([h]) => altura >= h)[1];
    if (premio === "1UP") { this.puntos(5000); this.ganarVida(p.x, p.y); }
    else { this.puntos(premio); lvl.textoFlotante(String(premio), p.x, p.y - 8); }
    return premio;
  }
  // Monedas estrella de un nivel recién creado: las cogidas en este intento no salen; las guardadas salen translúcidas
  prepararGrandes(lvl) {
    if (!this.intento) return;
    const guardadas = this.grandes[this.intento.clave] || [];
    lvl.grandes = lvl.grandes.filter((g) => !this.intento.grandes.has(g.idx));
    for (const g of lvl.grandes) g.fantasma = !!guardadas[g.idx];
  }
  // Una vida más (como mucho 99), con su sonido y el "1UP" sobre el nivel
  ganarVida(x, y) {
    this.vidas = Math.min(99, this.vidas + 1);
    this.sfx("vida");
    if (this.lvl && x !== undefined) this.lvl.textoFlotante("1UP", x, y - 8);
  }
  sfx(n) { tocar(n); }
  efectoEnemigo(x, y) { emitir(x + 6, y + 6, 8, [PAL.w, PAL.y], { up: 90, spread: 90, life: 0.4 }); }

  // Golpe contra un bloque sobre la cabeza del jugador
  golpearDesdeAbajo(p) {
    const r = Math.floor((p.y - 1) / TILE);
    const c0 = Math.floor((p.x + 2) / TILE), c1 = Math.floor((p.x + p.w - 2) / TILE);
    for (const c of [c0, c1]) {
      const t = tileAt(this.lvl, c, r);
      if (t === "Q" || t === "B") { this.lvl.golpearBloque(c, r, p, this); return; }
    }
  }

  // Recoge un caparazón parado con X; con X de nuevo lo lanza hacia donde mira.
  // Devuelve true si la X se usó con un caparazón (así no dispara la flor de fuego)
  manejarCaparazon(lvl, p) {
    if (p.carrying) {
      const w = p.carrying;
      w.llevado = false;
      p.carrying = null;
      // Sale justo delante del jugador, sin solaparse con su cuerpo (si no, el caparazón nos daña al salir)
      const caja = Enemigos.box(w.e);
      w.e.x = p.x + p.w / 2 + p.facing * (p.w / 2 + (caja ? caja.w / 2 : 8) + 2);
      w.e.state = "kicked";
      w.e.dir = p.facing;
      w.e.vx = p.facing * 320;
      w.e.harmful = true;
      w.e.timer = 6;
      this.sfx("patear");
      return true;
    }
    for (const w of lvl.enemigos) {
      const e = w.e;
      if (e.type !== "caracol" || e.state !== "shell" || w.llevado) continue;
      const b = Enemigos.box(e);
      if (b && aabb({ x: p.x - 4, y: p.y, w: p.w + 8, h: p.h }, b)) {
        w.llevado = true;
        p.carrying = w;
        this.sfx("moneda");
        return true;
      }
    }
    return false;
  }

  // Con la flor de fuego, X lanza una bola de fuego hacia donde mira (como mucho BOLA.max a la vez)
  lanzarBola(lvl, p) {
    if (lvl.bolas.length >= BOLA.max) return;
    const dir = p.facing;
    lvl.bolas.push({
      x: p.x + p.w / 2 + dir * (p.w / 2 + 2), y: p.y + p.h * 0.6,
      vx: dir * BOLA.vx, vy: 0, w: BOLA.w, h: BOLA.h, t: 0, rebotes: 0, dead: false,
    });
    this.sfx("patear");
  }

  // Colisiones del jugador con objetos, monedas, enemigos, jefe y meta
  colisionesJugador(lvl) {
    const p = lvl.player;
    const hitbox = { x: p.x, y: p.y, w: p.w, h: p.h };

    // Caparazón llevado: se queda delante del jugador
    if (p.carrying) {
      const e = p.carrying.e;
      e.x = p.x + p.w / 2 + p.facing * (p.w / 2 + 10);
      e.y = p.y + p.h - e.h / 2;
    }
    // X: con un caparazón cerca lo recoge o lo patea; si no, la flor de fuego lanza una bola
    if (consume("run") && !this.manejarCaparazon(lvl, p) && p.fire) this.lanzarBola(lvl, p);
    if (consume("item")) this.usarReserva(p);

    // Objetos de bloque ?
    for (const it of lvl.items) {
      if (!aabb(hitbox, it)) continue;
      it.alive = false;
      if (it.tipo === "hongo") { p.setBig(true); this.puntos(1000); }
      else if (it.tipo === "flor") { p.setBig(true); p.fire = true; this.puntos(1000); }
      else if (it.tipo === "pluma") { p.cape = true; p.glideT = PHYS.glideTime; this.puntos(1000); }
      else if (it.tipo === "estrella") { p.star = 10; this.puntos(1000); }
      if (it.tipo === "vida") { this.ganarVida(it.x, it.y); continue; }
      this.sfx(it.tipo === "estrella" ? "estrella" : "hongo");
    }

    // Pinchos (hacen daño) y lava (mata) en los tiles que toca el jugador
    this.peligrosTiles(lvl, p);

    // Monedas
    for (const c of lvl.coins) {
      if (!c.alive) continue;
      if (aabb(hitbox, c)) {
        c.alive = false;
        this.puntos(100);
        this.sumarMonedas(1, c.x, c.y);
      }
    }

    // Monedas estrella: cuentan cuando se termina la fase; las que ya estaban guardadas solo dan puntos
    for (const g of lvl.grandes) {
      if (g.cogida || !aabb(hitbox, g)) continue;
      g.cogida = true;
      if (this.intento) this.intento.grandes.add(g.idx);
      this.puntos(g.fantasma ? 200 : 2000);
      this.sfx("grande");
      emitir(g.x + 6, g.y + 7, 14, [PAL.y, PAL.w, "#f2a000"], { up: 130, spread: 100, life: 0.6 });
      lvl.textoFlotante(g.fantasma ? "200" : "2000", g.x - 2, g.y);
    }
    lvl.grandes = lvl.grandes.filter((g) => !g.cogida);

    // Caparazón lanzado: derriba a los demás enemigos que toca
    for (const w of lvl.enemigos) {
      if (w.llevado || !Enemigos.harmful(w.e)) continue;
      const bs = Enemigos.box(w.e);
      if (!bs) continue;
      for (const o of lvl.enemigos) {
        const bo = o !== w && !o.e.dead && !o.e.remove ? Enemigos.box(o.e) : null;
        if (bo && aabb(bs, bo)) {
          o.e.dead = true; o.e.deadT = 0; o.e.vx = 0; o.e.vy = 0;
          this.puntos(200);
          this.efectoEnemigo(bo.x + bo.w / 2, bo.y + bo.h / 2);
        }
      }
    }

    // Enemigos (enemigos.js): según el tipo, se pisan, se patean o hacen daño
    for (const w of lvl.enemigos) {
      const e = w.e;
      if (w.llevado || e.remove) continue;
      const b = Enemigos.box(e);
      if (!b || !aabb(hitbox, b)) continue;
      // Con estrella, el enemigo cae al tocarlo
      if (p.star > 0) {
        if (!e.dead) {
          e.dead = true; e.deadT = 0; e.vx = 0; e.vy = 0;
          this.puntos(200);
          this.efectoEnemigo(b.x + b.w / 2, b.y + b.h / 2);
        }
        continue;
      }
      const cayendo = p.vy > 0 && p.prevBottom <= b.y + 4;     // venía de arriba
      const dir = p.x + p.w / 2 < b.x + b.w / 2 ? -1 : 1;      // lado desde el que llega
      const res = Enemigos.onTouch(e, { falling: cayendo, dir: dir });
      if (res === "bounce") {
        // Se apoya justo sobre el enemigo: el rebote no lo deja solapado (ni cuenta como daño)
        p.y = b.y - p.h;
        p.vy = p.spinT > 0 ? -PHYS.jumpV * 0.9 : -PHYS.jumpV * 0.7;
        p.spinT = 0;
        this.puntos(100);
        this.sfx("pisar");
      } else if (res === "kick") {
        this.sfx("patear");
      } else if (res === "hurt") {
        this.recibirDano(p);
      }
    }

    // Jefe: se le pisa la cabeza para quitarle una vida; su cuerpo y sus proyectiles hacen daño
    const jefe = lvl.bossRef;
    if (jefe && jefe.alive) {
      const caja = jefe.caja();
      if (p.vy > 0 && p.prevBottom <= caja.y + 6 && aabb(hitbox, caja)) {
        jefe.pisado(p, this);
        p.y = caja.y - p.h;
        p.vy = p.spinT > 0 ? -PHYS.jumpV * 0.8 : -PHYS.jumpV * 0.55;
        p.spinT = 0;
      } else if (p.star <= 0 && Jefes.toca(jefe.j, hitbox)) {
        this.recibirDano(p);
      }
    }

    // Bloquear la meta del castillo hasta derrotar al jefe
    if (lvl.boss && lvl.bossRef && lvl.bossRef.alive && p.x + p.w >= lvl.goalX) {
      p.x = lvl.goalX - p.w - 1;
      p.vx = 0;
      lvl.avisoT = 1.5;   // aviso: hay que derrotar al jefe
    }
  }

  // Lava (mata) en los tiles que toca la caja del jugador. Los pinchos se miran al caer (ver Player.update)
  peligrosTiles(lvl, p) {
    const c0 = Math.floor(p.x / TILE), c1 = Math.floor((p.x + p.w - 0.01) / TILE);
    const r0 = Math.floor(p.y / TILE), r1 = Math.floor((p.y + p.h - 0.01) / TILE);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      if (tileAt(lvl, c, r) === "V") { p.dead = true; return; }
    }
  }

  // Usa un potenciador guardado (tecla Q o botón ITEM): el primero que tenga efecto
  usarReserva(p) {
    const r = this.reserva;
    let usado = null;
    if (r.estrella > 0 && p.star <= 0) { r.estrella--; p.star = 10; usado = "estrella"; }
    else if (r.flor > 0 && !p.fire) { r.flor--; p.setBig(true); p.fire = true; usado = "flor"; }
    else if (r.seta > 0 && !p.big) { r.seta--; p.setBig(true); usado = "seta"; }
    else if (r.pluma > 0 && !p.cape) { r.pluma--; p.cape = true; p.glideT = PHYS.glideTime; usado = "pluma"; }
    if (!usado) { this.sfx("golpe"); return; }
    this.sfx(usado === "estrella" ? "estrella" : "hongo");
    emitir(p.x + p.w / 2, p.y + p.h / 2, 8, [PAL.y, PAL.w], { up: 90, spread: 80, life: 0.4 });
  }

  // Suma los premios de un minijuego: vidas y monedas al momento; potenciadores a la reserva (máx. 9)
  premiar(premios) {
    for (const { tipo, n } of premios) {
      if (tipo === "vida") this.vidas = Math.min(99, this.vidas + n);
      else if (tipo === "moneda") { this.sumarMonedas(n); this.puntos(100 * n); }
      else this.reserva[tipo] = Math.min(9, this.reserva[tipo] + n);
    }
    this.guardarProgreso();
  }

  // Casa de minijuegos del mapa: abre el minijuego que le toca a esa casa
  empezarMinijuego(mIdx, fase) {
    this.mundoIdx = mIdx;
    const orden = MUNDOS[mIdx].bonus.indexOf(fase);   // la primera casa de cada mundo, la segunda...
    this.mini = new Minijuego(this, MINIJUEGOS[(mIdx * 2 + orden) % MINIJUEGOS.length], mIdx + ":" + fase);
    this.estado = "minijuego";
  }

  // Al terminar el minijuego: se dan los premios, la casa queda hecha y vuelve el mapa
  terminarMinijuego(premios, clave) {
    this.premiar(premios);
    this.bonus[clave] = true;
    this.guardarProgreso();
    this.mini = null;
    this.volverAlMapa(this.ov ? this.ov.cur : 0);
  }

  // Daño del jugador (usa el estado del jugador para decidir)
  recibirDano(p) {
    const res = p.golpear();
    if (res === "muere") this.iniciarMuerte();
    else if (res !== "ignorado") this.sfx("golpe");
  }

  // ---------- Flujo de nivel ----------
  // reintento: tras morir; si se pasó el punto de control, se empieza en él
  empezarNivel(mIdx, nIdx, reintento = false) {
    this.mundoIdx = mIdx;
    this.nivelIdx = nIdx;
    const mundo = MUNDOS[mIdx];
    const clave = mIdx + ":" + nIdx;
    if (!reintento || !this.intento || this.intento.clave !== clave) this.intento = { clave, grandes: new Set(), control: null };
    this.lvl = new Level(mundo.niveles[nIdx], mundo);
    this.prepararGrandes(this.lvl);
    if (this.intento.control && this.lvl.control) {
      const lvl = this.lvl, p = lvl.player;
      lvl.controlActivo = true;
      p.x = lvl.control.x + 2;
      p.y = lvl.control.pie - p.h;
      lvl.cam.centrar(p, lvl);
    }
    this.secreta = null;
    this.transicion = null;
    this.estado = "nivel";
  }

  iniciarMuerte() {
    if (this.estado === "muerte") return; // evita descontar dos vidas en el mismo frame
    const p = this.lvl.player;
    p.dead = true;
    p.pose = "muerto";
    p.vx = 0;
    p.vy = -320;   // rebote de muerte (sin colisiones)
    this.estado = "muerte";
    this.timerEstado = 2.4;
    this.sfx("muerte");
    this.vidas--;
  }

  // Llamado por el bucle: termina nivel, muerte o pantallas
  actualizarEstado(dt) {
    if (this.avisoSecretaT > 0) this.avisoSecretaT -= dt;
    if (this.estado === "tuberia") { this.actualizarTransicion(dt); return; }
    if (this.estado === "nivel") {
      const lvl = this.lvl;
      lvl.actualizar(dt, this);
      // Muerte por caída, por tiempo agotado o por enemigo (ya gestionada en colisiones)
      if (lvl.player.dead) {
        this.iniciarMuerte();
        return;
      }
      if (lvl.meta) {
        this.timerEstado = 2.4;
        this.estado = "nivelOK";
        this.sfx("meta");
        return;
      }
      // Tuberías: de pie sobre una boca y con ↓, se entra en la zona secreta o se sale de ella
      if (this.esperarSoltar) { if (!held.down) this.esperarSoltar = false; return; }
      if (held.down) {
        const t = lvl.tuberiaBajo(lvl.player);
        if (t && lvl.esSala) this.iniciarTransicion("salir", t);
        else if (t && lvl.entradaSecreta && t.col === lvl.entradaSecreta.col && t.row === lvl.entradaSecreta.row) this.iniciarTransicion("entrar", t);
      }
      return;
    }
    this.timerEstado -= dt;
    // Fase superada: el jugador baja por el poste mientras baja la bandera
    if (this.estado === "nivelOK" && this.lvl) {
      const lvl = this.lvl, pl = lvl.player;
      const suelo = lvl.hm ? superficieEn(lvl, lvl.goalX - 4) : GY * TILE;
      pl.x = lvl.goalX - pl.w + 2;
      pl.vx = 0; pl.vy = 0;
      pl.y = Math.min(pl.y + 120 * dt, suelo - pl.h);
      pl.pose = pl.y + pl.h < suelo ? "caida" : "quieto";
      lvl.actualizarTextos(dt);
    }
    if (this.estado === "muerte" && this.lvl) {
      const pl = this.lvl.player;
      pl.vy += GRAVITY * dt;
      pl.y += pl.vy * dt;
      pl.animT += dt;
    }
    if (this.estado === "muerte" && this.timerEstado <= 0) {
      if (this.vidas <= 0) {
        this.estado = "gameover";
        this.timerEstado = 4;
      } else {
        // Se vuelve a empezar (en el punto de control, si se pasó) con las monedas estrella que se tenían al pasarlo
        const it = this.intento;
        if (it) it.grandes = it.control ? new Set(it.control.grandes) : new Set();
        this.empezarNivel(this.mundoIdx, this.nivelIdx, true);
      }
    }
    if (this.estado === "nivelOK" && this.timerEstado <= 0) {
      this.completarNivel();
    }
    // Tras el castillo, el siguiente mundo queda abierto en la selección
    if (this.estado === "mundoOK" && this.timerEstado <= 0) {
      this.mundoIdx = Math.min(this.mundoIdx + 1, MUNDOS.length - 1);
      this.selMundo = this.mundoIdx;
      this.estado = "selMundo";
    }
    if (this.estado === "gameover" && this.timerEstado <= 0) {
      this.vidas = 3;
      this.volverAlMapa();
    }
  }

  // ---------- Zonas secretas ----------
  // Bajar por una tubería: el jugador se hunde en ella y, al terminar, cambia de nivel (entrar o salir)
  iniciarTransicion(tipo, t) {
    const p = this.lvl.player;
    p.vx = 0; p.vy = 0;
    this.transicion = { tipo, t: 0, dur: 0.6, y0: p.y, tuberia: t };
    this.estado = "tuberia";
    this.sfx("pisar");
  }

  actualizarTransicion(dt) {
    const tr = this.transicion, p = this.lvl.player;
    tr.t += dt;
    const f = Math.min(1, tr.t / tr.dur);
    p.y = tr.tipo === "subir" ? tr.y0 - f * TILE : tr.y0 + f * TILE;   // "subir" sale del tubo; los demás se hunden
    if (f < 1) return;
    if (tr.tipo === "entrar") this.entrarSala(tr.tuberia);
    else if (tr.tipo === "salir") this.salirSala();
    else { this.transicion = null; this.estado = "nivel"; this.esperarSoltar = true; }
  }

  entrarSala(t) {
    const padre = this.lvl;
    const k = padre.entradaSecreta.sala;
    this.secreta = { lvl: padre, tuberia: t, sala: k };
    this.lvl = new Level(SALAS[k], MUNDOS[3]);
    this.prepararGrandes(this.lvl);   // la moneda estrella de la sala es la tercera de la fase
    // La primera vez que se halla cada zona: puntos, y queda marcada en el mapa
    const id = this.mundoIdx + ":" + this.nivelIdx;
    if (!this.secretosHallados.has(id)) {
      this.secretosHallados.add(id);
      this.score += 1000;
      this.guardarProgreso();
    }
    this.transicion = null;
    this.estado = "nivel";
    this.esperarSoltar = true;
    this.avisoSecretaT = 1.8;
    this.sfx("estrella");
  }

  salirSala() {
    const { lvl: padre, tuberia: entrada } = this.secreta;
    this.secreta = null;
    this.lvl = padre;
    // Se sale por la tubería de salida, más adelante en la fase; la entrada queda cerrada (sin flecha)
    const e = padre.salidaSecreta || entrada;
    padre.entradaSecreta = null;
    const p = padre.player;
    p.x = e.col * TILE + (2 * TILE - p.w) / 2;   // centrado sobre la boca (dos bloques)
    p.y = e.row * TILE + TILE - p.h;             // dentro del tubo: sale hacia arriba
    p.vx = 0; p.vy = 0;
    this.transicion = { tipo: "subir", t: 0, dur: 0.6, y0: p.y, tuberia: e };
    this.estado = "tuberia";
    this.sfx("pisar");
  }

  // Marca el nivel como completado y decide el siguiente paso
  completarNivel() {
    const mundo = MUNDOS[this.mundoIdx];
    const nivel = mundo.niveles[this.nivelIdx];
    const castillo = this.nivelIdx === mundo.niveles.length - 1;
    this.completados[this.mundoIdx + ":" + this.nivelIdx] = true;
    // Las monedas estrella cogidas en esta partida de la fase quedan guardadas
    if (this.intento) {
      const g = this.grandes[this.intento.clave] || [false, false, false];
      for (const i of this.intento.grandes) g[i] = true;
      this.grandes[this.intento.clave] = g;
      this.intento = null;
    }
    this.guardarProgreso();
    if (castillo && this.mundoIdx === MUNDOS.length - 1) {
      this.estado = "final";
    } else if (castillo) {
      this.estado = "mundoOK";
      this.timerEstado = 3;
      this.sfx("meta");
    } else {
      this.volverAlMapa();
    }
  }
