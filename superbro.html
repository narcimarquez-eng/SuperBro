// Datos de una fase antes de sus ediciones: la publicada (ya con sus ediciones dentro) o la generada
function datosBase(def, tema, clave) {
  const p = clave ? FASES_PUBLICADAS[clave] : null;
  if (!p) return construirNivel(def, tema);
  const d = JSON.parse(JSON.stringify(p));
  delete d.version;
  d.tiles = d.tiles.map((fila) => fila.split(""));
  return d;
}

/* Punto de entrada: usa el mapa escrito a mano si existe, si no genera */
function construirNivel(def, tema) {
  // Los niveles de castillo no llevan decoración de su mundo (usan su propio escenario)
  const gen = Object.assign({ theme: def.castillo ? "castillo" : (def.estilo || tema) }, def.gen, {
    jefe: def.jefe, secreta: def.secreta, avance: !!def.avance, nubarron: !!def.nubarron, peces: tema === "agua" || !!def.peces,
    agua: !!def.agua, alto: def.alto, bajada: !!def.bajada, pauta: def.pauta,
  });
  const lv = def.mapa ? parsearMapa(def.mapa, gen) : def.torre ? generarTorre(gen, def.mecanicas || [])
    : def.colinas && !def.pauta ? generarColinas(gen) : generarNivel(gen, def.mecanicas || []);   // la pauta "uno" manda sobre el relieve de colinas
  lv.nombre = def.nombre;
  lv.tiempo = def.tiempo || 300;
  if (def.sala) lv.goalX = 1e9;                       // las salas secretas no tienen meta: se sale por su tubería
  return sanearNivel(lv);
}

/* =====================================================================
   8. COLISIÓN CON TILES Y FÍSICA DEL JUGADOR
   Movimiento por ejes: primero X (y paredes), luego Y (suelo/techo).
   ===================================================================== */
const SOLIDOS = { G: 1, B: 1, Q: 1, S: 1, T: 1, U: 1, M: 1, H: 1 };   // H: pinchos (bloquean de lado)

// Devuelve el carácter del tile en (col,fila); fuera del nivel: lateral = pared, abajo = vacío
function tileAt(lvl, col, row) {
  if (col < 0 || col >= lvl.cols) return "S";
  if (row < 0) return ".";
  if (row >= lvl.rows) return ".";
  return lvl.tiles[row][col];
}

// Recorre los tiles que toca un rectángulo y devuelve true si alguno es sólido
// ----- Pendientes y colinas: en un nivel de colinas, lvl.hm guarda la altura del suelo en cada columna (px) -----
const CLIMB_MAX = 9;   // escalón que la caja sube sin chocar, en píxeles
const SNAP_MAX = 9;    // hueco bajo los pies que se cierra al bajar una pendiente

// Altura de la superficie en x (px, hacia abajo); Infinity si no hay suelo (un hueco)
function superficieEn(lvl, x) {
  const c = Math.floor(x / TILE);
  if (c < 0 || c >= lvl.cols) return Infinity;
  const a = lvl.hm[c];
  if (a === Infinity) return Infinity;
  const b = lvl.hm[c + 1];
  if (b === Infinity) return a;
  return a + (b - a) * ((x - c * TILE) / TILE);
}

// La superficie más alta bajo el ancho de una caja: es la que sostiene la caja
function superficieMin(lvl, x, w) {
  let m = Infinity;
  for (let i = 0; i <= 4; i++) m = Math.min(m, superficieEn(lvl, x + (w * i) / 4));
  return m;
}

// Caja que choca de lado con una pendiente: si la superficie sube poco, la caja sube por ella
function subirPendiente(lvl, e) {
  // También al saltar: un salto que nace junto a una pendiente que sube no debe frenar la caja
  const sup = superficieMin(lvl, e.x, e.w), base = e.y + e.h;
  if (!(sup < base) || base - sup > CLIMB_MAX) return false;
  const y0 = e.y;
  e.y = sup - e.h;
  if (tocaTiles(lvl, e.x, e.y, e.w, e.h)) { e.y = y0; return false; }
  return true;
}

function tocaSolido(lvl, x, y, w, h) {
  if (tocaTiles(lvl, x, y, w, h)) return true;
  return !!lvl.hm && y + h > superficieMin(lvl, x, w);
}

function tocaTiles(lvl, x, y, w, h) {
  const c0 = Math.floor(x / TILE), c1 = Math.floor((x + w - 0.01) / TILE);
  const r0 = Math.floor(y / TILE), r1 = Math.floor((y + h - 0.01) / TILE);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (SOLIDOS[tileAt(lvl, c, r)]) return true;
  }
  return false;
}

/* Mueve una entidad {x,y,w,h,vx,vy} resolviendo colisiones por ejes.
   Devuelve { lado, techo, suelo } para saber qué tocó. */
function moverEntidad(lvl, e, dt) {
  const res = { pared: false, techo: false, suelo: false };
  // --- Eje X ---
  const xAntes = e.x;
  e.x += e.vx * dt;
  if (tocaSolido(lvl, e.x, e.y, e.w, e.h)) {
    if (lvl.hm && !tocaTiles(lvl, e.x, e.y, e.w, e.h)) {
      // Solo la superficie de colinas: o sube la pendiente, o es un muro y se vuelve atrás
      if (!subirPendiente(lvl, e)) { e.x = xAntes; res.pared = true; e.vx = 0; }
    } else {
      res.pared = true;
      if (e.vx > 0) e.x = Math.floor((e.x + e.w) / TILE) * TILE - e.w;
      else e.x = Math.floor(e.x / TILE + 1) * TILE;
      e.vx = 0;
    }
  }
  // --- Eje Y ---
  e.y += e.vy * dt;
  if (tocaSolido(lvl, e.x, e.y, e.w, e.h)) {
    const enTiles = tocaTiles(lvl, e.x, e.y, e.w, e.h);
    if (e.vy > 0) {
      if (!enTiles && lvl.hm) e.y = superficieMin(lvl, e.x, e.w) - e.h;   // aterriza en la pendiente
      else e.y = Math.floor((e.y + e.h) / TILE) * TILE - e.h;
      res.suelo = true;
    } else if (!enTiles && lvl.hm) {
      e.y = superficieMin(lvl, e.x, e.w) - e.h;   // dentro de una pendiente: se saca fuera, sin techo
      res.suelo = true;
    } else {
      e.y = Math.floor(e.y / TILE + 1) * TILE;
      res.techo = true;
    }
    e.vy = 0;
  }
  // Pegarse a la superficie al bajar una pendiente: si iba en el suelo y queda un hueco pequeño, se baja
  if (lvl.hm && e.onGround && e.vy >= 0 && !res.suelo) {
    const sup = superficieMin(lvl, e.x, e.w), hueco = sup - (e.y + e.h);
    if (hueco >= -0.5 && hueco <= SNAP_MAX) { e.y = sup - e.h; e.vy = 0; res.suelo = true; }
  }
  return res;
}

// Tile que hay bajo los pies (la base de la caja): true si es del tipo indicado
function bajoPies(lvl, p, tipo) {
  const R = Math.floor((p.y + p.h) / TILE);
  const c0 = Math.floor(p.x / TILE), c1 = Math.floor((p.x + p.w - 0.01) / TILE);
  for (let c = c0; c <= c1; c++) if (tileAt(lvl, c, R) === tipo) return true;
  return false;
}

// Escalera: la caja del jugador toca una columna de escalera en su centro
function enEscalera(lvl, p) {
  const c = Math.floor((p.x + p.w / 2) / TILE);
  const r0 = Math.floor(p.y / TILE), r1 = Math.floor((p.y + p.h - 0.01) / TILE);
  for (let r = r0; r <= r1; r++) if (tileAt(lvl, c, r) === "L") return true;
  return false;
}

/* Plataformas de una dirección ('D'): la base cruza su borde superior cayendo y la caja queda encima.
   Por debajo, la plataforma no se toca: se puede saltar a través de ella. */
function aterrizaEnDireccional(lvl, p, basePrev) {
  const base = p.y + p.h;
  const R = Math.floor(base / TILE);
  if (basePrev > R * TILE + 0.5) return false;
  const c0 = Math.floor(p.x / TILE), c1 = Math.floor((p.x + p.w - 0.01) / TILE);
  for (let c = c0; c <= c1; c++) {
    if (tileAt(lvl, c, R) === "D") { p.y = R * TILE - p.h; return true; }
  }
  return false;
}

/* =====================================================================
   9. JUGADOR
   Estados: pequeño/grande, fuego, capa (planeo) e invencible (estrella).
   ===================================================================== */
const PHYS = {
  walkAccel: 700, runAccel: 900, airAccel: 520,
  maxWalk: 95, maxRun: 165, duckMax: 56,   // duckMax: andar agachado (grande), en px/s
  friction: 620,
  jumpV: 300, jumpHoldG: 520,  // gravedad reducida mientras se mantiene salto
  spinV: 250, spinTime: 0.42,
  coyote: 0.1, buffer: 0.12,
  glideV: 70, glideTime: 1.6,  // planeo con capa
  shellSpeed: 230,
  climbV: 110,    // velocidad al trepar por una escalera
  springV: 500,   // impulso de un muelle: unos 8 bloques de altura, con o sin mantener salto
  hieloAccel: 0.35, hieloFriccion: 0.28,   // en el hielo se arranca y se frena con mucha menos fuerza
  hundir: 9,      // velocidad a la que se hunde en las arenas movedizas (px/s)
  arenaMax: 40,   // velocidad máxima andando por las arenas movedizas
  arenaSalto: 0.8,   // fuerza del salto desde las arenas movedizas
  // Bajo el agua: cada pulsación de salto es una brazada; se cae despacio y se anda despacio por el fondo
  brazada: 150, aguaG: 260, aguaCaida: 90, aguaMax: 70, aguaMaxCorre: 95, aguaFondo: 50, aguaAccel: 320,
};

// Altura de la superficie en las fases submarinas (justo debajo del marcador): por encima no se nada
const SUPERFICIE_AGUA = 28;

// ¿La caja toca alguna casilla del tipo dado?
function tocaTipo(lvl, p, tipo) {
  const c0 = Math.floor(p.x / TILE), c1 = Math.floor((p.x + p.w - 0.01) / TILE);
  const r0 = Math.floor(p.y / TILE), r1 = Math.floor((p.y + p.h - 0.01) / TILE);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (tileAt(lvl, c, r) === tipo) return true;
  return false;
}

class Player {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.w = 12; this.h = 16;   // hitbox pequeño (el sprite es de 16x22)
    this.pose = "quieto";       // pose visual actual (ver dibujarJugador)
    this.zancada = 0;           // distancia recorrida en el suelo: marca el ciclo de piernas
    this.frenadoT = 0;          // tiempo de derrape al cambiar de dirección a toda velocidad
    this.aterrizajeT = 0;       // tiempo de aplastamiento al aterrizar
    this.facing = 1;
    this.onGround = false;
    this.coyoteT = 0;        // tiempo desde que dejó el suelo
    this.bufferT = 0;        // tiempo desde que se pulsó saltar
    this.jumping = false;    // salto en curso (se puede soltar para cortarlo)
    this.spinT = 0;          // temporizador del salto giratorio
    this.glideT = 0;         // planeo restante
    this.big = false;
    this.crecePendiente = false;   // hongo o flor cogidos bajo un techo bajo: crece en cuanto hay sitio
    this.fire = false;
    this.rebotando = false;   // rebote de muelle o de pinchos: sube sin cortarse hasta el punto más alto
    this.cape = false;
    this.star = 0;           // segundos de invencibilidad
    this.hurtT = 0;          // segundos de animación de daño / invulnerabilidad
    this.animT = 0;          // reloj de animación
    this.carrying = null;    // caparazón que lleva en la mano
    this.dead = false;
    this.duck = false;
    this.mirada = 0;         // -1 mirando arriba, 1 abajo, 0 al frente (solo quieto en el suelo)
    this.miradaT = 0;        // segundos que lleva mirando así
    this.trepando = false;   // agarrado a una escalera
    this.plat = null;        // plataforma móvil sobre la que está de pie
  }

  // Aplica el estado de tamaño (pequeño = 16 px de alto, grande = 26). Crece hacia arriba, sin meterse en el suelo.
  // Con lvl, mira si cabe: si sobre la cabeza hay un techo, baja la caja lo justo para encajar; si no cabe en ningún
  // sitio, no crece todavía y lo intenta en cada cuadro (quedar metido en el techo lo dejaba fuera de la pantalla)
  setBig(b, lvl) {
    if (b === this.big) { this.crecePendiente = false; return; }
    const bottom = this.y + this.h;
    if (b && lvl) {
      let y = null;
      for (let t = bottom - 26; t <= bottom - 16 && y === null; t++) if (!tocaSolido(lvl, this.x, t, this.w, 26)) y = t;
      if (y === null) { this.crecePendiente = true; return; }
      this.big = true; this.h = 26; this.y = y; this.crecePendiente = false;
      return;
    }
    this.big = b;
    this.h = b ? 26 : 16;
    this.y = bottom - this.h; // crece hacia arriba, nunca se mete en el suelo
    this.crecePendiente = false;
  }

  // Caja grande (26 px) o agachada (16 px), con los pies en el mismo sitio. Al levantarse, solo lo hace si cabe
  ajustarAltura(lvl, agachado) {
    if (!this.big) return;
    const pies = this.y + this.h;
    if (agachado && this.h !== 16) { this.h = 16; this.y = pies - 16; }
    else if (!agachado && this.h === 16 && !tocaSolido(lvl, this.x, pies - 26, this.w, 26)) { this.h = 26; this.y = pies - 26; }
  }

  // Cuánto se asoma la cámara al mirar arriba (negativo) o abajo (positivo), tras un momento quieto mirando
  get desplazamientoCamara() { return this.miradaT > 0.35 ? this.mirada * 80 : 0; }

  get invencible() { return this.star > 0 || this.hurtT > 0 || (devActivo && devInmortal); }

  // Hace daño: reduce el poder o muere si era pequeño
  golpear() {
    if (this.invencible) return "ignorado";
    this.crecePendiente = false;
    if (this.fire || this.cape) { this.fire = false; this.cape = false; this.hurtT = 1.5; return "pierde-poder"; }
    if (this.big) { this.setBig(false); this.hurtT = 1.5; return "encoge"; }
    this.dead = true;
    return "muere";
  }

  // Lógica del jugador por frame (entrada + física + colisiones)
  update(dt, lvl, game) {
    if (this.crecePendiente) this.setBig(true, lvl);   // crece cuando ya cabe
    this.prevBottom = this.y + this.h;   // base del jugador antes de moverse (para pisotones)
    this.animT += dt;
    if (this.star > 0) this.star -= dt;
    if (this.hurtT > 0) this.hurtT -= dt;

    const izq = held.left, der = held.right;
    const corre = held.run > 0;
    // Derrape: cambiar de dirección en el suelo a buena velocidad
    const dirH = (der ? 1 : 0) - (izq ? 1 : 0);
    if (this.onGround && dirH !== 0 && Math.sign(this.vx) === -dirH && Math.abs(this.vx) > 90 && this.frenadoT <= 0) {
      this.frenadoT = 0.22;
      emitir(this.x + this.w / 2, this.y + this.h, 4, ["#e8e8f0", "#c8c8d8"], { up: 30, spread: 60, life: 0.3, size: 2 });
    }
    if (this.frenadoT > 0) this.frenadoT -= dt;
    // Agacharse (solo grande): con abajo en el suelo baja a 16 px, cabe en huecos de una fila, y anda despacio.
    // Trepando hacia arriba, si el techo es bajo (la boca de la escalera), también se encoge para entrar
    this.duck = held.down && this.onGround && this.big && !this.trepando;
    const apretado = this.big && this.trepando && held.up && tocaSolido(lvl, this.x, this.y + this.h - 28, this.w, 26);
    this.ajustarAltura(lvl, this.duck || apretado);
    // Mirar arriba o abajo, quieto en el suelo: la cabeza se gira al momento y la cámara se asoma tras un momento
    const quieto = this.onGround && Math.abs(this.vx) < 8 && !this.trepando;
    const mirada = quieto ? (held.up ? -1 : held.down ? 1 : 0) : 0;
    if (mirada !== this.mirada) { this.mirada = mirada; this.miradaT = 0; }
    else if (mirada !== 0) this.miradaT += dt;

    // Suelo helado (mundo del hielo): se arranca y se frena con poca fuerza. Arenas movedizas: se anda despacio
    const hielo = this.onGround && lvl.resbala;
    this.enArena = tocaTipo(lvl, this, "Y");

    // --- Movimiento horizontal ---
    const dir = (der ? 1 : 0) - (izq ? 1 : 0);
    const agua = !!lvl.agua;
    const maxV = this.duck ? PHYS.duckMax : agua ? (this.onGround ? PHYS.aguaFondo : corre ? PHYS.aguaMaxCorre : PHYS.aguaMax)
      : this.enArena ? PHYS.arenaMax : corre ? PHYS.maxRun : PHYS.maxWalk;
    const acc = agua ? PHYS.aguaAccel
      : this.onGround ? (corre ? PHYS.runAccel : PHYS.walkAccel) * (hielo ? PHYS.hieloAccel : 1) : PHYS.airAccel;
    if (dir !== 0) {
      this.facing = dir;
      if (Math.abs(this.vx) < maxV || Math.sign(this.vx) !== dir) this.vx += dir * acc * dt;
      if (Math.abs(this.vx) > maxV) this.vx = Math.sign(this.vx) * Math.max(maxV, Math.abs(this.vx) - 400 * dt);
    } else {
      // Fricción: frena suavemente al soltar la dirección (en el hielo, casi nada: se patina)
      const f = PHYS.friction * (hielo ? PHYS.hieloFriccion : 1) * dt;
      if (Math.abs(this.vx) <= f) this.vx = 0;
      else this.vx -= Math.sign(this.vx) * f;
    }
    // Durante el derrape se frena más fuerte
    if (this.frenadoT > 0 && this.onGround) this.vx -= Math.sign(this.vx) * PHYS.friction * (hielo ? 0.3 : 1.6) * dt;
    // Al patinar sobre el hielo saltan cristalitos
    if (hielo && dir !== Math.sign(this.vx) && Math.abs(this.vx) > 50 && Math.random() < 0.3) {
      emitir(this.x + this.w / 2, this.y + this.h, 1, ["#e0f4ff", "#ffffff"], { up: 30, spread: 40, life: 0.3, size: 1 });
    }
    // --- Escaleras: con arriba o abajo se trepa; saltar suelta la escalera ---
    if (!enEscalera(lvl, this)) this.trepando = false;
    else if (!this.trepando && (held.up || held.down)) { this.trepando = true; this.vx = 0; }   // al agarrarla se para: no se sale de la columna
    if (this.trepando && pressed.jump) { this.trepando = false; this.coyoteT = PHYS.coyote; }
    if (this.trepando) {
      this.vy = held.up ? -PHYS.climbV : held.down ? PHYS.climbV : 0;
      this.jumping = false;
    }

    // --- Bajo el agua: cada pulsación de salto (o de giro) es una brazada hacia arriba, también en el aire ---
    if (agua) {
      if (consume("jump") || consume("spin")) {
        this.vy = -PHYS.brazada;
        this.onGround = false;
        game.sfx("pisar");
        emitir(this.x + this.w / 2, this.y + 2, 2, ["rgba(255,255,255,0.8)"], { up: 20, spread: 10, life: 1, size: 2, g: -50 });
      }
      this.jumping = false;
    }
    // --- Salto: buffer (recordar pulsación) y coyote time (saltar tras caer) ---
    if (consume("jump")) this.bufferT = PHYS.buffer;
    else this.bufferT -= dt;
    this.coyoteT = this.onGround ? PHYS.coyote : this.coyoteT - dt;

    if (this.bufferT > 0 && this.coyoteT > 0 && !this.duck) {
      this.vy = (-PHYS.jumpV - Math.abs(this.vx) * 0.25) * (this.enArena ? PHYS.arenaSalto : 1);
      this.bufferT = 0; this.coyoteT = 0;
      this.jumping = true;
      this.onGround = false;
      game.sfx("salto");
    }

    // --- Salto giratorio (C / Shift): rebota y rompe bloques giratorios ---
    if (consume("spin") && !this.onGround && this.spinT <= 0) {
      this.spinT = PHYS.spinTime;
      this.vy = Math.min(this.vy, -PHYS.spinV * 0.5);
      game.sfx("giro");
    }
    if (this.spinT > 0) this.spinT -= dt;

    // --- Planeo con capa: mantener salto en el aire ---
    if (this.cape && !this.onGround && held.jump && this.vy > 0 && this.glideT > 0) {
      this.vy = Math.min(this.vy, PHYS.glideV);
      this.glideT -= dt;
    }
    if (this.onGround) this.glideT = PHYS.glideTime;

    // --- Gravedad: más suave si se mantiene salto subiendo (salto variable) ---
    const subiendoConSalto = this.vy < 0 && held.jump && this.jumping;
    const g = agua ? PHYS.aguaG : subiendoConSalto ? PHYS.jumpHoldG : GRAVITY;
    if (!this.trepando && !(this.cape && held.jump && this.glideT > 0 && this.vy >= 0 && this.vy <= PHYS.glideV)) {
      this.vy += g * dt;
    }
    if (this.vy > (agua ? PHYS.aguaCaida : MAX_FALL)) this.vy = agua ? PHYS.aguaCaida : MAX_FALL;
    if (this.vy >= 0) this.jumping = false;
    if (!held.jump && this.vy < -120 && !this.rebotando) this.vy = -120; // corta el salto al soltar

    // Arenas movedizas: al caer se hunde despacio en vez de caer
    if (this.enArena && this.vy > 0) this.vy = PHYS.hundir;
    // Punto más alto del salto o de la caída (para saber desde cuánto se cae)
    if (this.vy <= 0 || this.onGround || this.apice === undefined) this.apice = this.y;
    // --- Colisiones ---
    const vyAntes = this.vy, enAireAntes = !this.onGround, yAntes = this.y;
    const r = moverEntidad(lvl, this, dt);
    if (r.pared) this.vx = 0;
    if (r.techo) {
      game.golpearDesdeAbajo(this);
    } else if (vyAntes < 0 && lvl.golpearOculto) {
      lvl.golpearOculto(this, yAntes, game);
    }
    // Plataformas de una dirección: solo paran al caer desde arriba
    if (!r.suelo && this.vy >= 0 && aterrizaEnDireccional(lvl, this, this.prevBottom)) { r.suelo = true; this.vy = 0; }
    this.onGround = r.suelo;
    // En las arenas movedizas se puede saltar (cuenta como suelo); con la cabeza ya dentro, se ahoga
    if (tocaTipo(lvl, this, "Y") && this.vy >= 0) {
      this.onGround = true;
      if (tileAt(lvl, Math.floor((this.x + this.w / 2) / TILE), Math.floor((this.y + 3) / TILE)) === "Y") this.dead = true;
    }
    if (r.suelo || this.vy >= 0) this.rebotando = false;
    // Muelle: al pisarlo, salta muy alto
    if (r.suelo && vyAntes >= 0 && bajoPies(lvl, this, "M")) {
      // Sin "jumping" la gravidad es la normal: la altura no depende de mantener salto
      this.vy = -PHYS.springV;
      this.onGround = false;
      this.jumping = false;
      this.rebotando = true;
      game.sfx("salto");
      emitir(this.x + this.w / 2, this.y + this.h, 6, [PAL.y, PAL.w], { up: 80, spread: 60, life: 0.3, size: 2 });
    }
    // Pinchos: solo hacen daño al caer sobre ellos (tocarlos de lado no); el jugador rebota
    if (r.suelo && vyAntes >= 0 && bajoPies(lvl, this, "H")) {
      game.recibirDano(this);
      // El rebote de pinchos sube lo justo para salir del hoyo andando (unos 32 px)
      if (!this.dead) { this.vy = -PHYS.jumpV * 0.8; this.onGround = false; this.jumping = false; this.rebotando = true; }
    }
    // Aterrizaje fuerte: aplastamiento y polvo; desde muy alto (más de seis bloques), la pantalla tiembla
    if (r.suelo && enAireAntes && vyAntes > 150) {
      if (this.y - this.apice > 6 * TILE && game.sacudir) game.sacudir(0.18, 2);
      this.aterrizajeT = 0.12;
      emitir(this.x + this.w / 2, this.y + this.h, 6, ["#e8e8f0", "#c8c8d8"], { up: 40, spread: 70, life: 0.35, size: 2 });
    }
    if (this.aterrizajeT > 0) this.aterrizajeT -= dt;
    if (r.suelo) this.jumping = false;

    // Bajo el agua no se sale por arriba, y de vez en cuando sube una burbuja
    if (agua) {
      if (this.y < SUPERFICIE_AGUA) { this.y = SUPERFICIE_AGUA; if (this.vy < 0) this.vy = 0; }
      if (Math.random() < dt * 1.2) emitir(this.x + this.w / 2 + this.facing * 3, this.y + 2, 1, ["rgba(255,255,255,0.75)"], { up: 15, spread: 6, life: 1.4, size: 2, g: -40 });
    }
    // Caer fuera del nivel
    if (this.y > lvl.rows * TILE + 40) this.dead = true;

    this.calcularPose(dt);

    // Límite izquierdo del nivel
    if (this.x < 0) { this.x = 0; this.vx = 0; }
  }

  // Elige la pose visual según el estado (la dibuja dibujarJugador) y avanza las piernas al andar
  calcularPose(dt) {
    if (this.dead) this.pose = "muerto";
    else if (this.hurtT > 0) this.pose = "dano";
    else if (this.spinT > 0) this.pose = "giro";
    else if (this.duck) this.pose = "agachado";
    else if (this.trepando) this.pose = "trepar";
    else if (!this.onGround) this.pose = this.vy < 0 ? "salto" : "caida";
    else if (this.frenadoT > 0) this.pose = "frenado";
    else if (Math.abs(this.vx) > 120 && held.run) this.pose = "correr";
    else if (Math.abs(this.vx) > 25) this.pose = "andar";
    else this.pose = "quieto";
    if (this.onGround && (this.pose === "andar" || this.pose === "correr")) this.zancada += Math.abs(this.vx) * dt;
    if (this.trepando) this.zancada += Math.abs(this.vy) * dt;   // al trepar, las manos y los pies avanzan con la subida
  }
}

/* =====================================================================
   10. ENEMIGOS, JEFE, MONEDAS, OBJETOS Y PARTÍCULAS
   ===================================================================== */

/* Jefe del castillo: uno por mundo, con sus ataques (jefes.js). Esta clase lo une al nivel:
   lo mueve dentro de su arena, le quita una vida con cada pisotón y dice cuándo cae. */
class Boss {
  constructor(x, y, tipo) {
    // x: centro del jefe en la arena; los pies quedan sobre el suelo del nivel
    this.j = Jefes.create(tipo || "koopa", x + TILE, GY * TILE, { dir: -1 });
  }

  get alive() { return this.j.estado !== "muerto"; }
  get hp() { return this.j.hp; }
  // Nombre para el aviso de la pantalla, sin tildes (la fuente no las tiene)
  get nombre() { return Jefes.NOMBRES[this.j.tipo].normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase(); }
  caja() { return Jefes.caja(this.j); }

  // Pisotón: Jefes.golpear devuelve "herido", "muerto" o "ignorado" (si aún es invulnerable)
  pisado(player, game) {
    const r = Jefes.golpear(this.j);
    if (r === "herido") game.sfx("pisar");
    if (r === "muerto") {
      game.puntos(1000);
      game.efectoEnemigo(this.j.x, this.j.y - this.j.h / 2);
      game.sfx("meta");
    }
    return r;
  }

  update(dt, lvl, game, player) {
    // La arena es el suelo llano del castillo: el jefe no sale por la izquierda, donde hay huecos
    const mundo = {
      solid: (x, y) => x < lvl.arenaX0 || lvl.solidoEn(x, y),
      tile: TILE,
      ancho: lvl.cols * TILE,
      jugador: { x: player.x + player.w / 2, y: player.y + player.h / 2 },
    };
    Jefes.update(this.j, dt, mundo);
  }
}

/* Moneda: se recoge al tocarla. Gira con 3 fotogramas. */
class Coin {
  constructor(x, y, suelta = false) {
    this.x = x; this.y = y; this.w = 8; this.h = 10;
    this.alive = true;
    this.anim = Math.random() * 3;
    this.suelta = suelta;   // salió de un bloque (sube y desaparece)
    this.vy = suelta ? -150 : 0;
    this.vidaT = suelta ? 0.5 : Infinity;
  }
  update(dt) {
    this.anim += dt * 8;
    if (this.suelta) {
      this.y += this.vy * dt;
      this.vy += 600 * dt;
      this.vidaT -= dt;
      if (this.vidaT <= 0) this.alive = false;
    }
  }
}

/* Objeto de bloque ?: hongo, flor, pluma o estrella. Sale del bloque y avanza. */
class PowerUp {
  constructor(tipo, x, y) {
    this.tipo = tipo;
    this.x = x; this.y = y;
    this.w = 14; this.h = 14;
    this.vx = tipo === "flor" ? 0 : 50;
    this.vy = 0;
    this.alive = true;
    this.saliendoT = 0.4;  // sube un poco antes de empezar a moverse
    this.yDestino = y - 16;
  }
  update(dt, lvl) {
    if (this.saliendoT > 0) {
      this.saliendoT -= dt;
      this.y -= 40 * dt;
      return;
    }
    if (this.tipo === "flor") return;
    this.vy += GRAVITY * dt;
    if (this.vy > MAX_FALL) this.vy = MAX_FALL;
    const r = moverEntidad(lvl, this, dt);
    if (r.pared) this.vx = -this.vx;
    if (this.y > lvl.rows * TILE) this.alive = false;
  }
}

/* Partículas pixeladas: cuadrados que caen y se desvanecen */
const particulas = [];
function emitir(x, y, n, colores, opts = {}) {
  for (let i = 0; i < n; i++) {
    particulas.push({
      x, y,
      vx: rnd(-(opts.spread || 80), opts.spread || 80),
      vy: rnd(-(opts.up || 140), -(opts.up || 40)),
      g: opts.g === undefined ? 500 : opts.g,
      vida: rnd(0.3, opts.life || 0.6),
      max: opts.life || 0.6,
      color: colores[rndi(0, colores.length - 1)],
      size: opts.size || 2,
    });
  }
}
function actualizarParticulas(dt) {
  for (let i = particulas.length - 1; i >= 0; i--) {
    const p = particulas[i];
    p.vy += p.g * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vida -= dt;
    if (p.vida <= 0) particulas.splice(i, 1);
  }
}
function dibujarParticulas(cam) {
  for (const p of particulas) {
    rect(p.x - cam.x, p.y - cam.y, p.size, p.size, p.color);
  }
}

/* =====================================================================
   7d. PLATAFORMAS MÓVILES Y QUE CAEN
   Son de una dirección: se pisan desde arriba. Una móvil va y viene entre x0 y x1.
   Una que cae tiembla un momento al pisarla, se hunde y reaparece unos segundos después.
   ===================================================================== */
class Plataforma {
  constructor(d) {
    this.t = d.t;                   // "movil" | "caida"
    this.x = d.x; this.y = d.y;
    this.w = d.w; this.h = d.h;
    this.x0 = d.x0; this.x1 = d.x1;
    this.eje = d.eje || "x";        // "y": ascensor que sube y baja entre y0 (arriba) e y1 (abajo)
    this.y0 = d.y0; this.y1 = d.y1;
    this.vel = d.vel || 36;
    this.dir = 1;
    this.homeX = d.x; this.homeY = d.y;
    this.dx = 0; this.dy = 0;       // desplazamiento de este frame (lo lleva consigo al jugador)
    this.vy = 0;
    this.pisada = false;            // la pisó el jugador en el frame anterior
    this.temblor = 0;               // tiempo que tiembla antes de caer
    this.caida = false;             // ya cae
    this.vivo = true;
    this.respawn = 0;
    this.grupo = d.grupo || null;   // tramos de un mismo puente: al pisar uno caen todos en cascada
    this.indice = d.indice || 0;    // posición del tramo dentro del puente
    this.tCaida = d.tCaida || 0.45; // segundos que tiembla antes de caer
    this.retraso = 0;               // espera extra de un tramo lejano del pisado
    this.madera = !!d.madera;       // se dibuja con tablones de madera
  }

  update(dt, lvl) {
    const x0 = this.x, y0 = this.y;
    if (this.t === "movil" && this.eje === "y") {
      this.y -= this.dir * this.vel * dt;
      if (this.y <= this.y0) { this.y = this.y0; this.dir = -1; }
      if (this.y >= this.y1) { this.y = this.y1; this.dir = 1; }
    } else if (this.t === "movil") {
      this.x += this.dir * this.vel * dt;
      if (this.x >= this.x1) { this.x = this.x1; this.dir = -1; }
      if (this.x <= this.x0) { this.x = this.x0; this.dir = 1; }
    } else if (this.vivo) {
      if (this.pisada && this.temblor <= 0 && !this.caida) this.temblor = this.tCaida + this.retraso;
      if (this.temblor > 0) {
        this.temblor -= dt;
        if (this.temblor <= 0) this.caida = true;
      } else if (this.caida) {
        this.vy += GRAVITY * dt;
        this.y += this.vy * dt;
        if (this.y > lvl.rows * TILE + 40) { this.vivo = false; this.respawn = 2.5; }
      }
    } else {
      this.respawn -= dt;
      if (this.respawn <= 0) {
        this.vivo = true; this.caida = false; this.temblor = 0; this.vy = 0;
        this.x = this.homeX; this.y = this.homeY;
      }
    }
    this.dx = this.x - x0;
    this.dy = this.y - y0;
    this.pisada = false;
  }

  // Si el jugador cae desde arriba sobre la franja superior, queda de pie sobre la plataforma
  pisa(p, basePrev) {
    if (!this.vivo || p.vy < 0) return false;
    if (p.x + p.w <= this.x + 2 || p.x >= this.x + this.w - 2) return false;
    const base = p.y + p.h;
    if (basePrev > this.y + 0.5 || base < this.y) return false;
    p.y = this.y - p.h;
    p.vy = 0;
    p.onGround = true;
    return true;
  }
}

// Muelle (tile "M"): base oscura, resorte de espiral y plato rojo arriba
let muelleCache = null;
function muelleSprite() {
  if (!muelleCache) {
    const filas = [
      "", "", "",
      "  rrrrrrrrrrrr  ",
      " rwwrrrrrrrrrrr ",
      " rwrrrrrrrrrrrr ",
      "  rrrrrrrrrrrr  ",
      "      gggg      ", "      ssss      ", "      gggg      ", "      ssss      ", "      gggg      ", "      ssss      ", "      gggg      ",
      "  dddddddddddd  ",
      " dddddddddddddd ",
    ];
    const rows = filas.map((f) => f.padEnd(16, " ").replace(/ /g, "."));
    muelleCache = spriteFromRows(expandir(rows), { r: "#e52521", w: "#ffb3a8", g: "#c8c8d8", s: "#8a8aa0", d: "#5a5a6e" });
  }
  return muelleCache;
}

/* Mezcla un color hex con negro o blanco en proporción t (sombreado) */
function mezclar(hex, t, hacia = "#000000") {
  const a = parseInt(hex.slice(1), 16), b = parseInt(hacia.slice(1), 16);
  const out = [16, 8, 0].map((s) => {
    const x = (a >> s) & 255, y = (b >> s) & 255;
    return Math.round(x + (y - x) * t);
  });
  return "#" + out.map((v) => v.toString(16).padStart(2, "0")).join("");
}

/* =====================================================================
   13. ESCENARIO CON VOLUMEN (estilo consola de 16 bits, colores vivos)
   Todo se genera como matrices y pasa por spriteFromRows: el contorno
   y el bisel salen solos. Las texturas se cachean y se repiten en X
   con desplazamiento de parallax.
   ===================================================================== */
const mod = (a, n) => ((a % n) + n) % n;
const texturas = new Map();
function textura(key, fabricar) {
  if (!texturas.has(key)) texturas.set(key, fabricar());
  return texturas.get(key);
}

// Matriz de un círculo relleno (para soles, arbustos, etc.)
function circuloRows(r, ch) {
  const rows = [];
  for (let y = -r; y <= r; y++) {
    let f = "";
    for (let x = -r; x <= r; x++) f += x * x + y * y <= r * r ? ch : ".";
    rows.push(f);
  }
  return rows;
}

// Colina periódica: fnAlt(x) da la altura de la cima en cada columna
function texColinas(key, ancho, color, fnAlt, contorno = false) {
  return textura(key, () => {
    const alto = H_MIN; // las capas son de diseño: no dependen del tamaño de pantalla
    const rows = [];
    for (let y = 0; y < alto; y++) rows.push("");
    for (let x = 0; x < ancho; x++) {
      const top = Math.round(fnAlt(x));
      for (let y = 0; y < alto; y++) rows[y] += y >= top ? "c" : ".";
    }
    const sp = spriteFromRows(expandir(rows), { c: color }, contorno, true);
    sp.tw = ancho;
    return sp;
  });
}

// Pinta una capa periódica con parallax (factor = fracción de la cámara)
function capaPeriodica(sp, camX, factor, y) {
  const off = mod(Math.floor(camX * factor), sp.tw);
  for (let x = -off; x < W; x += sp.tw) drawSprite(sp, x, y);
}

// Sol con borde de luz y contorno
function dibujarSol(pal, x, y) {
  const color = pal.sol || "#ffe36b";
  const sp = textura("sol-" + color, () => spriteFromRows(expandir(circuloRows(11, "c")), { c: color }));
  drawSprite(sp, x, y);
}

// Pirámide con bloques de piedra: cara iluminada a la izquierda, sombra a la derecha
function texPiramide(alto, base, pal) {
  return textura("piramide-" + alto + "-" + base, () => {
    const rows = [];
    const cx = base / 2;
    for (let y = 0; y < alto; y++) {
      const mitad = ((y + 1) / alto) * cx;
      let f = "";
      for (let x = 0; x < base; x++) {
        const dx = x + 0.5 - cx;
        if (Math.abs(dx) > mitad) { f += "."; continue; }
        const hilada = y % 7 === 6;
        f += hilada ? "m" : dx < 0 ? "l" : "d";
      }
      rows.push(f);
    }
    return spriteFromRows(expandir(rows), { l: pal.piedraClara, d: pal.piedraOscura, m: pal.piedraJunta }, true);
  });
}

/* =====================================================================
   FONDOS ELEGIBLES. Bosque, hielo, cielo, desierto y agua tienen cielo y paisaje propios; nieve, volcán, espacio y
   selva son nuevos. Todos se dibujan a pantalla completa, con capas que se desplazan según la cámara.
   Cada escena recibe (cam, pal, t): la cámara, la paleta del mundo y el tiempo en segundos.
   ===================================================================== */
// Fila del suelo en píxeles de diseño: el horizonte de estas escenas (la misma que usa ESC_FONDO)
const HORIZONTE = GY * TILE;
// Número pseudoaleatorio fijo para una semilla: las estrellas o los árboles salen siempre en el mismo sitio
function ruido(k) { const x = Math.sin(k * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
// Cielo a pantalla completa, con un degradado de arriba abajo
function cieloDegradado(arriba, abajo) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, arriba); g.addColorStop(1, abajo);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
// Montañas o colinas: una silueta que sigue una onda (picos: agudos). f: cuánto se desplaza con la cámara
function siluetaMontanas(camX, f, base, amp, periodo, color, picos) {
  const off = camX * f;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, HORIZONTE);
  for (let x = 0; x <= W + 4; x += 4) {
    const s = Math.sin((x + off) / periodo);
    ctx.lineTo(x, base - amp * (picos ? Math.abs(s) : 0.6 + 0.4 * s));
  }
  ctx.lineTo(W + 4, HORIZONTE);
  ctx.closePath();
  ctx.fill();
}
// Fila de pinos con la base en y. separa: distancia media entre ellos; semilla: para que cada fila sea distinta
function filaPinos(camX, f, y, separa, altoMin, altoMax, color, semilla) {
  const off = camX * f, primero = Math.floor(off / separa) - 1, cuantos = Math.ceil(W / separa) + 3;
  ctx.fillStyle = color;
  for (let k = 0; k < cuantos; k++) {
    const idx = primero + k, x = idx * separa + ruido(idx * 7 + semilla) * separa * 0.5 - off;
    const h = altoMin + ruido(idx * 13 + semilla * 3) * (altoMax - altoMin);
    ctx.beginPath();
    ctx.moveTo(x - h * 0.22, y); ctx.lineTo(x, y - h); ctx.lineTo(x + h * 0.22, y);
    ctx.closePath(); ctx.fill();
  }
}
// Fila de copas redondas (selva)
function filaCopas(camX, f, y, separa, color, semilla) {
  const off = camX * f, primero = Math.floor(off / separa) - 1, cuantos = Math.ceil(W / separa) + 3;
  ctx.fillStyle = color;
  for (let k = 0; k < cuantos; k++) {
    const idx = primero + k, x = idx * separa + ruido(idx * 5 + semilla) * separa - off, r = 14 + ruido(idx * 11 + semilla) * 10;
    ctx.beginPath(); ctx.arc(x, y - r * 0.6, r, 0, Math.PI * 2); ctx.fill();
  }
}
// Fila de palmeras: tronco curvo y cinco hojas en la copa (selva)
function filaPalmeras(camX, f, y, separa, altoMin, altoMax, color, semilla) {
  const off = camX * f, primero = Math.floor(off / separa) - 1, cuantos = Math.ceil(W / separa) + 3;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3;
  for (let k = 0; k < cuantos; k++) {
    const idx = primero + k, x = idx * separa + ruido(idx * 9 + semilla) * separa * 0.4 - off;
    const h = altoMin + ruido(idx * 17 + semilla) * (altoMax - altoMin);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 8, y - h * 0.6, x + 4, y - h); ctx.stroke();
    for (let a = 0; a < 5; a++) {
      ctx.beginPath(); ctx.ellipse(x + 4, y - h, 14, 3.5, -Math.PI / 2 + (a - 2) * 0.55 + 0.4, 0, Math.PI * 2); ctx.fill();
    }
  }
}
// Nube de tres bultos
function nubeCielo(x, y, s) {
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  ctx.beginPath();
  ctx.ellipse(x, y, 14 * s, 7 * s, 0, 0, Math.PI * 2);
  ctx.ellipse(x + 10 * s, y - 3 * s, 10 * s, 7 * s, 0, 0, Math.PI * 2);
  ctx.ellipse(x - 10 * s, y - 2 * s, 9 * s, 6 * s, 0, 0, Math.PI * 2);
  ctx.fill();
}
// Isla flotante: hierba arriba, tierra abajo y, a veces, un árbol
function islaFlotante(x, y, arbol) {
  ctx.fillStyle = "#7a4e32";
  ctx.beginPath();
  ctx.moveTo(x - 24, y); ctx.lineTo(x + 24, y); ctx.lineTo(x + 8, y + 22); ctx.lineTo(x - 4, y + 14); ctx.lineTo(x - 14, y + 24);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#6cc85a";
  ctx.beginPath(); ctx.ellipse(x, y, 26, 6, 0, 0, Math.PI * 2); ctx.fill();
  if (arbol) {
    ctx.fillStyle = "#6b4a2b"; rect(x - 7, y - 4, 3, 5, "#6b4a2b");
    ctx.fillStyle = "#2f7a3c"; ctx.beginPath(); ctx.arc(x - 6, y - 11, 8, 0, Math.PI * 2); ctx.fill();
  }
}

// Bosque: montañas verdes, tres filas de pinos que se desplazan a distinta velocidad y niebla baja
function escenaBosque(cam) {
  cieloDegradado("#6fb8c8", "#d8f0d4");
  ctx.save();
  ctx.translate(0, OY);
  siluetaMontanas(cam.x, 0.12, HORIZONTE - 30, 34, 90, "#8fb6b0", false);
  filaPinos(cam.x, 0.3, HORIZONTE - 4, 13, 36, 52, "#5f8f6a", 1);
  filaPinos(cam.x, 0.6, HORIZONTE + 2, 22, 56, 84, "#2f5e3c", 2);
  const niebla = ctx.createLinearGradient(0, HORIZONTE - 36, 0, HORIZONTE + 4);
  niebla.addColorStop(0, "rgba(232,250,236,0)");
  niebla.addColorStop(1, "rgba(232,250,236,0.5)");
  ctx.fillStyle = niebla;
  ctx.fillRect(0, HORIZONTE - 36, W, 40);
  filaPinos(cam.x, 1, HORIZONTE + 8, 30, 14, 26, "#1f4a2c", 3);
  ctx.restore();
}

// Hielo: auroras que ondulan arriba, picos de hielo con cumbres blancas y destellos en la nieve
function escenaHielo(cam, pal, t) {
  cieloDegradado("#8fd8f2", "#eefcff");
  ctx.save();
  ctx.translate(0, OY);
  ctx.globalAlpha = 0.28;
  [["#7dffb0", 16, 0.7], ["#7ad8ff", 30, 0.55], ["#c79bff", 44, 0.85]].forEach(([c, y, v], k) => {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(0, y);
    for (let x = 0; x <= W + 6; x += 6) ctx.lineTo(x, y + Math.sin(x / 40 + t * v + k) * 6);
    for (let x = W + 6; x >= 0; x -= 6) ctx.lineTo(x, y + 9 + Math.sin(x / 40 + t * v + k) * 6);
    ctx.closePath();
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  siluetaMontanas(cam.x, 0.15, HORIZONTE - 24, 60, 60, "#a8dcef", true);
  siluetaMontanas(cam.x, 0.4, HORIZONTE - 6, 28, 38, "#7fc4e4", true);
  ctx.fillStyle = "#f4fdff";
  ctx.fillRect(0, HORIZONTE - 4, W, 10);
  for (let k = 0; k < 24; k++) {
    const x = (((ruido(k) * 2 * W - cam.x * 0.8) % W) + W) % W, tw = 0.5 + 0.5 * Math.sin(t * 2 + k);
    ctx.globalAlpha = 0.3 + 0.7 * tw;
    rect(x, HORIZONTE + 2 + ruido(k * 3) * 16, 2, 2, "#ffffff");
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// Cielo: un sol con su halo, nubes en dos capas y islas flotantes que suben y bajan despacio
function escenaCielo(cam, pal, t) {
  cieloDegradado("#2c6fd1", "#a6e4ff");
  ctx.save();
  ctx.translate(0, OY);
  const sol = ctx.createRadialGradient(W - 56, 34, 2, W - 56, 34, 46);
  sol.addColorStop(0, "rgba(255,246,190,1)");
