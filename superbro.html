    g.addColorStop(0, cols[0]);
    g.addColorStop(0.55, cols[1]);
    g.addColorStop(1, cols[2]);
    c.fillStyle = g;
    c.beginPath(); c.arc(0, 0, 1, 0, Math.PI * 2); c.fill();
    c.restore();
  }

  function contorno(c, x, y, rx, ry, grosor) {
    c.save();
    c.strokeStyle = 'rgba(43,29,20,0.75)';
    c.lineWidth = grosor || 1.2;
    c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.stroke();
    c.restore();
  }

  function sombraSuelo(c, x, y, rx, ry, fuerza) {
    const a = fuerza || 0.35;
    esfera(c, x, y, rx, ry, [
      'rgba(30,15,50,' + a + ')',
      'rgba(30,15,50,' + (a * 0.6) + ')',
      'rgba(30,15,50,0)'
    ]);
  }

  /* Paletas: cambian el color sin cambiar la forma (zombis = mismo dibujo, otros tonos) */
  const PAL = {
    erizo: {
      cuerpo: ['#d89a66', '#8f5e3b', '#4a2c18'], vientre: ['#fbe2b8', '#e0b07a', '#b5844f'],
      pua: '#3d2212', pua2: '#7a4a2a', ojo: '#1a1a1a', ojoBlanco: true
    },
    erizo_zombie: {
      cuerpo: ['#c2d69e', '#7f9a66', '#3e5230'], vientre: ['#dfe8c4', '#a9bd8a', '#5c7044'],
      pua: '#2a3620', pua2: '#55663e', ojo: '#ff4d4d', ojoBlanco: false
    },
    caracol: {
      cuerpo: ['#dcefb0', '#b8d66a', '#6f8f35'], concha: ['#ffd594', '#e39b3c', '#8a4f16'],
      linea: 'rgba(90,50,12,0.85)', brillo: 'rgba(255,245,220,0.7)'
    },
    caracol_zombie: {
      cuerpo: ['#d6dcc0', '#8c9c74', '#4a5a3a'], concha: ['#b8a88a', '#7a6a4c', '#3a2e20'],
      linea: 'rgba(30,20,10,0.85)', brillo: 'rgba(230,220,200,0.45)'
    },
    planta: {
      cabeza: ['#ff9a9e', '#e5484d', '#8a1a20'], tallo: '#2f8f4e',
      maceta: ['#5cc47f', '#2f8f4e', '#1a5a30'], borde: ['#6fd08f', '#2f8f4e'], borde2: '#1f6b39'
    },
    planta_zombie: {
      cabeza: ['#d4e2a6', '#8aa05a', '#3d4f25'], tallo: '#5d6b3a',
      maceta: ['#9a9f88', '#5b614d', '#2e3226'], borde: ['#b5ba9e', '#5b614d'], borde2: '#2a2e20'
    }
  };

  function dibujarErizo(c, e, t, pal) {
    const rebote = !e.dead && e.onGround ? Math.abs(Math.sin(t * 12)) * 1.2 : 0;
    c.translate(e.x, e.y - rebote);
    c.scale(e.dir, 1);

    // púas: cada una con una cara iluminada y otra en sombra
    const pt = (ang, r) => [Math.cos(ang) * (17 + r), Math.sin(ang) * (12 + r) + 2];
    for (let i = 0; i < 7; i++) {
      const a = Math.PI * (1.12 + i * 0.12);
      const tip = pt(a, 9), p1 = pt(a - 0.12, 0), p2 = pt(a + 0.12, 0), pm = pt(a - 0.05, 0);
      c.fillStyle = pal.pua;
      c.beginPath(); c.moveTo(p1[0], p1[1]); c.lineTo(tip[0], tip[1]); c.lineTo(pm[0], pm[1]); c.fill();
      c.fillStyle = pal.pua2;
      c.beginPath(); c.moveTo(pm[0], pm[1]); c.lineTo(tip[0], tip[1]); c.lineTo(p2[0], p2[1]); c.fill();
    }

    esfera(c, 0, 2, 17, 12, pal.cuerpo);
    contorno(c, 0, 2, 17, 12);
    esfera(c, 3, 8, 11, 5, pal.vientre);
    esfera(c, 16, 5, 5, 3.5, pal.vientre);
    c.fillStyle = '#222';
    c.beginPath(); c.arc(20, 4, 1.6, 0, Math.PI * 2); c.fill();
    esfera(c, -5, -4, 5, 2.2, ['rgba(255,240,220,0.55)', 'rgba(255,240,220,0.15)', 'rgba(255,240,220,0)']);

    if (e.dead) {
      c.strokeStyle = '#222'; c.lineWidth = 1.6;
      c.beginPath();
      c.moveTo(5, -4); c.lineTo(11, 1); c.moveTo(11, -4); c.lineTo(5, 1);
      c.stroke();
    } else if (pal.ojoBlanco) {
      esfera(c, 8, -1, 3, 3.2, ['#ffffff', '#f2f2f2', '#b8b8c4']);
      esfera(c, 9, -1, 1.9, 1.9, ['#3a3a3a', '#1a1a1a', '#000000']);
      c.fillStyle = '#ffffff';
      c.beginPath(); c.arc(9.8, -1.9, 0.6, 0, Math.PI * 2); c.fill();
    } else {
      // ojo zombi: brillo rojo
      esfera(c, 8, -1, 2.8, 2.8, ['#ffd0d0', pal.ojo, '#5a0000']);
    }

    if (!e.dead) {
      [-7, 6].forEach(function (x0, i) {
        const sw = Math.sin(t * 12 + i * Math.PI) * 2.5;
        esfera(c, x0 + sw * 0.3, 13, 3.5, 2.5, ['#7a5034', '#5a3a22', '#2e1c10']);
      });
    }
  }

  function caparazon(c, x, y, r, giro, pal) {
    esfera(c, x, y, r, r, pal.concha);
    contorno(c, x, y, r, r, 1.6);
    c.save();
    c.translate(x, y);
    c.rotate(giro);
    c.strokeStyle = pal.linea;
    c.lineWidth = 1.6;
    c.beginPath(); c.arc(0, 0, r * 0.55, 0, Math.PI * 1.6); c.stroke();
    c.beginPath(); c.arc(0, 0, r * 0.25, 0, Math.PI * 1.2); c.stroke();
    c.strokeStyle = pal.brillo;
    c.lineWidth = 1.2;
    c.beginPath(); c.arc(0, 0, r * 0.8, Math.PI * 1.2, Math.PI * 1.7); c.stroke();
    c.restore();
  }

  function dibujarCaracol(c, e, t, pal) {
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    if (e.state === 'walk') {
      esfera(c, 4, 7, 15, 5, pal.cuerpo);
      esfera(c, 13, 0, 6, 5.5, pal.cuerpo);
      c.strokeStyle = pal.cuerpo[2]; c.lineWidth = 2;
      c.beginPath(); c.moveTo(12, -4); c.lineTo(12, -10); c.moveTo(16, -4); c.lineTo(18, -9); c.stroke();
      esfera(c, 12, -10, 2.2, 2.2, ['#ffffff', '#f0f0f0', '#a8a8b8']);
      esfera(c, 18, -9, 2.2, 2.2, ['#ffffff', '#f0f0f0', '#a8a8b8']);
      c.fillStyle = '#222';
      c.beginPath(); c.arc(12.6, -10, 1, 0, Math.PI * 2); c.arc(18.6, -9, 1, 0, Math.PI * 2); c.fill();
      caparazon(c, -3, -2, 11, 0, pal);
    } else {
      const giro = e.state === 'kicked' ? t * 18 : 0;
      caparazon(c, 0, 2, 11, giro, pal);
    }
  }

  function dibujarAbeja(c, e, t) {
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    if (e.dead) c.rotate(1.4);
    const aleteo = e.dead ? 1 : 0.35 + 0.65 * Math.abs(Math.sin(t * 36));
    esfera(c, -2, -8, 7, 4.5 * aleteo, ['rgba(255,255,255,0.95)', 'rgba(210,235,250,0.8)', 'rgba(110,150,185,0.7)'], -0.3);
    esfera(c, 0, 0, 11, 8, ['#fff3b0', '#f5c53c', '#a77a12']);
    c.save();
    c.beginPath(); c.ellipse(0, 0, 11, 8, 0, 0, Math.PI * 2); c.clip();
    c.fillStyle = '#2a2a2a';
    c.fillRect(-4, -9, 3, 18);
    c.fillRect(3, -9, 3, 18);
    c.restore();
    contorno(c, 0, 0, 11, 8, 1);
    c.fillStyle = '#2a2a2a';
    c.beginPath(); c.moveTo(-10, -1); c.lineTo(-15, 0); c.lineTo(-10, 1); c.fill();
    esfera(c, 6, -2, 3, 3, ['#ffffff', '#f2f2f2', '#b8b8c4']);
    esfera(c, 7, -2, 1.6, 1.6, ['#3a3a3a', '#111111', '#000000']);
    c.fillStyle = '#ffffff';
    c.beginPath(); c.arc(7.6, -2.6, 0.5, 0, Math.PI * 2); c.fill();
  }

  function dibujarPlanta(c, e, t, pal) {
    const hd = headOffset(e);
    c.translate(e.x, e.y);

    if (e.up > 0.02) {
      c.strokeStyle = pal.tallo; c.lineWidth = 5;
      c.beginPath(); c.moveTo(0, 6); c.lineTo(hd.x, hd.y); c.stroke();
      c.strokeStyle = 'rgba(200,255,210,0.3)'; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(-1.5, 6); c.lineTo(hd.x - 1.5, hd.y); c.stroke();
    }

    c.save();
    c.translate(hd.x, hd.y);
    const abre = 0.35 + 0.65 * Math.abs(Math.sin(t * (e.type === 'planta_zombie' ? 6 : 4)));
    esfera(c, 0, 0, 9, 9, pal.cabeza);
    contorno(c, 0, 0, 9, 9);
    esfera(c, -4, -4, 1.8, 1.8, ['#ffffff', '#ffffff', '#dddddd']);
    esfera(c, 3, -5, 1.5, 1.5, ['#ffffff', '#ffffff', '#dddddd']);
    esfera(c, 0, 4, 6, 1.5 + abre * 3.5, ['#5a1a22', '#3a0d12', '#1a0508']);
    c.fillStyle = '#fff';
    [-3, 0, 3].forEach(function (x) {
      c.beginPath(); c.moveTo(x - 1, 2.6); c.lineTo(x + 1, 2.6); c.lineTo(x, 4.2); c.fill();
    });
    if (e.type === 'planta_zombie') {
      // hilo de baba que cuelga de la boca
      c.strokeStyle = 'rgba(220,240,180,0.8)'; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(-2, 7); c.lineTo(-2, 9 + abre * 3); c.stroke();
    }
    c.restore();

    const gp = c.createLinearGradient(-9, 0, 9, 0);
    gp.addColorStop(0, pal.maceta[0]);
    gp.addColorStop(0.35, pal.maceta[1]);
    gp.addColorStop(1, pal.maceta[2]);
    c.fillStyle = gp;
    c.fillRect(-9, 0, 18, 18);
    const gr = c.createLinearGradient(0, -4, 0, 3);
    gr.addColorStop(0, pal.borde[0]);
    gr.addColorStop(1, pal.borde[1]);
    c.fillStyle = gr;
    c.fillRect(-12, -4, 24, 7);
    c.strokeStyle = pal.borde2; c.lineWidth = 1.2;
    c.strokeRect(-12, -4, 24, 7);
  }

  function dibujarEsqueleto(c, e, t) {
    const paso = Math.sin(t * 10);
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    const hueso = ['#fffdf2', '#e8e2cc', '#9c9478'];

    // piernas que se mueven al andar
    c.strokeStyle = '#e8e2cc'; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-3, 6); c.lineTo(-3 + paso * 3, 15); c.stroke();
    c.beginPath(); c.moveTo(3, 6); c.lineTo(3 - paso * 3, 15); c.stroke();
    // brazos
    c.beginPath(); c.moveTo(-4, -8); c.lineTo(-7 - paso * 2, 0); c.stroke();
    c.beginPath(); c.moveTo(4, -8); c.lineTo(8 + paso * 2, -1); c.stroke();
    // columna
    for (let i = 0; i < 4; i++) esfera(c, 0, -2 + i * 4.5, 2.8, 2, hueso);
    // costillas
    c.strokeStyle = 'rgba(120,110,80,0.8)'; c.lineWidth = 1.2;
    for (let i = 0; i < 3; i++) {
      c.beginPath(); c.arc(0, -5 + i * 4, 6, 0.3, Math.PI - 0.3); c.stroke();
    }
    // cráneo
    esfera(c, 0, -14, 7, 6.5, hueso);
    contorno(c, 0, -14, 7, 6.5, 1);
    // cuencas: rojas si te persiguen
    esfera(c, 2.5, -15, 2.6, 3, ['#2a2a2a', '#111111', '#000000']);
    if (e.alerta) esfera(c, 2.5, -15, 1.3, 1.3, ['#ffb0b0', '#e0202a', '#8a0a10']);
    // mandíbula con dientes
    esfera(c, 1, -8, 4.5, 2.2, hueso);
    c.strokeStyle = 'rgba(120,110,80,0.8)'; c.lineWidth = 0.8;
    [-2, 0, 2].forEach(function (x) { c.beginPath(); c.moveTo(x + 1, -9.5); c.lineTo(x + 1, -7); c.stroke(); });
  }

  function dibujarHormiga(c, e, t) {
    const pasos = Math.sin(t * 24);
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    // patas, tres pares que se alternan
    c.strokeStyle = '#3a1a0c'; c.lineWidth = 1.4; c.lineCap = 'round';
    [-4, 0, 4].forEach(function (x, i) {
      const s = (i % 2 ? 1 : -1) * pasos;
      c.beginPath(); c.moveTo(x, 2); c.lineTo(x + s * 2, 8); c.lineTo(x + 4 + s, 9); c.stroke();
      c.beginPath(); c.moveTo(x, -2); c.lineTo(x - s * 2, -8); c.lineTo(x + 4 - s, -9); c.stroke();
    });
    // abdomen, tórax y cabeza
    esfera(c, -8, 0, 6, 5, ['#e07a4a', '#9a3a1e', '#3a1408']);
    esfera(c, 0, 0, 4.5, 3.8, ['#e07a4a', '#9a3a1e', '#3a1408']);
    esfera(c, 8, 0, 3.8, 3.4, ['#e8895a', '#a8452a', '#3a1408']);
    // antenas
    c.strokeStyle = '#3a1408'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(10, -2); c.quadraticCurveTo(12, -8, 16 + pasos, -7); c.stroke();
    c.beginPath(); c.moveTo(10, -2); c.quadraticCurveTo(13, -6, 17 - pasos, -3); c.stroke();
    // ojo
    c.fillStyle = '#ffffff';
    c.beginPath(); c.arc(9, -1.5, 1.2, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#111';
    c.beginPath(); c.arc(9.4, -1.5, 0.7, 0, Math.PI * 2); c.fill();
  }

  // Pingüino (hielo): anda contoneándose; cuando se tira de barriga, se queda plano
  function dibujarPinguino(c, e, t) {
    const paso = Math.sin(t * 9);
    const tirado = e.lunging;
    c.translate(e.x, e.y + (tirado ? 6 : Math.abs(paso) * 0.8));
    c.scale(e.dir, 1);
    if (!tirado) {
      c.fillStyle = '#ffa62b';                                   // patas
      esfera(c, -3, 12, 4, 2, ['#ffd08a', '#f08a1a', '#a85a0c'], 0);
      esfera(c, 4, 12, 4, 2, ['#ffd08a', '#f08a1a', '#a85a0c'], 0);
    }
    esfera(c, 0, 0, 10, 12, ['#4a5a78', '#1e2a3e', '#0c1424']);  // espalda azul oscura
    contorno(c, 0, 0, 10, 12);
    esfera(c, 1, 3, 6.5, 8.5, ['#ffffff', '#f0f4f8', '#b8c4d4']); // barriga
    esfera(c, -9, 2 + paso * 1.5, 2.6, 6, ['#2a3a52', '#1e2a3e', '#0c1424']); // aleta
    esfera(c, 4, -6, 2.6, 2.8, ['#ffffff', '#f2f2f2', '#b8b8c4']);  // ojo
    esfera(c, 5, -6, 1.4, 1.4, ['#3a3a3a', '#111111', '#000000']);
    c.fillStyle = '#ffa62b';                                     // pico
    c.beginPath(); c.moveTo(8, -3); c.lineTo(14, -1); c.lineTo(8, 0); c.fill();
  }

  // Cangrejo (agua): de lado, con pinzas que se abren y se cierran
  function dibujarCangrejo(c, e, t) {
    const pinza = Math.sin(t * 8);
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    c.strokeStyle = '#8a2516'; c.lineWidth = 1.4; c.lineCap = 'round';
    [-6, 0, 6].forEach(function (x, i) {                         // patas
      const s = (i % 2 ? 1 : -1) * Math.sin(t * 14);
      c.beginPath(); c.moveTo(x - 1, 4); c.lineTo(x + 2 + s, 9); c.stroke();
      c.beginPath(); c.moveTo(-x + 1, 4); c.lineTo(-x - 2 - s, 9); c.stroke();
    });
    c.strokeStyle = '#e0523a'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(-4, -3); c.lineTo(-5, -8); c.moveTo(4, -3); c.lineTo(5, -8); c.stroke();
    esfera(c, 0, 2, 12, 6.5, ['#ff9a7a', '#e0523a', '#8a2516']);
    contorno(c, 0, 2, 12, 6.5);
    esfera(c, -5, -9, 2.2, 2.2, ['#ffffff', '#f0f0f0', '#a8a8b8']);
    esfera(c, 5, -9, 2.2, 2.2, ['#ffffff', '#f0f0f0', '#a8a8b8']);
    c.fillStyle = '#222';
    c.beginPath(); c.arc(-5, -9, 0.9, 0, Math.PI * 2); c.arc(5, -9, 0.9, 0, Math.PI * 2); c.fill();
    // brazos y pinzas
    c.strokeStyle = '#e0523a'; c.lineWidth = 2.2;
    c.beginPath(); c.moveTo(-9, 0); c.lineTo(-15, -4); c.stroke();
    c.beginPath(); c.moveTo(9, 0); c.lineTo(15, -4); c.stroke();
    const abre = 1.5 + 1.5 * pinza;
    esfera(c, -17, -6 - abre * 0.5, 4, 2.8, ['#ffb49a', '#e0523a', '#8a2516']);
    esfera(c, 17, -6 - abre * 0.5, 4, 2.8, ['#ffb49a', '#e0523a', '#8a2516']);
  }

  // Seta (bosque): gorro rojo con lunares, pasea y a veces se para a mirar
  function dibujarSeta(c, e, t) {
    const sube = e.reposo ? 0 : Math.abs(Math.sin(t * 10)) * 1;
    c.translate(e.x, e.y - sube);
    c.scale(e.dir, 1);
    esfera(c, 0, 4, 5, 6, ['#fff6e6', '#ead7b4', '#9c7c52']);   // pie
    esfera(c, 0, -3, 9, 6.5, ['#ff8a8a', '#d8302f', '#7a1212']); // gorro
    contorno(c, 0, -3, 9, 6.5);
    esfera(c, -4, -6, 2, 1.6, ['#ffffff', '#ffffff', '#dddddd']);  // lunares
    esfera(c, 3, -7, 1.7, 1.3, ['#ffffff', '#ffffff', '#dddddd']);
    esfera(c, 0, -1, 1.4, 1.1, ['#ffffff', '#ffffff', '#dddddd']);
    c.fillStyle = '#222';                                          // ojos
    c.beginPath(); c.arc(-2, 4, 1, 0, Math.PI * 2); c.arc(2.5, 4, 1, 0, Math.PI * 2); c.fill();
  }

  // Jabalí (bosque): cuerpo peludo, colmillos y ojo rojo cuando carga
  function dibujarJabali(c, e, t) {
    const trote = e.lunging ? Math.sin(t * 30) : Math.sin(t * 10);
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    c.strokeStyle = '#3e2a1e'; c.lineWidth = 2.4; c.lineCap = 'round';
    [-8, -2, 5, 10].forEach(function (x, i) {                    // patas
      const s = (i % 2 ? 1 : -1) * trote;
      c.beginPath(); c.moveTo(x, 6); c.lineTo(x + s * 1.5, 11); c.stroke();
    });
    esfera(c, -1, 0, 14, 9, ['#a8826a', '#7a5a44', '#3e2a1e']);
    contorno(c, -1, 0, 14, 9);
    c.strokeStyle = '#4a3020'; c.lineWidth = 1.2;                // cerdas del lomo
    for (let i = 0; i < 5; i++) {
      const x = -8 + i * 4;
      c.beginPath(); c.moveTo(x, -8); c.lineTo(x + 1.5, -11); c.stroke();
    }
    esfera(c, 12, 2, 7, 6.5, ['#b8927a', '#86604a', '#3e2a1e']);  // cabeza
    esfera(c, 18, 4, 3.5, 2.6, ['#f2b8a0', '#d08a70', '#8a4a38']); // hocico
    c.fillStyle = '#4a2a1a';
    c.beginPath(); c.arc(17, 3.5, 0.6, 0, Math.PI * 2); c.arc(19.5, 3.5, 0.6, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff8e0';                                     // colmillo
    c.beginPath(); c.moveTo(14, 6); c.lineTo(19, 2.5); c.lineTo(15.5, 7.5); c.fill();
    esfera(c, 11, -1, 1.7, 1.7, e.lunging ? ['#ffb0b0', '#ff3030', '#8a0a0a'] : ['#ffffff', '#f2f2f2', '#888']);
    if (!e.lunging) esfera(c, 11.6, -1, 0.9, 0.9, ['#444', '#111', '#000']);
  }

  // Murciélago (cueva): alas que aletean y ojos rojos
  function dibujarMurcielago(c, e, t) {
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    if (e.dead) c.rotate(1.4);
    const ala = e.dead ? 0 : Math.sin(t * 18);
    c.fillStyle = '#2e2442';
    c.beginPath(); c.moveTo(-2, -1); c.quadraticCurveTo(-10, -9 + ala * 4, -15, -3 + ala * 2);
    c.lineTo(-11, 1); c.quadraticCurveTo(-7, 1, -2, 2); c.fill();
    c.beginPath(); c.moveTo(2, -1); c.quadraticCurveTo(9, -8 - ala * 3, 13, -2 - ala);
    c.lineTo(9, 1); c.quadraticCurveTo(6, 1, 2, 2); c.fill();
    esfera(c, 0, 0, 5.5, 4.5, ['#6a5a8a', '#3e3058', '#1a1228']);
    contorno(c, 0, 0, 5.5, 4.5, 1);
    c.fillStyle = '#2e2442';                                    // orejas

    golem: cuerpoGolem, selva: cuerpoSelva, abisal: cuerpoAbisal, oscuro: cuerpoOscuro

  /* ---------- Proyectiles ---------- */

  const TAMANO = { fuego: [8, 6], bola: [7, 7], hielo: [7, 6], arena: [8, 5], oscura: [7, 7], piedra: [7, 7],
                   semilla: [6, 6], burbuja: [8, 8], onda: [10, 5] };
  const VELOCIDAD = { fuego: 170, hielo: 140, arena: 120, oscura: 200, burbuja: 28, semilla: 90 };

  function nuevoProyectil(tipo, x, y, vx, vy) {
    const t = TAMANO[tipo] || [6, 6];
    return { tipo: tipo, x: x, y: y, vx: vx, vy: vy, w: t[0], h: t[1], t: 0, rebotes: 0 };
  }

  function dibujarProyectil(g, p) {
    g.save();
    g.translate(Math.round(p.x), Math.round(p.y));
    switch (p.tipo) {
      case 'fuego':
      case 'bola':
        g.fillStyle = radial(g, -1, -1, 0.5, 5, ['#fff6a0', p.tipo === 'bola' ? '#c2361f' : '#ff8a2a', 'rgba(200,40,0,0)']);
        g.beginPath(); g.arc(0, 0, 4.2, 0, Math.PI * 2); g.fill();
        g.fillStyle = 'rgba(255,200,80,0.5)';
        g.beginPath(); g.ellipse(-5 * Math.sign(p.vx || 1), 0, 3.5, 1.6, 0, 0, Math.PI * 2); g.fill();
        break;
      case 'hielo':
        poligono(g, [[0, -4], [3, 0], [0, 4], [-3, 0]], '#bff3ff', 0.6);
        break;
      case 'arena':
        elipse(g, 0, 0, 4.4, 2.6, '#e8c070', 0, 0.5);
        break;
      case 'onda':
        g.fillStyle = grad(g, 0, -3, 0, 2, ['#f4d27a', '#c8903a']);
        g.beginPath(); g.ellipse(0, 0, 5, 2.6, 0, Math.PI, 0); g.fill(); trazar(g, 0.5);
        break;
      case 'piedra':
        elipse(g, 0, 0, 3.6, 3.6, radial(g, -1.5, -1.5, 0.5, 4.5, ['#f0f2f6', '#8a93a4', '#4a5262']), 0, 0.6);
        break;
      case 'semilla':
        g.strokeStyle = '#4a9a3a'; g.lineWidth = 0.8;
        for (let i = 0; i < 6; i++) {
          const a = i * Math.PI / 3;
          g.beginPath(); g.moveTo(Math.cos(a) * 2, Math.sin(a) * 2); g.lineTo(Math.cos(a) * 4, Math.sin(a) * 4); g.stroke();

        elipse(g, 0, 0, 2.6, 2.6, '#5ab84a', 0, 0.5);
        break;
      case 'burbuja':
        elipse(g, 0, 0, 3.8, 3.8, 'rgba(170,240,255,0.35)', 0, 0.8);
        g.fillStyle = 'rgba(255,255,255,0.9)';
        g.beginPath(); g.arc(-1.2, -1.3, 0.9, 0, Math.PI * 2); g.fill();
        break;
      case 'oscura':
        g.fillStyle = radial(g, 0, 0, 0.5, 5, ['#ffd0ff', '#b02aff', 'rgba(60,0,80,0)']);
        g.beginPath(); g.arc(0, 0, 4.5, 0, Math.PI * 2); g.fill();

  function update(j, dt, mundo) {

    if (['andar', 'aliento', 'bolas', 'arena', 'piedras', 'semillas', 'burbujas'].indexOf(j.estado) !== -1) {

    // Movimiento horizontal y paredes

        if (aterrizo && j.estado === 'salto') alAterrizar(j);

    switch (j.estado) {

        if (j.t > 1.3 && j.enSuelo) elegir(j, jx);

      case 'carga':
        j.vx = j.dir * d.vel * 2.6;

        break;
      case 'salto':
        j.vx = j.dir * d.vel * 0.9;
        if (j.t > 2.5) volver(j);
        break;
      case 'aliento':
        j.vx = 0;
        if (j.disparos === 0 && j.t > 0.35) { disparar(j, jx); j.disparos = 1; }
        if (j.t > 0.9) volver(j);

      case 'bolas': {

        }

        break;
      }
      case 'arena':
        j.vx = 0;
        if (j.disparos === 0 && j.t > 0.4) { ondasDesde(j); j.disparos = 1; }
        if (j.t > 1.0) volver(j);
        break;
      case 'piedras':
        j.vx = 0;
        if (j.disparos < 3 && j.t > 0.3 + j.disparos * 0.3) {
          const px = Math.max(10, Math.min((mundo.ancho || 320) - 10, jx + (Math.random() * 2 - 1) * 50));
          j.proyectiles.push(nuevoProyectil('piedra', px, j.y - 110, 0, 40));
          j.disparos++;

        if (j.t > 1.4) volver(j);
        break;
      case 'semillas':
        j.vx = 0;
        if (j.disparos < 2 && j.t > 0.3 + j.disparos * 0.35) {
          j.proyectiles.push(nuevoProyectil('semilla', j.x + j.dir * 22, j.y - 20, (jx - j.x) / 1.4, -220));
          j.disparos++;
        }
        if (j.t > 1.1) volver(j);
        break;
      case 'burbujas':
        j.vx = 0;
        if (j.disparos < 3 && j.t > 0.25 + j.disparos * 0.3) {
          disparar(j, jx); j.disparos++;

        if (j.t > 1.3) volver(j);
        break;

        if (j.t > 0.6) volver(j);
        break;

  }

  function caja(j) {
    return { x: j.x - j.w / 2, y: j.y - j.h, w: j.w, h: j.h };
  }

  function solapa(a, b) {

/* =====================================================================
   7c. ARTE CON VOLUMEN Y DETALLE: enemigos, objetos, monedas y bloques
   Se pinta a resolución real (U píxeles por píxel lógico). Las formas
   redondas son esferas o cilindros sombreados por la luz (arriba a la
   izquierda) con cinco tonos por color; los detalles (ojos con brillo,
   dientes, placas, barbas de pluma) se pintan píxel a píxel.
   ===================================================================== */

// Familias de tonos: cada color tiene 5 letras (h luz fuerte ... D sombra profunda).
// Las letras de cada familia son distintas, así un mismo sprite puede mezclar colores.
const RK = {
  cafe:    { h: "h", l: "l", m: "m", d: "d", D: "D" },
  crema:   { h: "A", l: "B", m: "C", d: "E", D: "F" },
  rojo:    { h: "q", l: "r", m: "s", d: "t", D: "u" },
  verde:   { h: "n", l: "p", m: "x", d: "z", D: "o" },
  oro:     { h: "Q", l: "R", m: "S", d: "T", D: "U" },
  blanco:  { h: "V", l: "W", m: "X", d: "Y", D: "Z" },
  naranja: { h: "1", l: "2", m: "3", d: "4", D: "5" },
  overol:  { h: "b", l: "c", m: "g", d: "e", D: "f" },
};

// Colores de cada familia a partir de un color base
function coloresRK(rk, hex) {
  return {
    [rk.h]: mezclar(hex, 0.5, "#ffffff"),
    [rk.l]: mezclar(hex, 0.25, "#ffffff"),
    [rk.m]: hex,
    [rk.d]: mezclar(hex, 0.3),
    [rk.D]: mezclar(hex, 0.6),
  };
}

// Tono según la luz: dot > 0.72 es luz fuerte, dot < -0.4 es sombra profunda
function tonoDe(rk, luz) {
  return luz > 0.72 ? rk.h : luz > 0.42 ? rk.l : luz > 0.0 ? rk.m : luz > -0.4 ? rk.d : rk.D;
}

/* Rejilla donde se pinta el dibujo. Las medidas son LÓGICAS (w, h), pero la
   rejilla guarda U× más píxeles reales: las formas redondas se muestrean fino
   y cada píxel lógico ocupa U×U píxeles reales. */
class Lienzo {
  constructor(w, h) {
    this.w = w;
    this.h = h;
    this.fw = w * U;
    this.fh = h * U;
    this.c = [];
    for (let y = 0; y < this.fh; y++) this.c.push(new Array(this.fw).fill("."));
  }
  // Píxel lógico entero (ocupa U×U píxeles reales)
  px(x, y, ch) {
    for (let j = 0; j < U; j++) for (let i = 0; i < U; i++) this.pf(x * U + i, y * U + j, ch);
  }
  // Píxel real (para detalles finos)
  pf(xf, yf, ch) {
    if (xf >= 0 && yf >= 0 && xf < this.fw && yf < this.fh) this.c[yf][xf] = ch;
  }
  // Píxel real indicado en coordenadas lógicas (decimales)
  pfl(lx, ly, ch) { this.pf(Math.floor(lx * U), Math.floor(ly * U), ch); }
  caja(x, y, w, h, ch) {
    // Coordenadas lógicas redondeadas a píxeles reales
    const x0 = Math.round(x * U), y0 = Math.round(y * U);
    for (let j = 0; j < Math.max(1, Math.round(h * U)); j++) for (let i = 0; i < Math.round(w * U); i++) this.pf(x0 + i, y0 + j, ch);
  }
  // Recorre los píxeles reales hasta "corte" (en lógico) y llama fn(fx, fy, lx, ly)
  recorrer(corte, fn) {
    for (let fy = 0; fy < this.fh; fy++) {
      const ly = (fy + 0.5) / U;
      if (ly > corte + 0.5) break;
      for (let fx = 0; fx < this.fw; fx++) fn(fx, fy, (fx + 0.5) / U, ly);
    }
  }
  // Elipse de un solo color (ojos, boca, manchas)
  elipse(cx, cy, rx, ry, ch, corte = 1e9) {
    this.recorrer(corte, (fx, fy, lx, ly) => {
      const nx = (lx - cx) / rx, ny = (ly - cy) / ry;
      if (nx * nx + ny * ny <= 1) this.c[fy][fx] = ch;
    });
  }
  // Esfera sombreada: la normal de cada píxel decide su tono
  esfera(cx, cy, rx, ry, rk, corte = 1e9) {
    this.recorrer(corte, (fx, fy, lx, ly) => {
      const nx = (lx - cx) / rx, ny = (ly - cy) / ry;
      const d2 = nx * nx + ny * ny;
      if (d2 > 1) return;
      const nz = Math.sqrt(1 - d2);
      this.c[fy][fx] = tonoDe(rk, -0.45 * nx - 0.6 * ny + 0.66 * nz);
    });
  }
  // Cilindro vertical (tallos, tubos, monedas de canto): sombrea en horizontal
  cilindro(x0, w, y0, h, rk) {
    for (let fy = y0 * U; fy < (y0 + h) * U; fy++) for (let fx = x0 * U; fx < (x0 + w) * U; fx++) {
      const t = ((fx + 0.5) / U - (x0 + w / 2)) / (w / 2);
      const nz = Math.sqrt(Math.max(0, 1 - t * t));
      this.pf(fx, fy, tonoDe(rk, -0.45 * t + 0.66 * nz));
    }
  }
  // Recorre los píxeles ya pintados (no vacíos) y aplica fn(fx, fy, ch)
  mapear(fn) {
    for (let fy = 0; fy < this.fh; fy++) for (let fx = 0; fx < this.fw; fx++) {
      const ch = this.c[fy][fx];
      if (ch !== ".") fn(fx, fy, ch);
    }
  }
  // Borde oscuro: los píxeles pintados que tocan vacío pasan a sombra profunda
  bordeOscuro(rk) {
    const pinta = (fx, fy) => fx >= 0 && fy >= 0 && fx < this.fw && fy < this.fh && this.c[fy][fx] !== ".";
    const marca = [];
    this.mapear((fx, fy) => {
      if (!pinta(fx - 1, fy) || !pinta(fx + 1, fy) || !pinta(fx, fy - 1) || !pinta(fx, fy + 1)) marca.push([fx, fy]);
    });
    for (const [fx, fy] of marca) this.c[fy][fx] = rk.D;
  }
  filas() { return this.c.map((r) => r.join("")); }
}

// Paleta de los enemigos y objetos (todos los tonos juntos)
const PAL_ENT = Object.assign(
  { k: "#000000", w: "#ffffff" },
  coloresRK(RK.cafe, "#9b5a2a"),
  coloresRK(RK.crema, "#f6dcae"),
  coloresRK(RK.rojo, "#e0392b"),
  coloresRK(RK.verde, "#3fbf3f"),
  coloresRK(RK.oro, "#ffd23f"),
  coloresRK(RK.blanco, "#f2f2f2"),
  coloresRK(RK.naranja, "#ff8a1e"),
);


/* ---------- Monedas y objetos ---------- */

// Hongo: sombrero rojo con manchas en relieve, tallo crema con ojos
function setaFilas(sombrero = RK.rojo) {
  const L = new Lienzo(16, 16);
  L.esfera(8, 6.8, 7.2, 6.4, sombrero, 9.4);
  L.bordeOscuro(sombrero);
  for (const [x, y, r] of [[5, 4.4, 1.7], [11, 4.2, 1.6], [8, 1.8, 1.0]]) L.esfera(x, y, r, r, RK.blanco);
  L.esfera(8, 12.2, 3.6, 3.2, RK.crema, 15);
  L.bordeOscuro(RK.crema);
  L.elipse(6.2, 12, 0.8, 0.9, "k");
  L.elipse(9.8, 12, 0.8, 0.9, "k");
  L.pfl(6.1, 11.7, "w");
  return L.filas();
}

// Flor de fuego: pétalos con volumen, centro dorado, tallo y hojas con vena
function florFilas() {
  const L = new Lienzo(16, 16);
  for (let a = 0; a < 5; a++) {
    const ang = -Math.PI / 2 + (a * 2 * Math.PI) / 5;
    L.esfera(8 + Math.cos(ang) * 4.2, 6 + Math.sin(ang) * 4.2, 2.6, 2.6, RK.naranja, 12);
  }
  L.esfera(8, 6, 2.8, 2.8, RK.oro, 9);
  L.cilindro(7, 2, 11, 5, RK.verde);
  for (const [x, y] of [[4.5, 13], [11.5, 12.6]]) {
    L.esfera(x, y, 2.6, 1.6, RK.verde);
    L.recorrer(16, (fx, fy, lx, ly) => {
      if (L.c[fy][fx] !== "." && Math.abs(ly - y) < 0.12) L.c[fy][fx] = RK.verde.D;
    });
  }
  return L.filas();
}

// Pluma: hoja blanca inclinada con nervio central y barbas
function plumaFilas() {
  const L = new Lienzo(12, 14);
  const a = (-35 * Math.PI) / 180, ca = Math.cos(a), sa = Math.sin(a);
  L.recorrer(14, (fx, fy, lx, ly) => {
    const dx = lx - 6, dy = ly - 7;
    const u = dx * ca + dy * sa;      // eje largo
    const v = -dx * sa + dy * ca;     // eje corto
    if ((u / 3.6) ** 2 + (v / 6.2) ** 2 > 1) return;
    let ch = v < -1.8 ? RK.blanco.h : v < 1.2 ? RK.blanco.m : RK.blanco.d;
    if (Math.abs(v) < 0.25) ch = RK.blanco.D;                                       // nervio
    else if (Math.floor(u * 4) % 3 === 0) ch = RK.blanco.l;                         // barbas
    L.c[fy][fx] = ch;
  });
  return L.filas();
}

// Estrella de cinco puntas en oro, con contorno y brillo
function estrellaFilas() {
  const L = new Lienzo(14, 14);
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 2.8 : 6.6;
    const ang = -Math.PI / 2 + (i * Math.PI) / 5;
    pts.push([7 + r * Math.cos(ang), 7.2 + r * Math.sin(ang)]);
  }
  L.recorrer(14, (fx, fy, px, py) => {
    let dentro = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if ((yi > py) !== (yj > py) && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) dentro = !dentro;
    }
    if (dentro) L.c[fy][fx] = py < 6 ? RK.oro.h : py < 9 ? RK.oro.l : RK.oro.m;
  });
  L.bordeOscuro(RK.oro);
  L.pfl(3.2, 4.4, "w");
  return L.filas();
}

/* ---------- Caché y acceso ---------- */
const spritesArte = new Map();
function arte(key, filas, pal = PAL_ENT) {
  if (!spritesArte.has(key)) spritesArte.set(key, spriteFromRows(filas, pal, true, false, false));
  return spritesArte.get(key);
}

function objetoSprite(tipo) {
  if (tipo === "hongo") return arte("hongo", setaFilas());
  if (tipo === "vida") return arte("vida", setaFilas(RK.verde));
  if (tipo === "flor") return arte("flor", florFilas());
  if (tipo === "pluma") return arte("pluma", plumaFilas());
  return arte("estrella", estrellaFilas());
}

/*
  protagonista.js: el personaje principal, dibujado en Canvas (sin imágenes).

  Uso:
    Protagonista.dibujar(ctx, x, y, { dir: 1 | -1, estado: 'quieto' | 'andar' | 'salto' | 'caer' | 'escalera' | 'muerto', tiempo, camisa: 'fuego' });

  x, y: esquina superior izquierda de la caja de colisión (12 × 14 píxeles lógicos).
  El dibujo sobresale 2 px a cada lado y 4 px por encima de la caja; los pies quedan en el borde inferior.
  camisa: 'fuego' cambia la camisa de color por una blanca (opcional).
  El contexto debe tener escala U (o U × zoom), igual que el resto de los dibujos.
*/
(function (global) {
  'use strict';

  const OUT = '#2a1a10';
  const MORADO = ['#d7b8ff', '#8b4dea', '#4b1f9a'];
  const BLANCO = ['#ffffff', '#e4e4ee', '#a8a8bc'];   // camisa de la flor de fuego (añadido)
  const NARANJA = ['#ffd29a', '#f7941d', '#a84a06'];
  const PIEL = ['#ffe6cc', '#f2b88a', '#b87850'];
  const PELO = '#5a3418';

  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r);
    g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }

  function grad(g, x0, y0, x1, y1, cols) {
    const d = g.createLinearGradient(x0, y0, x1, y1);
    cols.forEach(function (c, i) { d.addColorStop(i / (cols.length - 1), c); });
    return d;
  }

  function radial(g, x, y, r0, r1, cols) {
    const d = g.createRadialGradient(x, y, r0, x, y, r1);
    cols.forEach(function (c, i) { d.addColorStop(i / (cols.length - 1), c); });
    return d;
  }

  function trazar(g, ancho) {
    g.strokeStyle = OUT;
    g.lineWidth = ancho || 0.6;
    g.lineJoin = 'round';
    g.stroke();
  }

  // Brazo: manga de color y mano de piel. Gira alrededor del hombro (ang 0 = colgando)
  function brazo(g, sx, sy, ang, manga) {
    g.save();
    g.translate(sx, sy);
    g.rotate(ang);
    g.fillStyle = grad(g, -1.3, 0, 1.3, 0, manga);
    rr(g, -1.3, -0.4, 2.6, 2.7, 1.1); g.fill(); trazar(g);
    g.fillStyle = radial(g, -0.4, 3, 0.2, 1.8, PIEL);
    g.beginPath(); g.ellipse(0, 3.4, 1.4, 1.5, 0, 0, Math.PI * 2); g.fill(); trazar(g);
    g.restore();
  }

  // Pierna: overol naranja y zapato marrón. dx: desplazamiento horizontal; lift: cuánto se levanta el pie
  function pierna(g, cadera, dx, lift) {
    const x = cadera + dx, y = 15.2 - lift;
    g.fillStyle = grad(g, x - 1.5, 0, x + 1.5, 0, NARANJA);
    rr(g, x - 1.5, y, 3, 2.6, 1); g.fill(); trazar(g);
    g.fillStyle = grad(g, 0, 16, 0, 18, ['#9a6a3a', '#4a2a10']);
    rr(g, x - 2, 16.2 - lift, 4.2, 1.8, 0.9); g.fill(); trazar(g);
  }

  function torso(g, camisa) {
    // camisa (roja, o blanca con la flor de fuego)
    g.fillStyle = grad(g, 0, 10.2, 0, 14.4, camisa);
    rr(g, 4.2, 10.2, 7.6, 4.2, 1.4); g.fill(); trazar(g);
    // overol naranja
    g.fillStyle = grad(g, 0, 12.4, 0, 16.6, NARANJA);
    rr(g, 4.6, 12.4, 6.8, 4.2, 1); g.fill(); trazar(g);
    // tirantes y botón
    g.fillStyle = NARANJA[1];
    g.fillRect(5.4, 10.4, 0.9, 2.4); g.fillRect(9.7, 10.4, 0.9, 2.4);
    g.fillStyle = radial(g, 8.2, 13.2, 0.1, 1, ['#fff8c0', '#ffd23f', '#d98a00']);
    g.beginPath(); g.arc(8.1, 13.1, 0.6, 0, Math.PI * 2); g.fill(); trazar(g, 0.4);
  }

  function cabeza(g, estado) {
    // oreja y pelo de detrás
    g.fillStyle = PIEL[1];
    g.beginPath(); g.ellipse(4.2, 7.6, 0.9, 1.3, 0, 0, Math.PI * 2); g.fill(); trazar(g, 0.5);
    g.fillStyle = PELO;
    g.beginPath(); g.ellipse(4.9, 8.8, 1.2, 1.5, 0, 0, Math.PI * 2); g.fill();

    // cara
    g.fillStyle = radial(g, 7.4, 6.2, 0.5, 5, PIEL);
    g.beginPath(); g.ellipse(8.2, 7.2, 4.1, 3.7, 0, 0, Math.PI * 2); g.fill(); trazar(g);

    // gorra roja con visera y emblema
    g.fillStyle = grad(g, 0, 2.3, 0, 4.8, MORADO);
    g.beginPath(); g.ellipse(8.1, 4.8, 4.4, 2.5, 0, Math.PI, 0, false); g.closePath(); g.fill(); trazar(g);
    g.fillStyle = grad(g, 8, 4.7, 8, 6.1, MORADO);
    rr(g, 8.2, 4.7, 5.2, 1.4, 0.7); g.fill(); trazar(g);
    g.fillStyle = '#ffffff';
    g.beginPath(); g.arc(7.8, 3.9, 0.75, 0, Math.PI * 2); g.fill(); trazar(g, 0.4);

    // ojos: abiertos, o en cruz si está muerto
    if (estado === 'muerto') {
      g.strokeStyle = OUT; g.lineWidth = 0.7;
      [[8.8, 7], [11, 7]].forEach(function (p) {
        g.beginPath(); g.moveTo(p[0] - 0.8, p[1] - 0.8); g.lineTo(p[0] + 0.8, p[1] + 0.8);
        g.moveTo(p[0] + 0.8, p[1] - 0.8); g.lineTo(p[0] - 0.8, p[1] + 0.8); g.stroke();
      });
    } else {
      [[8.8, 6.9], [11, 6.9]].forEach(function (p) {
        g.fillStyle = '#ffffff';
        g.beginPath(); g.ellipse(p[0], p[1], 0.95, 1.2, 0, 0, Math.PI * 2); g.fill(); trazar(g, 0.5);
        g.fillStyle = OUT;
        g.beginPath(); g.arc(p[0] + 0.35, p[1] + 0.3, 0.55, 0, Math.PI * 2); g.fill();

    g.fillStyle = PIEL[1];
    g.beginPath(); g.ellipse(12.3, 8, 1, 1.1, 0, 0, Math.PI * 2); g.fill(); trazar(g, 0.5);
    g.fillStyle = '#3a2212';
    rr(g, 8.4, 8.7, 3.9, 1.1, 0.55); g.fill();
  }

  // Posición de brazos (ángulos) y piernas (desplazamiento y levantamiento) según el estado
  function pose(estado, t) {
    const ph = Math.sin(t * 12), ph2 = Math.sin(t * 7);
    switch (estado) {
      case 'andar':
        return { bI: -ph * 0.6, bD: ph * 0.6,
                 pI: { dx: ph * 1.3, lift: Math.max(0, ph) * 1.1 },
                 pD: { dx: -ph * 1.3, lift: Math.max(0, -ph) * 1.1 } };
      case 'salto':
        return { bI: 2.5, bD: -2.5, pI: { dx: -1.2, lift: 0.8 }, pD: { dx: 1, lift: 0.4 } };
      case 'caer':
        return { bI: 1.3, bD: -1.3, pI: { dx: -0.6, lift: 0 }, pD: { dx: 0.6, lift: 0 } };
      case 'escalera':
        return { bI: 2.2 + ph2 * 0.5, bD: -2.2 - ph2 * 0.5,
                 pI: { dx: ph2 * 0.8, lift: Math.max(0, ph2) * 0.8 },
                 pD: { dx: -ph2 * 0.8, lift: Math.max(0, -ph2) * 0.8 } };
      case 'muerto':
        return { bI: 2.6, bD: -2.6, pI: { dx: -1.5, lift: 0 }, pD: { dx: 1.5, lift: 0 } };
      default:

    }
  }

  // Dibuja al protagonista. x, y: esquina de la caja de colisión (12 × 14)
  function dibujar(g, x, y, opt) {
    opt = opt || {};
    const dir = opt.dir < 0 ? -1 : 1;
    const estado = opt.estado || 'quieto';

    const p = pose(estado, opt.tiempo || 0);

    g.save();
    g.translate(Math.round(x) - 2, Math.round(y) - 4);
    if (dir < 0) { g.translate(16, 0); g.scale(-1, 1); }

    // orden de dibujo: brazos y piernas detrás del cuerpo, cabeza al final
    brazo(g, 4.8, 10.8, p.bI, camisa);
    brazo(g, 11.2, 10.8, p.bD, camisa);
    pierna(g, 6.3, p.pI.dx, p.pI.lift);
    pierna(g, 9.7, p.pD.dx, p.pD.lift);
    torso(g, camisa);
    cabeza(g, estado);

    g.restore();
  }

  global.Protagonista = { dibujar: dibujar, ESTADOS: ['quieto', 'andar', 'salto', 'caer', 'escalera', 'muerto'] };
})(typeof window !== 'undefined' ? window : globalThis);

// alto: alto de su caja de colisión (16 pequeño, 26 grande).
// opt: estado, dir, tiempo (avance de las piernas), sx/sy (escala extra), inclina (radianes), camisa
function dibujarProtagonista(px, py, alto, opt) {
  const { sx = 1, sy = 1, inclina = 0 } = opt;
  const s = alto / 14;
  ctx.save();
  ctx.translate(Math.round(px), Math.round(py));
  ctx.rotate(inclina);
  ctx.scale(s * sx, s * sy);
  Protagonista.dibujar(ctx, -6, -14, { dir: opt.dir, estado: opt.estado, tiempo: opt.tiempo, camisa: opt.camisa });
  ctx.restore();
}

        enemigos: k <= 2 ? enemigos.slice(0, 2) : enemigos,
      },
      mecanicas: (MECANICAS_MUNDO[w] || MECANICAS_POR_FASE)[i],
    };
    if (opc.horas && opc.horas[i] !== undefined) lv.hora = opc.horas[i];
    if (castillo) { lv.jefe = true; if (opc.castillo) lv.castillo = true; }
    return lv;
  });
}

/* Nodos del mapa de un mundo: las fases y las casas de minijuegos en orden,
   repartidos a lo largo de la ruta según la distancia recorrida.
   Cada nodo lleva vec (vecinos anterior y siguiente) para moverse con las flechas. */
function construirMapa(m) {
  const seq = [];
  m.niveles.forEach((nv, i) => {
    seq.push({ ref: i, castillo: i === m.niveles.length - 1 });
    if (m.bonus.includes(i + 1)) seq.push({ bonus: i + 1 });   // casa de minijuegos tras la fase i+1
  });
  const r = m.ruta, largos = [];
  let total = 0;
  for (let i = 1; i < r.length; i++) {
    const d = Math.hypot(r[i][0] - r[i - 1][0], r[i][1] - r[i - 1][1]);
    largos.push(d);
    total += d;
  }
  seq.forEach((nodo, i) => {
    let s = (total * i) / (seq.length - 1), t = 0;
    while (t < largos.length - 1 && s > largos[t]) { s -= largos[t]; t++; }
    const f = largos[t] ? s / largos[t] : 0;
    nodo.x = Math.round(r[t][0] + (r[t + 1][0] - r[t][0]) * f);
    nodo.y = Math.round(r[t][1] + (r[t + 1][1] - r[t][1]) * f);
    nodo.vec = [i - 1, i + 1].filter((j) => j >= 0 && j < seq.length);
  });
  return seq;
}
for (const m of MUNDOS) m.mapa = construirMapa(m);
// Cada fase lleva su clima y su cascada según el mundo (ver climas y cascada en MUNDOS)

});

/* =====================================================================
   7. GENERADOR DE NIVELES
   Cada fase se monta con PIEZAS diseñadas a mano (un reto con sentido cada una),
   unidas por tramos llanos con enemigos. La semilla elige qué piezas salen y en qué orden.
   Devuelve { cols, rows, tiles[][], ents[], plats[], decor[], canones[], start, goalX, ... }
   Tiles: "." vacío, "G" suelo, "B" ladrillo, "Q" bloque ?, "U" bloque usado, "S" piedra,
          "T" tubería, "F" poste de meta, "M" muelle, "H" pinchos, "V" lava, "L" escalera,
          "D" plataforma de una dirección, "Z" bloque oculto (invisible hasta golpearlo desde abajo).
   Plataformas (plats): "movil" (va y viene, en horizontal o en vertical) y "caida" (se cae al pisarla).
   ===================================================================== */
const ROWS = 14;           // 14 tiles * 16px = 224px de alto
const GY = 11;             // fila del suelo (la superior)
// Potenciadores de los bloques P: casi siempre algo que hace crecer
const POTENCIADORES = ["hongo", "hongo", "flor", "pluma"];
// Monedas que da un ladrillo multimoneda (K) antes de quedarse vacío
const MONEDAS_MULTI = 8;
// Enemigos que vuelan: se colocan en el aire, no en el suelo
const VOLADORES = ["flyer", "murcielago", "medusa", "fantasma"];

// Generador pseudoaleatorio determinista (mulberry32): misma semilla = mismo nivel
function prng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Crea una rejilla vacía
function gridVacia(cols) {
  const t = [];
  for (let r = 0; r < ROWS; r++) t.push(new Array(cols).fill("."));
  return t;
}

  // Cañón tras un hueco: saltar el hueco sin chocar con una bala
  { id: "canon_hueco", tipo: "reto", req: "canon", min: 3, mapa: [
    ".....ccc......",
    "..............",
    "..............",
    "............g(",
    "GGGGG...GGGGGG",
  ] },

  // ----- Entradas de la zona secreta (la boca X lleva la flecha amarilla cuando el jugador se acerca) -----
  // Tubería en lo alto de una meseta
  { id: "entrada_meseta", tipo: "entrada", mapa: [
    ".......XT...",
    ".......TT...",
    ".....GGGGGG.",
    ".....GGGGGG.",
    "..SS.GGGGGG.",
    ".....GGGGGG.",
    ".....GGGGGG.",
    "GGGGGGGGGGGG",
  ] },
  // Tubería en una isla alta: se llega por un bloque oculto (la moneda suelta lo delata)
  { id: "entrada_oculta", tipo: "entrada", mapa: [
    ".......XT...",
    "......SSSSSS",
    "............",
    "............",
    "...c........",
    "...$........",
    "............",
    "............",
    "GGGGGGGGGGGG",
  ] },
  // Tubería al fondo de un pozo entre dos columnas
  { id: "entrada_pozo", tipo: "entrada", mapa: [
    "....ccc....",
    "...........",
    "..SS....SS.",
    "..SS....SS.",
    "..SS.XT.SS.",
    "..SS.TT.SS.",
    "GGGGGGGGGGG",
  ] },
  // Tubería por la que se vuelve de la zona secreta, más adelante en la fase (un atajo)
  { id: "salida", tipo: "salida", mapa: [
    "...cc...",
    "........",
    "..RT....",
    "..TT....",
    "GGGGGGGG",
  ] },
];

/* ---------- Nivel en construcción ---------- */
function nuevoNivel(cols, rnd, dif, tipos) {
  const planta = tipos.includes("planta_zombie") ? "planta_zombie" : tipos.includes("plant") ? "plant" : null;
  const sinPlantas = tipos.filter((t) => t !== "plant" && t !== "planta_zombie");
  const voladores = sinPlantas.filter((t) => VOLADORES.includes(t));
  const caminantes = sinPlantas.filter((t) => !VOLADORES.includes(t));
  return {
    cols, tiles: gridVacia(cols), ents: [], plats: [], canones: [], decor: [], rnd, dif, planta,
    caminantes: caminantes.length ? caminantes : voladores, voladores,
    entrada: null, salida: null, start: null, puentes: 0,
    candidatas: null, reserva: null,   // sitios para monedas estrella (solo en las fases generadas)
  };
}

function ponerEnemigo(N, c, r, vuela) {
  const lista = vuela ? N.voladores : N.caminantes;
  if (!lista.length) return;
  N.ents.push({ t: lista[Math.floor(N.rnd() * lista.length)], x: c * TILE, y: r * TILE });
}

function ponerBloque(N, tile, c, r, item) {
  N.tiles[r][c] = tile;
  N.ents.push({ t: "qitem", x: c * TILE, y: r * TILE, item });
}

// Una casilla de la leyenda (ver arriba)
function ponerCelda(N, ch, c, r) {
  if (c < 0 || c >= N.cols || r < 0 || r >= ROWS) return;
  switch (ch) {
    case "G": case "S": case "B": case "D": case "L": case "M": case "H": case "V": case "U": case "T":
      N.tiles[r][c] = ch; break;
    case "p":
      N.tiles[r][c] = "T";
      if (N.planta) N.ents.push({ t: N.planta, x: c * TILE + 1, y: r * TILE - 8 });
      break;
    case "X": N.tiles[r][c] = "T"; N.entrada = { col: c, row: r }; break;
    case "R": N.tiles[r][c] = "T"; N.salida = { col: c, row: r }; break;
    case "Q": ponerBloque(N, "Q", c, r, "moneda"); break;
    case "P": ponerBloque(N, "Q", c, r, POTENCIADORES[Math.floor(N.rnd() * POTENCIADORES.length)]); break;
    case "*": ponerBloque(N, "Q", c, r, "estrella"); break;
    case "1": ponerBloque(N, "Z", c, r, "vida"); break;
    case "$": ponerBloque(N, "Z", c, r, "moneda"); break;
    case "K": ponerBloque(N, "B", c, r, "multi"); break;
    case "c": N.ents.push({ t: "coin", x: c * TILE + 4, y: r * TILE + 4 }); break;
    case "e": ponerEnemigo(N, c, r, false); break;
    case "E": if (N.dif >= 4) ponerEnemigo(N, c, r, false); break;
    case "f": ponerEnemigo(N, c, r, true); break;
    case "(": case ")":
      N.tiles[r][c] = "S";
      // Dos cañones seguidos disparan a destiempo: nunca llegan dos balas a la vez
      N.canones.push({ col: c, row: r, dir: ch === "(" ? -1 : 1, cada: 2.4, velocidad: 90, inicio: 1.2 + 1.2 * (N.canones.length % 2) });
      break;
    case "@": N.start = { x: c * TILE, y: r * TILE }; break;
    // Moneda estrella: en una fase, la celda es un sitio posible; en una sala, es la moneda de la sala (la tercera)
    case "g":
      if (N.candidatas) N.candidatas.push({ c, r });
      else N.ents.push({ t: "grande", x: c * TILE, y: r * TILE, idx: 2 });
      break;
    case "%": if (N.reserva) N.reserva.push({ c, r }); break;
  }
}

// Columna de suelo de una pieza (filas GY a ROWS-1) según el carácter de su última fila
function ponerSuelo(N, ch, c) {
  for (let r = GY; r < ROWS; r++) {
    let t = ".";
    if (ch === "G" || ch === "S") t = ch;
    else if (ch === "v") t = r === GY ? "." : "V";                         // lava un bloque por debajo del suelo
    else if (ch === "h") t = r === GY ? "." : r === GY + 1 ? "H" : "G";   // hoyo de un bloque con pinchos al fondo
    N.tiles[r][c] = t;
  }
}

/* Pega un mapa (filas de arriba abajo) con su esquina superior izquierda en (x0, f0).
   Con suelo = true, la última fila es la del suelo de la pieza. Devuelve el ancho. */
function pegarMapa(N, filas, x0, f0, suelo) {
  const ancho = Math.max(...filas.map((f) => f.length));
  const ult = filas.length - 1;
  const ch = (i, k) => filas[i][k] || (suelo && i === ult ? "G" : ".");
  for (let i = 0; i <= ult; i++) for (let k = 0; k < ancho; k++) {
    if (suelo && i === ult) ponerSuelo(N, ch(i, k), x0 + k);
    else ponerCelda(N, ch(i, k), x0 + k, f0 + i);
  }
  // Tramos seguidos de un carácter en una fila: [fila, primera columna, última columna]
  const tramos = (marca, i) => {
    const out = [];
    for (let k = 0; k < ancho; k++) {
      if (ch(i, k) !== marca) continue;
      let fin = k;
      while (fin + 1 < ancho && ch(i, fin + 1) === marca) fin++;
      out.push([k, fin]);
      k = fin;
    }
    return out;
  };
  for (let i = 0; i <= ult; i++) {
    const r = f0 + i;
    if (suelo && i === ult) {
      // Puente: cada tramo de madera cae al pisarlo y arrastra a los demás en cascada
      for (const [a, b] of tramos("w", i)) {
        const grupo = "puente" + N.puentes++;
        for (let k = a; k <= b; k++) {
          N.plats.push({ t: "caida", madera: true, x: (x0 + k) * TILE, y: GY * TILE, w: TILE, h: TILE, grupo, indice: k - a, tCaida: 0.6 });
        }
      }
      continue;
    }
    // Plataforma móvil de 3 bloques: va y viene a lo largo del recorrido marcado
    for (const [a, b] of tramos("=", i)) {
      N.plats.push({ t: "movil", x: (x0 + a) * TILE, y: r * TILE, w: 3 * TILE, h: TILE, x0: (x0 + a) * TILE, x1: (x0 + Math.max(a, b - 2)) * TILE, vel: 36 });
    }
    // Plataformas que caen: una por tramo
    for (const [a, b] of tramos("_", i)) {
      N.plats.push({ t: "caida", x: (x0 + a) * TILE, y: r * TILE, w: (b - a + 1) * TILE, h: TILE });
    }
  }
  // Ascensor: columna de "^"; la plataforma sube y baja entre la primera y la última fila
  for (let k = 0; k < ancho; k++) {
    for (let i = 0; i < ult; i++) {
      if (ch(i, k) !== "^" || (i > 0 && ch(i - 1, k) === "^")) continue;
      let fin = i;
      while (fin + 1 < ult && ch(fin + 1, k) === "^") fin++;
      N.plats.push({ t: "movil", eje: "y", x: (x0 + k) * TILE, y: (f0 + fin) * TILE, w: 3 * TILE, h: TILE,
                     y0: (f0 + i) * TILE, y1: (f0 + fin) * TILE, vel: 30 });
    }
  }
  return ancho;
}

// Baraja una lista en su sitio (Fisher-Yates) con el generador de la fase
function barajar(lista, rnd) {
  for (let i = lista.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [lista[i], lista[j]] = [lista[j], lista[i]];
  }
  return lista;
}

/* Elige las piezas de una fase: la mecánica nueva de la fase sale al menos dos veces, hay una o más
   puertas (muros que obligan a subir) según la dificultad, y el resto se reparte entre las demás
   mecánicas y los retos básicos. Ninguna pieza sale más de dos veces. */
function elegirPiezas(rnd, dif, mecanicas, secreta, jefe) {
  const vale = (p) => (!p.req || mecanicas.includes(p.req)) && dif >= (p.min || 1) && dif <= (p.max || 8);
  const pool = PIEZAS.filter((p) => (p.tipo === "reto" || p.tipo === "puerta") && vale(p));
  const puertas = pool.filter((p) => p.tipo === "puerta");
  const n = 6 + Math.ceil(dif / 2);
  const nPuertas = Math.min(3, 1 + (dif >= 4) + (dif >= 7));
  const usos = {};
  const elegidas = [];
  const azar = (lista) => lista[Math.floor(rnd() * lista.length)];
  const tomar = (lista) => {
    const libres = lista.filter((p) => (usos[p.id] || 0) < 2);
    if (!libres.length) return null;
    const menos = Math.min(...libres.map((p) => usos[p.id] || 0));   // primero las que menos han salido
    const p = azar(libres.filter((q) => (usos[q.id] || 0) === menos));
    usos[p.id] = (usos[p.id] || 0) + 1;
    elegidas.push(p);
    return p;
  };
  // La mecánica que presenta esta fase (la última de la lista)
  const nueva = mecanicas[mecanicas.length - 1];
  if (nueva) for (let k = 0; k < 2; k++) tomar(pool.filter((p) => p.req === nueva));
  // Puertas: primero las de las mecánicas de la fase, que son más variadas
  while (elegidas.filter((p) => p.tipo === "puerta").length < nPuertas) {
    const conMecanica = puertas.filter((p) => p.req && (usos[p.id] || 0) === 0);
    if (!tomar(conMecanica.length ? conMecanica : puertas)) break;
  }
  // Una pieza de cada una de las demás mecánicas, en orden al azar
  const otras = barajar(mecanicas.filter((m) => m !== nueva), rnd);
  for (const m of otras) if (elegidas.length < n) tomar(pool.filter((p) => p.req === m));
  const retos = pool.filter((p) => p.tipo === "reto");
  while (elegidas.length < n && tomar(retos));
  // Orden al azar, sin dos puertas seguidas
  barajar(elegidas, rnd);
  for (let i = 1; i < elegidas.length; i++) {
    if (elegidas[i].tipo !== "puerta" || elegidas[i - 1].tipo !== "puerta") continue;
    const j = elegidas.findIndex((p, k) => k > i && p.tipo !== "puerta");
    if (j > 0) [elegidas[i], elegidas[j]] = [elegidas[j], elegidas[i]];
  }
  // La fase empieza con una pieza tranquila de bloques
  elegidas.unshift(azar(PIEZAS.filter((p) => p.tipo === "inicio")));
  // Zona secreta: la entrada hacia un tercio de la fase y la salida dos piezas después (es un atajo)
  if (secreta !== undefined && !jefe) {
    const i = Math.max(2, Math.floor(elegidas.length * 0.35));
    elegidas.splice(i, 0, azar(PIEZAS.filter((p) => p.tipo === "entrada")));
    elegidas.splice(Math.min(elegidas.length, i + 3), 0, PIEZAS.find((p) => p.tipo === "salida"));
  }
  return elegidas;
}

// Reparte k sitios a lo largo de la fase: uno al azar en cada tramo de la lista ordenada de izquierda a derecha
function repartir(sitios, k, rnd) {
  const orden = sitios.slice().sort((a, b) => a.c - b.c);
  if (orden.length <= k) return orden;
  const out = [];
  for (let i = 0; i < k; i++) {
    const a = Math.floor((orden.length * i) / k), b = Math.floor((orden.length * (i + 1)) / k);
    out.push(orden[a + Math.floor(rnd() * (b - a))]);
  }
  return out;
}

// Monedas estrella de una fase: tres, o dos si la tercera está en su zona secreta. Se numeran de izquierda a derecha
function ponerGrandes(N, rnd) {
  const k = N.entrada ? 2 : 3;
  let sitios = repartir(N.candidatas, k, rnd);
  if (sitios.length < k) sitios = sitios.concat(repartir(N.reserva, k - sitios.length, rnd)).sort((a, b) => a.c - b.c);
  sitios.forEach((st, i) => N.ents.push({ t: "grande", x: st.c * TILE, y: st.r * TILE, idx: i }));
}

// Tramo llano entre dos piezas: a veces un enemigo, un grupo de bloques o un volador.
// El tramo del punto de control queda sin enemigos
function ponerTramo(N, x, w, tranquilo) {
  const rnd = N.rnd;
  if (tranquilo) return;
  if (rnd() < 0.3 + N.dif * 0.07) ponerEnemigo(N, x + 1 + Math.floor(rnd() * (w - 1)), GY - 1, false);
  if (w >= 5 && rnd() < 0.35) {
    const forma = ["Q", "BQB", "QQ", "BPB", "BKB"][Math.floor(rnd() * 5)];
    const c0 = x + Math.floor((w - forma.length) / 2);
    [...forma].forEach((ch, k) => ponerCelda(N, ch, c0 + k, GY - 4));
  } else if (N.dif >= 3 && N.voladores.length && rnd() < 0.25) {
    ponerEnemigo(N, x + Math.floor(w / 2), 5 + Math.floor(rnd() * 3), true);
  }
}

// Decoración del suelo abierto (arbustos, árboles, rocas...): no es sólida y se dibuja detrás de todo
function decorarSuelo(N, tema, desde, hasta) {
  const piezas = DECOR_DE_TEMA[tema] || [];
  for (let x = desde; x < hasta && piezas.length; x++) {
    if (N.tiles[GY][x] !== "G" || N.rnd() > 0.14) continue;
    const pieza = piezas[Math.floor(N.rnd() * piezas.length)];
    if (pieza.some((_, k) => N.tiles[GY - 1 - k][x] !== ".")) continue;
    pieza.forEach((ch, k) => N.decor.push({ ch, c: x, r: GY - 1 - k }));
    x++;   // deja al menos un tile libre entre dos piezas
  }
}

/* Genera una fase a partir de gen = { seed, dif, enemigos, theme, jefe, secreta } y de sus mecánicas */
function generarNivel(gen, mecanicas = []) {
  const rnd = prng(gen.seed);
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const dif = clamp(gen.dif || 1, 1, 8);
  const tipos = gen.enemigos && gen.enemigos.length ? gen.enemigos : ["walker"];
  const piezas = elegirPiezas(rnd, dif, mecanicas, gen.secreta, gen.jefe);
  const separaciones = piezas.map(() => ri(3, 6));
  const INICIO = 12, ARENA = gen.jefe ? 34 : 0, FINAL = 22;
  const anchoPiezas = piezas.reduce((s, p, i) => s + separaciones[i] + Math.max(...p.mapa.map((f) => f.length)), 0);
  const cols = INICIO + anchoPiezas + 4 + ARENA + FINAL;
  const N = nuevoNivel(cols, rnd, dif, tipos);
  N.candidatas = []; N.reserva = [];
  for (let c = 0; c < cols; c++) ponerSuelo(N, "G", c);
  // Punto de control: en el tramo antes de la pieza de la mitad, y siempre después del atajo de la zona secreta
  const iSalida = piezas.findIndex((p) => p.tipo === "salida");
  const iControl = Math.min(piezas.length - 1, Math.max(Math.floor(piezas.length / 2), iSalida + 1));
  let control = null;

  // Piezas, cada una tras un tramo llano
  let x = INICIO;
  piezas.forEach((p, i) => {
    if (i === iControl) control = { x: (x + 1) * TILE, pie: GY * TILE };
    ponerTramo(N, x, separaciones[i], i === iControl);
    x += separaciones[i];
    x += pegarMapa(N, p.mapa, x, GY - p.mapa.length + 1, true);
  });
  x += 4;
  // Con lava en la fase, los huecos sin fondo son lagos de lava (bajo los puentes y las plataformas también)
  if (mecanicas.includes("lava")) {
    for (let c = 0; c < cols; c++) if (N.tiles[GY][c] === "." && N.tiles[ROWS - 1][c] === ".") for (let r = GY + 1; r < ROWS; r++) N.tiles[r][c] = "V";
  }
  // Castillo: la arena del jefe es el suelo llano antes de la escalinata final
  const arenaX0 = x;
  if (gen.jefe) {
    N.ents.push({ t: "boss", x: (x + 20) * TILE, y: (GY - 1) * TILE - 16 });
    x += ARENA;
  }
  // Escalinata final de piedra (alturas 1 a 5, la cima de dos bloques) y, ocho bloques después, el poste de meta:
  // desde la cima, con un buen salto corriendo se toca alto (más puntos, o una vida por encima del poste)
  for (let k = 0; k < 6; k++) for (let h = 0; h < Math.min(k + 1, 5); h++) N.tiles[GY - 1 - h][x + 2 + k] = "S";
  const goalX = x + 16;
  for (let r = 4; r < GY; r++) N.tiles[r][goalX] = "F";
  decorarSuelo(N, gen.theme, 4, cols - 4);
  ponerGrandes(N, rnd);

  if (gen.jefe) N.ents = N.ents.filter((e) => e.t === "boss" || e.x < arenaX0 * TILE);   // la arena queda libre
  return {
    cols, rows: ROWS, tiles: N.tiles,
    ents: N.ents.filter((e) => e.x >= 10 * TILE),   // el inicio siempre está libre de enemigos
    plats: N.plats, decor: N.decor, canones: N.canones,
    start: { x: 3 * TILE, y: (GY - 2) * TILE },
    goalX: goalX * TILE,
    theme: gen.theme || null,
    boss: !!gen.jefe,
    arenaX0: gen.jefe ? arenaX0 * TILE : 0,
    entradaSecreta: N.entrada ? Object.assign({ sala: gen.secreta }, N.entrada) : null,
    salidaSecreta: N.salida,
    control,
  };
}

/* Convierte un mapa escrito a mano (array de strings de 14 filas, leyenda de las piezas) en un nivel */
function parsearMapa(strs, gen = {}) {
  const cols = Math.max(...strs.map((f) => f.length));
  const tipos = gen.enemigos && gen.enemigos.length ? gen.enemigos : ["walker"];
  const N = nuevoNivel(cols, prng(gen.seed || 1), gen.dif || 1, tipos);
  pegarMapa(N, strs, 0, 0, false);
  const meta = N.tiles.map((f) => f.indexOf("F")).find((c) => c >= 0);
  return {
    cols, rows: ROWS, tiles: N.tiles, ents: N.ents, plats: N.plats, decor: [], canones: N.canones,
    start: N.start || { x: 3 * TILE, y: (GY - 2) * TILE },
    goalX: meta !== undefined ? meta * TILE : (cols - 4) * TILE, theme: null, boss: false, arenaX0: 0,
  };
}

    "SGGGGGGGGGGGGGGGGGGGGGGS",
    "SGGGGGGGGGGGGGGGGGGGGGGS",
    "SGGGGGGGGGGGGGGGGGGGGGGS",
  ] },
  // Torre de plataformas de una dirección, con un potenciador arriba
  { tiempo: 120, sala: true, mapa: [
    "SSSSSSSSSSSSSSSSSSSSSSSS",
    "S......................S",
    "S......................S",
    "S...gccc....P..........S",
    "S...DDDD...............S",
    "S......................S",
    "S........DDDDDD.cccc...S",
    "S......................S",
    "S..DDDD................S",
    "S..cccc............TT..S",
    "S.@................TT..S",
    "SGGGGGGGGGGGGGGGGGGGGGGS",
    "SGGGGGGGGGGGGGGGGGGGGGGS",
    "SGGGGGGGGGGGGGGGGGGGGGGS",
  ] },
  // Rombo de monedas, tres bloques ? y una vida escondida en la pared izquierda
  { tiempo: 120, sala: true, mapa: [
    "SSSSSSSSSSSSSSSSSSSSSSSS",
    "S......................S",
    "S......................S",
    "S......................S",
    "S.........c............S",
    "S........ccc...........S",
    "S..1....ccccc..........S",
    "S......cccgccc.........S",
    "S.......ccccc...QPQ....S",
    "S........ccc.......TT..S",
    "S.@.......c........TT..S",
    "SGGGGGGGGGGGGGGGGGGGGGGS",
    "SGGGGGGGGGGGGGGGGGGGGGGS",
    "SGGGGGGGGGGGGGGGGGGGGGGS",
  ] },

// Tuberías de un nivel: la boca de cada tubo de dos bloques (esquina superior izquierda)
function encontrarTuberias(tiles) {
  const out = [];
  for (let r = 1; r < tiles.length; r++) for (let c = 0; c < tiles[r].length - 1; c++) {
    if (tiles[r][c] === "T" && tiles[r][c + 1] === "T" && tiles[r - 1][c] !== "T" && tiles[r - 1][c + 1] !== "T") out.push({ col: c, row: r });
  }
  return out;
}

// Niveles de relieve suave (al estilo de Super Mario Bros. 3): colinas con pendientes, huecos saltables y bloques flotantes.
// El suelo es una superficie continua por columna (lvl.hm), así que las pendientes son reales (ver superficieEn)
function generarColinas(gen) {
  const rnd = prng(gen.seed * 7 + 3);
  const cols = 230, base = GY * TILE, META = cols - 6;
  // Puntos de control: colinas suaves cada 10-16 columnas (hasta 5 bloques de alto) y escalones de 2-3 bloques
  // en 3 columnas, que hay que saltar. Entre medias, tramos llanos
  const puntos = [{ c: 0, y: base }];
  let c = 0, y = base;
  while (c < cols) {
    if (c >= 18 && c < META - 16 && rnd() < 0.3) {
      c = Math.min(cols, c + 3);
      const salto = (2 + Math.floor(rnd() * 2)) * TILE;
      y = Math.min(base, Math.max(base - 5 * TILE, y + (rnd() < 0.5 ? -salto : salto)));
    } else {
      c = Math.min(cols, c + 10 + Math.floor(rnd() * 7));
      const llano = c >= cols || c < 18 || c > META - 14 || rnd() < 0.35;
      y = llano ? base : base - (1 + Math.floor(rnd() * 5)) * TILE;
    }
    puntos.push({ c, y });
  }
  puntos[puntos.length - 1].y = base;
  const hm = new Array(cols + 1);
  for (let i = 0; i + 1 < puntos.length; i++) {
    const a = puntos[i], b = puntos[i + 1];
    for (let x = a.c; x < b.c; x++) {
      const t = (x - a.c) / (b.c - a.c);
      hm[x] = a.y + (b.y - a.y) * (1 - Math.cos(Math.PI * t)) / 2;
    }
  }
  hm[cols] = base;
  // Huecos saltables (2-3 columnas) en el tramo central, unos cuantos por nivel. Ni cerca de un escalón:
  // un hueco junto a un escalón obligaría a dos saltos seguidos
  const sinEscalonCerca = (x0, w) => {
    for (let k = x0 - 6; k <= x0 + w + 6; k++) if (k > 0 && k < cols - 1 && Math.abs(hm[k + 1] - hm[k]) > 9) return false;
    return true;
  };
  for (let x = 20; x < META - 12; x++) {
    if (rnd() > 0.07) continue;
    const w = rnd() < 0.7 ? 2 : 3;
    if (!sinEscalonCerca(x, w)) continue;
    for (let k = 0; k < w; k++) hm[x + k] = Infinity;
    x += w + 6;
  }
  const N = nuevoNivel(cols, rnd, gen.dif || 1, gen.enemigos && gen.enemigos.length ? gen.enemigos : ["walker"]);
  const { tiles, ents, decor } = N;
  const hoyoCerca = (a, b) => { for (let k = a - 6; k <= b + 6; k++) if (hm[k] === Infinity) return true; return false; };
  // Tramo llano alineado con la rejilla (la superficie es el borde de un bloque) de x0 a x1
  const llano = (x0, x1) => {
    const s = hm[x0];
    if (!isFinite(s) || s % TILE !== 0) return false;
    for (let k = x0; k <= x1 + 1; k++) if (hm[k] !== s) return false;
    return true;
  };
  // Zona secreta: la entrada hacia un tercio del nivel y la salida más adelante, sobre suelo llano
  const ocupado = new Set();   // columnas de las tuberías: sin bloques ni enemigos encima
  const tuberia = (desde, hasta, marca) => {
    for (let x = desde; x < hasta; x++) {
      if (!llano(x - 1, x + 2) || hoyoCerca(x, x + 1)) continue;
      const r = hm[x] / TILE - 2;
      ponerCelda(N, marca, x, r); ponerCelda(N, "T", x + 1, r);
      ponerCelda(N, "T", x, r + 1); ponerCelda(N, "T", x + 1, r + 1);
      for (let k = x - 3; k <= x + 4; k++) ocupado.add(k);
      return true;
    }
    return false;
  };
  if (gen.secreta !== undefined && tuberia(Math.floor(META * 0.3), Math.floor(META * 0.55), "X")) {
    if (!tuberia(Math.floor(META * 0.65), META - 14, "R")) tuberia(Math.floor(META * 0.58), META - 5, "R");
  }
  // Monedas: guías sobre los huecos (tres bloques por encima del borde más alto) y arcos sobre las colinas
  const bordeHueco = (x) => {
    let a = x, b = x;
    while (a > 0 && hm[a] === Infinity) a--;
    while (b < cols && hm[b] === Infinity) b++;
    return Math.min(hm[a], hm[b]);
  };
  for (let x = 18; x < META - 14; x++) {
    if (hm[x] === Infinity) ents.push({ t: "coin", x: x * TILE + 4, y: Math.floor(bordeHueco(x) / TILE) * TILE - 3 * TILE + 4 });
    else if (x % 9 === 0 && rnd() < 0.4) {
      for (let k = -1; k <= 1; k++) if (hm[x + k] !== Infinity) ents.push({ t: "coin", x: (x + k) * TILE + 4, y: Math.round(hm[x + k] - 26) });
    }
  }
  // Grupos de bloques sobre tramos llanos, a cuatro bloques del suelo (como en la pradera clásica):
  // la fila se golpea desde el suelo y, en los grupos con un ? encima, ese ? se alcanza desde la fila.
  // Nunca junto a un hueco: un bloque sobre la entrada del salto golpea la cabeza y se cae
  const FORMAS = [["BQB"], ["QQQ"], ["BPB"], ["BKB"], ["..Q..", "BBPBB"], ["..P..", "BQBQB"]];
  let ocultoPuesto = false;
  // Bajo el grupo, el suelo apenas sube o baja (como mucho bloque y medio) y la fila queda a cuatro bloques
  // de su punto más alto
  for (let x = 22; x < META - 16; x++) {
    if (rnd() > 0.12) continue;
    const forma = FORMAS[Math.floor(rnd() * FORMAS.length)];
    const w = forma[0].length;
    const bajo = hm.slice(x - 1, x + w + 2);
    if (bajo.some((v) => !isFinite(v)) || Math.max(...bajo) - Math.min(...bajo) > 24) continue;
    if (hoyoCerca(x, x + w) || ocupado.has(x) || ocupado.has(x + w)) continue;
    const fila = Math.floor(Math.min(...bajo) / TILE) - 4 - (forma.length - 1) * 4;
    if (fila < 2) continue;
    forma.forEach((linea, i) => [...linea].forEach((ch, k) => ponerCelda(N, ch, x + k, fila + i * 4)));
    x += w + 8;
  }
  // Monedas estrella: altas sobre los huecos (hay que saltar fuerte) y sobre las cimas de las colinas
  N.candidatas = []; N.reserva = [];
  for (let x = 20; x < META - 12; x++) {
    if (hm[x] === Infinity && hm[x - 1] !== Infinity) {
      let b = x; while (hm[b + 1] === Infinity) b++;
      N.candidatas.push({ c: Math.floor((x + b) / 2), r: Math.floor(bordeHueco(x) / TILE) - 5 });
    } else if (isFinite(hm[x]) && hm[x] <= base - 3 * TILE && hm[x] <= hm[x - 1] && hm[x] < hm[x + 1] && !ocupado.has(x)) {
      N.candidatas.push({ c: x, r: Math.floor(hm[x] / TILE) - 4 });
    }
  }
  N.candidatas = N.candidatas.filter((st) => st.r >= 2 && !ocupado.has(st.c));
  ponerGrandes(N, rnd);
  // Punto de control hacia la mitad, en suelo casi llano, lejos de huecos y de las tuberías
  let control = null;
  for (let x = Math.floor(META / 2); x < META - 20 && !control; x++) {
    if (isFinite(hm[x]) && Math.abs(hm[x + 1] - hm[x]) < 2 && !hoyoCerca(x, x) && !ocupado.has(x)) control = { x: x * TILE, pie: hm[x] };
  }
  // Una vida escondida en un bloque oculto sobre un tramo llano sin nada encima
  for (let x = 40; x < META - 30 && !ocultoPuesto; x++) {
    if (rnd() > 0.05 || !llano(x - 1, x + 1) || hoyoCerca(x, x) || ocupado.has(x)) continue;
    const fila = hm[x] / TILE - 4;
    let libre = fila >= 2;
    for (let r = 0; r < hm[x] / TILE && libre; r++) for (let k = x - 1; k <= x + 1; k++) if (tiles[r][k] !== ".") libre = false;
    if (!libre) continue;
    ponerCelda(N, "1", x, fila);
    ocultoPuesto = true;
  }
  // Enemigos del mundo que caminan (o vuelan) sobre los tramos llanos
  const tipos = N.caminantes.concat(N.voladores);
  for (let x = 18; x < META - 16 && tipos.length; x++) {
    if (rnd() > 0.045 + 0.01 * (gen.dif || 1)) continue;
    if (hm[x] === Infinity || hm[x + 4] === Infinity || Math.abs(hm[x + 4] - hm[x]) > 6 || ocupado.has(x)) continue;
    const t = tipos[Math.floor(rnd() * tipos.length)];
    if (VOLADORES.includes(t)) ents.push({ t, x: x * TILE, y: Math.max(2, Math.floor(hm[x] / TILE) - 4) * TILE });
    else ents.push({ t, x: x * TILE, y: Math.round(hm[x]) - TILE });
    x += 6;
  }
  // Arbustos y flores sobre el suelo llano
  for (let x = 4; x < META - 8; x++) {
    if (hm[x] === Infinity || rnd() > 0.1 || Math.abs(hm[x + 2] - hm[x]) > 4 || ocupado.has(x)) continue;
    decor.push({ c: x, r: Math.floor(hm[x] / TILE) - 1, ch: rnd() < 0.7 ? "b" : "f" });
  }
  for (let r = 4; r < GY; r++) tiles[r][META] = "F";   // poste de meta
  return {
    cols, rows: ROWS, tiles, ents, plats: [], decor, canones: [],
    start: { x: 3 * TILE, y: Math.round(hm[3]) - TILE },
    goalX: META * TILE, theme: gen.theme || null, boss: false, arenaX0: 0, hm,
    entradaSecreta: N.entrada ? Object.assign({ sala: gen.secreta }, N.entrada) : null,
    salidaSecreta: N.salida,
    control,
  };
}

/* Última pasada sobre cualquier nivel: nada fuera de sitio. Quita las monedas que tocan un bloque,
   una tubería, el terreno de las colinas o una plataforma, y los enemigos que nacerían dentro de un bloque */
function sanearNivel(lv) {
  const ocupada = (c, r) => {
    if (c < 0 || c >= lv.cols || r < 0 || r >= ROWS) return false;
    const t = lv.tiles[r][c];
    return t !== "." && t !== "L";
  };
  const tocaAlgo = (x, y, w, h) => {
    for (let r = Math.floor(y / TILE); r <= Math.floor((y + h - 0.01) / TILE); r++)
      for (let c = Math.floor(x / TILE); c <= Math.floor((x + w - 0.01) / TILE); c++) if (ocupada(c, r)) return true;
    if (lv.hm && y + h > superficieMin(lv, x, w)) return true;
    return (lv.plats || []).some((p) => x < p.x + p.w && x + w > p.x && y < p.y + p.h && y + h > p.y);
  };
  const monedas = new Set();
  const grandes = lv.ents.filter((e) => e.t === "grande");
  const sobreGrande = (x, y) => grandes.some((g) => x < g.x + TILE && x + 8 > g.x && y < g.y + TILE && y + 10 > g.y);
  const junto = (e) => lv.control && Math.abs(e.x - lv.control.x) < 4 * TILE;
  lv.ents = lv.ents.filter((e) => {
    if (e.t === "grande") return true;
    if (e.t === "coin") {
      const k = e.x + "," + e.y;
      if (monedas.has(k) || tocaAlgo(e.x, e.y, 8, 10) || sobreGrande(e.x, e.y)) return false;
      monedas.add(k);
      return true;
    }
    if (e.t === "qitem") return "QZB".includes(lv.tiles[Math.floor(e.y / TILE)][Math.floor(e.x / TILE)]);
    if (e.t === "boss" || e.t === "plant" || e.t === "planta_zombie") return true;
    if (junto(e)) return false;   // al volver al punto de control no hay un enemigo encima
    return !ocupada(Math.floor((e.x + TILE / 2) / TILE), Math.floor((e.y + TILE / 2) / TILE));
  });
  return lv;
}

/* Punto de entrada: usa el mapa escrito a mano si existe, si no genera */
function construirNivel(def, tema) {
  // Los niveles de castillo no llevan decoración de su mundo (usan su propio escenario)
  const gen = Object.assign({ theme: def.castillo ? "castillo" : tema }, def.gen, { jefe: def.jefe, secreta: def.secreta });
  const lv = def.mapa ? parsearMapa(def.mapa, gen) : def.colinas ? generarColinas(gen) : generarNivel(gen, def.mecanicas || []);
  lv.nombre = def.nombre;
  lv.tiempo = def.tiempo || 300;
  if (def.sala) lv.goalX = 1e9;                       // las salas secretas no tienen meta: se sale por su tubería
  return sanearNivel(lv);
}

/* =====================================================================
   8. COLISIÓN CON TILES Y FÍSICA DEL JUGADOR
   Movimiento por ejes: primero X (y paredes), luego Y (suelo/techo).
   ===================================================================== */
const SOLIDOS = { G: 1, B: 1, Q: 1, S: 1, T: 1, U: 1, M: 1, H: 1 };   // H: pinchos (bloquean de lado)

// Devuelve el carácter del tile en (col,fila); fuera del nivel: lateral = pared, abajo = vacío
function tileAt(lvl, col, row) {
  if (col < 0 || col >= lvl.cols) return "S";
  if (row < 0) return ".";
  if (row >= lvl.rows) return ".";
  return lvl.tiles[row][col];
}

// Recorre los tiles que toca un rectángulo y devuelve true si alguno es sólido
// ----- Pendientes y colinas: en un nivel de colinas, lvl.hm guarda la altura del suelo en cada columna (px) -----
const CLIMB_MAX = 9;   // escalón que la caja sube sin chocar, en píxeles
const SNAP_MAX = 9;    // hueco bajo los pies que se cierra al bajar una pendiente

// Altura de la superficie en x (px, hacia abajo); Infinity si no hay suelo (un hueco)
function superficieEn(lvl, x) {
  const c = Math.floor(x / TILE);
  if (c < 0 || c >= lvl.cols) return Infinity;
  const a = lvl.hm[c];
  if (a === Infinity) return Infinity;
  const b = lvl.hm[c + 1];
  if (b === Infinity) return a;
  return a + (b - a) * ((x - c * TILE) / TILE);
}

// La superficie más alta bajo el ancho de una caja: es la que sostiene la caja
function superficieMin(lvl, x, w) {
  let m = Infinity;
  for (let i = 0; i <= 4; i++) m = Math.min(m, superficieEn(lvl, x + (w * i) / 4));
  return m;
}

// Caja que choca de lado con una pendiente: si la superficie sube poco, la caja sube por ella
function subirPendiente(lvl, e) {
  // También al saltar: un salto que nace junto a una pendiente que sube no debe frenar la caja
  const sup = superficieMin(lvl, e.x, e.w), base = e.y + e.h;
  if (!(sup < base) || base - sup > CLIMB_MAX) return false;
  const y0 = e.y;
  e.y = sup - e.h;
  if (tocaTiles(lvl, e.x, e.y, e.w, e.h)) { e.y = y0; return false; }
  return true;
}

function tocaSolido(lvl, x, y, w, h) {
  if (tocaTiles(lvl, x, y, w, h)) return true;
  return !!lvl.hm && y + h > superficieMin(lvl, x, w);
}

function tocaTiles(lvl, x, y, w, h) {
  const c0 = Math.floor(x / TILE), c1 = Math.floor((x + w - 0.01) / TILE);
  const r0 = Math.floor(y / TILE), r1 = Math.floor((y + h - 0.01) / TILE);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (SOLIDOS[tileAt(lvl, c, r)]) return true;
  }
  return false;
}

/* Mueve una entidad {x,y,w,h,vx,vy} resolviendo colisiones por ejes.
   Devuelve { lado, techo, suelo } para saber qué tocó. */
function moverEntidad(lvl, e, dt) {
  const res = { pared: false, techo: false, suelo: false };
  // --- Eje X ---
  const xAntes = e.x;
  e.x += e.vx * dt;
  if (tocaSolido(lvl, e.x, e.y, e.w, e.h)) {
    if (lvl.hm && !tocaTiles(lvl, e.x, e.y, e.w, e.h)) {
      // Solo la superficie de colinas: o sube la pendiente, o es un muro y se vuelve atrás
      if (!subirPendiente(lvl, e)) { e.x = xAntes; res.pared = true; e.vx = 0; }
    } else {
      res.pared = true;
      if (e.vx > 0) e.x = Math.floor((e.x + e.w) / TILE) * TILE - e.w;
      else e.x = Math.floor(e.x / TILE + 1) * TILE;
      e.vx = 0;
    }
  }
  // --- Eje Y ---
  e.y += e.vy * dt;
  if (tocaSolido(lvl, e.x, e.y, e.w, e.h)) {
    const enTiles = tocaTiles(lvl, e.x, e.y, e.w, e.h);
    if (e.vy > 0) {
      if (!enTiles && lvl.hm) e.y = superficieMin(lvl, e.x, e.w) - e.h;   // aterriza en la pendiente
      else e.y = Math.floor((e.y + e.h) / TILE) * TILE - e.h;
      res.suelo = true;
    } else if (!enTiles && lvl.hm) {
      e.y = superficieMin(lvl, e.x, e.w) - e.h;   // dentro de una pendiente: se saca fuera, sin techo
      res.suelo = true;
    } else {
      e.y = Math.floor(e.y / TILE + 1) * TILE;
      res.techo = true;
    }
    e.vy = 0;
  }
  // Pegarse a la superficie al bajar una pendiente: si iba en el suelo y queda un hueco pequeño, se baja
  if (lvl.hm && e.onGround && e.vy >= 0 && !res.suelo) {
    const sup = superficieMin(lvl, e.x, e.w), hueco = sup - (e.y + e.h);
    if (hueco >= -0.5 && hueco <= SNAP_MAX) { e.y = sup - e.h; e.vy = 0; res.suelo = true; }
  }
  return res;
}

// Tile que hay bajo los pies (la base de la caja): true si es del tipo indicado
function bajoPies(lvl, p, tipo) {
  const R = Math.floor((p.y + p.h) / TILE);
  const c0 = Math.floor(p.x / TILE), c1 = Math.floor((p.x + p.w - 0.01) / TILE);
  for (let c = c0; c <= c1; c++) if (tileAt(lvl, c, R) === tipo) return true;
  return false;
}

// Escalera: la caja del jugador toca una columna de escalera en su centro
function enEscalera(lvl, p) {
  const c = Math.floor((p.x + p.w / 2) / TILE);
  const r0 = Math.floor(p.y / TILE), r1 = Math.floor((p.y + p.h - 0.01) / TILE);
  for (let r = r0; r <= r1; r++) if (tileAt(lvl, c, r) === "L") return true;
  return false;
}

/* Plataformas de una dirección ('D'): la base cruza su borde superior cayendo y la caja queda encima.
   Por debajo, la plataforma no se toca: se puede saltar a través de ella. */
function aterrizaEnDireccional(lvl, p, basePrev) {
  const base = p.y + p.h;
  const R = Math.floor(base / TILE);
  if (basePrev > R * TILE + 0.5) return false;
  const c0 = Math.floor(p.x / TILE), c1 = Math.floor((p.x + p.w - 0.01) / TILE);
  for (let c = c0; c <= c1; c++) {
    if (tileAt(lvl, c, R) === "D") { p.y = R * TILE - p.h; return true; }
  }
  return false;
}

/* =====================================================================
   9. JUGADOR
   Estados: pequeño/grande, fuego, capa (planeo) e invencible (estrella).
   ===================================================================== */
const PHYS = {
  walkAccel: 700, runAccel: 900, airAccel: 520,
  maxWalk: 95, maxRun: 165,
  friction: 620,
  jumpV: 300, jumpHoldG: 520,  // gravedad reducida mientras se mantiene salto
  spinV: 250, spinTime: 0.42,
  coyote: 0.1, buffer: 0.12,
  glideV: 70, glideTime: 1.6,  // planeo con capa
  shellSpeed: 230,
  climbV: 110,    // velocidad al trepar por una escalera
  springV: 500,   // impulso de un muelle: unos 8 bloques de altura, con o sin mantener salto
};

class Player {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.w = 12; this.h = 16;   // hitbox pequeño (el sprite es de 16x22)
    this.pose = "quieto";       // pose visual actual (ver dibujarJugador)
    this.zancada = 0;           // distancia recorrida en el suelo: marca el ciclo de piernas
    this.frenadoT = 0;          // tiempo de derrape al cambiar de dirección a toda velocidad
    this.aterrizajeT = 0;       // tiempo de aplastamiento al aterrizar
    this.facing = 1;
    this.onGround = false;
    this.coyoteT = 0;        // tiempo desde que dejó el suelo
    this.bufferT = 0;        // tiempo desde que se pulsó saltar
    this.jumping = false;    // salto en curso (se puede soltar para cortarlo)
    this.spinT = 0;          // temporizador del salto giratorio
    this.glideT = 0;         // planeo restante
    this.big = false;
    this.fire = false;
    this.rebotando = false;   // rebote de muelle o de pinchos: sube sin cortarse hasta el punto más alto
    this.cape = false;
    this.star = 0;           // segundos de invencibilidad
    this.hurtT = 0;          // segundos de animación de daño / invulnerabilidad
    this.animT = 0;          // reloj de animación
    this.carrying = null;    // caparazón que lleva en la mano
    this.dead = false;
    this.duck = false;
    this.trepando = false;   // agarrado a una escalera
    this.plat = null;        // plataforma móvil sobre la que está de pie
  }

  // Aplica el estado de tamaño (pequeño = 10x14, grande = 10x20)
  setBig(b) {
    if (b === this.big) return;
    const bottom = this.y + this.h;
    this.big = b;
    this.h = b ? 26 : 16;
    this.y = bottom - this.h; // crece hacia arriba, nunca se mete en el suelo
  }

  get invencible() { return this.star > 0 || this.hurtT > 0; }

  // Hace daño: reduce el poder o muere si era pequeño
  golpear() {
    if (this.invencible) return "ignorado";
    if (this.fire || this.cape) { this.fire = false; this.cape = false; this.hurtT = 1.5; return "pierde-poder"; }
    if (this.big) { this.setBig(false); this.hurtT = 1.5; return "encoge"; }
    this.dead = true;
    return "muere";
  }

  // Lógica del jugador por frame (entrada + física + colisiones)
  update(dt, lvl, game) {
    this.prevBottom = this.y + this.h;   // base del jugador antes de moverse (para pisotones)
    this.animT += dt;
    if (this.star > 0) this.star -= dt;
    if (this.hurtT > 0) this.hurtT -= dt;

    const izq = held.left, der = held.right;
    const corre = held.run > 0;
    // Derrape: cambiar de dirección en el suelo a buena velocidad
    const dirH = (der ? 1 : 0) - (izq ? 1 : 0);
    if (this.onGround && dirH !== 0 && Math.sign(this.vx) === -dirH && Math.abs(this.vx) > 90 && this.frenadoT <= 0) {
      this.frenadoT = 0.22;
      emitir(this.x + this.w / 2, this.y + this.h, 4, ["#e8e8f0", "#c8c8d8"], { up: 30, spread: 60, life: 0.3, size: 2 });
    }
    if (this.frenadoT > 0) this.frenadoT -= dt;
    this.duck = held.down && this.onGround && this.big;

    // --- Movimiento horizontal ---
    const dir = (der ? 1 : 0) - (izq ? 1 : 0);
    const maxV = corre ? PHYS.maxRun : PHYS.maxWalk;
    const acc = this.onGround ? (corre ? PHYS.runAccel : PHYS.walkAccel) : PHYS.airAccel;
    if (dir !== 0 && !this.duck) {
      this.facing = dir;
      if (Math.abs(this.vx) < maxV || Math.sign(this.vx) !== dir) this.vx += dir * acc * dt;
      if (Math.abs(this.vx) > maxV) this.vx = Math.sign(this.vx) * Math.max(maxV, Math.abs(this.vx) - 400 * dt);
    } else {
      // Fricción: frena suavemente al soltar la dirección
      const f = PHYS.friction * dt;
      if (Math.abs(this.vx) <= f) this.vx = 0;
      else this.vx -= Math.sign(this.vx) * f;
    }
    // Durante el derrape se frena más fuerte
    if (this.frenadoT > 0 && this.onGround) this.vx -= Math.sign(this.vx) * PHYS.friction * 1.6 * dt;
    if (this.duck) this.vx = 0;

    // --- Escaleras: con arriba o abajo se trepa; saltar suelta la escalera ---
    if (!enEscalera(lvl, this)) this.trepando = false;
    else if (!this.trepando && (held.up || held.down)) { this.trepando = true; this.vx = 0; }   // al agarrarla se para: no se sale de la columna
    if (this.trepando && pressed.jump) { this.trepando = false; this.coyoteT = PHYS.coyote; }
    if (this.trepando) {
      this.vy = held.up ? -PHYS.climbV : held.down ? PHYS.climbV : 0;
      this.jumping = false;
    }

    // --- Salto: buffer (recordar pulsación) y coyote time (saltar tras caer) ---
    if (consume("jump")) this.bufferT = PHYS.buffer;
    else this.bufferT -= dt;
    this.coyoteT = this.onGround ? PHYS.coyote : this.coyoteT - dt;

    if (this.bufferT > 0 && this.coyoteT > 0 && !this.duck) {
      this.vy = -PHYS.jumpV - Math.abs(this.vx) * 0.25;
      this.bufferT = 0; this.coyoteT = 0;
      this.jumping = true;
      this.onGround = false;
      game.sfx("salto");
    }

    // --- Salto giratorio (C / Shift): rebota y rompe bloques giratorios ---
    if (consume("spin") && !this.onGround && this.spinT <= 0) {
      this.spinT = PHYS.spinTime;
      this.vy = Math.min(this.vy, -PHYS.spinV * 0.5);
      game.sfx("giro");
    }
    if (this.spinT > 0) this.spinT -= dt;

    // --- Planeo con capa: mantener salto en el aire ---
    if (this.cape && !this.onGround && held.jump && this.vy > 0 && this.glideT > 0) {
      this.vy = Math.min(this.vy, PHYS.glideV);
      this.glideT -= dt;
    }
