    if (o.abierta) elipse(g, 0, -49, 2, 1.6, OUT, 0, 0.1);
    else linea(g, [[-2, -49], [2, -49]], OUT, 0.9);
  }

  // Faraón de arena: momia con vendas, nemes y cetro
  function cuerpoArena(g, d, o) {
    const c = d.c;
    // vendas que ondean detrás
    [[-7, -40, -24 + Math.sin(o.anim * 3) * 2, -20, -27, -6], [-7, -28, -22 + Math.sin(o.anim * 3 + 1) * 2, -14, -20, 2]]
      .forEach(function (v) {
        g.lineCap = 'round';
        g.strokeStyle = OUT; g.lineWidth = 5.5;
        g.beginPath(); g.moveTo(v[0], v[1]); g.quadraticCurveTo(v[2], v[3], v[4], v[5]); g.stroke();
        g.strokeStyle = c[0]; g.lineWidth = 3.2;
        g.beginPath(); g.moveTo(v[0], v[1]); g.quadraticCurveTo(v[2], v[3], v[4], v[5]); g.stroke();
      });
    // piernas envueltas
    [[-7, o.paso], [1, -o.paso]].forEach(function (p) {
      const x = p[0], alza = Math.max(0, p[1]) * 2;
      g.fillStyle = grad(g, 0, -14, 0, 0, c);
      rr(g, x, -14 - alza, 6, 14, 2); g.fill(); trazar(g);
      linea(g, [[x, -12 - alza], [x + 6, -12 - alza], [x, -8 - alza], [x + 6, -8 - alza]], c[2], 0.5);
      elipse(g, x + 3, -1 - alza, 4.5, 2, d.sombra);
    });
    // cuerpo estrecho con vendas horizontales
    g.fillStyle = grad(g, -10, 0, 10, 0, c);
    rr(g, -10, -44, 20, 32, 4); g.fill(); trazar(g, 0.9);
    g.strokeStyle = c[2]; g.lineWidth = 0.7; g.globalAlpha = 0.6;
    for (let y = -42; y < -12; y += 4) { g.beginPath(); g.moveTo(-10, y); g.lineTo(10, y); g.stroke(); }
    g.globalAlpha = 1;
    // brazos cruzados sobre el pecho
    g.fillStyle = c[1];
    rr(g, -9, -34, 18, 6, 3); g.fill(); trazar(g, 0.7);
    elipse(g, -6, -31, 2, 2, c[0], 0, 0.5); elipse(g, 6, -31, 2, 2, c[0], 0, 0.5);
    // cetro con ankh que puede alzarse
    g.save();
    g.translate(12, -30); g.rotate(o.brazo * 0.5);
    linea(g, [[0, 0], [1.5, 24]], d.acento, 1.4);
    g.strokeStyle = d.acento; g.lineWidth = 1.2;
    g.beginPath(); g.ellipse(0, -3, 2.2, 3, 0, 0, Math.PI * 2); g.stroke();
    g.restore();
    // nemes: paños a los lados y franjas doradas
    poligono(g, [[-9, -56], [-8, -71], [8, -71], [9, -56], [11, -40], [-11, -40]], c[1], 0.8);
    [-5, 0, 5].forEach(function (x) { linea(g, [[x, -70], [x, -42]], d.acento, 0.9); });
    // cara con kohl
    g.fillStyle = c[0];
    rr(g, -6, -58, 12, 15, 4); g.fill(); trazar(g, 0.7);
    poligono(g, [[-4.5, -52], [-2, -53.2], [0.5, -52], [-2, -51]], OUT, 0.1);
    poligono(g, [[1.5, -52], [3.5, -53.2], [5.5, -52], [3.5, -51]], OUT, 0.1);
    if (o.abierta) elipse(g, 0, -47, 1.8, 1.4, OUT, 0, 0.1);
    else linea(g, [[-1.5, -46], [1.5, -46]], OUT, 0.8);
    if (d.corona) {
      poligono(g, [[-1.4, -63], [0, -68], [1.4, -63]], d.acento, 0.5);
      elipse(g, 0, -61.5, 1.8, 1.5, d.acento, 0, 0.5);
    }
  }

  // Golem Koopa: bloque de piedra redondo, con cristales y puños
  function cuerpoGolem(g, d, o) {
    const c = d.c;
    [[-12, o.paso], [12, -o.paso]].forEach(function (p) {
      const x = p[0], alza = Math.max(0, p[1]) * 2.2;
      elipse(g, x, -5 - alza, 7, 6, c[1]);
    });
    // cuerpo: roca redonda con surcos
    g.fillStyle = radial(g, -6, -34, 2, 26, c);
    g.beginPath(); g.ellipse(0, -24, 23, 21, 0, 0, Math.PI * 2); g.fill(); trazar(g, 1);
    linea(g, [[-14, -28], [-6, -36]], c[2], 1);
    linea(g, [[4, -42], [10, -30]], c[2], 1);
    linea(g, [[-18, -14], [-8, -8]], c[2], 1);
    linea(g, [[6, -12], [16, -20]], c[2], 1);
    // cristales que sobresalen
    [[-14, -36, 3.2, 9], [-2, -44, 3.6, 11], [12, -40, 3, 9]].forEach(function (k) {
      poligono(g, [[k[0], k[1] - k[3]], [k[0] + k[2], k[1]], [k[0], k[1] + 3], [k[0] - k[2], k[1]]], d.acento, 0.7);
      g.fillStyle = 'rgba(255,255,255,0.7)';
      g.beginPath(); g.arc(k[0] - k[2] * 0.3, k[1] - k[3] * 0.4, 0.8, 0, Math.PI * 2); g.fill();
    });
    // cara en el frente, con ojos brillantes
    elipse(g, 12, -24, 8, 7, c[0]);
    elipse(g, 14, -27, 2, 1.8, d.ojos, 0, 0.5);
    linea(g, [[9, -31], [15, -29]], OUT, 1.1);
    if (o.abierta) elipse(g, 15, -19, 2.4, 1.6, OUT, 0, 0.1);
    else linea(g, [[10, -18], [16, -18]], OUT, 1);
    // puño izquierdo
    elipse(g, -22, -16, 6.5, 6.5, c[1]);
    linea(g, [[-25, -18], [-22, -14]], c[2], 0.6);
    // brazo derecho, puede alzarse
    g.save();
    g.translate(20, -22); g.rotate(o.brazo);
    g.fillStyle = c[1]; rr(g, -3, 0, 6, 10, 3); g.fill(); trazar(g);
    elipse(g, 0, 12, 6.5, 6.5, c[0]);
    g.restore();
  }

  // Rey Selvático: planta carnívora con tallo, hojas y mandíbulas
  function cuerpoSelva(g, d, o) {
    const c = d.c;
    // raíces que hacen de patas
    [[-8, o.paso], [8, -o.paso]].forEach(function (p) {
      const x = p[0], alza = Math.max(0, p[1]) * 2;
      linea(g, [[x * 0.3, -6], [x, -2], [x + (x < 0 ? -6 : 6), -alza]], OUT, 4.2);
      linea(g, [[x * 0.3, -6], [x, -2], [x + (x < 0 ? -6 : 6), -alza]], c[2], 2.2);
    });
    // tallo con segmentos
    g.lineCap = 'round';
    g.strokeStyle = OUT; g.lineWidth = 11;
    g.beginPath(); g.moveTo(0, -6); g.quadraticCurveTo(-4, -26, 0, -40); g.stroke();
    g.strokeStyle = c[1]; g.lineWidth = 8;
    g.beginPath(); g.moveTo(0, -6); g.quadraticCurveTo(-4, -26, 0, -40); g.stroke();
    [-12, -20, -28, -36].forEach(function (y) { linea(g, [[-3, y], [3, y + 0.5]], c[2], 0.7); });
    // hojas
    elipse(g, -10, -18, 7, 3, c[0], -0.5);
    elipse(g, 9, -14, 7, 3, c[1], 0.5);
    // bulbo de la cabeza, con manchas
    elipse(g, 0, -42, 13, 10, grad(g, -13, -52, 13, -32, c));
    elipse(g, -5, -46, 1.6, 1.6, d.acento, 0, 0.3);
    elipse(g, 5, -38, 1.2, 1.2, d.acento, 0, 0.3);
    // mandíbulas: se abren al atacar
    const abre = o.abierta ? 1 : 0;
    g.fillStyle = '#5a0a1a';
    g.beginPath(); g.ellipse(0, -40, 12, 6, 0, 0, Math.PI * 2); g.fill();
    // dientes
    g.fillStyle = '#ffffff';
    [-9, -5, -1, 3, 7, 11].forEach(function (x) {
      g.beginPath(); g.moveTo(x - 1, -40 - abre * 2); g.lineTo(x + 1, -40 - abre * 2); g.lineTo(x, -37 - abre * 2); g.closePath(); g.fill();
    });
    // mandíbula inferior
    g.fillStyle = c[1];
    g.beginPath(); g.ellipse(0, -39 + abre * 4, 12, 5, 0, 0, Math.PI); g.fill(); trazar(g);
    // mandíbula superior
    g.fillStyle = c[0];
    g.beginPath(); g.ellipse(0, -43 - abre * 4, 13, 7, 0, Math.PI, 0); g.fill(); trazar(g);
    // ojo enfadado en el lateral
    elipse(g, 7, -46 - abre * 4, 2.2, 2.4, '#ffffff', 0, 0.5);
    elipse(g, 7.6, -46 - abre * 4, 1.1, 1.1, d.ojos, 0, 0.1);
    linea(g, [[4, -50 - abre * 4], [9, -48 - abre * 4]], OUT, 0.9);
  }

  // Rey Abisal: medusa que flota, con tentáculos ondulantes y un farol
  function cuerpoAbisal(g, d, o) {
    const c = d.c, t = o.anim;
    // tentáculos ondulantes
    for (let i = 0; i < 6; i++) {
      const x = -12 + i * 4.8;
      g.lineCap = 'round';
      g.strokeStyle = OUT; g.lineWidth = 3.4;
      g.beginPath(); g.moveTo(x, -32);
      g.bezierCurveTo(x + Math.sin(t * 3 + i) * 4, -24, x - Math.sin(t * 3 + i + 1) * 4, -14, x + Math.sin(t * 2.5 + i * 0.7) * 3, -1);
      g.stroke();
      g.strokeStyle = d.melena; g.lineWidth = 1.7;
      g.beginPath(); g.moveTo(x, -32);
      g.bezierCurveTo(x + Math.sin(t * 3 + i) * 4, -24, x - Math.sin(t * 3 + i + 1) * 4, -14, x + Math.sin(t * 2.5 + i * 0.7) * 3, -1);
      g.stroke();
    }
    // aletas laterales
    poligono(g, [[-16, -30], [-25, -38], [-19, -22]], d.acento, 0.6);
    poligono(g, [[16, -30], [25, -38], [19, -22]], d.acento, 0.6);
    // campana translúcida
    g.fillStyle = grad(g, 0, -49, 0, -34, c);
    g.beginPath(); g.ellipse(0, -34, 17, 15, 0, Math.PI, 0); g.fill(); trazar(g, 0.9);
    g.strokeStyle = 'rgba(255,255,255,0.45)'; g.lineWidth = 0.7;
    g.beginPath(); g.ellipse(0, -34, 11, 9, 0, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
    // borde ondulado de la campana
    for (let i = 0; i < 6; i++) {
      const x = -13 + i * 5.2;
      g.fillStyle = c[1];
      g.beginPath(); g.arc(x, -34, 2.6, 0, Math.PI); g.fill(); trazar(g, 0.5);
    }
    // farol bajo la campana
    g.fillStyle = radial(g, 0, -26, 0.5, 7, [d.acento, 'rgba(191,249,255,0.5)', 'rgba(191,249,255,0)']);
    g.beginPath(); g.arc(0, -26, 7, 0, Math.PI * 2); g.fill();
    elipse(g, 0, -26, 2.6, 2.6, '#ffffff', 0, 0.5);
    // ojo grande en el frente
    elipse(g, 7, -36, 4, 3.5, '#ffffff', 0, 0.6);
    elipse(g, 8, -36, 2, 2, d.ojos, 0, 0.1);
    linea(g, [[3, -41], [10, -39]], OUT, 1);
    if (o.abierta) elipse(g, 8, -29, 2, 1.6, OUT, 0, 0.1);
  }

  // Rey Oscuro: dragón alado; las alas baten
  function alaOscura(g, d, aleteo, desplaza, color) {
    g.save();
    g.translate(desplaza, 0);
    g.beginPath();
    g.moveTo(-2, -30);
    g.lineTo(-40, -56 + aleteo);
    g.lineTo(-34, -44);
    g.lineTo(-44, -36 + aleteo * 0.5);
    g.lineTo(-30, -28);
    g.lineTo(-36, -18 + aleteo * 0.3);
    g.lineTo(-18, -22);
    g.lineTo(-6, -18);
    g.closePath();
    g.fillStyle = color; g.fill(); trazar(g, 0.9);
    g.strokeStyle = d.acento; g.lineWidth = 0.6; g.globalAlpha = 0.7;
    [[-40, -56 + aleteo], [-44, -36 + aleteo * 0.5], [-36, -18 + aleteo * 0.3]].forEach(function (p) {
      g.beginPath(); g.moveTo(-2, -30); g.lineTo(p[0], p[1]); g.stroke();
    });
    g.globalAlpha = 1;
    g.restore();
  }

  function cuerpoOscuro(g, d, o) {
    const c = d.c, t = o.anim, aleteo = Math.sin(t * 6) * 7;
    alaOscura(g, d, aleteo, 0, c[2]);
    // cola con punta de flecha
    g.lineCap = 'round';
    g.strokeStyle = OUT; g.lineWidth = 4.6;
    g.beginPath(); g.moveTo(-10, -18); g.quadraticCurveTo(-28, -8, -40, -16); g.stroke();
    g.strokeStyle = c[1]; g.lineWidth = 2.2;
    g.beginPath(); g.moveTo(-10, -18); g.quadraticCurveTo(-28, -8, -40, -16); g.stroke();
    poligono(g, [[-40, -16], [-46, -20], [-45, -12]], d.melena, 0.6);
    // patas con garras
    [[-5, o.paso], [3, -o.paso]].forEach(function (p) {
      const x = p[0], alza = Math.max(0, p[1]) * 2;
      g.fillStyle = c[1];
      rr(g, x, -14 - alza, 5, 12, 2); g.fill(); trazar(g);
      linea(g, [[x, -2 - alza], [x - 1, 0 - alza]], '#ffffff', 0.8);
    });
    // cuerpo estilizado con púas en el lomo
    [[-7, -34], [-10, -29], [-10, -23]].forEach(function (p) {
      poligono(g, [[p[0] - 2, p[1] + 3], [p[0] - 3, p[1] - 3], [p[0] + 1, p[1] + 2]], d.melena, 0.5);
    });
    g.fillStyle = grad(g, -12, -36, 12, -10, c);
    g.beginPath(); g.ellipse(0, -22, 12, 13, 0, 0, Math.PI * 2); g.fill(); trazar(g, 0.9);
    // cuello y cabeza
    linea(g, [[6, -32], [14, -46]], OUT, 7.4);
    linea(g, [[6, -32], [14, -46]], c[1], 4.6);
    g.fillStyle = grad(g, 10, -58, 26, -44, c);
    g.beginPath(); g.ellipse(18, -50, 8, 7, 0, 0, Math.PI * 2); g.fill(); trazar(g, 0.9);
    g.fillStyle = grad(g, 22, -55, 31, -48, c);
    rr(g, 22, -55, 9, 7, 3.5); g.fill(); trazar(g, 0.8);
    // cuernos hacia atrás
    poligono(g, [[12, -54], [8, -65], [15, -56]], d.melena, 0.6);
    poligono(g, [[16, -56], [19, -67], [22, -55]], d.melena, 0.6);
    // ojo brillante con pupila rasgada
    elipse(g, 20, -52, 2.4, 1.5, d.ojos, 0, 0.5);
    linea(g, [[20, -53.5], [20, -50.5]], OUT, 0.8);
    if (o.abierta) {
      g.fillStyle = radial(g, 30, -49, 0.5, 6, ['#fff6a0', d.acento, 'rgba(255,79,216,0)']);
      g.beginPath(); g.arc(30, -49, 6, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#3a0a1a'; rr(g, 23, -50, 7, 3, 1.5); g.fill(); trazar(g, 0.5);
    } else {
      linea(g, [[23, -48], [30, -48.5]], OUT, 0.9);
    }
    // ala delantera, sobre el cuerpo
    alaOscura(g, d, -aleteo, 4, c[1]);
  }

  // Girasol gigante (castillo de Van Gogh): cabeza de pétalos con cara; abre la boca para soltar semillas
  function cuerpoGirasol(g, d, o) {
    const t = o.tiempo || 0;
    g.strokeStyle = '#3f8a3a'; g.lineWidth = 5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(0, -6); g.quadraticCurveTo(o.paso * 2, 8, 0, 20); g.stroke();
    g.fillStyle = '#4fa84a';
    g.beginPath(); g.ellipse(-9, 8 + o.paso, 8, 3, -0.4, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(9, 4 - o.paso, 8, 3, 0.4, 0, Math.PI * 2); g.fill();
    g.save();
    g.translate(0, -22);
    g.rotate(Math.sin(t * 1.5) * 0.12);
    g.fillStyle = '#ffd23f'; g.strokeStyle = '#b8801a'; g.lineWidth = 1.2;
    for (let k = 0; k < 14; k++) {
      const a = k * Math.PI * 2 / 14;
      g.beginPath(); g.ellipse(Math.cos(a) * 17, Math.sin(a) * 17, 7, 3.6, a, 0, Math.PI * 2); g.fill(); g.stroke();
    }
    g.fillStyle = '#6b4216'; g.beginPath(); g.arc(0, 0, 14, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#3a2208';
    for (let r = 4; r < 13; r += 3.5) for (let a = 0; a < 12; a++) {
      const aa = a * Math.PI / 6 + r;
      g.beginPath(); g.arc(Math.cos(aa) * r, Math.sin(aa) * r, 0.8, 0, Math.PI * 2); g.fill();
    }
    g.fillStyle = '#ffffff';
    g.beginPath(); g.arc(-4.5, -3, 2.4, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(4.5, -3, 2.4, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#111';
    g.beginPath(); g.arc(-4.2, -2.6, 1.1, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(4.8, -2.6, 1.1, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#2a0a06';
    g.beginPath();
    if (o.abierta) g.ellipse(0, 5, 4, 3, 0, 0, Math.PI * 2); else g.ellipse(0, 5, 4, 1.2, 0, 0, Math.PI * 2);
    g.fill();
    g.restore();
  }

  // Dragón de trencadís (Gaudí, el dragón del Park Güell): cuerpo de teselas, cresta de espinas y patas que pisan
  function cuerpoMosaico(g, d, o) {
    const p = o.paso || 0;
    const teselas = ['#2f9fc8', '#ffd27a', '#ec6a4a', '#3fa36b', '#ffffff', '#5a3a8a'];
    g.fillStyle = '#1d6f96';
    g.fillRect(-14, 10 + p, 6, 9); g.fillRect(8, 10 - p, 6, 9);
    g.fillStyle = '#2f9fc8';
    g.beginPath(); g.ellipse(0, 0, 18, 12, 0, 0, Math.PI * 2); g.fill();
    for (let k = 0; k < 16; k++) {
      const a = k * 0.8, r = 4 + (k % 3) * 4;
      g.fillStyle = teselas[k % teselas.length];
      g.fillRect(Math.cos(a) * r * 1.4 - 2, Math.sin(a) * r * 0.8 - 2, 4, 4);
    }
    g.fillStyle = '#ec6a4a';
    for (let k = -3; k <= 3; k++) { g.beginPath(); g.moveTo(k * 5 - 2, -10); g.lineTo(k * 5, -17); g.lineTo(k * 5 + 2, -10); g.fill(); }
    g.fillStyle = '#2f9fc8'; g.beginPath(); g.ellipse(20, -4, 9, 7, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#ffffff'; g.beginPath(); g.arc(23, -6, 2.4, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#111'; g.beginPath(); g.arc(23.6, -6, 1.1, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#2a0a06'; g.beginPath();
    if (o.abierta) g.ellipse(26, 0, 3, 2.2, 0, 0, Math.PI * 2); else g.ellipse(26, 0, 3, 0.9, 0, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = '#2f9fc8'; g.lineWidth = 6; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-16, -2); g.quadraticCurveTo(-30, -6 + p, -34, 4); g.stroke();
  }

  const DIBUJA = {
    koopa: cuerpoKoopa, magma: cuerpoMagma, helado: cuerpoHelado, arena: cuerpoArena,
    golem: cuerpoGolem, selva: cuerpoSelva, abisal: cuerpoAbisal, oscuro: cuerpoOscuro,
    girasol: cuerpoGirasol, mosaico: cuerpoMosaico
  };

  /* ---------- Proyectiles ---------- */

  const TAMANO = { fuego: [8, 6], bola: [7, 7], hielo: [7, 6], arena: [8, 5], oscura: [7, 7], piedra: [7, 7],
                   semilla: [6, 6], burbuja: [8, 8], onda: [10, 5] };
  const VELOCIDAD = { fuego: 170, hielo: 140, arena: 120, oscura: 200, burbuja: 28, semilla: 90 };

  function nuevoProyectil(tipo, x, y, vx, vy) {
    const t = TAMANO[tipo] || [6, 6];
    return { tipo: tipo, x: x, y: y, vx: vx, vy: vy, w: t[0], h: t[1], t: 0, rebotes: 0 };
  }

  function dibujarProyectil(g, p) {
    g.save();

        break;
      case 'arena':
        elipse(g, 0, 0, 4.4, 2.6, '#e8c070', 0, 0.5);
        break;
      case 'onda':
        g.fillStyle = grad(g, 0, -3, 0, 2, ['#f4d27a', '#c8903a']);
        g.beginPath(); g.ellipse(0, 0, 5, 2.6, 0, Math.PI, 0); g.fill(); trazar(g, 0.5);
        break;
      case 'piedra':
        elipse(g, 0, 0, 3.6, 3.6, radial(g, -1.5, -1.5, 0.5, 4.5, ['#f0f2f6', '#8a93a4', '#4a5262']), 0, 0.6);
        break;
      case 'semilla':
        g.strokeStyle = '#4a9a3a'; g.lineWidth = 0.8;
        for (let i = 0; i < 6; i++) {

        elipse(g, 0, 0, 3.8, 3.8, 'rgba(170,240,255,0.35)', 0, 0.8);

        g.beginPath(); g.arc(-1.2, -1.3, 0.9, 0, Math.PI * 2); g.fill();

        if (j.t > 2.5) volver(j);

      case 'aliento':

/* =====================================================================
   7c. ARTE CON VOLUMEN Y DETALLE: enemigos, objetos, monedas y bloques
   Se pinta a resolución real (U píxeles por píxel lógico). Las formas
   redondas son esferas o cilindros sombreados por la luz (arriba a la
   izquierda) con cinco tonos por color; los detalles (ojos con brillo,
   dientes, placas, barbas de pluma) se pintan píxel a píxel.
   ===================================================================== */

// Familias de tonos: cada color tiene 5 letras (h luz fuerte ... D sombra profunda).
// Las letras de cada familia son distintas, así un mismo sprite puede mezclar colores.
const RK = {
  cafe:    { h: "h", l: "l", m: "m", d: "d", D: "D" },
  crema:   { h: "A", l: "B", m: "C", d: "E", D: "F" },
  rojo:    { h: "q", l: "r", m: "s", d: "t", D: "u" },
  verde:   { h: "n", l: "p", m: "x", d: "z", D: "o" },
  oro:     { h: "Q", l: "R", m: "S", d: "T", D: "U" },
  blanco:  { h: "V", l: "W", m: "X", d: "Y", D: "Z" },
  naranja: { h: "1", l: "2", m: "3", d: "4", D: "5" },
  overol:  { h: "b", l: "c", m: "g", d: "e", D: "f" },
};

// Colores de cada familia a partir de un color base
function coloresRK(rk, hex) {
  return {
    [rk.h]: mezclar(hex, 0.5, "#ffffff"),
    [rk.l]: mezclar(hex, 0.25, "#ffffff"),
    [rk.m]: hex,
    [rk.d]: mezclar(hex, 0.3),
    [rk.D]: mezclar(hex, 0.6),
  };
}

// Tono según la luz: dot > 0.72 es luz fuerte, dot < -0.4 es sombra profunda
function tonoDe(rk, luz) {
  return luz > 0.72 ? rk.h : luz > 0.42 ? rk.l : luz > 0.0 ? rk.m : luz > -0.4 ? rk.d : rk.D;
}

/* Rejilla donde se pinta el dibujo. Las medidas son LÓGICAS (w, h), pero la
   rejilla guarda U× más píxeles reales: las formas redondas se muestrean fino
   y cada píxel lógico ocupa U×U píxeles reales. */
class Lienzo {
  constructor(w, h) {
    this.w = w;
    this.h = h;
    this.fw = w * U;
    this.fh = h * U;
    this.c = [];
    for (let y = 0; y < this.fh; y++) this.c.push(new Array(this.fw).fill("."));
  }
  // Píxel lógico entero (ocupa U×U píxeles reales)
  px(x, y, ch) {
    for (let j = 0; j < U; j++) for (let i = 0; i < U; i++) this.pf(x * U + i, y * U + j, ch);
  }
  // Píxel real (para detalles finos)
  pf(xf, yf, ch) {
    if (xf >= 0 && yf >= 0 && xf < this.fw && yf < this.fh) this.c[yf][xf] = ch;
  }
  // Píxel real indicado en coordenadas lógicas (decimales)
  pfl(lx, ly, ch) { this.pf(Math.floor(lx * U), Math.floor(ly * U), ch); }
  caja(x, y, w, h, ch) {
    // Coordenadas lógicas redondeadas a píxeles reales
    const x0 = Math.round(x * U), y0 = Math.round(y * U);
    for (let j = 0; j < Math.max(1, Math.round(h * U)); j++) for (let i = 0; i < Math.round(w * U); i++) this.pf(x0 + i, y0 + j, ch);
  }
  // Recorre los píxeles reales hasta "corte" (en lógico) y llama fn(fx, fy, lx, ly)
  recorrer(corte, fn) {
    for (let fy = 0; fy < this.fh; fy++) {
      const ly = (fy + 0.5) / U;
      if (ly > corte + 0.5) break;
      for (let fx = 0; fx < this.fw; fx++) fn(fx, fy, (fx + 0.5) / U, ly);
    }
  }
  // Elipse de un solo color (ojos, boca, manchas)
  elipse(cx, cy, rx, ry, ch, corte = 1e9) {
    this.recorrer(corte, (fx, fy, lx, ly) => {
      const nx = (lx - cx) / rx, ny = (ly - cy) / ry;
      if (nx * nx + ny * ny <= 1) this.c[fy][fx] = ch;
    });
  }
  // Esfera sombreada: la normal de cada píxel decide su tono
  esfera(cx, cy, rx, ry, rk, corte = 1e9) {
    this.recorrer(corte, (fx, fy, lx, ly) => {
      const nx = (lx - cx) / rx, ny = (ly - cy) / ry;
      const d2 = nx * nx + ny * ny;
      if (d2 > 1) return;
      const nz = Math.sqrt(1 - d2);
      this.c[fy][fx] = tonoDe(rk, -0.45 * nx - 0.6 * ny + 0.66 * nz);
    });
  }
  // Cilindro vertical (tallos, tubos, monedas de canto): sombrea en horizontal
  cilindro(x0, w, y0, h, rk) {
    for (let fy = y0 * U; fy < (y0 + h) * U; fy++) for (let fx = x0 * U; fx < (x0 + w) * U; fx++) {
      const t = ((fx + 0.5) / U - (x0 + w / 2)) / (w / 2);
      const nz = Math.sqrt(Math.max(0, 1 - t * t));
      this.pf(fx, fy, tonoDe(rk, -0.45 * t + 0.66 * nz));
    }
  }
  // Recorre los píxeles ya pintados (no vacíos) y aplica fn(fx, fy, ch)
  mapear(fn) {
    for (let fy = 0; fy < this.fh; fy++) for (let fx = 0; fx < this.fw; fx++) {
      const ch = this.c[fy][fx];
      if (ch !== ".") fn(fx, fy, ch);
    }
  }
  // Borde oscuro: los píxeles pintados que tocan vacío pasan a sombra profunda
  bordeOscuro(rk) {
    const pinta = (fx, fy) => fx >= 0 && fy >= 0 && fx < this.fw && fy < this.fh && this.c[fy][fx] !== ".";
    const marca = [];
    this.mapear((fx, fy) => {
      if (!pinta(fx - 1, fy) || !pinta(fx + 1, fy) || !pinta(fx, fy - 1) || !pinta(fx, fy + 1)) marca.push([fx, fy]);
    });
    for (const [fx, fy] of marca) this.c[fy][fx] = rk.D;
  }
  filas() { return this.c.map((r) => r.join("")); }
}

// Paleta de los enemigos y objetos (todos los tonos juntos)
const PAL_ENT = Object.assign(
  { k: "#000000", w: "#ffffff" },
  coloresRK(RK.cafe, "#9b5a2a"),
  coloresRK(RK.crema, "#f6dcae"),
  coloresRK(RK.rojo, "#e0392b"),
  coloresRK(RK.verde, "#3fbf3f"),
  coloresRK(RK.oro, "#ffd23f"),
  coloresRK(RK.blanco, "#f2f2f2"),
  coloresRK(RK.naranja, "#ff8a1e"),
);


/* ---------- Monedas y objetos ---------- */

// Hongo: sombrero rojo con manchas en relieve, tallo crema con ojos
function setaFilas(sombrero = RK.rojo) {
  const L = new Lienzo(16, 16);
  L.esfera(8, 6.8, 7.2, 6.4, sombrero, 9.4);
  L.bordeOscuro(sombrero);
  for (const [x, y, r] of [[5, 4.4, 1.7], [11, 4.2, 1.6], [8, 1.8, 1.0]]) L.esfera(x, y, r, r, RK.blanco);
  L.esfera(8, 12.2, 3.6, 3.2, RK.crema, 15);
  L.bordeOscuro(RK.crema);
  L.elipse(6.2, 12, 0.8, 0.9, "k");
  L.elipse(9.8, 12, 0.8, 0.9, "k");
  L.pfl(6.1, 11.7, "w");
  return L.filas();
}

// Flor de fuego: pétalos con volumen, centro dorado, tallo y hojas con vena
function florFilas() {
  const L = new Lienzo(16, 16);
  for (let a = 0; a < 5; a++) {
    const ang = -Math.PI / 2 + (a * 2 * Math.PI) / 5;
    L.esfera(8 + Math.cos(ang) * 4.2, 6 + Math.sin(ang) * 4.2, 2.6, 2.6, RK.naranja, 12);
  }
  L.esfera(8, 6, 2.8, 2.8, RK.oro, 9);
  L.cilindro(7, 2, 11, 5, RK.verde);
  for (const [x, y] of [[4.5, 13], [11.5, 12.6]]) {
    L.esfera(x, y, 2.6, 1.6, RK.verde);
    L.recorrer(16, (fx, fy, lx, ly) => {
      if (L.c[fy][fx] !== "." && Math.abs(ly - y) < 0.12) L.c[fy][fx] = RK.verde.D;
    });
  }
  return L.filas();
}

// Pluma: hoja blanca inclinada con nervio central y barbas
function plumaFilas() {
  const L = new Lienzo(12, 14);
  const a = (-35 * Math.PI) / 180, ca = Math.cos(a), sa = Math.sin(a);
  L.recorrer(14, (fx, fy, lx, ly) => {
    const dx = lx - 6, dy = ly - 7;
    const u = dx * ca + dy * sa;      // eje largo
    const v = -dx * sa + dy * ca;     // eje corto
    if ((u / 3.6) ** 2 + (v / 6.2) ** 2 > 1) return;
    let ch = v < -1.8 ? RK.blanco.h : v < 1.2 ? RK.blanco.m : RK.blanco.d;
    if (Math.abs(v) < 0.25) ch = RK.blanco.D;                                       // nervio
    else if (Math.floor(u * 4) % 3 === 0) ch = RK.blanco.l;                         // barbas
    L.c[fy][fx] = ch;
  });
  return L.filas();
}

// Estrella de cinco puntas en oro, con contorno y brillo
function estrellaFilas() {
  const L = new Lienzo(14, 14);
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 2.8 : 6.6;
    const ang = -Math.PI / 2 + (i * Math.PI) / 5;
    pts.push([7 + r * Math.cos(ang), 7.2 + r * Math.sin(ang)]);
  }
  L.recorrer(14, (fx, fy, px, py) => {
    let dentro = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if ((yi > py) !== (yj > py) && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) dentro = !dentro;
    }
    if (dentro) L.c[fy][fx] = py < 6 ? RK.oro.h : py < 9 ? RK.oro.l : RK.oro.m;
  });
  L.bordeOscuro(RK.oro);
  L.pfl(3.2, 4.4, "w");
  return L.filas();
}

const spritesArte = new Map();
function arte(key, filas, pal = PAL_ENT) {
  if (!spritesArte.has(key)) spritesArte.set(key, spriteFromRows(filas, pal, true, false, false));
  return spritesArte.get(key);
}

function objetoSprite(tipo) {
  if (tipo === "hongo") return arte("hongo", setaFilas());
  if (tipo === "vida") return arte("vida", setaFilas(RK.verde));
  if (tipo === "flor") return arte("flor", florFilas());
  if (tipo === "pluma") return arte("pluma", plumaFilas());
  return arte("estrella", estrellaFilas());
}

    g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r);

    const k = i + 1, castillo = k === 8;
    const lv = {
      nombre: castillo ? w + "-C " + nombre : w + "-" + k + " " + nombre,
      tiempo: castillo ? 250 : 300,
      gen: {
        seed: w * 100 + k,
        dif: Math.min(8, w + Math.floor((k - 1) / 3) + (castillo ? 1 : 0)),
        enemigos: k <= 2 ? enemigos.slice(0, opc.tiposIniciales || 2) : enemigos,
      },
      mecanicas: (MECANICAS_MUNDO[w] || MECANICAS_POR_FASE)[i],
    };
    if (opc.horas && opc.horas[i] !== undefined) lv.hora = opc.horas[i];
    if (opc.estilos && opc.estilos[i]) lv.estilo = opc.estilos[i];
    if (opc.fondos && opc.fondos[i]) lv.fondo = opc.fondos[i];
    if (opc.pauta && k >= 2 && !castillo) lv.pauta = opc.pauta;   // la 1-1 es la de datos publicados; el castillo, su escenario
    if (castillo) { lv.jefe = true; if (opc.castillo) lv.castillo = true; }
    return lv;
  });
}

/* Nodos del mapa de un mundo: las fases y las casas de minijuegos en orden,
   repartidos a lo largo de la ruta según la distancia recorrida.
   Cada nodo lleva vec (vecinos anterior y siguiente) para moverse con las flechas. */
function construirMapa(m) {
  const seq = [];
  m.niveles.forEach((nv, i) => {
    seq.push({ ref: i, castillo: i === m.niveles.length - 1 });
    if (m.bonus.includes(i + 1)) seq.push({ bonus: i + 1 });   // casa de minijuegos tras la fase i+1
  });
  const r = m.ruta, largos = [];
  let total = 0;
  for (let i = 1; i < r.length; i++) {
    const d = Math.hypot(r[i][0] - r[i - 1][0], r[i][1] - r[i - 1][1]);
    largos.push(d);
    total += d;
  }
  seq.forEach((nodo, i) => {
    let s = (total * i) / (seq.length - 1), t = 0;
    while (t < largos.length - 1 && s > largos[t]) { s -= largos[t]; t++; }
    const f = largos[t] ? s / largos[t] : 0;
    nodo.x = Math.round(r[t][0] + (r[t + 1][0] - r[t][0]) * f);
    nodo.y = Math.round(r[t][1] + (r[t + 1][1] - r[t][1]) * f);
    nodo.vec = [i - 1, i + 1].filter((j) => j >= 0 && j < seq.length);
  });
  return seq;
}
for (const m of MUNDOS) m.mapa = construirMapa(m);

/* =====================================================================
   7. GENERADOR DE NIVELES
   Cada fase se monta con PIEZAS diseñadas a mano (un reto con sentido cada una),
   unidas por tramos llanos con enemigos. La semilla elige qué piezas salen y en qué orden.
   Devuelve { cols, rows, tiles[][], ents[], plats[], decor[], canones[], start, goalX, ... }
   Tiles: "." vacío, "G" suelo, "B" ladrillo, "Q" bloque ?, "U" bloque usado, "S" piedra,
          "T" tubería, "F" poste de meta, "M" muelle, "H" pinchos, "V" lava, "L" escalera,
          "D" plataforma de una dirección, "Z" bloque oculto (invisible hasta golpearlo desde abajo),
          "Y" arena movediza (no es sólida: el jugador se hunde despacio y, si se hunde del todo, muere).
   Plataformas (plats): "movil" (va y viene, en horizontal o en vertical) y "caida" (se cae al pisarla).
   ===================================================================== */
const ROWS = 14;           // 14 tiles * 16px = 224px de alto: la altura de una pantalla (las fases horizontales)
const GY = 11;             // fila del suelo (la superior) de las fases horizontales; cada nivel lleva su gy
// Potenciadores de los bloques P: casi siempre algo que hace crecer
// Alto de las fases de la pauta "uno" (como la 1-1 hecha a mano): más alto que la pantalla, la cámara sigue al jugador
const FILAS_UNO = 42;
const POTENCIADORES = ["hongo", "hongo", "flor", "pluma"];
// Monedas que da un ladrillo multimoneda (K) antes de quedarse vacío
const MONEDAS_MULTI = 8;
// Enemigos que vuelan: se colocan en el aire, no en el suelo
const VOLADORES = ["flyer", "murcielago", "medusa", "fantasma", "pez_nadador", "cuervo", "pajaro_miro", "estrella_fugaz", "luna"];

// Generador pseudoaleatorio determinista (mulberry32): misma semilla = mismo nivel
function prng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Crea una rejilla vacía de `rows` filas (por defecto, la altura de una pantalla)
function gridVacia(cols, rows = ROWS) {
  const t = [];
  for (let r = 0; r < rows; r++) t.push(new Array(cols).fill("."));
  return t;
}

/* ---------- Nivel en construcción ---------- */
function nuevoNivel(cols, rnd, dif, tipos, rows = ROWS, gy = GY) {
  // Las plantas de tubería (planta, planta zombi y girasol) salen de los tubos y no se ponen en el suelo
  const planta = tipos.includes("planta_zombie") ? "planta_zombie" : tipos.includes("plant") ? "plant" : tipos.includes("girasol") ? "girasol" : null;
  const sinPlantas = tipos.filter((t) => t !== "plant" && t !== "planta_zombie" && t !== "girasol");
  const voladores = sinPlantas.filter((t) => VOLADORES.includes(t));
  const caminantes = sinPlantas.filter((t) => !VOLADORES.includes(t));
  return {
    cols, rows, gy, tiles: gridVacia(cols, rows), ents: [], plats: [], canones: [], decor: [], rnd, dif, planta,
    caminantes: caminantes.length ? caminantes : voladores, voladores,
    entrada: null, salida: null, start: null, puentes: 0,
    candidatas: null, reserva: null,   // sitios para monedas estrella (solo en las fases generadas)
  };
}

function ponerEnemigo(N, c, r, vuela) {
  const lista = vuela ? N.voladores : N.caminantes;
  if (!lista.length) return;
  N.ents.push({ t: lista[Math.floor(N.rnd() * lista.length)], x: c * TILE, y: r * TILE });
}

function ponerBloque(N, tile, c, r, item) {
  N.tiles[r][c] = tile;
  N.ents.push({ t: "qitem", x: c * TILE, y: r * TILE, item });
}

// Una casilla de la leyenda (ver arriba)
function ponerCelda(N, ch, c, r) {
  if (c < 0 || c >= N.cols || r < 0 || r >= N.rows) return;
  switch (ch) {
    case "G": case "S": case "B": case "D": case "L": case "M": case "H": case "V": case "U": case "T":
      N.tiles[r][c] = ch; break;
    case "p":
      N.tiles[r][c] = "T";
      if (N.planta) N.ents.push({ t: N.planta, x: c * TILE + 1, y: r * TILE - 8 });
      break;
    case "X": N.tiles[r][c] = "T"; N.entrada = { col: c, row: r }; break;
    case "R": N.tiles[r][c] = "T"; N.salida = { col: c, row: r }; break;
    case "Q": ponerBloque(N, "Q", c, r, "moneda"); break;
    case "P": ponerBloque(N, "Q", c, r, POTENCIADORES[Math.floor(N.rnd() * POTENCIADORES.length)]); break;
    case "*": ponerBloque(N, "Q", c, r, "estrella"); break;
    case "1": ponerBloque(N, "Z", c, r, "vida"); break;
    case "$": ponerBloque(N, "Z", c, r, "moneda"); break;
    case "K": ponerBloque(N, "B", c, r, "multi"); break;
    case "c": N.ents.push({ t: "coin", x: c * TILE + 4, y: r * TILE + 4 }); break;
    case "e": ponerEnemigo(N, c, r, false); break;
    case "E": if (N.dif >= 4) ponerEnemigo(N, c, r, false); break;
    case "f": ponerEnemigo(N, c, r, true); break;
    case "(": case ")":
      N.tiles[r][c] = "S";
      // Dos cañones seguidos disparan a destiempo: nunca llegan dos balas a la vez
      N.canones.push({ col: c, row: r, dir: ch === "(" ? -1 : 1, cada: 2.4, velocidad: 90, inicio: 1.2 + 1.2 * (N.canones.length % 2) });
      break;
    case "@": N.start = { x: c * TILE, y: r * TILE }; break;
    // Moneda estrella: en una fase, la celda es un sitio posible; en una sala, es la moneda de la sala (la tercera)
    case "g":
      if (N.candidatas) N.candidatas.push({ c, r });
      else N.ents.push({ t: "grande", x: c * TILE, y: r * TILE, idx: 2 });
      break;
    case "%": if (N.reserva) N.reserva.push({ c, r }); break;
  }
}

// Columna de suelo de una pieza (filas gy a rows-1) según el carácter de su última fila
function ponerSuelo(N, ch, c) {
  for (let r = N.gy; r < N.rows; r++) {
    let t = ".";
    if (ch === "G" || ch === "S") t = ch;
    else if (ch === "v") t = r === N.gy ? "." : "V";                         // lava un bloque por debajo del suelo
    else if (ch === "y") t = "Y";                                           // arenas movedizas
    else if (ch === "h") t = r === N.gy ? "." : r === N.gy + 1 ? "H" : "G";   // hoyo de un bloque con pinchos al fondo
    if (N.fondo && r >= N.gy + N.fondo && (t === "G" || t === "S")) t = ".";   // suelo macizo: solo sus filas
    N.tiles[r][c] = t;
  }
}

/* Pega un mapa (filas de arriba abajo) con su esquina superior izquierda en (x0, f0).
   Con suelo = true, la última fila es la del suelo de la pieza. Devuelve el ancho. */
function pegarMapa(N, filas, x0, f0, suelo) {
  const ancho = Math.max(...filas.map((f) => f.length));
  const ult = filas.length - 1;
  const ch = (i, k) => filas[i][k] || (suelo && i === ult ? "G" : ".");
  for (let i = 0; i <= ult; i++) for (let k = 0; k < ancho; k++) {
    if (suelo && i === ult) ponerSuelo(N, ch(i, k), x0 + k);
    else ponerCelda(N, ch(i, k), x0 + k, f0 + i);
  }
  // Tramos seguidos de un carácter en una fila: [fila, primera columna, última columna]
  const tramos = (marca, i) => {
    const out = [];
    for (let k = 0; k < ancho; k++) {
      if (ch(i, k) !== marca) continue;
      let fin = k;
      while (fin + 1 < ancho && ch(i, fin + 1) === marca) fin++;
      out.push([k, fin]);
      k = fin;
    }
    return out;
  };
  for (let i = 0; i <= ult; i++) {
    const r = f0 + i;
    if (suelo && i === ult) {
      // Puente: cada tramo de madera cae al pisarlo y arrastra a los demás en cascada
      for (const [a, b] of tramos("w", i)) {
        const grupo = "puente" + N.puentes++;
        for (let k = a; k <= b; k++) {
          N.plats.push({ t: "caida", madera: true, x: (x0 + k) * TILE, y: N.gy * TILE, w: TILE, h: TILE, grupo, indice: k - a, tCaida: 0.6 });
        }
      }
      continue;
    }
    // Plataforma móvil de 3 bloques: va y viene a lo largo del recorrido marcado
    for (const [a, b] of tramos("=", i)) {
      N.plats.push({ t: "movil", x: (x0 + a) * TILE, y: r * TILE, w: 3 * TILE, h: TILE, x0: (x0 + a) * TILE, x1: (x0 + Math.max(a, b - 2)) * TILE, vel: 36 });
    }
    // Plataformas que caen: una por tramo
    for (const [a, b] of tramos("_", i)) {
      N.plats.push({ t: "caida", x: (x0 + a) * TILE, y: r * TILE, w: (b - a + 1) * TILE, h: TILE });
    }
  }
  // Ascensor: columna de "^"; la plataforma sube y baja entre la primera y la última fila
  for (let k = 0; k < ancho; k++) {
    for (let i = 0; i < ult; i++) {
      if (ch(i, k) !== "^" || (i > 0 && ch(i - 1, k) === "^")) continue;
      let fin = i;
      while (fin + 1 < ult && ch(fin + 1, k) === "^") fin++;
      N.plats.push({ t: "movil", eje: "y", x: (x0 + k) * TILE, y: (f0 + fin) * TILE, w: 3 * TILE, h: TILE,
                     y0: (f0 + i) * TILE, y1: (f0 + fin) * TILE, vel: 30 });
    }
  }
  return ancho;
}

// Baraja una lista en su sitio (Fisher-Yates) con el generador de la fase
function barajar(lista, rnd) {
  for (let i = lista.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [lista[i], lista[j]] = [lista[j], lista[i]];
  }
  return lista;
}

/* Elige las piezas de una fase: la mecánica nueva de la fase sale al menos dos veces, hay una o más
   puertas (muros que obligan a subir) según la dificultad, y el resto se reparte entre las demás
   mecánicas y los retos básicos. Ninguna pieza sale más de dos veces. */
function elegirPiezas(rnd, dif, mecanicas, secreta, jefe, avance, agua, uno = false) {
  if (agua) return elegirPiezasAgua(rnd, dif, secreta);
  // Con avance automático no hay ascensor: esperarlo con la pantalla empujando sería una trampa
  const vale = (p) => (!p.req || mecanicas.includes(p.req)) && dif >= (p.min || 1) && dif <= (p.max || 8) && !(avance && p.id === "ascensor");
  const pool = PIEZAS.filter((p) => (p.tipo === "reto" || p.tipo === "puerta") && vale(p));
  // Las piezas de reto también salen en espejo (izquierda y derecha cambian, y los cañones miran al otro lado):
  // así hay más combinaciones con las mismas piezas, sobre todo en las primeras fases
  const enEspejo = (p) => ({ ...p, id: p.id + "~", mapa: p.mapa.map((f) => [...f].reverse().map((ch) => (ch === "(" ? ")" : ch === ")" ? "(" : ch)).join("")) });
  for (const p of pool.filter((q) => q.tipo === "reto" && q.mapa.every((f) => f.length === q.mapa[0].length))) pool.push(enEspejo(p));
  const puertas = pool.filter((p) => p.tipo === "puerta");
  const n = 6 + Math.ceil(dif / 2) - (uno ? 3 : 0);   // la pauta "uno" deja sitio a sus secciones de capas
  const nPuertas = Math.min(3, 1 + (dif >= 4) + (dif >= 7));
  const usos = {};
  const elegidas = [];
  const azar = (lista) => lista[Math.floor(rnd() * lista.length)];
  const tomar = (lista) => {
    const libres = lista.filter((p) => (usos[p.id] || 0) < 2);
    if (!libres.length) return null;
    const menos = Math.min(...libres.map((p) => usos[p.id] || 0));   // primero las que menos han salido
    const p = azar(libres.filter((q) => (usos[q.id] || 0) === menos));
    usos[p.id] = (usos[p.id] || 0) + 1;
    elegidas.push(p);
    return p;
  };
  // La mecánica que presenta esta fase (la última de la lista)
  const nueva = mecanicas[mecanicas.length - 1];
  if (nueva) for (let k = 0; k < 2; k++) tomar(pool.filter((p) => p.req === nueva));
  // Puertas: primero las de las mecánicas de la fase, que son más variadas
  while (elegidas.filter((p) => p.tipo === "puerta").length < nPuertas) {
    const conMecanica = puertas.filter((p) => p.req && (usos[p.id] || 0) === 0);
    if (!tomar(conMecanica.length ? conMecanica : puertas)) break;
  }
  // Una pieza de cada una de las demás mecánicas, en orden al azar
  const otras = barajar(mecanicas.filter((m) => m !== nueva), rnd);
  for (const m of otras) if (elegidas.length < n) tomar(pool.filter((p) => p.req === m));
  const retos = pool.filter((p) => p.tipo === "reto");
  while (elegidas.length < n && tomar(retos));
  // Orden al azar, sin dos puertas seguidas
  barajar(elegidas, rnd);
  for (let i = 1; i < elegidas.length; i++) {
    if (elegidas[i].tipo !== "puerta" || elegidas[i - 1].tipo !== "puerta") continue;
    const j = elegidas.findIndex((p, k) => k > i && p.tipo !== "puerta");
    if (j > 0) [elegidas[i], elegidas[j]] = [elegidas[j], elegidas[i]];
  }
  // La fase empieza con una pieza tranquila de bloques
  elegidas.unshift(azar(PIEZAS.filter((p) => p.tipo === "inicio")));
  // Zona secreta (es un atajo): la entrada cae en un sitio distinto en cada fase, tras la primera pieza
  // y antes del final, y la salida va dos, tres o cuatro piezas después
  if (secreta !== undefined && !jefe) {
    const i = 1 + Math.floor(rnd() * Math.max(1, elegidas.length - 2));
    elegidas.splice(i, 0, azar(PIEZAS.filter((p) => p.tipo === "entrada")));
    elegidas.splice(Math.min(elegidas.length, i + 2 + Math.floor(rnd() * 3)), 0, PIEZAS.find((p) => p.tipo === "salida"));
  }
  return elegidas;
}

// Reparte k sitios a lo largo de la fase: uno al azar en cada tramo de la lista ordenada de izquierda a derecha
function repartir(sitios, k, rnd) {
  const orden = sitios.slice().sort((a, b) => a.c - b.c);
  if (orden.length <= k) return orden;
  const out = [];
  for (let i = 0; i < k; i++) {
    const a = Math.floor((orden.length * i) / k), b = Math.floor((orden.length * (i + 1)) / k);
    out.push(orden[a + Math.floor(rnd() * (b - a))]);
  }
  return out;
}

// Monedas estrella de una fase: tres, o dos si la tercera está en su zona secreta. Se numeran de izquierda a derecha
function ponerGrandes(N, rnd) {
  const k = N.entrada ? 2 : 3;
  let sitios = repartir(N.candidatas, k, rnd);
  if (sitios.length < k) sitios = sitios.concat(repartir(N.reserva, k - sitios.length, rnd)).sort((a, b) => a.c - b.c);
  sitios.forEach((st, i) => N.ents.push({ t: "grande", x: st.c * TILE, y: st.r * TILE, idx: i }));
}

/* Surtidores de saltarines: peces que saltan desde los huecos sin fondo (en las fases con peces)
   y bolas de lava que saltan desde la lava. Cada uno es un tramo de columnas { tipo, x0, x1 } en píxeles */
function surtidores(tiles, cols, peces, hm, gy = GY, rows = ROWS) {
  const out = [];
  const hueco = (c) => hm ? hm[c] === Infinity : tiles[gy][c] === "." && tiles[rows - 1][c] === ".";
  const lava = (c) => !hm && tiles[rows - 1][c] === "V";
  for (const [tipo, es, minimo] of [["pez_saltarin", hueco, 2], ["bola_lava", lava, 2]]) {
    if (tipo === "pez_saltarin" && !peces) continue;
    for (let c = 0; c < cols; c++) {
      if (!es(c)) continue;
      let fin = c;
      while (fin + 1 < cols && es(fin + 1)) fin++;
      if (fin - c + 1 >= minimo) out.push({ tipo, x0: c * TILE, x1: (fin + 1) * TILE });
      c = fin;
    }
  }
  return out;
}

// Fases submarinas: arrecife al empezar y después piezas submarinas al azar (ninguna más de dos veces),
// con la entrada de la zona secreta hacia un tercio y su salida dos piezas después
function elegirPiezasAgua(rnd, dif, secreta) {
  const pool = PIEZAS.filter((p) => p.tipo === "submarina");
  const n = 6 + Math.ceil(dif / 2), usos = {}, elegidas = [];
  while (elegidas.length < n) {
    const libres = pool.filter((p) => (usos[p.id] || 0) < 2 && elegidas[elegidas.length - 1] !== p);
    const p = libres[Math.floor(rnd() * libres.length)];
    usos[p.id] = (usos[p.id] || 0) + 1;
    elegidas.push(p);
  }
  elegidas.unshift(PIEZAS.find((p) => p.tipo === "inicio_agua"));
  if (secreta !== undefined) {
    const i = Math.max(2, Math.floor(elegidas.length * 0.35));
    elegidas.splice(i, 0, PIEZAS.find((p) => p.id === "entrada_pozo"));
    elegidas.splice(Math.min(elegidas.length, i + 3), 0, PIEZAS.find((p) => p.tipo === "salida"));
  }
  return elegidas;
}

// Secuencias de bloques de los tramos llanos, de arriba abajo. Las de escalera van pegadas al suelo (se sube de
// un bloque al siguiente); las demás van a media altura, por encima de la cabeza de cualquier personaje
const SECUENCIAS_TRAMO = [
  { filas: ["Q"] }, { filas: ["BQB"] }, { filas: ["QQ"] }, { filas: ["BPB"] }, { filas: ["BKB"] },
  { filas: ["BBBB"] }, { filas: ["QBQBQ"] }, { filas: ["QQQ", "B.B"] }, { filas: ["..Q..", ".QBQ."] },
  { filas: [".c.c.c.", "BBBBBBB"] }, { filas: ["..B", ".BB", "BBB"], escalera: true },
];

// Tramo llano entre dos piezas: a veces un enemigo, un grupo de bloques o un volador.
// El tramo del punto de control queda sin enemigos
function ponerTramo(N, x, w, tranquilo) {
  const rnd = N.rnd;
  if (tranquilo) return;
  // Bajo el agua las piezas ya traen sus peces y medusas: en los tramos hay menos enemigos
  const antes = N.ents.length;
  if (rnd() < (0.3 + N.dif * 0.07) * (N.agua ? 0.4 : 1)) ponerEnemigo(N, x + 1 + Math.floor(rnd() * (w - 1)), N.gy - 1, false);
  const hayEnemigo = N.ents.length > antes;
  if (w >= 5 && rnd() < 0.5) {
    const sec = SECUENCIAS_TRAMO[Math.floor(rnd() * SECUENCIAS_TRAMO.length)];
    const ancho = Math.max(...sec.filas.map((f) => f.length));
    // Una escalera no se pone en un tramo con enemigo (quedaría dentro de él)
    if (ancho <= w && !(sec.escalera && hayEnemigo)) {
      const c0 = x + Math.floor(rnd() * (w - ancho + 1));
      const base = sec.escalera ? N.gy - 1 : N.gy - 4 - (sec.filas.length === 1 && rnd() < 0.4 ? 1 : 0);
      sec.filas.forEach((fila, k) => [...fila].forEach((ch, j) => {
        if (ch !== ".") ponerCelda(N, ch, c0 + j, base - (sec.filas.length - 1 - k));
      }));
    }
  } else if (N.dif >= 3 && N.voladores.length && !N.agua && rnd() < 0.25) {
    ponerEnemigo(N, x + Math.floor(w / 2), 5 + Math.floor(rnd() * 3), true);
  }
}

/* Pauta "uno": como en la 1-1, además del camino principal (el suelo, de tres bloques de grueso) hay una zona de
   abajo, bajo el suelo, y una zona de arriba, por encima del camino. Cada fase lleva tres secciones de capas entre
   sus piezas: una con zona de abajo, otra con zona de arriba y otra con las dos, en orden al azar. La boca de la
   zona secreta va dentro de la sección que ocupa el sitio de la pieza de entrada: en su zona de abajo o en la de
   arriba. Devuelve [{ antes: pieza ante la que va, abajo, arriba, ancho, boca: "abajo" | "arriba" | null }] */
function planCapas(n, ie, rnd) {
  const tipos = barajar([{ abajo: true, arriba: false }, { abajo: false, arriba: true }, { abajo: true, arriba: true }], rnd);
  const sitios = [1, Math.floor(n / 2), n - 1].map((k) => clamp(k, 1, Math.max(1, n - 1)));
  let conBoca = -1;
  if (ie >= 1) {
    conBoca = 0;
    for (let j = 1; j < 3; j++) if (Math.abs(sitios[j] - ie) < Math.abs(sitios[conBoca] - ie)) conBoca = j;
    sitios[conBoca] = Math.min(ie, Math.max(1, n - 1));
  }
  return sitios.map((antes, j) => {
    const t = tipos[j];
    const boca = j !== conBoca ? null : t.abajo && t.arriba ? (rnd() < 0.5 ? "abajo" : "arriba") : t.abajo ? "abajo" : "arriba";
    const ancho = t.abajo && t.arriba ? 44 : t.arriba ? 34 : 30 + Math.floor(rnd() * 5);
    return { antes, abajo: t.abajo, arriba: t.arriba, ancho, boca };
  });
}

// Sección de capas: el suelo de arriba sigue siendo el camino principal (con los huecos de la zona de abajo)
function seccionCapas(N, x, s) {
  for (let c = x; c < x + s.ancho; c++) N.protegidas.add(c);   // ponerMasas no rellena lo que hay bajo la sección
  if (s.abajo) zonaAbajo(N, x, s.ancho, s.boca === "abajo");
  if (s.arriba) zonaArriba(N, x + (s.abajo ? 10 : 0), x + s.ancho - 3, s.boca === "arriba");
  // Enemigos por el camino principal de la sección, donde hay suelo
  for (const c of [x + s.ancho - 3, x + Math.floor(s.ancho / 2)]) {
    if (N.tiles[N.gy][c] === "G" && N.tiles[N.gy - 1][c] === ".") ponerEnemigo(N, c, N.gy - 1, false);
  }
}

/* Zona de abajo, bajo el suelo principal (filas gy+3 a gy+10), irregular como la de la 1-1: tramos de suelo a
   distintas alturas, a veces con huecos al vacío entre ellos, y filas de ladrillos y bloques con premio a tres filas
   de cada suelo (se golpean desde abajo). Se baja por un hueco del camino principal y se vuelve por otro, con dos
   muelles o con una escalera de plataformas de una dirección. Los suelos cambian como mucho dos filas y los huecos
   tienen como mucho dos bloques */
function zonaAbajo(N, x, w, conBoca) {
  const rnd = N.rnd, gy = N.gy, T = N.tiles, ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const x1 = x + w - 3, s = x1 - 2;   // x1: última columna de dentro; s: hueco de salida (s y s+1)
  for (let r = gy + 3; r <= gy + 10; r++) for (const c of [x, x + 1, x + w - 2, x + w - 1]) T[r][c] = "G";   // paredes
  for (let c = x + 2; c <= x1; c++) for (let r = gy + 3; r <= gy + 10; r++) T[r][c] = ".";
  const tramos = [];
  let c = x + 2, alto = gy + 8;
  while (c <= x1) {
    const ancho = Math.min(ri(4, 9), x1 - c + 1);
    tramos.push({ c0: c, c1: c + ancho - 1, alto });
    c += ancho;
    const hueco = c <= x1 - 5 && c > x + 7 && rnd() < 0.45 ? ri(1, 2) : 0;
    c += hueco;
    alto = clamp(alto + (rnd() < 0.5 ? -1 : 1) * ri(hueco ? 0 : 1, hueco ? 1 : 2), gy + 7, gy + 9);
  }
  const suelo = (k) => { const t = tramos.find((t) => k >= t.c0 && k <= t.c1); return t ? t.alto : null; };
  for (const t of tramos) if (t.c1 >= s - 1) t.alto = gy + 8;   // bajo la salida, el suelo a la altura justa
  for (const t of tramos) for (let k = t.c0; k <= t.c1; k++) for (let r = t.alto; r <= gy + 10; r++) T[r][k] = "G";
  for (const k of [x + 3, x + 4, s, s + 1]) for (let r = gy; r <= gy + 2; r++) T[r][k] = ".";   // huecos de bajada y de salida
  // Salida: dos muelles, o una escalera de plataformas de una dirección que sube hasta dentro del hueco
  if (rnd() < 0.5) T[gy + 7][s] = T[gy + 7][s + 1] = "M";
  else T[gy + 5][s] = T[gy + 5][s + 1] = T[gy + 2][s] = T[gy + 2][s + 1] = "D";   // se suben atravesándolas desde abajo
  // Boca de la zona secreta: tubería sobre un tramo de en medio
  let tramoBoca = null;
  if (conBoca) {
    tramoBoca = tramos.find((t, i) => i > 0 && t.c1 - t.c0 >= 4 && t.c1 < s - 4) || tramos.find((t, i) => i > 0 && t.c1 < s - 3);
    const pb = tramoBoca.c0 + 1, r = tramoBoca.alto;
    ponerCelda(N, "X", pb, r - 2);
    T[r - 2][pb + 1] = T[r - 1][pb] = T[r - 1][pb + 1] = "T";
  }
  // Ladrillos y bloques a tres filas de cada suelo, lejos de los huecos de bajada y de salida
  let potenciador = false, enemigos = 0;
  for (const t of tramos) {
    if (t === tramoBoca || t.c1 - t.c0 < 3) continue;
    if (rnd() < 0.75) {
      for (let k = Math.max(t.c0 + 1, x + 6); k <= Math.min(t.c1 - 1, s - 5); k += rnd() < 0.3 ? 2 : 1) {
        const u = rnd();
        const ch = !potenciador && u < 0.12 ? "P" : u < 0.35 ? "Q" : u < 0.5 ? "K" : "B";
        if (ch === "P") potenciador = true;
        ponerCelda(N, ch, k, t.alto - 3);
        if (rnd() < 0.2) ponerCelda(N, "c", k, t.alto - 4);
      }
    }
    if (enemigos < 2 && t.c1 - t.c0 >= 4 && t.c0 > x + 6 && t.c1 < s - 2) { ponerEnemigo(N, t.c0 + 2, t.alto - 1, false); enemigos++; }
    for (let k = t.c0 + 1; k <= t.c1; k += 5) if (T[t.alto - 1][k] === ".") ponerCelda(N, "c", k, t.alto - 1);
  }
}

/* Zona de arriba: una escalinata de piedra en el camino principal (se pasa por encima) lleva a una cadena de
   plataformas de piedra a distintas alturas, entre 5 y 9 filas sobre el suelo, con monedas. Cada salto sube como
   mucho dos filas y salva dos o tres bloques. La primera plataforma lleva un bloque con potenciador; sobre la más alta
   hay un bloque oculto con una vida, o en ella va la boca de la zona secreta */
function zonaArriba(N, x, xFin, conBoca) {
  const rnd = N.rnd, gy = N.gy, T = N.tiles, ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  [1, 2, 3, 4, 3, 2, 1].forEach((h, k) => { for (let j = 1; j <= h; j++) T[gy - j][x + 2 + k] = "S"; });
  const plats = [];
  let c = x + 8, fila = gy - 5 - ri(0, 1);
  while (c + 3 <= xFin) {
    const ancho = Math.min(ri(3, 5), xFin - c + 1);
    plats.push({ c0: c, c1: c + ancho - 1, fila });
    c += ancho + ri(2, 3);
    fila = clamp(fila + ri(-2, 2), gy - 9, gy - 5);
  }
  let alta = plats[0];
  for (const pl of plats) if (pl.fila < alta.fila || (pl.fila === alta.fila && pl.c1 - pl.c0 > alta.c1 - alta.c0)) alta = pl;
  if (conBoca && alta.c1 - alta.c0 < 3) alta.c1 = alta.c0 + 3;   // la boca necesita sitio
  for (const pl of plats) for (let k = pl.c0; k <= pl.c1; k++) { T[pl.fila][k] = "S"; if (k % 2 === 1) ponerCelda(N, "c", k, pl.fila - 1); }
  ponerCelda(N, "P", plats[0].c0 + 1, plats[0].fila);
  if (conBoca) {
    const pb = alta.c0 + 1, r = alta.fila;
    ponerCelda(N, "X", pb, r - 2);
    T[r - 2][pb + 1] = T[r - 1][pb] = T[r - 1][pb + 1] = "T";
  } else if (alta.fila - 3 >= 0) ponerCelda(N, "1", alta.c0 + 1, alta.fila - 3);
}

/* Tramo llano de la pauta "uno" (como la 1-1 hecha a mano): más enemigos y grupos de bloques, huecos de uno a tres
   bloques con monedas encima y tuberías de dos bloques. Cada hueco tiene dos bloques de suelo a cada lado, para
   saltarlo corriendo, y las tuberías son tan bajas que se saltan sin mantener el salto. Sin enemigos en el punto
   de control, como en ponerTramo */
function ponerTramoUno(N, x, w, tranquilo) {
  if (tranquilo) return;
  const rnd = N.rnd, huecos = new Set(), ocupadas = new Set();
  const enRango = (conjunto, a, b) => { for (let c = a; c <= b; c++) if (conjunto.has(c)) return true; return false; };
  // Hueco de 1 a 3 bloques, hasta el fondo, con sus monedas encima
  if (w >= 6 && rnd() < 0.5) {
    const hw = Math.min(1 + Math.floor(rnd() * 3), w - 4), hc = x + 2 + Math.floor(rnd() * (w - hw - 3));
    for (let c = hc; c < hc + hw; c++) { ponerSuelo(N, ".", c); huecos.add(c); ponerCelda(N, "c", c, N.gy - 2); }  }
  // Enemigos en el suelo (uno, a veces dos), nunca al borde de un hueco
  const enemigo = () => {
    const c = x + 1 + Math.floor(rnd() * (w - 2));
    if (enRango(huecos, c - 1, c + 1) || ocupadas.has(c)) return;
    ponerEnemigo(N, c, N.gy - 1, false);
    ocupadas.add(c);
  };
  if (rnd() < Math.min(0.95, 0.6 + 0.07 * N.dif)) enemigo();
  if (w >= 6 && rnd() < 0.4) enemigo();
  // Grupos de bloques a tres o cuatro filas del suelo, o una escalera de bloques sobre el suelo: uno, y en los tramos
  // largos a veces otro
  const grupo = () => {
    const sec = SECUENCIAS_TRAMO[Math.floor(rnd() * SECUENCIAS_TRAMO.length)];
    const ancho = Math.max(...sec.filas.map((f) => f.length));
    const c0 = x + Math.floor(rnd() * (w - ancho + 1));
    if (ancho > w || (sec.escalera && (enRango(huecos, c0, c0 + ancho - 1) || enRango(ocupadas, c0, c0 + ancho - 1)))) return;
    const base = sec.escalera ? N.gy - 1 : N.gy - 3 - (rnd() < 0.5 ? 1 : 0);
    sec.filas.forEach((fila, k) => [...fila].forEach((ch, j) => {
      if (ch !== ".") ponerCelda(N, ch, c0 + j, base - (sec.filas.length - 1 - k));
    }));
    // Bloque oculto encima de un grupo sencillo a tres filas del suelo: se llega de un salto desde su cima
    if (!sec.escalera && sec.filas.length === 1 && base === N.gy - 3 && rnd() < 0.3) {
      const cz = c0 + Math.floor(ancho / 2);
      if (N.tiles[base - 2][cz] === ".") ponerCelda(N, "1", cz, base - 2);
    }
    if (sec.escalera) for (let c = c0; c < c0 + ancho; c++) ocupadas.add(c);
  };
  if (w >= 5 && rnd() < 0.8) grupo();
  if (w >= 8 && rnd() < 0.35) grupo();
  // Tubería de dos bloques, a veces con planta, en un sitio sin huecos ni enemigos
  if (w >= 6 && rnd() < 0.2) {
    const c0 = x + 1 + Math.floor(rnd() * (w - 3));
    if (!enRango(huecos, c0 - 1, c0 + 2) && !enRango(ocupadas, c0, c0 + 1)) {
      pegarMapa(N, rnd() < 0.5 ? ["pT", "TT"] : ["TT", "TT"], c0, N.gy - 2, false);
      ocupadas.add(c0); ocupadas.add(c0 + 1);
    }
  }
  if (N.dif >= 3 && N.voladores.length && !N.agua && rnd() < 0.25) ponerEnemigo(N, x + Math.floor(w / 2), 5 + Math.floor(rnd() * 3), true);
}

/* Masas de la pauta "uno": de 7 a 10 zonas de suelo macizo que siguen de 5 a 20 filas bajo la superficie, como los
   acantilados de la 1-1. Solo se rellenan las columnas con suelo macizo, así no tapan ningún hueco ni ninguna pieza */
function ponerMasas(N, rnd, cols) {
  const n = 7 + Math.floor(rnd() * 4);
  for (let k = 0; k < n; k++) {
    const ancho = 8 + Math.floor(rnd() * 15), hondo = 5 + Math.floor(rnd() * 16);
    const c0 = 12 + Math.floor(rnd() * Math.max(1, cols - ancho - 52));
    for (let c = c0; c < c0 + ancho; c++) {
      if (N.tiles[N.gy][c] !== "G" || N.protegidas.has(c)) continue;   // bajo las secciones de capas no hay masas
      for (let r = N.gy + N.fondo; r <= Math.min(N.rows - 1, N.gy + hondo); r++) N.tiles[r][c] = "G";
    }
  }
}

// Decoración del suelo abierto (arbustos, árboles, rocas...): no es sólida y se dibuja detrás de todo
function decorarSuelo(N, tema, desde, hasta, prob = 0.14) {
  const piezas = DECOR_DE_TEMA[tema] || [];
  for (let x = desde; x < hasta && piezas.length; x++) {
    if (N.tiles[N.gy][x] !== "G" || N.rnd() > prob) continue;
    const pieza = piezas[Math.floor(N.rnd() * piezas.length)];
    if (pieza.some((_, k) => N.tiles[N.gy - 1 - k][x] !== ".")) continue;
    pieza.forEach((ch, k) => N.decor.push({ ch, c: x, r: N.gy - 1 - k }));
    x++;   // deja al menos un tile libre entre dos piezas
  }
}

/* Genera una fase a partir de gen = { seed, dif, enemigos, theme, jefe, secreta } y de sus mecánicas */
function generarNivel(gen, mecanicas = []) {
  const rnd = prng(gen.seed);
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const dif = clamp(gen.dif || 1, 1, 8);
  const uno = gen.pauta === "uno";   // pauta de la 1-1 hecha a mano (ver ponerTramoUno): más alta, más larga y más poblada
  // Bajo el agua: cangrejos por el fondo, y peces y medusas nadando
  const tipos = gen.agua ? ["cangrejo", "pez_nadador", "medusa"] : gen.enemigos && gen.enemigos.length ? gen.enemigos : ["walker"];
  const piezas = elegirPiezas(rnd, dif, mecanicas, gen.secreta, gen.jefe, gen.avance, gen.agua, uno);
  // Pauta "uno": secciones con zona de abajo y de arriba entre las piezas; la boca de la zona secreta va en una de
  // ellas, no en una pieza de entrada
  let secciones = [];
  if (uno) {
    const ie = piezas.findIndex((p) => p.tipo === "entrada");
    if (ie >= 0) piezas.splice(ie, 1);
    secciones = planCapas(piezas.length, ie, rnd);
  }
  const separaciones = piezas.map(() => (uno ? ri(5, 8) : ri(3, 6)));
  const INICIO = 9 + Math.floor(rnd() * 10), ARENA = gen.jefe ? 34 : 0, FINAL = 22;   // tramo llano inicial
  const anchoPiezas = piezas.reduce((s, p, i) => s + separaciones[i] + Math.max(...p.mapa.map((f) => f.length)), 0);
  const cols = INICIO + anchoPiezas + secciones.reduce((s, sec) => s + sec.ancho, 0) + 4 + ARENA + FINAL;
  const N = nuevoNivel(cols, rnd, dif, tipos, uno ? FILAS_UNO : ROWS);
  N.candidatas = []; N.reserva = [];
  N.agua = !!gen.agua;
  N.fondo = uno ? 3 : 0;   // filas de suelo macizo bajo la superficie (0: hasta el fondo, como antes)
  N.protegidas = new Set();   // columnas de las secciones de capas
  for (let c = 0; c < cols; c++) ponerSuelo(N, "G", c);
  // Punto de control: en el tramo antes de la pieza de la mitad, y siempre después del atajo de la zona secreta
  const iSalida = piezas.findIndex((p) => p.tipo === "salida");
  const iControl = Math.min(piezas.length - 1, Math.max(Math.floor(piezas.length / 2), iSalida + 1));
  let control = null;

  // Piezas, cada una tras un tramo llano
  let x = INICIO;
  piezas.forEach((p, i) => {
    for (const s of secciones) if (s.antes === i) { seccionCapas(N, x, s); x += s.ancho; }
    if (i === iControl) control = { x: (x + 1) * TILE, pie: N.gy * TILE };
    (uno ? ponerTramoUno : ponerTramo)(N, x, separaciones[i], i === iControl);
    x += separaciones[i];
    x += pegarMapa(N, p.mapa, x, N.gy - p.mapa.length + 1, true);
  });
  x += 4;
  // Con lava en la fase, los huecos sin fondo son lagos de lava (bajo los puentes y las plataformas también)
  if (mecanicas.includes("lava")) {
    for (let c = 0; c < cols; c++) if (N.tiles[N.gy][c] === "." && N.tiles[N.rows - 1][c] === ".") for (let r = N.gy + 1; r < N.rows; r++) N.tiles[r][c] = "V";
  }
  // Castillo: la arena del jefe es el suelo llano antes de la escalinata final
  const arenaX0 = x;
  if (gen.jefe) {
    N.ents.push({ t: "boss", x: (x + 20) * TILE, y: (N.gy - 1) * TILE - 16 });
    x += ARENA;
  }
  // Escalinata final de piedra (alturas 1 a 5, la cima de dos bloques) y, ocho bloques después, el poste de meta:
  // desde la cima, con un buen salto corriendo se toca alto (más puntos, o una vida por encima del poste)
  for (let k = 0; k < 6; k++) for (let h = 0; h < Math.min(k + 1, 5); h++) N.tiles[N.gy - 1 - h][x + 2 + k] = "S";
  const goalX = x + 16;
  for (let r = 4; r < N.gy; r++) N.tiles[r][goalX] = "F";
  if (uno) ponerMasas(N, rnd, cols);
  decorarSuelo(N, gen.theme, 4, cols - 4, uno ? 0.2 : 0.14);
  ponerGrandes(N, rnd);
  if (gen.nubarron) N.ents.push({ t: "nubarron", x: 30 * TILE, y: 2 * TILE });   // te sigue toda la fase

  if (gen.jefe) N.ents = N.ents.filter((e) => e.t === "boss" || e.x < arenaX0 * TILE);   // la arena queda libre
  return {
    cols, rows: N.rows, gy: N.gy, sueloMeta: N.gy * TILE, tiles: N.tiles,
    ents: N.ents.filter((e) => e.x >= 10 * TILE),   // el inicio siempre está libre de enemigos
    plats: N.plats, decor: N.decor, canones: N.canones,
    start: { x: 3 * TILE, y: (N.gy - 2) * TILE },
    goalX: goalX * TILE,
    theme: gen.theme || null,
    boss: !!gen.jefe,
    arenaX0: gen.jefe ? arenaX0 * TILE : 0,
    entradaSecreta: N.entrada ? Object.assign({ sala: gen.secreta }, N.entrada) : null,
    salidaSecreta: N.salida,
    control,
    fuentes: surtidores(N.tiles, cols, gen.peces && !gen.agua, null, N.gy, N.rows),
    agua: !!gen.agua,
  };
}

/* Torres: niveles más altos que la pantalla (más de 14 filas). Una cadena de plataformas lleva de la base a la
   cima (o al revés, si es de bajada): cada escalón sube o baja 3 ó 4 filas, y 5 a 7 con un muelle al pie.
   Los pasos entre plataformas tienen como mucho 3 bloques de hueco. La cámara sigue al jugador en vertical. */
function generarTorre(gen, mecanicas = []) {
  const rnd = prng(gen.seed);
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const dif = clamp(gen.dif || 1, 1, 8);
  const cols = 24, rows = gen.alto || 42, bajada = !!gen.bajada;
  const tipos = gen.enemigos && gen.enemigos.length ? gen.enemigos : ["walker"];
  const N = nuevoNivel(cols, rnd, dif, tipos, rows, rows - 3);
  N.candidatas = []; N.reserva = [];
  const gy = N.gy;
  const ocupada = new Set();
  const marcar = (c, r) => ocupada.add(c + "," + r);
  const libre = (c, r) => c > 0 && c < cols - 1 && r > 0 && r < rows && !ocupada.has(c + "," + r) && N.tiles[r][c] === ".";
  // Paredes y techo. La base (de la fila gy hacia abajo) no tiene huecos: no se cae de la torre
  for (let r = 0; r < rows; r++) { N.tiles[r][0] = "S"; N.tiles[r][cols - 1] = "S"; }
  for (let c = 1; c < cols - 1; c++) { N.tiles[0][c] = "S"; for (let r = gy; r < rows; r++) N.tiles[r][c] = "G"; }
  // El muelle lanza hacia arriba: solo se usa al subir. Las plataformas de una dirección salen con su mecánica
  const muelles = mecanicas.includes("muelle") && !bajada, unaDir = mecanicas.includes("una_direccion");
  // Cadena de escalones desde la base hasta la fila 6, que es la cima
  const cadena = [{ c0: 1, c1: cols - 2, r: gy, tipo: "G" }];
  const sitiosPara = (a, w, grande, primero) => {
    const out = [];
    for (let c0 = 1; c0 + w - 1 <= cols - 2; c0++) {
      const c1 = c0 + w - 1;
      if (primero) {
        // Sobre la base (suelo entero): la primera plataforma deja libre una columna junto a cada pared
        if (c0 < 2 || c1 > cols - 3) continue;
        if (bajada && c1 > cols - 5) continue;                                   // en una bajada, el poste de meta está abajo a la derecha
      } else {
        const hueco = Math.max(a.c0 - c1 - 1, c0 - a.c1 - 1);
        if (hueco < 1 || hueco > 3) continue;                                    // un salto de lado: hueco de 1 a 3 bloques, sin solaparse
      }
      if (grande && Math.max(a.c0 + 1, c0 - 2) > Math.min(a.c1 - 1, c1 + 2)) continue;   // el muelle llega a la de arriba
      out.push(c0);
    }
    return out;
  };
  while (cadena[cadena.length - 1].r > 6) {
    const a = cadena[cadena.length - 1], primero = cadena.length === 1;
    const w = ri(3, 5);
    let grande = muelles && rnd() < 0.25 + dif * 0.05;
    let sitios = sitiosPara(a, w, grande, primero);
    if (!sitios.length) { grande = false; sitios = sitiosPara(a, w, false, primero); }
    const dy = Math.min(a.r - 6, grande ? ri(5, 7) : ri(3, 4));
    const r = a.r - dy;
    const c0 = sitios[Math.floor(rnd() * sitios.length)], c1 = c0 + w - 1;
    const u = rnd();
    const tipo = unaDir && u < 0.2 ? "D" : u < 0.5 ? "B" : "G";
    if (grande) {
      // El muelle va sobre la plataforma de abajo, en una casilla desde la que se alcanza la de arriba
      const cm = ri(Math.max(a.c0 + 1, c0 - 2), Math.min(a.c1 - 1, c1 + 2));
      N.tiles[a.r - 1][cm] = "M"; marcar(cm, a.r - 1);
    }
    for (let c = c0; c <= c1; c++) N.tiles[r][c] = tipo;
    cadena.push({ c0, c1, r, tipo });
  }
  const n = cadena.length, top = cadena[n - 1];
  // Poste de meta: en la cima (al subir) o abajo a la derecha (al bajar)
  const meta = bajada ? { c: cols - 3, r: gy } : { c: top.c1, r: top.r };
  for (let r = meta.r - 4; r < meta.r; r++) { N.tiles[r][meta.c] = "F"; marcar(meta.c, r); }
  // Tuberías de la zona secreta: la boca va antes que la salida (al bajar, al revés)
  const tuberia = (i0) => {
    for (const i of [i0, i0 + 1, i0 - 1, i0 + 2, i0 - 2]) {
      const p = cadena[i];
      if (!p || i === 0 || i === n - 1) continue;
      // Primero el lado del escalón contrario al de arriba: el salto hacia el siguiente escalón no pasa por encima
      const arriba = cadena[i + 1], izquierda = !arriba || arriba.c0 > p.c0;
      const sitios = [];
      for (let c = p.c0; c + 1 <= p.c1; c++) sitios.push(c);
      sitios.sort((a, b) => (izquierda ? a - b : b - a));
      for (const c of sitios) {
        // Dos bloques de tubo sobre la plataforma, y libre la casilla donde se para el jugador encima
        const cuerpo = [[c, p.r - 1], [c + 1, p.r - 1], [c, p.r - 2], [c + 1, p.r - 2]];
        if (![...cuerpo, [c, p.r - 3], [c + 1, p.r - 3]].every(([x, y]) => libre(x, y))) continue;
        // Y sin nada encima en cuatro filas: un escalón de arriba taparía el salto hasta la boca
        let despejado = true;
        for (let x = c - 1; x <= c + 2; x++) for (let y = p.r - 7; y <= p.r - 4; y++) {
          if (x >= 1 && x <= cols - 2 && y >= 1 && N.tiles[y][x] !== ".") despejado = false;
        }
        if (!despejado) continue;
        cuerpo.forEach(([x, y]) => { N.tiles[y][x] = "T"; marcar(x, y); });
        return { col: c, row: p.r - 2 };
      }
    }
    return null;
  };
  if (gen.secreta !== undefined) {
    const iE = bajada ? Math.min(n - 2, Math.floor(n * 0.65)) : Math.max(2, Math.floor(n * 0.35));
    N.entrada = tuberia(iE);
    N.salida = tuberia(bajada ? Math.max(1, iE - 2) : Math.min(n - 2, iE + 2));
  }
  // Monedas estrella (sobre las plataformas), monedas sueltas y enemigos. Sin bloques ?: en el aire taparían saltos
  for (const p of cadena.slice(1)) for (let c = p.c0; c <= p.c1; c++) if (c !== meta.c && libre(c, p.r - 1)) N.candidatas.push({ c, r: p.r - 1 });
  for (const p of cadena.slice(1)) {
    for (let c = p.c0; c <= p.c1; c++) if (c !== meta.c && libre(c, p.r - 1) && rnd() < 0.5) N.ents.push({ t: "coin", x: c * TILE + 4, y: (p.r - 1) * TILE + 4 });
  }
  for (let i = 1; i < n; i++) {   // monedas en el aire, en el paso de cada escalón
    const a = cadena[i - 1], b = cadena[i];
    const mc = Math.round((Math.max(a.c0, b.c0) + Math.min(a.c1, b.c1)) / 2), fila = Math.round((a.r + b.r) / 2) - 1;
    if (libre(mc, fila) && rnd() < 0.6) N.ents.push({ t: "coin", x: mc * TILE + 4, y: fila * TILE + 4 });
  }
  for (const p of cadena.slice(2, n - 1)) {
    if (rnd() > 0.3 + dif * 0.06) continue;
    const c = ri(p.c0 + 1, Math.max(p.c0 + 1, p.c1 - 1));
    if (libre(c, p.r - 1)) ponerEnemigo(N, c, p.r - 1, false);
    if (N.voladores.length && dif >= 3 && rnd() < 0.2 && libre(c, p.r - 4)) ponerEnemigo(N, c, p.r - 4, true);
  }
  // Inicio y punto de control (en la plataforma del medio)
  const start = bajada ? { x: (top.c0 + 1) * TILE, y: (top.r - 2) * TILE } : { x: 3 * TILE, y: (gy - 2) * TILE };
  const mitad = cadena[Math.max(1, Math.floor(n / 2))];
  decorarSuelo(N, gen.theme, 2, cols - 2);
  ponerGrandes(N, rnd);
  return {
    cols, rows, gy, sueloMeta: meta.r * TILE, tiles: N.tiles,
    // Sin enemigos ni monedas sueltas junto al inicio: el jugador aparece sobre el suelo libre
    ents: N.ents.filter((e) => !(Math.abs(e.x - start.x) < 4 * TILE && Math.abs(e.y - start.y) < 3 * TILE)),
    plats: [], decor: N.decor, canones: [], start, goalX: meta.c * TILE,
    theme: gen.theme || null, boss: false, arenaX0: 0,
    entradaSecreta: N.entrada ? Object.assign({ sala: gen.secreta }, N.entrada) : null,
    salidaSecreta: N.salida || null,
    control: { x: (mitad.c0 + 1) * TILE, pie: mitad.r * TILE },
    fuentes: [], agua: false,
  };
}

/* Convierte un mapa escrito a mano (array de strings de 14 filas, leyenda de las piezas) en un nivel */
function parsearMapa(strs, gen = {}) {
  const cols = Math.max(...strs.map((f) => f.length));
  const tipos = gen.enemigos && gen.enemigos.length ? gen.enemigos : ["walker"];
  const N = nuevoNivel(cols, prng(gen.seed || 1), gen.dif || 1, tipos, strs.length, GY);
  pegarMapa(N, strs, 0, 0, false);
  const meta = N.tiles.map((f) => f.indexOf("F")).find((c) => c >= 0);
  return {
    cols, rows: N.rows, gy: N.gy, sueloMeta: N.gy * TILE, tiles: N.tiles, ents: N.ents, plats: N.plats, decor: [], canones: N.canones,
    start: N.start || { x: 3 * TILE, y: (N.gy - 2) * TILE },
    goalX: meta !== undefined ? meta * TILE : (cols - 4) * TILE, theme: null, boss: false, arenaX0: 0,
  };
}

// Tuberías de un nivel: la boca de cada tubo de dos bloques (esquina superior izquierda)
function encontrarTuberias(tiles) {
  const out = [];
  for (let r = 1; r < tiles.length; r++) for (let c = 0; c < tiles[r].length - 1; c++) {
    if (tiles[r][c] === "T" && tiles[r][c + 1] === "T" && tiles[r - 1][c] !== "T" && tiles[r - 1][c + 1] !== "T") out.push({ col: c, row: r });
  }
  return out;
}

// Niveles de relieve suave (al estilo de Super Mario Bros. 3): colinas con pendientes, huecos saltables y bloques flotantes.
// El suelo es una superficie continua por columna (lvl.hm), así que las pendientes son reales (ver superficieEn)
function generarColinas(gen) {
  const rnd = prng(gen.seed * 7 + 3);
  const cols = 230, base = GY * TILE, META = cols - 6;
  // Puntos de control: colinas suaves cada 10-16 columnas (hasta 5 bloques de alto) y escalones de 2-3 bloques
  // en 3 columnas, que hay que saltar. Entre medias, tramos llanos
  const puntos = [{ c: 0, y: base }];
  let c = 0, y = base;
  while (c < cols) {
    if (c >= 18 && c < META - 16 && rnd() < 0.3) {
      c = Math.min(cols, c + 3);
      const salto = (2 + Math.floor(rnd() * 2)) * TILE;
      y = Math.min(base, Math.max(base - 5 * TILE, y + (rnd() < 0.5 ? -salto : salto)));
    } else {
      c = Math.min(cols, c + 10 + Math.floor(rnd() * 7));
      const llano = c >= cols || c < 18 || c > META - 14 || rnd() < 0.35;
      y = llano ? base : base - (1 + Math.floor(rnd() * 5)) * TILE;
    }
    puntos.push({ c, y });
  }
  puntos[puntos.length - 1].y = base;
  const hm = new Array(cols + 1);
  for (let i = 0; i + 1 < puntos.length; i++) {
    const a = puntos[i], b = puntos[i + 1];
    for (let x = a.c; x < b.c; x++) {
      const t = (x - a.c) / (b.c - a.c);
      hm[x] = a.y + (b.y - a.y) * (1 - Math.cos(Math.PI * t)) / 2;
    }
  }
  hm[cols] = base;
  // Huecos saltables (2-3 columnas) en el tramo central, unos cuantos por nivel. Ni cerca de un escalón:
  // un hueco junto a un escalón obligaría a dos saltos seguidos
  const sinEscalonCerca = (x0, w) => {
    for (let k = x0 - 6; k <= x0 + w + 6; k++) if (k > 0 && k < cols - 1 && Math.abs(hm[k + 1] - hm[k]) > 9) return false;
    return true;
  };
  for (let x = 20; x < META - 12; x++) {
    if (rnd() > 0.07) continue;
    const w = rnd() < 0.7 ? 2 : 3;
    if (!sinEscalonCerca(x, w)) continue;
    for (let k = 0; k < w; k++) hm[x + k] = Infinity;
    x += w + 6;
  }
  const N = nuevoNivel(cols, rnd, gen.dif || 1, gen.enemigos && gen.enemigos.length ? gen.enemigos : ["walker"]);
  const { tiles, ents, decor } = N;
  const hoyoCerca = (a, b) => { for (let k = a - 6; k <= b + 6; k++) if (hm[k] === Infinity) return true; return false; };
  // Tramo llano alineado con la rejilla (la superficie es el borde de un bloque) de x0 a x1
  const llano = (x0, x1) => {
    const s = hm[x0];
    if (!isFinite(s) || s % TILE !== 0) return false;
    for (let k = x0; k <= x1 + 1; k++) if (hm[k] !== s) return false;
    return true;
  };
  // Zona secreta: la entrada hacia un tercio del nivel y la salida más adelante, sobre suelo llano
  const ocupado = new Set();   // columnas de las tuberías: sin bloques ni enemigos encima
  const tuberia = (desde, hasta, marca, alisar = false) => {
    for (let x = desde; x < hasta; x++) {
      if (hoyoCerca(x, x + 1)) continue;
      if (!llano(x - 1, x + 2)) {
        // Sin tramo llano, con alisar: un trozo casi llano (2 px de desnivel como mucho) se iguala bajo la tubería
        const s = Math.round(hm[x] / TILE) * TILE;
        if (!alisar || !isFinite(hm[x]) || ![-1, 0, 1, 2, 3].every((k) => isFinite(hm[x + k]) && Math.abs(hm[x + k] - s) <= 2)) continue;
        for (let k = x - 1; k <= x + 3; k++) hm[k] = s;
      }
      const r = hm[x] / TILE - 2;
      ponerCelda(N, marca, x, r); ponerCelda(N, "T", x + 1, r);
      ponerCelda(N, "T", x, r + 1); ponerCelda(N, "T", x + 1, r + 1);
      for (let k = x - 3; k <= x + 4; k++) ocupado.add(k);
      return true;
    }
    return false;
  };
  // La entrada de la zona secreta cae en un sitio distinto de cada fase, y la salida, después de ella
  const entrada0 = Math.floor(META * (0.12 + rnd() * 0.4));
  const salida0 = Math.min(META - 14, entrada0 + Math.floor(META * (0.2 + rnd() * 0.2)));
  const salidaMin = Math.max(entrada0 + 4, Math.floor(META * 0.58));
  if (gen.secreta !== undefined && tuberia(entrada0, entrada0 + Math.floor(META * 0.25), "X")) {
    if (!tuberia(salida0, META - 14, "R") && !tuberia(salidaMin, META - 5, "R")) {
      tuberia(salidaMin, META - 5, "R", true);   // sin tramo llano en todo el nivel, la salida va sobre un trozo casi llano
    }
  }
  // Monedas: guías sobre los huecos (tres bloques por encima del borde más alto) y arcos sobre las colinas
  const bordeHueco = (x) => {
    let a = x, b = x;
    while (a > 0 && hm[a] === Infinity) a--;
    while (b < cols && hm[b] === Infinity) b++;
    return Math.min(hm[a], hm[b]);
  };
  for (let x = 18; x < META - 14; x++) {
    if (hm[x] === Infinity) ents.push({ t: "coin", x: x * TILE + 4, y: Math.floor(bordeHueco(x) / TILE) * TILE - 3 * TILE + 4 });
    else if (x % 9 === 0 && rnd() < 0.4) {
      for (let k = -1; k <= 1; k++) if (hm[x + k] !== Infinity) ents.push({ t: "coin", x: (x + k) * TILE + 4, y: Math.round(hm[x + k] - 26) });
    }
  }
  // Grupos de bloques sobre tramos llanos, a cuatro bloques del suelo (como en la pradera clásica):
  // la fila se golpea desde el suelo y, en los grupos con un ? encima, ese ? se alcanza desde la fila.
  // Nunca junto a un hueco: un bloque sobre la entrada del salto golpea la cabeza y se cae
  const FORMAS = [["BQB"], ["QQQ"], ["BPB"], ["BKB"], ["..Q..", "BBPBB"], ["..P..", "BQBQB"]];
  let ocultoPuesto = false;
  // Bajo el grupo, el suelo apenas sube o baja (como mucho bloque y medio) y la fila queda a cuatro bloques
  // de su punto más alto
  for (let x = 22; x < META - 16; x++) {
    if (rnd() > 0.12) continue;
    const forma = FORMAS[Math.floor(rnd() * FORMAS.length)];
    const w = forma[0].length;
    const bajo = hm.slice(x - 1, x + w + 2);
    if (bajo.some((v) => !isFinite(v)) || Math.max(...bajo) - Math.min(...bajo) > 24) continue;
    if (hoyoCerca(x, x + w) || ocupado.has(x) || ocupado.has(x + w)) continue;
    const fila = Math.floor(Math.min(...bajo) / TILE) - 4 - (forma.length - 1) * 4;
    if (fila < 2) continue;
    forma.forEach((linea, i) => [...linea].forEach((ch, k) => ponerCelda(N, ch, x + k, fila + i * 4)));
    x += w + 8;
  }
  // Monedas estrella: altas sobre los huecos (hay que saltar fuerte) y sobre las cimas de las colinas
  N.candidatas = []; N.reserva = [];
  for (let x = 20; x < META - 12; x++) {
    if (hm[x] === Infinity && hm[x - 1] !== Infinity) {
      let b = x; while (hm[b + 1] === Infinity) b++;
      N.candidatas.push({ c: Math.floor((x + b) / 2), r: Math.floor(bordeHueco(x) / TILE) - 5 });
    } else if (isFinite(hm[x]) && hm[x] <= base - 3 * TILE && hm[x] <= hm[x - 1] && hm[x] < hm[x + 1] && !ocupado.has(x)) {
      N.candidatas.push({ c: x, r: Math.floor(hm[x] / TILE) - 4 });
    }
  }
  N.candidatas = N.candidatas.filter((st) => st.r >= 2 && !ocupado.has(st.c));
  ponerGrandes(N, rnd);
  if (gen.nubarron) N.ents.push({ t: "nubarron", x: 30 * TILE, y: 2 * TILE });
  // Punto de control hacia la mitad, en suelo casi llano, lejos de huecos y de las tuberías
  let control = null;
  for (let x = Math.floor(META / 2); x < META - 20 && !control; x++) {
    if (isFinite(hm[x]) && Math.abs(hm[x + 1] - hm[x]) < 2 && !hoyoCerca(x, x) && !ocupado.has(x)) control = { x: x * TILE, pie: hm[x] };
  }
  // Una vida escondida en un bloque oculto sobre un tramo llano sin nada encima
  for (let x = 40; x < META - 30 && !ocultoPuesto; x++) {
    if (rnd() > 0.05 || !llano(x - 1, x + 1) || hoyoCerca(x, x) || ocupado.has(x)) continue;
    const fila = hm[x] / TILE - 4;
    let libre = fila >= 2;
    for (let r = 0; r < hm[x] / TILE && libre; r++) for (let k = x - 1; k <= x + 1; k++) if (tiles[r][k] !== ".") libre = false;
    if (!libre) continue;
    ponerCelda(N, "1", x, fila);
    ocultoPuesto = true;
  }
  // Enemigos del mundo que caminan (o vuelan) sobre los tramos llanos
  const tipos = N.caminantes.concat(N.voladores);
  for (let x = 18; x < META - 16 && tipos.length; x++) {
    if (rnd() > 0.045 + 0.01 * (gen.dif || 1)) continue;
    if (hm[x] === Infinity || hm[x + 4] === Infinity || Math.abs(hm[x + 4] - hm[x]) > 6 || ocupado.has(x)) continue;
    const t = tipos[Math.floor(rnd() * tipos.length)];
    if (VOLADORES.includes(t)) ents.push({ t, x: x * TILE, y: Math.max(2, Math.floor(hm[x] / TILE) - 4) * TILE });
    else ents.push({ t, x: x * TILE, y: Math.round(hm[x]) - TILE });
    x += 6;
  }
  // Arbustos y flores sobre el suelo llano
  for (let x = 4; x < META - 8; x++) {
    if (hm[x] === Infinity || rnd() > 0.1 || Math.abs(hm[x + 2] - hm[x]) > 4 || ocupado.has(x)) continue;
    decor.push({ c: x, r: Math.floor(hm[x] / TILE) - 1, ch: rnd() < 0.7 ? "b" : "f" });
  }
  for (let r = 4; r < GY; r++) tiles[r][META] = "F";   // poste de meta
  return {
    cols, rows: ROWS, tiles, ents, plats: [], decor, canones: [],
    start: { x: 3 * TILE, y: Math.round(hm[3]) - TILE },
    goalX: META * TILE, theme: gen.theme || null, boss: false, arenaX0: 0, hm,
    entradaSecreta: N.entrada ? Object.assign({ sala: gen.secreta }, N.entrada) : null,
    salidaSecreta: N.salida,
    control,
    fuentes: surtidores(tiles, cols, gen.peces, hm),
  };
}

/* Última pasada sobre cualquier nivel: nada fuera de sitio. Quita las monedas que tocan un bloque,
   una tubería, el terreno de las colinas o una plataforma, y los enemigos que nacerían dentro de un bloque */
function sanearNivel(lv) {
  const ocupada = (c, r) => {
    if (c < 0 || c >= lv.cols || r < 0 || r >= lv.rows) return false;
    const t = lv.tiles[r][c];
    return t !== "." && t !== "L";
  };
  const tocaAlgo = (x, y, w, h) => {
    for (let r = Math.floor(y / TILE); r <= Math.floor((y + h - 0.01) / TILE); r++)
      for (let c = Math.floor(x / TILE); c <= Math.floor((x + w - 0.01) / TILE); c++) if (ocupada(c, r)) return true;
    if (lv.hm && y + h > superficieMin(lv, x, w)) return true;
    return (lv.plats || []).some((p) => x < p.x + p.w && x + w > p.x && y < p.y + p.h && y + h > p.y);
  };
  const monedas = new Set();
  const grandes = lv.ents.filter((e) => e.t === "grande");
  const sobreGrande = (x, y) => grandes.some((g) => x < g.x + TILE && x + 8 > g.x && y < g.y + TILE && y + 10 > g.y);
  const junto = (e) => lv.control && Math.abs(e.x - lv.control.x) < 4 * TILE;
  lv.ents = lv.ents.filter((e) => {
    if (e.t === "grande") return true;
    if (e.t === "coin") {
      const k = e.x + "," + e.y;
      if (monedas.has(k) || tocaAlgo(e.x, e.y, 8, 10) || sobreGrande(e.x, e.y)) return false;
      monedas.add(k);
      return true;
    }
    if (e.t === "qitem") return "QZB".includes(lv.tiles[Math.floor(e.y / TILE)][Math.floor(e.x / TILE)]);
    if (e.t === "boss" || e.t === "plant" || e.t === "planta_zombie" || e.t === "girasol") return true;
    if (junto(e)) return false;   // al volver al punto de control no hay un enemigo encima
    return !ocupada(Math.floor((e.x + TILE / 2) / TILE), Math.floor((e.y + TILE / 2) / TILE));
  });
  return lv;
}
