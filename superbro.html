/* =====================================================================
   13d. ESCENARIO DE VAN GOGH: cielo en remolinos de pinceladas, sol o luna con estrellas,
   pueblo con su iglesia, cipreses en llama y un campo de trigo al pie del horizonte
   ===================================================================== */
// Colores de cada momento: de día (azul con sol y trigo dorado) o de noche (la noche estrellada)
const COLORES_VG = {
  dia: {
    cielo: ["#2f5fb3", "#f2d27a"],                 // de arriba abajo: azul intenso hasta el amarillo del horizonte
    remolino: ["#8fb3e0", "#4a7fc4", "#2f5fb3"],   // pinceladas claras, medias y oscuras
    trigo: ["#ffe066", "#f2c14e", "#c48a2c"],
    cipres: ["#2e6b4f", "#1f4d3a", "#153629"],     // luz, cuerpo y sombra
    casa: ["#f2c14e", "#c98f3a", "#3d4f8a"],       // pared iluminada, pared en sombra y tejado azul
  },
  noche: {
    cielo: ["#13245e", "#24489a"],
    remolino: ["#5f8fd6", "#2f5fb3", "#1d3b8a"],
    trigo: ["#9a7a2a", "#6e5520", "#4a3a18"],
    cipres: ["#2a5a48", "#173a2e", "#0d2219"],
    casa: ["#9a7a2a", "#6e5520", "#243163"],
  },
};

// Remolinos del cielo: anillos ondulados alrededor de unos centros, con pinceladas sueltas entre ellos.
// Es periódica en X (512 de ancho) y sus ondas dan un número entero de vueltas para que no se note la unión
function texRemolinosVG(modo) {
  return textura("vg-remolinos-" + modo, () => {
    const ancho = 512, alto = 176;
    const [claro, medio, oscuro] = COLORES_VG[modo].remolino;
    const centros = [[84, 58, 52], [228, 92, 40], [360, 56, 52], [462, 112, 34]];   // [x, y, radio]
    const rows = [];
    for (let y = 0; y < alto; y++) {
      let f = "";
      for (let x = 0; x < ancho; x++) {
        let ch = ".";
        for (const [cx, cy, R] of centros) {
          const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy);
          if (d > R) continue;
          // El ángulo tuerce los anillos: se leen como remolinos y no como círculos perfectos
          const anillo = Math.floor((d + 2.5 * Math.sin(2 * Math.atan2(dy, dx) + d * 0.25)) / 4);
          ch = ["c", "m", "o"][mod(anillo, 3)];
        }
        // Pinceladas cortas y onduladas: bandas que siguen la ola y tramos de 11 px
        const ola = Math.round(2 * Math.sin((x / ancho) * Math.PI * 8 + y * 0.2));
        const banda = Math.floor((y + ola) / 23);
        if (ch === "." && mod(y + ola, 23) < 2 && mod(Math.floor(x / 16) * 3 + banda, 4) !== 0 && x % 16 < 11) ch = "c";
        f += ch;
      }
      rows.push(f);
    }
    const sp = spriteFromRows(expandir(rows), { c: claro, m: medio, o: oscuro }, false, true, false);
    sp.tw = ancho;
    return sp;
  });
}

// Cipreses en llama recortados contra el cielo, con la base en el horizonte (periódicos en X)
function texCipresesVG(modo) {
  return textura("vg-cipreses-" + modo, () => {
    const ancho = 512, base = 176;
    const [luz, cuerpo, sombra] = COLORES_VG[modo].cipres;
    const cipreses = [[44, 14, 118], [150, 10, 92], [292, 12, 126], [410, 11, 98]];   // [x, ancho máximo, alto]
    const rows = [];
    for (let y = 0; y < base; y++) {
      let f = "";
      for (let x = 0; x < ancho; x++) {
        let ch = ".";
        for (const [cx, wmax, alto] of cipreses) {
          const arriba = base - alto;
          if (y < arriba) continue;
          const t = (y - arriba) / alto;                                        // 0 en la punta, 1 en la base
          const hw = wmax * Math.min(1, t / 0.15) * (0.35 + 0.65 * t ** 0.8);    // punta fina que se ensancha
          const dx = x - cx - 1.5 * Math.sin(y * 0.2 + cx);                     // la llama ondula
          if (Math.abs(dx) > hw) continue;
          ch = dx < -hw * 0.3 ? "h" : dx > hw * 0.6 ? "k" : "g";
          if ((x + 2 * y) % 11 === 0) ch = "h";                                 // pinceladas claras
        }
        f += ch;
      }
      rows.push(f);
    }
    const sp = spriteFromRows(expandir(rows), { h: luz, g: cuerpo, k: sombra }, false, true, false);
    sp.tw = ancho;
    return sp;
  });
}

// Pueblo al fondo, como el de Auvers: casas con tejado a dos aguas, ventanas encendidas y una iglesia de torre alta
function texPuebloVG(modo) {
  return textura("vg-pueblo-" + modo, () => {
    const ancho = 512, base = 176;
    const [pared, sombra, tejado] = COLORES_VG[modo].casa;
    const grid = Array.from({ length: base }, () => Array(ancho).fill("."));
    const poner = (x, y, ch) => { if (x >= 0 && x < ancho && y >= 0 && y < base) grid[y][x] = ch; };
    // Un edificio: [x, ancho, alto del muro, alto del tejado]
    const edificio = (x0, w, muro, techo) => {
      for (let x = x0; x < x0 + w; x++) {
        for (let y = base - muro; y < base; y++) poner(x, y, x - x0 < w / 2 ? "a" : "s");
        for (let y = base - muro - techo; y < base - muro; y++) {
          const k = (y - (base - muro - techo)) / techo;                 // 0 en la cumbre, 1 en el alero
          if (Math.abs(x + 0.5 - (x0 + w / 2)) <= (w / 2 + 1) * k) poner(x, y, "t");
        }
      }
      for (const vx of [x0 + 3, x0 + w - 6]) for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) poner(vx + dx, base - muro + 3 + dy, "w");
      for (let y = base - 4; y < base; y++) for (let dx = -1; dx <= 1; dx++) poner(x0 + Math.floor(w / 2) + dx, y, "d");   // puerta
    };
    [[16, 24, 16, 11], [52, 18, 12, 9], [88, 28, 22, 13], [126, 20, 14, 10],
     [330, 24, 18, 12], [362, 30, 24, 14], [404, 18, 13, 9]].forEach((e) => edificio(...e));
    // Iglesia: torre con reloj y una aguja que acaba en punta
    const tx = 226, tw = 12, tAlto = 56, agujaAlto = 20;
    for (let x = tx; x < tx + tw; x++) {
      for (let y = base - tAlto; y < base; y++) poner(x, y, x - tx < tw / 2 ? "a" : "s");
      for (let y = base - tAlto - agujaAlto; y < base - tAlto; y++) {
        const k = (y - (base - tAlto - agujaAlto)) / agujaAlto;          // 0 en la punta, 1 en la base de la aguja
        if (Math.abs(x + 0.5 - (tx + tw / 2)) <= (tw / 2) * k) poner(x, y, "t");
      }
    }
    poner(tx + 5, base - tAlto + 8, "w");
    poner(tx + 6, base - tAlto + 8, "w");
    const sp = spriteFromRows(expandir(grid.map((r) => r.join(""))), { a: pared, s: sombra, t: tejado, w: "#ffe066", d: "#2a1f1a" }, false, true, false);
    sp.tw = ancho;
    return sp;
  });
}

// Trigo al pie del horizonte: espigas de alturas distintas que se mecen (periódico en X)
function texTrigoVG(modo) {
  return textura("vg-trigo-" + modo, () => {
    const ancho = 512, alto = 26;
    const [claro, medio, oscuro] = COLORES_VG[modo].trigo;
    const grid = Array.from({ length: alto }, () => Array(ancho).fill("."));
    for (let x = 0; x < ancho; x += 3) {
      // Una espiga cada 3 px: su altura ondula con la onda de periodo entero, y alterna dos tonos
      const espiga = Math.round(10 + 5 * Math.sin((x / ancho) * Math.PI * 12) + 3 * Math.sin((x / ancho) * Math.PI * 28));
      for (let y = alto - espiga; y < alto; y++) grid[y][x] = (x / 3) % 2 ? medio : claro;
    }
    for (let y = alto - 3; y < alto; y++) for (let x = 0; x < ancho; x++) if (grid[y][x] === ".") grid[y][x] = "o";   // base oscura
    const sp = spriteFromRows(expandir(grid.map((r) => r.join(""))), { c: claro, m: medio, o: oscuro }, false, true, false);
    sp.tw = ancho;
    return sp;
  });
}

// Sol de los días de trigo: disco amarillo con un halo ancho que tiñe el cielo alrededor
function dibujarSolVG(pal) {
  const cx = W - 58, cy = 52;
  const halo = ctx.createRadialGradient(cx, cy, 10, cx, cy, 56);
  halo.addColorStop(0, "rgba(255,233,138,0.55)");
  halo.addColorStop(1, "rgba(255,233,138,0)");
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(cx, cy, 56, 0, Math.PI * 2); ctx.fill();
  dibujarSol(pal, cx - 11, cy - 11);
}

// Luna creciente de la noche estrellada: un disco amarillo al que otro disco le quita el lado izquierdo
function lunaVG(color = "#ffe98a") {
  return textura("vg-luna-" + color, () => {
    const R = 9, rows = [];
    for (let y = -R; y <= R; y++) {
      let f = "";
      for (let x = -R; x <= R; x++) {
        const dentro = x * x + y * y <= R * R;
        const quitada = (x - 4) * (x - 4) + (y + 2) * (y + 2) <= (R - 1) * (R - 1);
        f += dentro && !quitada ? "y" : ".";
      }
      rows.push(f);
    }
    return spriteFromRows(expandir(rows), { y: color }, false, false, false);
  });
}

// Estrellas de la noche, repartidas por todo el cielo (también por encima del área de diseño):
// puntos amarillos que parpadean, y destellos en cruz en una de cada cuatro
function estrellasVG() {
  const t = performance.now(), alto = OY + 102;   // del borde de la pantalla hasta la línea de los tejados
  for (let i = 0; i < 26; i++) {
    const x = (i * 67 + 23) % W, y = ((i * 37 + 9) % alto) - OY, f = 0.7 + (i % 4) * 0.45;
    ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin((t / 420) * f + i));
    rect(x, y, 1, 1, "#fff3a0");
    if (i % 4 === 0) {
      rect(x - 2, y, 5, 1, "#ffe066");
      rect(x, y - 2, 1, 5, "#ffe066");
    }
  }
  ctx.globalAlpha = 1;
}

// Escenario de Van Gogh: capas con parallax. El trigo de primer plano casi se mueve con el suelo
function escenaVanGogh(cam, pal, hora) {
  const modo = hora >= 0.6 ? "noche" : "dia";
  const [arriba, abajo] = COLORES_VG[modo].cielo;
  const cielo = ctx.createLinearGradient(0, 0, 0, OY + 176);
  cielo.addColorStop(0, arriba);
  cielo.addColorStop(1, abajo);
  ctx.fillStyle = cielo;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(0, OY);
  // El cielo de remolinos se repite hacia arriba hasta el borde de la pantalla (en los visores altos)
  const remolinos = texRemolinosVG(modo);
  for (let k = 0; k <= Math.ceil(OY / 176); k++) capaPeriodica(remolinos, cam.x + k * 97, 0.12, -176 * k);
  if (modo === "dia") dibujarSolVG(pal);
  else {
    estrellasVG();
    drawSprite(lunaVG(), W - 62, 22);
  }
  capaPeriodica(texPuebloVG(modo), cam.x, 0.3, 0);
  capaPeriodica(texCipresesVG(modo), cam.x, 0.45, 0);
  capaPeriodica(texTrigoVG(modo), cam.x, 0.9, 150);
  ctx.restore();
}

/* =====================================================================
   13f. FONDO DEL VELERO DE MARIPOSAS (inspirado en la pintura de un velero con velas de mariposas):
   cielo de cúmulos y estelas, mar turquesa con olas, orilla con pescadores y un velero que avanza
   despacio con sus velas hechas de mariposas que aletean
   ===================================================================== */
// Mariposa de píxeles: alas superiores grandes y alas inferiores más pequeñas, separadas del cuerpo,
// con un ojo en cada ala superior y dos antenas. abierta: 1 con las alas abiertas, 0.55 a medio batir,
// 0.15 casi cerradas; tam: medida de las alas
function figuraMariposa(abierta, tam) {
  const R = Math.ceil(tam * 1.6) + 2, filas = [], A = abierta;
  const cuerpoTop = Math.round(tam * 0.9), antenaLarga = Math.max(2, Math.round(tam * 0.4));
  for (let y = -R; y <= R; y++) {
    let f = "";
    for (let x = -R; x <= R; x++) {
      const ax = Math.abs(x);
      const arriba = ((ax - tam * 1.0 * A) / (tam * 0.7 * A + 0.4)) ** 2 + ((y + tam * 0.6) / (tam * 0.6)) ** 2 <= 1;
      const abajo = ((ax - tam * 0.65 * A) / (tam * 0.45 * A + 0.4)) ** 2 + ((y - tam * 0.75) / (tam * 0.4)) ** 2 <= 1;
      const cuerpo = ax < 0.5 && Math.abs(y) <= cuerpoTop;
      const antena = ax >= 1 && ax <= antenaLarga && y === -cuerpoTop - ax;
      if (cuerpo || antena) f += "k";
      else if (arriba || abajo) f += (ax - tam * 1.0 * A) ** 2 + (y + tam * 0.6) ** 2 < 0.1 * tam * tam ? "y" : "x";
      else f += ".";
    }
    filas.push(f);
  }
  return filas;
}

// Mariposa lista para dibujar (cacheada por tamaño, color y fotograma: 0 con las alas abiertas, 1 a medio batir, 2 casi cerrada)
const ALETEO_MARIPOSA = [1, 0.55, 0.15];
const SECUENCIA_ALETEO = [0, 1, 2, 1];
const COLORES_MARIPOSA = ["#f08a2c", "#ffd23f", "#3fa36b", "#f4f1e8", "#2f6fbf", "#d8422b", "#c066d8"];
function mariposaBarco(color, tam, fotograma) {
  return textura("mariposa-" + tam + "-" + color + "-" + fotograma, () =>
    spriteFromRows(expandir(figuraMariposa(ALETEO_MARIPOSA[fotograma], tam)), { x: color, y: "#fff6e0", k: "#1d1d26" }));
}

// Cúmulos blancos con la base azulada, como los de la pintura (periódicos en X)
function texNubesBarco() {
  return textura("barco-nubes", () => {
    const L = lienzoPixeles(512, 72);
    for (const [cx, cy, k] of [[52, 40, 1], [190, 34, 0.8], [330, 44, 1.2], [440, 30, 0.7]]) {
      for (const [dx, dy, r] of [[-16, 4, 11], [-4, -4, 14], [10, -2, 13], [22, 6, 9], [0, 8, 12], [-24, 10, 7], [28, 10, 7]]) {
        const R = r * k;
        for (let y = -R; y <= R; y++) for (let x = -R; x <= R; x++) {
          if (x * x + y * y > R * R) continue;
          const vy = Math.round(dy * k + y);   // la sombra depende de la altura dentro de la nube, no de cada bola
          L.poner(Math.round(cx + dx * k + x), Math.round(cy + vy), vy > 7 * k ? "g" : vy > -3 * k ? "l" : "w");
        }
      }
    }
    return L.sprite({ w: "#ffffff", l: "#e3edf8", g: "#b7cadf" });
  });
}

// Estelas finas y blancas, como las nubes alargadas del cielo (periódicas en X)
function texEstelasBarco() {
  return textura("barco-estelas", () => {
    const L = lienzoPixeles(512, 40);
    for (let k = 0; k < 16; k++) {
      const x0 = (k * 131) % 480, y0 = 4 + ((k * 37) % 28), largo = 40 + (k % 4) * 18;
      for (let d = 0; d < largo; d++) L.poner(x0 + d, y0 + Math.round(d * 0.08), d % 9 < 7 ? "w" : "l");
    }
    return L.sprite({ w: "#ffffff", l: "#d7e9f7" });
  });
}

// Olas del mar turquesa: crestas blancas a tramos y pliegues azules (periódicas en X)
function texOlasBarco() {
  return textura("barco-olas", () => {
    const L = lienzoPixeles(512, 64);
    for (let y = 0; y < 64; y++) for (let x = 0; x < 512; x++) {
      const fila = mod(y + Math.round(3 * Math.sin((x / 512) * Math.PI * 16 + y * 0.5)), 10);
      const tramo = mod(Math.floor(x / 4) + y, 8);
      if (fila <= 1 && tramo < 6) L.poner(x, y, "w");
      else if (fila === 5 && tramo < 5) L.poner(x, y, "d");
    }
    return L.sprite({ w: "#e6fbff", d: "#1b5f86" });
  });
}

// Orilla lejana a la derecha: una roca baja y pescadores de silueta con sus cañas (periódica en X)
function texOrillaBarco() {
  return textura("barco-orilla", () => {
    const L = lienzoPixeles(512, 26), base = 22;
    const roca = (x) => Math.round(7 * Math.sqrt(Math.max(0, Math.sin(((x - 180) / 116) * Math.PI))));
    for (let x = 180; x < 296; x++) for (let y = base - roca(x); y < base; y++) L.poner(x, y, "r");
    for (const fx of [204, 219, 234, 249]) {
      const pie = base - roca(fx);
      for (let y = pie - 7; y < pie; y++) L.poner(fx, y, "f");                                  // cuerpo
      L.poner(fx - 1, pie - 9, "f"); L.poner(fx, pie - 9, "f"); L.poner(fx, pie - 10, "f");      // cabeza
      for (let k = 0; k < 10; k++) L.poner(fx + 1 + Math.round(k * 0.6), pie - 9 - k, "f");      // caña inclinada
    }
    return L.sprite({ r: "#4a4a3a", f: "#1d2026" });
  });
}

// Casco de madera con banda crema, castillo de popa, tres mástiles con vergas y una bandera.
// La matriz mide 84×70 y su origen (el centro de la quilla) está en la columna 42 y la fila 66
function texVeleroBarco() {
  return textura("barco-velero", () => {
    const L = lienzoPixeles(84, 70), ox = 42, oy = 66;
    for (let x = -36; x <= 34; x++) {
      const u = (x + 1) / 35, fondo = Math.round(10 * Math.sqrt(Math.max(0, 1 - u * u)));   // profundo en el centro y afinado en los extremos
      for (let y = -10; y <= -10 + fondo; y++) L.poner(ox + x, oy + y, y === -10 ? "l" : y === -7 ? "c" : y === -10 + fondo ? "d" : "w");
    }
    for (let x = 18; x <= 32; x++) for (let y = -19; y <= -11; y++) L.poner(ox + x, oy + y, y === -19 ? "l" : "w");   // castillo de popa
    for (const [x, y] of [[21, -16], [22, -16], [27, -16], [28, -16]]) L.poner(ox + x, oy + y, "k");                    // ventanas
    for (const mx of [-18, 2, 20]) {
      for (let y = -62; y <= -11; y++) { L.poner(ox + mx, oy + y, "d"); L.poner(ox + mx + 1, oy + y, "d"); }          // mástil
      for (const vy of [-52, -40, -28]) for (let x = mx - 10; x <= mx + 10; x++) L.poner(ox + x, oy + vy, "d");       // vergas
    }
    for (let k = 0; k < 6; k++) for (let x = 2; x <= 2 + (5 - k); x++) L.poner(ox + x, oy - 62 + k, "r");            // bandera
    return L.sprite({ l: "#c9955a", w: "#8a5a2a", d: "#4a2e16", c: "#f2e6c8", k: "#1d1d26", r: "#d8422b" }, true);
  });
}

// Velero: sus velas son mariposas grandes (dos por mástil, una encima de otra, centradas en el mástil) que
// aletean; cada una tiene su propio momento
function dibujarVeleroBarco(sx, sy, t) {
  drawSprite(texVeleroBarco(), sx - 42, sy - 66);
  let i = 0;
  for (const mx of [-18, 2, 20]) for (const dy of [-46, -28]) {
    const sp = mariposaBarco(COLORES_MARIPOSA[i % COLORES_MARIPOSA.length], 7.5, SECUENCIA_ALETEO[(Math.floor(t * 7) + i) % 4]);
    drawSprite(sp, sx + mx - sp.lw / 2, sy + dy - sp.lh / 2);
    i++;
  }
}

// Escenario del velero de mariposas: cielo de cúmulos, luna pálida, orilla con pescadores, mar turquesa con olas,
// un velero que avanza despacio hacia la izquierda y mariposas que vuelan y que nadan
function escenaBarco(cam) {
  const t = performance.now() / 1000;
  const cielo = ctx.createLinearGradient(0, 0, 0, OY + 112);
  cielo.addColorStop(0, "#2b6cb8");
  cielo.addColorStop(0.35, "#4f8fd0");
  cielo.addColorStop(0.7, "#8ec3e6");
  cielo.addColorStop(1, "#d2ecf6");
  ctx.fillStyle = cielo;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(0, OY);
  // Estelas y nubes: el cielo se repite hacia arriba en los visores altos, cada copia desplazada
  const estelas = texEstelasBarco(), nubes = texNubesBarco();
  for (let k = 0; k <= Math.ceil(OY / 112); k++) {
    capaPeriodica(estelas, cam.x * 0.1 + t * 4 + k * 173, 1, 14 - 112 * k);
    capaPeriodica(nubes, cam.x * 0.15 + t * 5 + k * 211, 1, 4 - 112 * k);
  }
  drawSprite(lunaVG("#f4f1e8"), W - 46, 14);
  capaPeriodica(texOrillaBarco(), cam.x * 0.5, 1, 90);
  // Mar turquesa con olas que avanzan hacia la derecha
  const mar = ctx.createLinearGradient(0, 112, 0, 176);
  mar.addColorStop(0, "#3aaec0");
  mar.addColorStop(1, "#15708a");
  ctx.fillStyle = mar;
  ctx.fillRect(0, 112, W, 64);
  capaPeriodica(texOlasBarco(), cam.x * 0.35 + t * 14, 1, 112);
  // Velero: avanza despacio hacia la izquierda y se mece con las olas
  const sx = W + 90 - mod(t * 10 + cam.x * 0.3, W + 180);
  dibujarVeleroBarco(sx, 116 + 1.2 * Math.sin(t * 1.6), t);
  // Mariposas que cruzan el cielo y una grande que nada en la superficie
  [[0, "#f08a2c", 3], [1, "#ffd23f", 3], [2, "#2f6fbf", 3]].forEach(([v, color, tam]) => {
    const x = mod(t * (16 - v * 3) + v * 97, W + 40) - 20, y = 52 + v * 14 + 10 * Math.sin(t * 1.1 + v);
    const sp = mariposaBarco(color, tam, SECUENCIA_ALETEO[(Math.floor(t * 9) + v) % 4]);
    drawSprite(sp, x - sp.lw / 2, y - sp.lh / 2);
  });
  const nadadora = mariposaBarco("#3fa36b", 4, SECUENCIA_ALETEO[Math.floor(t * 6) % 4]);
  drawSprite(nadadora, 26 + 3 * Math.sin(t * 0.7) - nadadora.lw / 2, 134 + 2 * Math.sin(t * 1.9) - nadadora.lh / 2);
  ctx.restore();
}

/* =====================================================================
   13e. ESCENARIOS DEL MUNDO 10: Dalí (inspirado en "La persistencia de la memoria": cielo que se dora,
   bahía con pueblo, acantilados de ocre, llano oscuro y relojes que se derriten), Miró (fondo crema con
   estrellas y colores primarios) y Gaudí (cielo azul y torres de trencadís)
   ===================================================================== */
// Lienzo de caracteres para las texturas de los escenarios. poner() pinta un píxel; pegar() copia una figura;
// trazo() dibuja un grosor que se estrecha de un extremo al otro, con luz, medio y sombra
function lienzoPixeles(ancho, alto) {
  const filas = Array.from({ length: alto }, () => Array(ancho).fill("."));
  const poner = (x, y, ch) => { if (x >= 0 && x < ancho && y >= 0 && y < alto) filas[y][x] = ch; };
  const pegar = (figura, x0, y0) => figura.forEach((r, dy) => [...r].forEach((ch, dx) => { if (ch !== ".") poner(x0 + dx, y0 + dy, ch); }));
  const trazo = (x0, y0, x1, y1, g0, g1, [luz, medio, sombra]) => {
    const pasos = Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 2);
    for (let k = 0; k <= pasos; k++) {
      const t = k / pasos, cx = x0 + (x1 - x0) * t, cy = y0 + (y1 - y0) * t, g = g0 + (g1 - g0) * t, G = Math.ceil(g);
      for (let dy = -G; dy <= G; dy++) for (let dx = -G; dx <= G; dx++) {
        if (Math.abs(dx) + Math.abs(dy) > g + 0.5) continue;
        poner(Math.round(cx + dx), Math.round(cy + dy), dx < -g * 0.35 ? luz : dx > g * 0.35 ? sombra : medio);
      }
    }
  };
  const sprite = (paleta, contorno = false) => {
    const sp = spriteFromRows(expandir(filas.map((r) => r.join(""))), paleta, contorno, true, false);
    sp.tw = ancho;
    return sp;
  };
  return { poner, pegar, trazo, sprite };
}

// Reloj blando: una esfera de bolsillo que se estira y se escurre por su lado derecho (w y h en píxeles de diseño)
function figuraRelojDali(w, h, goteo) {
  const filas = Array.from({ length: h + goteo }, () => Array(w).fill("."));
  const cx = (w - 1) / 2, cy = (h - 1) / 2;
  for (let x = 0; x < w; x++) {
    const u = (x - cx) / (w / 2);                                        // de -1 a 1
    const semi = Math.sqrt(Math.max(0, 1 - u * u)) * (h / 2);           // semialtura de la esfera en esta columna
    const arriba = Math.max(0, Math.round(cy - semi)), abajo = Math.round(cy + semi + Math.max(0, u) * goteo);
    for (let y = arriba; y <= abajo && y < filas.length; y++) {
      filas[y][x] = y === arriba || y === abajo || x === 0 || x === w - 1 ? "g" : "f";
    }
  }
  for (let y = Math.round(cy); y >= Math.round(cy - h * 0.3); y--) filas[y][Math.round(cx)] = "k";     // manecilla a las doce
  for (let x = Math.round(cx); x <= Math.round(cx + w * 0.25); x++) filas[Math.round(cy)][x] = "k";    // y otra a las tres
  return filas.map((f) => f.join(""));
}

// Reloj de torre sobre un tallo, como el de la pintura: esfera clara con borde oscuro y manecillas
function figuraRelojRedondo(r) {
  const filas = [];
  for (let y = -r; y <= r; y++) {
    let f = "";
    for (let x = -r; x <= r; x++) {
      const d = Math.hypot(x, y);
      const manecilla = (x === 0 && y < 0 && y >= -(r - 2)) || (y === 0 && x > 0 && x <= r - 3);
      f += d > r ? "." : d > r - 1 || manecilla ? "k" : "f";
    }
    filas.push(f);
  }
  return filas;
}

// Cielo: estrellas pálidas, un reloj de bolsillo que flota y un globo azul colgado de un paracaídas
function texCieloDali() {
  return textura("dl-cielo", () => {
    const L = lienzoPixeles(512, 96);
    for (let k = 0; k < 30; k++) L.poner((k * 157 + 40) % 512, (k * 53 + 7) % 30, "w");
    L.pegar(figuraRelojDali(12, 8, 3), 146, 36);
    // Paracaídas a rayas, con dos cuerdas que bajan hasta el globo
    for (let dy = 0; dy < 4; dy++) for (let x = 226 - (12 - 2 * dy); x <= 226 + (12 - 2 * dy); x++) L.poner(x, 34 + dy, Math.floor(x / 3) % 2 ? "y" : "r");
    for (let k = 0; k < 6; k++) { L.poner(219 + k, 38 + k, "k"); L.poner(233 - k, 38 + k, "k"); }
    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) if (dx * dx + dy * dy <= 16) L.poner(226 + dx, 48 + dy, dx < -1 && dy < 0 ? "v" : "u");
    return L.sprite({ w: "#eaf8ff", g: "#d4a93c", f: "#dfeef3", k: "#2a2a36", y: "#e8c060", r: "#c0502a", u: "#2c6da0", v: "#9ad0ef" }, true);
  });
}

// Acantilados de ocre al otro lado de la bahía: una masa de roca con cumbres irregulares y facetas (la cara
// que sube hacia la derecha recibe la luz; la que baja, la sombra), estratos que ondulan y la base en sombra
function texAcantiladosDali() {
  return textura("dl-acantilados", () => {
    const L = lienzoPixeles(512, 104), base = 96, ancho = 230;
    const cumbres = [];
    for (let i = 0; i <= ancho + 8; i++) {
      const u = Math.min(1, i / ancho);
      const altura = 40 * Math.pow(Math.sin(Math.PI * u), 0.5) + 9 * Math.max(0, Math.sin(u * Math.PI * 3)) * Math.pow(Math.sin(Math.PI * u), 0.3) + 3 * Math.sin(i * 0.11 + 0.7);
      cumbres.push(Math.round(base - altura));
    }
    for (let i = 0; i < ancho; i++) {
      const cumbre = cumbres[i], bajada = cumbres[i + 8] - cumbre;     // la pendiente se mide en 8 px para que las caras no parpadeen
      for (let y = cumbre; y < base; y++) {
        const estrato = (y - cumbre + Math.round(1.5 * Math.sin(i * 0.25 + y * 0.1))) % 7 === 6;
        const ch = y - cumbre < 2 ? "e" : y >= base - 5 ? "n" : estrato ? "j" : bajada < 0 ? "o" : "d";
        L.poner(190 + i, y, ch);
      }
    }
    return L.sprite({ e: "#f0cd7e", o: "#e0b25e", d: "#a8742f", j: "#c9934a", n: "#7a4e25" });
  });
}

// Reflejos de la bahía: trazos finos y claros que se desplazan con el parallax
function texReflejosDali() {
  return textura("dl-reflejos", () => {
    const L = lienzoPixeles(512, 12);
    for (let k = 0; k < 40; k++) {
      const x = (k * 97) % 500, y = (k * 5) % 11, largo = 6 + (k % 4) * 3;
      for (let dx = 0; dx < largo; dx++) if (dx % 5 < 4) L.poner(x + dx, y, k % 3 ? "l" : "m");
    }
    return L.sprite({ l: "#b9e5eb", m: "#7fbfcc" });
  });
}

// Pueblo al otro lado de la bahía: casas de paredes claras y tejados rojos, ventanas encendidas y una iglesia con aguja
function texCiudadDali() {
  return textura("dl-ciudad", () => {
    const L = lienzoPixeles(512, 120), base = 112;
    // Un edificio: x, ancho, alto del muro y alto del tejado a dos aguas (el tejado de la iglesia es oscuro)
    const edificio = (x0, w, muro, techo, tejado = "r") => {
      for (let x = x0; x < x0 + w; x++) {
        for (let y = base - muro; y < base; y++) L.poner(x, y, x - x0 < w / 2 ? "a" : "b");
        for (let y = base - muro - techo; y < base - muro; y++) {
          const k = (y - (base - muro - techo)) / techo;                 // 0 en la cumbre, 1 en el alero
          if (Math.abs(x + 0.5 - (x0 + w / 2)) <= (w / 2 + 1) * k) L.poner(x, y, x - x0 < w / 2 ? tejado : "R");
        }
      }
      for (const vx of [x0 + 2, x0 + w - 4]) for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) L.poner(vx + dx, base - muro + 2 + 2 * dy, "w");
    };
    [[14, 12, 7, 5], [30, 9, 5, 4], [43, 16, 9, 6], [63, 10, 6, 4], [78, 14, 8, 5], [97, 9, 5, 4],
     [150, 13, 7, 5], [167, 18, 10, 6], [189, 10, 6, 4], [203, 14, 8, 5]].forEach((e) => edificio(...e));
    edificio(104, 16, 9, 6);                   // nave de la iglesia
    edificio(122, 8, 24, 14, "s");             // torre con aguja oscura
    return L.sprite({ a: "#f3ecd9", b: "#d9cdb2", r: "#c35b3e", R: "#9e4330", s: "#3b4650", w: "#5c6b7c" });
  });
}

// Árbol gris sin hojas, con un reloj que se derrama sobre su rama; una columna con un reloj de torre;
// y una repisa con otro reloj que cuelga de su borde. Periódica en X (512): cada cosa cabe en su tramo
function texEscenarioDali() {
  return textura("dl-escenario", () => {
    const L = lienzoPixeles(512, 176), luz = ["h", "b", "s"];
    L.trazo(46, 152, 50, 126, 3.5, 3, luz);     // tronco
    L.trazo(50, 126, 53, 100, 3, 2.2, luz);
    L.trazo(53, 100, 52, 80, 2.2, 1.6, luz);
    L.trazo(52, 80, 56, 60, 1.6, 1.2, luz);
    L.trazo(53, 88, 98, 74, 2.2, 1.2, luz);     // rama hacia la derecha, donde se cuelga el reloj
    L.trazo(51, 104, 40, 90, 1.8, 1, luz);      // rama corta hacia la izquierda
    L.trazo(56, 66, 66, 56, 1.1, 0.8, luz);     // ramita seca
    L.pegar(figuraRelojDali(20, 12, 5), 72, 79);
    L.trazo(176, 152, 176, 104, 1.1, 1.1, ["p", "p", "q"]);   // tallo del reloj de torre
    L.pegar(figuraRelojRedondo(7), 169, 90);
    for (let x = 212; x <= 254; x++) for (let y = 139; y < 152; y++) L.poner(x, y, y === 139 ? "T" : "L");   // repisa
    L.pegar(figuraRelojDali(18, 10, 5), 216, 131);
    return L.sprite({ h: "#d6dbe0", b: "#9ca3aa", s: "#5d646c", g: "#d4a93c", f: "#dfeef3", k: "#2a2a36", p: "#e8e1d2", q: "#a9a293", L: "#7d6650", T: "#a58d74" }, true);
  });
}

// Escenario de Dalí: cielo que se dora hacia el horizonte, bahía con pueblo, acantilados de ocre,
// llano oscuro y, delante, un árbol gris con relojes que se derriten
function escenaDali(cam) {
  const cielo = ctx.createLinearGradient(0, 0, 0, OY + 96);
  cielo.addColorStop(0, "#1d4b63");
  cielo.addColorStop(0.3, "#2d6480");
  cielo.addColorStop(0.6, "#5fa3b5");
  cielo.addColorStop(0.82, "#bfe0d6");
  cielo.addColorStop(1, "#f5d58a");
  ctx.fillStyle = cielo;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(0, OY);
  // El cielo se repite hacia arriba en los visores altos
  const sky = texCieloDali();
  for (let k = 0; k <= Math.ceil(OY / 96); k++) capaPeriodica(sky, cam.x + k * 1733, 0.1, -96 * k);   // cada copia cae en otro sitio
  // Luz baja del horizonte, como en la pintura
  const luz = ctx.createRadialGradient(W * 0.55, 96, 4, W * 0.55, 96, 110);
  luz.addColorStop(0, "rgba(255,236,176,0.6)");
  luz.addColorStop(1, "rgba(255,236,176,0)");
  ctx.fillStyle = luz;
  ctx.fillRect(0, 30, W, 90);
  capaPeriodica(texAcantiladosDali(), cam.x, 0.25, 0);
  // Bahía: franja turquesa con reflejos blancos que se mueven despacio
  const mar = ctx.createLinearGradient(0, 96, 0, 112);
  mar.addColorStop(0, "#3e8aa3");
  mar.addColorStop(1, "#22566e");
  ctx.fillStyle = mar;
  ctx.fillRect(0, 96, W, 16);
  capaPeriodica(texReflejosDali(), cam.x, 0.2, 98);
  capaPeriodica(texCiudadDali(), cam.x, 0.35, 0);
  // Llano oscuro del primer plano: sobre él van el árbol y los relojes
  const llano = ctx.createLinearGradient(0, 112, 0, 176);
  llano.addColorStop(0, "#5f4330");
  llano.addColorStop(1, "#2b2019");
  ctx.fillStyle = llano;
  ctx.fillRect(0, 112, W, H);
  capaPeriodica(texEscenarioDali(), cam.x, 0.8, 0);
  ctx.restore();
}

// Formas de Miró (periódicas en X): cruces de trazo negro, discos rojos, azules y amarillos, líneas onduladas y una escalera
function texFormasMiro() {
  return textura("mi-formas", () => {
    const ancho = 512, alto = 176;
    const grid = Array.from({ length: alto }, () => Array(ancho).fill("."));
    const poner = (x, y, ch) => { if (x >= 0 && x < ancho && y >= 0 && y < alto) grid[y][x] = ch; };
    // Azar fijo (seno con fracción): cada forma cae en un sitio distinto, sin patrón a la vista
    const azar = (n) => { const v = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return v - Math.floor(v); };
    for (let k = 0; k < 20; k++) {
      const x = 16 + Math.floor(azar(k * 2) * 480), y = 14 + Math.floor(azar(k * 2 + 1) * 136);
      if (k % 3 === 0) {
        for (let d = -3; d <= 3; d++) { poner(x + d, y, "k"); poner(x, y + d, "k"); }   // cruz de trazo negro
      } else {
        const col = ["r", "a", "y"][k % 3];
        for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) if (dx * dx + dy * dy <= 16) poner(x + dx, y + dy, col);   // disco
      }
    }
    // Líneas onduladas de trazo negro: con un número entero de ondas, el borde del fondo encaja
    for (const [y0, ondas, amp] of [[34, 2, 5], [92, 3, 4], [146, 4, 5]]) {
      for (let x = 0; x < ancho; x++) poner(x, y0 + Math.round(amp * Math.sin((x / ancho) * Math.PI * 2 * ondas)), "k");
    }
    // Escalera de Miró: dos montantes negros con travesaños
    for (let y = 100; y <= 160; y++) { poner(420, y, "k"); poner(432, y, "k"); }
    for (let y = 104; y <= 156; y += 8) for (let x = 421; x <= 431; x++) poner(x, y, "k");
    const sp = spriteFromRows(expandir(grid.map((r) => r.join(""))), { k: "#1a1a1a", r: "#d8322b", a: "#2f58b8", y: "#ffc21a" }, false, true, false);
    sp.tw = ancho;
    return sp;
  });
}

// Escenario de Miró: fondo crema, un sol amarillo y formas de colores primarios sobre trazos negros
function escenaMiro(cam, pal) {
  const cielo = ctx.createLinearGradient(0, 0, 0, OY + 176);
  cielo.addColorStop(0, "#fbf6ea");
  cielo.addColorStop(1, "#f2e2b8");
  ctx.fillStyle = cielo;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(0, OY);
  // Las formas siguen hacia arriba hasta el borde de la pantalla (en los visores altos)
  const formas = texFormasMiro();
  for (let k = 0; k <= Math.ceil(OY / 176); k++) capaPeriodica(formas, cam.x + k * 61, 0.25, -176 * k);
  dibujarSol(pal, W - 60, 24);
  ctx.restore();
}

// Torres de trencadís (periódicas en X): agujas de teselas de colores en damero que se estrechan hacia la punta
function texTorresGaudi() {
  return textura("ga-torres", () => {
    const ancho = 512, base = 176;
    const torres = [[26, 22, 112], [120, 16, 84], [222, 28, 132], [338, 18, 96], [446, 24, 118]];   // [x, ancho, alto]
    const teselas = ["a", "b", "c", "d", "e", "f"];
    const grid = Array.from({ length: base }, () => Array(ancho).fill("."));
    for (const [tx, tw, th] of torres) {
      for (let y = base - th; y < base; y++) {
        const k = (y - (base - th)) / th;                        // 0 en la punta, 1 en la base
        const media = (tw / 2) * Math.min(1, 0.2 + k * 1.1);     // aguja que se ensancha hacia abajo
        for (let x = Math.round(tx + tw / 2 - media); x < Math.round(tx + tw / 2 + media); x++) {
          grid[y][x] = teselas[(Math.floor(x / 3) + Math.floor(y / 3)) % teselas.length];
        }
      }
    }
    const sp = spriteFromRows(expandir(grid.map((r) => r.join(""))), { a: "#2f9fc8", b: "#ffd27a", c: "#ec6a4a", d: "#3fa36b", e: "#ffffff", f: "#5a3a8a" }, false, true, false);
    sp.tw = ancho;
    return sp;
  });
}

// Escenario de Gaudí: cielo azul de Barcelona, torres de trencadís recortadas y un sol de mosaico
function escenaGaudi(cam, pal) {
  const cielo = ctx.createLinearGradient(0, 0, 0, OY + 176);
  cielo.addColorStop(0, "#2f6fb0");
  cielo.addColorStop(1, "#9ad8f0");
  ctx.fillStyle = cielo;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(0, OY);
  dibujarSol(pal, W - 62, 26);
  capaPeriodica(texTorresGaudi(), cam.x, 0.3, 0);
  ctx.restore();
}

// Escenarios de los mundos de arte, por el tema de su estilo (ver TERRENO_DE_TEMA)
const ESCENAS_ESTILO = { vangogh: escenaVanGogh, dali: escenaDali, miro: escenaMiro, gaudi: escenaGaudi, barco: escenaBarco };

// Paleta del escenario de fondo: la de su propio tema y no la de la fase, así un fondo de desierto en una fase
// de pradera se pinta con arena y no con hierba. Los temas sin paleta propia usan la que llega (el mapa, la fase)
function paletaDeFondo(tema, paleta) {
  if (tema === "castillo") return PALETA_CASTILLO;
  if (PALETA_ESTILO[tema]) return PALETA_ESTILO[tema];
  const mundo = MUNDOS.find((m) => m.tema === tema);
  return mundo ? mundo.paleta : paleta;
}

// Fondo del escenario. El cielo, el sol o la luna, las nubes y las montañas vienen de bloques.js
// y cambian con la hora (0 amanecer, 0.25 día, 0.5 atardecer, 0.75 noche); la cueva usa roca.
// lv (opcional): el nivel, de donde salen su clima, su cascada y si hay hojas y luciérnagas.
// El suelo que se prolonga bajo la pantalla es el de la fase (lv.temaKey), no el del fondo elegido
function dibujarFondo(cam, pal, tema, hora, lv) {
  const clima = lv ? lv.clima : null, t = performance.now() / 1000;
  const suelo = lv ? lv.temaKey : tema;
  pal = paletaDeFondo(tema, pal);
  if (tema === "castillo") {
    escenaCastillo(cam, pal);
    if (clima) Bloques.clima(ctx, W, H, t, clima);   // niebla del foso: entre el castillo y las piezas
    pintarExtension(pal, suelo);
    return;
  }
  // Mundos de arte (Van Gogh, Dalí, Miró y Gaudí): cada uno pinta su cielo y su paisaje
  if (ESCENAS_ESTILO[tema]) {
    ESCENAS_ESTILO[tema](cam, pal, hora);
    if (clima) Bloques.clima(ctx, W, H, t, clima);   // lluvia o tormenta encima de la escena, bajo el suelo
    pintarExtension(pal, suelo);
    return;
  }
  if (tema === "agua") { fondoMarino(cam); pintarExtension(pal, suelo); return; }
  if (ESCENAS_NUEVAS[tema]) {
    ESCENAS_NUEVAS[tema](cam, pal, t);
    if (tema === "bosque" && !clima) {   // hojas que caen y luciérnagas, como en el resto de bosques
      ctx.save();
      ctx.translate(0, OY);
      ctx.scale(ESC_FONDO, ESC_FONDO);
      Bloques.particulas(ctx, W / ESC_FONDO, (H - OY) / ESC_FONDO, t, cam.x, hora);
      ctx.restore();
    }
    if (clima && tema !== "nieve") Bloques.clima(ctx, W, H, t, clima);
    if (H > OY + H_MIN) pintarExtension(pal, suelo);
    return;
  }
  // El cielo llega hasta arriba de la pantalla, también en las pantallas altas (OY > 0)
  ctx.save();
  ctx.translate(0, OY);
  ctx.scale(ESC_FONDO, ESC_FONDO);
  Bloques.fondo(ctx, cam.x, 0, W / ESC_FONDO, (H - OY) / ESC_FONDO, t,
    { hora: hora, ambiente: tema === "cueva" ? "cueva" : "cielo", clima: clima, cascada: !!(lv && lv.cascada),
      colinas: tema !== "desierto", arriba: OY / ESC_FONDO });
  // Hojas que caen y luciérnagas: solo en el bosque y sin clima (como en la demo de bloques.js)
  if (lv && lv.particulas && !clima) Bloques.particulas(ctx, W / ESC_FONDO, (H - OY) / ESC_FONDO, t, cam.x, hora);
  ctx.restore();
  if (H > OY + H_MIN) pintarExtension(pal, suelo);
}

/* =====================================================================
   13b. TILES CON BISELADO (cacheados por tema y por "tiene hierba")
   ===================================================================== */
// Castillo del mapa: dos hileras de almenas, cuerpo liso y puerta oscura
function castilloRows() {
  const rows = [];
  for (let y = 0; y < 16; y++) {
    let f = "";
    for (let x = 0; x < 16; x++) {
      const dentro = x > 0 && x < 15;
      if (y < 3 && (!dentro || x % 4 >= 2)) f += ".";           // huecos entre almenas
      else if (!dentro) f += ".";
      else if (y >= 10 && x >= 6 && x <= 9) f += "d";            // puerta
      else f += "c";
    }
    rows.push(f);
  }
  return rows;
}

/* =====================================================================
   13c. ESCENARIO DE CASTILLO: atardecer, torres lejanas, muro de piedra y antorchas
   ===================================================================== */
// Torres recortadas contra el cielo (periódicas, apoyadas en el suelo de diseño)
function texTorres() {
  return textura("torres", () => {
    const ancho = 512, base = 176;
    const torres = [[30, 46, 120], [150, 34, 96], [262, 52, 136], [390, 40, 104]]; // [x, ancho, alto]
    const rows = [];
    for (let y = 0; y < H_MIN; y++) {
      let f = "";
      for (let x = 0; x < ancho; x++) {
        let ch = ".";
        for (const [tx, tw, th] of torres) {
          if (x < tx || x >= tx + tw || y < base - th || y >= base) continue;
          const merlon = y < base - th + 8 && (x - tx) % 8 >= 5;   // almenas en lo alto
          if (merlon) continue;
          const ventana = x >= tx + tw / 2 - 2 && x <= tx + tw / 2 + 1 && y >= base - th + 16 && y <= base - th + 26;
          ch = ventana ? "w" : "c";
        }
        f += ch;
      }
      rows.push(f);
    }
    const sp = spriteFromRows(expandir(rows), { c: "#3a2b52", w: "#ffd23f" }, false, true, false);
    sp.tw = ancho;
    return sp;
  });
}

// Muro de piedra con hiladas de ladrillos desfasadas (periódico)
function texMuro() {
  return textura("muro", () => {
    const ancho = 512, alto = 80;   // solo el muro de la base: de y=96 al suelo
    const rows = [];
    for (let y = 0; y < alto; y++) {
      const hilada = Math.floor(y / 8), yy = y % 8, desfase = (hilada % 2) * 8;
      let f = "";
      for (let x = 0; x < ancho; x++) {
        const bx = (x + desfase) % 16;
        f += yy === 0 || bx === 0 ? "d" : yy === 1 || bx === 1 ? "l" : "m";   // juntas, bisel de luz, piedra
      }
      rows.push(f);
    }
    const sp = spriteFromRows(expandir(rows), { m: "#4b4a5c", l: "#62617a", d: "#2c2b3b" }, false, true, false);
    sp.tw = ancho;
    return sp;
  });
}

// Antorcha con llama de tres frames (parpadeo)
const FILAS_ANTORCHA = [
  ["..r..", ".oyo.", "oyyyo", "oyyyo", ".oyo.", "..o..", "..k..", ".kkk."],
  [".r...", ".ory.", ".oyo.", "oyyyo", ".yyy.", ".oyo.", "..k..", ".kkk."],
  ["...r.", "..ryo", ".oyo.", "oyyyo", "oyyy.", "..o..", "..k..", ".kkk."],
];
function antorchaSprite(f) {
  return textura("antorcha" + f, () => spriteFromRows(expandir(FILAS_ANTORCHA[f]), { k: "#2a2a30", o: "#ff8a1e", y: "#ffe066", r: "#e0392b" }, true, false, false));
}

function escenaCastillo(cam, pal) {
  // Atardecer: de índigo arriba a malva y naranja cerca del horizonte
  const horizonte = OY + 176;
  const cielo = ctx.createLinearGradient(0, 0, 0, horizonte);
  cielo.addColorStop(0, "#2a1f4f");
  cielo.addColorStop(0.5, "#7a4a86");
  cielo.addColorStop(1, "#ff9a5a");
  ctx.fillStyle = cielo;
  ctx.fillRect(0, 0, W, H);
  dibujarSol(pal, W - 70, 56 + OY * 0.2);
  ctx.save();
  ctx.translate(0, OY);
  capaPeriodica(texTorres(), cam.x, 0.2, 0);
  capaPeriodica(texMuro(), cam.x, 0.5, 96);
  // Sombra del muro: más oscura bajo las almenas y junto al suelo
  const sombra = ctx.createLinearGradient(0, 96, 0, 176);
  sombra.addColorStop(0, "rgba(20,10,30,0.35)");
  sombra.addColorStop(0.35, "rgba(20,10,30,0.05)");
  sombra.addColorStop(1, "rgba(20,10,30,0.4)");
  ctx.fillStyle = sombra;
  ctx.fillRect(0, 96, W, 80);
  // Estandartes morados con emblema dorado, colgados del muro entre las antorchas
  const off = mod(cam.x * 0.5, 96);
  for (let k = -1; k < 6; k++) {
    const bx = k * 96 + 92 - off;
    ctx.fillStyle = "#3d1a57";
    ctx.fillRect(bx - 9, 106, 18, 42);
    ctx.fillStyle = "#6a2c91";
    ctx.fillRect(bx - 8, 107, 16, 40);
    ctx.beginPath(); ctx.moveTo(bx - 8, 147); ctx.lineTo(bx, 141); ctx.lineTo(bx + 8, 147); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#f2c14e";
    ctx.beginPath(); ctx.moveTo(bx, 116); ctx.lineTo(bx + 3, 122); ctx.lineTo(bx, 128); ctx.lineTo(bx - 3, 122); ctx.closePath(); ctx.fill();
  }
  // Antorchas sobre el muro, con parpadeo y un halo de luz cálida alrededor
  const fr = Math.floor(performance.now() / 110) % 3;
  for (let k = -1; k < 6; k++) {
    const tx = k * 96 + 44 - off;
    const brillo = 0.45 + 0.1 * Math.sin(performance.now() / 150 + k);
    const halo = ctx.createRadialGradient(tx + 4, 88, 2, tx + 4, 88, 42);
    halo.addColorStop(0, "rgba(255,170,80," + brillo.toFixed(3) + ")");
    halo.addColorStop(1, "rgba(255,170,80,0)");
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(tx + 4, 88, 42, 0, Math.PI * 2); ctx.fill();
    drawSprite(antorchaSprite(fr), tx, 84);
  }
  ctx.restore();
}

/* =====================================================================
   11. SONIDO SENCILLO (ondas cuadradas con Web Audio, sin archivos)
   ===================================================================== */
const SFX = {
  salto: [440, 660, 0.08], giro: [520, 300, 0.12], pisar: [320, 640, 0.07],
  patear: [200, 120, 0.1], moneda: [880, 1320, 0.06], hongo: [400, 800, 0.2],
  rompe: [150, 60, 0.12], golpe: [200, 80, 0.25], vida: [500, 1000, 0.3],
  meta: [600, 900, 0.5], muerte: [400, 60, 0.7], estrella: [700, 1400, 0.4],
  control: [660, 990, 0.25], grande: [990, 1980, 0.35],
};
let audioCtx = null;
function tocar(nombre) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const [f0, f1, dur] = SFX[nombre] || SFX.salto;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(f0, audioCtx.currentTime);
    o.frequency.linearRampToValueAtTime(f1, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(0.04, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* sin audio: el juego sigue */ }
}
// Desbloquea el audio con la primera tecla (requisito de los navegadores)
addEventListener("keydown", () => { if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); }, { once: false });

function frecuencia(nombre) {   // "F#5" -> Hz (A4 = 440)
  const m = /^([A-G])(#?)(\d)$/.exec(nombre);
  const midi = (+m[3] + 1) * 12 + NOTAS_BASE[m[1]] + (m[2] ? 1 : 0);
  return 440 * Math.pow(2, (midi - 69) / 12);
}
// Pasos (corchea a corchea) de la melodía y del bajo de cada tema, para consultarlos al programar
(function prepararMusica() {
  for (const tema of Object.values(TEMAS)) {
    tema.pasosMelodia = new Map();   // paso -> { f, d }
    tema.pasosBajo = new Map();      // paso -> frecuencia
    let p = 0;
    for (const tok of tema.melodia) {
      const [n, d] = tok.split(":");
      if (n !== "-") tema.pasosMelodia.set(p, { f: frecuencia(n), d: +d });
      p += +d;
    }
    tema.pasos = tema.bajo.length * 8;
    tema.bajo.forEach((raiz, c) => {
      const base = frecuencia(raiz);
      tema.ritmo.forEach((mult, k) => { if (mult) tema.pasosBajo.set(c * 8 + k, base * mult); });
    });
  }
})();

let musicaGain = null;       // la música usa el mismo audioCtx que los efectos
let bufRuido = null;
let musicaNotas = 0;         // notas programadas (para comprobar que suena)
let gestoAudio = false;      // el navegador exige un gesto del usuario antes de sonar
function marcarGesto() {
  gestoAudio = true;
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
}
addEventListener("pointerdown", marcarGesto);
addEventListener("keydown", marcarGesto);

function asegurarAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    if (!musicaGain) {
      musicaGain = audioCtx.createGain();
      musicaGain.gain.value = 0.5;
      musicaGain.connect(audioCtx.destination);
    }
    return true;
  } catch (e) { return false; }
}
function ruidoBuffer() {
  if (!bufRuido) {
    bufRuido = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.06), audioCtx.sampleRate);
    const d = bufRuido.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return bufRuido;
}
function nota(freq, t, dur, tipo, vol) {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = tipo;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.setValueAtTime(vol, t + dur * 0.75);
  g.gain.linearRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(musicaGain);
  o.start(t); o.stop(t + dur + 0.02);
  musicaNotas++;
}
function bombo(t) {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  g.gain.setValueAtTime(0.9, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  o.connect(g); g.connect(musicaGain);
  o.start(t); o.stop(t + 0.16);
  musicaNotas++;
}
function charles(t) {
  const src = audioCtx.createBufferSource();
  src.buffer = ruidoBuffer();
  const filtro = audioCtx.createBiquadFilter();
  filtro.type = "highpass";
  filtro.frequency.value = 7000;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  src.connect(filtro); filtro.connect(g); g.connect(musicaGain);
  src.start(t); src.stop(t + 0.05);
  musicaNotas++;
}
function programarPaso(tema, p, t, dur) {
  const m = tema.pasosMelodia.get(p);
  if (m) {
    nota(m.f, t, m.d * dur * (tema.stac || 0.92), tema.onda, tema.vol);
    if (tema.eco) nota(m.f, t + 3 * dur, m.d * dur * 0.8, tema.onda, tema.vol * 0.35);
  }
  const b = tema.pasosBajo.get(p);
  if (b) nota(b, t, dur * 0.9, "triangle", 0.2);
  const k = p % 8;
  switch (tema.bateria) {
    case "normal": if (k === 0 || k === 4) bombo(t); if (k % 2 === 1) charles(t); break;
    case "suave": if (k === 0) bombo(t); if (k === 4) charles(t); break;
    case "marcha": if (k % 2 === 0) bombo(t); if (k % 2 === 1) charles(t); break;
    case "rapida": if (k % 2 === 0) bombo(t); charles(t); break;
  }
}

const musica = { activa: false, tema: "pradera", paso: 0, siguiente: 0, timer: null };
function planificar() {
  const tema = TEMAS[musica.tema];
  const dur = 60 / tema.bpm / 2;
  // Si la pestaña estuvo oculta, el reloj de audio ya pasó: no se programa en el pasado
  if (musica.siguiente < audioCtx.currentTime) musica.siguiente = audioCtx.currentTime + 0.05;
  while (musica.siguiente < audioCtx.currentTime + MUSICA_ADELANTO) {
    programarPaso(tema, musica.paso, musica.siguiente, dur);
    musica.siguiente += dur;
    musica.paso = (musica.paso + 1) % tema.pasos;
  }
}
function musicaArrancar() {
  if (musica.activa || !ajustes.musica || !gestoAudio) return;
  if (!asegurarAudio()) return;
  musica.activa = true;
  musica.paso = 0;
  musica.siguiente = audioCtx.currentTime + 0.05;
  planificar();
  musica.timer = setInterval(planificar, 25);
}
function musicaParar() {
  if (!musica.activa) return;
  musica.activa = false;
  clearInterval(musica.timer);
}
// Tema que toca: el del mundo en el mapa y en sus fases; el de las salas secretas (también en las casas de
// minijuegos), el del castillo en las fases con jefe (y el del jefe al llegar a su arena) y el de la estrella
function temaDeseado() {
  const e = game.estado;
  if (e === "minijuego") return "sala";
  if (e === "overworld" && game.ov) return game.ov.m.tema;
  const lvl = game.lvl;
  if (!lvl || !["nivel", "tuberia", "muerte", "nivelOK"].includes(e)) return "pradera";
  if (lvl.esSala) return "sala";
  if (lvl.player.star > 0) return "estrella";
  if (lvl.boss) return lvl.bossRef && lvl.bossRef.alive && lvl.player.x > lvl.arenaX0 - W / 2 ? "jefe" : "castillo";
  return TEMAS[lvl.temaKey] ? lvl.temaKey : "pradera";
}

// Suena en el título, el mapa y el nivel; se calla en pausa, al final y si se apaga en ajustes.
// Al cambiar de tema, el nuevo empieza por el principio
function musicaSegunEstado() {
  const callada = !ajustes.musica || game.estado === "pausa" || game.estado === "final";
  if (callada) { musicaParar(); return; }
  const tema = temaDeseado();
  if (tema !== musica.tema) { musica.tema = tema; musica.paso = 0; }
  musicaArrancar();
}

   12. CÁMARA CON SUAVIZADO Y LÍMITES
   ===================================================================== */
// Torres (niveles más altos que la pantalla): zona muerta vertical en px y velocidad de seguimiento (1/s)
const CAM_ZONA_Y = 20;
const CAM_VEL_Y = 10;   // al subir a 500 px/s (un muelle) el jugador queda a unos 70 px del centro: sigue visible bajo el marcador
class Camera {
  constructor() { this.x = 0; this.y = 0; }
  // Límites de x: si el nivel es más estrecho que la pantalla, la cámara lo centra
  rangoX(lvl) {
    const ancho = lvl.cols * TILE;
    return ancho > W ? [0, ancho - W] : [(ancho - W) / 2, (ancho - W) / 2];
  }
  seguir(objetivo, lvl, dt) {
    const destino = objetivo.x + objetivo.w / 2 - W / 2;
    // Suavizado exponencial: se acerca rápido pero sin tirones
    this.x += (destino - this.x) * Math.min(1, dt * 7);
    const [min, max] = this.rangoX(lvl);
    this.x = clamp(this.x, min, max);
    this.seguirY(objetivo, lvl, dt);
  }
  // Vertical: la cámara solo se mueve cuando el jugador sale de la franja central del área de juego
  seguirY(objetivo, lvl, dt) {
    // Al mirar arriba o abajo, la cámara se asoma despacio hacia ese lado
    this.desplaza = (this.desplaza || 0) + ((objetivo.desplazamientoCamara || 0) - (this.desplaza || 0)) * Math.min(1, dt * 3);
    const fuera = objetivo.y + objetivo.h / 2 + this.desplaza - this.y - H_MIN / 2;
    if (Math.abs(fuera) > CAM_ZONA_Y) this.y += (fuera - Math.sign(fuera) * CAM_ZONA_Y) * Math.min(1, dt * CAM_VEL_Y);
    this.y = clamp(this.y, 0, Math.max(0, lvl.rows * TILE - H_MIN));
  }
  // Fijar cámara de golpe (al empezar el nivel)
  centrar(objetivo, lvl) {
    this.desplaza = 0;
    const [min, max] = this.rangoX(lvl);
    this.x = clamp(objetivo.x + objetivo.w / 2 - W / 2, min, max);
    this.y = clamp(objetivo.y + objetivo.h / 2 - H_MIN / 2, 0, Math.max(0, lvl.rows * TILE - H_MIN));
  }
}

// Crea el enemigo de enemigos.js sobre la entidad (e.x, e.y = esquina superior izquierda)
function crearEnemigo(e) {
  const tipo = TIPO_ENEMIGO[e.t] || "erizo";
  // La planta sale de la tubería: su maceta queda dentro del tubo (centro de los dos bloques)
  // El girasol sale del tubo igual que la planta
  if (tipo === "planta" || tipo === "planta_zombie" || tipo === "girasol") return Enemigos.create(tipo, e.x + TILE - 1, e.y + 8);
  return Enemigos.create(tipo, e.x + TILE / 2, e.y + TILE / 2);

// Bola de fuego de la flor de fuego: tamaño, velocidad, rebote en el suelo, duración y máximo en pantalla
const BOLA = { w: 6, h: 6, vx: 190, rebote: -150, vida: 2.2, max: 2 };

// Contorno de una estrella de cinco puntas (radio exterior r1, interior r2)
function rutaEstrella(cx, cy, r1, r2) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? r2 : r1, a = -Math.PI / 2 + (i * Math.PI) / 5;
    ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
  }
  ctx.closePath();
}

/* Moneda estrella: moneda grande con una estrella, que gira. (x, y): esquina del tile.
   fantasma: ya estaba guardada de otra partida (se ve azulada y translúcida) */
function dibujarGrande(x, y, t, fantasma) {
  const ancho = Math.max(0.2, Math.abs(Math.cos(t * 2.4)));
  ctx.save();
  ctx.globalAlpha = fantasma ? 0.5 : 1;
  ctx.translate(x + 8, y + 8);
  ctx.scale(ancho, 1);
  ctx.fillStyle = fantasma ? "#3a5a8a" : "#7a4a00";
  ctx.beginPath(); ctx.arc(0, 0, 7.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = fantasma ? "#7ab0e8" : "#f2a000";
  ctx.beginPath(); ctx.arc(0, 0, 6.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = fantasma ? "#cfe6ff" : "#ffd23f";
  ctx.beginPath(); ctx.arc(-0.5, -0.5, 5.4, 0, Math.PI * 2); ctx.fill();
  if (ancho > 0.45) {
    ctx.fillStyle = fantasma ? "#ffffff" : "#fff6c8";
    rutaEstrella(0, 0.3, 4, 1.7); ctx.fill();
    ctx.strokeStyle = fantasma ? "#3a5a8a" : "#c07000"; ctx.lineWidth = 0.6; ctx.stroke();
  }
  ctx.restore();
}

// Icono pequeño de moneda estrella para el marcador y el mapa: "si" (cogida), "antes" (guardada) o "no"
function iconoGrande(x, y, estado) {
  ctx.fillStyle = estado === "no" ? PAL.dgr : "#7a4a00";
  ctx.beginPath(); ctx.arc(x + 4, y + 4, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = estado === "si" ? PAL.y : estado === "antes" ? "#b88a30" : "#24273a";
  ctx.beginPath(); ctx.arc(x + 4, y + 4, 3, 0, Math.PI * 2); ctx.fill();
  if (estado !== "no") { ctx.fillStyle = estado === "si" ? PAL.w : "#e0c890"; rutaEstrella(x + 4, y + 4.2, 2.2, 0.9); ctx.fill(); }
}

// Banderín del punto de control: gris y abajo hasta que se pasa; morado (el color de BRO) y arriba después
function dibujarControl(x, pie, activo, t) {
  rect(x + 5, pie - 2, 6, 2, PAL.dgr);
  rect(x + 7, pie - 30, 2, 28, PAL.w);
  rect(x + 8, pie - 30, 1, 28, PAL.gr);
  rect(x + 6, pie - 33, 4, 3, PAL.y);
  const y = activo ? pie - 29 : pie - 12, ola = Math.sin(t * 6) * 0.8;
  ctx.fillStyle = activo ? "#8e44d6" : PAL.gr;
  ctx.beginPath(); ctx.moveTo(x + 9, y); ctx.lineTo(x + 19, y + 3.5 + ola); ctx.lineTo(x + 9, y + 7); ctx.closePath(); ctx.fill();
  if (activo) { ctx.fillStyle = PAL.y; rutaEstrella(x + 12.5, y + 3.5 + ola / 2, 1.8, 0.8); ctx.fill(); }
}

// Salas secretas: el suelo y un tinte de color según el mundo desde el que se entra
const TERRENO_SALA = { pradera: "R", desierto: "A", bosque: "R", cueva: "R", hielo: "I", agua: "W", castillo: "R", cielo: "N" };
const TINTE_SALA = {
  pradera: "rgba(60,180,90,0.2)", desierto: "rgba(230,160,60,0.25)", bosque: "rgba(30,120,50,0.3)", cueva: null,
  hielo: "rgba(120,200,255,0.28)", agua: "rgba(40,120,220,0.3)", castillo: "rgba(180,40,40,0.25)", cielo: "rgba(255,230,150,0.3)",
};
// Temas con vegetación: sus muros y mesetas llevan enredaderas
const TEMAS_VERDES = ["pradera", "bosque"];

/* Fondo del mar (fases submarinas del mundo del agua): azul que oscurece hacia abajo, dos capas de arrecife
   con paralaje y algas que se mecen en la capa cercana */
function fondoMarino(cam) {
  const t = performance.now() / 1000;
  const cielo = ctx.createLinearGradient(0, 0, 0, H);
  cielo.addColorStop(0, "#2f8fd4");
  cielo.addColorStop(1, "#071f48");
  ctx.fillStyle = cielo;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(0, OY);
  for (const [f, base, amp, color] of [[0.2, 150, 26, "#11497e"], [0.45, 182, 34, "#0b335e"]]) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W + 4; x += 4) {
      const wx = x + cam.x * f;
      ctx.lineTo(x, base - amp * (0.55 + 0.45 * Math.sin(wx * 0.021)) * Math.abs(Math.sin(wx * 0.009 + 1)));
    }
    ctx.lineTo(W, H);
    ctx.fill();
  }
  ctx.strokeStyle = "#145c4a";
  ctx.lineWidth = 2;
  for (let k = 0; k < 9; k++) {
    const x = ((k * 61 - cam.x * 0.45) % (W + 40) + W + 40) % (W + 40) - 20;
    ctx.beginPath();
    ctx.moveTo(x, 200);
    for (let y = 200; y > 150 - (k % 3) * 12; y -= 6) ctx.lineTo(x + Math.sin(t * 1.4 + y * 0.08 + k) * 3, y);
    ctx.stroke();
  }
  // Rayos de luz que bajan desde la superficie y burbujas que suben
  ctx.globalCompositeOperation = "lighter";
  for (let k = 0; k < 4; k++) {
    const x = mod(k * 110 + t * 6 - cam.x * 0.05, W + 60) - 30;
    ctx.fillStyle = "rgba(180,235,255,0.07)";
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x + 26, 0); ctx.lineTo(x + 70, H); ctx.lineTo(x + 40, H);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
  for (let k = 0; k < 14; k++) {
    const x = ruido(k * 5) * W, y = H - mod(t * (18 + ruido(k) * 16) + k * 53, H);
    rect(x, y, 2, 2, "rgba(220,245,255,0.6)");
  }
  ctx.restore();
}

class Level {
  // origen: en una sala secreta, el mundo desde el que se ha entrado (da el suelo y el tinte de la sala)
  constructor(def, mundo, origen, clave) {
    const data = datosBase(def, mundo.tema, clave);
    // clave: "mundo:fase" o "sala:k". Con ?dev, las ediciones de la fase cambian sus datos antes de montarla
    this.clave = clave || null;
    this.ed = devActivo && clave ? devEdicion(clave) : null;
    if (this.ed) aplicarEdiciones(data, this.ed);
    this.colores = this.ed ? this.ed.colores : {};   // color de cada casilla "c,r" (modo desarrollador)
    this.def = def;
    this.nombre = data.nombre;
    this.cols = data.cols;
    this.rows = data.rows;
    this.gy = data.gy !== undefined ? data.gy : GY;                              // fila del suelo (la de salida)
    this.sueloMeta = data.sueloMeta !== undefined ? data.sueloMeta : GY * TILE;  // y del suelo al pie del poste de meta
    this.vertical = this.rows > ROWS;   // torre: más alta que la pantalla; la cámara sigue al jugador también en vertical
    this.tiles = data.tiles;
    this.decor = data.decor;
    this.goalX = data.goalX;
    this.boss = data.boss;
    this.tiempo = data.tiempo;
    this.entradaSecreta = data.entradaSecreta || null;   // boca de la zona secreta: { col, row, sala }
    this.salidaSecreta = data.salidaSecreta || null;     // tubería por la que se vuelve de la zona secreta: { col, row }
    this.esSala = !!def.sala;                              // las salas secretas no tienen meta: se sale por su tubería
    this.tuberias = encontrarTuberias(this.tiles);
    this.hm = data.hm || null;   // colinas: altura del suelo por columna (px); Infinity en los huecos
    // Los niveles marcados como castillo usan piedra y atardecer en vez del tema del mundo
    this.castillo = !!def.castillo;
    // Un estilo de mundo (los niveles de Dalí, Miró y Gaudí) pone su propio tema; si no, el del mundo
    this.temaKey = this.castillo ? "castillo" : (def.estilo || mundo.tema);   // separa la caché de sprites por tema
    this.fondo = (this.ed && this.ed.fondo) || def.fondo || this.temaKey;   // escenario de fondo: el propio de la fase (el velero) o el del tema
    this.pal = this.castillo ? PALETA_CASTILLO : (PALETA_ESTILO[this.temaKey] || mundo.paleta);
    this.hora = def.hora !== undefined ? def.hora : mundo.hora;   // momento del día del fondo
    this.clima = def.clima || null;          // lluvia, nieve, niebla... (bloques.js)
    this.cascada = !!def.cascada;            // cascada en el fondo (el río del bosque)
    this.particulas = !!mundo.particulas;    // hojas y luciérnagas (el bosque)
    this.avisoT = 0;   // tiempo que se muestra el aviso "derrota al jefe"
    this.player = new Player(data.start.x, data.start.y);
    this.inicio = { x: data.start.x, y: data.start.y };   // donde reaparece el jugador en el modo inmortal, sin punto de control
    this.enemigos = [];   // { e: objeto de enemigos.js, llevado: true si el jugador lo lleva }
    this.plats = (data.plats || []).map((d) => new Plataforma(d));   // plataformas móviles y que caen
    // Lo que usan los enemigos. abismo: por debajo de esta y se borran; buceoMax: fondo al que pican las abejas
    this.mundo = { tile: TILE, jugador: null, solid: (x, y) => this.solidoEn(x, y),
                   abismo: this.rows * TILE + 60, buceoMax: this.vertical ? Infinity : GY * TILE - 6 };
    this.terreno = TERRENO_DE_TEMA[this.temaKey] || "#";   // carácter de bloques.js para el suelo
    this.tinte = null;                                      // color que tiñe el fondo (salas secretas)
    if (def.sala && origen) {
      this.terreno = TERRENO_SALA[origen.tema] || this.terreno;
      this.tinte = TINTE_SALA[origen.tema] || null;
    }
    this.golpes = new Map();   // "col,fila" -> tiempo que le queda al saltito de un bloque golpeado
    this.resbala = this.terreno === "I";   // el suelo de hielo resbala (mundo del hielo y sus salas)
    this.agua = !!data.agua;               // fase submarina: se nada
    this.coins = [];
    this.items = [];
    this.qItems = new Map();   // "col,fila" -> objeto del bloque ? (o del bloque oculto)
    this.multi = new Map();    // "col,fila" -> monedas que quedan en un ladrillo multimoneda
    this.textos = [];          // textos que suben y se desvanecen ("1UP"): { x, y, t, s }
    this.grandes = [];         // monedas estrella: { x, y, w, h, idx, fantasma, cogida }
    this.control = data.control || null;   // punto de control: { x, pie } (columna del banderín y altura del suelo)
    this.controlActivo = false;
    this.bonusBandera = null;  // premio según la altura a la que se toca el poste: puntos o "1UP"
    // Surtidores de peces y bolas de lava: cada uno lanza un saltarín cada poco cuando el jugador está cerca
    this.fuentes = (data.fuentes || []).map((f) => Object.assign({ t: 1 + Math.random() * 2, vivos: [] }, f));
    this.avance = def.avance || 0;   // px/s de avance automático de la cámara (0: la cámara sigue al jugador)
    this.avanceT = 0;
    this.metaInicio = 0;       // momento en que se tocó el poste: la bandera baja desde entonces
    this.bossRef = null;
    this.bolas = [];           // bolas de fuego del jugador (flor de fuego)
    // Cañones de pared: disparan a su altura; la bala para en el primer bloque sólido
    this.canones = (data.canones || []).map((c) => ({ col: c.col, row: c.row, dir: c.dir || 1, cada: c.cada || 2.4,
                                                       velocidad: c.velocidad || 90, t: c.inicio !== undefined ? c.inicio : 1.2,
                                                       clave: claveEnt({ t: "canon", x: c.col * TILE, y: c.row * TILE }) }));
    this.balas = [];
    this.jefeTipo = mundo.jefeTipo || "koopa";   // jefe de este mundo (jefes.js)
    this.arenaX0 = data.arenaX0 || 0;            // el jefe no sale por la izquierda de su arena
    this.introJefeT = data.boss ? 3 : 0;         // tiempo que se muestra el nombre del jefe
    for (const e of data.ents) this.spawn(e);
    this.cam = new Camera();
    this.cam.centrar(this.player, this);
    this.meta = false;         // true cuando el jugador toca el poste
    this.metaT = 0;
    this.tiempoRest = this.tiempo;
  }

  spawn(e) {
    const k = claveEnt(e);   // identifica la entidad en las ediciones del modo desarrollador
    if (e.t === "coin") this.coins.push(Object.assign(new Coin(e.x, e.y), { clave: k }));
    else if (e.t === "qitem" && e.item === "multi") this.multi.set(Math.floor(e.x / TILE) + "," + Math.floor(e.y / TILE), MONEDAS_MULTI);
    else if (e.t === "qitem") this.qItems.set(Math.floor(e.x / TILE) + "," + Math.floor(e.y / TILE), e.item);
    else if (e.t === "boss") this.bossRef = new Boss(e.x, e.y, this.jefeTipo);
    else if (e.t === "grande") this.grandes.push({ x: e.x + 2, y: e.y + 1, w: 12, h: 14, idx: e.idx, fantasma: false, cogida: false, clave: k });
    else this.enemigos.push({ e: crearEnemigo(e), llevado: false, clave: k });
  }

  // Suelo para los enemigos: a los lados hay pared; por debajo, vacío (y caen)
  solidoEn(x, y) {
    const c = Math.floor(x / TILE), r = Math.floor(y / TILE);
    if (c < 0 || c >= this.cols) return true;
    if (this.hm && y >= superficieEn(this, x)) return true;   // colinas: bajo la superficie hay tierra
    if (r < 0 || r >= this.rows) return false;
    return !!SOLIDOS[this.tiles[r][c]];
  }

  // Golpe desde abajo a un tile (el jugador salta contra él)
  golpearBloque(c, r, player, game) {
    const t = tileAt(this, c, r);
    const k = c + "," + r;
    if (t === "Q" || t === "Z" || t === "B") {
      this.golpes.set(k, 0.16);
      this.derribarEncima(c, r, game);
    }
    if (t === "Q" || t === "Z") {
      this.tiles[r][c] = "U";
      const item = this.qItems.get(k) || "moneda";
      this.qItems.delete(k);
      if (item === "moneda") {
        this.coins.push(new Coin(c * TILE + 4, r * TILE - 8, true));
        game.puntos(200);
        game.sumarMonedas(1, c * TILE, r * TILE);
      } else {
        this.items.push(new PowerUp(item, c * TILE + 2, r * TILE));
        game.sfx("hongo");
      }
      emitir(c * TILE + 8, r * TILE, 4, [PAL.y], { up: 60, life: 0.4 });
    } else if (t === "B" && this.multi.has(k)) {
      // Ladrillo multimoneda: da una moneda por golpe y, vacío, queda como bloque usado
      const quedan = this.multi.get(k) - 1;
      this.coins.push(new Coin(c * TILE + 4, r * TILE - 8, true));
      game.puntos(200);
      game.sumarMonedas(1, c * TILE, r * TILE);
      emitir(c * TILE + 8, r * TILE, 3, [PAL.y], { up: 60, life: 0.3 });
      if (quedan > 0) this.multi.set(k, quedan);
      else { this.multi.delete(k); this.tiles[r][c] = "U"; }
    } else if (t === "B") {
      if (player.big) {
        this.tiles[r][c] = ".";
        emitir(c * TILE + 8, r * TILE + 8, 10, [this.pal.O, PAL.w], { up: 120, spread: 110, life: 0.6, size: 2 });
        game.sfx("rompe");
      } else {
        emitir(c * TILE + 8, r * TILE, 3, [this.pal.O], { up: 40, life: 0.3 });
        game.sfx("golpe");
      }
    }
  }

  // El golpe desde abajo derriba a los enemigos que están de pie sobre el bloque
  derribarEncima(c, r, game) {
    const zona = { x: c * TILE, y: (r - 1) * TILE, w: TILE, h: TILE + 2 };
    for (const w of this.enemigos) {
      const e = w.e, b = Enemigos.box(e);
      if (w.llevado || e.dead || e.remove || !b || !aabb(zona, b)) continue;
      e.dead = true; e.deadT = 0; e.vx = 0; e.vy = -200;
      game.puntos(200);
      game.efectoEnemigo(b.x + b.w / 2, b.y + b.h / 2);
    }
  }

  // Bloque oculto ("Z"): no se ve ni se toca, salvo con la cabeza al subir desde debajo de él.
  // Devuelve true si el jugador lo ha golpeado (y deja la cabeza justo debajo)
  golpearOculto(p, yAntes, game) {
    const r = Math.floor(p.y / TILE);
    if (yAntes < (r + 1) * TILE - 0.01) return false;   // ya estaba a su altura: lo atraviesa
    for (const c of [Math.floor((p.x + 2) / TILE), Math.floor((p.x + p.w - 2) / TILE)]) {
      if (tileAt(this, c, r) !== "Z") continue;
      p.y = (r + 1) * TILE;
      p.vy = 0;
      this.golpearBloque(c, r, p, game);
      game.sfx("golpe");
      return true;
    }
    return false;
  }

  // Surtidores: con el jugador cerca, cada uno lanza un pez (desde debajo del hueco, hacia el jugador)
  // o una bola de lava (desde la lava, en vertical); como mucho dos vivos por surtidor
  actualizarFuentes(dt, p) {
    const cx = p.x + p.w / 2;
    for (const f of this.fuentes) {
      f.vivos = f.vivos.filter((e) => !e.remove);
      if (cx < f.x0 - 10 * TILE || cx > f.x1 + 10 * TILE) continue;
      f.t -= dt;
      if (f.t > 0 || f.vivos.length >= 2) continue;
      const x = f.x0 + 6 + Math.random() * (f.x1 - f.x0 - 12);
      let e;
      if (f.tipo === "pez_saltarin") {
        e = Enemigos.create("pez_saltarin", x, this.rows * TILE + 6);
        e.vy = -(390 + Math.random() * 70);
        e.vx = (cx < x ? -1 : 1) * (20 + Math.random() * 35);
        f.t = 1.4 + Math.random() * 1.4;
      } else {
        e = Enemigos.create("bola_lava", Math.floor(x / TILE) * TILE + TILE / 2, (this.gy + 1) * TILE + 8);
        e.vy = -(330 + Math.random() * 80);
        e.vx = 0;
        f.t = 1.8 + Math.random() * 1.6;
      }
      f.vivos.push(e);
      this.enemigos.push({ e, llevado: false });
    }
  }

  // Avance automático: la cámara avanza sola (tras un respiro al empezar) y empuja al jugador por la izquierda;
  // si lo aplasta contra una pared, muere. Por la derecha no puede salir de la pantalla
  avanceAutomatico(p, dt) {
    const cam = this.cam;
    this.avanceT += dt;
    if (this.avanceT > 1.5) cam.x = Math.min(cam.x + this.avance * dt, this.cols * TILE - W);
    if (p.x < cam.x) {
      p.x = cam.x;
      if (p.vx < 0) p.vx = 0;
      if (tocaSolido(this, p.x, p.y, p.w, p.h)) p.dead = true;
    }
    if (p.x > cam.x + W - p.w) { p.x = cam.x + W - p.w; if (p.vx > 0) p.vx = 0; }
  }

  // Texto que sube y se desvanece sobre el nivel (por ejemplo "1UP")
  textoFlotante(s, x, y) { this.textos.push({ s, x, y, t: 1.2 }); }
  actualizarTextos(dt) {
    for (const tx of this.textos) { tx.t -= dt; tx.y -= 24 * dt; }
    this.textos = this.textos.filter((tx) => tx.t > 0);
  }

  // Rompe ladrillos al pasar por encima con salto giratorio
  romperConGiro(player, game) {
    const c0 = Math.floor(player.x / TILE), c1 = Math.floor((player.x + player.w) / TILE);
    const r0 = Math.floor(player.y / TILE), r1 = Math.floor((player.y + player.h) / TILE);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      if (tileAt(this, c, r) === "B" && !this.multi.has(c + "," + r)) {
        this.tiles[r][c] = ".";
        emitir(c * TILE + 8, r * TILE + 8, 10, [this.pal.O, PAL.w], { up: 120, spread: 110, life: 0.6 });
        game.sfx("rompe");
      }
    }
  }

  actualizar(dt, game) {
    const p = this.player;
    // Temporizador del nivel
    if (!this.meta) {
      this.tiempoRest -= dt;
      if (this.tiempoRest <= 0) { this.tiempoRest = 0; p.dead = true; }
    }
    if (this.avisoT > 0) this.avisoT -= dt;
    if (this.introJefeT > 0) this.introJefeT -= dt;
    for (const [k, g] of this.golpes) { if (g - dt <= 0) this.golpes.delete(k); else this.golpes.set(k, g - dt); }
    // Plataformas móviles y que caen: se mueven antes y llevan consigo al jugador que está de pie sobre ellas
    for (const pl of this.plats) pl.update(dt, this);
    if (p.plat) { p.x += p.plat.dx; p.y += p.plat.dy; }
    p.update(dt, this, game);
    if (this.avance) this.avanceAutomatico(p, dt);
    let sobre = null;
    for (const pl of this.plats) if (pl.pisa(p, p.prevBottom)) { sobre = pl; break; }
    if (sobre) sobre.pisada = true;
    // Puentes: al pisar un tramo, los demás del mismo puente empiezan a temblar y caen en cascada
    if (sobre && sobre.grupo) {
      sobre.retraso = 0;
      for (const q of this.plats) if (q !== sobre && q.grupo === sobre.grupo && !q.caida) { q.pisada = true; q.retraso = 0.15 * Math.abs(q.indice - sobre.indice); }
    }
    p.plat = sobre;
    if (p.spinT > 0) this.romperConGiro(p, game);

    // Enemigos (enemigos.js) y jefe
    this.mundo.jugador = { x: p.x + p.w / 2, y: p.y + p.h / 2 };
    const lanzados = [];
    for (const w of this.enemigos) {
      if (w.llevado) continue;                     // el caparazón que lleva el jugador se mueve con él
      Enemigos.update(w.e, dt, this.mundo);
      if (w.e.y > this.rows * TILE + 60) w.e.remove = true;   // se cayó del nivel
      // El nubarrón lanza un erizo hacia el jugador (como mucho tres a la vez)
      if (w.e.lanza && this.enemigos.filter((o) => o.e.padre === w.e && !o.e.remove).length < 3) {
        const erizo = Enemigos.create("erizo", w.e.x, w.e.y - 10, { dir: p.x + p.w / 2 < w.e.x ? -1 : 1 });
        erizo.vy = -220;
        erizo.padre = w.e;
        lanzados.push({ e: erizo, llevado: false });
      }
    }
    this.enemigos = this.enemigos.filter((w) => !w.e.remove).concat(lanzados);
    this.actualizarFuentes(dt, p);
    if (this.bossRef) this.bossRef.update(dt, this, game, p);
    this.actualizarBolas(dt, game);
    for (const c of this.coins) c.update(dt);
    this.coins = this.coins.filter((c) => c.alive);
    this.actualizarTextos(dt);
    for (const it of this.items) it.update(dt, this);
    this.items = this.items.filter((it) => it.alive);

    this.actualizarCanones(dt, game);
    game.colisionesJugador(this);
    if (this.avance) this.cam.y = 0;
    else this.cam.seguir(p, this, dt);

    // Punto de control: se activa al pasar junto al banderín (también al salir de la zona secreta por delante).
    // En una torre, solo al pasar por su plataforma: por la misma columna, más abajo, no cuenta
    if (this.control && !this.controlActivo && p.x + p.w / 2 >= this.control.x + 8 && (!this.vertical || Math.abs(p.y + p.h - this.control.pie) < 2 * TILE)) {
      this.controlActivo = true;
      game.activarControl(this);
    }

    // Poste de meta: al llegar, termina el nivel; cuanto más alto se toca, más premio
    if (!this.meta && p.x + p.w >= this.goalX) {
      this.meta = true;
      this.metaInicio = performance.now();
      this.bonusBandera = game.premioBandera(this, p);
      game.sfx("meta");
    }
  }

  // Dibuja el nivel completo con la cámara actual
  dibujar(game) {
    const cam = this.cam;
    // En el mar, fondo submarino propio; en los demás, el escenario del tema (la cueva, en el lago de la cueva)
    if (this.agua && this.temaKey === "agua") fondoMarino(cam);
    else dibujarFondo(cam, this.pal, this.fondo, this.hora, this);
    if (this.tinte) rect(0, 0, W, H, this.tinte);   // las salas secretas toman el color de su mundo
    if (this.agua) this.dibujarAgua(cam);
    // El área de diseño se desplaza según la pantalla (OY); el HUD se dibuja aparte, arriba
    ctx.save();
    ctx.translate(0, OY);
    // Las torres se recortan al área de juego: lo que queda por encima o por debajo de ella no se dibuja
    if (this.vertical) { ctx.beginPath(); ctx.rect(0, 0, W, H_MIN); ctx.clip(); }
    if (this.hm) this.dibujarColinas(cam);
    // Decoración de bloques.js (arbustos, flores, árboles, rocas): detrás de los bloques y de los personajes
    for (const d of this.decor) {
      const x = d.c * TILE - cam.x;
      if (x < -TILE || x > W) continue;
      drawSprite(Bloques.sprite(d.ch), x, d.r * TILE - cam.y);
    }
    // Tiles visibles: columnas y filas que caen en la pantalla (las torres tienen muchas más filas)
    const c0 = Math.max(0, Math.floor(cam.x / TILE));
    const c1 = Math.min(this.cols - 1, Math.floor((cam.x + W) / TILE) + 1);
    const f0 = Math.max(0, Math.floor((cam.y - OY) / TILE) - 1), f1 = Math.min(this.rows - 1, Math.floor((cam.y - OY + H) / TILE) + 1);
    for (let r = f0; r <= f1; r++) {
      for (let c = c0; c <= c1; c++) {
        const t = this.tiles[r][c];
        if (t === ".") continue;
        const x = c * TILE - cam.x;
        let y = r * TILE - cam.y;
        if (t === "Z") { this.brilloOculto(x, y, c, r); continue; }   // el bloque oculto no se ve: como mucho, un destello
        if (t === "Y") continue;   // las arenas movedizas se dibujan después del jugador, que se hunde en ellas
        const g = this.golpes.get(c + "," + r);
        if (g) y -= Math.round(Math.sin((1 - g / 0.16) * Math.PI) * 4);   // saltito del bloque golpeado
        this.dibujarTile(t, x, y, c, r);
        if (t === "G" && r < this.gy) this.detalleTerreno(x, y, c, r);
      }
    }
    // Pista de la zona secreta: una flecha amarilla que flota sobre la boca cuando el jugador está cerca
    {
      // En las salas, todas las tuberías son salidas; en los niveles, solo la boca secreta
      const marcas = this.esSala ? this.tuberias : this.entradaSecreta ? [this.entradaSecreta] : [];
      const pj = this.player;
      for (const e of marcas) {
        if (Math.abs(pj.x + pj.w / 2 - (e.col + 1) * TILE) >= 3 * TILE) continue;
        const fx = (e.col + 1) * TILE - cam.x, fy = e.row * TILE - cam.y - 10 + Math.round(Math.sin(performance.now() / 180) * 2);
        ctx.fillStyle = PAL.y;
        ctx.beginPath(); ctx.moveTo(fx - 4, fy - 4); ctx.lineTo(fx + 4, fy - 4); ctx.lineTo(fx, fy); ctx.closePath(); ctx.fill();
      }
    }
    // Plataformas móviles (tablones) y que caen (piedra): tres bloques de ancho
    for (const pl of this.plats) {
      if (!pl.vivo) continue;
      for (let k = 0; k < pl.w / TILE; k++) {
        drawSprite(Bloques.sprite(pl.t === "movil" || pl.madera ? "W|1000" : "X"), pl.x + k * TILE - cam.x, pl.y - cam.y);
      }
    }
    // Punto de control y monedas estrella
    const ahora = performance.now() / 1000;
    if (this.control) dibujarControl(this.control.x - cam.x, this.control.pie - cam.y, this.controlActivo, ahora);
    for (const g of this.grandes) dibujarGrande(g.x - 2 - cam.x, g.y - 1 - cam.y, ahora + g.idx, g.fantasma);
    // Monedas: arte de bloques.js (8 frames de giro), centradas en su hitbox
    for (const c of this.coins) {
      drawSprite(Bloques.sprite("o" + (Math.floor(c.anim) % 8)), c.x + c.w / 2 - 8 - cam.x, c.y + c.h / 2 - 8 - cam.y);
    }
    for (const it of this.items) {
      const sp = objetoSprite(it.tipo);
      drawSprite(sp, it.x + it.w / 2 - sp.lw / 2 - cam.x, it.y + it.h - sp.lh - cam.y);
    }
    // Enemigos dibujados por enemigos.js, en coordenadas del mundo
    ctx.save();
    ctx.translate(-cam.x, -cam.y);
    for (const w of this.enemigos) Enemigos.draw(ctx, w.e);
    ctx.restore();
    if (this.bossRef) this.dibujarJefe(this.bossRef, cam);
    this.dibujarBolas(cam);
    this.dibujarCanones(cam);
    this.dibujarJugador(game, cam);
    this.dibujarArenas(cam);
    dibujarParticulas(cam);
    for (const tx of this.textos) {
      ctx.globalAlpha = Math.min(1, tx.t * 2);
      txt(tx.s, Math.round(tx.x + 8 - cam.x), Math.round(tx.y - cam.y), PAL.g, "center");
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  // Terreno de colinas: una superficie continua (pendientes sin escalones) con tierra, hierba y la textura de los bloques
  dibujarColinas(cam) {
    const hm = this.hm, fondo = this.rows * TILE - cam.y;
    const tierra = this.pal.G || PAL.br, hierba = this.pal.g || PAL.g;
    const cIni = Math.max(0, Math.floor(cam.x / TILE) - 2), cFin = Math.min(this.cols - 1, Math.floor((cam.x + W) / TILE) + 2);
    const x = (k) => k * TILE - cam.x;
    // Tramos de suelo continuo: entre dos huecos la superficie es una sola línea
    for (let c = cIni; c <= cFin; ) {
      if (hm[c] === Infinity) { c++; continue; }
      let b = c;
      while (b + 1 < this.cols && hm[b + 1] !== Infinity && b + 1 <= cFin) b++;
      const linea = [];
      for (let k = c; k <= b; k++) linea.push([x(k), hm[k] - cam.y]);
      linea.push([x(b + 1), hm[b] - cam.y]);   // borde vertical al final del tramo
      // Tierra bajo la superficie
      ctx.beginPath();
      ctx.moveTo(x(c), fondo);
      for (const [px, py] of linea) ctx.lineTo(px, py);
      ctx.lineTo(x(b + 1), fondo);
      ctx.closePath();
      ctx.fillStyle = tierra; ctx.fill();
      // Textura de bloques (interior), recortada a la tierra
      ctx.save(); ctx.clip();
      for (let k = c; k <= b; k++) {
        for (let y = Math.floor((hm[k] - cam.y - TILE) / TILE) * TILE; y < fondo; y += TILE) {
          drawSprite(Bloques.sprite(this.terreno + "|0000"), Math.round(x(k)), Math.round(y));
        }
      }
      ctx.restore();
      // Banda de hierba de 5 px bajo la superficie
      ctx.beginPath();
      linea.forEach(([px, py], i) => { if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); });
