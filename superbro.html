// Clave de una entidad (tipo y posición): permite recordar cuál se quitó o se añadió en la fase
function claveEnt(e) { return e.t + "@" + e.x + "," + e.y; }

// Ediciones de una fase (se crean vacías la primera vez)
// Base de las ediciones de una fase: la versión de sus datos publicados, o el generador de su pauta si es generada.
// Si cambia el generador de la pauta "uno", cambia también el número: las ediciones anteriores se apartan
function baseEdicion(clave) {
  if (FASES_PUBLICADAS[clave]) return FASES_PUBLICADAS[clave].version;
  const [w, f] = clave.split(":");
  const def = w !== "sala" && MUNDOS[+w] ? MUNDOS[+w].niveles[+f] : null;
  return def && def.pauta === "uno" ? "uno-3" : null;
}
function devEdicion(clave) {
  const niveles = devEstado.niveles, base = baseEdicion(clave);
  // Las ediciones de antes de publicar la fase estaban sobre el nivel generado: se guardan aparte (respaldo) y la fase
  // empieza de la publicada
  if (niveles[clave] && (niveles[clave].base || null) !== base) {
    devEstado.respaldo = devEstado.respaldo || {};
    devEstado.respaldo[clave] = niveles[clave];
    delete niveles[clave];
    devGuardar();
  }
  if (!niveles[clave]) niveles[clave] = { tiles: {}, colores: {}, ents: [], quitados: [], ops: [], decor: {}, base };
  return niveles[clave];
}
function devGuardar() {
  try { localStorage.setItem(DEV_CLAVE, JSON.stringify(devEstado)); } catch (e) { /* sin almacenamiento: las ediciones solo viven en esta pestaña */ }
}

// Aplica a los datos de una fase, antes de montarla, las ediciones guardadas
function aplicarEdiciones(data, ed) {
  for (const op of ed.ops || []) (op.t === "filas" ? aplicarOperacionFilas : aplicarOperacionColumnas)(data, op);   // primero el tamaño: lo demás va en las columnas y filas nuevas
  const cambiadas = new Set();   // casillas con un bloque nuevo: su premio de base ya no vale
  for (const k in ed.tiles) {
    const [c, r] = k.split(",").map(Number);
    if (!data.tiles[r] || data.tiles[r][c] === undefined) continue;   // fuera de la fase
    data.tiles[r][c] = ed.tiles[k];
    cambiadas.add(k);
  }
  // Decoración: cada casilla editada cambia la de base (null la quita); va detrás de los bloques
  for (const k in ed.decor || {}) {
    const [c, r] = k.split(",").map(Number), v = ed.decor[k];
    data.decor = data.decor.filter((q) => q.c !== c || q.r !== r);
    if (v) data.decor.push({ ch: v.ch, c, r });
  }
  data.ents = data.ents.filter((e) => !(e.t === "qitem" && cambiadas.has(e.x / TILE + "," + e.y / TILE)) && !ed.quitados.includes(claveEnt(e)));
  data.canones = data.canones.filter((cn) => !ed.quitados.includes(claveEnt({ t: "canon", x: cn.col * TILE, y: cn.row * TILE })));
  for (const e of ed.ents) {
    if (e.t === "canon") data.canones.push({ col: e.x / TILE, row: e.y / TILE, dir: e.dir });
    else data.ents.push(e);
  }
}

// Columnas de una operación de tamaño sobre una fase de n columnas. ins: columnas en blanco antes de la columna p.
// del: quita las columnas indicadas (vacías). Devuelve, para cada columna nueva, la vieja de la que sale (-1: en blanco)
function columnasDeOperacion(n, op) {
  const sale = [];
  for (let c = 0; c < n; c++) {
    if (op.t === "ins" && c === op.p) for (let k = 0; k < op.k; k++) sale.push(-1);
    if (!(op.t === "del" && op.cols.includes(c))) sale.push(c);
  }
  if (op.t === "ins" && op.p >= n) for (let k = 0; k < op.k; k++) sale.push(-1);
  return sale;
}
// De columna vieja a columna nueva: cmap[c] (también cmap[n], el final) y vive[c]. Una columna quitada pasa a la
// siguiente que queda, así lo que estaba en su borde no se pierde
function movimientoColumnas(n, sale) {
  const cmap = new Array(n + 1), vive = new Array(n).fill(false);
  sale.forEach((c, j) => { if (c >= 0) { cmap[c] = j; vive[c] = true; } });
  let sig = sale.length;
  cmap[n] = sig;
  for (let c = n - 1; c >= 0; c--) { if (vive[c]) sig = cmap[c]; else cmap[c] = sig; }
  return { cmap, vive };
}
// Posición horizontal (px) en la fase nueva
function xEnColumnas(cmap, x) {
  const c = Math.floor(x / TILE);
  return cmap[c] * TILE + (x - c * TILE);
}
// Aplica una operación de tamaño a los datos de la fase: bloques, enemigos, meta, plataformas, surtidores...
function aplicarOperacionColumnas(data, op) {
  const n = data.cols, sale = columnasDeOperacion(n, op), { cmap, vive } = movimientoColumnas(n, sale);
  const mx = (x) => xEnColumnas(cmap, x), viva = (x) => vive[Math.floor(x / TILE)];
  data.tiles = data.tiles.map((fila, r) => sale.map((c) => (c >= 0 ? fila[c] : r < data.gy ? "." : "G")));
  data.cols = sale.length;
  data.goalX = mx(data.goalX);
  data.ents = data.ents.filter((e) => viva(e.x)).map((e) => Object.assign({}, e, { x: mx(e.x) }));
  data.decor = data.decor.filter((q) => vive[q.c]).map((q) => Object.assign({}, q, { c: cmap[q.c] }));
  data.canones = data.canones.filter((k) => vive[k.col]).map((k) => Object.assign({}, k, { col: cmap[k.col] }));
  data.plats = data.plats.filter((pl) => viva(pl.x))
    .map((pl) => Object.assign({}, pl, { x: mx(pl.x) }, pl.x0 !== undefined ? { x0: mx(pl.x0), x1: mx(pl.x1) } : {}));
  data.fuentes = data.fuentes.map((f) => Object.assign({}, f, { x0: mx(f.x0), x1: mx(f.x1) }));
  if (data.control) data.control = Object.assign({}, data.control, { x: mx(data.control.x) });
  data.start = Object.assign({}, data.start, { x: mx(data.start.x) });
  if (data.entradaSecreta) data.entradaSecreta = Object.assign({}, data.entradaSecreta, { col: cmap[data.entradaSecreta.col] });
  if (data.salidaSecreta) data.salidaSecreta = Object.assign({}, data.salidaSecreta, { col: cmap[data.salidaSecreta.col] });
}
// Una columna está vacía si solo tiene suelo (o aire sobre él) y nada encima: ni enemigos, objetos, plataformas,
// surtidores, decoración, cañones, la meta ni el inicio
function columnaVacia(d, c) {
  for (let r = 0; r < d.rows; r++) if (d.tiles[r][c] !== (r < d.gy ? "." : "G")) return false;
  const x0 = c * TILE, x1 = x0 + TILE;
  const toca = (x, w) => x < x1 && x + w > x0;
  if (d.ents.some((e) => toca(e.x, TILE))) return false;
  if (d.decor.some((q) => q.c === c) || d.canones.some((k) => k.col === c)) return false;
  if (d.plats.some((pl) => toca(pl.x, pl.w) || (pl.x0 !== undefined && toca(pl.x0, pl.x1 - pl.x0 + pl.w)))) return false;
  if (d.fuentes.some((f) => toca(f.x0, f.x1 - f.x0))) return false;
  if (d.control && toca(d.control.x, TILE)) return false;
  if (toca(d.start.x, TILE)) return false;
  return !(d.entradaSecreta && d.entradaSecreta.col === c) && !(d.salidaSecreta && d.salidaSecreta.col === c);
}
// Las ediciones guardadas pasan a la numeración nueva de columnas (las de las columnas quitadas estaban vacías)
function reubicarEdiciones(ed, cmap, vive) {
  for (const mapa of [ed.tiles, ed.colores]) reubicarClaves(mapa, (c, r) => (vive[c] ? cmap[c] + "," + r : null));
  if (ed.decor) reubicarClaves(ed.decor, (c, r) => (vive[c] ? cmap[c] + "," + r : null));
  ed.ents = ed.ents.filter((e) => vive[Math.floor(e.x / TILE)]).map((e) => Object.assign({}, e, { x: xEnColumnas(cmap, e.x) }));
  const quitados = [];
  for (const k of ed.quitados) {
    const [t, pos] = k.split("@"), [x, y] = pos.split(",").map(Number);
    if (vive[Math.floor(x / TILE)]) quitados.push(t + "@" + xEnColumnas(cmap, x) + "," + y);
  }
  ed.quitados = quitados;
}
// - y +: quita o añade 16 columnas, antes de la escalinata de la meta. Quitar solo quita columnas vacías (las
// más cercanas a la meta). Se guarda como operación, así se repite al cargar la fase
function devCambiarAncho(sentido) {
  const lv = game.lvl;
  if (!lv || !lv.ed || game.estado !== "nivel") return;
  const def = lv.def;
  if (def.sala || def.mapa || def.torre || def.colinas || def.jefe) return devAviso("ESTA FASE TIENE TAMANO FIJO");
  const d = datosBase(def, MUNDOS[game.mundoIdx].tema, lv.clave);
  aplicarEdiciones(d, lv.ed);
  const n = d.cols, p = d.goalX / TILE - DEV_PASO_COLS;   // la escalinata de la meta empieza 16 columnas antes de la bandera
  let op;
  if (sentido > 0) {
    if (n + DEV_PASO_COLS > DEV_MAX_COLS) return devAviso("YA NO CABE MAS");
    op = { t: "ins", p, k: DEV_PASO_COLS };
  } else {
    const vacias = [];
    for (let c = p - 1; c >= 1 && vacias.length < DEV_PASO_COLS; c--) if (columnaVacia(d, c)) vacias.push(c);
    if (!vacias.length) return devAviso("NO HAY COLUMNAS VACIAS PARA QUITAR");
    op = { t: "del", cols: vacias.sort((a, b) => a - b) };
  }
  const ed = lv.ed, sale = columnasDeOperacion(n, op), { cmap, vive } = movimientoColumnas(n, sale);
  const medio = Math.floor((lv.player.x + lv.player.w / 2) / TILE), px = lv.player.x, py = lv.player.y;
  ed.ops = ed.ops || [];
  ed.ops.push(op);
  reubicarEdiciones(ed, cmap, vive);
  devGuardar();
  devPulsa = null;
  devRecargarNivel();
  game.irisAbre = 0;   // sin fundido: cambiar el tamaño no tiene que parecer una entrada nueva
  // El jugador vuelve a su sitio si su columna sigue existiendo
  const nuevo = game.lvl;
  if (medio < n && vive[medio]) {
    nuevo.player.x = Math.min(xEnColumnas(cmap, px), nuevo.cols * TILE - nuevo.player.w);
    nuevo.player.y = py; nuevo.player.vx = 0; nuevo.player.vy = 0;
    nuevo.cam.centrar(nuevo.player, nuevo);
  }
  devAviso("ANCHO " + sale.length);
}

// Filas de una operación de alto sobre una fase de n filas: añade filas en blanco arriba o abajo, o quita las del
// extremo (op.quita). Devuelve, por cada fila nueva, la vieja de la que sale (-1: fila en blanco)
function filasDeOperacion(n, op) {
  const k = op.k, viejas = [...Array(n).keys()], blancas = Array(k).fill(-1);
  if (op.quita) return op.pos === "arriba" ? viejas.slice(k) : viejas.slice(0, n - k);
  return op.pos === "arriba" ? [...blancas, ...viejas] : [...viejas, ...blancas];
}
// De fila vieja a fila nueva, como movimientoColumnas
function movimientoFilas(n, sale) {
  const rmap = new Array(n + 1), vive = new Array(n).fill(false);
  sale.forEach((r, j) => { if (r >= 0) { rmap[r] = j; vive[r] = true; } });
  let sig = sale.length;
  rmap[n] = sig;
  for (let r = n - 1; r >= 0; r--) { if (vive[r]) sig = rmap[r]; else rmap[r] = sig; }
  return { rmap, vive };
}
// Posición vertical (px) en la fase nueva
function yEnFilas(rmap, y) {
  const r = Math.floor(y / TILE);
  return rmap[r] * TILE + (y - r * TILE);
}
// Aplica una operación de alto a los datos de la fase, igual que las de ancho
function aplicarOperacionFilas(data, op) {
  const n = data.rows, sale = filasDeOperacion(n, op), { rmap, vive } = movimientoFilas(n, sale);
  const my = (y) => yEnFilas(rmap, y), viva = (y) => vive[Math.floor(y / TILE)];
  data.tiles = sale.map((r) => (r >= 0 ? data.tiles[r].slice() : new Array(data.cols).fill(".")));
  data.rows = sale.length;
  data.gy = rmap[data.gy];
  data.sueloMeta = my(data.sueloMeta);
  data.ents = data.ents.filter((e) => viva(e.y)).map((e) => Object.assign({}, e, { y: my(e.y) }));
  data.plats = data.plats.filter((pl) => viva(pl.y))
    .map((pl) => Object.assign({}, pl, { y: my(pl.y) }, pl.y0 !== undefined ? { y0: my(pl.y0), y1: my(pl.y1) } : {}));
  data.decor = data.decor.filter((q) => vive[q.r]).map((q) => Object.assign({}, q, { r: rmap[q.r] }));
  data.canones = data.canones.filter((cn) => vive[cn.row]).map((cn) => Object.assign({}, cn, { row: rmap[cn.row] }));
  if (data.control) data.control = Object.assign({}, data.control, { pie: my(data.control.pie) });
  data.start = Object.assign({}, data.start, { y: my(data.start.y) });
  if (data.entradaSecreta) data.entradaSecreta = Object.assign({}, data.entradaSecreta, { row: rmap[data.entradaSecreta.row] });
  if (data.salidaSecreta) data.salidaSecreta = Object.assign({}, data.salidaSecreta, { row: rmap[data.salidaSecreta.row] });
}
// Una fila está vacía si solo tiene aire (sin bloques) y nada dentro: ni enemigos, objetos, plataformas, decoración,
// cañones, el inicio, el punto de control ni las bocas de las zonas secretas
function filaVacia(d, r) {
  if (d.tiles[r].some((t) => t !== ".")) return false;
  const y0 = r * TILE, y1 = y0 + TILE, toca = (y, h) => y < y1 && y + h > y0;
  if (d.ents.some((e) => toca(e.y, TILE))) return false;
  if (d.decor.some((q) => q.r === r) || d.canones.some((cn) => cn.row === r)) return false;
  if (d.plats.some((pl) => toca(pl.y, pl.h) || (pl.y0 !== undefined && toca(pl.y0, pl.y1 - pl.y0 + pl.h)))) return false;
  if (d.control && toca(d.control.pie - 32, 32)) return false;
  if (toca(d.start.y - TILE, 3 * TILE)) return false;
  return !(d.entradaSecreta && d.entradaSecreta.row === r) && !(d.salidaSecreta && d.salidaSecreta.row === r);
}
// Reescribe las claves "c,r" de un mapa de casillas: nueva(c, r) da la clave nueva, o null si se pierde.
// Se trabaja sobre una copia para que una clave nueva no pise una vieja que todavía no se ha movido
function reubicarClaves(mapa, nueva) {
  const viejo = Object.assign({}, mapa);
  for (const k of Object.keys(mapa)) delete mapa[k];
  for (const k of Object.keys(viejo)) {
    const [c, r] = k.split(",").map(Number), kn = nueva(c, r);
    if (kn !== null) mapa[kn] = viejo[k];
  }
}
// Las ediciones guardadas pasan a la numeración nueva de filas (las de las filas quitadas estaban vacías)
function reubicarFilas(ed, rmap, vive) {
  for (const mapa of [ed.tiles, ed.colores]) reubicarClaves(mapa, (c, r) => (vive[r] ? c + "," + rmap[r] : null));
  if (ed.decor) reubicarClaves(ed.decor, (c, r) => (vive[r] ? c + "," + rmap[r] : null));
  ed.ents = ed.ents.filter((e) => vive[Math.floor(e.y / TILE)]).map((e) => Object.assign({}, e, { y: yEnFilas(rmap, e.y) }));
  const quitados = [];
  for (const k of ed.quitados) {
    const [t, pos] = k.split("@"), [x, y] = pos.split(",").map(Number);
    if (vive[Math.floor(y / TILE)]) quitados.push(t + "@" + x + "," + yEnFilas(rmap, y));
  }
  ed.quitados = quitados;
}
// ARRIBA y ABAJO: quita o añade 14 filas en ese extremo. Entre 14 (la original) y 84 filas. Quitar solo quita filas
// vacías. Se guarda como operación, así se repite al cargar la fase
function devCambiarAlto(pos, sentido) {
  const lv = game.lvl;
  if (!lv || !lv.ed || game.estado !== "nivel") return;
  const def = lv.def;
  if (def.sala || def.mapa || def.torre || def.colinas || def.jefe) return devAviso("ESTA FASE TIENE TAMANO FIJO");
  const d = datosBase(def, MUNDOS[game.mundoIdx].tema, lv.clave);
  aplicarEdiciones(d, lv.ed);
  const n = d.rows, k = DEV_PASO_FILAS;
  let op;
  if (sentido > 0) {
    if (n + k > DEV_MAX_FILAS) return devAviso("YA NO CABE MAS");
    op = { t: "filas", pos, k };
  } else {
    if (n - k < ROWS) return devAviso("NO PUEDE SER MAS BAJA");
    const quitadas = [...Array(k).keys()].map((i) => (pos === "arriba" ? i : n - k + i));
    if (!quitadas.every((r) => filaVacia(d, r))) return devAviso("HAY ALGO EN ESE EXTREMO");
    op = { t: "filas", pos, k, quita: true };
  }
  const ed = lv.ed, sale = filasDeOperacion(n, op), { rmap, vive } = movimientoFilas(n, sale);
  const pj = lv.player, fila = Math.floor((pj.y + pj.h / 2) / TILE), px = pj.x, py = pj.y;
  ed.ops = ed.ops || [];
  ed.ops.push(op);
  reubicarFilas(ed, rmap, vive);
  devGuardar();
  devPulsa = null;
  devRecargarNivel();
  game.irisAbre = 0;
  const nuevo = game.lvl;
  if (fila < n && vive[fila]) {
    nuevo.player.x = px;
    nuevo.player.y = Math.min(yEnFilas(rmap, py), nuevo.rows * TILE - nuevo.player.h);
    nuevo.player.vx = 0; nuevo.player.vy = 0;
    nuevo.cam.centrar(nuevo.player, nuevo);
  }
  devAviso("ALTO " + sale.length);
}
// Lado del cuadro: de 2 en 2, entre 10 y 30
function devCambiarLado(d) {
  const nuevo = devLado + 2 * d;
  if (nuevo < DEV_LADO_MIN || nuevo > DEV_LADO_MAX) return devAviso("EL CUADRO VA DE 10 A 30");
  devForma();
  devLado = nuevo;
  devRedimensionarForma(nuevo);
  devGuardar();
}
// Casillas pintadas de la forma, centrada en (c, r): c0 y r0 (sin recortar) y las que están dentro de la fase
function devCuadroDe(lv, c, r) {
  const f = devForma(), h = Math.floor(f.n / 2), c0 = c - h, r0 = r - h, lista = [];
  for (let dr = 0; dr < f.n; dr++) {
    for (let dc = 0; dc < f.n; dc++) {
      const cc = c0 + dc, rr = r0 + dr;
      if (f.filas[dr][dc] === "#" && cc >= 0 && cc < lv.cols && rr >= 0 && rr < lv.rows) lista.push([cc, rr]);
    }
  }
  return { c0, r0, lista };
}
// Toque corto en modo cuadro: pone lo seleccionado en la forma. Bloques: todas sus casillas. Pincel: pinta los
// bloques del cuadro. Enemigos y monedas: uno cada tres casillas, en el aire
function devPonerArea(c, r) {
  const lv = game.lvl;
  if (!devCasillaValida(lv, c, r)) return;
  const { c0, r0, lista } = devCuadroDe(lv, c, r), s = devSel, b = DEV_BLOQUES[s.i], color = DEV_COLORES[devColor].id;
  if (s.tipo === "bloque" && b.pincel) {
    const con = lista.filter(([cc, rr]) => lv.tiles[rr][cc] !== ".");
    for (const [cc, rr] of con) devColorear(lv, cc, rr, color);
    devGuardar();
    return devAviso(con.length + " BLOQUES PINTADOS");
  }
  if (s.tipo === "bloque") {
    const item = !b.item ? (b.multi ? "multi" : null) : b.ch === "Q" ? DEV_ITEMS_Q[devItemQ] : DEV_ITEMS_Z[devItemZ];
    for (const [cc, rr] of lista) devAplicarBloque(lv, cc, rr, b.ch, item, color);
    lv.tuberias = encontrarTuberias(lv.tiles);
    devGuardar();
    return devAviso(lista.length + " BLOQUES");
  }
  let ent;
  if (s.tipo === "enemigo") {
    const tipo = DEV_ENEMIGOS[devEnem];
    if (DEV_PLANTAS.includes(tipo)) return devAviso("LAS PLANTAS SOLO EN UNA TUBERIA");
    ent = ([cc, rr]) => ({ t: tipo, x: cc * TILE, y: rr * TILE });
  } else if (s.tipo === "objeto" && DEV_OBJETOS[s.i].obj === "moneda") {
    ent = ([cc, rr]) => ({ t: "coin", x: cc * TILE + 4, y: rr * TILE + 4 });
  } else return devAviso("EN CUADRO: BLOQUES, PINCEL, ENEMIGOS Y MONEDAS");
  const sitios = lista.filter(([cc, rr]) => (cc - c0) % 3 === 1 && (rr - r0) % 3 === 1);
  let n = 0;
  for (const sitio of sitios) {
    const e = ent(sitio);
    if (!devLibre(lv, sitio[0], sitio[1]) || devHayClave(lv, claveEnt(e))) continue;
    devPonerEntidad(lv, e);
    n++;
  }
  if (!n) return devAviso("NO HAY SITIO LIBRE EN EL CUADRO");
  devAviso(n + (s.tipo === "enemigo" ? " ENEMIGOS" : " MONEDAS"));
}
// Toque largo en modo cuadro: borra los bloques de la forma y todo lo que hay dentro (enemigos, monedas, cañones)
function devBorrarArea(c, r) {
  const lv = game.lvl;
  if (!devCasillaValida(lv, c, r)) return;
  const { c0, r0, lista } = devCuadroDe(lv, c, r), f = devForma();
  const dentro = (x, y) => {   // un objeto cuenta si su casilla es una de las pintadas de la forma
    const dc = Math.floor(x / TILE) - c0, dr = Math.floor(y / TILE) - r0;
    return dc >= 0 && dc < f.n && dr >= 0 && dr < f.n && f.filas[dr][dc] === "#";
  };
  const hits = [];
  for (const w of lv.enemigos) if (!w.llevado && dentro(w.e.x, w.e.y)) hits.push({ campo: "enemigos", obj: w, clave: w.clave });
  for (const cn of lv.canones) if (dentro(cn.col * TILE, cn.row * TILE)) hits.push({ campo: "canones", obj: cn, clave: cn.clave });
  for (const m of lv.coins) if (dentro(m.x, m.y)) hits.push({ campo: "coins", obj: m, clave: m.clave });
  for (const g of lv.grandes) if (dentro(g.x, g.y)) hits.push({ campo: "grandes", obj: g, clave: g.clave });
  for (const h of hits) {
    const campo = lv[h.campo], i = campo.indexOf(h.obj);
    if (i >= 0) campo.splice(i, 1);
    if (h.clave) devOlvidarEntidad(lv, h.clave);
  }
  let bloques = 0;
  for (const [cc, rr] of lista) if (lv.tiles[rr][cc] !== ".") { devAplicarBloque(lv, cc, rr, ".", null, null); bloques++; }
  lv.tuberias = encontrarTuberias(lv.tiles);
  devGuardar();
  devAviso("BORRADOS " + bloques + " BLOQUES Y " + hits.length + " OBJETOS");
}

/* Forma del cuadro: una cuadrícula de n×n casillas (n = devLado) que se guarda con las ediciones de todas las fases.
   Empieza llena, así que sin dibujar nada el cuadro es un cuadrado. Pintada, es la figura que se repite al tocar. */
function devForma() {
  if (!devEstado.forma) devEstado.forma = { n: devLado, filas: Array.from({ length: devLado }, () => "#".repeat(devLado)) };
  return devEstado.forma;
}
// Cambia el lado sin perder la forma: se queda en el centro y lo que sobra se recorta. Lo nuevo sale vacío,
// salvo si la forma estaba llena: un cuadro sigue siendo un cuadro al cambiar de lado
function devRedimensionarForma(n) {
  const f = devForma(), viejo = f.n, desfase = (n - viejo) / 2, filas = [];
  const llena = f.filas.every((fila) => !fila.includes("."));
  for (let dr = 0; dr < n; dr++) {
    let fila = "";
    for (let dc = 0; dc < n; dc++) {
      const sr = dr - desfase, sc = dc - desfase;
      fila += sr >= 0 && sr < viejo && sc >= 0 && sc < viejo ? f.filas[sr][sc] : llena ? "#" : ".";
    }
    filas.push(fila);
  }
  f.n = n;
  f.filas = filas;
}
// Llena o vacía toda la cuadrícula
function devLlenarForma(lleno) {
  const f = devForma(), relleno = lleno ? "#" : ".";
  f.filas = f.filas.map(() => relleno.repeat(f.n));
  devGuardar();
}
function devAbrirForma() {
  devForma();
  devFormaEd = true;
  devMira = null;
  devAviso("PINTA LA FORMA Y PULSA LISTO");
}
function devCerrarForma() {
  devFormaEd = false;
  devPintando = null;
  devGuardar();
  devAviso("FORMA GUARDADA");
}
// Cuadrícula del editor: centrada en la pantalla, por encima de la paleta y de su línea de aviso
function devGrillaForma() {
  const n = devLado, area = H - DEV_PANEL - 20, s = Math.max(4, Math.floor(Math.min(W - 16, area) / n));
  return { n, s, gx: Math.floor((W - s * n) / 2), gy: 8 + Math.floor((area - s * n) / 2) };
}
// Casilla de la cuadrícula bajo un punto de la pantalla (o null si está fuera)
function devCeldaForma(p) {
  const { n, s, gx, gy } = devGrillaForma();
  const dc = Math.floor((p.x - gx) / s), dr = Math.floor((p.y - gy) / s);
  return dc >= 0 && dc < n && dr >= 0 && dr < n ? { dc, dr } : null;
}
// La primera casilla decide si se pinta o se borra; al arrastrar, las que se tocan toman ese mismo valor
function devPintarForma(p, primera) {
  const c = devCeldaForma(p), f = devForma();
  if (primera) devPintando = c ? (f.filas[c.dr][c.dc] === "#" ? "." : "#") : null;
  if (!c || !devPintando || f.filas[c.dr][c.dc] === devPintando) return;
  f.filas[c.dr] = f.filas[c.dr].slice(0, c.dc) + devPintando + f.filas[c.dr].slice(c.dc + 1);
  devGuardar();
}
// Clic en la paleta mientras se dibuja: LIMPIAR, LLENAR, LISTO y el lado
function devClicPanelForma(x, y) {
  const y0 = H - DEV_PANEL;
  if (y >= y0 + 52 && y < y0 + 68) {
    if (x >= 2 && x < 58) return devLlenarForma(false);
    if (x >= 62 && x < 118) return devLlenarForma(true);
  } else if (y >= y0 + 70 && y < y0 + 86) {
    if (x >= 2 && x < 54) return devCerrarForma();
    if (x >= 57 && x < 73) return devCambiarLado(-1);
    if (x >= 83 && x < 99) return devCambiarLado(1);
  }
}
// Dibujo del editor: un velo sobre la pantalla y la cuadrícula; lo pintado sale en amarillo
function devDibujarForma() {
  const { n, s, gx, gy } = devGrillaForma(), f = devForma();
  rect(0, 0, W, H - DEV_PANEL, "rgba(12,14,30,0.82)");
  for (let dr = 0; dr < n; dr++) {
    for (let dc = 0; dc < n; dc++) rect(gx + dc * s, gy + dr * s, s - 1, s - 1, f.filas[dr][dc] === "#" ? PAL.y : "#2a2d40");
  }
  // La casilla blanca es la que se toca en el nivel para poner la forma
  const m = Math.floor(n / 2);
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1;
  ctx.strokeRect(gx + m * s + 0.5, gy + m * s + 0.5, s - 2, s - 2);
}
// Paleta mientras se dibuja la forma
function devDibujarPanelForma(y0) {
  txt("FORMA " + devLado + "X" + devLado + "   ARRASTRA PARA PINTAR", 2, y0 + 5, PAL.w);
  txt("LA CASILLA BLANCA SE TOCA EN EL NIVEL", 2, y0 + 22, PAL.gr);
  devBotonTexto(2, y0 + 52, 56, "LIMPIAR", false);
  devBotonTexto(62, y0 + 52, 56, "LLENAR", false);
  devBotonTexto(2, y0 + 70, 52, "LISTO", true);
  devBoton(58, y0 + 70, "-");
  txt(String(devLado), 76, y0 + 75, PAL.w, "center");
  devBoton(84, y0 + 70, "+");
}

// Copia de un sprite de bloque con otro color (cacheada por sprite y color). Sin color, el mismo sprite
const tintesCache = new WeakMap();
function tintado(sp, id) {
  const t = id ? DEV_TINTES[id] : null;
  if (!t) return sp;
  let mapa = tintesCache.get(sp);
  if (!mapa) { mapa = {}; tintesCache.set(sp, mapa); }
  if (!mapa[id]) {
    const c = document.createElement("canvas");
    c.width = sp.width; c.height = sp.height; c.pad = sp.pad; c.lw = sp.lw; c.lh = sp.lh;
    const g = c.getContext("2d");
    g.drawImage(sp, 0, 0);
    g.globalCompositeOperation = t.modo;
    g.fillStyle = t.color;
    g.fillRect(0, 0, c.width, c.height);
    g.globalCompositeOperation = "destination-in";   // solo donde el sprite tiene dibujo
    g.drawImage(sp, 0, 0);
    mapa[id] = c;
  }
  return mapa[id];
}

// Un bloque nuevo (o un cambio de bloque) en una casilla: se pone en la fase y en lo guardado
function devAplicarBloque(lv, c, r, ch, item, color) {
  const k = c + "," + r, x = c * TILE, y = r * TILE, ed = lv.ed;
  lv.tiles[r][c] = ch;
  ed.tiles[k] = ch;
  lv.qItems.delete(k);
  lv.multi.delete(k);
  ed.ents = ed.ents.filter((e) => !(e.t === "qitem" && e.x === x && e.y === y));
  if (item) { const q = { t: "qitem", x, y, item }; lv.spawn(q); ed.ents.push(q); }
  devColorear(lv, c, r, color);
}
function devPonerBloque(lv, c, r, ch, item, color) {
  devAplicarBloque(lv, c, r, ch, item, color);
  lv.tuberias = encontrarTuberias(lv.tiles);
  devGuardar();
}
// Color de una casilla (lv.colores es el mismo objeto que lv.ed.colores)
function devColorear(lv, c, r, color) {
  const k = c + "," + r;
  if (color) lv.colores[k] = color; else delete lv.colores[k];
}

// Un enemigo, una moneda, una moneda estrella o un cañón en una casilla (ent: como en los datos de la fase)
function devPonerEntidad(lv, ent) {
  const k = claveEnt(ent);
  if (devHayClave(lv, k)) return devAviso("YA HAY ALGO AQUI");
  if (ent.t === "canon") {
    devPonerBloque(lv, ent.x / TILE, ent.y / TILE, "S", null, null);   // el cañón va sobre piedra
    lv.canones.push({ col: ent.x / TILE, row: ent.y / TILE, dir: ent.dir, cada: 2.4, velocidad: 90, t: 1.2, clave: k });
  } else lv.spawn(ent);
  lv.ed.ents.push(ent);
  devGuardar();
}
function devHayClave(lv, k) {
  return lv.enemigos.some((w) => w.clave === k) || lv.coins.some((m) => m.clave === k) ||
    lv.grandes.some((g) => g.clave === k) || lv.canones.some((cn) => cn.clave === k);
}
// Lo que hay en la casilla, por prioridad: enemigo (el más cercano), cañón, moneda y moneda estrella
function devEntidadEn(lv, c, r) {
  const x0 = c * TILE, y0 = r * TILE, cx = x0 + TILE / 2, cy = y0 + TILE / 2;
  let mejor = null, d2 = Infinity;
  for (const w of lv.enemigos) {
    const e = w.e;
    if (w.llevado || e.remove || e.dead) continue;
    if (Math.abs(e.x - cx) > e.w / 2 + TILE / 2 || Math.abs(e.y - cy) > e.h / 2 + TILE / 2) continue;
    const d = (e.x - cx) ** 2 + (e.y - cy) ** 2;
    if (d < d2) { d2 = d; mejor = w; }
  }
  if (mejor) return { campo: "enemigos", obj: mejor, clave: mejor.clave };
  const cn = lv.canones.find((k) => k.col === c && k.row === r);
  if (cn) return { campo: "canones", obj: cn, clave: cn.clave };
  const toca = (o) => o.x < x0 + TILE && o.x + o.w > x0 && o.y < y0 + TILE && o.y + o.h > y0;
  const m = lv.coins.find(toca);
  if (m) return { campo: "coins", obj: m, clave: m.clave };
  const g = lv.grandes.find(toca);
  if (g) return { campo: "grandes", obj: g, clave: g.clave };
  return null;
}
// Anota en lo guardado que la entidad ya no está (si era de la fase) o que se quita lo añadido
function devOlvidarEntidad(lv, k) {
  const ed = lv.ed, i = ed.ents.findIndex((e) => claveEnt(e) === k);
  if (i >= 0) ed.ents.splice(i, 1);
  else if (!ed.quitados.includes(k)) ed.quitados.push(k);
  devGuardar();
}
// Quita lo que había bajo el dedo al empezar la pulsación (hit); si no había nada, quita el bloque
function devQuitar(lv, c, r, hit) {
  if (hit) {
    const lista = lv[hit.campo], i = lista.indexOf(hit.obj);   // la lista se renueva en la partida: se toma la actual
    if (i < 0) return;   // ya no está (murió o se fue): no se toca el bloque
    lista.splice(i, 1);
    if (hit.clave) devOlvidarEntidad(lv, hit.clave);
    return devAviso("QUITADO");
  }
  if (lv.tiles[r][c] !== ".") return devPonerBloque(lv, c, r, ".", null, null);
  devQuitarDeco(lv, c, r);
}
// Primer estrella libre de la fase (0 a 2), o -1 si ya hay tres
function devIdxEstrella(lv) {
  const usados = new Set([...lv.grandes.map((g) => g.idx), ...(game.intento ? game.intento.grandes : [])]);
  for (let i = 0; i < 3; i++) if (!usados.has(i)) return i;
  return -1;
}
function devLibre(lv, c, r) { return !SOLIDOS[lv.tiles[r][c]]; }
function devCasillaValida(lv, c, r) { return c >= 0 && c < lv.cols && r >= 0 && r < lv.rows; }

// Decoración editada de la fase (las ediciones guardadas antes de la decoración no la tienen)
function devDecorEd(lv) { return lv.ed.decor || (lv.ed.decor = {}); }
// Pieza de decoración: todas sus casillas tienen que estar dentro de la fase y en el aire. Se pone sobre la decoración que hubiera
function devPonerDecor(lv, c, r) {
  const pieza = DEV_DECOR[devSel.i], celdas = pieza.celdas.map(([dc, dr, ch]) => [c + dc, r + dr, ch]);
  if (celdas.some(([cc, rr]) => !devCasillaValida(lv, cc, rr))) return devAviso("NO CABE AQUI");
  if (celdas.some(([cc, rr]) => lv.tiles[rr][cc] !== ".")) return devAviso("NO HAY SITIO: HAY BLOQUES");
  const g = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);   // las casillas de una pieza comparten grupo
  const ed = devDecorEd(lv);
  for (const [cc, rr, ch] of celdas) {
    const i = lv.decor.findIndex((q) => q.c === cc && q.r === rr);
    if (i >= 0) lv.decor.splice(i, 1);
    lv.decor.push({ ch, c: cc, r: rr });
    ed[cc + "," + rr] = { ch, g };
  }
  devGuardar();
  devAviso(pieza.nombre);
}
// Quita la decoración de una casilla; si es una pieza, quita todas sus casillas. Devuelve si había algo que quitar
function devQuitarDeco(lv, c, r) {
  if (!lv.decor.some((q) => q.c === c && q.r === r)) return false;
  const ed = devDecorEd(lv), mio = ed[c + "," + r];
  const celdas = mio && mio.g ? Object.keys(ed).filter((k) => ed[k] && ed[k].g === mio.g) : [c + "," + r];
  for (const k of celdas) {
    const [cc, rr] = k.split(",").map(Number), i = lv.decor.findIndex((q) => q.c === cc && q.r === rr);
    if (i >= 0) lv.decor.splice(i, 1);
    ed[k] = null;   // null: quita también la decoración de base de esa casilla, si la hay
  }
  devGuardar();
  devAviso("DECOR QUITADO");
  return true;
}
// Pulsación corta: pone lo seleccionado en la casilla
function devPoner(c, r) {
  const lv = game.lvl;
  if (!devCasillaValida(lv, c, r)) return;
  const s = devSel, b = DEV_BLOQUES[s.i], color = DEV_COLORES[devColor].id;
  if (s.tipo === "decor") return devPonerDecor(lv, c, r);
  if (s.tipo === "bloque" && b.pincel) {
    if (lv.tiles[r][c] === ".") return devAviso("NO HAY BLOQUE AQUI");
    devColorear(lv, c, r, color);
    devGuardar();
  } else if (s.tipo === "bloque") {
    const item = !b.item ? (b.multi ? "multi" : null) : b.ch === "Q" ? DEV_ITEMS_Q[devItemQ] : DEV_ITEMS_Z[devItemZ];
    devPonerBloque(lv, c, r, b.ch, item, color);
  } else if (s.tipo === "objeto") {
    const o = DEV_OBJETOS[s.i];
    if (o.obj === "canon") return devPonerEntidad(lv, { t: "canon", x: c * TILE, y: r * TILE, dir: o.dir });
    if (!devLibre(lv, c, r)) return devAviso("HAY UN BLOQUE AQUI");
    if (o.obj === "moneda") return devPonerEntidad(lv, { t: "coin", x: c * TILE + 4, y: r * TILE + 4 });
    const idx = devIdxEstrella(lv);
    if (idx < 0) return devAviso("YA HAY 3 MONEDAS ESTRELLA");
    devPonerEntidad(lv, { t: "grande", x: c * TILE, y: r * TILE, idx });
  } else {
    const tipo = DEV_ENEMIGOS[devEnem];
    let ent = { t: tipo, x: c * TILE, y: r * TILE };
    if (DEV_PLANTAS.includes(tipo)) {
      const tub = lv.tuberias.find((p) => p.row === r && (c === p.col || c === p.col + 1));
      if (!tub) return devAviso("ESTA PLANTA SALE DE UNA TUBERIA");
      ent = { t: tipo, x: tub.col * TILE + 1, y: tub.row * TILE - 8 };
    } else if (!devLibre(lv, c, r)) return devAviso("HAY UN BLOQUE AQUI");
    devPonerEntidad(lv, ent);
  }
}

// Fondos que se pueden elegir en la fase (el primero: el de la fase, sin cambiar)
const DEV_FONDOS = [null, "pradera", "desierto", "bosque", "cueva", "hielo", "agua", "castillo", "cielo", "vangogh", "dali", "miro", "gaudi", "barco", "nieve", "volcan", "espacio", "selva"];
// Pasa al fondo siguiente (d = 1) o anterior (d = -1) de la fase; se guarda con la fase
function devCiclarFondo(d) {
  const lv = game.lvl;
  if (!lv || !lv.ed) return;
  const i = DEV_FONDOS.indexOf(lv.ed.fondo || null), nuevo = DEV_FONDOS[(i + d + DEV_FONDOS.length) % DEV_FONDOS.length];
  if (nuevo) lv.ed.fondo = nuevo; else delete lv.ed.fondo;
  lv.fondo = nuevo || lv.def.fondo || lv.temaKey;
  devGuardar();
}
// Modo inmortal: al caer, al tiempo agotado o al aplastarlo, el personaje reaparece en el punto de control (si se
// pasó) o al inicio de la fase, con el tiempo otra vez lleno
function devRevivir(lv) {
  const p = lv.player, c = lv.controlActivo ? lv.control : null;
  p.dead = false;
  p.vx = 0; p.vy = 0;
  p.trepando = false; p.plat = null;
  if (c) { p.x = c.x + 2; p.y = c.pie - p.h; } else { p.x = lv.inicio.x; p.y = lv.inicio.y; }
  if (lv.tiempoRest <= 0) lv.tiempoRest = lv.tiempo;
  lv.cam.centrar(p, lv);
  devAviso("INMORTAL: REAPARECES");
}
// Colocar al jugador: va a esa casilla, con los pies en su base. No se pone dentro de un bloque
function devColocarJugador(c, r) {
  const lv = game.lvl, p = lv.player;
  if (!devCasillaValida(lv, c, r)) return;
  const x = c * TILE + (TILE - p.w) / 2, y = (r + 1) * TILE - p.h;
  if (tocaSolido(lv, x, y, p.w, p.h)) return devAviso("NO CABE AQUI");
  p.x = x; p.y = y; p.vx = 0; p.vy = 0; p.onGround = false;
  p.dead = false; p.trepando = false; p.plat = null;
  lv.cam.centrar(p, lv);
  devAviso("JUGADOR AQUI");
}
function devAlternarInmortal() {
  devInmortal = !devInmortal;
  devAviso(devInmortal ? "INMORTAL ACTIVO" : "INMORTAL APAGADO");
}
function devAlternarColocar() {
  devColocar = !devColocar;
  devAviso(devColocar ? "COLOCAR: TOCA UNA CASILLA" : "COLOCAR APAGADO");
}
// Abre o cierra el editor: con F2, con el botón EDITOR de la barra táctil o con CERRAR en la paleta. Con el editor
// abierto, la paleta ocupa la pantalla y se ocultan los botones de juego y la zona de toque (clase dev-editor)
function devSetEditor(abrir) {
  devEditor = abrir;
  devPulsa = null; devFormaEd = false; devPintando = null;
  document.documentElement.classList.toggle("dev-editor", abrir);
  devAviso(abrir ? "EDITOR ACTIVO" : "EDITOR OCULTO");
}
function devAviso(texto) { devAvisoTxt = texto; devAvisoHasta = performance.now() + 1500; }
function devEditorActivo() { return devActivo && devEditor && game.estado === "nivel" && !!game.lvl && !hojaAbierta; }

// Coordenadas de un evento dentro de la pantalla lógica
function devCoordenadas(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
// Casilla bajo un punto de la pantalla (con la cámara y el desplazamiento vertical del área de juego)
function devCasilla(p) {
  const cam = game.lvl.cam;
  return { c: Math.floor((p.x + cam.x) / TILE), r: Math.floor((p.y - OY + cam.y) / TILE) };
}
function devEnPanel(p) { return p.y >= H - DEV_PANEL - 10; }

addEventListener("pointerdown", (e) => {
  if (!devEditorActivo()) return;
  const p = devCoordenadas(e);
  if (devEnPanel(p)) return devClicPanel(p.x, p.y);
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (devFormaEd) return devPintarForma(p, true);
  const t = devCasilla(p);
  devMira = t;
  devPulsa = { c: t.c, r: t.r, t0: performance.now(), hecho: false, mueve: false, hit: devEntidadEn(game.lvl, t.c, t.r) };
});
addEventListener("pointermove", (e) => {
  if (!devEditorActivo()) { devMira = null; return; }
  const p = devCoordenadas(e);
  if (devEnPanel(p)) { devMira = null; return; }
  if (devFormaEd) { devMira = null; devPintarForma(p, false); return; }
  const t = devCasilla(p);
  devMira = t;
  if (devPulsa && (t.c !== devPulsa.c || t.r !== devPulsa.r)) devPulsa.mueve = true;   // arrastrar no pone ni quita
});
function devSoltar() {
  const p = devPulsa;
  devPulsa = null;
  devPintando = null;
  if (p && !p.hecho && !p.mueve && devEditorActivo()) {
    if (devColocar) devColocarJugador(p.c, p.r);
    else (devCuadro ? devPonerArea : devPoner)(p.c, p.r);
  }
}
addEventListener("pointerup", (e) => {
  if (e.pointerType !== "mouse") devMira = null;   // en el móvil no hay puntero que siga al dedo: no queda la vista previa
  devSoltar();
});
addEventListener("pointercancel", () => { devPulsa = null; devPintando = null; });

// La pulsación larga quita al cumplir el tiempo (sin esperar a soltar)
function devActualizar() {
  if (!devEditorActivo() || !devPulsa || devPulsa.hecho || devPulsa.mueve || devColocar) return;
  if (performance.now() - devPulsa.t0 < DEV_LARGA_MS) return;
  devPulsa.hecho = true;
  if (devCuadro) return devBorrarArea(devPulsa.c, devPulsa.r);
  devQuitar(game.lvl, devPulsa.c, devPulsa.r, devPulsa.hit);
}

function devCiclarEnemigo(d) {
  const n = DEV_ENEMIGOS.length;
  devEnem = (devEnem + d + n) % n;
  devSel = { tipo: "enemigo", i: 0 };
  devAviso("ENEMIGO " + DEV_ENEMIGOS[devEnem].replace(/_/g, " ").toUpperCase());
}
// Clic en la paleta: fila de bloques (un segundo clic en ? u oculto cambia su premio), fila de objetos y enemigos, colores
function devClicPanel(x, y) {
  if (devFormaEd) return devClicPanelForma(x, y);
  const y0 = H - DEV_PANEL, i = Math.floor((x - 2) / 16);
  if (x < 2) return;
  if (y >= y0 + 2 && y < y0 + 18) {
    if (devTab === "decor") { if (i < DEV_DECOR.length) devSel = { tipo: "decor", i }; return; }
    if (i >= DEV_BLOQUES.length) return;
    const b = DEV_BLOQUES[i], repetido = devSel.tipo === "bloque" && devSel.i === i;
    devSel = { tipo: "bloque", i };
    if (repetido && b.item) { if (b.ch === "Q") devItemQ = (devItemQ + 1) % DEV_ITEMS_Q.length; else devItemZ = (devItemZ + 1) % DEV_ITEMS_Z.length; }
  } else if (y >= y0 + 20 && y < y0 + 36) {
    if (x >= 177 && x < 193) return devCambiarAncho(-1);
    if (x >= 193 && x < 209) return devCambiarAncho(1);
    if (i < 4) devSel = { tipo: "objeto", i };
    else if (i === 4) devCiclarEnemigo(-1);
    else if (i === 6) devCiclarEnemigo(1);
    else devSel = { tipo: "enemigo", i: 0 };
  } else if (y >= y0 + 52 && y < y0 + 68) {
    if (x >= 26 && x < 41) devCambiarAlto("arriba", -1);
    else if (x >= 41 && x < 56) devCambiarAlto("arriba", 1);
    else if (x >= 78 && x < 93) devCambiarAlto("abajo", -1);
    else if (x >= 93 && x < 108) devCambiarAlto("abajo", 1);
    else if (x >= 146 && x < 161) devCiclarFondo(-1);
    else if (x >= 196 && x < 212) devCiclarFondo(1);
  } else if (y >= y0 + 70 && y < y0 + 86) {
    if (x >= 1 && x < 55) { devCuadro = !devCuadro; devAviso(devCuadro ? "CUADRO ACTIVO" : "CUADRO APAGADO"); }
    else if (x >= 57 && x < 73) devCambiarLado(-1);
    else if (x >= 83 && x < 99) devCambiarLado(1);
    else if (x >= 104 && x < 160) devAbrirForma();
    else if (x >= 164 && x < 212) devTab = devTab === "decor" ? "bloques" : "decor";
  } else if (y >= y0 + 88 && y < y0 + 104) {
    if (x >= 2 && x < 66) devAlternarInmortal();
    else if (x >= 70 && x < 130) devAlternarColocar();
    else if (x >= 134 && x < 198) devSetEditor(false);
  } else if (y >= y0 + 38 && y < y0 + 48 && i < DEV_COLORES.length) devColor = i;
}

// Fase anterior o siguiente (RePág y AvPág); en una sala secreta no se cambia
function devIrNivel(d) {
  const g = game;
  if (g.secreta || !["nivel", "pausa", "muerte", "nivelOK"].includes(g.estado)) return;
  let m = g.mundoIdx, n = g.nivelIdx + d;
  if (n < 0) { m--; if (m >= 0) n = MUNDOS[m].niveles.length - 1; }
  else if (n >= MUNDOS[m].niveles.length) { m++; n = 0; }
  if (m < 0 || m >= MUNDOS.length) return;
  devPulsa = null;
  g.empezarNivel(m, n);
}
// Vuelve a montar la fase (o la sala) con sus ediciones: por ejemplo, tras borrarlas
function devRecargarNivel() {
  const g = game, lv = g.lvl;
  if (g.secreta) {
    g.lvl = new Level(SALAS[g.secreta.sala], MUNDOS[3], MUNDOS[g.mundoIdx], lv.clave);
    g.pasarPoder(lv.player, g.lvl.player);
    g.prepararGrandes(g.lvl);
  } else g.empezarNivel(g.mundoIdx, g.nivelIdx, true);
}
function devBorrarNivel() {
  const lv = game.lvl;
  if (!lv || !lv.clave || !confirm("¿Borrar las ediciones de esta fase?")) return;
  delete devEstado.niveles[lv.clave];
  devGuardar();
  devRecargarNivel();
  devAviso("EDICIONES BORRADAS");
}
// Exporta las ediciones (JSON): se descarga y queda también en la consola
function devExportar() {
  const niveles = {};
  for (const k in devEstado.niveles) {
    const ed = devEstado.niveles[k];
    if (Object.keys(ed.tiles).length || Object.keys(ed.colores).length || ed.ents.length || ed.quitados.length || (ed.ops || []).length) niveles[k] = ed;
  }
  const texto = JSON.stringify({ version: 1, niveles }, null, 1);
  console.log(texto);
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([texto], { type: "application/json" }));
    a.download = "superbro-ediciones.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch (e) { /* sin descarga: el JSON queda en la consola */ }
  devAviso("EXPORTADAS " + Object.keys(niveles).length + " FASES");
}

addEventListener("keydown", (e) => {
  if (!devActivo) return;
  const accion = { F2: "editor", F3: "exportar", F4: "borrar", F6: "inmortal", F7: "colocar", PageUp: "anterior", PageDown: "siguiente", BracketLeft: "enemAnt", BracketRight: "enemSig",
    Minus: "menos", NumpadSubtract: "menos", Equal: "mas", NumpadAdd: "mas" }[e.code];
  if (!accion || ((accion === "editor" || accion === "menos" || accion === "mas" || accion === "inmortal" || accion === "colocar") && e.repeat)) return;
  if ((accion === "menos" || accion === "mas") && (e.ctrlKey || e.metaKey || e.altKey)) return;   // Ctrl + y - es el zoom del navegador
  e.preventDefault();
  if (accion === "editor") devSetEditor(!devEditor);
  else if (accion === "exportar") devExportar();
  else if (accion === "inmortal") devAlternarInmortal();
  else if (accion === "colocar") devAlternarColocar();
  else if (accion === "borrar") devBorrarNivel();
  else if (accion === "anterior" || accion === "siguiente") devIrNivel(accion === "siguiente" ? 1 : -1);
  else if (accion === "menos" || accion === "mas") devCambiarAncho(accion === "mas" ? 1 : -1);
  else devCiclarEnemigo(accion === "enemSig" ? 1 : -1);
});

// Móvil: el botón EDITOR de la barra táctil; y mantener pulsado no abre el menú del navegador (quitar es una pulsación larga)
if (devActivo) {
  document.getElementById("btn-editor").addEventListener("click", () => devSetEditor(!devEditor));
  addEventListener("contextmenu", (e) => e.preventDefault());
}

// ---- Dibujo de la paleta y de las ayudas ----
// Sprite de un bloque de la paleta, con el estilo del nivel (null: la arena, que se dibuja aparte)
function devSpriteBloque(b, lv) {
  const pre = PREFIJO_BLOQUE[lv.temaKey] || "";
  switch (b.ch) {
    case "G": return Bloques.sprite(lv.terreno + "|0000");
    case "B": return Bloques.sprite(pre + "=");
    case "Q": case "Z": return Bloques.sprite(pre + "?");
    case "S": return Bloques.sprite("X");
    case "T": return Bloques.sprite("P");
    case "H": return Bloques.sprite("^");
    case "V": return Bloques.sprite("~");
    case "L": return Bloques.sprite("L");
    case "D": return Bloques.sprite("-");
    case "M": return muelleSprite();
    case "U": return Bloques.sprite("x");
    default: return null;
  }
}
function devIconoBloque(b, lv, x, y) {
  if (b.pincel) { txt("PIN", x + 1, y + 5, PAL.y); return; }
  const sp = devSpriteBloque(b, lv);
  ctx.globalAlpha = b.ch === "Z" ? 0.45 : 1;   // el oculto se ve apagado (en el juego no se ve)
  if (sp) drawSprite(sp, x, y);
  else rect(x, y + 2, 16, 12, "#c98a3e");
  ctx.globalAlpha = 1;
  if (b.multi) rect(x + 11, y + 2, 3, 3, PAL.y);
}
// Icono de una pieza: sus casillas reducidas y centradas en la celda de la paleta
function devIconoDecor(pieza, x, y) {
  const cols = pieza.celdas.map((q) => q[0]), filas = pieza.celdas.map((q) => q[1]);
  const x0 = Math.min(...cols), y0 = Math.min(...filas), ancho = Math.max(...cols) - x0 + 1, alto = Math.max(...filas) - y0 + 1;
  const s = Math.min(14 / (ancho * TILE), 14 / (alto * TILE));
  const ox = x + 1 + (14 - ancho * TILE * s) / 2, oy = y + 1 + (14 - alto * TILE * s) / 2;
  ctx.save();
  ctx.beginPath(); ctx.rect(x + 1, y + 1, 14, 14); ctx.clip();
  for (const [dc, dr, ch] of pieza.celdas) {
    ctx.save();
    ctx.translate(ox + (dc - x0) * TILE * s, oy + (dr - y0) * TILE * s);
    ctx.scale(s, s);
    drawSprite(Bloques.sprite(ch), 0, 0);
    ctx.restore();
  }
  ctx.restore();
}
function devIconoObjeto(o, x, y) {
  if (o.obj === "moneda") drawSprite(Bloques.sprite("o0"), x, y);
  else if (o.obj === "estrella") dibujarGrande(x, y, 0);
  else { ctx.save(); ctx.translate(x, y); Bloques.canon(ctx, o.dir); ctx.restore(); }
}
// Un enemigo de muestra por tipo, dibujado con su propio código de enemigos.js y recortado a la celda
const devEnemigosIcono = new Map();
function devIconoEnemigo(tipo, x, y) {
  let en = devEnemigosIcono.get(tipo);
  if (!en) { en = Enemigos.create(TIPO_ENEMIGO[tipo], 0, 0); devEnemigosIcono.set(tipo, en); }
  en.x = x + 8; en.y = y + 9;
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, 16, 16); ctx.clip();
  Enemigos.draw(ctx, en);
  ctx.restore();
}
function devSwatch(c, x, y) {
  if (c.id) { rect(x + 1, y, 14, 10, c.muestra || c.color); return; }
  rect(x + 1, y, 14, 10, "#4a4f66");
  ctx.strokeStyle = "#dfe3f0"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x + 2, y + 9); ctx.lineTo(x + 14, y + 1); ctx.stroke();
}
function devMarco(x, y, w = 16, h = 16) {
  ctx.strokeStyle = PAL.y; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}
function devFlecha(x, y, d) {
  ctx.fillStyle = PAL.w;
  ctx.beginPath();
  if (d < 0) { ctx.moveTo(x + 11, y + 4); ctx.lineTo(x + 5, y + 8); ctx.lineTo(x + 11, y + 12); }
  else { ctx.moveTo(x + 5, y + 4); ctx.lineTo(x + 11, y + 8); ctx.lineTo(x + 5, y + 12); }
  ctx.fill();
}
// Botón pequeño de la paleta: - o +
function devBoton(x, y, signo) {
  rect(x, y, 14, 16, "#2a2d40");
  ctx.strokeStyle = "#8c93b5"; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, 13, 15);
  txt(signo, x + 7, y + 5, PAL.w, "center");
}
// Botón con una flecha: d < 0 a la izquierda, d > 0 a la derecha
function devBotonFlecha(x, y, d) {
  rect(x, y, 14, 16, "#2a2d40");
  ctx.strokeStyle = "#8c93b5"; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, 13, 15);
  devFlecha(x, y, d);
}
// Botón con texto (el de CUADRO), resaltado cuando está activo
function devBotonTexto(x, y, w, texto, activo) {
  rect(x, y, w, 16, "#2a2d40");
  ctx.strokeStyle = activo ? PAL.y : "#8c93b5"; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, 15);
  txt(texto, x + w / 2, y + 5, PAL.w, "center");
}
// Texto de la selección (y del color, si el bloque lo lleva)
function devSelNombre() {
  const s = devSel, col = DEV_COLORES[devColor];
  if (s.tipo === "objeto") return DEV_OBJETOS[s.i].nombre;
  if (s.tipo === "decor") return DEV_DECOR[s.i].nombre;
  if (s.tipo === "enemigo") return "ENEMIGO " + DEV_ENEMIGOS[devEnem].replace(/_/g, " ");
  const b = DEV_BLOQUES[s.i];
  const n = b.pincel ? "PINCEL" : b.item ? (b.ch === "Q" ? "? " + DEV_ITEMS_Q[devItemQ] : "OCULTO " + DEV_ITEMS_Z[devItemZ]) : b.nombre;
  return col.id ? n + " " + col.nombre : n;
}

// Contorno de puntos de los bloques ocultos, la casilla bajo el puntero, el progreso de la pulsación larga y la paleta
function devDibujar() {
  const lv = game.lvl;
  if (game.estado === "titulo" || game.estado === "selMundo") { txt("MODO DESARROLLADOR: F2 EN UNA FASE", W / 2, H - 10, PAL.y, "center"); return; }
  if (game.estado !== "nivel" || !lv) return;
  const texto = (devInmortal ? "INMORTAL  " : "") + "F2 EDITOR";
  if (!devEditor) { txt(texto, W - 4 - texto.length * 4, H - 8, PAL.gr); return; }
  const cam = lv.cam, ahora = performance.now();
  ctx.save();
  ctx.translate(0, OY);
  const c0 = Math.max(0, Math.floor(cam.x / TILE)), c1 = Math.min(lv.cols - 1, Math.floor((cam.x + W) / TILE) + 1);
  const f0 = Math.max(0, Math.floor((cam.y - OY) / TILE) - 1), f1 = Math.min(lv.rows - 1, Math.floor((cam.y - OY + H) / TILE) + 1);
  ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 1; ctx.setLineDash([2, 2]);
  for (let r = f0; r <= f1; r++) for (let c = c0; c <= c1; c++) {
    if (lv.tiles[r][c] === "Z") ctx.strokeRect(c * TILE - cam.x + 0.5, r * TILE - cam.y + 0.5, TILE - 1, TILE - 1);
  }
  ctx.setLineDash([]);
  if (devMira && devSel.tipo === "decor" && !devCuadro) {   // la pieza, medio transparente, bajo el puntero
    ctx.globalAlpha = 0.5;
    for (const [dc, dr, ch] of DEV_DECOR[devSel.i].celdas) drawSprite(Bloques.sprite(ch), (devMira.c + dc) * TILE - cam.x, (devMira.r + dr) * TILE - cam.y);
    ctx.globalAlpha = 1;
  }
  if (devMira && devSel.tipo === "bloque" && !DEV_BLOQUES[devSel.i].pincel) {
    const sp = devSpriteBloque(DEV_BLOQUES[devSel.i], lv);
    if (sp) { ctx.globalAlpha = 0.5; drawSprite(tintado(sp, DEV_COLORES[devColor].id), devMira.c * TILE - cam.x, devMira.r * TILE - cam.y); ctx.globalAlpha = 1; }
  }
  if (devMira) {
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1;
    ctx.strokeRect(devMira.c * TILE - cam.x + 0.5, devMira.r * TILE - cam.y + 0.5, TILE - 1, TILE - 1);
  }
  if (devPulsa && !devPulsa.hecho && !devPulsa.mueve) {
    const f = Math.min(1, (ahora - devPulsa.t0) / DEV_LARGA_MS);
    const x = devPulsa.c * TILE - cam.x, y = devPulsa.r * TILE - cam.y;
    rect(x, y, TILE, TILE, "rgba(255,70,70," + (0.1 + 0.35 * f).toFixed(2) + ")");
    rect(x, y + TILE - 2, Math.round(TILE * f), 2, "#ff4a4a");
  }
  if (devCuadro && devMira) {   // la forma, en amarillo, centrada en el puntero
    const f = devForma(), h = Math.floor(f.n / 2);
    ctx.strokeStyle = PAL.y; ctx.lineWidth = 1;
    for (let dr = 0; dr < f.n; dr++) {
      for (let dc = 0; dc < f.n; dc++) {
        if (f.filas[dr][dc] !== "#") continue;
        const x = (devMira.c - h + dc) * TILE - cam.x, y = (devMira.r - h + dr) * TILE - cam.y;
        rect(x, y, TILE, TILE, "rgba(255,210,70,0.16)");
        ctx.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
      }
    }
  }
  ctx.restore();
  if (devFormaEd) devDibujarForma();

  // Paleta: una línea de aviso o de selección encima, y cuatro filas abajo
  const y0 = H - DEV_PANEL, aviso = devAvisoHasta > ahora;
  rect(0, y0 - 10, W, 10, "rgba(0,0,0,0.85)");
  txt(aviso ? devAvisoTxt : devFormaEd ? "EDITANDO LA FORMA" : (devCuadro ? "CUADRO " + devLado + "   " : "") + devSelNombre() + "   CORTO PONER  LARGO QUITAR", 3, y0 - 8, aviso ? PAL.y : PAL.w);
  rect(0, y0, W, DEV_PANEL, "rgba(0,0,0,0.85)");
  if (devFormaEd) return devDibujarPanelForma(y0);
  if (devTab === "decor") DEV_DECOR.forEach((p, i) => {
    const x = 2 + i * 16, y = y0 + 2;
    devIconoDecor(p, x, y);
    if (devSel.tipo === "decor" && devSel.i === i) devMarco(x, y);
  });
  else DEV_BLOQUES.forEach((b, i) => {
    const x = 2 + i * 16, y = y0 + 2;
    devIconoBloque(b, lv, x, y);
    if (devSel.tipo === "bloque" && devSel.i === i) devMarco(x, y);
  });
  const yB = y0 + 20;
  DEV_OBJETOS.forEach((o, i) => {
    devIconoObjeto(o, 2 + i * 16, yB);
    if (devSel.tipo === "objeto" && devSel.i === i) devMarco(2 + i * 16, yB);
  });
  devFlecha(2 + 4 * 16, yB, -1);
  devIconoEnemigo(DEV_ENEMIGOS[devEnem], 2 + 5 * 16, yB);
  if (devSel.tipo === "enemigo") devMarco(2 + 5 * 16, yB);
  devFlecha(2 + 6 * 16, yB, 1);
  txt(DEV_ENEMIGOS[devEnem].replace(/_/g, " "), 118, yB + 5, PAL.w);
  devBoton(178, yB, "-");
  devBoton(194, yB, "+");
  txt("ANCHO " + lv.cols, 212, yB + 5, PAL.w);
  DEV_COLORES.forEach((c, i) => {
    const x = 2 + i * 16, y = y0 + 38;
    devSwatch(c, x, y);
    if (devColor === i) devMarco(x, y, 16, 12);
  });
  txt(DEV_COLORES[devColor].nombre, 198, y0 + 40, PAL.w);
  // Fila D: alto de la fase (arriba y abajo, de 14 en 14 filas), el cuadro y su lado
  const yD = y0 + 52;
  txt("ARRIBA", 2, yD + 5, PAL.w);
  devBoton(27, yD, "-");
  devBoton(42, yD, "+");
  txt("ABAJO", 58, yD + 5, PAL.w);
  devBoton(79, yD, "-");
  devBoton(94, yD, "+");
  txt("ALTO " + lv.rows, 116, yD + 5, PAL.w);
  // Fondo de la fase: ◀ nombre ▶ (se guarda con la fase)
  devBotonFlecha(147, yD, -1);
  txt((lv.ed && lv.ed.fondo ? lv.ed.fondo : "DEFECTO").toUpperCase(), 180, yD + 5, PAL.y, "center");
  devBotonFlecha(196, yD, 1);
  // Fila E: el cuadro y su lado
  const yE = y0 + 70;
  devBotonTexto(2, yE, 52, "CUADRO", devCuadro);
  devBoton(58, yE, "-");
  txt(String(devLado), 76, yE + 5, PAL.w, "center");
  devBoton(84, yE, "+");
  devBotonTexto(104, yE, 56, "DIBUJAR", false);
  devBotonTexto(164, yE, 48, "DECOR", devTab === "decor");
  // Fila F: el modo inmortal y colocar al jugador (para probar; no se guardan)
  const yF = y0 + 88;
  devBotonTexto(2, yF, 64, "INMORTAL", devInmortal);
  devBotonTexto(70, yF, 60, "JUGADOR", devColocar);
  devBotonTexto(134, yF, 64, "CERRAR", false);
}

const game = new Game();
KEYMAP.Backspace = "reset";  // para borrar el progreso desde el título

function actualizarJuego(dt) {
  const e = game.estado;
  actualizarParticulas(dt);
  // ITEM pulsado fuera del nivel o de la selección de mundo no se guarda para después
  if (e !== "nivel" && e !== "selMundo") consume("item");

  if (e === "titulo") {
    if (consume("enter")) { game.selMundo = game.mundoIdx; game.estado = "selMundo"; }
    if (consume("reset")) game.borrarProgreso();
    return;
  }
  if (e === "selMundo") {
    const d = dirPulsada();
    if (d) {
      const nuevo = game.selMundo + d.x + d.y * COLUMNAS_MUNDO;
      // Las flechas laterales no saltan de una fila a la siguiente
      const misma = Math.floor(nuevo / COLUMNAS_MUNDO) === Math.floor(game.selMundo / COLUMNAS_MUNDO);
      if (nuevo >= 0 && nuevo < MUNDOS.length && (d.x === 0 || misma)) game.selMundo = nuevo;
    }
    if (consume("item")) game.pruebaTodo = !game.pruebaTodo;   // ITEM (Q): modo prueba
    if (consume("enter") && game.mundoDesbloqueado(game.selMundo)) {
      game.mundoIdx = game.selMundo;
      game.volverAlMapa();
    }
    if (consume("pause")) game.estado = "titulo";
    return;
  }
  if (e === "overworld") return game.ov.update(dt);
  if (e === "minijuego") {
    if (game.mini.update(dt)) game.terminarMinijuego(game.mini.premios, game.mini.clave);
    return;
  }
  if (e === "final") {
    if (consume("enter")) game.estado = "titulo";
    return;
  }
  if (e === "nivel") {
    if (consume("pause")) { game.estado = "pausa"; return; }
    return game.actualizarEstado(dt);
  }
  if (e === "pausa") {
    if (consume("pause")) game.estado = "nivel";
    return;
  }
  game.actualizarEstado(dt);
}

let ultimo = performance.now();
function bucle(t) {
  // Delta time limitado: evita saltos grandes si la pestaña se bloquea
  const dt = Math.min(1 / 30, (t - ultimo) / 1000);
  ultimo = t;
  try {
    leerMando();                             // el mando se lee en cada frame
    musicaSegunEstado();                     // la música sigue al estado del juego
    if (devActivo) devActualizar();          // modo desarrollador: la pulsación larga quita al cumplir el tiempo
    if (!hojaAbierta) actualizarJuego(dt);   // con la hoja de ajustes abierta el juego se detiene
    ctx.setTransform(U, 0, 0, U, 0, 0);   // dibujo en coordenadas lógicas
    dibujarJuego(game);
    if (devActivo) devDibujar();             // paleta y avisos del modo desarrollador, encima de todo
  } catch (err) {
    console.error(err);
  }
  // Limpia los estados de "pulsado" que no se consumieron este frame
  for (const k in pressed) pressed[k] = false;
  requestAnimationFrame(bucle);
}
requestAnimationFrame(bucle);
</script>
