        if (c < 0 || c >= cols) return true;
        if (r >= rows) return true;
        if (r < 0) return false;
        return esSolido(get(c, r));
      },

      get: get,

      // Avanza el tiempo: mueve las plataformas y guarda cuánto se movió cada una en este cuadro.
      // Llamar una vez por cuadro, antes de resolver.
      actualizar: function (dt, caja) {
        reloj += dt;
        plataformas.forEach(function (p) {
          if (p.cae) { actualizarCaida(p, dt, caja); return; }
          p.s += p.dir * p.vel * dt;
          if (p.s >= p.L) { p.s = 2 * p.L - p.s; p.dir = -1; }
          if (p.s <= 0) { p.s = -p.s; p.dir = 1; }
          p.s = Math.max(0, Math.min(p.L, p.s));
          const pos = posicionEn(p, p.s);
          p.dx = pos.x - p.x; p.dy = pos.y - p.y;
          p.x = pos.x; p.y = pos.y;
        });
        // Cañones: disparan cada cierto tiempo; las balas vuelan en línea recta hasta chocar con un bloque
        canones.forEach(function (c) {
          c.t += dt;
          if (c.t >= c.cada) {
            c.t -= c.cada;
            balas.push({ x: c.dir > 0 ? (c.col + 1) * TILE : c.col * TILE - 8, y: c.row * TILE + 5,
                         w: 8, h: 6, vx: c.dir * c.velocidad, vida: 7, muerta: false });
          }
        });
        balas.forEach(function (b) {
          b.x += b.vx * dt; b.vida -= dt;
          const frente = b.vx > 0 ? b.x + b.w : b.x;
          const c = Math.floor(frente / TILE), r = Math.floor((b.y + b.h / 2) / TILE);
          if (b.vida <= 0 || esSolido(get(c, r)) || b.x < -32 || b.x > anchoMundo + 32) b.muerta = true;
        });
        balas = balas.filter(function (b) { return !b.muerta; });
      },

      // ¿Una bala toca la caja? La bala desaparece. Devuelve true si hubo impacto.
      golpeBala: function (caja) {
        let tocada = false;
        balas.forEach(function (b) {
          if (!b.muerta && solapa(caja, b)) { b.muerta = true; tocada = true; }
        });
        balas = balas.filter(function (b) { return !b.muerta; });
        return tocada;
      },

      balasVivas: function () { return balas; },

      golpear: function (c, r) {
        const ch = get(c, r);
        if (ch === '?') { set(c, r, 'x'); return 'moneda'; }
        if (ch === '=') { set(c, r, ' '); return 'rompe'; }
        return null;
      },

      // Mueve la caja {x, y, w, h} con velocidad (vx, vy) durante dt y la para con los bloques
      resolver: function (caja, vx, vy, dt) {
        let x = caja.x, y = caja.y;
        const w = caja.w, h = caja.h;
        const out = { x: x, y: y, vx: vx, vy: vy, enSuelo: false, golpeTecho: null, plataforma: null, muelle: null };

        // Si la caja está de pie sobre una plataforma móvil, se mueve con ella
        const sobre = vy >= 0 ? plataformaBajo(caja) : null;
        if (sobre) { x += sobre.dx; y += sobre.dy; out.plataforma = sobre; }

        // Eje X
        if (vx !== 0) {
          const nx = x + vx * dt;
          const r0 = Math.floor(y / TILE), r1 = Math.floor((y + h - EPS) / TILE);
          let bloqueado = false;
          if (vx > 0) {
            let mejor = null;
            for (let c = Math.floor(x / TILE); c <= Math.floor((nx + w - EPS) / TILE); c++) {
              if (c * TILE < x + w - EPS) continue;
              for (let r = r0; r <= r1; r++) if (esSolido(get(c, r))) { if (mejor === null || c < mejor) mejor = c; }
            }
            if (mejor !== null && nx + w > mejor * TILE) { x = mejor * TILE - w; bloqueado = true; }
            else x = nx;
          } else {
            let mejor = null;
            for (let c = Math.floor(nx / TILE); c <= Math.floor((x + EPS) / TILE); c++) {
              if ((c + 1) * TILE > x + EPS) continue;
              for (let r = r0; r <= r1; r++) if (esSolido(get(c, r))) { if (mejor === null || c > mejor) mejor = c; }
            }
            if (mejor !== null && nx < (mejor + 1) * TILE) { x = (mejor + 1) * TILE; bloqueado = true; }
            else x = nx;
          }
          if (bloqueado) out.vx = 0;
        }

        // Eje Y
        const c0 = Math.floor(x / TILE), c1 = Math.floor((x + w - EPS) / TILE);
        if (vy >= 0) {
          const bottomAntes = y + h;
          const ny = y + vy * dt;
          let aterriza = null;
          for (let r = Math.floor(bottomAntes / TILE) - 1; r <= Math.floor((ny + h) / TILE) + 1; r++) {
            if (r < 0 || r * TILE < bottomAntes - EPS || r * TILE > ny + h + EPS) continue;
            for (let c = c0; c <= c1; c++) {
              const ch = get(c, r);
              if ((esSolido(ch) || ch === UNIDIRECCIONAL) && (aterriza === null || r < aterriza)) aterriza = r;
            }
          }
          const topeTile = aterriza !== null ? aterriza * TILE : Infinity;
          const pl = plataformaQueCae(x, w, h, bottomAntes, ny, topeTile);
          if (pl) {
            y = pl.y - h;
            out.vy = 0;
            out.enSuelo = true;
            out.plataforma = pl;
          } else if (aterriza !== null) {
            y = aterriza * TILE - h;
            out.vy = 0;
            out.enSuelo = true;
            const m = muelleEn(c0, c1, aterriza);
            if (m) {
              // El muelle devuelve al jugador hacia arriba
              out.vy = -MUELLE_FUERZA;
              out.enSuelo = false;
              out.muelle = m;
              muellesActivos[m.col + ',' + m.row] = reloj;
            }
          } else {
            y = ny;
          }
        } else {
          const ny = y + vy * dt;
          let techo = null, celdaTecho = null;
          for (let r = Math.floor(ny / TILE); r <= Math.floor(y / TILE); r++) {
            const borde = (r + 1) * TILE;
            if (borde > y + EPS || borde < ny - EPS) continue;
            for (let c = c0; c <= c1; c++) {
              if (esSolido(get(c, r))) { if (techo === null || r > techo) { techo = r; celdaTecho = c; } }
            }
          }
          if (techo !== null) {
            y = (techo + 1) * TILE;
            out.vy = 0;
            out.golpeTecho = { col: celdaTecho, row: techo };
          } else {
            y = ny;
          }
        }

        if (out.plataforma) out.plataforma.pisadaEn = reloj;
        out.x = x;
        out.y = y;
        return out;
      },

      recoger: function (caja) {
        let n = 0;
        celdasDe(caja, function (ch, c, r) {
          if (ch === COLECCION) { set(c, r, ' '); n++; }
          return null;
        });
        return n;
      },

      peligroEn: function (caja) {
        return !!celdasDe(caja, function (ch) { return PELIGRO.indexOf(ch) !== -1; });
      },

      enEscalera: function (caja) {
        return celdasDe(caja, function (ch) {
          if (ch === ESCALERA) return ESCALERA;
          if (ch === BARRA) return BARRA;
          return null;
        });
      },

      metaEn: function (caja) {
        return !!celdasDe(caja, function (ch) { return ch === META; });
      },

      // camX, camY: esquina superior izquierda de la vista (en píxeles lógicos)
      // El contexto debe tener escala U (o U × zoom)
      dibujar: function (ctx, camX, camY, vistaW, vistaH, tiempo) {
        const c0 = Math.max(0, Math.floor(camX / TILE)), c1 = Math.min(cols - 1, Math.floor((camX + vistaW) / TILE));
        const r0 = Math.max(0, Math.floor(camY / TILE)), r1 = Math.min(rows - 1, Math.floor((camY + vistaH) / TILE));
        // Decoración: va detrás de los bloques; las animadas usan el cuadro del momento
        const cuadro = Math.floor((tiempo || 0) * 8);
        for (let r = r0; r <= r1; r++) {
          for (let c = c0; c <= c1; c++) {
            const d = capaDeco[r][c];
            if (d === ' ') continue;
            const clave = ANIMADO[d] ? d + ':' + (cuadro % ANIMADO[d]) : d;
            ctx.drawImage(spriteDe(clave), c * TILE - camX, r * TILE - camY, TILE, TILE);
          }
        }
        // Efectos de agua sobre las pozas visibles (gotas, salpicaduras y aros en la superficie)
        for (let r = r0; r <= r1; r++) {
          for (let c = c0; c <= c1; c++) {
            if (capaDeco[r][c] !== 'l') continue;
            if (r > 0 && capaDeco[r - 1][c] === 'l') continue;   // solo la superficie de la poza
            ctx.save();
            ctx.translate(-camX, -camY);
            efectosAgua(ctx, c * TILE + TILE / 2, r * TILE + 5, TILE - 2, tiempo, c * 7 + r);
            ctx.restore();
          }
        }
        const frame = Math.floor((tiempo || 0) * 8) % FRAMES_MONEDA;
        for (let r = r0; r <= r1; r++) {
          for (let c = c0; c <= c1; c++) {
            const ch = get(c, r);
            if (ch === ' ') continue;
            let clave = ch;
            if (TERRENOS.indexOf(ch) !== -1) {
              const f = [
                alAire(c, r - 1) ? '1' : '0',
                alAire(c - 1, r) ? '1' : '0',
                alAire(c + 1, r) ? '1' : '0',
                alAire(c, r + 1) ? '1' : '0'
              ].join('');
              clave = ch + '|' + f;
            } else if (ch === COLECCION) {
              clave = COLECCION + frame;
            } else if (ch === MUELLE) {
              const t = muellesActivos[c + ',' + r];
              if (t !== undefined && reloj - t < MUELLE_TIEMPO) clave = 'M+';
            }
            ctx.drawImage(spriteDe(clave), c * TILE - camX, r * TILE - camY, TILE, TILE);
          }
        }
        // Plataformas móviles: se dibujan con las piezas de plataforma de un bloque
        plataformas.forEach(function (p) {
          if (p.estado === 'oculta') return;
          if (p.x + p.w < camX || p.x > camX + vistaW || p.y + TILE < camY || p.y > camY + vistaH) return;
          const sx = p.sacudida || 0;
          for (let i = 0; i < p.w / TILE; i++) {
            ctx.drawImage(spriteDe('-'), p.x + sx + i * TILE - camX, p.y - camY, TILE, TILE);
          }
        });
        // Cañones y balas
        canones.forEach(function (c) {
          const x = c.col * TILE - camX, y = c.row * TILE - camY;
          if (x < -TILE || x > vistaW || y < -TILE || y > vistaH) return;
          ctx.save(); ctx.translate(x, y); dibujarCanon(ctx, c.dir); ctx.restore();
        });
        balas.forEach(function (b) {
          if (b.x + b.w < camX || b.x > camX + vistaW) return;
          ctx.save(); ctx.translate(b.x - camX, b.y - camY); dibujarBala(ctx, b.vx > 0); ctx.restore();
        });

/* =====================================================================
   7c. ARTE CON VOLUMEN Y DETALLE: enemigos, objetos, monedas y bloques
   Se pinta a resolución real (U píxeles por píxel lógico). Las formas
   redondas son esferas o cilindros sombreados por la luz (arriba a la
   izquierda) con cinco tonos por color; los detalles (ojos con brillo,
   dientes, placas, barbas de pluma) se pintan píxel a píxel.
   ===================================================================== */

// Familias de tonos: cada color tiene 5 letras (h luz fuerte ... D sombra profunda).
// Las letras de cada familia son distintas, así un mismo sprite puede mezclar colores.
const RK = {
  cafe:    { h: "h", l: "l", m: "m", d: "d", D: "D" },
  crema:   { h: "A", l: "B", m: "C", d: "E", D: "F" },
  rojo:    { h: "q", l: "r", m: "s", d: "t", D: "u" },
  verde:   { h: "n", l: "p", m: "x", d: "z", D: "o" },
  oro:     { h: "Q", l: "R", m: "S", d: "T", D: "U" },
  blanco:  { h: "V", l: "W", m: "X", d: "Y", D: "Z" },
  naranja: { h: "1", l: "2", m: "3", d: "4", D: "5" },
  overol:  { h: "b", l: "c", m: "g", d: "e", D: "f" },
};

// Colores de cada familia a partir de un color base
function coloresRK(rk, hex) {
  return {
    [rk.h]: mezclar(hex, 0.5, "#ffffff"),
    [rk.l]: mezclar(hex, 0.25, "#ffffff"),
    [rk.m]: hex,
    [rk.d]: mezclar(hex, 0.3),
    [rk.D]: mezclar(hex, 0.6),
  };
}

// Tono según la luz: dot > 0.72 es luz fuerte, dot < -0.4 es sombra profunda
function tonoDe(rk, luz) {
  return luz > 0.72 ? rk.h : luz > 0.42 ? rk.l : luz > 0.0 ? rk.m : luz > -0.4 ? rk.d : rk.D;
}

/* Rejilla donde se pinta el dibujo. Las medidas son LÓGICAS (w, h), pero la
   rejilla guarda U× más píxeles reales: las formas redondas se muestrean fino
   y cada píxel lógico ocupa U×U píxeles reales. */
class Lienzo {
  constructor(w, h) {
    this.w = w;
    this.h = h;
    this.fw = w * U;
    this.fh = h * U;
    this.c = [];
    for (let y = 0; y < this.fh; y++) this.c.push(new Array(this.fw).fill("."));
  }
  // Píxel lógico entero (ocupa U×U píxeles reales)
  px(x, y, ch) {
    for (let j = 0; j < U; j++) for (let i = 0; i < U; i++) this.pf(x * U + i, y * U + j, ch);
  }
  // Píxel real (para detalles finos)
  pf(xf, yf, ch) {
    if (xf >= 0 && yf >= 0 && xf < this.fw && yf < this.fh) this.c[yf][xf] = ch;
  }
  // Píxel real indicado en coordenadas lógicas (decimales)
  pfl(lx, ly, ch) { this.pf(Math.floor(lx * U), Math.floor(ly * U), ch); }
  caja(x, y, w, h, ch) {
    // Coordenadas lógicas redondeadas a píxeles reales
    const x0 = Math.round(x * U), y0 = Math.round(y * U);
    for (let j = 0; j < Math.max(1, Math.round(h * U)); j++) for (let i = 0; i < Math.round(w * U); i++) this.pf(x0 + i, y0 + j, ch);
  }
  // Recorre los píxeles reales hasta "corte" (en lógico) y llama fn(fx, fy, lx, ly)
  recorrer(corte, fn) {
    for (let fy = 0; fy < this.fh; fy++) {
      const ly = (fy + 0.5) / U;
      if (ly > corte + 0.5) break;
      for (let fx = 0; fx < this.fw; fx++) fn(fx, fy, (fx + 0.5) / U, ly);
    }
  }
  // Elipse de un solo color (ojos, boca, manchas)
  elipse(cx, cy, rx, ry, ch, corte = 1e9) {
    this.recorrer(corte, (fx, fy, lx, ly) => {
      const nx = (lx - cx) / rx, ny = (ly - cy) / ry;
      if (nx * nx + ny * ny <= 1) this.c[fy][fx] = ch;
    });
  }
  // Esfera sombreada: la normal de cada píxel decide su tono
  esfera(cx, cy, rx, ry, rk, corte = 1e9) {
    this.recorrer(corte, (fx, fy, lx, ly) => {
      const nx = (lx - cx) / rx, ny = (ly - cy) / ry;
      const d2 = nx * nx + ny * ny;
      if (d2 > 1) return;
      const nz = Math.sqrt(1 - d2);
      this.c[fy][fx] = tonoDe(rk, -0.45 * nx - 0.6 * ny + 0.66 * nz);
    });
  }
  // Cilindro vertical (tallos, tubos, monedas de canto): sombrea en horizontal
  cilindro(x0, w, y0, h, rk) {
    for (let fy = y0 * U; fy < (y0 + h) * U; fy++) for (let fx = x0 * U; fx < (x0 + w) * U; fx++) {
      const t = ((fx + 0.5) / U - (x0 + w / 2)) / (w / 2);
      const nz = Math.sqrt(Math.max(0, 1 - t * t));
      this.pf(fx, fy, tonoDe(rk, -0.45 * t + 0.66 * nz));
    }
  }
  // Recorre los píxeles ya pintados (no vacíos) y aplica fn(fx, fy, ch)
  mapear(fn) {
    for (let fy = 0; fy < this.fh; fy++) for (let fx = 0; fx < this.fw; fx++) {
      const ch = this.c[fy][fx];
      if (ch !== ".") fn(fx, fy, ch);
    }
  }
  // Borde oscuro: los píxeles pintados que tocan vacío pasan a sombra profunda
  bordeOscuro(rk) {
    const pinta = (fx, fy) => fx >= 0 && fy >= 0 && fx < this.fw && fy < this.fh && this.c[fy][fx] !== ".";
    const marca = [];
    this.mapear((fx, fy) => {
      if (!pinta(fx - 1, fy) || !pinta(fx + 1, fy) || !pinta(fx, fy - 1) || !pinta(fx, fy + 1)) marca.push([fx, fy]);
    });
    for (const [fx, fy] of marca) this.c[fy][fx] = rk.D;
  }
  filas() { return this.c.map((r) => r.join("")); }
}

// Paleta de los enemigos y objetos (todos los tonos juntos)
const PAL_ENT = Object.assign(
  { k: "#000000", w: "#ffffff" },
  coloresRK(RK.cafe, "#9b5a2a"),
  coloresRK(RK.crema, "#f6dcae"),
  coloresRK(RK.rojo, "#e0392b"),
  coloresRK(RK.verde, "#3fbf3f"),
  coloresRK(RK.oro, "#ffd23f"),
  coloresRK(RK.blanco, "#f2f2f2"),
  coloresRK(RK.naranja, "#ff8a1e"),
);


/* ---------- Monedas y objetos ---------- */

// Hongo: sombrero rojo con manchas en relieve, tallo crema con ojos
function setaFilas() {
  const L = new Lienzo(16, 16);
  L.esfera(8, 6.8, 7.2, 6.4, RK.rojo, 9.4);
  L.bordeOscuro(RK.rojo);
  for (const [x, y, r] of [[5, 4.4, 1.7], [11, 4.2, 1.6], [8, 1.8, 1.0]]) L.esfera(x, y, r, r, RK.blanco);
  L.esfera(8, 12.2, 3.6, 3.2, RK.crema, 15);
  L.bordeOscuro(RK.crema);
  L.elipse(6.2, 12, 0.8, 0.9, "k");
  L.elipse(9.8, 12, 0.8, 0.9, "k");
  L.pfl(6.1, 11.7, "w");
  return L.filas();
}

// Flor de fuego: pétalos con volumen, centro dorado, tallo y hojas con vena
function florFilas() {
  const L = new Lienzo(16, 16);
  for (let a = 0; a < 5; a++) {
    const ang = -Math.PI / 2 + (a * 2 * Math.PI) / 5;
    L.esfera(8 + Math.cos(ang) * 4.2, 6 + Math.sin(ang) * 4.2, 2.6, 2.6, RK.naranja, 12);
  }
  L.esfera(8, 6, 2.8, 2.8, RK.oro, 9);
  L.cilindro(7, 2, 11, 5, RK.verde);
  for (const [x, y] of [[4.5, 13], [11.5, 12.6]]) {
    L.esfera(x, y, 2.6, 1.6, RK.verde);
    L.recorrer(16, (fx, fy, lx, ly) => {
      if (L.c[fy][fx] !== "." && Math.abs(ly - y) < 0.12) L.c[fy][fx] = RK.verde.D;
    });
  }
  return L.filas();
}

// Pluma: hoja blanca inclinada con nervio central y barbas
function plumaFilas() {
  const L = new Lienzo(12, 14);
  const a = (-35 * Math.PI) / 180, ca = Math.cos(a), sa = Math.sin(a);
  L.recorrer(14, (fx, fy, lx, ly) => {
    const dx = lx - 6, dy = ly - 7;
    const u = dx * ca + dy * sa;      // eje largo
    const v = -dx * sa + dy * ca;     // eje corto
    if ((u / 3.6) ** 2 + (v / 6.2) ** 2 > 1) return;
    let ch = v < -1.8 ? RK.blanco.h : v < 1.2 ? RK.blanco.m : RK.blanco.d;
    if (Math.abs(v) < 0.25) ch = RK.blanco.D;                                       // nervio
    else if (Math.floor(u * 4) % 3 === 0) ch = RK.blanco.l;                         // barbas
    L.c[fy][fx] = ch;
  });
  return L.filas();
}

// Estrella de cinco puntas en oro, con contorno y brillo
function estrellaFilas() {
  const L = new Lienzo(14, 14);
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 2.8 : 6.6;
    const ang = -Math.PI / 2 + (i * Math.PI) / 5;
    pts.push([7 + r * Math.cos(ang), 7.2 + r * Math.sin(ang)]);
  }
  L.recorrer(14, (fx, fy, px, py) => {
    let dentro = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if ((yi > py) !== (yj > py) && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) dentro = !dentro;
    }
    if (dentro) L.c[fy][fx] = py < 6 ? RK.oro.h : py < 9 ? RK.oro.l : RK.oro.m;
  });
  L.bordeOscuro(RK.oro);
  L.pfl(3.2, 4.4, "w");
  return L.filas();
}

/* ---------- Caché y acceso ---------- */
const spritesArte = new Map();
function arte(key, filas, pal = PAL_ENT) {
  if (!spritesArte.has(key)) spritesArte.set(key, spriteFromRows(filas, pal, true, false, false));
  return spritesArte.get(key);
}

function objetoSprite(tipo) {
  if (tipo === "hongo") return arte("hongo", setaFilas());
  if (tipo === "flor") return arte("flor", florFilas());
  if (tipo === "pluma") return arte("pluma", plumaFilas());
  return arte("estrella", estrellaFilas());
}

/*
  protagonista.js: el personaje principal, dibujado en Canvas (sin imágenes).

  Uso:
    Protagonista.dibujar(ctx, x, y, { dir: 1 | -1, estado: 'quieto' | 'andar' | 'salto' | 'caer' | 'escalera' | 'muerto', tiempo, camisa: 'fuego' });

  x, y: esquina superior izquierda de la caja de colisión (12 × 14 píxeles lógicos).
  El dibujo sobresale 2 px a cada lado y 4 px por encima de la caja; los pies quedan en el borde inferior.
  camisa: 'fuego' cambia la camisa roja por una blanca (opcional).
  El contexto debe tener escala U (o U × zoom), igual que el resto de los dibujos.
*/
(function (global) {
  'use strict';

  const OUT = '#2a1a10';
  const ROJO = ['#ff7a66', '#d9341f', '#8f1a10'];
  const BLANCO = ['#ffffff', '#e4e4ee', '#a8a8bc'];   // camisa de la flor de fuego (añadido)
  const AZUL = ['#8cc4ff', '#2f6fd0', '#183f80'];
  const PIEL = ['#ffe6cc', '#f2b88a', '#b87850'];
  const PELO = '#5a3418';

  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r);
    g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }

  function grad(g, x0, y0, x1, y1, cols) {
    const d = g.createLinearGradient(x0, y0, x1, y1);
    cols.forEach(function (c, i) { d.addColorStop(i / (cols.length - 1), c); });
    return d;
  }

  function radial(g, x, y, r0, r1, cols) {
    const d = g.createRadialGradient(x, y, r0, x, y, r1);
    cols.forEach(function (c, i) { d.addColorStop(i / (cols.length - 1), c); });
    return d;
  }

  function trazar(g, ancho) {
    g.strokeStyle = OUT;
    g.lineWidth = ancho || 0.6;
    g.lineJoin = 'round';
    g.stroke();
  }

  // Brazo: manga roja y mano de piel. Gira alrededor del hombro (ang 0 = colgando)
  function brazo(g, sx, sy, ang, manga) {
    g.save();
    g.translate(sx, sy);
    g.rotate(ang);
    g.fillStyle = grad(g, -1.3, 0, 1.3, 0, manga);
    rr(g, -1.3, -0.4, 2.6, 2.7, 1.1); g.fill(); trazar(g);
    g.fillStyle = radial(g, -0.4, 3, 0.2, 1.8, PIEL);
    g.beginPath(); g.ellipse(0, 3.4, 1.4, 1.5, 0, 0, Math.PI * 2); g.fill(); trazar(g);
    g.restore();
  }

  // Pierna: overol azul y zapato marrón. dx: desplazamiento horizontal; lift: cuánto se levanta el pie
  function pierna(g, cadera, dx, lift) {
    const x = cadera + dx, y = 15.2 - lift;
    g.fillStyle = grad(g, x - 1.5, 0, x + 1.5, 0, AZUL);
    rr(g, x - 1.5, y, 3, 2.6, 1); g.fill(); trazar(g);
    g.fillStyle = grad(g, 0, 16, 0, 18, ['#9a6a3a', '#4a2a10']);
    rr(g, x - 2, 16.2 - lift, 4.2, 1.8, 0.9); g.fill(); trazar(g);
  }

  function torso(g, camisa) {
    // camisa (roja, o blanca con la flor de fuego)
    g.fillStyle = grad(g, 0, 10.2, 0, 14.4, camisa);
    rr(g, 4.2, 10.2, 7.6, 4.2, 1.4); g.fill(); trazar(g);
    // overol azul
    g.fillStyle = grad(g, 0, 12.4, 0, 16.6, AZUL);
    rr(g, 4.6, 12.4, 6.8, 4.2, 1); g.fill(); trazar(g);
    // tirantes y botón
    g.fillStyle = AZUL[1];
    g.fillRect(5.4, 10.4, 0.9, 2.4); g.fillRect(9.7, 10.4, 0.9, 2.4);
    g.fillStyle = radial(g, 8.2, 13.2, 0.1, 1, ['#fff8c0', '#ffd23f', '#d98a00']);
    g.beginPath(); g.arc(8.1, 13.1, 0.6, 0, Math.PI * 2); g.fill(); trazar(g, 0.4);
  }

  function cabeza(g, estado) {
    // oreja y pelo de detrás
    g.fillStyle = PIEL[1];
    g.beginPath(); g.ellipse(4.2, 7.6, 0.9, 1.3, 0, 0, Math.PI * 2); g.fill(); trazar(g, 0.5);
    g.fillStyle = PELO;
    g.beginPath(); g.ellipse(4.9, 8.8, 1.2, 1.5, 0, 0, Math.PI * 2); g.fill();

    // cara
    g.fillStyle = radial(g, 7.4, 6.2, 0.5, 5, PIEL);
    g.beginPath(); g.ellipse(8.2, 7.2, 4.1, 3.7, 0, 0, Math.PI * 2); g.fill(); trazar(g);

    // gorra roja con visera y emblema
    g.fillStyle = grad(g, 0, 2.3, 0, 4.8, ROJO);
    g.beginPath(); g.ellipse(8.1, 4.8, 4.4, 2.5, 0, Math.PI, 0, false); g.closePath(); g.fill(); trazar(g);
    g.fillStyle = grad(g, 8, 4.7, 8, 6.1, ROJO);
    rr(g, 8.2, 4.7, 5.2, 1.4, 0.7); g.fill(); trazar(g);
    g.fillStyle = '#ffffff';
    g.beginPath(); g.arc(7.8, 3.9, 0.75, 0, Math.PI * 2); g.fill(); trazar(g, 0.4);

    // ojos: abiertos, o en cruz si está muerto
    if (estado === 'muerto') {
      g.strokeStyle = OUT; g.lineWidth = 0.7;
      [[8.8, 7], [11, 7]].forEach(function (p) {
        g.beginPath(); g.moveTo(p[0] - 0.8, p[1] - 0.8); g.lineTo(p[0] + 0.8, p[1] + 0.8);
        g.moveTo(p[0] + 0.8, p[1] - 0.8); g.lineTo(p[0] - 0.8, p[1] + 0.8); g.stroke();
      });
    } else {
      [[8.8, 6.9], [11, 6.9]].forEach(function (p) {
        g.fillStyle = '#ffffff';
        g.beginPath(); g.ellipse(p[0], p[1], 0.95, 1.2, 0, 0, Math.PI * 2); g.fill(); trazar(g, 0.5);
        g.fillStyle = OUT;
        g.beginPath(); g.arc(p[0] + 0.35, p[1] + 0.3, 0.55, 0, Math.PI * 2); g.fill();
      });
    }

    // nariz y bigote
    g.fillStyle = PIEL[1];
    g.beginPath(); g.ellipse(12.3, 8, 1, 1.1, 0, 0, Math.PI * 2); g.fill(); trazar(g, 0.5);
    g.fillStyle = '#3a2212';
    rr(g, 8.4, 8.7, 3.9, 1.1, 0.55); g.fill();
  }

  // Posición de brazos (ángulos) y piernas (desplazamiento y levantamiento) según el estado
  function pose(estado, t) {
    const ph = Math.sin(t * 12), ph2 = Math.sin(t * 7);
    switch (estado) {
      case 'andar':
        return { bI: -ph * 0.6, bD: ph * 0.6,
                 pI: { dx: ph * 1.3, lift: Math.max(0, ph) * 1.1 },
                 pD: { dx: -ph * 1.3, lift: Math.max(0, -ph) * 1.1 } };
      case 'salto':
        return { bI: 2.5, bD: -2.5, pI: { dx: -1.2, lift: 0.8 }, pD: { dx: 1, lift: 0.4 } };
      case 'caer':
        return { bI: 1.3, bD: -1.3, pI: { dx: -0.6, lift: 0 }, pD: { dx: 0.6, lift: 0 } };
      case 'escalera':
        return { bI: 2.2 + ph2 * 0.5, bD: -2.2 - ph2 * 0.5,
                 pI: { dx: ph2 * 0.8, lift: Math.max(0, ph2) * 0.8 },
                 pD: { dx: -ph2 * 0.8, lift: Math.max(0, -ph2) * 0.8 } };
      case 'muerto':
        return { bI: 2.6, bD: -2.6, pI: { dx: -1.5, lift: 0 }, pD: { dx: 1.5, lift: 0 } };
      default:
        return { bI: 0.15, bD: -0.15, pI: { dx: 0, lift: 0 }, pD: { dx: 0, lift: 0 } };
    }
  }

  // Dibuja al protagonista. x, y: esquina de la caja de colisión (12 × 14)
  function dibujar(g, x, y, opt) {
    opt = opt || {};
    const dir = opt.dir < 0 ? -1 : 1;
    const estado = opt.estado || 'quieto';
    const camisa = opt.camisa === 'fuego' ? BLANCO : ROJO;
    const p = pose(estado, opt.tiempo || 0);

    g.save();
    g.translate(Math.round(x) - 2, Math.round(y) - 4);
    if (dir < 0) { g.translate(16, 0); g.scale(-1, 1); }

    // orden de dibujo: brazos y piernas detrás del cuerpo, cabeza al final
    brazo(g, 4.8, 10.8, p.bI, camisa);
    brazo(g, 11.2, 10.8, p.bD, camisa);
    pierna(g, 6.3, p.pI.dx, p.pI.lift);
    pierna(g, 9.7, p.pD.dx, p.pD.lift);
    torso(g, camisa);
    cabeza(g, estado);

    g.restore();
  }

  global.Protagonista = { dibujar: dibujar, ESTADOS: ['quieto', 'andar', 'salto', 'caer', 'escalera', 'muerto'] };
})(typeof window !== 'undefined' ? window : globalThis);

/* =====================================================================
   5c. PERSONAJE: protagonista.js dibujado sobre el jugador
   La caja de colisión mide 12 × 16 (grande: 12 × 26). protagonista.js
   dibuja sobre una caja de 12 × 14 con los pies en su borde inferior,
   así que el dibujo se escala para que su caja coincida con el hitbox.

// Pose de protagonista.js para cada pose del jugador (ver calcularPose en Player)
const POSE_PROTA = {
  quieto: "quieto", andar: "andar", correr: "andar", giro: "salto", salto: "salto",
  caida: "caer", frenado: "quieto", agachado: "quieto", dano: "quieto", muerto: "muerto",
};

// Dibuja al protagonista con los pies en (px, py), centrado en px.
// alto: alto de su caja de colisión (16 pequeño, 26 grande).
// opt: estado, dir, tiempo (avance de las piernas), sx/sy (escala extra), inclina (radianes), camisa
function dibujarProtagonista(px, py, alto, opt) {
  const { sx = 1, sy = 1, inclina = 0 } = opt;
  const s = alto / 14;
  ctx.save();
  ctx.translate(Math.round(px), Math.round(py));
  ctx.rotate(inclina);
  ctx.scale(s * sx, s * sy);
  Protagonista.dibujar(ctx, -6, -14, { dir: opt.dir, estado: opt.estado, tiempo: opt.tiempo, camisa: opt.camisa });
  ctx.restore();
}

/* Crea las 8 fases de un mundo con sus nombres. w: número del mundo.
   Las dos primeras fases usan solo dos tipos de enemigo; la 8 es el castillo.
   opc.horas: momento del día de cada fase; opc.castillo: el castillo usa el escenario de piedra. */
function fases(w, nombres, enemigos, opc = {}) {
  return nombres.map((nombre, i) => {
    const k = i + 1, castillo = k === 8;
    const lv = {
      nombre: castillo ? w + "-C " + nombre : w + "-" + k + " " + nombre,
      tiempo: castillo ? 250 : 300,
      gen: {
        seed: w * 100 + k,
        dif: Math.min(8, w + Math.floor((k - 1) / 3) + (castillo ? 1 : 0)),
        enemigos: k <= 2 ? enemigos.slice(0, 2) : enemigos,
      },
      mecanicas: (MECANICAS_MUNDO[w] || MECANICAS_POR_FASE)[i],
    };
    if (opc.horas && opc.horas[i] !== undefined) lv.hora = opc.horas[i];
    if (castillo) { lv.jefe = true; if (opc.castillo) lv.castillo = true; }
    return lv;
  });
}

/* Nodos del mapa de un mundo: las fases y las casas de minijuegos en orden,
   repartidos a lo largo de la ruta según la distancia recorrida.
   Cada nodo lleva vec (vecinos anterior y siguiente) para moverse con las flechas. */
function construirMapa(m) {
  const seq = [];
  m.niveles.forEach((nv, i) => {
    seq.push({ ref: i, castillo: i === m.niveles.length - 1 });
    if (m.bonus.includes(i + 1)) seq.push({ bonus: i + 1 });   // casa de minijuegos tras la fase i+1
  });
  const r = m.ruta, largos = [];
  let total = 0;
  for (let i = 1; i < r.length; i++) {
    const d = Math.hypot(r[i][0] - r[i - 1][0], r[i][1] - r[i - 1][1]);
    largos.push(d);
    total += d;
  }
  seq.forEach((nodo, i) => {
    let s = (total * i) / (seq.length - 1), t = 0;
    while (t < largos.length - 1 && s > largos[t]) { s -= largos[t]; t++; }
    const f = largos[t] ? s / largos[t] : 0;
    nodo.x = Math.round(r[t][0] + (r[t + 1][0] - r[t][0]) * f);
    nodo.y = Math.round(r[t][1] + (r[t + 1][1] - r[t][1]) * f);
    nodo.vec = [i - 1, i + 1].filter((j) => j >= 0 && j < seq.length);
  });
  return seq;
}

   Convierte la especificación "gen" (o un "mapa" escrito a mano) en:
     { cols, rows, tiles[][], ents[], plats[], decor[], goalX, theme, boss }
   Tiles: "." vacío, "G" suelo, "B" ladrillo, "Q" bloque ?, "S" bloque
          sólido, "T" tubería, "F" poste de meta,
          "M" muelle (lanza alto al pisarlo, con una repisa), "H" pinchos (en el fondo de un hoyo), "V" lava,
          "L" escalera, "D" plataforma de una dirección.
   Entidades: "walker" "shell" "flyer" "plant" "coin" "boss".
   Plataformas (plats): "movil" (va y viene) y "caida" (se cae al pisarla).
   ===================================================================== */
const LEYENDA_MAPA = {
  ".": null, G: "G", B: "B", Q: "Q", S: "S", T: "T", F: "F",
  w: "walker", s: "shell", f: "flyer", p: "plant", c: "coin", J: "boss",
};
const ROWS = 14;           // 14 tiles * 16px = 224px de alto
const GY = 11;             // fila del suelo (la superior)
const FILA_PLAT = 8;       // fila de las plataformas sobre los huecos y de las escaleras
const ITEMS_Q = ["moneda", "moneda", "hongo", "hongo", "flor", "pluma", "estrella"];

// Generador pseudoaleatorio determinista (mulberry32): misma semilla = mismo nivel
function prng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Crea una rejilla vacía
function gridVacia(cols) {
  const t = [];
  for (let r = 0; r < ROWS; r++) t.push(new Array(cols).fill("."));
  return t;
}

/* Genera un nivel a partir de gen = { seed, dif, enemigos } y de sus mecánicas.
   Cada mecánica es un módulo con sentido. Los módulos reservan sus celdas antes que los bloques
   sueltos, los enemigos y las monedas, así que no se pisan entre sí:
     muelle                : lanza a una repisa alta que no se alcanza saltando (monedas y un bloque ?)
     pinchos               : hoyos con pinchos en el fondo; se saltan, y las monedas marcan el salto
     una_direccion         : escalinata de plataformas que se atraviesan desde abajo, hasta lo alto
     escalera              : escalera a un mirador de piedra que no se alcanza saltando
     plataforma_movil/caida: cruzan los huecos anchos (3 tiles o más)
     lava                  : los huecos de la zona B son lava
   Las monedas solo se crean en celdas de aire. */
function generarNivel(gen, mecanicas = []) {
  const rnd01 = prng(gen.seed);
  const r = (a, b) => a + rnd01() * (b - a);
  const ri = (a, b) => Math.floor(r(a, b + 1));
  const dif = clamp(gen.dif || 1, 1, 8);
  const tipos = gen.enemigos && gen.enemigos.length ? gen.enemigos : ["walker"];
  const usa = (m) => mecanicas.includes(m);
  const cols = 188;                 // ~3000px de ancho
  const tiles = gridVacia(cols);
  const ents = [];
  const plats = [];
  const canones = [];

  // Celdas reservadas por los módulos: ni bloques sueltos, ni enemigos, ni monedas ajenas
  const reservado = new Set();
  const clave = (c, rr) => c + "," + rr;
  const libre = (c, rr) => c >= 0 && c < cols && rr >= 0 && rr < ROWS && tiles[rr][c] === "." && !reservado.has(clave(c, rr));
  const reservar = (c0, c1, f0, f1) => {
    for (let c = c0; c <= c1; c++) for (let rr = f0; rr <= f1; rr++) reservado.add(clave(c, rr));
  };
  // Monedas que marcan cada módulo: se crean al final, solo si la celda sigue en el aire
  const monedas = [];
  const moneda = (c, rr) => monedas.push([c, rr]);

  // Límites de las 3 secciones: abierta, plataformas flotantes y meta
  const A1 = 90, B1 = 146, C1 = 180;
  // Huecos saltables caminando (2 tiles) en los primeros mundos; más anchos al subir la dificultad
  const gapMax = dif <= 3 ? 2 : dif <= 5 ? 3 : 4;
  // Las plataformas necesitan huecos de 3 tiles o más que cruzar: se garantizan dos en la zona B
  let anchos = usa("plataforma_movil") || usa("plataforma_caida") ? 2 : 0;

  // Suelo base con huecos controlados (nunca dos huecos juntos)
  const suelo = new Array(cols).fill(true);
  let c = 6;
  while (c < C1) {
    const seccionB = c >= A1 && c < B1;
    const ancho = seccionB && anchos > 0 && c >= A1 + 12 + (2 - anchos) * 30;
    if (seccionB && (ancho || rnd01() < 0.25 + dif * 0.04)) {
      const w = ancho ? 3 : ri(2, gapMax);
      if (ancho) anchos--;
      for (let k = 0; k < w && c + k < cols; k++) suelo[c + k] = false;
      c += w + ri(3, 5);            // al menos 3 tiles de suelo entre huecos
    } else {
      c += ri(4, 9);
    }
  }
  for (let x = 0; x < cols; x++) {
    if (!suelo[x]) continue;
    for (let y = GY; y < ROWS; y++) tiles[y][x] = "G";
  }

  // Escalones y bloques sólidos en la zona de meta
  for (let x = C1; x < cols - 4; x++) {
    const alto = clamp(Math.floor((x - C1) / 2) + 1, 1, 6);
    for (let k = 0; k < alto && GY - 1 - k >= 0; k++) {
      if (suelo[x]) tiles[GY - 1 - k][x] = "S";
    }
  }
  // Suelo final
  for (let x = C1; x < cols; x++) if (suelo[x]) for (let y = GY; y < ROWS; y++) tiles[y][x] = "G";
  const goalX = cols - 4;
  for (let y = 4; y < GY; y++) tiles[y][goalX] = "F";

  // Tuberías con plantas (si el enemigo "plant" está permitido)
  if (tipos.includes("plant")) {
    for (let x = 30; x < B1; x += ri(22, 30)) {
      if (!suelo[x] || !suelo[x + 1]) continue;
      tiles[GY - 1][x] = "T"; tiles[GY - 2][x] = "T";
      tiles[GY - 1][x + 1] = "T"; tiles[GY - 2][x + 1] = "T";
      ents.push({ t: "plant", x: x * TILE + 1, y: (GY - 2) * TILE - 8 });
      // Despeja el aire sobre la tubería: un bloque a esa altura deja un hueco de 16 px
      // que el jugador (también de 16 px) no puede cruzar sin un salto perfecto
      for (let cc = x - 2; cc <= x + 3; cc++) for (let rr = 4; rr <= GY - 3; rr++) if (cc >= 0 && cc < cols) tiles[rr][cc] = ".";
      // Y que ningún módulo posterior (ladrillos, bloques ?, cañones...) tape la salida de la planta
      reservar(Math.max(0, x - 2), x + 3, 4, GY - 3);
    }
  }

  // Huecos de la zona B: [primera columna, última columna]
  const huecos = [];
  for (let x = A1; x < B1;) {
    if (suelo[x]) { x++; continue; }
    let fin = x;
    while (fin + 1 < B1 && !suelo[fin + 1]) fin++;
    huecos.push([x, fin]);
    x = fin + 1;
  }
  // Aire libre sobre cada hueco: un bloque encima frena el salto (la cabeza choca) y el jugador cae
  for (const [a, b] of huecos) {
    for (let cc = a - 1; cc <= b + 1; cc++) for (let rr = 4; rr <= GY - 3; rr++) if (cc >= 0 && cc < cols) tiles[rr][cc] = ".";
  }

  /* ----- Módulos de las mecánicas de la fase ----- */
  // Pinchos en hoyos: un hueco de 2 o 3 tiles con los pinchos en el fondo, rodeado de suelo.
  // Se salta por encima; solo hace daño si se cae dentro. Las monedas sobre el hoyo marcan el salto
  if (usa("pinchos")) {
    const n = 2 + Math.floor(dif / 3);
    for (let k = 0, hechos = 0; k < 80 && hechos < n; k++) {
      const w = ri(2, 3), x = ri(14, A1 - 12);
      let ok = true;
      for (let cc = x - 1; cc <= x + w && ok; cc++) ok = libre(cc, GY - 1) && tiles[GY][cc] === "G";
      if (!ok) continue;
      for (let cc = x; cc < x + w; cc++) { tiles[GY][cc] = "."; tiles[GY + 1][cc] = "H"; }
      reservar(x - 1, x + w, GY - 3, GY + 1);
      for (let cc = x; cc < x + w; cc++) moneda(cc, GY - 2);
      hechos++;
    }
  }

  // Muelles con repisa: el muelle lanza a una repisa de piedra que no se alcanza saltando.
  // Hay que pisar el muelle y avanzar hacia la repisa mientras se sube; arriba hay monedas y un bloque ?
  if (usa("muelle")) {
    const n = dif >= 5 ? 2 : 1;
    for (let k = 0, hechos = 0; k < 80 && hechos < n; k++) {
      const x = ri(14, A1 - 12);
      let ok = true;
      for (let cc = x - 1; cc <= x + 8 && ok; cc++) ok = suelo[cc] && tiles[GY][cc] === "G";
      for (let cc = x; cc <= x + 8 && ok; cc++) for (let rr = 0; rr < GY && ok; rr++) ok = libre(cc, rr);
      if (!ok) continue;
      tiles[GY - 1][x] = "M";
      for (let cc = x + 4; cc <= x + 7; cc++) tiles[3][cc] = "S";
      tiles[1][x + 5] = "Q";
      reservar(x - 1, x + 8, 0, GY - 1);
      for (let cc = x + 4; cc <= x + 7; cc++) moneda(cc, 2);
      hechos++;
    }
  }

  // Plataformas sobre los huecos anchos: la móvil va y viene de un lado a otro del hueco;
  // la que cae tiembla y se hunde al pisarla, así que hay que cruzarla sin pararse.
  // Se colocan antes que las escaleras y escalinatas, que así no ocupan los huecos
  const anchosHuecos = huecos.filter(([a, b]) => b - a >= 2);
  const celdasLibres = (c0, c1) => {
    for (let cc = c0; cc <= c1; cc++) for (let rr = FILA_PLAT - 1; rr <= FILA_PLAT; rr++) if (!libre(cc, rr)) return false;
    return true;
  };
  const usados = [];          // huecos que ya usa una plataforma o un puente
  let cruzado = null;
  if (usa("plataforma_movil")) {
    const h = anchosHuecos.find(([a, b]) => celdasLibres(a - 2, b + 3));
    if (h) {
      const [a, b] = h;
      reservar(a - 2, b + 3, FILA_PLAT - 1, FILA_PLAT);
      plats.push({ t: "movil", x: (a - 2) * TILE, y: FILA_PLAT * TILE, w: 3 * TILE, h: TILE, x0: (a - 2) * TILE, x1: (b + 1) * TILE, vel: 36 });
      cruzado = h;
      usados.push(h);
    }
  }
  if (usa("plataforma_caida")) {
    const h = anchosHuecos.find((g) => g !== cruzado && celdasLibres(g[0], g[1]));
    if (h) {
      const [a, b] = h;
      reservar(a, b, FILA_PLAT - 1, FILA_PLAT);
      usados.push(h);
      // Tres bloques centrados sobre el hueco
      plats.push({ t: "caida", x: (Math.floor((a + b + 1) / 2) - 1) * TILE, y: FILA_PLAT * TILE, w: 3 * TILE, h: TILE });
    }
  }

  // Escalinata de plataformas de una dirección: se sube atravesándolas desde abajo, escalón a escalón,
  // hasta una zona alta con un bloque ? y monedas. Las monedas de cada escalón marcan el camino
  if (usa("una_direccion")) {
    const n = dif >= 6 ? 2 : 1;
    for (let k = 0, hechos = 0; k < 80 && hechos < n; k++) {
      const x = ri(A1 + 2, B1 - 14);
      let ok = true;
      for (let cc = x - 1; cc <= x + 9 && ok; cc++) ok = suelo[cc] && tiles[GY][cc] === "G";
      for (let cc = x; cc <= x + 9 && ok; cc++) for (let rr = 1; rr < GY && ok; rr++) ok = libre(cc, rr);
      if (!ok) continue;
      for (let s = 0; s < 3; s++) for (let cc = x + 3 * s; cc <= x + 3 * s + 2; cc++) tiles[8 - 2 * s][cc] = "D";
      tiles[1][x + 7] = "Q";
      reservar(x - 1, x + 9, 1, GY - 1);
      for (let cc = x; cc <= x + 2; cc++) moneda(cc, 7);
      for (let cc = x + 3; cc <= x + 5; cc++) moneda(cc, 5);
      for (let cc = x + 6; cc <= x + 8; cc++) moneda(cc, 3);
      hechos++;
    }
  }

  // Escalera a un mirador: una columna de escalera hasta una plataforma de piedra muy alta,
  // que no se alcanza saltando. Arriba hay monedas
  if (usa("escalera")) {
    for (let k = 0, hecho = false; k < 80 && !hecho; k++) {
      const x = ri(A1 + 2, B1 - 8);
      let ok = suelo[x - 1] && suelo[x] && tiles[GY][x] === "G";
      for (let rr = 1; rr < GY && ok; rr++) ok = libre(x, rr);
      for (let cc = x + 1; cc <= x + 5 && ok; cc++) for (let rr = 2; rr <= 3 && ok; rr++) ok = libre(cc, rr);
      if (!ok) continue;
      for (let rr = 2; rr < GY; rr++) tiles[rr][x] = "L";
      tiles[1][x] = "S";   // tope: al llegar arriba la cabeza para y se puede pasar al mirador
      // Una columna de plataforma de una dirección junto a la escalera (se sube por debajo y se pisa desde arriba)
      // y después la repisa de piedra: así la escalera no choca con el mirador al subir
      tiles[3][x + 1] = "D";
      for (let cc = x + 2; cc <= x + 5; cc++) { tiles[3][cc] = "S"; moneda(cc, 2); }
      reservar(x - 1, x + 5, 1, GY - 1);
      hecho = true;
    }
  }

  // Puentes de madera sobre los huecos libres (de hasta 4 tiles): al pisar un tramo, el puente entero
  // cae en cascada, así que hay que cruzarlo sin pararse. Se rehacen solos al cabo de unos segundos
  if (usa("puente")) {
    const n = dif >= 4 ? 2 : 1;
    let hechos = 0;
    huecos.forEach((g, gi) => {
      if (hechos >= n || usados.includes(g) || g[1] - g[0] > 3) return;
      const [a, b] = g;
      for (let cc = a; cc <= b; cc++) {
        plats.push({ t: "caida", madera: true, x: cc * TILE, y: GY * TILE, w: TILE, h: TILE,
                     grupo: "puente" + gi, indice: cc - a, tCaida: 0.6 });
      }
      usados.push(g);
      hechos++;
    });
  }

  // Cañones de pared sobre un pilar de piedra junto al camino: disparan a la altura del cuerpo, así que
  // hay que saltar la bala. Tienen ocho casillas de aire delante para que la bala llegue lejos
  if (usa("canon")) {
    const n = dif >= 6 ? 2 : 1;
    for (let k = 0, hechos = 0; k < 120 && hechos < n; k++) {
      const x = ri(16, B1 - 10);
      let dir = rnd01() < 0.5 ? 1 : -1;
      // Con jefe, una bala que va a la derecha desde cerca de la arena llegaría a ella (alcance ~39 casillas): dispara hacia atrás
      if (gen.jefe && x > B1 - 42) dir = -1;
      // Para esquivar la bala hay que saltar: la calle de disparo queda libre hasta arriba (filas 5 a 10, más que el salto)
      const despejada = (cc) => { for (let rr = GY - 6; rr <= GY - 1; rr++) if (!libre(cc, rr)) return false; return true; };
      let ok = suelo[x] && tiles[GY][x] === "G" && despejada(x);
      for (let cc = x + dir; cc !== x + dir * 9 && ok; cc += dir) ok = despejada(cc);
      if (!ok) continue;
      tiles[GY - 1][x] = "S";
      reservar(Math.min(x, x + dir * 8), Math.max(x, x + dir * 8), GY - 6, GY - 1);
      // El segundo cañón de la fase dispara medio ciclo después: nunca llegan dos balas a la vez desde lados opuestos
      canones.push({ col: x, row: GY - 1, dir, cada: 2.4, velocidad: 90, inicio: 1.2 + 1.2 * canones.length });
      hechos++;
    }
  }

  // Lava: los huecos de la zona B se llenan de lava (caer en ella es mortal)
  if (usa("lava")) {
    for (const [a, b] of huecos) for (let cc = a; cc <= b; cc++) for (let rr = GY; rr < ROWS; rr++) tiles[rr][cc] = "V";
  }
  // Monedas por encima de cada hueco: marcan el salto y quedan libres de bloques
  for (const [a, b] of huecos) {
    for (let cc = a; cc <= b; cc++) { moneda(cc, 6); reservado.add(clave(cc, 6)); }
  }

  /* ----- Bloques sueltos (solo en celdas libres), enemigos y monedas ----- */
  // Bloques ? y ladrillos en la zona abierta
  for (let x = 12; x < A1; x++) {
    if (rnd01() < 0.06 + dif * 0.005) {
      const row = 7;
      if (libre(x, row)) {
        if (rnd01() < 0.5) {
          tiles[row][x] = "Q";
        } else {
          for (let k = 0; k < ri(1, 3) && x + k < A1; k++) if (libre(x + k, row)) tiles[row][x + k] = "B";
        }
      }
      x += 4;
    }
  }
  // Sección de plataformas flotantes: ladrillos y ? en el aire, sin tapar huecos ni módulos
  const cercaHueco = (cc) => huecos.some(([a, b]) => cc >= a - 1 && cc <= b + 1);
  for (let x = A1; x < B1; x++) {
    if (rnd01() < 0.1) {
      const row = ri(6, 8);
      const n = ri(2, 4);
      for (let k = 0; k < n && x + k < B1; k++) {
        if (libre(x + k, row) && !cercaHueco(x + k)) tiles[row][x + k] = k === 1 && rnd01() < 0.4 ? "Q" : "B";
      }
      x += n + 2;
    }
  }

  // Enemigos caminantes, caparazones y voladores sobre el suelo (nunca en un hoyo ni en un módulo)
  const nEnem = 4 + dif * 2;
  for (let i = 0; i < nEnem; i++) {
    const x = ri(10, C1 - 4);
    if (!suelo[x] || x < 12 || tiles[GY][x] !== "G" || !libre(x, GY - 1)) continue;
    const t = tipos[ri(0, tipos.length - 1)];
    if (t === "plant") continue;
    if (t === "flyer") {
      ents.push({ t, x: x * TILE, y: ri(3, 7) * TILE });
    } else {
      ents.push({ t, x: x * TILE, y: (GY - 1) * TILE });
    }
  }

  // Monedas: las de los módulos y los arcos sueltos de la zona abierta, solo en celdas de aire
  // (así nunca aparecen dentro de un bloque ?, un ladrillo o una plataforma)
  const conMoneda = new Set();
  const ponerMoneda = (cc, rr) => {
    const k = clave(cc, rr);
    if (conMoneda.has(k) || tiles[rr][cc] !== ".") return;
    conMoneda.add(k);
    ents.push({ t: "coin", x: cc * TILE + 4, y: rr * TILE + 4 });
  };
  for (const [cc, rr] of monedas) ponerMoneda(cc, rr);
  for (let x = 16; x < A1; x += ri(10, 16)) {
    const n = ri(3, 5);
    for (let k = 0; k < n; k++) {
      ponerMoneda(x + k, 9 - Math.round(Math.sin((k / (n - 1)) * Math.PI) * 2));
    }
  }

  // Bloques ? con contenido elegido por la semilla
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < cols; x++) {
    if (tiles[y][x] === "Q") {
      ents.push({ t: "qitem", x: x * TILE, y: y * TILE, item: ITEMS_Q[ri(0, ITEMS_Q.length - 1)] });
    }
  }

  // Decoración del suelo abierto (arbustos, árboles, rocas...): no es sólida y se dibuja detrás de todo
  const decor = [];
  const piezas = DECOR_DE_TEMA[gen.theme] || [];
  for (let x = 12; x < A1 && piezas.length; x++) {
    if (!suelo[x] || tiles[GY][x] !== "G" || rnd01() > 0.14) continue;
    const pieza = piezas[ri(0, piezas.length - 1)];
    if (pieza.some((_, k) => tiles[GY - 1 - k][x] !== "." || reservado.has(clave(x, GY - 1 - k)))) continue;
    pieza.forEach((ch, k) => decor.push({ ch, c: x, r: GY - 1 - k }));
    x++;   // deja al menos un tile libre entre dos piezas
  }

  // Jefe al final de la zona de escalones, si el nivel es de castillo
  if (gen.jefe) {
    ents.push({ t: "boss", x: (C1 - 16) * TILE, y: (GY - 1) * TILE - 16 });
  }

  // El inicio siempre está libre de enemigos
  return {
    cols, rows: ROWS, tiles,
    ents: ents.filter((e) => e.x >= 10 * TILE),
    plats, decor, canones,
    start: { x: 3 * TILE, y: (GY - 2) * TILE },
    goalX: goalX * TILE,
    theme: gen.theme || null,
    boss: !!gen.jefe,
    arenaX0: gen.jefe ? B1 * TILE : 0,   // la arena del jefe es el suelo llano desde B1
  };
}

/* Convierte un mapa escrito a mano (array de strings) en el mismo formato */
function parsearMapa(strs) {
  const cols = strs[0].length;
  const tiles = gridVacia(cols);
  const ents = [];
  let start = { x: 3 * TILE, y: (GY - 2) * TILE };
  let goalX = (cols - 4) * TILE;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < cols; x++) {
    const ch = strs[y] && strs[y][x] ? strs[y][x] : ".";
    const tipo = LEYENDA_MAPA[ch];
    if (ch === "@") { start = { x: x * TILE, y: y * TILE }; continue; }
    if (tipo === undefined) continue;
    if (tipo === null) continue;
    if (["G", "B", "Q", "S", "T", "F"].includes(tipo)) {
      tiles[y][x] = tipo;
      if (tipo === "F") goalX = x * TILE;
      if (tipo === "Q") ents.push({ t: "qitem", x: x * TILE, y: y * TILE, item: "moneda" });
    } else {
      ents.push({ t: tipo, x: x * TILE, y: y * TILE });
    }
  }
  return { cols, rows: ROWS, tiles, ents, plats: [], decor: [], canones: [], start, goalX, theme: null, boss: false, arenaX0: 0 };
}

/* Punto de entrada: usa el mapa escrito a mano si existe, si no genera */
function construirNivel(def, tema) {
  // Los niveles de castillo no llevan decoración de su mundo (usan su propio escenario)
  const gen = Object.assign({ theme: def.castillo ? "castillo" : tema }, def.gen, { jefe: def.jefe });
  const lv = def.mapa ? parsearMapa(def.mapa) : generarNivel(gen, def.mecanicas || []);
  lv.nombre = def.nombre;
  lv.tiempo = def.tiempo || 300;
  return lv;
}

/* =====================================================================
   8. COLISIÓN CON TILES Y FÍSICA DEL JUGADOR
   Movimiento por ejes: primero X (y paredes), luego Y (suelo/techo).
   ===================================================================== */
const SOLIDOS = { G: 1, B: 1, Q: 1, S: 1, T: 1, U: 1, M: 1, H: 1 };   // H: pinchos (bloquean de lado)

// Devuelve el carácter del tile en (col,fila); fuera del nivel: lateral = pared, abajo = vacío
function tileAt(lvl, col, row) {
  if (col < 0 || col >= lvl.cols) return "S";
  if (row < 0) return ".";
  if (row >= lvl.rows) return ".";
  return lvl.tiles[row][col];
}

// Recorre los tiles que toca un rectángulo y devuelve true si alguno es sólido
function tocaSolido(lvl, x, y, w, h) {
  const c0 = Math.floor(x / TILE), c1 = Math.floor((x + w - 0.01) / TILE);
  const r0 = Math.floor(y / TILE), r1 = Math.floor((y + h - 0.01) / TILE);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (SOLIDOS[tileAt(lvl, c, r)]) return true;
  }
  return false;
}

/* Mueve una entidad {x,y,w,h,vx,vy} resolviendo colisiones por ejes.
   Devuelve { lado, techo, suelo } para saber qué tocó. */
function moverEntidad(lvl, e, dt) {
  const res = { pared: false, techo: false, suelo: false };
  // --- Eje X ---
  e.x += e.vx * dt;
  if (tocaSolido(lvl, e.x, e.y, e.w, e.h)) {
    res.pared = true;
    if (e.vx > 0) e.x = Math.floor((e.x + e.w) / TILE) * TILE - e.w;
    else e.x = Math.floor(e.x / TILE + 1) * TILE;
    e.vx = 0;
  }
  // --- Eje Y ---
  e.y += e.vy * dt;
  if (tocaSolido(lvl, e.x, e.y, e.w, e.h)) {
    if (e.vy > 0) {
      e.y = Math.floor((e.y + e.h) / TILE) * TILE - e.h;
      res.suelo = true;
    } else {
      e.y = Math.floor(e.y / TILE + 1) * TILE;
      res.techo = true;
    }
    e.vy = 0;
  }
  return res;
}

// Tile que hay bajo los pies (la base de la caja): true si es del tipo indicado
function bajoPies(lvl, p, tipo) {
  const R = Math.floor((p.y + p.h) / TILE);
  const c0 = Math.floor(p.x / TILE), c1 = Math.floor((p.x + p.w - 0.01) / TILE);
  for (let c = c0; c <= c1; c++) if (tileAt(lvl, c, R) === tipo) return true;
  return false;
}

// Escalera: la caja del jugador toca una columna de escalera en su centro
function enEscalera(lvl, p) {
  const c = Math.floor((p.x + p.w / 2) / TILE);
  const r0 = Math.floor(p.y / TILE), r1 = Math.floor((p.y + p.h - 0.01) / TILE);
  for (let r = r0; r <= r1; r++) if (tileAt(lvl, c, r) === "L") return true;
  return false;
}

/* Plataformas de una dirección ('D'): la base cruza su borde superior cayendo y la caja queda encima.
   Por debajo, la plataforma no se toca: se puede saltar a través de ella. */
function aterrizaEnDireccional(lvl, p, basePrev) {
  const base = p.y + p.h;
  const R = Math.floor(base / TILE);
  if (basePrev > R * TILE + 0.5) return false;
  const c0 = Math.floor(p.x / TILE), c1 = Math.floor((p.x + p.w - 0.01) / TILE);
  for (let c = c0; c <= c1; c++) {
    if (tileAt(lvl, c, R) === "D") { p.y = R * TILE - p.h; return true; }
  }
  return false;
}

/* =====================================================================
   9. JUGADOR
   Estados: pequeño/grande, fuego, capa (planeo) e invencible (estrella).
   ===================================================================== */
const PHYS = {
  walkAccel: 700, runAccel: 900, airAccel: 520,
  maxWalk: 95, maxRun: 165,
  friction: 620,
  jumpV: 300, jumpHoldG: 520,  // gravedad reducida mientras se mantiene salto
  spinV: 250, spinTime: 0.42,
  coyote: 0.1, buffer: 0.12,
  glideV: 70, glideTime: 1.6,  // planeo con capa
  shellSpeed: 230,
  climbV: 110,    // velocidad al trepar por una escalera
  springV: 500,   // impulso de un muelle: unos 8 bloques de altura, con o sin mantener salto
};

class Player {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.w = 12; this.h = 16;   // hitbox pequeño (el sprite es de 16x22)
    this.pose = "quieto";       // pose visual actual (ver dibujarJugador)
    this.zancada = 0;           // distancia recorrida en el suelo: marca el ciclo de piernas
    this.frenadoT = 0;          // tiempo de derrape al cambiar de dirección a toda velocidad
    this.aterrizajeT = 0;       // tiempo de aplastamiento al aterrizar
    this.facing = 1;
    this.onGround = false;
    this.coyoteT = 0;        // tiempo desde que dejó el suelo
    this.bufferT = 0;        // tiempo desde que se pulsó saltar
    this.jumping = false;    // salto en curso (se puede soltar para cortarlo)
    this.spinT = 0;          // temporizador del salto giratorio
    this.glideT = 0;         // planeo restante
    this.big = false;
    this.fire = false;
    this.rebotando = false;   // rebote de muelle o de pinchos: sube sin cortarse hasta el punto más alto
    this.cape = false;
    this.star = 0;           // segundos de invencibilidad
    this.hurtT = 0;          // segundos de animación de daño / invulnerabilidad
    this.animT = 0;          // reloj de animación
    this.carrying = null;    // caparazón que lleva en la mano
    this.dead = false;
    this.duck = false;
    this.trepando = false;   // agarrado a una escalera
    this.plat = null;        // plataforma móvil sobre la que está de pie
  }

  // Aplica el estado de tamaño (pequeño = 10x14, grande = 10x20)
  setBig(b) {
    if (b === this.big) return;
    const bottom = this.y + this.h;
    this.big = b;
    this.h = b ? 26 : 16;
    this.y = bottom - this.h; // crece hacia arriba, nunca se mete en el suelo
  }

  get invencible() { return this.star > 0 || this.hurtT > 0; }

  // Hace daño: reduce el poder o muere si era pequeño
  golpear() {
    if (this.invencible) return "ignorado";
    if (this.fire || this.cape) { this.fire = false; this.cape = false; this.hurtT = 1.5; return "pierde-poder"; }
    if (this.big) { this.setBig(false); this.hurtT = 1.5; return "encoge"; }
    this.dead = true;
    return "muere";
  }

  // Lógica del jugador por frame (entrada + física + colisiones)
  update(dt, lvl, game) {
    this.prevBottom = this.y + this.h;   // base del jugador antes de moverse (para pisotones)
    this.animT += dt;
    if (this.star > 0) this.star -= dt;
    if (this.hurtT > 0) this.hurtT -= dt;

    const izq = held.left, der = held.right;
    const corre = held.run > 0;
    // Derrape: cambiar de dirección en el suelo a buena velocidad
    const dirH = (der ? 1 : 0) - (izq ? 1 : 0);
    if (this.onGround && dirH !== 0 && Math.sign(this.vx) === -dirH && Math.abs(this.vx) > 90 && this.frenadoT <= 0) {
      this.frenadoT = 0.22;
      emitir(this.x + this.w / 2, this.y + this.h, 4, ["#e8e8f0", "#c8c8d8"], { up: 30, spread: 60, life: 0.3, size: 2 });
    }
    if (this.frenadoT > 0) this.frenadoT -= dt;
    this.duck = held.down && this.onGround && this.big;

    // --- Movimiento horizontal ---
    const dir = (der ? 1 : 0) - (izq ? 1 : 0);
    const maxV = corre ? PHYS.maxRun : PHYS.maxWalk;
    const acc = this.onGround ? (corre ? PHYS.runAccel : PHYS.walkAccel) : PHYS.airAccel;
    if (dir !== 0 && !this.duck) {
      this.facing = dir;
      if (Math.abs(this.vx) < maxV || Math.sign(this.vx) !== dir) this.vx += dir * acc * dt;
      if (Math.abs(this.vx) > maxV) this.vx = Math.sign(this.vx) * Math.max(maxV, Math.abs(this.vx) - 400 * dt);
    } else {
      // Fricción: frena suavemente al soltar la dirección
      const f = PHYS.friction * dt;
      if (Math.abs(this.vx) <= f) this.vx = 0;
      else this.vx -= Math.sign(this.vx) * f;
    }
    // Durante el derrape se frena más fuerte
    if (this.frenadoT > 0 && this.onGround) this.vx -= Math.sign(this.vx) * PHYS.friction * 1.6 * dt;
    if (this.duck) this.vx = 0;

    // --- Escaleras: con arriba o abajo se trepa; saltar suelta la escalera ---
    if (!enEscalera(lvl, this)) this.trepando = false;
    else if (!this.trepando && (held.up || held.down)) { this.trepando = true; this.vx = 0; }   // al agarrarla se para: no se sale de la columna
    if (this.trepando && pressed.jump) { this.trepando = false; this.coyoteT = PHYS.coyote; }
    if (this.trepando) {
      this.vy = held.up ? -PHYS.climbV : held.down ? PHYS.climbV : 0;
      this.jumping = false;
    }

    // --- Salto: buffer (recordar pulsación) y coyote time (saltar tras caer) ---
    if (consume("jump")) this.bufferT = PHYS.buffer;
    else this.bufferT -= dt;
    this.coyoteT = this.onGround ? PHYS.coyote : this.coyoteT - dt;

    if (this.bufferT > 0 && this.coyoteT > 0 && !this.duck) {
      this.vy = -PHYS.jumpV - Math.abs(this.vx) * 0.25;
      this.bufferT = 0; this.coyoteT = 0;
      this.jumping = true;
      this.onGround = false;
      game.sfx("salto");
    }

    // --- Salto giratorio (C / Shift): rebota y rompe bloques giratorios ---
    if (consume("spin") && !this.onGround && this.spinT <= 0) {
      this.spinT = PHYS.spinTime;
      this.vy = Math.min(this.vy, -PHYS.spinV * 0.5);
      game.sfx("giro");
    }
    if (this.spinT > 0) this.spinT -= dt;

    // --- Planeo con capa: mantener salto en el aire ---
    if (this.cape && !this.onGround && held.jump && this.vy > 0 && this.glideT > 0) {
      this.vy = Math.min(this.vy, PHYS.glideV);
      this.glideT -= dt;
    }
    if (this.onGround) this.glideT = PHYS.glideTime;

    // --- Gravedad: más suave si se mantiene salto subiendo (salto variable) ---
    const subiendoConSalto = this.vy < 0 && held.jump && this.jumping;
    const g = subiendoConSalto ? PHYS.jumpHoldG : GRAVITY;
    if (!this.trepando && !(this.cape && held.jump && this.glideT > 0 && this.vy >= 0 && this.vy <= PHYS.glideV)) {
      this.vy += g * dt;
    }
    if (this.vy > MAX_FALL) this.vy = MAX_FALL;
    if (this.vy >= 0) this.jumping = false;
    if (!held.jump && this.vy < -120 && !this.rebotando) this.vy = -120; // corta el salto al soltar

    // --- Colisiones ---
    const vyAntes = this.vy, enAireAntes = !this.onGround;
    const r = moverEntidad(lvl, this, dt);
    if (r.pared) this.vx = 0;
    if (r.techo) {
      game.golpearDesdeAbajo(this);
    }
    // Plataformas de una dirección: solo paran al caer desde arriba
    if (!r.suelo && this.vy >= 0 && aterrizaEnDireccional(lvl, this, this.prevBottom)) { r.suelo = true; this.vy = 0; }
    this.onGround = r.suelo;
    if (r.suelo || this.vy >= 0) this.rebotando = false;
    // Muelle: al pisarlo, salta muy alto
    if (r.suelo && vyAntes >= 0 && bajoPies(lvl, this, "M")) {
      // Sin "jumping" la gravidad es la normal: la altura no depende de mantener salto
      this.vy = -PHYS.springV;
      this.onGround = false;
      this.jumping = false;
      this.rebotando = true;
      game.sfx("salto");
      emitir(this.x + this.w / 2, this.y + this.h, 6, [PAL.y, PAL.w], { up: 80, spread: 60, life: 0.3, size: 2 });
    }
    // Pinchos: solo hacen daño al caer sobre ellos (tocarlos de lado no); el jugador rebota
    if (r.suelo && vyAntes >= 0 && bajoPies(lvl, this, "H")) {
      game.recibirDano(this);
      // El rebote de pinchos sube lo justo para salir del hoyo andando (unos 32 px)
      if (!this.dead) { this.vy = -PHYS.jumpV * 0.8; this.onGround = false; this.jumping = false; this.rebotando = true; }
    }
    // Aterrizaje fuerte: aplastamiento y polvo
    if (r.suelo && enAireAntes && vyAntes > 150) {
      this.aterrizajeT = 0.12;
      emitir(this.x + this.w / 2, this.y + this.h, 6, ["#e8e8f0", "#c8c8d8"], { up: 40, spread: 70, life: 0.35, size: 2 });
    }
    if (this.aterrizajeT > 0) this.aterrizajeT -= dt;
    if (r.suelo) this.jumping = false;

    // Caer fuera del nivel
    if (this.y > lvl.rows * TILE + 40) this.dead = true;

    this.calcularPose(dt);

    // Límite izquierdo del nivel
    if (this.x < 0) { this.x = 0; this.vx = 0; }
  }

  // Elige la pose visual según el estado (la dibuja dibujarJugador) y avanza las piernas al andar
  calcularPose(dt) {
    if (this.dead) this.pose = "muerto";
    else if (this.hurtT > 0) this.pose = "dano";
    else if (this.spinT > 0) this.pose = "giro";
    else if (this.duck) this.pose = "agachado";
    else if (!this.onGround) this.pose = this.vy < 0 ? "salto" : "caida";
    else if (this.frenadoT > 0) this.pose = "frenado";
    else if (Math.abs(this.vx) > 120 && held.run) this.pose = "correr";
    else if (Math.abs(this.vx) > 25) this.pose = "andar";
    else this.pose = "quieto";
    if (this.onGround && (this.pose === "andar" || this.pose === "correr")) this.zancada += Math.abs(this.vx) * dt;
  }
}

/* =====================================================================
   10. ENEMIGOS, JEFE, MONEDAS, OBJETOS Y PARTÍCULAS
   ===================================================================== */

/* Jefe del castillo: uno por mundo, con sus ataques (jefes.js). Esta clase lo une al nivel:
   lo mueve dentro de su arena, le quita una vida con cada pisotón y dice cuándo cae. */
class Boss {
  constructor(x, y, tipo) {
    // x: centro del jefe en la arena; los pies quedan sobre el suelo del nivel
    this.j = Jefes.create(tipo || "koopa", x + TILE, GY * TILE, { dir: -1 });
  }

  get alive() { return this.j.estado !== "muerto"; }
  get hp() { return this.j.hp; }
  // Nombre para el aviso de la pantalla, sin tildes (la fuente no las tiene)
  get nombre() { return Jefes.NOMBRES[this.j.tipo].normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase(); }
  caja() { return Jefes.caja(this.j); }

  // Pisotón: Jefes.golpear devuelve "herido", "muerto" o "ignorado" (si aún es invulnerable)
  pisado(player, game) {
    const r = Jefes.golpear(this.j);
    if (r === "herido") game.sfx("pisar");
    if (r === "muerto") {
      game.puntos(1000);
      game.efectoEnemigo(this.j.x, this.j.y - this.j.h / 2);
      game.sfx("meta");
    }
    return r;
  }

  update(dt, lvl, game, player) {
    // La arena es el suelo llano del castillo: el jefe no sale por la izquierda, donde hay huecos
    const mundo = {
      solid: (x, y) => x < lvl.arenaX0 || lvl.solidoEn(x, y),
      tile: TILE,
      ancho: lvl.cols * TILE,
      jugador: { x: player.x + player.w / 2, y: player.y + player.h / 2 },
    };
    Jefes.update(this.j, dt, mundo);
  }
}

/* Moneda: se recoge al tocarla. Gira con 3 fotogramas. */
class Coin {
  constructor(x, y, suelta = false) {
    this.x = x; this.y = y; this.w = 8; this.h = 10;
    this.alive = true;
    this.anim = Math.random() * 3;
    this.suelta = suelta;   // salió de un bloque (sube y desaparece)
    this.vy = suelta ? -150 : 0;
    this.vidaT = suelta ? 0.5 : Infinity;
  }
  update(dt) {
    this.anim += dt * 8;
    if (this.suelta) {
      this.y += this.vy * dt;
      this.vy += 600 * dt;
      this.vidaT -= dt;
      if (this.vidaT <= 0) this.alive = false;
    }
  }
}

/* Objeto de bloque ?: hongo, flor, pluma o estrella. Sale del bloque y avanza. */
class PowerUp {
  constructor(tipo, x, y) {
    this.tipo = tipo;
    this.x = x; this.y = y;
    this.w = 14; this.h = 14;
    this.vx = tipo === "flor" ? 0 : 50;
    this.vy = 0;
    this.alive = true;
    this.saliendoT = 0.4;  // sube un poco antes de empezar a moverse
    this.yDestino = y - 16;
  }
  update(dt, lvl) {
    if (this.saliendoT > 0) {
      this.saliendoT -= dt;
      this.y -= 40 * dt;
      return;
    }
    if (this.tipo === "flor") return;
    this.vy += GRAVITY * dt;
    if (this.vy > MAX_FALL) this.vy = MAX_FALL;
    const r = moverEntidad(lvl, this, dt);
    if (r.pared) this.vx = -this.vx;
    if (this.y > lvl.rows * TILE) this.alive = false;
  }
}

/* Partículas pixeladas: cuadrados que caen y se desvanecen */
const particulas = [];
function emitir(x, y, n, colores, opts = {}) {
  for (let i = 0; i < n; i++) {
    particulas.push({
      x, y,
      vx: rnd(-(opts.spread || 80), opts.spread || 80),
      vy: rnd(-(opts.up || 140), -(opts.up || 40)),
      g: opts.g === undefined ? 500 : opts.g,
      vida: rnd(0.3, opts.life || 0.6),
      max: opts.life || 0.6,
      color: colores[rndi(0, colores.length - 1)],
      size: opts.size || 2,
    });
  }
}
function actualizarParticulas(dt) {
  for (let i = particulas.length - 1; i >= 0; i--) {
    const p = particulas[i];
    p.vy += p.g * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vida -= dt;
    if (p.vida <= 0) particulas.splice(i, 1);
  }
}
function dibujarParticulas(cam) {
  for (const p of particulas) {
    rect(p.x - cam.x, p.y - cam.y, p.size, p.size, p.color);
  }
}

/* =====================================================================
   7d. PLATAFORMAS MÓVILES Y QUE CAEN
   Son de una dirección: se pisan desde arriba. Una móvil va y viene entre x0 y x1.
   Una que cae tiembla un momento al pisarla, se hunde y reaparece unos segundos después.
   ===================================================================== */
class Plataforma {
  constructor(d) {
    this.t = d.t;                   // "movil" | "caida"
    this.x = d.x; this.y = d.y;
    this.w = d.w; this.h = d.h;
    this.x0 = d.x0; this.x1 = d.x1;
    this.vel = d.vel || 36;
    this.dir = 1;
    this.homeX = d.x; this.homeY = d.y;
    this.dx = 0; this.dy = 0;       // desplazamiento de este frame (lo lleva consigo al jugador)
    this.vy = 0;
    this.pisada = false;            // la pisó el jugador en el frame anterior
    this.temblor = 0;               // tiempo que tiembla antes de caer
    this.caida = false;             // ya cae
    this.vivo = true;
    this.respawn = 0;
    this.grupo = d.grupo || null;   // tramos de un mismo puente: al pisar uno caen todos en cascada
    this.indice = d.indice || 0;    // posición del tramo dentro del puente
    this.tCaida = d.tCaida || 0.45; // segundos que tiembla antes de caer
    this.retraso = 0;               // espera extra de un tramo lejano del pisado
    this.madera = !!d.madera;       // se dibuja con tablones de madera
  }

  update(dt, lvl) {
    const x0 = this.x, y0 = this.y;
    if (this.t === "movil") {
      this.x += this.dir * this.vel * dt;
      if (this.x >= this.x1) { this.x = this.x1; this.dir = -1; }
      if (this.x <= this.x0) { this.x = this.x0; this.dir = 1; }
    } else if (this.vivo) {
      if (this.pisada && this.temblor <= 0 && !this.caida) this.temblor = this.tCaida + this.retraso;
      if (this.temblor > 0) {
        this.temblor -= dt;
        if (this.temblor <= 0) this.caida = true;
      } else if (this.caida) {
        this.vy += GRAVITY * dt;
        this.y += this.vy * dt;
        if (this.y > lvl.rows * TILE + 40) { this.vivo = false; this.respawn = 2.5; }
      }
    } else {
      this.respawn -= dt;
      if (this.respawn <= 0) {
        this.vivo = true; this.caida = false; this.temblor = 0; this.vy = 0;
        this.x = this.homeX; this.y = this.homeY;
      }
    }
    this.dx = this.x - x0;
    this.dy = this.y - y0;
    this.pisada = false;
  }

  // Si el jugador cae desde arriba sobre la franja superior, queda de pie sobre la plataforma
  pisa(p, basePrev) {
    if (!this.vivo || p.vy < 0) return false;
    if (p.x + p.w <= this.x + 2 || p.x >= this.x + this.w - 2) return false;
    const base = p.y + p.h;
    if (basePrev > this.y + 0.5 || base < this.y) return false;
    p.y = this.y - p.h;
    p.vy = 0;
    p.onGround = true;
    return true;
  }
}

// Muelle (tile "M"): base oscura, resorte de espiral y plato rojo arriba
let muelleCache = null;
function muelleSprite() {
  if (!muelleCache) {
    const filas = [
      "", "", "",
      "  rrrrrrrrrrrr  ",
      " rwwrrrrrrrrrrr ",
      " rwrrrrrrrrrrrr ",
      "  rrrrrrrrrrrr  ",
      "      gggg      ", "      ssss      ", "      gggg      ", "      ssss      ", "      gggg      ", "      ssss      ", "      gggg      ",
      "  dddddddddddd  ",
      " dddddddddddddd ",
    ];
    const rows = filas.map((f) => f.padEnd(16, " ").replace(/ /g, "."));
    muelleCache = spriteFromRows(expandir(rows), { r: "#e52521", w: "#ffb3a8", g: "#c8c8d8", s: "#8a8aa0", d: "#5a5a6e" });
  }
  return muelleCache;
}

/* Mezcla un color hex con negro o blanco en proporción t (sombreado) */
function mezclar(hex, t, hacia = "#000000") {
  const a = parseInt(hex.slice(1), 16), b = parseInt(hacia.slice(1), 16);
  const out = [16, 8, 0].map((s) => {
    const x = (a >> s) & 255, y = (b >> s) & 255;
    return Math.round(x + (y - x) * t);
  });
  return "#" + out.map((v) => v.toString(16).padStart(2, "0")).join("");
}

/* =====================================================================
   13. ESCENARIO CON VOLUMEN (estilo consola de 16 bits, colores vivos)
   Todo se genera como matrices y pasa por spriteFromRows: el contorno
   y el bisel salen solos. Las texturas se cachean y se repiten en X
   con desplazamiento de parallax.
   ===================================================================== */
const mod = (a, n) => ((a % n) + n) % n;
const texturas = new Map();
function textura(key, fabricar) {
  if (!texturas.has(key)) texturas.set(key, fabricar());
  return texturas.get(key);
}

// Matriz de un círculo relleno (para soles, arbustos, etc.)
function circuloRows(r, ch) {
  const rows = [];
  for (let y = -r; y <= r; y++) {
    let f = "";
    for (let x = -r; x <= r; x++) f += x * x + y * y <= r * r ? ch : ".";
    rows.push(f);
  }
  return rows;
}

// Colina periódica: fnAlt(x) da la altura de la cima en cada columna
function texColinas(key, ancho, color, fnAlt, contorno = false) {
  return textura(key, () => {
    const alto = H_MIN; // las capas son de diseño: no dependen del tamaño de pantalla
    const rows = [];
    for (let y = 0; y < alto; y++) rows.push("");
    for (let x = 0; x < ancho; x++) {
      const top = Math.round(fnAlt(x));
      for (let y = 0; y < alto; y++) rows[y] += y >= top ? "c" : ".";
    }
    const sp = spriteFromRows(expandir(rows), { c: color }, contorno, true);
    sp.tw = ancho;
    return sp;
  });
}

// Pinta una capa periódica con parallax (factor = fracción de la cámara)
function capaPeriodica(sp, camX, factor, y) {
  const off = mod(Math.floor(camX * factor), sp.tw);
  for (let x = -off; x < W; x += sp.tw) drawSprite(sp, x, y);
}

// Sol con borde de luz y contorno
function dibujarSol(pal, x, y) {
  const color = pal.sol || "#ffe36b";
  const sp = textura("sol-" + color, () => spriteFromRows(expandir(circuloRows(11, "c")), { c: color }));
  drawSprite(sp, x, y);
}

// Pirámide con bloques de piedra: cara iluminada a la izquierda, sombra a la derecha
function texPiramide(alto, base, pal) {
  return textura("piramide-" + alto + "-" + base, () => {
    const rows = [];
    const cx = base / 2;
    for (let y = 0; y < alto; y++) {
      const mitad = ((y + 1) / alto) * cx;
      let f = "";
      for (let x = 0; x < base; x++) {
        const dx = x + 0.5 - cx;
        if (Math.abs(dx) > mitad) { f += "."; continue; }
        const hilada = y % 7 === 6;
        f += hilada ? "m" : dx < 0 ? "l" : "d";
      }
      rows.push(f);
    }
    return spriteFromRows(expandir(rows), { l: pal.piedraClara, d: pal.piedraOscura, m: pal.piedraJunta }, true);
  });
}

// Escenario de desierto: pirámides, dunas y sol fuerte
function escenaDesierto(cam, pal) {
  const pir = texPiramide(74, 96, pal);
  const off = mod(cam.x * 0.3, 360);
  for (let k = -1; k < 4; k++) drawSprite(pir, k * 170 - off, 176 - 74);
  const dunas = texColinas("dunas-" + pal.cerca, 512, pal.cerca,
    (x) => 130 + Math.sin((x / 512) * Math.PI * 4) * 16 + Math.sin((x / 512) * Math.PI * 9) * 5, true);
  capaPeriodica(dunas, cam.x, 0.45, 0);
}

// Suelo de bloques.js bajo el área de diseño (solo si la pantalla es más alta)
function pintarExtension(pal, tema) {
  const ch = TERRENO_DE_TEMA[tema] || "#";
  for (let y = OY + H_MIN; y < H; y += TILE) {
    const sp = Bloques.sprite(ch + "|" + (y === OY + H_MIN ? "1000" : "0000"));
    for (let x = 0; x < W; x += TILE) drawSprite(sp, x, y);
  }
}

// Escala del fondo de bloques.js: su horizonte (144 unidades) cae sobre el suelo del nivel
const ESC_FONDO = (GY * TILE) / 144;

// Fondo del escenario. El cielo, el sol o la luna, las nubes y las montañas vienen de bloques.js
// y cambian con la hora (0 amanecer, 0.25 día, 0.5 atardecer, 0.75 noche); la cueva usa roca.
// lv (opcional): el nivel, de donde salen su clima, su cascada y si hay hojas y luciérnagas
function dibujarFondo(cam, pal, tema, hora, lv) {
  const clima = lv ? lv.clima : null, t = performance.now() / 1000;
  if (tema === "castillo") {
    escenaCastillo(cam, pal);
    if (clima) Bloques.clima(ctx, W, H, t, clima);   // niebla del foso: entre el castillo y las piezas
    return;
  }
  // El cielo llega hasta arriba de la pantalla, también en las pantallas altas (OY > 0)
  ctx.save();
  ctx.translate(0, OY);
  ctx.scale(ESC_FONDO, ESC_FONDO);
  Bloques.fondo(ctx, cam.x, 0, W / ESC_FONDO, (H - OY) / ESC_FONDO, t,
    { hora: hora, ambiente: tema === "cueva" ? "cueva" : "cielo", clima: clima, cascada: !!(lv && lv.cascada),
      colinas: tema !== "desierto", arriba: OY / ESC_FONDO });
  // Hojas que caen y luciérnagas: solo en el bosque y sin clima (como en la demo de bloques.js)
  if (lv && lv.particulas && !clima) Bloques.particulas(ctx, W / ESC_FONDO, (H - OY) / ESC_FONDO, t, cam.x, hora);
  ctx.restore();
  // En el desierto, las dunas y las pirámides van encima del cielo
  if (tema === "desierto") {
    ctx.save();
    ctx.translate(0, OY);
    escenaDesierto(cam, pal);
    ctx.restore();
  }
  if (H > OY + H_MIN) pintarExtension(pal, tema);
}

/* =====================================================================
   13b. TILES CON BISELADO (cacheados por tema y por "tiene hierba")
   ===================================================================== */
// Castillo del mapa: dos hileras de almenas, cuerpo liso y puerta oscura
function castilloRows() {
  const rows = [];
  for (let y = 0; y < 16; y++) {
    let f = "";
    for (let x = 0; x < 16; x++) {
      const dentro = x > 0 && x < 15;
      if (y < 3 && (!dentro || x % 4 >= 2)) f += ".";           // huecos entre almenas
      else if (!dentro) f += ".";
      else if (y >= 10 && x >= 6 && x <= 9) f += "d";            // puerta
      else f += "c";
    }
    rows.push(f);
  }
  return rows;
}

/* =====================================================================
   13c. ESCENARIO DE CASTILLO: atardecer, torres lejanas, muro de piedra y antorchas
   ===================================================================== */
// Torres recortadas contra el cielo (periódicas, apoyadas en el suelo de diseño)
function texTorres() {
  return textura("torres", () => {
    const ancho = 512, base = 176;
    const torres = [[30, 46, 120], [150, 34, 96], [262, 52, 136], [390, 40, 104]]; // [x, ancho, alto]
    const rows = [];
    for (let y = 0; y < H_MIN; y++) {
      let f = "";
      for (let x = 0; x < ancho; x++) {
        let ch = ".";
        for (const [tx, tw, th] of torres) {
          if (x < tx || x >= tx + tw || y < base - th || y >= base) continue;
          const merlon = y < base - th + 8 && (x - tx) % 8 >= 5;   // almenas en lo alto
          if (merlon) continue;
          const ventana = x >= tx + tw / 2 - 2 && x <= tx + tw / 2 + 1 && y >= base - th + 16 && y <= base - th + 26;
          ch = ventana ? "w" : "c";
        }
        f += ch;
      }
      rows.push(f);
    }
    const sp = spriteFromRows(expandir(rows), { c: "#3a2b52", w: "#ffd23f" }, false, true, false);
    sp.tw = ancho;
    return sp;
  });
}

// Muro de piedra con hiladas de ladrillos desfasadas (periódico)
function texMuro() {
  return textura("muro", () => {
    const ancho = 512, alto = 80;   // solo el muro de la base: de y=96 al suelo
    const rows = [];
    for (let y = 0; y < alto; y++) {
      const hilada = Math.floor(y / 8), yy = y % 8, desfase = (hilada % 2) * 8;
      let f = "";
      for (let x = 0; x < ancho; x++) {
        const bx = (x + desfase) % 16;
        f += yy === 0 || bx === 0 ? "d" : yy === 1 || bx === 1 ? "l" : "m";   // juntas, bisel de luz, piedra
      }
      rows.push(f);
    }
    const sp = spriteFromRows(expandir(rows), { m: "#4b4a5c", l: "#62617a", d: "#2c2b3b" }, false, true, false);
    sp.tw = ancho;
    return sp;
  });
}

// Antorcha con llama de tres frames (parpadeo)
const FILAS_ANTORCHA = [
  ["..r..", ".oyo.", "oyyyo", "oyyyo", ".oyo.", "..o..", "..k..", ".kkk."],
  [".r...", ".ory.", ".oyo.", "oyyyo", ".yyy.", ".oyo.", "..k..", ".kkk."],
  ["...r.", "..ryo", ".oyo.", "oyyyo", "oyyy.", "..o..", "..k..", ".kkk."],
];
function antorchaSprite(f) {
  return textura("antorcha" + f, () => spriteFromRows(expandir(FILAS_ANTORCHA[f]), { k: "#2a2a30", o: "#ff8a1e", y: "#ffe066", r: "#e0392b" }, true, false, false));
}

function escenaCastillo(cam, pal) {
  // Atardecer: de púrpura arriba a naranja cerca del horizonte
  const horizonte = OY + 176;
  rect(0, 0, W, H, pal.cielo);
  const banda = Math.ceil(horizonte / 8);
  for (let i = 0; i < 8; i++) rect(0, i * banda, W, banda, mezclar(pal.cielo, i * 0.1, "#ff9a5a"));
  dibujarSol(pal, W - 70, 56 + OY * 0.2);
  ctx.save();
  ctx.translate(0, OY);
  capaPeriodica(texTorres(), cam.x, 0.2, 0);
  capaPeriodica(texMuro(), cam.x, 0.5, 96);
  // Antorchas sobre el muro, con parpadeo
  const fr = Math.floor(performance.now() / 110) % 3;
  const off = mod(cam.x * 0.5, 96);
  for (let k = -1; k < 6; k++) drawSprite(antorchaSprite(fr), k * 96 + 44 - off, 84);
  ctx.restore();
  pintarExtension(pal, "castillo");
}

/* =====================================================================
   11. SONIDO SENCILLO (ondas cuadradas con Web Audio, sin archivos)
   ===================================================================== */
const SFX = {
  salto: [440, 660, 0.08], giro: [520, 300, 0.12], pisar: [320, 640, 0.07],
  patear: [200, 120, 0.1], moneda: [880, 1320, 0.06], hongo: [400, 800, 0.2],
  rompe: [150, 60, 0.12], golpe: [200, 80, 0.25], vida: [500, 1000, 0.3],
  meta: [600, 900, 0.5], muerte: [400, 60, 0.7], estrella: [700, 1400, 0.4],
};
let audioCtx = null;
function tocar(nombre) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const [f0, f1, dur] = SFX[nombre] || SFX.salto;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(f0, audioCtx.currentTime);
    o.frequency.linearRampToValueAtTime(f1, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(0.04, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* sin audio: el juego sigue */ }
}
// Desbloquea el audio con la primera tecla (requisito de los navegadores)
addEventListener("keydown", () => { if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); }, { once: false });

/* =====================================================================
   12. CÁMARA CON SUAVIZADO Y LÍMITES
   ===================================================================== */
class Camera {
  constructor() { this.x = 0; this.y = 0; }
  seguir(objetivo, lvl, dt) {
    const destino = objetivo.x + objetivo.w / 2 - W / 2;
    // Suavizado exponencial: se acerca rápido pero sin tirones
    this.x += (destino - this.x) * Math.min(1, dt * 7);
    this.x = clamp(this.x, 0, lvl.cols * TILE - W);
    this.y = clamp(this.y, 0, Math.max(0, lvl.rows * TILE - H));
  }
  // Fijar cámara de golpe (al empezar el nivel)
  centrar(objetivo, lvl) {
    this.x = clamp(objetivo.x + objetivo.w / 2 - W / 2, 0, lvl.cols * TILE - W);
    this.y = 0;
  }
}

/* =====================================================================
   14. NIVEL EN EJECUCIÓN
   Crea entidades a partir de los datos, actualiza y dibuja.
   ===================================================================== */
