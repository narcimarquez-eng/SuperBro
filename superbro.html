<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SuperBro</title>
<style>
  /* Paleta de la interfaz: tonos fijos tipo SNES, sin degradados */
  :root {
    --bg: #0c0f1d;
    --panel: #1d2240;
    --line: #f8f8f8;
    --txt: #ffffff;
    --gold: #ffd23f;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: "Courier New", monospace;
    color: var(--txt);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* El canvas ocupa todo el área visible; su resolución interna la calcula el script */
  canvas {
    position: fixed;
    left: 0;
    top: 0;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    background: #000;
  }
  /* Controles táctiles: solo se muestran en pantallas con puntero "grueso" */
  #pad {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 150px;
    pointer-events: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #pad .grupo { position: absolute; bottom: 12px; display: flex; gap: 10px; pointer-events: auto; }
  #pad .izq { left: 14px; }
  #pad .der { right: 14px; align-items: flex-end; }
  #pad button {
    width: 58px; height: 58px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.8);
    background: rgba(0,0,0,0.35);
    color: #fff;
    font: bold 14px "Courier New", monospace;
    touch-action: none;
  }
  #pad button.on { background: rgba(255,255,255,0.45); }
  #pad button.peq { width: 40px; height: 40px; font-size: 11px; }
  #pad .top { position: absolute; top: 8px; right: 8px; display: flex; gap: 8px; pointer-events: auto; }
  @media (pointer: coarse) {
    #pad { display: block; }
    #hint { display: none; }
  }
  #hint {
    position: fixed;
    bottom: 6px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    opacity: 0.55;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c" width="256" height="224"></canvas>
<div id="pad">
  <div class="grupo izq">
    <button data-act="left">&#9664;</button>
    <button data-act="right">&#9654;</button>
  </div>
  <div class="grupo der">
    <button class="peq" data-act="item">ITEM</button>
    <button class="peq" data-act="spin">GIRO</button>
    <button data-act="run">X</button>
    <button data-act="jump">SALTO</button>
  </div>
  <div class="top">
    <button class="peq" data-act="enter">OK</button>
    <button class="peq" data-act="pause">II</button>
  </div>
</div>
<div id="hint">Flechas: mover · Z/Espacio: saltar · X: correr/disparar · C/Shift: salto giratorio · Q: usar potenciador · Enter: entrar · P/Esc: pausa</div>
<script>
"use strict";

/* =====================================================================
   1. CONSTANTES Y UTILIDADES BASE
   ===================================================================== */
// Resolución interna: se calcula según la pantalla (ver resize). Mínimo de diseño 256x224.
const W_MIN = 256;
const H_MIN = 224;
// Densidad del arte: cada píxel lógico del juego se dibuja con U×U píxeles reales.
// La lógica y las medidas del juego no cambian; el canvas y el arte ganan detalle.
const U = 2;
let W = W_MIN;             // ancho interno actual
let H = H_MIN;             // alto interno actual
let OY = 0;                // desplazamiento vertical del área de diseño (cielo arriba, suelo para los botones abajo)
const TOUCH = matchMedia("(pointer: coarse)").matches;
const ALTO_BOTONES_PX = 150; // alto reservado a los botones táctiles, en píxeles del dispositivo
const TILE = 16;           // tamaño de tile en píxeles
const GRAVITY = 900;       // px/s²
const MAX_FALL = 360;      // velocidad máxima de caída
const SAVE_KEY = "superbro_save_v2";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

/* Llena toda la pantalla con la MENOR resolución interna posible:
   - el alto de diseño es 224 px (mínimo) y el ancho crece en horizontal
   - en vertical el ancho de diseño es 256 px (mínimo) y el alto crece
   Así no hay bandas negras y cada píxel del juego sigue siendo cuadrado. */
function resize() {
  const vv = window.visualViewport;
  const sw = Math.max(1, Math.round(vv ? vv.width : innerWidth));
  const sh = Math.max(1, Math.round(vv ? vv.height : innerHeight));
  const a = sw / sh;
  if (a >= W_MIN / H_MIN) { H = H_MIN; W = Math.round(H_MIN * a); }
  else { W = W_MIN; H = Math.round(W_MIN / a); }
  // En vertical con botones táctiles se reserva una franja inferior (suelo) para ellos
  const reserva = TOUCH && H > H_MIN ? Math.round(ALTO_BOTONES_PX * H / sh) : 0;
  OY = Math.max(0, H - H_MIN - reserva);
  canvas.width = W * U;
  canvas.height = H * U;
  canvas.style.width = sw + "px";
  canvas.style.height = sh + "px";
  ctx.imageSmoothingEnabled = false; // al cambiar el tamaño el contexto se reinicia
}
addEventListener("resize", resize);
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
resize();

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const aabb = (a, b) =>
  a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* =====================================================================
   2. PALETA SNES LIMITADA
   Cada tema de mundo solo reemplaza algunos de estos colores.
   ===================================================================== */
const PAL = {
  k: "#000000", // negro / contorno
  w: "#ffffff",
  r: "#e52521", // rojo Mario-like (propio, no copiado)
  b: "#2f5fd6", // azul
  y: "#ffd23f", // amarillo
  o: "#f88c14", // naranja
  s: "#fcc4a8", // piel
  br: "#7c4a1e", // marrón
  g: "#43b043", // verde
  dg: "#1f6b2a", // verde oscuro
  d: "#1f6b2a",  // sombra de verde (caparazones y plantas)
  // Tonos de sombreado del personaje (estilo SNES: claro, medio y oscuro)
  R: "#8c1a14", // rojo oscuro
  S: "#f6b99a", // piel
  B: "#1d3c8c", // azul oscuro
  gr: "#8a8fa6", // gris
  dgr: "#3b3f55", // gris oscuro
  lb: "#6ec8ff", // celeste
  pk: "#ff6fa8", // rosa
};

/* =====================================================================
   3. SPRITES POR MATRIZ DE CARACTERES
   Cada carácter de la matriz es una clave de PAL. "." = transparente.
   Se pre-renderizan a canvas para dibujar rápido.
   ===================================================================== */
const spriteCache = new Map();

/* Amplía una matriz lógica: cada carácter ocupa U×U píxeles reales */
function expandir(rows) {
  const out = [];
  for (const r of rows) {
    let f = "";
    for (const ch of r) f += ch.repeat(U);
    for (let k = 0; k < U; k++) out.push(f);
  }
  return out;
}

/* Convierte una matriz de píxeles reales en un sprite con volumen:
   - contorno negro de 1 píxel real alrededor (opcional)
   - bisel: los bordes que miran arriba/izquierda se aclaran y los que miran
     abajo/derecha se oscurecen (solo para siluetas de color plano)
   El sprite guarda sus medidas lógicas: lw, lh (tamaño) y pad (margen). */
const cacheBisel = new Map();
function spriteFromRows(rows, pal = PAL, contorno = true, periodico = false, bisel = true) {
  const h = rows.length;
  const w = Math.max(...rows.map((r) => r.length));
  const P = 1;                       // margen de contorno en píxeles reales
  const c = document.createElement("canvas");
  c.width = w + 2 * P;
  c.height = h + 2 * P;
  const g = c.getContext("2d");
  // En texturas periódicas (que se repiten en X) el borde izquierdo y el derecho son vecinos
  const op = (x, y) => {
    if (periodico) x = ((x % w) + w) % w;
    if (y < 0 || y >= h || (!periodico && (x < 0 || x >= w))) return false;
    const ch = rows[y][x];
    return !!ch && ch !== "." && pal[ch] !== undefined;
  };
  const esContorno = (x, y) => !op(x, y) && (op(x - 1, y) || op(x + 1, y) || op(x, y - 1) || op(x, y + 1));
  const colorDe = (x, y) => {
    const ch = rows[y][x];
    let col = pal[ch];
    if (bisel && ch !== "k" && ch !== "w") {
      const luz = !op(x, y - 1) || !op(x - 1, y);
      const sombra = !op(x, y + 1) || !op(x + 1, y);
      if (luz !== sombra) {
        const clave = col + (luz ? "L" : "S");
        if (!cacheBisel.has(clave)) cacheBisel.set(clave, mezclar(col, luz ? 0.45 : 0.4, luz ? "#ffffff" : "#000000"));
        col = cacheBisel.get(clave);
      }
    }
    return col;
  };
  // Pinta tramos horizontales del mismo color (menos llamadas a fillRect)
  const tramo = (x0, y0, len, col) => { g.fillStyle = col; g.fillRect(x0, y0, len, 1); };
  if (contorno) {
    for (let y = -1; y <= h; y++) {
      let x = -1;
      while (x <= w) {
        if (!esContorno(x, y)) { x++; continue; }
        let x2 = x + 1;
        while (x2 <= w && esContorno(x2, y)) x2++;
        tramo(x + P, y + P, x2 - x, PAL.k);
        x = x2;
      }
    }
  }
  for (let y = 0; y < h; y++) {
    let x = 0;
    while (x < w) {
      if (!op(x, y)) { x++; continue; }
      const col = colorDe(x, y);
      let x2 = x + 1;
      while (x2 < w && op(x2, y) && colorDe(x2, y) === col) x2++;
      tramo(x + P, y + P, x2 - x, col);
      x = x2;
    }
  }
  c.pad = P / U;   // margen en unidades lógicas
  c.lw = w / U;    // ancho lógico del dibujo
  c.lh = h / U;    // alto lógico del dibujo
  return c;
}

// Devuelve el canvas de un sprite lógico (matriz de caracteres), cacheado por clave
function getSprite(key, rows, pal) {
  if (!spriteCache.has(key)) spriteCache.set(key, spriteFromRows(expandir(rows), pal));
  return spriteCache.get(key);
}

// Dibuja un sprite en coordenadas lógicas (la cámara ya restada).
// El contexto tiene transform U, así que el tamaño lógico es sp.width / U.
function drawSprite(sp, x, y, flipX = false) {
  const pad = sp.pad || 0;
  const dw = sp.width / U, dh = sp.height / U;
  x = Math.round(x) - pad;
  y = Math.round(y) - pad;
  if (flipX) {
    ctx.save();
    ctx.translate(x + dw, y);
    ctx.scale(-1, 1);
    ctx.drawImage(sp, 0, 0, dw, dh);
    ctx.restore();
  } else {
    ctx.drawImage(sp, x, y, dw, dh);
  }
}

// Rectángulo sólido de color fijo (para bloques, HUD, fondos)
function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}

/* =====================================================================
   4. ENTRADA
   Estados "pressed" (flanco de subida) y "held" (mantenido).
   ===================================================================== */
const keys = {};     // tecla -> true mientras está pulsada
const pressed = {};  // tecla -> true solo el frame en que se pulsó
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left",
  ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up",
  ArrowDown: "down", KeyS: "down",
  Space: "jump", KeyZ: "jump",
  KeyX: "run",
  KeyC: "spin", ShiftLeft: "spin", ShiftRight: "spin",
  Enter: "enter",
  KeyP: "pause", Escape: "pause",
  KeyQ: "item",
};
const held = { left: 0, right: 0, up: 0, down: 0, jump: 0, run: 0, spin: 0, enter: 0, pause: 0, item: 0 };

addEventListener("keydown", (e) => {
  const act = KEYMAP[e.code];
  if (!act) return;
  e.preventDefault();
  if (!e.repeat) pressed[act] = true;
  held[act] = 1;
});
addEventListener("keyup", (e) => {
  const act = KEYMAP[e.code];
  if (!act) return;
  held[act] = 0;
});
// Al perder el foco se sueltan todas las teclas para evitar "teclas pegadas"
addEventListener("blur", () => {
  for (const k in held) held[k] = 0;
});

/* Botones táctiles: cada botón con data-act se comporta como una tecla */
document.querySelectorAll("#pad [data-act]").forEach((b) => {
  const act = b.dataset.act;
  b.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    b.setPointerCapture(e.pointerId);
    held[act] = 1;
    pressed[act] = true;   // flanco de subida, igual que una tecla
    b.classList.add("on");
  });
  const soltar = () => { held[act] = 0; b.classList.remove("on"); };
  b.addEventListener("pointerup", soltar);
  b.addEventListener("pointercancel", soltar);
  b.addEventListener("lostpointercapture", soltar);
});

// Consume un "pressed" para que solo actúe una vez por pulsación
function consume(action) {
  if (pressed[action]) {
    pressed[action] = false;
    return true;
  }
  return false;
}
/*
  bloques.js: mapa de bloques para un juego de plataformas en Canvas.

  Medidas:
    TILE = 16     el nivel va en una cuadrícula de 16 × 16 píxeles lógicos
    U    = 2      el arte se dibuja al doble de densidad: 1 bloque = 32 × 32 píxeles reales

  Para que el arte salga nítido, el contexto debe tener escala U (o U × zoom) antes de dibujar:
    ctx.setTransform(U * zoom, 0, 0, U * zoom, 0, 0);

  Leyenda del mapa (un carácter por bloque):
    ' '  aire (vacío)

    Terrenos (sólidos). Sus bordes se dibujan solos según los bloques vecinos:
    '#'  hierba sobre tierra        'A'  arena (desierto)
    'N'  nieve sobre hielo          'R'  roca (cueva)
    'W'  madera (puentes, muelles)  'I'  hielo

    Bloques:
    '='  ladrillo; se rompe al golpearlo desde abajo
    '?'  interrogación; al golpearlo suelta una moneda y queda como 'x'
    'x'  bloque vacío (ya golpeado)
    'X'  piedra suelta (sólida)
    'P' 'Q'  boca de tubería izquierda y derecha (fila de arriba)
    'p' 'q'  cuerpo de tubería izquierda y derecha (debajo de la boca)
    '-'  plataforma de una dirección: se pisa solo desde arriba

    Escaleras y barras:
    'L'  escalera: se sube y se baja (no es sólida)
    'B'  barra o poste: se baja deslizándose (no es sólida)

    Inicio, meta, objetos:
    'S'  inicio del nivel (punto de aparición del jugador)
    'E'  meta (bandera): tocarla completa el nivel
    'o'  moneda (no es sólida; se recoge al tocarla)
    '^'  pinchos (peligro)
    '~'  lava (peligro)

    Decoración (no es sólida; se dibuja detrás de los bloques):
    'T'  copa de árbol   'k'  tronco     'b'  arbusto   'f'  flor   'K'  cactus
    'c'  muro   'm'  muro con almenas   'g'  ventana   'u'  puerta   'F'  bandera
    'h'  hierba alta   'r'  roca   'C'  cascada (anim.)   'l'  agua (anim.)   'y'  agua profunda
    'd' 'e' 'j'  tejado (izq., centro, der.)   'v'  pared de madera   'a'  antorcha (anim.)

  Uso:
    const mundo = Bloques.crear(Bloques.NIVEL_EJEMPLO, Bloques.NIVEL_DECOR);  // decor: opcional
    const sp = mundo.spawn;                                // {x, y} o null
    const r = mundo.resolver({ x, y, w, h }, vx, vy, dt);  // mueve la caja y la para con los bloques
    //   r.x, r.y, r.vx, r.vy, r.enSuelo, r.golpeTecho ({col, row} o null)
    if (r.golpeTecho) mundo.golpear(r.golpeTecho.col, r.golpeTecho.row);
    mundo.recoger(caja);          // recoge monedas, devuelve cuántas
    mundo.peligroEn(caja);        // true si la caja toca pinchos o lava
    mundo.enEscalera(caja);       // 'L', 'B' o null
    mundo.metaEn(caja);           // true si la caja toca la meta
    Bloques.fondo(ctx, camX, camY, vistaW, vistaH, tiempo, { hora: 0.25, ambiente: 'cielo' });
    //   hora: 0 amanecer, 0.25 día, 0.5 atardecer, 0.75 noche;  ambiente: 'cielo' | 'cueva'
    mundo.dibujar(ctx, camX, camY, vistaW, vistaH, tiempo);
    mundo.solid(x, y);            // para los enemigos (mundo.tile = 16)
*/
(function (global) {
  'use strict';

  const TILE = 16;
  const U = 2;
  const EPS = 0.001;

  const TERRENOS = '#ANRWI';
  const SOLIDOS = '#=?xXPQpq' + 'ANRWI' + 'M';
  const MUELLE = 'M';
  const MUELLE_FUERZA = 470;   // px/s: el salto normal es -330 y el muelle lanza más alto
  const MUELLE_TIEMPO = 0.14;  // s que el muelle se queda comprimido tras pisarlo
  const UNIDIRECCIONAL = '-';
  const PELIGRO = '^~';
  const ESCALERA = 'L';
  const BARRA = 'B';
  const INICIO = 'S';
  const META = 'E';
  const COLECCION = 'o';
  const FRAMES_MONEDA = 8;

  /* ---------- Arte: sprites de 32 × 32 píxeles, dibujados con gradientes, bordes y brillos ----------
     Estilo "pulido" de juego de consola: contorno oscuro, degradados de tres tonos, bisel,
     brillo especular y sombras suaves. Todo se dibuja en una cuadrícula de 16 unidades. */

  const cache = {};
  const OUT = '#2a1a10';          // color del contorno
  const OUT_SUAVE = 'rgba(42,26,16,0.55)';

  // Número determinista 0..10 por celda: da variación sin depender del azar
  function ruido(x, y) { return ((x * 37 + y * 91 + x * y * 13) >>> 0) % 11; }

  function hacerSprite(dibuja) {
    const c = document.createElement('canvas');
    c.width = c.height = TILE * U;
    const g = c.getContext('2d');
    g.scale(U, U);
    g.imageSmoothingEnabled = true;
    dibuja(g);
    return c;
  }

  // Rectángulo redondeado (sin trazar)
  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r);
    g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }

  // Degradado vertical o horizontal con varias paradas (colores de luz a sombra)
  function grad(g, x0, y0, x1, y1, cols) {
    const d = g.createLinearGradient(x0, y0, x1, y1);
    cols.forEach(function (c, i) { d.addColorStop(i / (cols.length - 1), c); });
    return d;
  }

  function radial(g, x, y, r0, r1, cols) {
    const d = g.createRadialGradient(x, y, r0, x, y, r1);
    cols.forEach(function (c, i) { d.addColorStop(i / (cols.length - 1), c); });
    return d;
  }

  // Brillo especular: una elipse blanca suave
  function brillo(g, x, y, rx, ry, a) {
    g.save();
    g.globalAlpha = a;
    g.fillStyle = '#ffffff';
    g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill();
    g.restore();
  }

  // Contorno de la forma actual
  function trazar(g, color, ancho) {
    g.strokeStyle = color || OUT;
    g.lineWidth = ancho || 0.9;
    g.lineJoin = 'round';
    g.stroke();
  }

  /* Terrenos: [luz, medio, sombra] para el cuerpo y para la capa de arriba (cap) */
  const TERR = {
    '#': { cap: ['#d8ff9a', '#6ed43f', '#2f8a2a'], cuerpo: ['#e7b07a', '#c27a40', '#7a4420'], detalle: '#4fa33a', tipo: 'hierba' },
    'A': { cap: ['#fff6c8', '#ffd96a', '#d9a23c'], cuerpo: ['#ffe2a0', '#e8b35c', '#a86f2a'], detalle: '#c98a3a', tipo: 'arena' },
    'N': { cap: ['#ffffff', '#eaf6ff', '#a9d4ee'], cuerpo: ['#bfe6fb', '#73b6e0', '#2f6fa0'], detalle: '#9fd0f0', tipo: 'nieve' },
    'R': { cap: ['#d9dde6', '#9aa2b0', '#5c6474'], cuerpo: ['#b4bac6', '#7d8594', '#424a5a'], detalle: '#5c6474', tipo: 'roca' },
    'W': { cap: ['#ffd49a', '#e09a50', '#8a4f20'], cuerpo: ['#e8a866', '#b8703a', '#6a3a16'], detalle: '#7a4420', tipo: 'madera' },
    'I': { cap: ['#ffffff', '#b8f0ff', '#5cc0e6'], cuerpo: ['#e2fbff', '#86dcf2', '#2f8fc0'], detalle: '#ffffff', tipo: 'hielo' }
  };

  // Contorno de la capa de arriba con gotas en el borde inferior
  function recorridoCap(g, capH, tipo) {
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(16, 0);
    g.lineTo(16, capH - 0.5);
    for (let i = 0; i < 4; i++) {
      const x0 = 16 - i * 4, x1 = x0 - 4;
      const gota = ruido(i, 3) % 3 === 0 ? 1.6 : 0.4;
      const alto = tipo === 'nieve' ? gota * 1.4 : gota;
      g.quadraticCurveTo((x0 + x1) / 2, capH + alto, x1, capH - 0.5);
    }
    g.lineTo(0, 0);
    g.closePath();
  }

  // Dibuja un terreno. arr/izq/der/aba: true si ese lado da al aire (se ve el borde)
  function dibujarTerreno(g, ch, arr, izq, der, aba) {
    const P = TERR[ch];
    const cu = P.cuerpo, cap = P.cap;
    const capH = arr ? 4.5 : 0;

    // Cuerpo: degradado de tres tonos y bisel
    g.fillStyle = grad(g, 0, 0, 0, 16, cu);
    rr(g, 0, capH - 1, 16, 16 - (capH - 1), 2.5);
    g.fill();

    // Textura: motas suaves
    g.save();
    g.globalAlpha = 0.28;
    g.fillStyle = P.detalle;
    for (let y = 0; y < 16; y += 2) {
      for (let x = 0; x < 16; x += 2) {
        if (y > capH && ruido(x, y) === 0) { g.beginPath(); g.arc(x + 1, y + 1, 0.9, 0, Math.PI * 2); g.fill(); }
      }
    }
    g.restore();

    if (P.tipo === 'madera') {
      g.save(); g.globalAlpha = 0.45; g.strokeStyle = cu[2]; g.lineWidth = 0.6;
      [6, 10, 14].forEach(function (y) { g.beginPath(); g.moveTo(0, y); g.lineTo(16, y); g.stroke(); });
      g.beginPath(); g.moveTo(8, capH); g.lineTo(8, 16); g.stroke();
      g.restore();
    } else if (P.tipo === 'roca') {
      g.strokeStyle = cu[2]; g.lineWidth = 0.7;
      g.beginPath(); g.moveTo(4, 8); g.lineTo(7, 11); g.lineTo(6, 14); g.stroke();
      g.beginPath(); g.moveTo(11, 9); g.lineTo(13, 12); g.stroke();
    } else if (P.tipo === 'hielo') {
      g.fillStyle = 'rgba(255,255,255,0.35)';
      g.beginPath(); g.moveTo(2, capH + 2); g.lineTo(7, capH + 1); g.lineTo(3, capH + 6); g.closePath(); g.fill();
    } else if (P.tipo === 'arena') {
      g.fillStyle = 'rgba(160,100,40,0.35)';
      [[4, 9], [11, 12], [7, 13]].forEach(function (p) { g.beginPath(); g.arc(p[0], p[1], 0.8, 0, Math.PI * 2); g.fill(); });
    }

    // Bisel: luz arriba, sombra abajo
    g.save();
    g.globalAlpha = 0.5;
    g.strokeStyle = '#ffffff';
    g.lineWidth = 0.7;
    g.beginPath(); g.moveTo(2, capH + 1.5); g.lineTo(14, capH + 1.5); g.stroke();
    g.restore();

    // Capa de arriba
    if (arr) {
      recorridoCap(g, capH, P.tipo);
      g.fillStyle = grad(g, 0, 0, 0, capH + 2, cap);
      g.fill();
      g.save(); g.clip();
      if (P.tipo === 'hierba') {
        g.fillStyle = '#3f9a2c';
        for (let x = 1; x < 16; x += 3) { g.beginPath(); g.moveTo(x, capH - 1); g.lineTo(x + 1, capH + 0.6 + (ruido(x, 2) % 2)); g.lineTo(x + 2, capH - 1); g.fill(); }
      } else if (P.tipo === 'nieve') {
        g.fillStyle = 'rgba(160,200,230,0.5)';
        g.fillRect(0, 0, 16, 1);
      } else if (P.tipo === 'roca') {
        g.strokeStyle = cap[2]; g.lineWidth = 0.6;
        g.beginPath(); g.moveTo(5, 1); g.lineTo(7, 3); g.lineTo(9, 2); g.stroke();
      } else if (P.tipo === 'madera') {
        g.fillStyle = cap[2];
        g.fillRect(0, 2.6, 16, 0.5);
        [3, 13].forEach(function (x) { g.beginPath(); g.arc(x, 1.2, 0.6, 0, Math.PI * 2); g.fill(); });
      }
      g.restore();
      brillo(g, 8, 1.2, 5.5, 0.9, 0.6);
      recorridoCap(g, capH, P.tipo);
      trazar(g, OUT, 0.8);
    }

    // Contorno solo en los lados que dan al aire
    g.save();
    g.strokeStyle = OUT; g.lineWidth = 0.9; g.lineJoin = 'round';
    if (izq) { g.beginPath(); g.moveTo(0.5, capH + 0.5); g.lineTo(0.5, 15.5); g.stroke(); }
    if (der) { g.beginPath(); g.moveTo(15.5, capH + 0.5); g.lineTo(15.5, 15.5); g.stroke(); }
    if (aba) { g.beginPath(); g.moveTo(0.5, 15.5); g.lineTo(15.5, 15.5); g.stroke(); }
    g.restore();
  }

  function dibujarLadrillo(g) {
    g.fillStyle = grad(g, 0, 0, 0, 16, ['#ff9a6a', '#dd5a2e', '#9a2e12']);
    rr(g, 0, 0, 16, 16, 2); g.fill();
    // hiladas de ladrillos con bisel
    for (let fila = 0; fila < 4; fila++) {
      const y = fila * 4;
      const off = fila % 2 ? 4 : 0;
      g.strokeStyle = '#5a1e0a'; g.lineWidth = 0.8;
      g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(16, y + 0.5); g.stroke();
      [off, (off + 8) % 16].forEach(function (x) {
        g.beginPath(); g.moveTo(x + 0.5, y); g.lineTo(x + 0.5, y + 4); g.stroke();
      });
      g.fillStyle = 'rgba(255,255,255,0.22)';
      g.fillRect(0, y + 1, 16, 0.6);
    }
    brillo(g, 6, 2.2, 4.5, 1, 0.45);
    rr(g, 0.5, 0.5, 15, 15, 2); trazar(g, OUT, 1);
  }

  function dibujarInterrogacion(g) {
    g.fillStyle = grad(g, 0, 0, 0, 16, ['#fff3a0', '#ffc620', '#d98a00']);
    rr(g, 0, 0, 16, 16, 2.5); g.fill();
    // bisel interior: marco claro arriba, sombra abajo
    g.save();
    rr(g, 1.6, 1.6, 12.8, 12.8, 2); g.lineWidth = 1; g.strokeStyle = 'rgba(255,255,255,0.55)'; g.stroke();
    g.beginPath(); g.moveTo(3, 14.4); g.lineTo(13, 14.4); g.strokeStyle = 'rgba(120,60,0,0.35)'; g.lineWidth = 0.9; g.stroke();
    g.restore();
    // remaches
    [[3.2, 3.2], [12.8, 3.2], [3.2, 12.8], [12.8, 12.8]].forEach(function (p) {
      g.fillStyle = radial(g, p[0] - 0.4, p[1] - 0.4, 0.2, 1.4, ['#ffffff', '#e0a040', '#8a5a10']);
      g.beginPath(); g.arc(p[0], p[1], 1.1, 0, Math.PI * 2); g.fill();
    });
    // signo de interrogación con relieve
    g.font = 'bold 11.5px Arial, Helvetica, sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.lineJoin = 'round';
    g.lineWidth = 2.2; g.strokeStyle = '#8a4a00';
    g.strokeText('?', 8, 8.6);
    g.fillStyle = '#fff8dc';
    g.fillText('?', 8, 8.2);
    brillo(g, 6, 2.6, 4.4, 1.1, 0.5);
    rr(g, 0.5, 0.5, 15, 15, 2.5); trazar(g, OUT, 1);
  }

  function dibujarVacio(g) {
    g.fillStyle = grad(g, 0, 0, 0, 16, ['#c9925a', '#8a5a2a', '#4e2e12']);
    rr(g, 0, 0, 16, 16, 2.5); g.fill();
    g.strokeStyle = 'rgba(40,20,8,0.5)'; g.lineWidth = 0.6;
    [4, 8, 12].forEach(function (x) { g.beginPath(); g.moveTo(x, 1); g.lineTo(x + 0.3, 15); g.stroke(); });
    [[3, 3], [13, 3], [3, 13], [13, 13]].forEach(function (p) {
      g.fillStyle = radial(g, p[0] - 0.4, p[1] - 0.4, 0.2, 1.3, ['#e8d0a0', '#9a7040', '#3a2010']);
      g.beginPath(); g.arc(p[0], p[1], 1.1, 0, Math.PI * 2); g.fill();
    });
    brillo(g, 6, 2, 5, 0.9, 0.35);
    rr(g, 0.5, 0.5, 15, 15, 2.5); trazar(g, OUT, 1);
  }

  function dibujarPiedra(g) {
    g.fillStyle = radial(g, 6, 5, 1, 12, ['#eef0f4', '#a8afbc', '#5a6272']);
    rr(g, 0, 0, 16, 16, 4); g.fill();
    g.strokeStyle = 'rgba(40,44,54,0.6)'; g.lineWidth = 0.7;
    g.beginPath(); g.moveTo(4, 7); g.lineTo(7, 9); g.lineTo(6, 12); g.stroke();
    g.beginPath(); g.moveTo(11, 10); g.lineTo(13, 13); g.stroke();
    brillo(g, 5.5, 3.5, 3.5, 1.4, 0.6);
    rr(g, 0.5, 0.5, 15, 15, 4); trazar(g, OUT, 1);
  }

  // Tubería: cilindro con sombreado horizontal y boca con borde
  function dibujarTuberia(g, lado, boca) {
    const cuerpo = ['#1e6e36', '#4fd08a', '#b8ffd6', '#4fd08a', '#1e6e36'];
    if (boca) {
      g.fillStyle = grad(g, 0, 0, 0, 5, ['#c8ffe0', '#41c27a', '#1e6e36']);
      rr(g, 0, 0, 16, 5.5, 1.5); g.fill();
      brillo(g, lado === 'izq' ? 5 : 11, 1.6, 3, 0.6, 0.7);
      g.fillStyle = 'rgba(20,70,40,0.5)';
      g.fillRect(0, 4.4, 16, 1.1);
      rr(g, 0.5, 0.5, 15, 4.5, 1.5); trazar(g, OUT, 0.9);
      g.fillStyle = grad(g, 0, 5, 0, 16, ['#2a8a4c', '#2a8a4c']);
      g.fillStyle = hgrad(g, cuerpo);
      g.fillRect(1.5, 5.5, 13, 10.5);
    } else {
      g.fillStyle = hgrad(g, cuerpo);
      g.fillRect(1.5, 0, 13, 16);
    }
    // bordes del cuerpo: el lado exterior queda más oscuro
    g.strokeStyle = OUT; g.lineWidth = 0.9;
    if (lado === 'izq') { g.beginPath(); g.moveTo(0.5, boca ? 5.5 : 0); g.lineTo(0.5, 16); g.stroke(); }
    else { g.beginPath(); g.moveTo(15.5, boca ? 5.5 : 0); g.lineTo(15.5, 16); g.stroke(); }
    // estrías del tubo
    g.fillStyle = 'rgba(10,50,25,0.25)';
    g.fillRect(4, boca ? 6 : 0, 0.5, 16);
    g.fillRect(11, boca ? 6 : 0, 0.5, 16);
    function hgrad(gg, cols) {
      const d = gg.createLinearGradient(1.5, 0, 14.5, 0);
      cols.forEach(function (c, i) { d.addColorStop(i / (cols.length - 1), c); });
      return d;
    }
  }

  function dibujarMoneda(g, frame) {
    const ang = (frame / FRAMES_MONEDA) * Math.PI * 2;
    const k = Math.max(0.2, Math.abs(Math.cos(ang)));
    g.save();
    g.translate(8, 8);
    g.scale(k, 1);
    g.fillStyle = radial(g, -1.5, -2, 0.5, 6, ['#fff8c0', '#ffd23f', '#d98a00']);
    g.beginPath(); g.arc(0, 0, 5.6, 0, Math.PI * 2); g.fill();
    g.strokeStyle = OUT; g.lineWidth = 0.9; g.stroke();
    g.strokeStyle = 'rgba(160,90,0,0.6)'; g.lineWidth = 0.6;
    g.beginPath(); g.arc(0, 0, 3.6, 0, Math.PI * 2); g.stroke();
    g.restore();
    if (k > 0.45) brillo(g, 6, 5, 1.2, 1.8, 0.85);
  }

  // Muelle: una plataforma roja sobre un resorte. Comprimido, la plataforma baja y el resorte se aprieta.
  function dibujarMuelle(g, comprimido) {
    const k = comprimido ? 3 : 0;
    // base
    g.fillStyle = grad(g, 2, 13, 2, 16, ['#8a8fa0', '#4a4e5e']);
    rr(g, 2, 13, 12, 3, 1); g.fill(); trazar(g, OUT, 0.8);
    // resorte en zigzag
    g.strokeStyle = '#c9ced9'; g.lineWidth = 1.4; g.lineJoin = 'round';
    g.beginPath();
    const yAbajo = 13, yArriba = 7 + k;
    g.moveTo(8, yAbajo);
    for (let i = 0; i < 4; i++) {
      const y = yAbajo - (i + 1) * (yAbajo - yArriba) / 4;
      g.lineTo(i % 2 ? 5 : 11, y);
    }
    g.stroke();
    g.strokeStyle = OUT; g.lineWidth = 0.4; g.stroke();
    // plataforma roja
    g.fillStyle = grad(g, 0, 4 + k, 0, 8 + k, ['#ff7a7a', '#d8322e']);
    rr(g, 1, 4 + k, 14, 4, 1.5); g.fill(); trazar(g, OUT, 0.8);
    brillo(g, 4, 5.4 + k, 3, 0.5, 0.7);
  }

  function dibujarPinchos(g) {
    for (let i = 0; i < 4; i++) {
      const x0 = i * 4 + 0.3;
      g.beginPath(); g.moveTo(x0, 15.5); g.quadraticCurveTo(x0 + 1.8, 9, x0 + 2, 3.5); g.quadraticCurveTo(x0 + 2.4, 9, x0 + 3.7, 15.5); g.closePath();
      g.fillStyle = grad(g, x0, 0, x0 + 4, 0, ['#ffffff', '#b9c4d0', '#6a7584']);
      g.fill();
      trazar(g, OUT, 0.7);
    }
    g.fillStyle = 'rgba(40,20,10,0.35)';
    g.fillRect(0, 15.2, 16, 0.8);
  }

  function dibujarPlataforma(g) {
    g.fillStyle = grad(g, 0, 3, 0, 11, ['#ffc27a', '#d98a3c', '#8a4a18']);
    rr(g, 0, 3, 16, 8, 2); g.fill();
    g.strokeStyle = 'rgba(60,30,10,0.5)'; g.lineWidth = 0.5;
    g.beginPath(); g.moveTo(1, 7); g.lineTo(15, 7); g.stroke();
    brillo(g, 8, 4.4, 6, 0.7, 0.6);
    [[2.8, 7], [13.2, 7]].forEach(function (p) {
      g.fillStyle = radial(g, p[0] - 0.3, p[1] - 0.3, 0.2, 1.2, ['#ffffff', '#b0b0b0', '#4a4a4a']);
      g.beginPath(); g.arc(p[0], p[1], 0.9, 0, Math.PI * 2); g.fill();
    });
    rr(g, 0.5, 3.5, 15, 7, 2); trazar(g, OUT, 0.9);
  }

  function dibujarLava(g) {
    g.fillStyle = grad(g, 0, 0, 0, 16, ['#ffe06a', '#ff7a1a', '#a8240c']);
    g.fillRect(0, 0, 16, 16);
    g.fillStyle = 'rgba(255,255,200,0.7)';
    [[3, 3], [9, 2], [13, 5]].forEach(function (p) { g.beginPath(); g.arc(p[0], p[1], 1, 0, Math.PI * 2); g.fill(); });
    g.fillStyle = 'rgba(80,10,0,0.35)';
    g.fillRect(0, 13, 16, 3);
    g.strokeStyle = '#ffd27a'; g.lineWidth = 0.9;
    g.beginPath(); g.moveTo(0, 3.5); g.quadraticCurveTo(4, 1.5, 8, 3.5); g.quadraticCurveTo(12, 5.5, 16, 3.5); g.stroke();
  }

  function dibujarEscalera(g) {
    // raíles con sombreado cilíndrico
    [[2, 2.4], [11.6, 2.4]].forEach(function (p) {
      g.fillStyle = grad(g, p[0], 0, p[0] + p[1], 0, ['#f0b060', '#b87030', '#6a3a14']);
      rr(g, p[0], 0, p[1], 16, 1.2); g.fill();
      trazar(g, OUT, 0.8);
    });
    [1.5, 5.5, 9.5, 13.5].forEach(function (y) {
      g.fillStyle = grad(g, 0, y, 0, y + 2.2, ['#ffd08a', '#c98a40', '#7a4a1a']);
      rr(g, 4, y, 8, 2.2, 1); g.fill();
      trazar(g, OUT, 0.6);
    });
  }

  function dibujarBarra(g) {
    g.fillStyle = grad(g, 6.5, 0, 9.5, 0, ['#ffffff', '#c8d0da', '#6a7584']);
    rr(g, 6.5, 0, 3, 16, 1); g.fill();
    trazar(g, OUT, 0.6);
    g.fillStyle = grad(g, 4.5, 0, 11.5, 0, ['#c8d0da', '#7a8594']);
    rr(g, 4.5, 13.2, 7, 2.8, 1); g.fill();
    trazar(g, OUT, 0.6);
    g.fillStyle = radial(g, 6.6, 1.6, 0.4, 3.6, ['#fff8c0', '#ffc62a', '#a06a00']);
    g.beginPath(); g.arc(8, 3, 3, 0, Math.PI * 2); g.fill();
    trazar(g, OUT, 0.7);
  }

  function dibujarInicio(g) {
    g.fillStyle = radial(g, 8, 11, 0.5, 7, ['rgba(255,255,255,0.9)', 'rgba(127,214,255,0.6)', 'rgba(127,214,255,0)']);
    g.beginPath(); g.ellipse(8, 11, 7, 3.6, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = grad(g, 0, 11, 0, 15, ['#a8f0c4', '#3cb371', '#1e6e36']);
    rr(g, 2, 11.5, 12, 3.5, 1.6); g.fill();
    trazar(g, OUT, 0.8);
    brillo(g, 8, 12.2, 4, 0.5, 0.6);
  }

  function dibujarMeta(g) {
    g.fillStyle = grad(g, 2, 0, 4, 0, ['#ffffff', '#9aa2b0', '#4a5262']);
    rr(g, 2, 0, 2.2, 16, 1); g.fill();
    trazar(g, OUT, 0.6);
    g.fillStyle = radial(g, 3, 0.5, 0.2, 1.6, ['#fff3a0', '#f2a000']);
    g.beginPath(); g.arc(3.1, 0.6, 1.2, 0, Math.PI * 2); g.fill();
    for (let fy = 0; fy < 4; fy++) {
      for (let fx = 0; fx < 5; fx++) {
        g.fillStyle = (fx + fy) % 2 ? '#ffffff' : '#262626';
        g.fillRect(4.5 + fx * 2, 1 + fy * 2, 2, 2);
      }
    }
    g.strokeStyle = OUT; g.lineWidth = 0.6;
    g.strokeRect(4.5, 1, 10, 8);
    brillo(g, 8, 2.2, 3, 0.6, 0.4);
  }

  /* ---------- Decoración: árboles, flores, cactus y castillo ---------- */

  function dibujarArbol(g) {
    // copa: esfera con luz arriba a la izquierda y sombra abajo a la derecha
    g.beginPath(); g.arc(8, 8, 6.4, 0, Math.PI * 2);
    g.fillStyle = radial(g, 6, 5, 1, 9, ['#d6ffb0', '#5cc84a', '#1f6e2a']);
    g.fill();
    g.save(); g.clip();
    g.fillStyle = 'rgba(31,110,42,0.45)';
    g.beginPath(); g.arc(13, 12.5, 4.2, 0, Math.PI * 2); g.fill();
    g.restore();
    brillo(g, 5.6, 5, 2.2, 1.1, 0.6);
    g.beginPath(); g.arc(8, 8, 6.4, 0, Math.PI * 2); trazar(g, OUT, 0.8);
  }

  function dibujarTronco(g) {
    // tronco (fila de abajo del árbol)
    g.fillStyle = grad(g, 5, 0, 11, 0, ['#f0b878', '#b07038', '#5a3418']);
    rr(g, 5.5, 0, 5, 16, 1.2); g.fill();
    trazar(g, OUT, 0.8);
  }

  function dibujarArbusto(g) {
    // tres bolas de follaje, cada una con su contorno, de atrás hacia delante
    [[4.6, 12, 3.6], [9, 10.6, 4.6], [12.6, 12.6, 3.4]].forEach(function (p) {
      g.fillStyle = radial(g, p[0] - 1.5, p[1] - 1.5, 0.5, p[2] * 2.4, ['#d8ffb0', '#4fbf3a', '#226e2a']);
      g.beginPath(); g.arc(p[0], p[1], p[2], 0, Math.PI * 2); g.fill();
      trazar(g, OUT, 0.8);
    });
    brillo(g, 7.5, 8.4, 2, 0.7, 0.5);
  }

  function dibujarFlor(g) {
    g.strokeStyle = '#2f8a2a'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(8, 16); g.quadraticCurveTo(7, 12, 8, 8); g.stroke();
    g.fillStyle = '#ff8fb3';
    [[8, 4.8], [5.6, 6.8], [10.4, 6.8], [6.4, 9.2], [9.6, 9.2]].forEach(function (p) {
      g.beginPath(); g.arc(p[0], p[1], 1.9, 0, Math.PI * 2); g.fill();
    });
    g.fillStyle = radial(g, 7.6, 6.6, 0.3, 1.6, ['#fff3a0', '#ffd23f', '#d98a00']);
    g.beginPath(); g.arc(8, 7.2, 1.4, 0, Math.PI * 2); g.fill();
  }

  function dibujarCactus(g) {
    g.fillStyle = grad(g, 5, 0, 11, 0, ['#c8ffb0', '#49b84a', '#1f6e2a']);
    rr(g, 5.5, 2, 5, 14, 2.5); g.fill(); trazar(g, OUT, 0.8);
    rr(g, 2.5, 7, 3.5, 3.5, 1.5); g.fill(); trazar(g, OUT, 0.7);
    rr(g, 10, 5, 3.5, 3.5, 1.5); g.fill(); trazar(g, OUT, 0.7);
    g.fillStyle = '#ffffff';
    [[4, 4], [12, 8], [8, 11], [6, 13]].forEach(function (p) { g.fillRect(p[0], p[1], 0.6, 0.6); });
  }

  // Castillo: piedra con sombreado, almenas, ventanas, puerta y bandera
  const PIEDRA = ['#f2eefc', '#c9c2dc', '#8a82a6'];

  function dibujarMuro(g) {
    g.fillStyle = grad(g, 0, 0, 0, 16, PIEDRA);
    g.fillRect(0, 0, 16, 16);
    g.strokeStyle = 'rgba(60,50,90,0.35)'; g.lineWidth = 0.6;
    [4, 8, 12].forEach(function (y) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(16, y + 0.5); g.stroke(); });
    [[0, 4], [8, 12]].forEach(function (p) { g.beginPath(); g.moveTo(p[0] + 0.5, 0); g.lineTo(p[0] + 0.5, 4); g.stroke(); });
    g.beginPath(); g.moveTo(4.5, 4); g.lineTo(4.5, 8); g.moveTo(12.5, 4); g.lineTo(12.5, 8); g.stroke();
    g.beginPath(); g.moveTo(0.5, 8); g.lineTo(0.5, 12); g.moveTo(8.5, 8); g.lineTo(8.5, 12); g.stroke();
    g.beginPath(); g.moveTo(4.5, 12); g.lineTo(4.5, 16); g.moveTo(12.5, 12); g.lineTo(12.5, 16); g.stroke();
  }

  function dibujarAlmena(g) {
    // muro en la parte baja; arriba, almenas con huecos entre ellas (ritmo de 8 px)
    g.save();
    g.beginPath(); g.rect(0, 4, 16, 12); g.clip();
    dibujarMuro(g);
    g.restore();
    g.fillStyle = 'rgba(60,50,90,0.35)';
    g.fillRect(0, 4, 16, 0.7);
    [0, 8].forEach(function (x) {
      g.fillStyle = grad(g, 0, 0, 0, 4.6, ['#ffffff', '#e6e0f4', '#a8a0c0']);
      rr(g, x + 0.5, 0.5, 4, 4.1, 0.8); g.fill();
      trazar(g, OUT, 0.7);
    });
  }

  function dibujarVentana(g) {
    dibujarMuro(g);
    g.fillStyle = grad(g, 0, 4, 0, 13, ['#4a4670', '#2a2748', '#14122a']);
    g.beginPath();
    g.moveTo(5, 13); g.lineTo(5, 7); g.quadraticCurveTo(5, 4, 8, 4); g.quadraticCurveTo(11, 4, 11, 7); g.lineTo(11, 13);
    g.closePath(); g.fill();
    g.strokeStyle = '#ffffff'; g.lineWidth = 0.5; g.globalAlpha = 0.6;
    g.beginPath(); g.moveTo(8, 4.5); g.lineTo(8, 13); g.stroke(); g.globalAlpha = 1;
    g.strokeStyle = OUT; g.lineWidth = 0.8;
    g.beginPath(); g.moveTo(5, 13); g.lineTo(5, 7); g.quadraticCurveTo(5, 4, 8, 4); g.quadraticCurveTo(11, 4, 11, 7); g.lineTo(11, 13); g.stroke();
  }

  function dibujarPuerta(g) {
    g.fillStyle = grad(g, 0, 0, 0, 16, ['#b07a48', '#7a4a22', '#3e2410']);
    g.fillRect(0, 0, 16, 16);
    g.strokeStyle = 'rgba(30,15,5,0.6)'; g.lineWidth = 0.6;
    [4, 8, 12].forEach(function (x) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 16); g.stroke(); });
    g.fillStyle = '#d9b050';
    g.fillRect(0, 7, 16, 1.2);
    brillo(g, 6, 3, 3, 1, 0.3);
    g.strokeStyle = OUT; g.lineWidth = 0.8;
    g.beginPath(); g.moveTo(0.5, 0); g.lineTo(0.5, 16); g.stroke();
  }

  function dibujarBandera(g) {
    g.fillStyle = grad(g, 1.5, 0, 3.5, 0, ['#ffffff', '#b8b0cc', '#6a6288']);
    rr(g, 1.5, 0, 2, 16, 0.8); g.fill(); trazar(g, OUT, 0.6);
    g.fillStyle = radial(g, 2.2, 0.6, 0.2, 1.4, ['#fff3a0', '#f2a000']);
    g.beginPath(); g.arc(2.5, 0.8, 1.1, 0, Math.PI * 2); g.fill();
    g.fillStyle = grad(g, 4, 1, 4, 8, ['#ff6b6b', '#e53935', '#a01818']);
    g.beginPath();
    g.moveTo(3.5, 1.2);
    g.quadraticCurveTo(8, -0.2, 13.5, 2.2 + Math.sin(0.5) * 0.6);
    g.lineTo(12, 5.4);
    g.quadraticCurveTo(8, 4.2, 3.5, 7.6);
    g.closePath(); g.fill(); trazar(g, OUT, 0.7);
    brillo(g, 7, 2.4, 3, 0.7, 0.4);
  }

  /* ---------- Decoración: hierba, rocas, agua, casitas y antorchas ---------- */

  function dibujarHierba(g) {
    // mata de hierba alta: hojas que salen del suelo y se inclinan
    [[3, 2.2, -0.5], [6.5, 3.0, 0.3], [9.5, 2.6, -0.2], [12.5, 3.2, 0.5], [14.5, 1.8, -0.4]].forEach(function (p) {
      const x = p[0], alto = p[1] * 4.2, inc = p[2] * 2.2;
      g.fillStyle = grad(g, x - 1, 16 - alto, x + 1, 16, ['#c8ff9a', '#4fbf3a', '#226e2a']);
      g.beginPath();
      g.moveTo(x - 1.1, 16);
      g.quadraticCurveTo(x + inc * 0.5 - 0.6, 16 - alto * 0.6, x + inc, 16 - alto);
      g.quadraticCurveTo(x + inc * 0.5 + 0.6, 16 - alto * 0.6, x + 1.1, 16);
      g.closePath(); g.fill();
      trazar(g, OUT, 0.5);
    });
  }

  function dibujarRocaDeco(g) {
    // roca suelta y redondeada, sin colisión
    g.fillStyle = radial(g, 6, 9.5, 0.5, 7, ['#f6f8fc', '#b4bccb', '#6a7284']);
    g.beginPath(); g.ellipse(8, 11.6, 6.2, 4.4, 0, 0, Math.PI * 2); g.fill();
    trazar(g, OUT, 0.8);
    brillo(g, 5.8, 9.2, 2.4, 0.9, 0.6);
  }

  // Cascada animada: franjas de agua que bajan y espuma abajo
  function dibujarCascada(g, cuadro) {
    g.fillStyle = grad(g, 3, 0, 13, 0, ['#c2f2ff', '#3fb4ea', '#1f6fb0']);
    g.fillRect(3, 0, 10, 16);
    g.fillStyle = 'rgba(255,255,255,0.75)';
    for (let i = 0; i < 3; i++) {
      const y = (i * 6 + cuadro * 1.8) % 16;
      g.fillRect(5, y, 2, 2.4);
      g.fillRect(9.5, (y + 3) % 16, 1.2, 2);
    }
    g.fillStyle = 'rgba(255,255,255,0.9)';
    g.beginPath(); g.ellipse(8, 15.4, 5.6, 1.1, 0, 0, Math.PI * 2); g.fill();
  }

  // Lago animado: superficie con ondas que se mueven
  function dibujarLago(g, cuadro) {
    function ola(x) { return 4.5 + Math.sin((x + cuadro * 4) * 0.8) * 0.8; }
    g.fillStyle = grad(g, 0, 0, 0, 16, ['#8fe8ff', '#2a9ad8', '#1a5f9a']);
    g.beginPath(); g.moveTo(0, 16);
    for (let x = 0; x <= 16; x += 0.5) g.lineTo(x, ola(x));
    g.lineTo(16, 16); g.closePath(); g.fill();
    g.beginPath();
    for (let x = 0; x <= 16; x += 0.5) {
      if (x === 0) g.moveTo(x, ola(x)); else g.lineTo(x, ola(x));
    }
    g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 0.8; g.stroke();
  }

  function dibujarAguaFonda(g) {
    g.fillStyle = grad(g, 0, 0, 0, 16, ['#2a9ad8', '#1a5f9a', '#0f3d6a']);
    g.fillRect(0, 0, 16, 16);
    g.fillStyle = 'rgba(255,255,255,0.14)';
    g.fillRect(2, 4, 4, 0.8); g.fillRect(9, 9, 5, 0.8); g.fillRect(4, 13, 5, 0.8);
  }

  // Tejado de casita: 'izq' sube hacia la derecha, 'der' baja hacia la derecha, 'medio' rellena
  function dibujarTejado(g, forma) {
    g.save();
    g.beginPath();
    if (forma === 'izq') { g.moveTo(0, 16); g.lineTo(16, 0); g.lineTo(16, 16); }
    else if (forma === 'der') { g.moveTo(0, 0); g.lineTo(16, 16); g.lineTo(0, 16); }
    else { g.rect(0, 0, 16, 16); }
    g.closePath();
    g.clip();
    g.fillStyle = grad(g, 0, 0, 0, 16, ['#ffab8a', '#d9503c', '#8f2a20']);
    g.fillRect(0, 0, 16, 16);
    g.strokeStyle = 'rgba(70,20,10,0.45)'; g.lineWidth = 0.6;
    [4, 8, 12].forEach(function (y) {
      g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(16, y + 0.5); g.stroke();
      for (let x = (y / 4) % 2 ? 2 : 0; x < 16; x += 4) {
        g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 4); g.stroke();
      }
    });
    g.restore();
    if (forma !== 'medio') {
      g.beginPath();
      if (forma === 'izq') { g.moveTo(0, 16); g.lineTo(16, 0); }
      else { g.moveTo(0, 0); g.lineTo(16, 16); }
      trazar(g, OUT, 0.9);
    }
  }

  function dibujarPared(g) {
    g.fillStyle = grad(g, 0, 0, 0, 16, ['#f2c08a', '#c08246', '#7a4a1e']);
    g.fillRect(0, 0, 16, 16);
    g.strokeStyle = 'rgba(70,40,15,0.5)'; g.lineWidth = 0.7;
    [4, 8, 12].forEach(function (x) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 16); g.stroke(); });
    g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(0, 0, 16, 1.2);
    g.strokeStyle = OUT; g.lineWidth = 0.8;
    g.strokeRect(0.5, 0.5, 15, 15);
  }

  // Antorcha animada: soporte de hierro y llama que parpadea
  function dibujarAntorcha(g, cuadro) {
    g.fillStyle = grad(g, 6, 10, 10, 10, ['#9a9aa8', '#4a4a56']);
    g.beginPath(); g.moveTo(6.5, 16); g.lineTo(9.5, 16); g.lineTo(9, 9.5); g.lineTo(7, 9.5); g.closePath(); g.fill();
    trazar(g, OUT, 0.6);
    const k = 1 + 0.14 * Math.sin(cuadro * 1.9 + 0.5);
    g.fillStyle = 'rgba(255,190,80,0.22)';
    g.beginPath(); g.arc(8, 7, 7, 0, Math.PI * 2); g.fill();
    g.fillStyle = radial(g, 8, 8, 0.5, 4.5 * k, ['#fff8c0', '#ffb020', 'rgba(255,80,20,0)']);
    g.beginPath(); g.ellipse(8, 7.8, 3.2, 4.6 * k, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,250,210,0.95)';
    g.beginPath(); g.ellipse(8, 8.6, 1.4, 2.6 * k, 0, 0, Math.PI * 2); g.fill();
  }

  // Letras de decoración animada: cada una tiene este número de cuadros
  // Viento: la hierba, las flores, los arbustos y las copas se inclinan despacio. El pie queda fijo.
  // La cuadrícula de decoración usa 12 cuadros de viento, uno por cada 1/8 s.
  const CUADROS_VIENTO = 12;
  function vientoDe(cuadro, amp) { return Math.sin(((cuadro % CUADROS_VIENTO) / CUADROS_VIENTO) * Math.PI * 2) * amp; }
  function conViento(g, s, fn) {
    g.save();
    g.transform(1, 0, s, 1, -16 * s, 0);   // x' = x + s·(y − 16): arriba se mueve, abajo no
    fn(g);
    g.restore();
  }
  const ANIMADO = { 'C': 4, 'l': 4, 'a': 4, 'h': CUADROS_VIENTO, 'f': CUADROS_VIENTO, 'b': CUADROS_VIENTO, 'T': CUADROS_VIENTO };
  const DIBUJOS_ANIM = {
    'C': dibujarCascada, 'l': dibujarLago, 'a': dibujarAntorcha,
    'h': function (g, c) { conViento(g, vientoDe(c, 0.16), dibujarHierba); },
    'f': function (g, c) { conViento(g, vientoDe(c, 0.22), dibujarFlor); },
    'b': function (g, c) { conViento(g, vientoDe(c, 0.10), dibujarArbusto); },
    'T': function (g, c) { conViento(g, vientoDe(c, 0.07), dibujarArbol); }
  };

  const DECOR = {
    'T': dibujarArbol, 'k': dibujarTronco, 'b': dibujarArbusto, 'f': dibujarFlor, 'K': dibujarCactus,
    'c': dibujarMuro, 'm': dibujarAlmena, 'g': dibujarVentana, 'u': dibujarPuerta, 'F': dibujarBandera,
    'h': dibujarHierba, 'r': dibujarRocaDeco, 'y': dibujarAguaFonda, 'v': dibujarPared,
    'd': function (g) { dibujarTejado(g, 'izq'); },
    'e': function (g) { dibujarTejado(g, 'medio'); },
    'j': function (g) { dibujarTejado(g, 'der'); }
  };

  /* ---------- Fondo: cielo según la hora, sol o luna, estrellas, nubes, montañas y colinas ---------- */

  // Colores clave del día. hora: 0 = amanecer, 0.25 = día, 0.5 = atardecer, 0.75 = noche (y vuelve a 0)
  // noche: 0 = día pleno, 1 = noche cerrada (apaga los rayos y enciende las estrellas)
  const CLAVES_DIA = [
    { cielo: ['#ffb38a', '#ffd9b0', '#ffe9c7'], sol: ['#fff4d0', '#ffb24a', '#ff8a2a'], halo: [255, 170, 90],  noche: 0 },
    { cielo: ['#7fd2ff', '#bfeaff', '#ffe9c7'], sol: ['#fffdf0', '#ffd23f', '#f0a010'], halo: [255, 230, 140], noche: 0 },
    { cielo: ['#6a5acd', '#ff9a7a', '#ffd29a'], sol: ['#fff0c0', '#ff7a3a', '#d8401a'], halo: [255, 120, 70],  noche: 0.2 },
    { cielo: ['#141a3c', '#2a2f6a', '#4a4f8a'], sol: ['#f4f8ff', '#c8d4ff', '#8898d8'], halo: [170, 190, 255], noche: 1 }
  ];

  function hexRgb(c) { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function mezclaRgb(a, b, t) { return a.map(function (v, i) { return v + (b[i] - v) * t; }); }
  function rgba(c, a) { return 'rgba(' + c.map(function (v) { return Math.round(v); }).join(',') + ',' + a + ')'; }
  // Color de una capa de paisaje, oscurecido de noche
  function tinta(hex, noche, fuerza) { return mezclaRgb(hexRgb(hex), [30, 34, 80], noche * (fuerza || 0.7)); }

  // Colores de la hora indicada, mezclados entre las dos claves cercanas
  function paleta(hora) {
    const n = CLAVES_DIA.length;
    const pos = (((hora % 1) + 1) % 1) * n;
    const i = Math.floor(pos), t = pos - i;
    const A = CLAVES_DIA[i % n], B = CLAVES_DIA[(i + 1) % n];
    function mix(x, y) { return mezclaRgb(hexRgb(x), hexRgb(y), t); }
    return {
      cielo: [mix(A.cielo[0], B.cielo[0]), mix(A.cielo[1], B.cielo[1]), mix(A.cielo[2], B.cielo[2])],
      sol: [mix(A.sol[0], B.sol[0]), mix(A.sol[1], B.sol[1]), mix(A.sol[2], B.sol[2])],
      halo: mezclaRgb(A.halo, B.halo, t),
      noche: A.noche + (B.noche - A.noche) * t
    };
  }

  const ESTRELLAS = [];
  for (let i = 0; i < 46; i++) ESTRELLAS.push({ x: (i * 61 + 17) % 240, y: (i * 29 + 5) % 96, f: 1.2 + (i % 4) * 0.5 });

  // Adaptado: el campo de estrellas se repite cada 240 unidades hasta cubrir la vista (vistaAncho)
  function estrellas(g, tono, tiempo, vistaAncho) {
    for (let x0 = 0; x0 < (vistaAncho || 242); x0 += 240) {
      ESTRELLAS.forEach(function (s, i) {
        const parpadeo = 0.55 + 0.45 * Math.sin((tiempo || 0) * s.f + i);
        g.fillStyle = rgba([255, 255, 240], tono * parpadeo);
        g.fillRect(s.x + x0, s.y, 1.2, 1.2);
      });
    }
  }

  // Nubes en tres capas: cuanto más cerca, más rápidas
  const NUBES = [
    [{ x: 20, y: 24, s: 1 }, { x: 150, y: 16, s: 1.3 }, { x: 270, y: 30, s: 0.9 }, { x: 380, y: 18, s: 1.2 }],
    [{ x: 80, y: 44, s: 0.7 }, { x: 220, y: 50, s: 0.6 }, { x: 330, y: 40, s: 0.8 }],
    [{ x: 50, y: 62, s: 0.45 }, { x: 190, y: 66, s: 0.4 }, { x: 300, y: 58, s: 0.5 }]
  ];
  const NUBE_CICLO = [420, 360, 300];
  const NUBE_FACTOR = [0.12, 0.28, 0.5];

  function nube(g, x, y, s, tono) {
    const t = tono || [255, 255, 255];
    g.save();
    g.fillStyle = rgba(mezclaRgb(t, [150, 190, 230], 0.35), 0.85);
    g.beginPath(); g.ellipse(x + 2 * s, y + 4 * s, 26 * s, 6 * s, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = rgba(t, 1);
    g.beginPath();
    g.arc(x, y + 2 * s, 8 * s, 0, Math.PI * 2);
    g.arc(x + 9 * s, y - 3 * s, 11 * s, 0, Math.PI * 2);
    g.arc(x + 21 * s, y + 1 * s, 8 * s, 0, Math.PI * 2);
    g.arc(x + 12 * s, y + 4 * s, 9 * s, 0, Math.PI * 2);
    g.fill();
    g.restore();
  }

  // Colinas: una franja ondulada con dos tonos (arriba claro, abajo oscuro)
  function colina(g, camX, f, baseY, amp, frec, fase, cols, vistaAncho) {
    const ancho = vistaAncho || 242;
    g.beginPath();
    g.moveTo(-2, 144);
    for (let x = -2; x <= ancho; x += 3) {
      const wx = x + camX * f;
      const h = amp * (0.5 + 0.5 * Math.sin(wx * frec + fase)) + amp * 0.35 * (0.5 + 0.5 * Math.sin(wx * frec * 2.3 + fase * 1.7));
      g.lineTo(x, baseY - h);
    }
    g.lineTo(ancho, 144);
    g.closePath();
    g.fillStyle = grad(g, 0, baseY - amp * 1.4, 0, 144, cols.map(function (c) { return rgba(c, 1); }));
    g.fill();
  }

  // Ambiente de cueva: roca oscura, estalactitas en dos capas y cristales que brillan
  function cueva(g, camX, tiempo, vistaW, vistaH, arriba) {
    arriba = arriba || 0;
    g.fillStyle = grad(g, 0, -arriba, 0, vistaH, ['#2b2634', '#3a3245', '#17141e']);
    g.fillRect(0, -arriba, vistaW, vistaH + arriba);
    [[0.25, 300, 26, '#5a5068', '#2e2838'], [0.5, 240, 16, '#4a4258', '#241f2e']].forEach(function (capa) {
      const f = capa[0], ciclo = capa[1], alt = capa[2];
      for (let i = 0; i < 12; i++) {
        const h = alt * (0.5 + 0.5 * Math.sin(i * 2.1 + 0.4)) + 6;
        for (let k = -1; k <= 1; k++) {
          const x = ((i * ciclo / 12 + 9 - camX * f) % ciclo + ciclo) % ciclo + k * ciclo;
          if (x < -10 || x > vistaW + 10) continue;
          g.fillStyle = grad(g, x - 6, 0, x + 6, 0, [capa[3], capa[4]]);
          g.beginPath(); g.moveTo(x - 6, 0); g.lineTo(x + 6, 0); g.lineTo(x, h); g.closePath(); g.fill();
        }
      }
    });
    for (let i = 0; i < 10; i++) {
      const x = ((i * 47 + 20 - camX * 0.6) % vistaW + vistaW) % vistaW;
      const y = 100 + (i * 13) % 30;
      const t = 0.5 + 0.5 * Math.sin((tiempo || 0) * 2 + i);
      g.fillStyle = rgba([120, 230, 255], 0.25 + 0.5 * t);
      g.beginPath(); g.arc(x, y, 1.5 + t, 0, Math.PI * 2); g.fill();
    }
  }

  // Montañas: picos con relieve irregular, cara iluminada a la izquierda y sombra a la derecha, grietas y nieve
  // con borde irregular (si nieve es true)
  function montanas(g, camX, f, baseY, amp, periodo, cols, sombra, nieve, vistaAncho) {
    const ancho = vistaAncho || 242;
    g.beginPath();
    g.moveTo(-2, 144);
    for (let x = -2; x <= ancho; x += 2) {
      const wx = x + camX * f;
      const t = (((wx / periodo) % 1) + 1) % 1;
      const pico = Math.max(0, 1 - Math.abs(t - 0.5) * 2.6);
      const roca = 0.06 * Math.abs(Math.sin(wx * 0.37)) + 0.04 * Math.sin(wx * 0.11 + 0.8);
      const h = amp * pico * (0.85 + 0.15 * Math.sin(wx * 0.05 + 1.3) + roca);
      g.lineTo(x, baseY - h);
    }
    g.lineTo(ancho, 144);
    g.closePath();
    g.fillStyle = grad(g, 0, baseY - amp, 0, 144, cols.map(function (c) { return rgba(c, 1); }));
    g.fill();
    g.save();
    g.clip();
    if (nieve !== false) {
      // Nieve: el borde de arriba se corta en dientes irregulares
      const linea = baseY - amp * 0.6;
      g.fillStyle = 'rgba(255,255,255,0.9)';
      g.beginPath();
      g.moveTo(-2, 0); g.lineTo(ancho, 0);
      for (let x = ancho; x >= -2; x -= 3) {
        const wx = x + camX * f;
        g.lineTo(x, linea + 3.5 * Math.sin(wx * 0.31) + 2 * Math.sin(wx * 0.9 + 1));
      }
      g.closePath(); g.fill();
    }
    if (sombra) {
      // Cara en sombra (mitad derecha de cada pico) y grietas en la roca
      const ancho = periodo * 0.385;
      const n0 = Math.floor((camX * f - 20) / periodo) - 1, n1 = Math.floor((camX * f + 260) / periodo) + 1;
      for (let n = n0; n <= n1; n++) {
        const px = periodo * (n + 0.5) - camX * f;
        if (px < -ancho * 1.5 || px > 242 + ancho) continue;
        g.fillStyle = rgba(sombra, 0.22);
        g.beginPath();
        g.moveTo(px, baseY - amp * 0.9); g.lineTo(px + ancho, baseY); g.lineTo(px + ancho, 144); g.lineTo(px, 144);
        g.closePath(); g.fill();
        // grietas: líneas finas que bajan desde la cima
        g.strokeStyle = rgba(sombra, 0.35); g.lineWidth = 0.6;
        g.beginPath();
        g.moveTo(px + 1, baseY - amp * 0.75); g.lineTo(px + ancho * 0.45, baseY - amp * 0.25);
        g.moveTo(px + 3, baseY - amp * 0.45); g.lineTo(px + ancho * 0.7, baseY - amp * 0.05);
        g.stroke();
        g.strokeStyle = 'rgba(255,255,255,0.25)';
        g.beginPath();
        g.moveTo(px - 1, baseY - amp * 0.7); g.lineTo(px - ancho * 0.35, baseY - amp * 0.2);
        g.stroke();
      }
    }
    g.restore();
  }

  // Efectos de agua en una poza: gotas que caen y saltan, aros que se expanden y espuma.
  // x, y: centro de la superficie; ancho: ancho de la poza; semilla: para que cada poza sea distinta.
  // Todo se calcula con el tiempo, sin guardar estado.
  function efectosAgua(g, x, y, ancho, tiempo, semilla) {
    const t = tiempo || 0, s = semilla || 0;
    // gotas que caen desde arriba y hacen un aro al tocar el agua
    for (let i = 0; i < 6; i++) {
      const p = mod(t * (0.9 + azar(i + s) * 0.5) + azar(i + 40 + s), 1);
      const gx = x + (azar(i + 60 + s) - 0.5) * ancho * 0.8;
      const alto = 16 + azar(i + 80 + s) * 14;
      g.fillStyle = 'rgba(225,244,255,0.85)';
      g.fillRect(gx - 0.35, y - alto * (1 - p), 0.7, 2.2);
    }
    // aros que se expanden sobre la superficie
    for (let k = 0; k < 3; k++) {
      const q = mod(t * 0.65 + k / 3 + s * 0.13, 1);
      const cx = x + (azar(k + 90 + s) - 0.5) * ancho * 0.6;
      g.strokeStyle = 'rgba(255,255,255,' + (0.7 * (1 - q)).toFixed(3) + ')';
      g.lineWidth = 0.6;
      g.beginPath(); g.ellipse(cx, y, 1 + ancho * 0.4 * q, 0.4 + 1.3 * q, 0, 0, Math.PI * 2); g.stroke();
    }
    // salpicaduras: gotas que saltan en arco y caen otra vez en la poza
    for (let i = 0; i < 8; i++) {
      const p = mod(t * (1.4 + azar(i + 110 + s) * 0.6) + azar(i + 130 + s), 1);
      const hx = x + (azar(i + 150 + s) - 0.5) * ancho * 0.9 + (azar(i + 170 + s) - 0.5) * 3 * p;
      const alto = Math.sin(Math.PI * p) * (4 + 6 * azar(i + 190 + s));
      g.fillStyle = 'rgba(240,252,255,' + (0.95 - 0.4 * p).toFixed(3) + ')';
      g.beginPath(); g.arc(hx, y - alto, 0.6 + 0.6 * azar(i + 210 + s), 0, Math.PI * 2); g.fill();
    }
    // espuma y bruma sobre la poza
    g.fillStyle = 'rgba(255,255,255,' + (0.35 + 0.1 * Math.sin(t * 1.3 + s)).toFixed(3) + ')';
    g.beginPath(); g.ellipse(x, y - 1, ancho * 0.45, 1.6, 0, 0, Math.PI * 2); g.fill();
  }

  // Cascada de plano intermedio: un salto de agua grande que cae por una pared de roca hasta una poza
  // (la poza va delante de las montañas lejanas y detrás de las colinas cercanas)
  function cascadaMedia(g, camX, tiempo) {
    const f = 0.3, ciclo = 260;
    for (let k = -1; k <= 1; k++) {
      const x0 = ((130 - camX * f) % ciclo + ciclo) % ciclo + k * ciclo;
      if (x0 < -40 || x0 > 280) continue;
      const yArriba = 38, yPoza = 104;
      // pared de roca con borde irregular
      g.fillStyle = grad(g, 0, yArriba, 0, yPoza, ['rgba(176,186,206,1)', 'rgba(118,128,150,1)']);
      g.beginPath();
      g.moveTo(x0 - 22, yArriba + 4); g.lineTo(x0 - 6, yArriba - 2); g.lineTo(x0 + 10, yArriba);
      g.lineTo(x0 + 24, yArriba + 8); g.lineTo(x0 + 18, yArriba + 34); g.lineTo(x0 + 24, yPoza - 6);
      g.lineTo(x0 + 6, yPoza); g.lineTo(x0 - 4, yPoza - 4); g.lineTo(x0 - 12, yPoza - 2);
      g.lineTo(x0 - 24, yPoza - 20); g.lineTo(x0 - 18, yArriba + 30);
      g.closePath(); g.fill();
      // reborde de roca iluminado por la izquierda
      g.strokeStyle = 'rgba(210,222,240,0.5)'; g.lineWidth = 0.7;
      g.beginPath(); g.moveTo(x0 - 22, yArriba + 4); g.lineTo(x0 - 18, yArriba + 30); g.lineTo(x0 - 24, yPoza - 20); g.stroke();
      // labio del salto: espuma blanca en el borde superior
      g.fillStyle = 'rgba(255,255,255,0.95)';
      g.beginPath(); g.ellipse(x0, yArriba, 7, 2, 0, 0, Math.PI * 2); g.fill();
      // tres cintas de agua que bajan a velocidades distintas
      [[-5, 46], [0, 60], [5, 40]].forEach(function (c, i) {
        const xs = x0 + c[0];
        g.fillStyle = grad(g, 0, yArriba, 0, yPoza, ['rgba(255,255,255,1)', 'rgba(205,234,252,0.95)']);
        g.beginPath();
        g.moveTo(xs - 1.6, yArriba); g.lineTo(xs + 1.6, yArriba);
        g.lineTo(xs + 2.6, yPoza - 2); g.lineTo(xs - 2.6, yPoza - 2);
        g.closePath(); g.fill();
        // brillos que bajan más deprisa que la cinta
        for (let j = 0; j < 4; j++) {
          const y = yArriba + ((tiempo * c[1] + j * 13 + i * 5) % (yPoza - yArriba - 6));
          g.fillStyle = 'rgba(255,255,255,0.95)';
          g.fillRect(xs - 0.6, y, 1.2, 4);
        }
      });
      // bruma que sube de la caída
      g.fillStyle = 'rgba(255,255,255,' + (0.22 + 0.06 * Math.sin(tiempo * 0.9)).toFixed(3) + ')';
      g.beginPath(); g.ellipse(x0, yPoza - 3, 20 + Math.sin(tiempo * 0.7) * 2, 6, 0, 0, Math.PI * 2); g.fill();
      // poza: agua azul con reflejos y los efectos de salpicadura
      g.fillStyle = grad(g, x0 - 20, 0, x0 + 20, 0, ['rgba(90,170,220,0.95)', 'rgba(140,210,240,0.95)', 'rgba(90,170,220,0.95)']);
      g.beginPath(); g.ellipse(x0, yPoza, 22, 3.6, 0, 0, Math.PI * 2); g.fill();
      efectosAgua(g, x0, yPoza, 36, tiempo, 3);
    }
  }

  // Pájaros en bandada lejana: pequeñas uves que aletean y cruzan el cielo despacio
  function pajaros(g, vistaW, tiempo, tono) {
    const W = vistaW * 1.3;
    for (let i = 0; i < 5; i++) {
      const x = ((azar(i + 50) * W + tiempo * (9 + azar(i) * 7)) % W + W) % W - vistaW * 0.15;
      const y = 18 + azar(i + 7) * 34 + Math.sin(tiempo * 0.4 + i) * 2;
      const ala = Math.sin(tiempo * 7 + i * 1.7) * 2.2;
      const s = 0.7 + azar(i + 3) * 0.5;
      g.strokeStyle = rgba(tono, 0.7); g.lineWidth = 0.9; g.lineCap = 'round';
      g.beginPath();
      g.moveTo(x - 4 * s, y - ala * s); g.lineTo(x, y); g.lineTo(x + 4 * s, y - ala * s);
      g.stroke();
    }
  }

  // Número pseudoaleatorio fijo (0..1) para repartir partículas sin guardar estado
  function azar(n) { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
  function mod(a, m) { return ((a % m) + m) % m; }

  // Tormenta de arena: el aire se llena de polvo que vuela con el viento; el sol queda velado
  function arenaVolando(g, vistaW, vistaH, camX, tiempo) {
    const W = vistaW * 1.4;
    for (let i = 0; i < 110; i++) {
      const z = azar(i * 3 + 3);
      const x = mod(azar(i * 3 + 1) * W - tiempo * (120 + 170 * z) - camX * 0.15, W) - vistaW * 0.2;
      const y = 14 + azar(i * 3 + 2) * (vistaH - 24) + Math.sin(tiempo * 1.5 + i) * 3 * z;
      g.fillStyle = rgba(mezclaRgb([236, 196, 130], [170, 120, 70], z * 0.6), 0.25 + 0.5 * z);
      g.beginPath(); g.arc(x, y, 0.6 + 1.6 * z, 0, Math.PI * 2); g.fill();
    }
    // rachas de viento: líneas largas y finas que cruzan deprisa
    for (let i = 0; i < 16; i++) {
      const z = azar(i + 300);
      const L = 16 + 26 * z;
      const x = mod(azar(i + 200) * W - tiempo * (260 + 120 * z), W) - vistaW * 0.2;
      const y = 20 + azar(i + 400) * (vistaH - 40);
      g.strokeStyle = rgba([240, 210, 160], 0.35 + 0.3 * z); g.lineWidth = 0.8;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x - L, y + 1.5); g.stroke();
    }
  }

  // Lluvia y tormenta: gotas inclinadas por el viento; la tormenta añade relámpagos
  function lluvia(g, vistaW, vistaH, tiempo, tormenta) {
    for (let i = 0; i < 80; i++) {
      const z = azar(i * 2 + 9);
      const x = mod(azar(i * 2 + 1) * vistaW * 1.2 - tiempo * 30, vistaW * 1.2) - vistaW * 0.1;
      const y = mod(azar(i * 2 + 2) * vistaH + tiempo * (240 + 120 * z), vistaH);
      g.strokeStyle = rgba([200, 218, 245], 0.3 + 0.3 * z); g.lineWidth = 0.8;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x - 3, y + 9 + 4 * z); g.stroke();
    }
    if (!tormenta) return;
    const ciclo = 6.5, n = Math.floor(tiempo / ciclo), p = tiempo - n * ciclo;
    if (azar(n) < 0.35 || p > 0.4) return;
    // Relámpago: destello y una línea quebrada desde arriba
    g.fillStyle = 'rgba(235,240,255,' + (p < 0.1 ? 0.5 : 0.5 * (1 - (p - 0.1) / 0.3)) + ')';
    g.fillRect(0, 0, vistaW, vistaH);
    let x = 40 + azar(n + 5) * (vistaW - 80), y = 0;
    g.strokeStyle = 'rgba(255,255,255,0.95)'; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(x, y);
    for (let j = 1; j <= 7; j++) {
      x += (azar(n * 10 + j) - 0.5) * 18; y += 13;
      g.lineTo(x, y);
    }
    g.stroke();
  }

  // Nieve: copos que caen con un vaivén suave
  function nieve(g, vistaW, vistaH, tiempo) {
    for (let i = 0; i < 70; i++) {
      const z = azar(i * 3 + 5);
      const x = mod(azar(i * 3 + 1) * vistaW + Math.sin(tiempo * 0.9 + i) * (6 + 6 * z), vistaW);
      const y = mod(azar(i * 3 + 2) * vistaH + tiempo * (18 + 26 * z), vistaH);
      g.fillStyle = 'rgba(255,255,255,' + (0.55 + 0.35 * z) + ')';
      g.beginPath(); g.arc(x, y, 0.7 + 1.2 * z, 0, Math.PI * 2); g.fill();
    }
  }

  // Niebla: bancos blancos que cruzan despacio por delante del paisaje
  function niebla(g, vistaW, vistaH, tiempo) {
    for (let i = 0; i < 4; i++) {
      const x = mod(azar(i + 60) * vistaW * 1.6 + tiempo * (6 + 5 * i), vistaW * 1.6) - vistaW * 0.3;
      const y = 60 + i * 22 + Math.sin(tiempo * 0.3 + i) * 3;
      const r = g.createRadialGradient(x, y, 2, x, y, 90);
      r.addColorStop(0, 'rgba(240,244,248,0.5)'); r.addColorStop(1, 'rgba(240,244,248,0)');
      g.fillStyle = r;
      g.save(); g.translate(x, y); g.scale(1, 0.4); g.translate(-x, -y);
      g.beginPath(); g.arc(x, y, 90, 0, Math.PI * 2); g.fill();
      g.restore();
    }
  }

  // Colores de paisaje según el tipo: bosque o desierto (dunas y mesetas de arena)
  const PAISAJES = {
    bosque: {
      montana: ['#eef7ff', '#bcdcf2'], sombra: '#3b4f7a', nieve: true,
      cordillera: ['#7aa592', '#4e7a6a'], sombraCord: '#2e4a48',
      lejos: ['#b8e6a8', '#8ccb7a'], cerca: ['#7fc46a', '#3f8f3a']
    },
    desierto: {
      montana: ['#f3dcae', '#c99a62'], sombra: '#6b3f22', nieve: false,
      cordillera: ['#e0b27a', '#a8743e'], sombraCord: '#6b3f22',
      lejos: ['#f2d9a4', '#dcb173'], cerca: ['#e2b774', '#b07a3a']
    }
  };

  // Atmósfera según el clima: tinte del cielo, color de las nubes y capas de partículas
  const CLIMAS = {
    lluvia: { tinte: [60, 72, 96], fuerza: 0.35, nube: [90, 100, 120], sol: 0.25 },
    tormenta: { tinte: [40, 46, 72], fuerza: 0.5, nube: [60, 66, 90], sol: 0.1 },
    nieve: { tinte: [220, 230, 245], fuerza: 0.22, nube: [230, 236, 245], sol: 0.6 },
    arena: { tinte: [214, 166, 102], fuerza: 0.6, nube: [222, 182, 120], sol: 0.35 },
    niebla: { tinte: [225, 230, 236], fuerza: 0.55, nube: [240, 242, 246], sol: 0.3 }
  };

  // Dibuja el fondo en capas. camX, camY: cámara del nivel; el contexto debe tener escala U (o U × zoom).
  // opt.hora: 0..1 (0 amanecer, 0.25 día, 0.5 atardecer, 0.75 noche); el sol y las nubes cambian con ella.
  // opt.ambiente: 'cueva' cambia el cielo por la roca de una cueva.
  // opt.paisaje: 'bosque' (por defecto) o 'desierto' (dunas y mesetas de arena).
  // opt.clima: null (por defecto), 'lluvia', 'tormenta', 'nieve', 'arena' o 'niebla'.
  // opt.cascada: true/false (por defecto, una cascada lejana en el paisaje de bosque). opt.pajaros: true/false.
  function fondo(g, camX, camY, vistaW, vistaH, tiempo, opt) {
    opt = opt || {};
    g.save();
    const arriba = opt.arriba || 0;
    if (opt.ambiente === 'cueva') { cueva(g, camX, tiempo, vistaW, vistaH, arriba); g.restore(); return; }

    const P = paleta(opt.hora || 0);
    const noche = P.noche;
    const clima = CLIMAS[opt.clima] || null;
    const tipo = PAISAJES[opt.paisaje] ? opt.paisaje : 'bosque';
    const pais = PAISAJES[tipo];
    const t = tiempo || 0;

    g.fillStyle = grad(g, 0, -arriba, 0, vistaH, P.cielo.map(function (c) { return rgba(c, 1); }));
    g.fillRect(0, -arriba, vistaW, vistaH + arriba);
    if (noche > 0.05) estrellas(g, noche, t, vistaW);

    // Sol (o luna de noche): disco con halo; el color cambia con la hora y se vela con el clima
    const sx = vistaW * 0.8 - camX * 0.03, sy = 30;
    g.save();
    g.globalAlpha = clima ? clima.sol : 1;
    g.fillStyle = radial(g, sx, sy, 6, 46, [rgba(P.halo, 0.9), rgba(P.halo, 0.35), rgba(P.halo, 0)]);
    g.beginPath(); g.arc(sx, sy, 46, 0, Math.PI * 2); g.fill();
    if (noche < 0.95) {
      g.save();
      g.translate(sx, sy);
      g.rotate(t * 0.12);
      g.strokeStyle = rgba(P.halo, 0.6 * (1 - noche)); g.lineWidth = 2; g.lineCap = 'round';
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2, l = i % 2 ? 20 : 24;
        g.beginPath(); g.moveTo(Math.cos(a) * 14, Math.sin(a) * 14); g.lineTo(Math.cos(a) * l, Math.sin(a) * l); g.stroke();
      }
      g.restore();
    }
    g.fillStyle = radial(g, sx - 3, sy - 3, 1, 12, P.sol.map(function (c) { return rgba(c, 1); }));
    g.beginPath(); g.arc(sx, sy, 12, 0, Math.PI * 2); g.fill();
    g.strokeStyle = rgba(P.sol[2], 0.8); g.lineWidth = 1; g.stroke();
    g.restore();

    // Pájaros (solo de día y con cielo despejado)
    if (opt.pajaros !== false && noche < 0.4 && !clima) pajaros(g, vistaW, t, mezclaRgb([40, 36, 60], [70, 60, 90], noche));

    // Nubes: se oscurecen de noche y de tormenta; con arena se tiñen de polvo
    let tono = mezclaRgb([255, 255, 255], [70, 80, 130], noche);
    if (clima) tono = mezclaRgb(tono, clima.nube, 0.8);
    NUBES.forEach(function (capa, i) {
      const f = NUBE_FACTOR[i], ciclo = NUBE_CICLO[i];
      capa.forEach(function (c) {
        for (let k = -1; k <= 2; k++) {
          const x = ((c.x - camX * f) % ciclo + ciclo) % ciclo + k * ciclo;
          if (x > -60 && x < vistaW + 60) nube(g, x, c.y, c.s, tono);
        }
      });
    });

    // Montañas pálidas al fondo (las de bosque tienen nieve; las de desierto son mesetas de arena)
    montanas(g, camX, 0.1, 104, 60, 150,
      pais.montana.map(function (c) { return tinta(c, noche, 0.6); }),
      tinta(pais.sombra, noche, 0.5), pais.nieve, vistaW);

    // Cordillera cercana: más oscura, sin nieve, en el plano entre las montañas lejanas y las colinas
    montanas(g, camX, 0.18, 118, 38, 110,
      pais.cordillera.map(function (c) { return tinta(c, noche, 0.5); }),
      tinta(pais.sombraCord, noche, 0.5), false, vistaW);

    // Colinas (o dunas) lejanas; la cascada va delante de ellas y detrás de las colinas cercanas
    if (tipo === 'desierto') colina(g, camX, 0.3, 112, 16, 0.012, 2.4, pais.lejos.map(function (c) { return tinta(c, noche, 0.5); }), vistaW);
    else colina(g, camX, 0.3, 112, 20, 0.02, 2.4, pais.lejos.map(function (c) { return tinta(c, noche, 0.5); }), vistaW);
    if (opt.cascada !== false && tipo !== 'desierto') cascadaMedia(g, camX, t);
    if (tipo === 'desierto') colina(g, camX, 0.7, 128, 12, 0.02, 0.7, pais.cerca.map(function (c) { return tinta(c, noche, 0.5); }), vistaW);
    else colina(g, camX, 0.7, 128, 14, 0.035, 0.7, pais.cerca.map(function (c) { return tinta(c, noche, 0.5); }), vistaW);

    // Atmósfera y partículas del clima, por encima del paisaje
    if (clima) {
      const veladura = g.createLinearGradient(0, 0, 0, vistaH);
      veladura.addColorStop(0, rgba(clima.tinte, clima.fuerza * 0.7));
      veladura.addColorStop(1, rgba(clima.tinte, clima.fuerza));
      g.fillStyle = veladura;
      g.fillRect(0, 0, vistaW, vistaH);
    }
    if (opt.clima === 'arena') arenaVolando(g, vistaW, vistaH, camX, t);
    if (opt.clima === 'lluvia') lluvia(g, vistaW, vistaH, t, false);
    if (opt.clima === 'tormenta') lluvia(g, vistaW, vistaH, t, true);
    if (opt.clima === 'nieve') nieve(g, vistaW, vistaH, t);
    if (opt.clima === 'niebla') niebla(g, vistaW, vistaH, t);
    g.restore();
  }

  // Burbujas de lava: cada una sube, crece y revienta en la superficie. Sin estado: todo sale del tiempo.
  function burbujasLava(g, x, y, tiempo, semilla) {
    const t = tiempo || 0;
    for (let i = 0; i < 2; i++) {
      const p = mod(t * (0.6 + azar(i + semilla) * 0.5) + azar(i + 30 + semilla), 1);
      const bx = x + 3 + azar(i + 60 + semilla) * 10;
      const r = 0.5 + 1.1 * Math.sin(Math.PI * p);
      g.fillStyle = 'rgba(255,236,160,' + (0.9 * (1 - p)).toFixed(3) + ')';
      g.beginPath(); g.arc(bx, y + 1 - 3 * p, r, 0, Math.PI * 2); g.fill();
    }
  }

  // Partículas de ambiente del bosque: hojas que caen con el viento y, de noche, luciérnagas.
  // Se dibuja encima del nivel. hora: la misma que el fondo (0..1).
  function particulas(g, vistaW, vistaH, tiempo, camX, hora) {
    const t = tiempo || 0;
    const noche = paleta(hora || 0).noche;
    const W = vistaW * 1.3;
    const colores = ['#7fc46a', '#4f9a3a', '#e2a24a', '#c8703a'];
    for (let i = 0; i < 14; i++) {
      const z = azar(i * 4 + 400);
      const x = mod(azar(i * 4 + 402) * W + t * (16 + 18 * z) - camX * 0.08, W) - vistaW * 0.15 + Math.sin(t * 2 + i) * 4;
      const y = mod(azar(i * 4 + 401) * vistaH + t * (9 + 12 * z), vistaH);
      g.save();
      g.translate(x, y);
      g.rotate(t * (1.5 + z * 2) + i);
      g.fillStyle = colores[i % colores.length];
      g.globalAlpha = 0.85;
      g.beginPath(); g.ellipse(0, 0, 2.3, 1.1, 0, 0, Math.PI * 2); g.fill();
      g.restore();
    }
    if (noche > 0.4) {
      const k = (noche - 0.4) / 0.6;
      for (let i = 0; i < 9; i++) {
        const x = mod(azar(i * 3 + 500) * vistaW + Math.sin(t * 0.5 + i) * 14, vistaW);
        const y = 56 + azar(i * 3 + 501) * 70 + Math.cos(t * 0.7 + i) * 8;
        const brillo = 0.5 + 0.5 * Math.sin(t * 3 + i * 2.1);
        const a = k * brillo;
        g.fillStyle = rgba([220, 255, 120], 0.35 * a);
        g.beginPath(); g.arc(x, y, 3.2, 0, Math.PI * 2); g.fill();
        g.fillStyle = rgba([240, 255, 170], 0.95 * a);
        g.beginPath(); g.arc(x, y, 0.9, 0, Math.PI * 2); g.fill();
      }
    }
  }

  const DIBUJOS = {
    '=': dibujarLadrillo,
    '?': dibujarInterrogacion,
    'x': dibujarVacio,
    'X': dibujarPiedra,
    'P': function (g) { dibujarTuberia(g, 'izq', true); },
    'Q': function (g) { dibujarTuberia(g, 'der', true); },
    'p': function (g) { dibujarTuberia(g, 'izq', false); },
    'q': function (g) { dibujarTuberia(g, 'der', false); },
    '-': dibujarPlataforma,
    '^': dibujarPinchos,
    '~': dibujarLava,
    'L': dibujarEscalera,
    'B': dibujarBarra,
    'S': dibujarInicio,
    'E': dibujarMeta,
    'M': function (g) { dibujarMuelle(g, false); },
    'M+': function (g) { dibujarMuelle(g, true); }
  };
  Object.assign(DIBUJOS, DECOR);

  // Clave de sprite: 'o0'..'o7' para monedas; 'T|1010' para terrenos (T = tipo; cada cifra: 1 = lado al aire,
  // en orden arriba, izquierda, derecha, abajo); en otro caso, el propio carácter.
  function spriteDe(clave) {
    if (!cache[clave]) {
      if (clave.indexOf('|') === 1) {
        const ch = clave[0], f = clave.slice(2);
        cache[clave] = hacerSprite(function (g) {
          dibujarTerreno(g, ch, f[0] === '1', f[1] === '1', f[2] === '1', f[3] === '1');
        });
      } else if (clave.indexOf(':') === 1) {
        const base = clave[0], cuadro = parseInt(clave.slice(2), 10);
        cache[clave] = hacerSprite(function (g) { DIBUJOS_ANIM[base](g, cuadro); });
      } else if (clave[0] === COLECCION) {
        const frame = parseInt(clave.slice(1), 10);
        cache[clave] = hacerSprite(function (g) { dibujarMoneda(g, frame); });
      } else {
        cache[clave] = hacerSprite(DIBUJOS[clave]);
      }
    }
    return cache[clave];
  }

  /* ---------- Mundo ---------- */

  function leerMapa(mapa) {
    // Un texto con saltos de línea al principio o al final no añade filas vacías
    let filas = Array.isArray(mapa) ? mapa.slice() : String(mapa).replace(/\r/g, '').split('\n');
    if (!Array.isArray(mapa)) {
      if (filas.length && filas[0] === '') filas.shift();
      if (filas.length && filas[filas.length - 1] === '') filas.pop();
    }
    const cols = Math.max.apply(null, filas.map(function (f) { return f.length; }));
    return filas.map(function (f) {
      const celdas = [];
      for (let c = 0; c < cols; c++) celdas.push(c < f.length ? f[c] : ' ');
      return celdas;
    });
  }

  // Plataforma móvil: recorre sus puntos de ida y vuelta a velocidad constante. Sólida solo desde arriba.
  function crearPlataforma(d) {
    const pts = d.puntos;
    let L = 0;
    const segs = [];
    for (let i = 1; i < pts.length; i++) {
      const len = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      segs.push(len); L += len;
    }
    return { x: pts[0][0], y: pts[0][1], w: d.w || 32, h: TILE, pts: pts, segs: segs, L: L,
             s: d.inicio || 0, dir: 1, vel: d.velocidad || 40, dx: 0, dy: 0,
             // Plataforma que cae: tras pisarla tiembla y, al cabo de tCaida, cae fuera del nivel
             cae: !!d.cae, estado: 'quieta', origen: { x: pts[0][0], y: pts[0][1] },
             grupo: d.grupo || null, indice: d.indice || 0, tCaida: d.tCaida || 0.8,
             t: 0, retraso: 0, pisadaEn: -9, reaparece: 0, sacudida: 0, vyCae: 0 };
  }

  const CAIDA_G = 900, CAIDA_MAX = 700, REAPARECE = 3;   // s hasta que vuelve una plataforma que cayó

  function crearCanon(d) {
    return { col: d.col, row: d.row, dir: d.dir || 1, cada: d.cada || 2.5, velocidad: d.velocidad || 90, t: d.inicio || 0 };
  }

  // Cañón de pared o de suelo: la boca mira hacia 'dir' (1 derecha, -1 izquierda). Coordenadas de un bloque.
  function dibujarCanon(g, dir) {
    const d = dir > 0 ? 1 : -1;
    g.fillStyle = grad(g, 3, 8, 3, 16, ['#6a7088', '#353a4c']);
    rr(g, 3, 8, 10, 8, 2); g.fill(); trazar(g, OUT, 0.8);
    g.fillStyle = grad(g, 0, 4, 0, 9, ['#8c94ac', '#4a5064']);
    const bx = d > 0 ? 6 : 0;
    rr(g, bx, 4.5, 10, 4.5, 1.5); g.fill(); trazar(g, OUT, 0.8);
    // boca oscura
    g.fillStyle = '#15121c';
    g.beginPath(); g.ellipse(d > 0 ? 15.5 : 0.5, 6.7, 0.9, 2.2, 0, 0, Math.PI * 2); g.fill();
    // tornillo del soporte
    g.fillStyle = '#d6dae6';
    g.beginPath(); g.arc(8, 12, 1.1, 0, Math.PI * 2); g.fill();
  }

  // Bala de cañón: cápsula negra con un ojo; el ojo mira hacia donde vuela. Coordenadas de 8 × 6 px.
  function dibujarBala(g, derecha) {
    const cola = derecha ? 0 : 8;
    g.fillStyle = '#24242e';
    g.beginPath(); g.ellipse(4, 3, 4, 2.8, 0, 0, Math.PI * 2); g.fill(); trazar(g, OUT, 0.5);
    g.beginPath();
    g.moveTo(cola, 3); g.lineTo(derecha ? -1.8 : 9.8, 0.4); g.lineTo(derecha ? -1.8 : 9.8, 5.6); g.closePath();
    g.fillStyle = '#24242e'; g.fill(); trazar(g, OUT, 0.4);
    const fx = derecha ? 5.6 : 2.4;
    g.fillStyle = '#ffffff';
    g.beginPath(); g.arc(fx, 2.3, 1.2, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#111';
    g.beginPath(); g.arc(fx + (derecha ? 0.4 : -0.4), 2.3, 0.55, 0, Math.PI * 2); g.fill();
  }

  // Posición de una plataforma a lo largo de sus puntos (s: distancia recorrida)
  function posicionEn(p, s) {
    let resto = s;
    for (let i = 0; i < p.segs.length; i++) {
      if (resto <= p.segs[i] || i === p.segs.length - 1) {
        const t = p.segs[i] ? Math.min(1, resto / p.segs[i]) : 0;
        const a = p.pts[i], b = p.pts[i + 1];
        return { x: a[0] + (b[0] - a[0]) * t, y: a[1] + (b[1] - a[1]) * t };
      }
      resto -= p.segs[i];
    }
    return { x: p.pts[0][0], y: p.pts[0][1] };
  }

  function crear(mapa, decor, extras) {
    const grid = leerMapa(mapa);
    const rows = grid.length;
    const cols = grid[0].length;
    // Capa de decoración: misma cuadrícula; no es sólida
    const capaDeco = [];
    for (let r = 0; r < rows; r++) {
      const texto = (decor && decor[r]) || '';
      const fila = [];
      for (let c = 0; c < cols; c++) fila.push(c < texto.length ? texto[c] : ' ');
      capaDeco.push(fila);
    }

    function get(c, r) {
      if (r < 0 || r >= rows || c < 0 || c >= cols) return ' ';
      return grid[r][c];
    }
    function set(c, r, ch) { grid[r][c] = ch; }
    function esSolido(ch) { return SOLIDOS.indexOf(ch) !== -1; }
    function alAire(c, r) { return !esSolido(get(c, r)); }

    // Punto de inicio
    let spawn = null;
    for (let r = 0; r < rows && !spawn; r++) {
      for (let c = 0; c < cols && !spawn; c++) {
        if (grid[r][c] === INICIO) spawn = { x: c * TILE, y: r * TILE + 2 };
      }
    }

    // Recorre las celdas que toca una caja; fn devuelve un valor para parar
    function celdasDe(caja, fn) {
      for (let r = Math.floor(caja.y / TILE); r <= Math.floor((caja.y + caja.h - EPS) / TILE); r++) {
        for (let c = Math.floor(caja.x / TILE); c <= Math.floor((caja.x + caja.w - EPS) / TILE); c++) {
          const v = fn(get(c, r), c, r);
          if (v) return v;
        }
      }
      return null;
    }

    let reloj = 0;
    // Puentes: cada tramo de 16 px cae por su cuenta; al pisar uno, los demás caen en cascada
    const defs = ((extras && extras.plataformas) || []).slice();
    ((extras && extras.puentes) || []).forEach(function (pt, gi) {
      for (let k = 0; k < pt.n; k++) {
        defs.push({ puntos: [[pt.x + k * TILE, pt.y]], w: TILE, cae: true, grupo: 'puente' + gi, indice: k, tCaida: pt.tCaida || 0.6 });
      }
    });
    const plataformas = defs.map(crearPlataforma);
    const canones = ((extras && extras.canones) || []).map(crearCanon);
    let balas = [];
    const muellesActivos = {};
    const anchoMundo = cols * TILE, altoMundo = rows * TILE;

    function solapa(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    // Al pisar una plataforma que cae, empieza a temblar el grupo entero (los puentes caen en cascada)
    function disparar(p) {
      const grupo = p.grupo ? plataformas.filter(function (q) { return q.grupo === p.grupo; }) : [p];
      grupo.forEach(function (q) {
        if (q.estado !== 'quieta') return;
        q.estado = 'temblando'; q.t = 0;
        q.retraso = 0.15 * Math.abs(q.indice - p.indice);
      });
    }

    function actualizarCaida(p, dt, caja) {
      p.dx = 0; p.dy = 0;
      if (p.estado === 'oculta') {
        p.reaparece -= dt;
        // Vuelve a su sitio cuando ya no hay nadie encima
        if (p.reaparece <= 0 && !(caja && solapa(caja, { x: p.origen.x, y: p.origen.y - 16, w: p.w, h: 32 }))) {
          p.estado = 'quieta'; p.x = p.origen.x; p.y = p.origen.y; p.vyCae = 0;
        }
        return;
      }
      if (p.estado === 'quieta') {
        if (reloj - p.pisadaEn < 0.05) disparar(p);
        return;
      }
      if (p.estado === 'temblando') {
        p.t += dt;
        p.sacudida = Math.sin(p.t * 70) * 1.2;
        if (p.t >= p.tCaida + p.retraso) { p.estado = 'cayendo'; p.sacudida = 0; p.vyCae = 0; }
        return;
      }
      // cayendo
      p.vyCae = Math.min(p.vyCae + CAIDA_G * dt, CAIDA_MAX);
      const dy = p.vyCae * dt;
      p.dy = dy; p.y += dy;
      if (p.y > altoMundo + 24) { p.estado = 'oculta'; p.reaparece = REAPARECE; p.dy = 0; }
    }


    // Plataforma sobre la que está la caja (de pie, sin subir)
    function plataformaBajo(caja) {
      for (let i = 0; i < plataformas.length; i++) {
        const p = plataformas[i];
        if (p.estado === 'oculta') continue;
        const topeAntes = p.y - p.dy;
        if (Math.abs(caja.y + caja.h - topeAntes) <= 1.5 && caja.x + caja.w > p.x + EPS && caja.x < p.x + p.w - EPS) return p;
      }
      return null;
    }

    // Plataforma móvil sobre la que cae la caja: la más alta que toca en este cuadro
    function plataformaQueCae(x, w, h, bottomAntes, ny, topeTile) {
      let mejor = null;
      for (let i = 0; i < plataformas.length; i++) {
        const p = plataformas[i];
        if (p.estado === 'oculta') continue;
        if (bottomAntes <= p.y + EPS && ny + h >= p.y - EPS && x + w > p.x + EPS && x < p.x + p.w - EPS && p.y < topeTile) {
          if (mejor === null || p.y < mejor.y) mejor = p;
        }
      }
      return mejor;
    }

    // Muelle bajo los pies: una celda 'M' en la fila de aterrizaje
    function muelleEn(c0, c1, row) {
      for (let c = c0; c <= c1; c++) if (get(c, row) === MUELLE) return { col: c, row: row };
      return null;
    }

    const mundo = {
      tile: TILE,
      plataformas: plataformas,
      U: U,
      cols: cols,
      rows: rows,
      ancho: cols * TILE,
      alto: rows * TILE,
      spawn: spawn,
      jugador: null,

      // Para los enemigos: a los lados y bajo el mapa siempre hay pared o suelo
      solid: function (x, y) {
        const c = Math.floor(x / TILE), r = Math.floor(y / TILE);
