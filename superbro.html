/* =====================================================================
   7. GENERADOR DE NIVELES
   Convierte la especificación "gen" (o un "mapa" escrito a mano) en:
     { cols, rows, tiles[][], ents[], goalX, theme, boss }
   Tiles: "." vacío, "G" suelo, "B" ladrillo, "Q" bloque ?, "S" bloque
          sólido, "T" tubería, "F" poste de meta.
   Entidades: "walker" "shell" "flyer" "plant" "coin" "boss".
   ===================================================================== */
const LEYENDA_MAPA = {
  ".": null, G: "G", B: "B", Q: "Q", S: "S", T: "T", F: "F",
  w: "walker", s: "shell", f: "flyer", p: "plant", c: "coin", J: "boss",
};
const ROWS = 14;           // 14 tiles * 16px = 224px de alto
const GY = 11;             // fila del suelo (la superior)
const ITEMS_Q = ["moneda", "moneda", "hongo", "hongo", "flor", "pluma", "estrella"];

// Generador pseudoaleatorio determinista (mulberry32): misma semilla = mismo nivel
function prng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Crea una rejilla vacía
function gridVacia(cols) {
  const t = [];
  for (let r = 0; r < ROWS; r++) t.push(new Array(cols).fill("."));
  return t;
}

/* Genera un nivel a partir de gen = { seed, dif, enemigos, huecos? } */
function generarNivel(gen) {
  const rnd01 = prng(gen.seed);
  const r = (a, b) => a + rnd01() * (b - a);
  const ri = (a, b) => Math.floor(r(a, b + 1));
  const dif = clamp(gen.dif || 1, 1, 8);
  const tipos = gen.enemigos && gen.enemigos.length ? gen.enemigos : ["walker"];
  const cols = 188;                 // ~3000px de ancho
  const tiles = gridVacia(cols);
  const ents = [];

  // Límites de las 3 secciones: abierta, plataformas flotantes y meta
  const A1 = 90, B1 = 146, C1 = 180;
  // Huecos saltables caminando (2 tiles) en los primeros mundos; más anchos al subir la dificultad
  const gapMax = dif <= 3 ? 2 : dif <= 5 ? 3 : 4;

  // Suelo base con huecos controlados (nunca dos huecos juntos)
  const suelo = new Array(cols).fill(true);
  let c = 6;
  while (c < C1) {
    const seccionB = c >= A1 && c < B1;
    if (seccionB && rnd01() < 0.25 + dif * 0.04) {
      const w = ri(2, gapMax);
      for (let k = 0; k < w && c + k < cols; k++) suelo[c + k] = false;
      c += w + ri(3, 5);            // al menos 3 tiles de suelo entre huecos
    } else {
      c += ri(4, 9);
    }
  }
  for (let x = 0; x < cols; x++) {
    if (!suelo[x]) continue;
    for (let y = GY; y < ROWS; y++) tiles[y][x] = "G";
  }

  // Escalones y bloques sólidos en la zona de meta
  for (let x = C1; x < cols - 4; x++) {
    const alto = clamp(Math.floor((x - C1) / 2) + 1, 1, 6);
    for (let k = 0; k < alto && GY - 1 - k >= 0; k++) {
      if (suelo[x]) tiles[GY - 1 - k][x] = "S";
    }
  }
  // Suelo final
  for (let x = C1; x < cols; x++) if (suelo[x]) for (let y = GY; y < ROWS; y++) tiles[y][x] = "G";
  const goalX = cols - 4;
  for (let y = 4; y < GY; y++) tiles[y][goalX] = "F";

  // Sección abierta: bloques ? y ladrillos
  for (let x = 12; x < A1; x++) {
    if (rnd01() < 0.06 + dif * 0.005) {
      const row = 7;
      if (rnd01() < 0.5) {
        tiles[row][x] = "Q";
      } else {
        for (let k = 0; k < ri(1, 3) && x + k < A1; k++) tiles[row][x + k] = "B";
      }
      x += 4;
    }
  }
  // Sección de plataformas flotantes: ladrillos y ? en el aire
  for (let x = A1; x < B1; x++) {
    if (rnd01() < 0.1) {
      const row = ri(6, 8);
      const n = ri(2, 4);
      for (let k = 0; k < n && x + k < B1; k++) {
        if (!tiles[row][x + k] || tiles[row][x + k] === ".") {
          tiles[row][x + k] = k === 1 && rnd01() < 0.4 ? "Q" : "B";
        }
      }
      x += n + 2;
    }
  }

  // Aire libre sobre cada hueco: un bloque encima frena el salto (la cabeza choca) y el jugador cae
  for (let x = 0; x < cols; x++) {
    if (suelo[x]) continue;
    for (let r = 4; r <= GY - 3; r++) for (let c = x - 1; c <= x + 1; c++) if (c >= 0 && c < cols) tiles[r][c] = ".";
  }

  // Tuberías con plantas (si el enemigo "plant" está permitido)
  if (tipos.includes("plant")) {
    for (let x = 30; x < B1; x += ri(22, 30)) {
      if (!suelo[x] || !suelo[x + 1]) continue;
      tiles[GY - 1][x] = "T"; tiles[GY - 2][x] = "T";
      tiles[GY - 1][x + 1] = "T"; tiles[GY - 2][x + 1] = "T";
      ents.push({ t: "plant", x: x * TILE + 1, y: (GY - 2) * TILE - 8 });
      // Despeja el aire sobre la tubería: un bloque a esa altura deja un hueco de 16 px
      // que el jugador (también de 16 px) no puede cruzar sin un salto perfecto
      for (let c = x - 2; c <= x + 3; c++) for (let r = 4; r <= GY - 3; r++) if (c >= 0 && c < cols) tiles[r][c] = ".";
    }
  }

  // Enemigos caminantes/caparazones/voladores sobre el suelo
  const nEnem = 4 + dif * 2;
  for (let i = 0; i < nEnem; i++) {
    const x = ri(10, C1 - 4);
    if (!suelo[x] || x < 12 || tiles[GY - 1][x] !== ".") continue;
    const t = tipos[ri(0, tipos.length - 1)];
    if (t === "plant") continue;
    if (t === "flyer") {
      ents.push({ t, x: x * TILE, y: ri(3, 7) * TILE });
    } else {
      ents.push({ t, x: x * TILE, y: (GY - 1) * TILE });
    }
  }

  // Monedas en arcos sobre el suelo (zona abierta y plataformas)
  for (let x = 16; x < B1; x += ri(10, 16)) {
    const n = ri(3, 5);
    for (let k = 0; k < n; k++) {
      const yArc = 8 - Math.round(Math.sin((k / (n - 1)) * Math.PI) * 2);
      ents.push({ t: "coin", x: (x + k) * TILE + 4, y: yArc * TILE + 4 });
    }
  }

  // Bloques ? con contenido elegido por la semilla
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < cols; x++) {
    if (tiles[y][x] === "Q") {
      ents.push({ t: "qitem", x: x * TILE, y: y * TILE, item: ITEMS_Q[ri(0, ITEMS_Q.length - 1)] });
    }
  }

  // Jefe al final de la zona de escalones, si el nivel es de castillo
  if (gen.jefe) {
    ents.push({ t: "boss", x: (C1 - 16) * TILE, y: (GY - 1) * TILE - 16 });
  }

  // El inicio siempre está libre de enemigos
  return {
    cols, rows: ROWS, tiles,
    ents: ents.filter((e) => e.x >= 10 * TILE),
    start: { x: 3 * TILE, y: (GY - 2) * TILE },
    goalX: goalX * TILE,
    theme: gen.theme || null,
    boss: !!gen.jefe,
  };
}

/* Convierte un mapa escrito a mano (array de strings) en el mismo formato */
function parsearMapa(strs) {
  const cols = strs[0].length;
  const tiles = gridVacia(cols);
  const ents = [];
  let start = { x: 3 * TILE, y: (GY - 2) * TILE };
  let goalX = (cols - 4) * TILE;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < cols; x++) {
    const ch = strs[y] && strs[y][x] ? strs[y][x] : ".";
    const tipo = LEYENDA_MAPA[ch];
    if (ch === "@") { start = { x: x * TILE, y: y * TILE }; continue; }
    if (tipo === undefined) continue;
    if (tipo === null) continue;
    if (["G", "B", "Q", "S", "T", "F"].includes(tipo)) {
      tiles[y][x] = tipo;
      if (tipo === "F") goalX = x * TILE;
      if (tipo === "Q") ents.push({ t: "qitem", x: x * TILE, y: y * TILE, item: "moneda" });
    } else {
      ents.push({ t: tipo, x: x * TILE, y: y * TILE });
    }
  }
  return { cols, rows: ROWS, tiles, ents, start, goalX, theme: null, boss: false };
}

/* Punto de entrada: usa el mapa escrito a mano si existe, si no genera */
function construirNivel(def, tema) {
  const lv = def.mapa ? parsearMapa(def.mapa) : generarNivel(Object.assign({ theme: tema }, def.gen, { jefe: def.jefe }));
  lv.nombre = def.nombre;
  lv.tiempo = def.tiempo || 300;
  return lv;
}

/* =====================================================================
   8. COLISIÓN CON TILES Y FÍSICA DEL JUGADOR
   Movimiento por ejes: primero X (y paredes), luego Y (suelo/techo).
   ===================================================================== */
const SOLIDOS = { G: 1, B: 1, Q: 1, S: 1, T: 1, U: 1 };

// Devuelve el carácter del tile en (col,fila); fuera del nivel: lateral = pared, abajo = vacío
function tileAt(lvl, col, row) {
  if (col < 0 || col >= lvl.cols) return "S";
  if (row < 0) return ".";
  if (row >= lvl.rows) return ".";
  return lvl.tiles[row][col];
}

// Recorre los tiles que toca un rectángulo y devuelve true si alguno es sólido
function tocaSolido(lvl, x, y, w, h) {
  const c0 = Math.floor(x / TILE), c1 = Math.floor((x + w - 0.01) / TILE);
  const r0 = Math.floor(y / TILE), r1 = Math.floor((y + h - 0.01) / TILE);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (SOLIDOS[tileAt(lvl, c, r)]) return true;
  }
  return false;
}

/* Mueve una entidad {x,y,w,h,vx,vy} resolviendo colisiones por ejes.
   Devuelve { lado, techo, suelo } para saber qué tocó. */
function moverEntidad(lvl, e, dt) {
  const res = { pared: false, techo: false, suelo: false };
  // --- Eje X ---
  e.x += e.vx * dt;
  if (tocaSolido(lvl, e.x, e.y, e.w, e.h)) {
    res.pared = true;
    if (e.vx > 0) e.x = Math.floor((e.x + e.w) / TILE) * TILE - e.w;
    else e.x = Math.floor(e.x / TILE + 1) * TILE;
    e.vx = 0;
  }
  // --- Eje Y ---
  e.y += e.vy * dt;
  if (tocaSolido(lvl, e.x, e.y, e.w, e.h)) {
    if (e.vy > 0) {
      e.y = Math.floor((e.y + e.h) / TILE) * TILE - e.h;
      res.suelo = true;
    } else {
      e.y = Math.floor(e.y / TILE + 1) * TILE;
      res.techo = true;
    }
    e.vy = 0;
  }
  return res;
}

/* =====================================================================
   9. JUGADOR
   Estados: pequeño/grande, fuego, capa (planeo) e invencible (estrella).
   ===================================================================== */
const PHYS = {
  walkAccel: 700, runAccel: 900, airAccel: 520,
  maxWalk: 95, maxRun: 165,
  friction: 620,
  jumpV: 300, jumpHoldG: 520,  // gravedad reducida mientras se mantiene salto
  spinV: 250, spinTime: 0.42,
  coyote: 0.1, buffer: 0.12,
  glideV: 70, glideTime: 1.6,  // planeo con capa
  shellSpeed: 230,
};

class Player {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.w = 12; this.h = 16;   // hitbox pequeño (el sprite es de 16x22)
    this.pose = "quieto";       // pose visual actual (ver heroeSprite)
    this.frame = 0;
    this.zancada = 0;           // distancia recorrida en el suelo: marca el ciclo de piernas
    this.frenadoT = 0;          // tiempo de derrape al cambiar de dirección a toda velocidad
    this.aterrizajeT = 0;       // tiempo de aplastamiento al aterrizar
    this.spinAnim = 0;          // reloj del giro
    this.facing = 1;
    this.onGround = false;
    this.coyoteT = 0;        // tiempo desde que dejó el suelo
    this.bufferT = 0;        // tiempo desde que se pulsó saltar
    this.jumping = false;    // salto en curso (se puede soltar para cortarlo)
    this.spinT = 0;          // temporizador del salto giratorio
    this.glideT = 0;         // planeo restante
    this.big = false;
    this.fire = false;
    this.cape = false;
    this.star = 0;           // segundos de invencibilidad
    this.hurtT = 0;          // segundos de animación de daño / invulnerabilidad
    this.animT = 0;          // reloj de animación
    this.carrying = null;    // caparazón que lleva en la mano
    this.dead = false;
    this.duck = false;
  }

  // Aplica el estado de tamaño (pequeño = 10x14, grande = 10x20)
  setBig(b) {
    if (b === this.big) return;
    const bottom = this.y + this.h;
    this.big = b;
    this.h = b ? 26 : 16;
    this.y = bottom - this.h; // crece hacia arriba, nunca se mete en el suelo
  }

  get invencible() { return this.star > 0 || this.hurtT > 0; }

  // Hace daño: reduce el poder o muere si era pequeño
  golpear() {
    if (this.invencible) return "ignorado";
    if (this.fire || this.cape) { this.fire = false; this.cape = false; this.hurtT = 1.5; return "pierde-poder"; }
    if (this.big) { this.setBig(false); this.hurtT = 1.5; return "encoge"; }
    this.dead = true;
    return "muere";
  }

  // Lógica del jugador por frame (entrada + física + colisiones)
  update(dt, lvl, game) {
    this.prevBottom = this.y + this.h;   // base del jugador antes de moverse (para pisotones)
    this.animT += dt;
    if (this.star > 0) this.star -= dt;
    if (this.hurtT > 0) this.hurtT -= dt;

    const izq = held.left, der = held.right;
    const corre = held.run > 0;
    // Derrape: cambiar de dirección en el suelo a buena velocidad
    const dirH = (der ? 1 : 0) - (izq ? 1 : 0);
    if (this.onGround && dirH !== 0 && Math.sign(this.vx) === -dirH && Math.abs(this.vx) > 90 && this.frenadoT <= 0) {
      this.frenadoT = 0.22;
      emitir(this.x + this.w / 2, this.y + this.h, 4, ["#e8e8f0", "#c8c8d8"], { up: 30, spread: 60, life: 0.3, size: 2 });
    }
    if (this.frenadoT > 0) this.frenadoT -= dt;
    this.duck = held.down && this.onGround && this.big;

    // --- Movimiento horizontal ---
    const dir = (der ? 1 : 0) - (izq ? 1 : 0);
    const maxV = corre ? PHYS.maxRun : PHYS.maxWalk;
    const acc = this.onGround ? (corre ? PHYS.runAccel : PHYS.walkAccel) : PHYS.airAccel;
    if (dir !== 0 && !this.duck) {
      this.facing = dir;
      if (Math.abs(this.vx) < maxV || Math.sign(this.vx) !== dir) this.vx += dir * acc * dt;
      if (Math.abs(this.vx) > maxV) this.vx = Math.sign(this.vx) * Math.max(maxV, Math.abs(this.vx) - 400 * dt);
    } else {
      // Fricción: frena suavemente al soltar la dirección
      const f = PHYS.friction * dt;
      if (Math.abs(this.vx) <= f) this.vx = 0;
      else this.vx -= Math.sign(this.vx) * f;
    }
    // Durante el derrape se frena más fuerte
    if (this.frenadoT > 0 && this.onGround) this.vx -= Math.sign(this.vx) * PHYS.friction * 1.6 * dt;
    if (this.duck) this.vx = 0;

    // --- Salto: buffer (recordar pulsación) y coyote time (saltar tras caer) ---
    if (consume("jump")) this.bufferT = PHYS.buffer;
    else this.bufferT -= dt;
    this.coyoteT = this.onGround ? PHYS.coyote : this.coyoteT - dt;

    if (this.bufferT > 0 && this.coyoteT > 0 && !this.duck) {
      this.vy = -PHYS.jumpV - Math.abs(this.vx) * 0.25;
      this.bufferT = 0; this.coyoteT = 0;
      this.jumping = true;
      this.onGround = false;
      game.sfx("salto");
    }

    // --- Salto giratorio (C / Shift): rebota y rompe bloques giratorios ---
    if (consume("spin") && !this.onGround && this.spinT <= 0) {
      this.spinT = PHYS.spinTime;
      this.vy = Math.min(this.vy, -PHYS.spinV * 0.5);
      game.sfx("giro");
    }
    if (this.spinT > 0) this.spinT -= dt;

    // --- Planeo con capa: mantener salto en el aire ---
    if (this.cape && !this.onGround && held.jump && this.vy > 0 && this.glideT > 0) {
      this.vy = Math.min(this.vy, PHYS.glideV);
      this.glideT -= dt;
    }
    if (this.onGround) this.glideT = PHYS.glideTime;

    // --- Gravedad: más suave si se mantiene salto subiendo (salto variable) ---
    const subiendoConSalto = this.vy < 0 && held.jump && this.jumping;
    const g = subiendoConSalto ? PHYS.jumpHoldG : GRAVITY;
    if (!(this.cape && held.jump && this.glideT > 0 && this.vy >= 0 && this.vy <= PHYS.glideV)) {
      this.vy += g * dt;
    }
    if (this.vy > MAX_FALL) this.vy = MAX_FALL;
    if (this.vy >= 0) this.jumping = false;
    if (!held.jump && this.vy < -120) this.vy = -120; // corta el salto al soltar

    // --- Colisiones ---
    const vyAntes = this.vy, enAireAntes = !this.onGround;
    const r = moverEntidad(lvl, this, dt);
    if (r.pared) this.vx = 0;
    if (r.techo) {
      game.golpearDesdeAbajo(this);
    }
    this.onGround = r.suelo;
    // Aterrizaje fuerte: aplastamiento y polvo
    if (r.suelo && enAireAntes && vyAntes > 150) {
      this.aterrizajeT = 0.12;
      emitir(this.x + this.w / 2, this.y + this.h, 6, ["#e8e8f0", "#c8c8d8"], { up: 40, spread: 70, life: 0.35, size: 2 });
    }
    if (this.aterrizajeT > 0) this.aterrizajeT -= dt;
    if (r.suelo) this.jumping = false;

    // Caer fuera del nivel
    if (this.y > lvl.rows * TILE + 40) this.dead = true;

    this.calcularPose(dt);

    // Límite izquierdo del nivel
    if (this.x < 0) { this.x = 0; this.vx = 0; }
  }

  // Elige la pose visual y el frame según el estado (usa heroeSprite)
  calcularPose(dt) {
    if (this.spinT > 0) this.spinAnim += dt;
    if (this.dead) this.pose = "muerto";
    else if (this.hurtT > 0) this.pose = "dano";
    else if (this.spinT > 0) this.pose = "giro";
    else if (this.duck) this.pose = "agachado";
    else if (!this.onGround) this.pose = this.vy < 0 ? "salto" : "caida";
    else if (this.frenadoT > 0) this.pose = "frenado";
    else if (Math.abs(this.vx) > 120 && held.run) this.pose = "correr";
    else if (Math.abs(this.vx) > 25) this.pose = "andar";
    else this.pose = "quieto";
    if (this.onGround && (this.pose === "andar" || this.pose === "correr")) this.zancada += Math.abs(this.vx) * dt;
    const f = this.pose === "andar" ? this.zancada / 13
      : this.pose === "correr" ? this.zancada / 17
      : this.pose === "giro" ? this.spinAnim * 18
      : this.pose === "quieto" ? this.animT * 1.6 : 0;
    this.frame = Math.floor(f);
  }
}

/* =====================================================================
   10. ENEMIGOS, JEFE, MONEDAS, OBJETOS Y PARTÍCULAS
   ===================================================================== */

/* Enemigo genérico. t = "walker" | "shell" | "flyer" | "plant" | "caparazon"
   - walker: camina, da la vuelta en paredes y cae en huecos.
   - shell: como walker, pero al pisarlo se convierte en caparazón.
   - caparazon: quieto (se puede empujar) o deslizándose (mata enemigos).
   - flyer: vuela en onda senoidal, sin gravedad.
   - plant: sale y entra de una tubería, no se puede pisar. */
class Enemy {
  constructor(t, x, y) {
    this.t = t;
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.alive = true;
    this.anim = 0;
    this.baseY = y;
    this.slideT = 0;     // tiempo que lleva el caparazón deslizándose
    this.muerteT = 0;    // animación de muerte antes de desaparecer
    const dims = { walker: [14, 14], shell: [14, 18], caparazon: [14, 10], flyer: [14, 12], plant: [12, 22] };
    [this.w, this.h] = dims[t];
    this.vx = t === "flyer" ? 0 : -28;
    this.dir = -1;
    this.esPeligroso = true;
  }

  // Lo llamamos cuando el jugador pisa al enemigo
  // Devuelve "rebota" si el jugador debe rebotar
  pisado(player, game) {
    if (this.t === "plant") return "daña";
    if (this.t === "walker") { this.morir(game); return "rebota"; }
    if (this.t === "shell") {
      this.t = "caparazon"; this.vx = 0; this.h = 8; this.w = 12; this.y += 2;
      game.sfx("pisar");
      return "rebota";
    }
    if (this.t === "caparazon") {
      // Pisar un caparazón quieto lo empuja en la dirección del jugador
      if (this.vx === 0) {
        this.vx = player.x < this.x ? PHYS.shellSpeed : -PHYS.shellSpeed;
        this.slideT = 0;
        game.sfx("patear");
      } else {
        this.vx = 0; // lo detiene
      }
      return "rebota";
    }
    if (this.t === "flyer") { this.t = "walker"; this.vy = 0; game.sfx("pisar"); return "rebota"; }
    return "daña";
  }

  morir(game) {
    this.alive = false;
    this.muerteT = 0.35;
    game.puntos(100);
    game.efectoEnemigo(this.x, this.y);
  }

  update(dt, lvl, game) {
    this.anim += dt;
    if (!this.alive) {
      this.muerteT -= dt;
      this.y += 200 * dt;
      return;
    }
    if (this.t === "flyer") {
      this.x += -40 * dt;
      this.y = this.baseY + Math.sin(this.anim * 3) * 14;
      if (this.x < -20) this.alive = false;
      return;
    }
    if (this.t === "plant") {
      // Ciclo de tubería: sube (visible) y baja (escondida)
      const ciclo = (this.anim % 3) / 3;
      const alzada = ciclo < 0.5 ? ciclo * 2 : (1 - ciclo) * 2;
      this.y = this.baseY - 14 * Math.min(1, alzada * 1.4);
      return;
    }
    if (this.t === "caparazon" && this.vx !== 0) this.slideT += dt;

    // Gravedad común a caminantes y caparazones
    this.vy += GRAVITY * dt;
    if (this.vy > MAX_FALL) this.vy = MAX_FALL;
    const r = moverEntidad(lvl, this, dt);

    if (this.t === "caparazon") {
      // Un caparazón deslizándose rebota en las paredes
      if (r.pared) this.vx = -this.vx;
      return;
    }
    // Caminante: da la vuelta en paredes y al borde de un hueco
    if (r.pared) { this.dir = -this.dir; }
    if (r.suelo && !tocaSolido(lvl, this.x + (this.dir > 0 ? this.w + 1 : -1), this.y + this.h + 1, 1, 1)) {
      this.dir = -this.dir;
    }
    this.vx = 28 * this.dir;
    // Caparazón que cae fuera del nivel desaparece
    if (this.y > lvl.rows * TILE) this.alive = false;
  }
}

/* Jefe del castillo: 3 golpes en la cabeza. Salta hacia el jugador. */
class Boss {
  constructor(x, y) {
    this.t = "boss";
    this.x = x; this.y = y;
    this.w = 24; this.h = 28;
    this.vx = 0; this.vy = 0;
    this.hp = 3;
    this.alive = true;
    this.inmuneT = 0;
    this.saltoT = 1.2;
    this.retrocesoT = 0;   // tiempo que retrocede tras un pisotón
    this.pausaT = 0;       // tiempo que se queda quieto tras retroceder
    this.dir = -1;
    this.anim = 0;
    this.muerteT = 0;
  }

  // Pisar al jefe: resta vida y rebota; sin vida, muere
  pisado(player, game) {
    if (this.inmuneT > 0) return "rebota";
    this.hp--;
    this.inmuneT = 1.2;
    // Retrocede y se queda quieto un momento: así el jugador puede volver a pisarlo
    this.vx = (player.x < this.x ? 1 : -1) * 110;
    this.retrocesoT = 0.45;
    this.pausaT = 1.4;
    game.sfx("pisar");
    if (this.hp <= 0) {
      this.alive = false;
      this.muerteT = 1.2;
      game.puntos(1000);
      game.efectoEnemigo(this.x, this.y);
    }
    return "rebota";
  }

  update(dt, lvl, game, player) {
    this.anim += dt;
    if (!this.alive) { this.muerteT -= dt; this.y += 60 * dt; return; }
    if (this.inmuneT > 0) this.inmuneT -= dt;
    // Persigue al jugador: camina y salta a ritmo fijo
    this.dir = player.x < this.x ? -1 : 1;
    const cerca = Math.abs(player.x - this.x) < 120;
    if (this.retrocesoT > 0) {
      this.retrocesoT -= dt;                  // retrocede tras un pisotón
    } else if (this.pausaT > 0) {
      this.pausaT -= dt;                      // se queda quieto un momento
      this.vx = 0;
    } else {
      this.vx = this.dir * (34 + (3 - this.hp) * 10);   // persigue al jugador
    }
    this.saltoT -= dt;
    this.vy += GRAVITY * dt;
    if (this.saltoT <= 0 && this.vy === 0 && cerca && this.retrocesoT <= 0 && this.pausaT <= 0) {
      this.vy = -300;
      this.saltoT = 1.4 - (3 - this.hp) * 0.2;
    }
    if (this.vy > MAX_FALL) this.vy = MAX_FALL;
    const r = moverEntidad(lvl, this, dt);
    if (r.pared) this.vx = 0;
    // Límites: no sale del nivel por la izquierda ni la derecha
    if (this.x < 40) this.x = 40;
    if (this.x > lvl.goalX - 80) this.x = lvl.goalX - 80;
    // Para que el jefe no quede pegado al suelo al saltar
    if (r.suelo) this.vy = 0;
  }
}

/* Moneda: se recoge al tocarla. Gira con 3 fotogramas. */
class Coin {
  constructor(x, y, suelta = false) {
    this.x = x; this.y = y; this.w = 8; this.h = 10;
    this.alive = true;
    this.anim = Math.random() * 3;
    this.suelta = suelta;   // salió de un bloque (sube y desaparece)
    this.vy = suelta ? -150 : 0;
    this.vidaT = suelta ? 0.5 : Infinity;
  }
  update(dt) {
    this.anim += dt * 8;
    if (this.suelta) {
      this.y += this.vy * dt;
      this.vy += 600 * dt;
      this.vidaT -= dt;
      if (this.vidaT <= 0) this.alive = false;
    }
  }
}

/* Objeto de bloque ?: hongo, flor, pluma o estrella. Sale del bloque y avanza. */
class PowerUp {
  constructor(tipo, x, y) {
    this.tipo = tipo;
    this.x = x; this.y = y;
    this.w = 14; this.h = 14;
    this.vx = tipo === "flor" ? 0 : 50;
    this.vy = 0;
    this.alive = true;
    this.saliendoT = 0.4;  // sube un poco antes de empezar a moverse
    this.yDestino = y - 16;
  }
  update(dt, lvl) {
    if (this.saliendoT > 0) {
      this.saliendoT -= dt;
      this.y -= 40 * dt;
      return;
    }
    if (this.tipo === "flor") return;
    this.vy += GRAVITY * dt;
    if (this.vy > MAX_FALL) this.vy = MAX_FALL;
    const r = moverEntidad(lvl, this, dt);
    if (r.pared) this.vx = -this.vx;
    if (this.y > lvl.rows * TILE) this.alive = false;
  }
}

/* Partículas pixeladas: cuadrados que caen y se desvanecen */
const particulas = [];
function emitir(x, y, n, colores, opts = {}) {
  for (let i = 0; i < n; i++) {
    particulas.push({
      x, y,
      vx: rnd(-(opts.spread || 80), opts.spread || 80),
      vy: rnd(-(opts.up || 140), -(opts.up || 40)),
      g: opts.g === undefined ? 500 : opts.g,
      vida: rnd(0.3, opts.life || 0.6),
      max: opts.life || 0.6,
      color: colores[rndi(0, colores.length - 1)],
      size: opts.size || 2,
    });
  }
}
function actualizarParticulas(dt) {
  for (let i = particulas.length - 1; i >= 0; i--) {
    const p = particulas[i];
    p.vy += p.g * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vida -= dt;
    if (p.vida <= 0) particulas.splice(i, 1);
  }
}
function dibujarParticulas(cam) {
  for (const p of particulas) {
    rect(p.x - cam.x, p.y - cam.y, p.size, p.size, p.color);
  }
}

/* Mezcla un color hex con negro o blanco en proporción t (sombreado) */
function mezclar(hex, t, hacia = "#000000") {
  const a = parseInt(hex.slice(1), 16), b = parseInt(hacia.slice(1), 16);
  const out = [16, 8, 0].map((s) => {
    const x = (a >> s) & 255, y = (b >> s) & 255;
    return Math.round(x + (y - x) * t);
  });
  return "#" + out.map((v) => v.toString(16).padStart(2, "0")).join("");
}

/* =====================================================================
   13. ESCENARIO CON VOLUMEN (estilo consola de 16 bits, colores vivos)
   Todo se genera como matrices y pasa por spriteFromRows: el contorno
   y el bisel salen solos. Las texturas se cachean y se repiten en X
   con desplazamiento de parallax.
   ===================================================================== */
const mod = (a, n) => ((a % n) + n) % n;
const texturas = new Map();
function textura(key, fabricar) {
  if (!texturas.has(key)) texturas.set(key, fabricar());
  return texturas.get(key);
}

// Matriz de un círculo relleno (para soles, arbustos, etc.)
function circuloRows(r, ch) {
  const rows = [];
  for (let y = -r; y <= r; y++) {
    let f = "";
    for (let x = -r; x <= r; x++) f += x * x + y * y <= r * r ? ch : ".";
    rows.push(f);
  }
  return rows;
}

// Colina periódica: fnAlt(x) da la altura de la cima en cada columna
function texColinas(key, ancho, color, fnAlt, contorno = false) {
  return textura(key, () => {
    const alto = H_MIN; // las capas son de diseño: no dependen del tamaño de pantalla
    const rows = [];
    for (let y = 0; y < alto; y++) rows.push("");
    for (let x = 0; x < ancho; x++) {
      const top = Math.round(fnAlt(x));
      for (let y = 0; y < alto; y++) rows[y] += y >= top ? "c" : ".";
    }
    const sp = spriteFromRows(expandir(rows), { c: color }, contorno, true);
    sp.tw = ancho;
    return sp;
  });
}

// Pinta una capa periódica con parallax (factor = fracción de la cámara)
function capaPeriodica(sp, camX, factor, y) {
  const off = mod(Math.floor(camX * factor), sp.tw);
  for (let x = -off; x < W; x += sp.tw) drawSprite(sp, x, y);
}

// Cielo en bandas: del color del cielo a un tono más claro hacia el horizonte
function bandasCielo(pal, alto) {
  const banda = Math.ceil(alto / 8);
  for (let i = 0; i < 8; i++) {
    rect(0, i * banda, W, banda, mezclar(pal.cielo, i * 0.06, "#ffffff"));
  }
}

// Sol con borde de luz y contorno
function dibujarSol(pal, x, y) {
  const color = pal.sol || "#ffe36b";
  const sp = textura("sol-" + color, () => spriteFromRows(expandir(circuloRows(11, "c")), { c: color }));
  drawSprite(sp, x, y);
}

// Nube de tres bultos con base plana (se sombrea sola)
function texNube() {
  return textura("nube", () => {
    const rows = [];
    for (let y = 0; y < 18; y++) {
      let f = "";
      for (let x = 0; x < 42; x++) {
        const enCirculo =
          (x - 11) ** 2 + (y - 11) ** 2 <= 49 ||
          (x - 23) ** 2 + (y - 8) ** 2 <= 81 ||
          (x - 33) ** 2 + (y - 11) ** 2 <= 36;
        const base = y >= 11 && x >= 5 && x <= 37;
        f += enCirculo || base ? "c" : ".";
      }
      rows.push(f);
    }
    return spriteFromRows(expandir(rows), { c: "#ffffff" });
  });
}
function dibujarNubes(cam, alto) {
  const nube = texNube();
  for (let i = 0; i < 5; i++) {
    const x = mod(i * 97 - cam.x * 0.12, W + 90) - 45;
    drawSprite(nube, x, Math.round(alto * 0.12) + (i % 3) * 22);
  }
}

// Arbusto redondeado con sombreado (repetible)
function texArbusto(color) {
  return textura("arbusto-" + color, () => {
    const rows = [];
    for (let y = 0; y < 20; y++) {
      let f = "";
      for (let x = 0; x < 48; x++) {
        const en = (x - 12) ** 2 + (y - 13) ** 2 <= 81 || (x - 26) ** 2 + (y - 12) ** 2 <= 100 || (x - 38) ** 2 + (y - 14) ** 2 <= 64 || (y >= 14 && x >= 6 && x <= 42);
        f += en && y <= 19 ? "a" : ".";
      }
      rows.push(f);
    }
    const sp = spriteFromRows(expandir(rows), { a: color });
    sp.tw = 96;
    return sp;
  });
}

// Pirámide con bloques de piedra: cara iluminada a la izquierda, sombra a la derecha
function texPiramide(alto, base, pal) {
  return textura("piramide-" + alto + "-" + base, () => {
    const rows = [];
    const cx = base / 2;
    for (let y = 0; y < alto; y++) {
      const mitad = ((y + 1) / alto) * cx;
      let f = "";
      for (let x = 0; x < base; x++) {
        const dx = x + 0.5 - cx;
        if (Math.abs(dx) > mitad) { f += "."; continue; }
        const hilada = y % 7 === 6;
        f += hilada ? "m" : dx < 0 ? "l" : "d";
      }
      rows.push(f);
    }
    return spriteFromRows(expandir(rows), { l: pal.piedraClara, d: pal.piedraOscura, m: pal.piedraJunta }, true);
  });
}

// Escenario de pradera / genérico: cielo, sol, nubes, colinas y arbustos
function escenaColinas(cam, pal) {
  const lejos = texColinas("lejos-" + pal.lejos, 512, pal.lejos,
    (x) => 96 + Math.sin((x / 512) * Math.PI * 4) * 14 + Math.sin((x / 512) * Math.PI * 10) * 6);
  capaPeriodica(lejos, cam.x, 0.18, 0);
  const cerca = texColinas("cerca-" + pal.cerca, 512, pal.cerca,
    (x) => 128 + Math.sin((x / 512) * Math.PI * 6) * 12 + Math.sin((x / 512) * Math.PI * 14) * 4, true);
  capaPeriodica(cerca, cam.x, 0.4, 0);
  const arb = texArbusto(pal.arbusto);
  capaPeriodica(arb, cam.x, 0.7, 156);
}

// Escenario de desierto: pirámides, dunas y sol fuerte
function escenaDesierto(cam, pal) {
  const pir = texPiramide(74, 96, pal);
  const off = mod(cam.x * 0.3, 360);
  for (let k = -1; k < 4; k++) drawSprite(pir, k * 170 - off, 176 - 74);
  const dunas = texColinas("dunas-" + pal.cerca, 512, pal.cerca,
    (x) => 130 + Math.sin((x / 512) * Math.PI * 4) * 16 + Math.sin((x / 512) * Math.PI * 9) * 5, true);
  capaPeriodica(dunas, cam.x, 0.45, 0);
}

// Suelo de tiles bajo el área de diseño (solo si la pantalla es más alta)
function pintarExtension(pal, tema) {
  for (let y = OY + H_MIN; y < H; y += TILE) {
    const sp = tileSprite("G", pal, tema + "G-00");
    for (let x = 0; x < W; x += TILE) drawSprite(sp, x, y);
  }
}

function dibujarFondo(cam, pal, tema) {
  // Cielo de toda la pantalla: bandas hasta el horizonte (suelo de diseño + desplazamiento)
  const horizonte = OY + 176;
  rect(0, 0, W, H, pal.cielo);
  bandasCielo(pal, horizonte);
  dibujarSol(pal, W - 60, 24 + OY * 0.3);
  dibujarNubes(cam, horizonte);
  // Montañas, colinas, pirámides y arbustos van anclados al suelo de diseño
  ctx.save();
  ctx.translate(0, OY);
  if (tema === "desierto") escenaDesierto(cam, pal);
  else escenaColinas(cam, pal);
  ctx.restore();
  if (H > OY + H_MIN) pintarExtension(pal, tema);
}

/* =====================================================================
   13b. TILES CON BISELADO (cacheados por tema y por "tiene hierba")
   ===================================================================== */
const tileCache = new Map();
function tileSprite(tipo, p, key) {
  if (!tileCache.has(key)) tileCache.set(key, crearTile(tipo, p, key.slice(-2)));
  return tileCache.get(key);
}

// Castillo del mapa: dos hileras de almenas, cuerpo liso y puerta oscura
function castilloRows() {
  const rows = [];
  for (let y = 0; y < 16; y++) {
    let f = "";
    for (let x = 0; x < 16; x++) {
      const dentro = x > 0 && x < 15;
      if (y < 3 && (!dentro || x % 4 >= 2)) f += ".";           // huecos entre almenas
      else if (!dentro) f += ".";
      else if (y >= 10 && x >= 6 && x <= 9) f += "d";            // puerta
      else f += "c";
    }
    rows.push(f);
  }
  return rows;
}

/* =====================================================================
   11. SONIDO SENCILLO (ondas cuadradas con Web Audio, sin archivos)
   ===================================================================== */
const SFX = {
  salto: [440, 660, 0.08], giro: [520, 300, 0.12], pisar: [320, 640, 0.07],
  patear: [200, 120, 0.1], moneda: [880, 1320, 0.06], hongo: [400, 800, 0.2],
  rompe: [150, 60, 0.12], golpe: [200, 80, 0.25], vida: [500, 1000, 0.3],
  meta: [600, 900, 0.5], muerte: [400, 60, 0.7], estrella: [700, 1400, 0.4],
};
let audioCtx = null;
function tocar(nombre) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const [f0, f1, dur] = SFX[nombre] || SFX.salto;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(f0, audioCtx.currentTime);
    o.frequency.linearRampToValueAtTime(f1, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(0.04, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* sin audio: el juego sigue */ }
}
// Desbloquea el audio con la primera tecla (requisito de los navegadores)
addEventListener("keydown", () => { if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); }, { once: false });

/* =====================================================================
   12. CÁMARA CON SUAVIZADO Y LÍMITES
   ===================================================================== */
class Camera {
  constructor() { this.x = 0; this.y = 0; }
  seguir(objetivo, lvl, dt) {
    const destino = objetivo.x + objetivo.w / 2 - W / 2;
    // Suavizado exponencial: se acerca rápido pero sin tirones
    this.x += (destino - this.x) * Math.min(1, dt * 7);
    this.x = clamp(this.x, 0, lvl.cols * TILE - W);
    this.y = clamp(this.y, 0, Math.max(0, lvl.rows * TILE - H));
  }
  // Fijar cámara de golpe (al empezar el nivel)
  centrar(objetivo, lvl) {
    this.x = clamp(objetivo.x + objetivo.w / 2 - W / 2, 0, lvl.cols * TILE - W);
    this.y = 0;
  }
}

/* =====================================================================
   14. NIVEL EN EJECUCIÓN
   Crea entidades a partir de los datos, actualiza y dibuja.
   ===================================================================== */
class Level {
  constructor(def, mundo) {
    const data = construirNivel(def, mundo.tema);
    this.def = def;
    this.nombre = data.nombre;
    this.cols = data.cols;
    this.rows = data.rows;
    this.tiles = data.tiles;
    this.goalX = data.goalX;
    this.boss = data.boss;
    this.tiempo = data.tiempo;
    this.pal = mundo.paleta;
    this.temaKey = mundo.tema;   // separa la caché de sprites por tema
    this.player = new Player(data.start.x, data.start.y);
    this.enemies = [];
    this.coins = [];
    this.items = [];
    this.qItems = new Map();   // "col,fila" -> objeto del bloque ?
    this.bossRef = null;
    for (const e of data.ents) this.spawn(e);
    this.cam = new Camera();
    this.cam.centrar(this.player, this);
    this.meta = false;         // true cuando el jugador toca el poste
    this.metaT = 0;
    this.tiempoRest = this.tiempo;
  }

  spawn(e) {
    if (e.t === "coin") this.coins.push(new Coin(e.x, e.y));
    else if (e.t === "qitem") this.qItems.set(Math.floor(e.x / TILE) + "," + Math.floor(e.y / TILE), e.item);
    else if (e.t === "boss") { this.bossRef = new Boss(e.x, e.y); this.enemies.push(this.bossRef); }
    else this.enemies.push(new Enemy(e.t, e.x, e.y));
  }

  // Golpe desde abajo a un tile (el jugador salta contra él)
  golpearBloque(c, r, player, game) {
    const t = tileAt(this, c, r);
    if (t === "Q") {
      this.tiles[r][c] = "U";
      const item = this.qItems.get(c + "," + r) || "moneda";
      this.qItems.delete(c + "," + r);
      if (item === "moneda") {
        this.coins.push(new Coin(c * TILE + 4, r * TILE - 8, true));
        game.puntos(200); game.monedas++;
        game.sfx("moneda");
      } else {
        this.items.push(new PowerUp(item, c * TILE + 2, r * TILE));
        game.sfx("hongo");
      }
      emitir(c * TILE + 8, r * TILE, 4, [PAL.y], { up: 60, life: 0.4 });
    } else if (t === "B") {
      if (player.big) {
        this.tiles[r][c] = ".";
        emitir(c * TILE + 8, r * TILE + 8, 10, [this.pal.O, PAL.w], { up: 120, spread: 110, life: 0.6, size: 2 });
        game.sfx("rompe");
      } else {
        emitir(c * TILE + 8, r * TILE, 3, [this.pal.O], { up: 40, life: 0.3 });
        game.sfx("golpe");
      }
    }
  }

  // Rompe ladrillos al pasar por encima con salto giratorio
  romperConGiro(player, game) {
    const c0 = Math.floor(player.x / TILE), c1 = Math.floor((player.x + player.w) / TILE);
    const r0 = Math.floor(player.y / TILE), r1 = Math.floor((player.y + player.h) / TILE);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      if (tileAt(this, c, r) === "B") {
        this.tiles[r][c] = ".";
        emitir(c * TILE + 8, r * TILE + 8, 10, [this.pal.O, PAL.w], { up: 120, spread: 110, life: 0.6 });
        game.sfx("rompe");
      }
    }
  }

  actualizar(dt, game) {
    const p = this.player;
    // Temporizador del nivel
    if (!this.meta) {
      this.tiempoRest -= dt;
      if (this.tiempoRest <= 0) { this.tiempoRest = 0; p.dead = true; }
    }
    p.update(dt, this, game);
    if (p.spinT > 0) this.romperConGiro(p, game);

    // Enemigos y jefe
    for (const e of this.enemies) {
      if (e.carried) continue; // el caparazón llevado lo mueve el jugador
      if (e.t === "boss") e.update(dt, this, game, p);
      else e.update(dt, this, game);
    }
    this.enemies = this.enemies.filter((e) => e.alive || e.muerteT > 0);
    for (const c of this.coins) c.update(dt);
    this.coins = this.coins.filter((c) => c.alive);
    for (const it of this.items) it.update(dt, this);
    this.items = this.items.filter((it) => it.alive);

    game.colisionesJugador(this);
    this.cam.seguir(p, this, dt);

    // Poste de meta: al llegar, termina el nivel
    if (!this.meta && p.x + p.w >= this.goalX) {
      this.meta = true;
      game.sfx("meta");
    }
  }

  // Dibuja el nivel completo con la cámara actual
  dibujar(game) {
    const cam = this.cam;
    dibujarFondo(cam, this.pal, this.temaKey);
    // El área de diseño se desplaza según la pantalla (OY); el HUD se dibuja aparte, arriba
    ctx.save();
    ctx.translate(0, OY);
    // Tiles visibles
    const c0 = Math.max(0, Math.floor(cam.x / TILE));
    const c1 = Math.min(this.cols - 1, Math.floor((cam.x + W) / TILE) + 1);
    for (let r = 0; r < this.rows; r++) {
      for (let c = c0; c <= c1; c++) {
        const t = this.tiles[r][c];
        if (t === ".") continue;
        const x = c * TILE - cam.x, y = r * TILE - cam.y;
        this.dibujarTile(t, x, y, c, r);
      }
    }
    // Monedas (3 anchos para el giro), objetos y enemigos, centrados en su hitbox
    const FRAMES_MONEDA = [0, 1, 2, 1];
    for (const c of this.coins) {
      const sp = monedaSprite(FRAMES_MONEDA[Math.floor(c.anim) % 4]);
      drawSprite(sp, c.x + (c.w - sp.lw) / 2 - cam.x, c.y + (c.h - sp.lh) / 2 - cam.y);
    }
    for (const it of this.items) {
      const sp = objetoSprite(it.tipo);
      drawSprite(sp, it.x + it.w / 2 - sp.lw / 2 - cam.x, it.y + it.h - sp.lh - cam.y);
    }
    for (const e of this.enemies) this.dibujarEnemigo(e, cam);
    this.dibujarJugador(game, cam);
    dibujarParticulas(cam);
    ctx.restore();
  }

  // Tiles: cada tipo tiene su propio sprite con los colores del tema
  dibujarTile(t, x, y, c, r) {
    if (t === "T") return this.dibujarTuberia(x, y, c, r);
    if (t === "F") return this.dibujarPoste(x, y);
    // Tiles biselados generados por código, con los colores del tema
    // Hierba arriba y borde oscuro abajo solo en la superficie real (flags en la clave de caché)
    const arriba = !SOLIDOS[tileAt(this, c, r - 1)] ? "1" : "0";
    // Borde oscuro inferior solo si hay vacío debajo (no en la unión con el suelo extendido)
    const abajo = r + 1 < this.rows && !SOLIDOS[tileAt(this, c, r + 1)] ? "1" : "0";
    drawSprite(tileSprite(t, this.pal, this.temaKey + t + "-" + arriba + abajo), x, y);
  }

  // Tubería con volumen: borde superior (boca) y cuerpo con luz a la izquierda y sombra a la derecha
  dibujarTuberia(x, y, c, r) {
    const tubo = this.pal.tubo;
    const luz = mezclar(tubo, 0.45, "#ffffff"), sombra = mezclar(tubo, 0.4);
    const up = tileAt(this, c, r - 1) !== "T";
    if (up) {
      rect(x, y, 16, 4, PAL.k);
      rect(x + 1, y + 1, 14, 3, tubo);
      rect(x + 1, y + 1, 14, 1, luz);
      rect(x + 1, y + 3, 14, 1, sombra);
    } else {
      rect(x + 1, y, 1, 16, PAL.k);
      rect(x + 2, y, 13, 16, tubo);
      rect(x + 3, y, 3, 16, luz);
      rect(x + 12, y, 3, 16, sombra);
      rect(x + 15, y, 1, 16, PAL.k);
    }
  }

  dibujarPoste(x, y) {
    rect(x + 6, y, 2, 16, PAL.w);
    rect(x + 7, y, 1, 16, PAL.gr);
  }

  dibujarEnemigo(e, cam) {
    if (e.t === "boss") return this.dibujarJefe(e, cam);
    const muerto = !e.alive && (e.t === "walker" || e.t === "shell");
    const sp = enemigoSprite(e.t, Math.floor(e.anim * 6), muerto);
    // Centrado en X y apoyado en el borde inferior del hitbox
    const x = e.x + e.w / 2 - sp.lw / 2 - cam.x;
    const y = e.y + e.h - sp.lh - cam.y;
    if (x < -24 || x > W + 4) return;
    drawSprite(sp, x, y);
  }

  dibujarJefe(b, cam) {
    // El jefe parpadea mientras es invulnerable
    if (b.inmuneT > 0 && Math.floor(b.inmuneT * 12) % 2 === 0) return;
    const sp = jefeSprite();
    const x = b.x + b.w / 2 - sp.lw / 2 - cam.x;
    const y = b.y + b.h - sp.lh - cam.y;
    drawSprite(sp, x, y);
    // Barra de vida: tres cuadritos sobre la cabeza
    const bx = Math.round(x), by = Math.round(y) - 6;
    for (let i = 0; i < 3; i++) rect(bx + 8 + i * 6, by, 4, 3, i < b.hp ? PAL.r : PAL.dgr);
  }

  dibujarJugador(game, cam) {
    const p = this.player;
    if (p.hurtT > 0 && Math.floor(p.hurtT * 14) % 2 === 0) return; // parpadeo de daño
    const alto = p.big ? 30 : 22;
    const sp = heroeSprite(p.pose, p.frame, p.big, p.fire);
    // Pivote en los pies (centro del hitbox): ahí se aplican el giro y el aplastamiento
    const px = Math.round(p.x + p.w / 2 - cam.x), py = Math.round(p.y + p.h - cam.y);
    const aplasta = p.aterrizajeT > 0;
    ctx.save();
    ctx.translate(px, py);
    ctx.scale((p.facing < 0 ? -1 : 1) * (aplasta ? 1.15 : 1), aplasta ? 0.85 : 1);
    ctx.drawImage(sp, -sp.lw / 2 - sp.pad, -sp.lh - sp.pad, sp.width / U, sp.height / U);
    ctx.restore();
    // Estrella: destello de colores sobre la cabeza
    if (p.star > 0) {
      const c = [PAL.r, PAL.y, PAL.lb, PAL.g][Math.floor(p.animT * 16) % 4];
      rect(px - 1, py - alto - 4, 2, 2, c);
    }
  }
}

/* =====================================================================
   15. JUEGO: estados, colisiones y progreso
   Estados: "titulo" | "selMundo" | "overworld" | "nivel" | "pausa"
            | "muerte" | "nivelOK" | "mundoOK" | "gameover" | "final"
   ===================================================================== */
class Game {
  constructor() {
    this.estado = "titulo";
    this.mundoIdx = 0;        // índice en MUNDOS
    this.nivelIdx = 0;        // índice en MUNDOS[mundoIdx].niveles
    this.lvl = null;          // Level en ejecución
    this.vidas = 3;
    this.monedas = 0;
    this.score = 0;
    this.timerEstado = 0;     // para pantallas que pasan solas (muerte, nivelOK...)
    this.selMundo = 0;        // cursor en la pantalla de selección de mundo
    this.ov = null;           // Overworld activo
    this.completados = {};    // "mundo:ref" -> true
    this.cargarProgreso();
  }

  // ---------- Progreso (localStorage, envuelto en try/catch) ----------
  cargarProgreso() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      this.completados = d.completados || {};
      this.mundoIdx = clamp(d.mundoIdx || 0, 0, MUNDOS.length - 1);
      this.monedas = d.monedas || 0;
      this.score = d.score || 0;
    } catch (e) { /* save corrupto o bloqueado: empezamos de cero */ }
  }
  guardarProgreso() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        completados: this.completados, mundoIdx: this.mundoIdx,
        monedas: this.monedas, score: this.score,
      }));
    } catch (e) { /* sin almacenamiento: el juego sigue funcionando */ }
  }
  borrarProgreso() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* nada que borrar */ }
    this.completados = {}; this.mundoIdx = 0; this.monedas = 0; this.score = 0;
  }

  // Un nivel está desbloqueado si es el primero o el anterior está completado
  nivelDesbloqueado(mIdx, ref) {
    const m = MUNDOS[mIdx];
    const nodo = m.mapa.nodos.find((n) => n.ref === ref);
    if (!nodo) return false;
    if (ref === 0) return this.mundoDesbloqueado(mIdx);
    return this.completados[mIdx + ":" + (ref - 1)] === true;
  }
  mundoDesbloqueado(mIdx) {
    if (mIdx === 0) return true;
    // Cada mundo se desbloquea al completar el castillo del anterior
    const prev = MUNDOS[mIdx - 1];
    const castillo = prev.niveles.length - 1;
    return this.completados[(mIdx - 1) + ":" + castillo] === true;
  }

  // ---------- Utilidades llamadas por las entidades ----------
  puntos(n) { this.score += n; }
  sfx(n) { tocar(n); }
  efectoEnemigo(x, y) { emitir(x + 6, y + 6, 8, [PAL.w, PAL.y], { up: 90, spread: 90, life: 0.4 }); }

  // Golpe contra un bloque sobre la cabeza del jugador
  golpearDesdeAbajo(p) {
    const r = Math.floor((p.y - 1) / TILE);
    const c0 = Math.floor((p.x + 2) / TILE), c1 = Math.floor((p.x + p.w - 2) / TILE);
    for (const c of [c0, c1]) {
      const t = tileAt(this.lvl, c, r);
      if (t === "Q" || t === "B") { this.lvl.golpearBloque(c, r, p, this); return; }
    }
  }

  // Lanzamiento o recogida de caparazones con el botón X
  manejarCaparazon(lvl, p) {
    if (p.carrying) {
      const e = p.carrying;
      e.carried = false;
      e.vx = p.facing * PHYS.shellSpeed;
      e.slideT = 0;
      p.carrying = null;
      this.sfx("patear");
      return;
    }
    for (const e of lvl.enemies) {
      if (e.t !== "caparazon" || e.vx !== 0 || e.carried) continue;
      if (aabb({ x: p.x - 4, y: p.y, w: p.w + 8, h: p.h }, e)) {
        e.carried = true;
        p.carrying = e;
        this.sfx("moneda");
        return;
      }
    }
  }

  // Colisiones del jugador con objetos, monedas, enemigos, jefe y meta
  colisionesJugador(lvl) {
    const p = lvl.player;
    const hitbox = { x: p.x, y: p.y, w: p.w, h: p.h };

    // Caparazón llevado: se queda delante del jugador
    if (p.carrying) {
      p.carrying.x = p.facing > 0 ? p.x + p.w : p.x - p.carrying.w;
      p.carrying.y = p.y + p.h - p.carrying.h;
    }
    if (consume("run")) this.manejarCaparazon(lvl, p);

    // Objetos de bloque ?
    for (const it of lvl.items) {
      if (!aabb(hitbox, it)) continue;
      it.alive = false;
      if (it.tipo === "hongo") { p.setBig(true); this.puntos(1000); }
      else if (it.tipo === "flor") { p.setBig(true); p.fire = true; this.puntos(1000); }
      else if (it.tipo === "pluma") { p.cape = true; p.glideT = PHYS.glideTime; this.puntos(1000); }
      else if (it.tipo === "estrella") { p.star = 10; this.puntos(1000); }
      this.sfx(it.tipo === "estrella" ? "estrella" : "hongo");
    }

    // Monedas
    for (const c of lvl.coins) {
      if (!c.alive) continue;
      if (aabb(hitbox, c)) {
        c.alive = false;
        this.monedas++;
        this.puntos(100);
        if (this.monedas % 100 === 0) { this.vidas++; this.sfx("vida"); }
        else this.sfx("moneda");
      }
    }

    // Enemigos y jefe
    for (const e of lvl.enemies) {
      if (!e.alive || e.carried) continue;
      if (!aabb(hitbox, e)) continue;
      // Caparazón deslizándose: daña si el jugador no lo pisa
      const cayendoSobre = p.vy > 0 && (p.prevBottom <= e.y + 3 || p.y + p.h - e.y < 9);
      if (cayendoSobre && e.t !== "plant") {
        const res = e.pisado(p, this);
        if (res === "rebota") {
          // Se apoya justo sobre el enemigo: así el rebote no lo deja solapado (y no cuenta como daño)
          p.y = e.y - p.h;
          // El salto giratorio rebota más alto
          p.vy = p.spinT > 0 ? -PHYS.jumpV * 0.8 : -PHYS.jumpV * 0.55;
          p.spinT = 0;
          this.puntos(e.t === "boss" ? 0 : 100);
          continue;
        }
      }
      if (e.t === "caparazon" && e.vx === 0) continue;
      if (p.star > 0 && e.t !== "boss") {
        if (e.alive) { e.morir(this); }
        continue;
      }
      if (e.t === "boss" && !e.alive) continue;
      this.recibirDano(p);
    }

    // Bloquear la meta del castillo hasta derrotar al jefe
    if (lvl.boss && lvl.bossRef && lvl.bossRef.alive && p.x + p.w >= lvl.goalX) {
      p.x = lvl.goalX - p.w - 1;
      p.vx = 0;
    }
  }

  // Daño del jugador (usa el estado del jugador para decidir)
  recibirDano(p) {
    const res = p.golpear();
    if (res === "muere") this.iniciarMuerte();
    else if (res !== "ignorado") this.sfx("golpe");
  }

  // ---------- Flujo de nivel ----------
  empezarNivel(mIdx, nIdx) {
    this.mundoIdx = mIdx;
    this.nivelIdx = nIdx;
    const mundo = MUNDOS[mIdx];
    this.lvl = new Level(mundo.niveles[nIdx], mundo);
    this.estado = "nivel";
  }

  iniciarMuerte() {
    if (this.estado === "muerte") return; // evita descontar dos vidas en el mismo frame
    const p = this.lvl.player;
    p.dead = true;
    p.pose = "muerto";
    p.frame = 0;
    p.vx = 0;
    p.vy = -320;   // rebote de muerte (sin colisiones)
    this.estado = "muerte";
    this.timerEstado = 2.4;
    this.sfx("muerte");
    this.vidas--;
  }

  // Llamado por el bucle: termina nivel, muerte o pantallas
  actualizarEstado(dt) {
    if (this.estado === "nivel") {
      const lvl = this.lvl;
      lvl.actualizar(dt, this);
      // Muerte por caída, por tiempo agotado o por enemigo (ya gestionada en colisiones)
      if (lvl.player.dead) {
        this.iniciarMuerte();
        return;
      }
      if (lvl.meta) {
        this.timerEstado = 1.6;
        this.estado = "nivelOK";
        this.sfx("meta");
      }
      return;
    }
    this.timerEstado -= dt;
    if (this.estado === "muerte" && this.lvl) {
      const pl = this.lvl.player;
      pl.vy += GRAVITY * dt;
      pl.y += pl.vy * dt;
      pl.animT += dt;
    }
    if (this.estado === "muerte" && this.timerEstado <= 0) {
      if (this.vidas <= 0) {
        this.estado = "gameover";
        this.timerEstado = 4;
      } else {
        this.empezarNivel(this.mundoIdx, this.nivelIdx);
      }
    }
    if (this.estado === "nivelOK" && this.timerEstado <= 0) {
      this.completarNivel();
    }
    // Tras el castillo, el siguiente mundo queda abierto en la selección
    if (this.estado === "mundoOK" && this.timerEstado <= 0) {
      this.mundoIdx = Math.min(this.mundoIdx + 1, MUNDOS.length - 1);
      this.selMundo = this.mundoIdx;
      this.estado = "selMundo";
    }
    if (this.estado === "gameover" && this.timerEstado <= 0) {
      this.vidas = 3;
      this.volverAlMapa();
    }
  }

  // Marca el nivel como completado y decide el siguiente paso
  completarNivel() {
    const mundo = MUNDOS[this.mundoIdx];
    const nivel = mundo.niveles[this.nivelIdx];
    const castillo = this.nivelIdx === mundo.niveles.length - 1;
    this.completados[this.mundoIdx + ":" + this.nivelIdx] = true;
    this.guardarProgreso();
    if (castillo && this.mundoIdx === MUNDOS.length - 1) {
      this.estado = "final";
    } else if (castillo) {
      this.estado = "mundoOK";
      this.timerEstado = 3;
      this.sfx("meta");
    } else {
      this.volverAlMapa();
    }
  }

  // Vuelve al mapa del mundo actual (overworld)
  volverAlMapa() {
    this.lvl = null;
    this.ov = new Overworld(this, this.mundoIdx);
    this.estado = "overworld";
  }
}

/* =====================================================================
   16. MAPA DE MUNDO (overworld) Y SELECCIÓN DE MUNDO
   ===================================================================== */
/* Fuente bitmap 3x5 (cada fila es una cadena de 3 píxeles) */
const GLIFOS = {
  A: ["010", "101", "111", "101", "101"], B: ["110", "101", "110", "101", "110"],
  C: ["011", "100", "100", "100", "011"], D: ["110", "101", "101", "101", "110"],
  E: ["111", "100", "110", "100", "111"], F: ["111", "100", "110", "100", "100"],
  G: ["011", "100", "101", "101", "011"], H: ["101", "101", "111", "101", "101"],
  I: ["111", "010", "010", "010", "111"], J: ["001", "001", "001", "101", "010"],
  K: ["101", "101", "110", "101", "101"], L: ["100", "100", "100", "100", "111"],
  M: ["101", "111", "111", "101", "101"], N: ["101", "111", "111", "111", "101"],
  O: ["010", "101", "101", "101", "010"], P: ["110", "101", "110", "100", "100"],
  Q: ["010", "101", "101", "110", "011"], R: ["110", "101", "110", "101", "101"],
  S: ["011", "100", "010", "001", "110"], T: ["111", "010", "010", "010", "010"],
  U: ["101", "101", "101", "101", "111"], V: ["101", "101", "101", "101", "010"],
  W: ["101", "101", "111", "111", "101"], X: ["101", "101", "010", "101", "101"],
  Y: ["101", "101", "010", "010", "010"], Z: ["111", "001", "010", "100", "111"],
  0: ["111", "101", "101", "101", "111"], 1: ["010", "110", "010", "010", "111"],
  2: ["110", "001", "010", "100", "111"], 3: ["110", "001", "010", "001", "110"],
  4: ["101", "101", "111", "001", "001"], 5: ["111", "100", "110", "001", "110"],
  6: ["011", "100", "110", "101", "010"], 7: ["111", "001", "010", "010", "010"],
  8: ["010", "101", "010", "101", "010"], 9: ["010", "101", "011", "001", "110"],
  ":": ["000", "010", "000", "010", "000"], ".": ["000", "000", "000", "000", "010"],
  "-": ["000", "000", "111", "000", "000"], "!": ["010", "010", "010", "000", "010"],
  "?": ["110", "001", "010", "000", "010"], "/": ["001", "001", "010", "100", "100"],
  "(": ["010", "100", "100", "100", "010"], ")": ["010", "001", "001", "001", "010"],
  "'": ["010", "010", "000", "000", "000"], " ": ["000", "000", "000", "000", "000"],
};

// Dibuja un glifo en (x,y) sobre el contexto dado (por defecto, la pantalla)
function dibujarGlifo(ch, x, y, color, g = ctx, escala = 1) {
  const filas = GLIFOS[ch] || GLIFOS[" "];
  g.fillStyle = color;
  for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) {
    if (filas[r][c] === "1") g.fillRect(x + c * escala, y + r * escala, escala, escala);
  }
}

// Texto en pantalla con sombra. escala 2 = titulares
function txt(s, x, y, color = PAL.w, align = "left", escala = 1) {
  const texto = s.toUpperCase().replace(/¡/g, "!");
  const ancho = texto.length * 4 * escala - escala;
  let cx = Math.round(x);
  if (align === "center") cx -= Math.floor(ancho / 2);
  else if (align === "right") cx -= ancho;
  for (const ch of texto) {
    dibujarGlifo(ch, cx + escala, Math.round(y) + escala, PAL.k, ctx, escala);
    dibujarGlifo(ch, cx, Math.round(y), color, ctx, escala);
    cx += 4 * escala;
  }
}

// Dirección pulsada (consume flancos): devuelve {x,y} o null
function dirPulsada() {
  if (consume("left")) return { x: -1, y: 0 };
  if (consume("right")) return { x: 1, y: 0 };
  if (consume("up")) return { x: 0, y: -1 };
  if (consume("down")) return { x: 0, y: 1 };
  return null;
}

class Overworld {
  constructor(game, mIdx) {
    this.g = game;
    this.mIdx = mIdx;
    this.m = MUNDOS[mIdx];
    this.t = 0;
    // Empieza en el primer nivel no completado (o en el primero)
    const nodos = this.m.mapa.nodos;
    this.cur = nodos.findIndex((n) => !game.completados[mIdx + ":" + n.ref]);
    if (this.cur < 0) this.cur = 0;
  }

  // Elige el vecino en la dirección pulsada (el de mejor producto escalar)
  mover(d) {
    const nodos = this.m.mapa.nodos;
    const n = nodos[this.cur];
    let mejor = -1, mejorDot = 0;
    for (const v of n.vec) {
      const dx = nodos[v].x - n.x, dy = nodos[v].y - n.y;
      const len = Math.hypot(dx, dy) || 1;
      const dot = (dx * d.x + dy * d.y) / len;
      if (dot > mejorDot) { mejorDot = dot; mejor = v; }
    }
    if (mejor >= 0) this.cur = mejor;
  }

  update(dt) {
    this.t += dt;
    const d = dirPulsada();
    if (d) this.mover(d);
    if (consume("enter")) {
      const nodo = this.m.mapa.nodos[this.cur];
      if (this.g.nivelDesbloqueado(this.mIdx, nodo.ref)) {
        this.g.empezarNivel(this.mIdx, nodo.ref);
      }
    }
    if (consume("pause")) {
      this.g.selMundo = this.mIdx;
      this.g.estado = "selMundo";
    }
  }

  draw() {
    const p = this.m.paleta;
    // Mismo escenario que en los niveles, con la cámara fija
    dibujarFondo({ x: 0 }, p, this.m.tema);
    // El mapa está diseñado para 256 px: se centra si la pantalla es más ancha
    const ox = Math.max(0, Math.floor((W - W_MIN) / 2));
    ctx.save();
    ctx.translate(ox, OY);
    // Ruta punteada entre nodos (píxeles sueltos, look de mapa SNES)
    const nodos = this.m.mapa.nodos;
    for (let i = 0; i < nodos.length; i++) {
      for (const j of nodos[i].vec) {
        if (j < i) continue;
        const a = nodos[i], b = nodos[j];
        const steps = Math.max(Math.abs(b.x - a.x), Math.abs(b.y - a.y));
        for (let s = 0; s <= steps; s += 3) {
          const x = a.x + ((b.x - a.x) * s) / steps;
          const y = a.y + ((b.y - a.y) * s) / steps;
          rect(x, y, 2, 2, PAL.w);
        }
      }
    }
    // Nodos: completado (oro), desbloqueado (blanco), bloqueado (gris)
    nodos.forEach((n, i) => {
      const hecho = this.g.completados[this.mIdx + ":" + n.ref];
      const abierto = this.g.nivelDesbloqueado(this.mIdx, n.ref);
      const color = hecho ? PAL.y : abierto ? PAL.w : PAL.gr;
      if (n.castillo) {
        drawSprite(getSprite("castillo-" + color, castilloRows(), { c: color, d: PAL.dgr }), n.x - 8, n.y - 8);
      } else {
        drawSprite(getSprite("nodo-" + color, circuloRows(5, "c"), { c: color }), n.x - 5, n.y - 5);
      }
    });
    // Cursor: el jugador parpadea sobre el nodo actual
    const n = nodos[this.cur];
    if (Math.floor(this.t * 4) % 2 === 0) {
      drawSprite(heroeSprite("quieto", 0, false, false), n.x - 8, n.y - 28);
    }
    ctx.restore();
    // Cabecera con el nombre del mundo
    rect(0, 0, W, 14, "rgba(0,0,0,0.5)");
    txt("MUNDO " + this.m.id + " - " + this.m.nombre.toUpperCase(), W / 2, 3, PAL.w, "center");
    const nivel = this.m.niveles[n.ref];
    txt(nivel.nombre, W / 2, H - 12, PAL.w, "center");
    txt("ENTER: entrar  ESC: mundos", W / 2, H - 24, PAL.w, "center");
  }
}

/* Pantalla de selección de mundo: 8 tarjetas en 4x2 */
function dibujarSelMundo(game) {
  rect(0, 0, W, H, PAL.k);
  txt("SELECCION DE MUNDO", W / 2, 10, PAL.y, "center");
  MUNDOS.forEach((m, i) => {
    const col = i % 4, fila = Math.floor(i / 4);
    const x = Math.max(0, Math.floor((W - W_MIN) / 2)) + 10 + col * 61, y = 40 + fila * 80;
    const abierto = game.mundoDesbloqueado(i);
    rect(x, y, 54, 64, PAL.k);
    rect(x + 2, y + 2, 50, 60, abierto ? m.paleta.cielo : PAL.dgr);
    txt(String(m.id), x + 27, y + 8, PAL.w, "center");
    txt(abierto ? m.nombre : "???", x + 27, y + 42, PAL.w, "center");
    if (game.completados[i + ":" + (m.niveles.length - 1)]) txt("*", x + 27, y + 24, PAL.y, "center");
    if (i === game.selMundo) rect(x - 2, y - 2, 58, 68, PAL.y);
  });
  txt("ENTER: jugar   ESC: menu", W / 2, H - 14, PAL.w, "center");
}

/* =====================================================================
   17. HUD Y PANTALLAS
   ===================================================================== */
/* HUD sin barra: iconos y textos con sombra sobre el escenario (estilo NSMB) */
function dibujarHUD(game) {
  const lvl = game.lvl;
  const p = lvl.player;
  const poder = p.fire ? "FUEGO" : p.cape ? "CAPA" : p.big ? "GRANDE" : "PEQUENO";
  // Izquierda: jugador, vidas y monedas con icono
  txt("MARIO " + poder, 6, 6);
  txt("X" + String(game.vidas).padStart(2, "0"), 22, 17);
  drawSprite(monedaSprite(0), 6, 27);
  txt("X" + String(game.monedas).padStart(3, "0"), 22, 30, PAL.y);
  // Centro: mundo y nivel
  txt("MUNDO " + MUNDOS[game.mundoIdx].id + "-" + (game.nivelIdx + 1), W / 2, 6, PAL.w, "center");
  // Derecha: puntos y temporizador con icono de reloj
  txt(String(game.score).padStart(8, "0"), W - 6, 6, PAL.w, "right");
  drawSprite(getSprite("reloj", circuloRows(3, "c"), { c: PAL.w }), W - 42, 18);
  txt(String(Math.ceil(lvl.tiempoRest)).padStart(3, "0"), W - 6, 17, PAL.w, "right");
}

function dibujarNivelYHUD(game) {
  game.lvl.dibujar(game);
  dibujarHUD(game);
}

function velo(texto, sub) {
  rect(0, 0, W, H, "rgba(0,0,0,0.55)");
  txt(texto, W / 2, H / 2 - 16, PAL.w, "center");
  if (sub) txt(sub, W / 2, H / 2 + 4, PAL.y, "center");
}

// Dibuja la pantalla actual del juego
function dibujarJuego(game) {
  const e = game.estado;
  if (e === "titulo") {
    // Pradera de fondo, logo con sombra y el personaje apoyado en el suelo
    dibujarFondo({ x: performance.now() / 40 }, MUNDOS[0].paleta, MUNDOS[0].tema);
    rect(W / 2 - 96, 24, 192, 66, "rgba(0,0,0,0.4)");
    txt("SUPERBRO", W / 2 + 2, 42, PAL.k, "center", 3);
    txt("SUPERBRO", W / 2, 40, PAL.y, "center", 3);
    txt("PLATAFORMAS 2D", W / 2, 72, PAL.w, "center");
    // Personaje, mensajes y panel se anclan al suelo del escenario (OY)
    ctx.save();
    ctx.translate(0, OY);
    drawSprite(heroeSprite("quieto", 0, false, false), W / 2 - 8, 154);
    const parpadeo = Math.floor(performance.now() / 500) % 2 === 0;
    rect(0, 186, W, 38, "rgba(0,0,0,0.45)");
    if (parpadeo) txt("PULSA ENTER", W / 2, 192, PAL.w, "center");
    txt("BACKSPACE: BORRAR PROGRESO", W / 2, 206, PAL.w, "center");
    ctx.restore();
    return;
  }
  if (e === "selMundo") return dibujarSelMundo(game);
  if (e === "overworld") return game.ov.draw();
  if (e === "final") {
    rect(0, 0, W, H, PAL.k);
    txt("FIN DEL JUEGO", W / 2, 80, PAL.y, "center");
    txt("GRACIAS POR JUGAR", W / 2, 100, PAL.w, "center");
    txt("ENTER: volver al titulo", W / 2, 180, PAL.w, "center");
    return;
  }
  // Pantallas con nivel de fondo
  dibujarNivelYHUD(game);
  if (e === "pausa") velo("PAUSA", "P o ESC para seguir");
  else if (e === "muerte") velo("MARIO x" + game.vidas, "");
  else if (e === "nivelOK") velo("NIVEL COMPLETADO", "PUNTOS " + game.score);
  else if (e === "mundoOK") velo("MUNDO " + MUNDOS[game.mundoIdx].id + " COMPLETADO", "¡Nuevo mundo abierto!");
  else if (e === "gameover") velo("GAME OVER", "Se reinicia el mapa");
}

/* =====================================================================
   18. BUCLE PRINCIPAL (requestAnimationFrame + delta time)
   ===================================================================== */
const game = new Game();
KEYMAP.Backspace = "reset";  // para borrar el progreso desde el título

function actualizarJuego(dt) {
  const e = game.estado;
  actualizarParticulas(dt);

  if (e === "titulo") {
    if (consume("enter")) { game.selMundo = game.mundoIdx; game.estado = "selMundo"; }
    if (consume("reset")) game.borrarProgreso();
    return;
  }
  if (e === "selMundo") {
    const d = dirPulsada();
    if (d) {
      const nuevo = game.selMundo + d.x + d.y * 4;
      if (nuevo >= 0 && nuevo < MUNDOS.length) game.selMundo = nuevo;
    }
    if (consume("enter") && game.mundoDesbloqueado(game.selMundo)) {
      game.mundoIdx = game.selMundo;
      game.volverAlMapa();
    }
    if (consume("pause")) game.estado = "titulo";
    return;
  }
  if (e === "overworld") return game.ov.update(dt);
  if (e === "final") {
    if (consume("enter")) game.estado = "titulo";
    return;
  }
  if (e === "nivel") {
    if (consume("pause")) { game.estado = "pausa"; return; }
    return game.actualizarEstado(dt);
  }
  if (e === "pausa") {
    if (consume("pause")) game.estado = "nivel";
    return;
  }
  game.actualizarEstado(dt);
}

let ultimo = performance.now();
function bucle(t) {
  // Delta time limitado: evita saltos grandes si la pestaña se bloquea
  const dt = Math.min(1 / 30, (t - ultimo) / 1000);
  ultimo = t;
  try {
    actualizarJuego(dt);
    ctx.setTransform(U, 0, 0, U, 0, 0);   // dibujo en coordenadas lógicas
    dibujarJuego(game);
  } catch (err) {
    console.error(err);
  }
  // Limpia los estados de "pulsado" que no se consumieron este frame
  for (const k in pressed) pressed[k] = false;
  requestAnimationFrame(bucle);
}
requestAnimationFrame(bucle);
