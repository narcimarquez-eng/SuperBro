                 pD: { dx: -ph2 * 0.8, lift: Math.max(0, -ph2) * 0.8 } };
      case 'muerto':
        return { bI: 2.6, bD: -2.6, pI: { dx: -1.5, lift: 0 }, pD: { dx: 1.5, lift: 0 } };
      default:
        return { bI: 0.15, bD: -0.15, pI: { dx: 0, lift: 0 }, pD: { dx: 0, lift: 0 } };
    }
  }

  // Dibuja al protagonista. x, y: esquina de la caja de colisión (12 × 14)
  function dibujar(g, x, y, opt) {
    opt = opt || {};
    const dir = opt.dir < 0 ? -1 : 1;
    const estado = opt.estado || 'quieto';
    const camisa = opt.camisa === 'fuego' ? BLANCO : ROJO;
    const p = pose(estado, opt.tiempo || 0);

    g.save();
    g.translate(Math.round(x) - 2, Math.round(y) - 4);
    if (dir < 0) { g.translate(16, 0); g.scale(-1, 1); }

    // orden de dibujo: brazos y piernas detrás del cuerpo, cabeza al final
    brazo(g, 4.8, 10.8, p.bI, camisa);
    brazo(g, 11.2, 10.8, p.bD, camisa);
    pierna(g, 6.3, p.pI.dx, p.pI.lift);
    pierna(g, 9.7, p.pD.dx, p.pD.lift);
    torso(g, camisa);
    cabeza(g, estado);

    g.restore();
  }

  global.Protagonista = { dibujar: dibujar, ESTADOS: ['quieto', 'andar', 'salto', 'caer', 'escalera', 'muerto'] };
})(typeof window !== 'undefined' ? window : globalThis);

   La caja de colisión mide 12 × 16 (grande: 12 × 26). protagonista.js
   dibuja sobre una caja de 12 × 14 con los pies en su borde inferior,
   así que el dibujo se escala para que su caja coincida con el hitbox.
   ===================================================================== */
// Pose de protagonista.js para cada pose del jugador (ver calcularPose en Player)
const POSE_PROTA = {
  quieto: "quieto", andar: "andar", correr: "andar", giro: "salto", salto: "salto",

// Dibuja al protagonista con los pies en (px, py), centrado en px.
// alto: alto de su caja de colisión (16 pequeño, 26 grande).
// opt: estado, dir, tiempo (avance de las piernas), sx/sy (escala extra), inclina (radianes), camisa
function dibujarProtagonista(px, py, alto, opt) {
  const { sx = 1, sy = 1, inclina = 0 } = opt;
  const s = alto / 14;
  ctx.save();
  ctx.translate(Math.round(px), Math.round(py));
  ctx.rotate(inclina);
  ctx.scale(s * sx, s * sy);
  Protagonista.dibujar(ctx, -6, -14, { dir: opt.dir, estado: opt.estado, tiempo: opt.tiempo, camisa: opt.camisa });
  ctx.restore();
}

   Las dos primeras fases usan solo dos tipos de enemigo; la 8 es el castillo.
   opc.horas: momento del día de cada fase; opc.castillo: el castillo usa el escenario de piedra. */
function fases(w, nombres, enemigos, opc = {}) {
  return nombres.map((nombre, i) => {
    const k = i + 1, castillo = k === 8;
    const lv = {
      nombre: castillo ? w + "-C " + nombre : w + "-" + k + " " + nombre,
      tiempo: castillo ? 250 : 300,
      gen: {
        seed: w * 100 + k,
        dif: Math.min(8, w + Math.floor((k - 1) / 3) + (castillo ? 1 : 0)),
        enemigos: k <= 2 ? enemigos.slice(0, 2) : enemigos,
      },
      mecanicas: MECANICAS_POR_FASE[i],
    };
    if (opc.horas && opc.horas[i] !== undefined) lv.hora = opc.horas[i];
    if (castillo) { lv.jefe = true; if (opc.castillo) lv.castillo = true; }
    return lv;
  });
}

/* Nodos del mapa de un mundo: las fases y las casas de minijuegos en orden,
   repartidos a lo largo de la ruta según la distancia recorrida.
   Cada nodo lleva vec (vecinos anterior y siguiente) para moverse con las flechas. */
function construirMapa(m) {
  const seq = [];
  m.niveles.forEach((nv, i) => {
    seq.push({ ref: i, castillo: i === m.niveles.length - 1 });
    if (m.bonus.includes(i + 1)) seq.push({ bonus: i + 1 });   // casa de minijuegos tras la fase i+1
  });
  const r = m.ruta, largos = [];
  let total = 0;
  for (let i = 1; i < r.length; i++) {
    const d = Math.hypot(r[i][0] - r[i - 1][0], r[i][1] - r[i - 1][1]);
    largos.push(d);
    total += d;
  }
  seq.forEach((nodo, i) => {
    let s = (total * i) / (seq.length - 1), t = 0;
    while (t < largos.length - 1 && s > largos[t]) { s -= largos[t]; t++; }
    const f = largos[t] ? s / largos[t] : 0;
    nodo.x = Math.round(r[t][0] + (r[t + 1][0] - r[t][0]) * f);
    nodo.y = Math.round(r[t][1] + (r[t + 1][1] - r[t][1]) * f);
    nodo.vec = [i - 1, i + 1].filter((j) => j >= 0 && j < seq.length);
  });
  return seq;
}

/* =====================================================================
   7. GENERADOR DE NIVELES
   Convierte la especificación "gen" (o un "mapa" escrito a mano) en:
     { cols, rows, tiles[][], ents[], plats[], decor[], goalX, theme, boss }
   Tiles: "." vacío, "G" suelo, "B" ladrillo, "Q" bloque ?, "S" bloque
          sólido, "T" tubería, "F" poste de meta,
          "M" muelle (lanza al pisarlo), "H" pinchos, "V" lava,
          "L" escalera, "D" plataforma de una dirección.
   Entidades: "walker" "shell" "flyer" "plant" "coin" "boss".
   Plataformas (plats): "movil" (va y viene) y "caida" (se cae al pisarla).
   ===================================================================== */
const LEYENDA_MAPA = {
  ".": null, G: "G", B: "B", Q: "Q", S: "S", T: "T", F: "F",
  w: "walker", s: "shell", f: "flyer", p: "plant", c: "coin", J: "boss",
};
const ROWS = 14;           // 14 tiles * 16px = 224px de alto
const GY = 11;             // fila del suelo (la superior)
const FILA_PLAT = 8;       // fila de las plataformas sobre los huecos y de las escaleras
const ITEMS_Q = ["moneda", "moneda", "hongo", "hongo", "flor", "pluma", "estrella"];

// Generador pseudoaleatorio determinista (mulberry32): misma semilla = mismo nivel
function prng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Crea una rejilla vacía
function gridVacia(cols) {
  const t = [];
  for (let r = 0; r < ROWS; r++) t.push(new Array(cols).fill("."));
  return t;
}

/* Genera un nivel a partir de gen = { seed, dif, enemigos } y de sus mecánicas */
function generarNivel(gen, mecanicas = []) {
  const rnd01 = prng(gen.seed);
  const r = (a, b) => a + rnd01() * (b - a);
  const ri = (a, b) => Math.floor(r(a, b + 1));
  const dif = clamp(gen.dif || 1, 1, 8);
  const tipos = gen.enemigos && gen.enemigos.length ? gen.enemigos : ["walker"];
  const usa = (m) => mecanicas.includes(m);
  const cols = 188;                 // ~3000px de ancho
  const tiles = gridVacia(cols);
  const ents = [];
  const plats = [];

  // Límites de las 3 secciones: abierta, plataformas flotantes y meta
  const A1 = 90, B1 = 146, C1 = 180;
  // Huecos saltables caminando (2 tiles) en los primeros mundos; más anchos al subir la dificultad
  const gapMax = dif <= 3 ? 2 : dif <= 5 ? 3 : 4;

  // Suelo base con huecos controlados (nunca dos huecos juntos)
  const suelo = new Array(cols).fill(true);
  let c = 6;
  while (c < C1) {
    const seccionB = c >= A1 && c < B1;
    if (seccionB && rnd01() < 0.25 + dif * 0.04) {
      const w = ri(2, gapMax);
      for (let k = 0; k < w && c + k < cols; k++) suelo[c + k] = false;
      c += w + ri(3, 5);            // al menos 3 tiles de suelo entre huecos
    } else {
      c += ri(4, 9);
    }
  }
  for (let x = 0; x < cols; x++) {
    if (!suelo[x]) continue;
    for (let y = GY; y < ROWS; y++) tiles[y][x] = "G";
  }

  // Escalones y bloques sólidos en la zona de meta
  for (let x = C1; x < cols - 4; x++) {
    const alto = clamp(Math.floor((x - C1) / 2) + 1, 1, 6);
    for (let k = 0; k < alto && GY - 1 - k >= 0; k++) {
      if (suelo[x]) tiles[GY - 1 - k][x] = "S";
    }
  }
  // Suelo final
  for (let x = C1; x < cols; x++) if (suelo[x]) for (let y = GY; y < ROWS; y++) tiles[y][x] = "G";
  const goalX = cols - 4;
  for (let y = 4; y < GY; y++) tiles[y][goalX] = "F";

  // Sección abierta: bloques ? y ladrillos
  for (let x = 12; x < A1; x++) {
    if (rnd01() < 0.06 + dif * 0.005) {
      const row = 7;
      if (rnd01() < 0.5) {
        tiles[row][x] = "Q";
      } else {
        for (let k = 0; k < ri(1, 3) && x + k < A1; k++) tiles[row][x + k] = "B";
      }
      x += 4;
    }
  }
  // Sección de plataformas flotantes: ladrillos y ? en el aire
  for (let x = A1; x < B1; x++) {
    if (rnd01() < 0.1) {
      const row = ri(6, 8);
      const n = ri(2, 4);
      for (let k = 0; k < n && x + k < B1; k++) {
        if (!tiles[row][x + k] || tiles[row][x + k] === ".") {
          tiles[row][x + k] = k === 1 && rnd01() < 0.4 ? "Q" : "B";
        }
      }
      x += n + 2;
    }
  }

  // Aire libre sobre cada hueco: un bloque encima frena el salto (la cabeza choca) y el jugador cae
  for (let x = 0; x < cols; x++) {
    if (suelo[x]) continue;
    for (let r = 4; r <= GY - 3; r++) for (let c = x - 1; c <= x + 1; c++) if (c >= 0 && c < cols) tiles[r][c] = ".";
  }

  // Tuberías con plantas (si el enemigo "plant" está permitido)
  if (tipos.includes("plant")) {
    for (let x = 30; x < B1; x += ri(22, 30)) {
      if (!suelo[x] || !suelo[x + 1]) continue;
      tiles[GY - 1][x] = "T"; tiles[GY - 2][x] = "T";
      tiles[GY - 1][x + 1] = "T"; tiles[GY - 2][x + 1] = "T";
      ents.push({ t: "plant", x: x * TILE + 1, y: (GY - 2) * TILE - 8 });
      // Despeja el aire sobre la tubería: un bloque a esa altura deja un hueco de 16 px
      // que el jugador (también de 16 px) no puede cruzar sin un salto perfecto
      for (let c = x - 2; c <= x + 3; c++) for (let r = 4; r <= GY - 3; r++) if (c >= 0 && c < cols) tiles[r][c] = ".";
    }
  }

  // Huecos de la zona B: [primera columna, última columna]
  const huecos = [];
  for (let x = A1; x < B1;) {
    if (suelo[x]) { x++; continue; }
    let fin = x;
    while (fin + 1 < B1 && !suelo[fin + 1]) fin++;
    huecos.push([x, fin]);
    x = fin + 1;
  }

  /* ----- Mecánicas de la fase ----- */
  // Plataformas de una dirección: se pisan desde arriba y se atraviesan saltando desde abajo
  if (usa("una_direccion")) {
    for (let x = A1 + 4; x < B1 - 4; x += ri(9, 14)) {
      if (![x, x + 1, x + 2].every((cc) => tiles[FILA_PLAT][cc] === ".")) continue;
      for (let k = 0; k < 3; k++) tiles[FILA_PLAT][x + k] = "D";
    }
  }
  // Muelles: un bloque bajo que lanza muy alto al pisarlo
  if (usa("muelle")) {
    for (let k = 0, n = 0; k < 12 && n < 2; k++) {
      const x = ri(14, A1 - 6);
      if (!suelo[x - 1] || !suelo[x] || !suelo[x + 1]) continue;
      if (tiles[GY - 1][x - 1] !== "." || tiles[GY - 1][x] !== "." || tiles[GY - 1][x + 1] !== ".") continue;
      tiles[GY - 1][x] = "M";
      n++;
    }
  }
  // Pinchos: un bloque sobre el suelo. Bloquean de lado y hacen daño al caer sobre ellos.
  // Separados al menos tres bloques, para que siempre quepa un salto entre dos
  if (usa("pinchos")) {
    for (let k = 0, n = 0; k < 24 && n < 4; k++) {
      const x = ri(14, A1 - 6);
      if (!suelo[x - 1] || !suelo[x] || !suelo[x + 1]) continue;
      if (tiles[GY - 1][x - 1] !== "." || tiles[GY - 1][x] !== "." || tiles[GY - 1][x + 1] !== ".") continue;
      if ([x - 3, x - 2, x - 1, x, x + 1, x + 2, x + 3].some((cc) => tiles[GY - 1][cc] === "H")) continue;
      tiles[GY - 1][x] = "H";
      n++;
    }
  }
  // Escalera: una columna que sube a una plataforma de piedra en el aire
  if (usa("escalera")) {
    for (let x = A1 + 2; x < B1 - 6; x++) {
      if (!suelo[x] || tiles[GY - 1][x] !== ".") continue;
      if (![7, 8, 9, 10].every((rr) => tiles[rr][x] === ".")) continue;
      if (![x + 1, x + 2, x + 3].every((cc) => tiles[FILA_PLAT][cc] === "." && tiles[FILA_PLAT - 1][cc] === ".")) continue;
      for (let rr = 7; rr <= GY - 1; rr++) tiles[rr][x] = "L";
      for (let cc = x + 1; cc <= x + 3; cc++) tiles[FILA_PLAT][cc] = "S";
      break;
    }
  }
  // Lava: los huecos de la zona B se llenan de lava (caer en ella es mortal)
  if (usa("lava")) {
    for (const [a, b] of huecos) for (let cc = a; cc <= b; cc++) for (let rr = GY; rr < ROWS; rr++) tiles[rr][cc] = "V";
  }
  // Plataforma móvil: va y viene por encima de un hueco. Quita los ladrillos que estorban en su camino
  let usado = null;
  if (usa("plataforma_movil")) {
    // Vale cualquier hueco cuyo camino no choque con la escalera ni con su plataforma de piedra
    const libre = (a, b) => {
      for (let cc = a - 2; cc <= b + 3; cc++) {
        if (cc < 0 || cc >= cols) return false;
        if (["S", "L"].includes(tiles[FILA_PLAT][cc])) return false;
      }
      return true;
    };
    const h = huecos.find(([a, b]) => b - a >= 1 && libre(a, b));
    usado = h || null;
    if (h) {
      const [a, b] = h;
      for (let cc = a - 2; cc <= b + 3; cc++) tiles[FILA_PLAT][cc] = ".";
      plats.push({ t: "movil", x: (a - 2) * TILE, y: FILA_PLAT * TILE, w: 3 * TILE, h: TILE, x0: (a - 2) * TILE, x1: (b + 1) * TILE, vel: 36 });
    }
  }
  // Plataforma que cae: se hunde al pisarla durante un momento; sobre un hueco
  if (usa("plataforma_caida")) {
    // Las plataformas que caen van sobre los huecos que no usa la móvil
    for (const [a, b] of huecos.filter((h) => h !== usado).slice(-2)) {
      // Tres bloques centrados sobre el hueco, alineados con la rejilla
      const x = (Math.floor((a + b + 1) / 2) - 1) * TILE;
      plats.push({ t: "caida", x, y: FILA_PLAT * TILE, w: 3 * TILE, h: TILE });
    }
  }

  // Enemigos caminantes/caparazones/voladores sobre el suelo
  const nEnem = 4 + dif * 2;
  for (let i = 0; i < nEnem; i++) {
    const x = ri(10, C1 - 4);
    if (!suelo[x] || x < 12 || tiles[GY - 1][x] !== ".") continue;
    const t = tipos[ri(0, tipos.length - 1)];
    if (t === "plant") continue;
    if (t === "flyer") {
      ents.push({ t, x: x * TILE, y: ri(3, 7) * TILE });
    } else {
      ents.push({ t, x: x * TILE, y: (GY - 1) * TILE });
    }
  }

  // Monedas en arcos sobre el suelo (zona abierta y plataformas)
  for (let x = 16; x < B1; x += ri(10, 16)) {
    const n = ri(3, 5);
    for (let k = 0; k < n; k++) {
      const yArc = 8 - Math.round(Math.sin((k / (n - 1)) * Math.PI) * 2);
      ents.push({ t: "coin", x: (x + k) * TILE + 4, y: yArc * TILE + 4 });
    }
  }

  // Bloques ? con contenido elegido por la semilla
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < cols; x++) {
    if (tiles[y][x] === "Q") {
      ents.push({ t: "qitem", x: x * TILE, y: y * TILE, item: ITEMS_Q[ri(0, ITEMS_Q.length - 1)] });
    }
  }

  // Decoración del suelo abierto (arbustos, árboles, rocas...): no es sólida y se dibuja detrás de todo
  const decor = [];
  const piezas = DECOR_DE_TEMA[gen.theme] || [];
  for (let x = 12; x < A1 && piezas.length; x++) {
    if (!suelo[x] || rnd01() > 0.14) continue;
    const pieza = piezas[ri(0, piezas.length - 1)];
    if (pieza.some((_, k) => tiles[GY - 1 - k][x] !== ".")) continue;
    pieza.forEach((ch, k) => decor.push({ ch, c: x, r: GY - 1 - k }));
    x++;   // deja al menos un tile libre entre dos piezas
  }

  // Jefe al final de la zona de escalones, si el nivel es de castillo
  if (gen.jefe) {
    ents.push({ t: "boss", x: (C1 - 16) * TILE, y: (GY - 1) * TILE - 16 });
  }

  // El inicio siempre está libre de enemigos
  return {
    cols, rows: ROWS, tiles,
    ents: ents.filter((e) => e.x >= 10 * TILE),
    plats, decor,
    start: { x: 3 * TILE, y: (GY - 2) * TILE },
    goalX: goalX * TILE,
    theme: gen.theme || null,
    boss: !!gen.jefe,
    arenaX0: gen.jefe ? B1 * TILE : 0,   // la arena del jefe es el suelo llano desde B1
  };
}

/* Convierte un mapa escrito a mano (array de strings) en el mismo formato */
function parsearMapa(strs) {
  const cols = strs[0].length;
  const tiles = gridVacia(cols);
  const ents = [];
  let start = { x: 3 * TILE, y: (GY - 2) * TILE };
  let goalX = (cols - 4) * TILE;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < cols; x++) {
    const ch = strs[y] && strs[y][x] ? strs[y][x] : ".";
    const tipo = LEYENDA_MAPA[ch];
    if (ch === "@") { start = { x: x * TILE, y: y * TILE }; continue; }
    if (tipo === undefined) continue;
    if (tipo === null) continue;
    if (["G", "B", "Q", "S", "T", "F"].includes(tipo)) {
      tiles[y][x] = tipo;
      if (tipo === "F") goalX = x * TILE;
      if (tipo === "Q") ents.push({ t: "qitem", x: x * TILE, y: y * TILE, item: "moneda" });
    } else {
      ents.push({ t: tipo, x: x * TILE, y: y * TILE });
    }
  }
  return { cols, rows: ROWS, tiles, ents, plats: [], decor: [], start, goalX, theme: null, boss: false, arenaX0: 0 };
}

/* Punto de entrada: usa el mapa escrito a mano si existe, si no genera */
function construirNivel(def, tema) {
  // Los niveles de castillo no llevan decoración de su mundo (usan su propio escenario)
  const gen = Object.assign({ theme: def.castillo ? "castillo" : tema }, def.gen, { jefe: def.jefe });
  const lv = def.mapa ? parsearMapa(def.mapa) : generarNivel(gen, def.mecanicas || []);
  lv.nombre = def.nombre;
  lv.tiempo = def.tiempo || 300;
  return lv;
}

/* =====================================================================
   8. COLISIÓN CON TILES Y FÍSICA DEL JUGADOR
   Movimiento por ejes: primero X (y paredes), luego Y (suelo/techo).
   ===================================================================== */
const SOLIDOS = { G: 1, B: 1, Q: 1, S: 1, T: 1, U: 1, M: 1, H: 1 };   // H: pinchos (bloquean de lado)

// Devuelve el carácter del tile en (col,fila); fuera del nivel: lateral = pared, abajo = vacío
function tileAt(lvl, col, row) {
  if (col < 0 || col >= lvl.cols) return "S";
  if (row < 0) return ".";
  if (row >= lvl.rows) return ".";
  return lvl.tiles[row][col];
}

// Recorre los tiles que toca un rectángulo y devuelve true si alguno es sólido
function tocaSolido(lvl, x, y, w, h) {
  const c0 = Math.floor(x / TILE), c1 = Math.floor((x + w - 0.01) / TILE);
  const r0 = Math.floor(y / TILE), r1 = Math.floor((y + h - 0.01) / TILE);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (SOLIDOS[tileAt(lvl, c, r)]) return true;
  }
  return false;
}

/* Mueve una entidad {x,y,w,h,vx,vy} resolviendo colisiones por ejes.
   Devuelve { lado, techo, suelo } para saber qué tocó. */
function moverEntidad(lvl, e, dt) {
  const res = { pared: false, techo: false, suelo: false };
  // --- Eje X ---
  e.x += e.vx * dt;
  if (tocaSolido(lvl, e.x, e.y, e.w, e.h)) {
    res.pared = true;
    if (e.vx > 0) e.x = Math.floor((e.x + e.w) / TILE) * TILE - e.w;
    else e.x = Math.floor(e.x / TILE + 1) * TILE;
    e.vx = 0;
  }
  // --- Eje Y ---
  e.y += e.vy * dt;
  if (tocaSolido(lvl, e.x, e.y, e.w, e.h)) {
    if (e.vy > 0) {
      e.y = Math.floor((e.y + e.h) / TILE) * TILE - e.h;
      res.suelo = true;
    } else {
      e.y = Math.floor(e.y / TILE + 1) * TILE;
      res.techo = true;
    }
    e.vy = 0;
  }
  return res;
}

// Tile que hay bajo los pies (la base de la caja): true si es del tipo indicado
function bajoPies(lvl, p, tipo) {
  const R = Math.floor((p.y + p.h) / TILE);
  const c0 = Math.floor(p.x / TILE), c1 = Math.floor((p.x + p.w - 0.01) / TILE);
  for (let c = c0; c <= c1; c++) if (tileAt(lvl, c, R) === tipo) return true;
  return false;
}

// Escalera: la caja del jugador toca una columna de escalera en su centro
function enEscalera(lvl, p) {
  const c = Math.floor((p.x + p.w / 2) / TILE);
  const r0 = Math.floor(p.y / TILE), r1 = Math.floor((p.y + p.h - 0.01) / TILE);
  for (let r = r0; r <= r1; r++) if (tileAt(lvl, c, r) === "L") return true;
  return false;
}

/* Plataformas de una dirección ('D'): la base cruza su borde superior cayendo y la caja queda encima.
   Por debajo, la plataforma no se toca: se puede saltar a través de ella. */
function aterrizaEnDireccional(lvl, p, basePrev) {
  const base = p.y + p.h;
  const R = Math.floor(base / TILE);
  if (basePrev > R * TILE + 0.5) return false;
  const c0 = Math.floor(p.x / TILE), c1 = Math.floor((p.x + p.w - 0.01) / TILE);
  for (let c = c0; c <= c1; c++) {
    if (tileAt(lvl, c, R) === "D") { p.y = R * TILE - p.h; return true; }
  }
  return false;
}

/* =====================================================================
   9. JUGADOR
   Estados: pequeño/grande, fuego, capa (planeo) e invencible (estrella).
   ===================================================================== */
const PHYS = {
  walkAccel: 700, runAccel: 900, airAccel: 520,
  maxWalk: 95, maxRun: 165,
  friction: 620,
  jumpV: 300, jumpHoldG: 520,  // gravedad reducida mientras se mantiene salto
  spinV: 250, spinTime: 0.42,
  coyote: 0.1, buffer: 0.12,
  glideV: 70, glideTime: 1.6,  // planeo con capa
  shellSpeed: 230,
  climbV: 110,    // velocidad al trepar por una escalera
  springV: 430,   // impulso de un muelle (unos 6 bloques de altura)
};

class Player {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.w = 12; this.h = 16;   // hitbox pequeño (el sprite es de 16x22)
    this.pose = "quieto";       // pose visual actual (ver dibujarJugador)
    this.zancada = 0;           // distancia recorrida en el suelo: marca el ciclo de piernas
    this.frenadoT = 0;          // tiempo de derrape al cambiar de dirección a toda velocidad
    this.aterrizajeT = 0;       // tiempo de aplastamiento al aterrizar
    this.facing = 1;
    this.onGround = false;
    this.coyoteT = 0;        // tiempo desde que dejó el suelo
    this.bufferT = 0;        // tiempo desde que se pulsó saltar
    this.jumping = false;    // salto en curso (se puede soltar para cortarlo)
    this.spinT = 0;          // temporizador del salto giratorio
    this.glideT = 0;         // planeo restante
    this.big = false;
    this.fire = false;
    this.cape = false;
    this.star = 0;           // segundos de invencibilidad
    this.hurtT = 0;          // segundos de animación de daño / invulnerabilidad
    this.animT = 0;          // reloj de animación
    this.carrying = null;    // caparazón que lleva en la mano
    this.dead = false;
    this.duck = false;
    this.trepando = false;   // agarrado a una escalera
    this.plat = null;        // plataforma móvil sobre la que está de pie
  }

  // Aplica el estado de tamaño (pequeño = 10x14, grande = 10x20)
  setBig(b) {
    if (b === this.big) return;
    const bottom = this.y + this.h;
    this.big = b;
    this.h = b ? 26 : 16;
    this.y = bottom - this.h; // crece hacia arriba, nunca se mete en el suelo
  }

  get invencible() { return this.star > 0 || this.hurtT > 0; }

  // Hace daño: reduce el poder o muere si era pequeño
  golpear() {
    if (this.invencible) return "ignorado";
    if (this.fire || this.cape) { this.fire = false; this.cape = false; this.hurtT = 1.5; return "pierde-poder"; }
    if (this.big) { this.setBig(false); this.hurtT = 1.5; return "encoge"; }
    this.dead = true;
    return "muere";
  }

  // Lógica del jugador por frame (entrada + física + colisiones)
  update(dt, lvl, game) {
    this.prevBottom = this.y + this.h;   // base del jugador antes de moverse (para pisotones)
    this.animT += dt;
    if (this.star > 0) this.star -= dt;
    if (this.hurtT > 0) this.hurtT -= dt;

    const izq = held.left, der = held.right;
    const corre = held.run > 0;
    // Derrape: cambiar de dirección en el suelo a buena velocidad
    const dirH = (der ? 1 : 0) - (izq ? 1 : 0);
    if (this.onGround && dirH !== 0 && Math.sign(this.vx) === -dirH && Math.abs(this.vx) > 90 && this.frenadoT <= 0) {
      this.frenadoT = 0.22;
      emitir(this.x + this.w / 2, this.y + this.h, 4, ["#e8e8f0", "#c8c8d8"], { up: 30, spread: 60, life: 0.3, size: 2 });
    }
    if (this.frenadoT > 0) this.frenadoT -= dt;
    this.duck = held.down && this.onGround && this.big;

    // --- Movimiento horizontal ---
    const dir = (der ? 1 : 0) - (izq ? 1 : 0);
    const maxV = corre ? PHYS.maxRun : PHYS.maxWalk;
    const acc = this.onGround ? (corre ? PHYS.runAccel : PHYS.walkAccel) : PHYS.airAccel;
    if (dir !== 0 && !this.duck) {
      this.facing = dir;
      if (Math.abs(this.vx) < maxV || Math.sign(this.vx) !== dir) this.vx += dir * acc * dt;
      if (Math.abs(this.vx) > maxV) this.vx = Math.sign(this.vx) * Math.max(maxV, Math.abs(this.vx) - 400 * dt);
    } else {
      // Fricción: frena suavemente al soltar la dirección
      const f = PHYS.friction * dt;
      if (Math.abs(this.vx) <= f) this.vx = 0;
      else this.vx -= Math.sign(this.vx) * f;
    }
    // Durante el derrape se frena más fuerte
    if (this.frenadoT > 0 && this.onGround) this.vx -= Math.sign(this.vx) * PHYS.friction * 1.6 * dt;
    if (this.duck) this.vx = 0;

    // --- Escaleras: con arriba o abajo se trepa; saltar suelta la escalera ---
    if (!enEscalera(lvl, this)) this.trepando = false;
    else if (!this.trepando && (held.up || held.down)) this.trepando = true;
    if (this.trepando && pressed.jump) { this.trepando = false; this.coyoteT = PHYS.coyote; }
    if (this.trepando) {
      this.vy = held.up ? -PHYS.climbV : held.down ? PHYS.climbV : 0;
      this.jumping = false;
    }

    // --- Salto: buffer (recordar pulsación) y coyote time (saltar tras caer) ---
    if (consume("jump")) this.bufferT = PHYS.buffer;
    else this.bufferT -= dt;
    this.coyoteT = this.onGround ? PHYS.coyote : this.coyoteT - dt;

    if (this.bufferT > 0 && this.coyoteT > 0 && !this.duck) {
      this.vy = -PHYS.jumpV - Math.abs(this.vx) * 0.25;
      this.bufferT = 0; this.coyoteT = 0;
      this.jumping = true;
      this.onGround = false;
      game.sfx("salto");
    }

    // --- Salto giratorio (C / Shift): rebota y rompe bloques giratorios ---
    if (consume("spin") && !this.onGround && this.spinT <= 0) {
      this.spinT = PHYS.spinTime;
      this.vy = Math.min(this.vy, -PHYS.spinV * 0.5);
      game.sfx("giro");
    }
    if (this.spinT > 0) this.spinT -= dt;

    // --- Planeo con capa: mantener salto en el aire ---
    if (this.cape && !this.onGround && held.jump && this.vy > 0 && this.glideT > 0) {
      this.vy = Math.min(this.vy, PHYS.glideV);
      this.glideT -= dt;
    }
    if (this.onGround) this.glideT = PHYS.glideTime;

    // --- Gravedad: más suave si se mantiene salto subiendo (salto variable) ---
    const subiendoConSalto = this.vy < 0 && held.jump && this.jumping;
    const g = subiendoConSalto ? PHYS.jumpHoldG : GRAVITY;
    if (!this.trepando && !(this.cape && held.jump && this.glideT > 0 && this.vy >= 0 && this.vy <= PHYS.glideV)) {
      this.vy += g * dt;
    }
    if (this.vy > MAX_FALL) this.vy = MAX_FALL;
    if (this.vy >= 0) this.jumping = false;
    if (!held.jump && this.vy < -120) this.vy = -120; // corta el salto al soltar

    // --- Colisiones ---
    const vyAntes = this.vy, enAireAntes = !this.onGround;
    const r = moverEntidad(lvl, this, dt);
    if (r.pared) this.vx = 0;
    if (r.techo) {
      game.golpearDesdeAbajo(this);
    }
    // Plataformas de una dirección: solo paran al caer desde arriba
    if (!r.suelo && this.vy >= 0 && aterrizaEnDireccional(lvl, this, this.prevBottom)) { r.suelo = true; this.vy = 0; }
    this.onGround = r.suelo;
    // Muelle: al pisarlo, salta muy alto
    if (r.suelo && vyAntes >= 0 && bajoPies(lvl, this, "M")) {
      this.vy = -PHYS.springV;
      this.onGround = false;
      this.jumping = true;
      game.sfx("salto");
      emitir(this.x + this.w / 2, this.y + this.h, 6, [PAL.y, PAL.w], { up: 80, spread: 60, life: 0.3, size: 2 });
    }
    // Pinchos: solo hacen daño al caer sobre ellos (tocarlos de lado no); el jugador rebota
    if (r.suelo && vyAntes >= 0 && bajoPies(lvl, this, "H")) {
      game.recibirDano(this);
      if (!this.dead) { this.vy = -PHYS.jumpV * 0.6; this.onGround = false; this.jumping = false; }
    }
    // Aterrizaje fuerte: aplastamiento y polvo
    if (r.suelo && enAireAntes && vyAntes > 150) {
      this.aterrizajeT = 0.12;
      emitir(this.x + this.w / 2, this.y + this.h, 6, ["#e8e8f0", "#c8c8d8"], { up: 40, spread: 70, life: 0.35, size: 2 });
    }
    if (this.aterrizajeT > 0) this.aterrizajeT -= dt;
    if (r.suelo) this.jumping = false;

    // Caer fuera del nivel
    if (this.y > lvl.rows * TILE + 40) this.dead = true;

    this.calcularPose(dt);

    // Límite izquierdo del nivel
    if (this.x < 0) { this.x = 0; this.vx = 0; }
  }

  // Elige la pose visual según el estado (la dibuja dibujarJugador) y avanza las piernas al andar
  calcularPose(dt) {
    if (this.dead) this.pose = "muerto";
    else if (this.hurtT > 0) this.pose = "dano";
    else if (this.spinT > 0) this.pose = "giro";
    else if (this.duck) this.pose = "agachado";
    else if (!this.onGround) this.pose = this.vy < 0 ? "salto" : "caida";
    else if (this.frenadoT > 0) this.pose = "frenado";
    else if (Math.abs(this.vx) > 120 && held.run) this.pose = "correr";
    else if (Math.abs(this.vx) > 25) this.pose = "andar";
    else this.pose = "quieto";
    if (this.onGround && (this.pose === "andar" || this.pose === "correr")) this.zancada += Math.abs(this.vx) * dt;
  }
}

/* =====================================================================
   10. ENEMIGOS, JEFE, MONEDAS, OBJETOS Y PARTÍCULAS
   ===================================================================== */

/* Jefe del castillo: uno por mundo, con sus ataques (jefes.js). Esta clase lo une al nivel:
   lo mueve dentro de su arena, le quita una vida con cada pisotón y dice cuándo cae. */
class Boss {
  constructor(x, y, tipo) {
    // x: centro del jefe en la arena; los pies quedan sobre el suelo del nivel
    this.j = Jefes.create(tipo || "koopa", x + TILE, GY * TILE, { dir: -1 });
  }

  get alive() { return this.j.estado !== "muerto"; }
  get hp() { return this.j.hp; }
  // Nombre para el aviso de la pantalla, sin tildes (la fuente no las tiene)
  get nombre() { return Jefes.NOMBRES[this.j.tipo].normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase(); }
  caja() { return Jefes.caja(this.j); }

  // Pisotón: Jefes.golpear devuelve "herido", "muerto" o "ignorado" (si aún es invulnerable)
  pisado(player, game) {
    const r = Jefes.golpear(this.j);
    if (r === "herido") game.sfx("pisar");
    if (r === "muerto") {
      game.puntos(1000);
      game.efectoEnemigo(this.j.x, this.j.y - this.j.h / 2);
      game.sfx("meta");
    }
    return r;
  }

  update(dt, lvl, game, player) {
    // La arena es el suelo llano del castillo: el jefe no sale por la izquierda, donde hay huecos
    const mundo = {
      solid: (x, y) => x < lvl.arenaX0 || lvl.solidoEn(x, y),
      tile: TILE,
      ancho: lvl.cols * TILE,
      jugador: { x: player.x + player.w / 2, y: player.y + player.h / 2 },
    };
    Jefes.update(this.j, dt, mundo);
  }
}

/* Moneda: se recoge al tocarla. Gira con 3 fotogramas. */
class Coin {
  constructor(x, y, suelta = false) {
    this.x = x; this.y = y; this.w = 8; this.h = 10;
    this.alive = true;
    this.anim = Math.random() * 3;
    this.suelta = suelta;   // salió de un bloque (sube y desaparece)
    this.vy = suelta ? -150 : 0;
    this.vidaT = suelta ? 0.5 : Infinity;
  }
  update(dt) {
    this.anim += dt * 8;
    if (this.suelta) {
      this.y += this.vy * dt;
      this.vy += 600 * dt;
      this.vidaT -= dt;
      if (this.vidaT <= 0) this.alive = false;
    }
  }
}

/* Objeto de bloque ?: hongo, flor, pluma o estrella. Sale del bloque y avanza. */
class PowerUp {
  constructor(tipo, x, y) {
    this.tipo = tipo;
    this.x = x; this.y = y;
    this.w = 14; this.h = 14;
    this.vx = tipo === "flor" ? 0 : 50;
    this.vy = 0;
    this.alive = true;
    this.saliendoT = 0.4;  // sube un poco antes de empezar a moverse
    this.yDestino = y - 16;
  }
  update(dt, lvl) {
    if (this.saliendoT > 0) {
      this.saliendoT -= dt;
      this.y -= 40 * dt;
      return;
    }
    if (this.tipo === "flor") return;
    this.vy += GRAVITY * dt;
    if (this.vy > MAX_FALL) this.vy = MAX_FALL;
    const r = moverEntidad(lvl, this, dt);
    if (r.pared) this.vx = -this.vx;
    if (this.y > lvl.rows * TILE) this.alive = false;
  }
}

/* Partículas pixeladas: cuadrados que caen y se desvanecen */
const particulas = [];
function emitir(x, y, n, colores, opts = {}) {
  for (let i = 0; i < n; i++) {
    particulas.push({
      x, y,
      vx: rnd(-(opts.spread || 80), opts.spread || 80),
      vy: rnd(-(opts.up || 140), -(opts.up || 40)),
      g: opts.g === undefined ? 500 : opts.g,
      vida: rnd(0.3, opts.life || 0.6),
      max: opts.life || 0.6,
      color: colores[rndi(0, colores.length - 1)],
      size: opts.size || 2,
    });
  }
}
function actualizarParticulas(dt) {
  for (let i = particulas.length - 1; i >= 0; i--) {
    const p = particulas[i];
    p.vy += p.g * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vida -= dt;
    if (p.vida <= 0) particulas.splice(i, 1);
  }
}
function dibujarParticulas(cam) {
  for (const p of particulas) {
    rect(p.x - cam.x, p.y - cam.y, p.size, p.size, p.color);
  }
}

/* =====================================================================
   7d. PLATAFORMAS MÓVILES Y QUE CAEN
   Son de una dirección: se pisan desde arriba. Una móvil va y viene entre x0 y x1.
   Una que cae tiembla un momento al pisarla, se hunde y reaparece unos segundos después.
   ===================================================================== */
class Plataforma {
  constructor(d) {
    this.t = d.t;                   // "movil" | "caida"
    this.x = d.x; this.y = d.y;
    this.w = d.w; this.h = d.h;
    this.x0 = d.x0; this.x1 = d.x1;
    this.vel = d.vel || 36;
    this.dir = 1;
    this.homeX = d.x; this.homeY = d.y;
    this.dx = 0; this.dy = 0;       // desplazamiento de este frame (lo lleva consigo al jugador)
    this.vy = 0;
    this.pisada = false;            // la pisó el jugador en el frame anterior
    this.temblor = 0;               // tiempo que tiembla antes de caer
    this.caida = false;             // ya cae
    this.vivo = true;
    this.respawn = 0;
  }

  update(dt, lvl) {
    const x0 = this.x, y0 = this.y;
    if (this.t === "movil") {
      this.x += this.dir * this.vel * dt;
      if (this.x >= this.x1) { this.x = this.x1; this.dir = -1; }
      if (this.x <= this.x0) { this.x = this.x0; this.dir = 1; }
    } else if (this.vivo) {
      if (this.pisada && this.temblor <= 0 && !this.caida) this.temblor = 0.45;
      if (this.temblor > 0) {
        this.temblor -= dt;
        if (this.temblor <= 0) this.caida = true;
      } else if (this.caida) {
        this.vy += GRAVITY * dt;
        this.y += this.vy * dt;
        if (this.y > lvl.rows * TILE + 40) { this.vivo = false; this.respawn = 2.5; }
      }
    } else {
      this.respawn -= dt;
      if (this.respawn <= 0) {
        this.vivo = true; this.caida = false; this.temblor = 0; this.vy = 0;
        this.x = this.homeX; this.y = this.homeY;
      }
    }
    this.dx = this.x - x0;
    this.dy = this.y - y0;
    this.pisada = false;
  }

  // Si el jugador cae desde arriba sobre la franja superior, queda de pie sobre la plataforma
  pisa(p, basePrev) {
    if (!this.vivo || p.vy < 0) return false;
    if (p.x + p.w <= this.x + 2 || p.x >= this.x + this.w - 2) return false;
    const base = p.y + p.h;
    if (basePrev > this.y + 0.5 || base < this.y) return false;
    p.y = this.y - p.h;
    p.vy = 0;
    p.onGround = true;
    return true;
  }
}

// Muelle (tile "M"): base oscura, resorte de espiral y plato rojo arriba
let muelleCache = null;
function muelleSprite() {
  if (!muelleCache) {
    const filas = [
      "", "", "",
      "  rrrrrrrrrrrr  ",
      " rwwrrrrrrrrrrr ",
      " rwrrrrrrrrrrrr ",
      "  rrrrrrrrrrrr  ",
      "      gggg      ", "      ssss      ", "      gggg      ", "      ssss      ", "      gggg      ", "      ssss      ", "      gggg      ",
      "  dddddddddddd  ",
      " dddddddddddddd ",
    ];
    const rows = filas.map((f) => f.padEnd(16, " ").replace(/ /g, "."));
    muelleCache = spriteFromRows(expandir(rows), { r: "#e52521", w: "#ffb3a8", g: "#c8c8d8", s: "#8a8aa0", d: "#5a5a6e" });
  }
  return muelleCache;
}

/* Mezcla un color hex con negro o blanco en proporción t (sombreado) */
function mezclar(hex, t, hacia = "#000000") {
  const a = parseInt(hex.slice(1), 16), b = parseInt(hacia.slice(1), 16);
  const out = [16, 8, 0].map((s) => {
    const x = (a >> s) & 255, y = (b >> s) & 255;
    return Math.round(x + (y - x) * t);
  });
  return "#" + out.map((v) => v.toString(16).padStart(2, "0")).join("");
}

/* =====================================================================
   13. ESCENARIO CON VOLUMEN (estilo consola de 16 bits, colores vivos)
   Todo se genera como matrices y pasa por spriteFromRows: el contorno
   y el bisel salen solos. Las texturas se cachean y se repiten en X
   con desplazamiento de parallax.
   ===================================================================== */
const mod = (a, n) => ((a % n) + n) % n;
const texturas = new Map();
function textura(key, fabricar) {
  if (!texturas.has(key)) texturas.set(key, fabricar());
  return texturas.get(key);
}

// Matriz de un círculo relleno (para soles, arbustos, etc.)
function circuloRows(r, ch) {
  const rows = [];
  for (let y = -r; y <= r; y++) {
    let f = "";
    for (let x = -r; x <= r; x++) f += x * x + y * y <= r * r ? ch : ".";
    rows.push(f);
  }
  return rows;
}

// Colina periódica: fnAlt(x) da la altura de la cima en cada columna
function texColinas(key, ancho, color, fnAlt, contorno = false) {
  return textura(key, () => {
    const alto = H_MIN; // las capas son de diseño: no dependen del tamaño de pantalla
    const rows = [];
    for (let y = 0; y < alto; y++) rows.push("");
    for (let x = 0; x < ancho; x++) {
      const top = Math.round(fnAlt(x));
      for (let y = 0; y < alto; y++) rows[y] += y >= top ? "c" : ".";
    }
    const sp = spriteFromRows(expandir(rows), { c: color }, contorno, true);
    sp.tw = ancho;
    return sp;
  });
}

// Pinta una capa periódica con parallax (factor = fracción de la cámara)
function capaPeriodica(sp, camX, factor, y) {
  const off = mod(Math.floor(camX * factor), sp.tw);
  for (let x = -off; x < W; x += sp.tw) drawSprite(sp, x, y);
}

// Sol con borde de luz y contorno
function dibujarSol(pal, x, y) {
  const color = pal.sol || "#ffe36b";
  const sp = textura("sol-" + color, () => spriteFromRows(expandir(circuloRows(11, "c")), { c: color }));
  drawSprite(sp, x, y);
}

// Pirámide con bloques de piedra: cara iluminada a la izquierda, sombra a la derecha
function texPiramide(alto, base, pal) {
  return textura("piramide-" + alto + "-" + base, () => {
    const rows = [];
    const cx = base / 2;
    for (let y = 0; y < alto; y++) {
      const mitad = ((y + 1) / alto) * cx;
      let f = "";
      for (let x = 0; x < base; x++) {
        const dx = x + 0.5 - cx;
        if (Math.abs(dx) > mitad) { f += "."; continue; }
        const hilada = y % 7 === 6;
        f += hilada ? "m" : dx < 0 ? "l" : "d";
      }
      rows.push(f);
    }
    return spriteFromRows(expandir(rows), { l: pal.piedraClara, d: pal.piedraOscura, m: pal.piedraJunta }, true);
  });
}

// Escenario de desierto: pirámides, dunas y sol fuerte
function escenaDesierto(cam, pal) {
  const pir = texPiramide(74, 96, pal);
  const off = mod(cam.x * 0.3, 360);
  for (let k = -1; k < 4; k++) drawSprite(pir, k * 170 - off, 176 - 74);
  const dunas = texColinas("dunas-" + pal.cerca, 512, pal.cerca,
    (x) => 130 + Math.sin((x / 512) * Math.PI * 4) * 16 + Math.sin((x / 512) * Math.PI * 9) * 5, true);
  capaPeriodica(dunas, cam.x, 0.45, 0);
}

// Suelo de bloques.js bajo el área de diseño (solo si la pantalla es más alta)
function pintarExtension(pal, tema) {
  const ch = TERRENO_DE_TEMA[tema] || "#";
  for (let y = OY + H_MIN; y < H; y += TILE) {
    const sp = Bloques.sprite(ch + "|" + (y === OY + H_MIN ? "1000" : "0000"));
    for (let x = 0; x < W; x += TILE) drawSprite(sp, x, y);
  }
}

// Escala del fondo de bloques.js: su horizonte (144 unidades) cae sobre el suelo del nivel
const ESC_FONDO = (GY * TILE) / 144;

// Fondo del escenario. El cielo, el sol o la luna, las nubes y las montañas vienen de bloques.js
// y cambian con la hora (0 amanecer, 0.25 día, 0.5 atardecer, 0.75 noche); la cueva usa roca.
function dibujarFondo(cam, pal, tema, hora) {
  if (tema === "castillo") return escenaCastillo(cam, pal);
  // El cielo llega hasta arriba de la pantalla, también en las pantallas altas (OY > 0)
  ctx.save();
  ctx.translate(0, OY);
  ctx.scale(ESC_FONDO, ESC_FONDO);
  Bloques.fondo(ctx, cam.x, 0, W / ESC_FONDO, (H - OY) / ESC_FONDO, performance.now() / 1000,
    { hora: hora, ambiente: tema === "cueva" ? "cueva" : "cielo", colinas: tema !== "desierto", arriba: OY / ESC_FONDO });
  ctx.restore();
  // En el desierto, las dunas y las pirámides van encima del cielo
  if (tema === "desierto") {
    ctx.save();
    ctx.translate(0, OY);
    escenaDesierto(cam, pal);
    ctx.restore();
  }
  if (H > OY + H_MIN) pintarExtension(pal, tema);
}

/* =====================================================================
   13b. TILES CON BISELADO (cacheados por tema y por "tiene hierba")
   ===================================================================== */
// Castillo del mapa: dos hileras de almenas, cuerpo liso y puerta oscura
function castilloRows() {
  const rows = [];
  for (let y = 0; y < 16; y++) {
    let f = "";
    for (let x = 0; x < 16; x++) {
      const dentro = x > 0 && x < 15;
      if (y < 3 && (!dentro || x % 4 >= 2)) f += ".";           // huecos entre almenas
      else if (!dentro) f += ".";
      else if (y >= 10 && x >= 6 && x <= 9) f += "d";            // puerta
      else f += "c";
    }
    rows.push(f);
  }
  return rows;
}

/* =====================================================================
   13c. ESCENARIO DE CASTILLO: atardecer, torres lejanas, muro de piedra y antorchas
   ===================================================================== */
// Torres recortadas contra el cielo (periódicas, apoyadas en el suelo de diseño)
function texTorres() {
  return textura("torres", () => {
    const ancho = 512, base = 176;
    const torres = [[30, 46, 120], [150, 34, 96], [262, 52, 136], [390, 40, 104]]; // [x, ancho, alto]
    const rows = [];
    for (let y = 0; y < H_MIN; y++) {
      let f = "";
      for (let x = 0; x < ancho; x++) {
        let ch = ".";
        for (const [tx, tw, th] of torres) {
          if (x < tx || x >= tx + tw || y < base - th || y >= base) continue;
          const merlon = y < base - th + 8 && (x - tx) % 8 >= 5;   // almenas en lo alto
          if (merlon) continue;
          const ventana = x >= tx + tw / 2 - 2 && x <= tx + tw / 2 + 1 && y >= base - th + 16 && y <= base - th + 26;
          ch = ventana ? "w" : "c";
        }
        f += ch;
      }
      rows.push(f);
    }
    const sp = spriteFromRows(expandir(rows), { c: "#3a2b52", w: "#ffd23f" }, false, true, false);
    sp.tw = ancho;
    return sp;
  });
}

// Muro de piedra con hiladas de ladrillos desfasadas (periódico)
function texMuro() {
  return textura("muro", () => {
    const ancho = 512, alto = 80;   // solo el muro de la base: de y=96 al suelo
    const rows = [];
    for (let y = 0; y < alto; y++) {
      const hilada = Math.floor(y / 8), yy = y % 8, desfase = (hilada % 2) * 8;
      let f = "";
      for (let x = 0; x < ancho; x++) {
        const bx = (x + desfase) % 16;
        f += yy === 0 || bx === 0 ? "d" : yy === 1 || bx === 1 ? "l" : "m";   // juntas, bisel de luz, piedra
      }
      rows.push(f);
    }
    const sp = spriteFromRows(expandir(rows), { m: "#4b4a5c", l: "#62617a", d: "#2c2b3b" }, false, true, false);
    sp.tw = ancho;
    return sp;
  });
}

// Antorcha con llama de tres frames (parpadeo)
const FILAS_ANTORCHA = [
  ["..r..", ".oyo.", "oyyyo", "oyyyo", ".oyo.", "..o..", "..k..", ".kkk."],
  [".r...", ".ory.", ".oyo.", "oyyyo", ".yyy.", ".oyo.", "..k..", ".kkk."],
  ["...r.", "..ryo", ".oyo.", "oyyyo", "oyyy.", "..o..", "..k..", ".kkk."],
];
function antorchaSprite(f) {
  return textura("antorcha" + f, () => spriteFromRows(expandir(FILAS_ANTORCHA[f]), { k: "#2a2a30", o: "#ff8a1e", y: "#ffe066", r: "#e0392b" }, true, false, false));
}

function escenaCastillo(cam, pal) {
  // Atardecer: de púrpura arriba a naranja cerca del horizonte
  const horizonte = OY + 176;
  rect(0, 0, W, H, pal.cielo);
  const banda = Math.ceil(horizonte / 8);
  for (let i = 0; i < 8; i++) rect(0, i * banda, W, banda, mezclar(pal.cielo, i * 0.1, "#ff9a5a"));
  dibujarSol(pal, W - 70, 56 + OY * 0.2);
  ctx.save();
  ctx.translate(0, OY);
  capaPeriodica(texTorres(), cam.x, 0.2, 0);
  capaPeriodica(texMuro(), cam.x, 0.5, 96);
  // Antorchas sobre el muro, con parpadeo
  const fr = Math.floor(performance.now() / 110) % 3;
  const off = mod(cam.x * 0.5, 96);
  for (let k = -1; k < 6; k++) drawSprite(antorchaSprite(fr), k * 96 + 44 - off, 84);
  ctx.restore();
  pintarExtension(pal, "castillo");
}

/* =====================================================================
   11. SONIDO SENCILLO (ondas cuadradas con Web Audio, sin archivos)
   ===================================================================== */
const SFX = {
  salto: [440, 660, 0.08], giro: [520, 300, 0.12], pisar: [320, 640, 0.07],
  patear: [200, 120, 0.1], moneda: [880, 1320, 0.06], hongo: [400, 800, 0.2],
  rompe: [150, 60, 0.12], golpe: [200, 80, 0.25], vida: [500, 1000, 0.3],
  meta: [600, 900, 0.5], muerte: [400, 60, 0.7], estrella: [700, 1400, 0.4],
};
let audioCtx = null;
function tocar(nombre) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const [f0, f1, dur] = SFX[nombre] || SFX.salto;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(f0, audioCtx.currentTime);
    o.frequency.linearRampToValueAtTime(f1, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(0.04, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* sin audio: el juego sigue */ }
}
// Desbloquea el audio con la primera tecla (requisito de los navegadores)
addEventListener("keydown", () => { if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); }, { once: false });

/* =====================================================================
   12. CÁMARA CON SUAVIZADO Y LÍMITES
   ===================================================================== */
class Camera {
  constructor() { this.x = 0; this.y = 0; }
  seguir(objetivo, lvl, dt) {
    const destino = objetivo.x + objetivo.w / 2 - W / 2;
    // Suavizado exponencial: se acerca rápido pero sin tirones
    this.x += (destino - this.x) * Math.min(1, dt * 7);
    this.x = clamp(this.x, 0, lvl.cols * TILE - W);
    this.y = clamp(this.y, 0, Math.max(0, lvl.rows * TILE - H));
  }
  // Fijar cámara de golpe (al empezar el nivel)
  centrar(objetivo, lvl) {
    this.x = clamp(objetivo.x + objetivo.w / 2 - W / 2, 0, lvl.cols * TILE - W);
    this.y = 0;
  }
}

/* =====================================================================
   14. NIVEL EN EJECUCIÓN
   Crea entidades a partir de los datos, actualiza y dibuja.
   ===================================================================== */
// Tipos del juego -> tipos de enemigos.js (ver TIPOS allí)
const TIPO_ENEMIGO = {
  walker: "erizo", shell: "caracol", flyer: "abeja", plant: "planta",
  hormiga: "hormiga", esqueleto: "esqueleto",
  erizo_zombie: "erizo_zombie", caracol_zombie: "caracol_zombie", planta_zombie: "planta_zombie",
};

// Crea el enemigo de enemigos.js sobre la entidad (e.x, e.y = esquina superior izquierda)
function crearEnemigo(e) {
  const tipo = TIPO_ENEMIGO[e.t] || "erizo";
  // La planta sale de la tubería: su maceta queda dentro del tubo (centro de los dos bloques)
  if (tipo === "planta" || tipo === "planta_zombie") return Enemigos.create(tipo, e.x + TILE - 1, e.y + 8);
  return Enemigos.create(tipo, e.x + TILE / 2, e.y + TILE / 2);
}

// Bola de fuego de la flor de fuego: tamaño, velocidad, rebote en el suelo, duración y máximo en pantalla
const BOLA = { w: 6, h: 6, vx: 190, rebote: -150, vida: 2.2, max: 2 };

class Level {
  constructor(def, mundo) {
    const data = construirNivel(def, mundo.tema);
    this.def = def;
    this.nombre = data.nombre;
    this.cols = data.cols;
    this.rows = data.rows;
    this.tiles = data.tiles;
    this.decor = data.decor;
    this.goalX = data.goalX;
    this.boss = data.boss;
    this.tiempo = data.tiempo;
    // Los niveles marcados como castillo usan piedra y atardecer en vez del tema del mundo
    this.castillo = !!def.castillo;
    this.pal = this.castillo ? PALETA_CASTILLO : mundo.paleta;
    this.temaKey = this.castillo ? "castillo" : mundo.tema;   // separa la caché de sprites por tema
    this.hora = def.hora !== undefined ? def.hora : mundo.hora;   // momento del día del fondo
    this.avisoT = 0;   // tiempo que se muestra el aviso "derrota al jefe"
    this.player = new Player(data.start.x, data.start.y);
    this.enemigos = [];   // { e: objeto de enemigos.js, llevado: true si el jugador lo lleva }
    this.plats = (data.plats || []).map((d) => new Plataforma(d));   // plataformas móviles y que caen
    this.mundo = { tile: TILE, jugador: null, solid: (x, y) => this.solidoEn(x, y) };   // lo que usan los enemigos
    this.terreno = TERRENO_DE_TEMA[this.temaKey] || "#";   // carácter de bloques.js para el suelo
    this.coins = [];
    this.items = [];
    this.qItems = new Map();   // "col,fila" -> objeto del bloque ?
    this.bossRef = null;
    this.bolas = [];           // bolas de fuego del jugador (flor de fuego)
    this.jefeTipo = mundo.jefeTipo || "koopa";   // jefe de este mundo (jefes.js)
    this.arenaX0 = data.arenaX0 || 0;            // el jefe no sale por la izquierda de su arena
    this.introJefeT = data.boss ? 3 : 0;         // tiempo que se muestra el nombre del jefe
    for (const e of data.ents) this.spawn(e);
    this.cam = new Camera();
    this.cam.centrar(this.player, this);
    this.meta = false;         // true cuando el jugador toca el poste
    this.metaT = 0;
    this.tiempoRest = this.tiempo;
  }

  spawn(e) {
    if (e.t === "coin") this.coins.push(new Coin(e.x, e.y));
    else if (e.t === "qitem") this.qItems.set(Math.floor(e.x / TILE) + "," + Math.floor(e.y / TILE), e.item);
    else if (e.t === "boss") this.bossRef = new Boss(e.x, e.y, this.jefeTipo);
    else this.enemigos.push({ e: crearEnemigo(e), llevado: false });
  }

  // Suelo para los enemigos: a los lados hay pared; por debajo, vacío (y caen)
  solidoEn(x, y) {
    const c = Math.floor(x / TILE), r = Math.floor(y / TILE);
    if (c < 0 || c >= this.cols) return true;
    if (r < 0 || r >= this.rows) return false;
    return !!SOLIDOS[this.tiles[r][c]];
  }

  // Golpe desde abajo a un tile (el jugador salta contra él)
  golpearBloque(c, r, player, game) {
    const t = tileAt(this, c, r);
    if (t === "Q") {
      this.tiles[r][c] = "U";
      const item = this.qItems.get(c + "," + r) || "moneda";
      this.qItems.delete(c + "," + r);
      if (item === "moneda") {
        this.coins.push(new Coin(c * TILE + 4, r * TILE - 8, true));
        game.puntos(200); game.monedas++;
        game.sfx("moneda");
      } else {
        this.items.push(new PowerUp(item, c * TILE + 2, r * TILE));
        game.sfx("hongo");
      }
      emitir(c * TILE + 8, r * TILE, 4, [PAL.y], { up: 60, life: 0.4 });
    } else if (t === "B") {
      if (player.big) {
        this.tiles[r][c] = ".";
        emitir(c * TILE + 8, r * TILE + 8, 10, [this.pal.O, PAL.w], { up: 120, spread: 110, life: 0.6, size: 2 });
        game.sfx("rompe");
      } else {
        emitir(c * TILE + 8, r * TILE, 3, [this.pal.O], { up: 40, life: 0.3 });
        game.sfx("golpe");
      }
    }
  }

  // Rompe ladrillos al pasar por encima con salto giratorio
  romperConGiro(player, game) {
    const c0 = Math.floor(player.x / TILE), c1 = Math.floor((player.x + player.w) / TILE);
    const r0 = Math.floor(player.y / TILE), r1 = Math.floor((player.y + player.h) / TILE);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      if (tileAt(this, c, r) === "B") {
        this.tiles[r][c] = ".";
        emitir(c * TILE + 8, r * TILE + 8, 10, [this.pal.O, PAL.w], { up: 120, spread: 110, life: 0.6 });
        game.sfx("rompe");
      }
    }
  }

  actualizar(dt, game) {
    const p = this.player;
    // Temporizador del nivel
    if (!this.meta) {
      this.tiempoRest -= dt;
      if (this.tiempoRest <= 0) { this.tiempoRest = 0; p.dead = true; }
    }
    if (this.avisoT > 0) this.avisoT -= dt;
    if (this.introJefeT > 0) this.introJefeT -= dt;
    // Plataformas móviles y que caen: se mueven antes y llevan consigo al jugador que está de pie sobre ellas
    for (const pl of this.plats) pl.update(dt, this);
    if (p.plat) { p.x += p.plat.dx; p.y += p.plat.dy; }
    p.update(dt, this, game);
    let sobre = null;
    for (const pl of this.plats) if (pl.pisa(p, p.prevBottom)) { sobre = pl; break; }
    if (sobre) sobre.pisada = true;
    p.plat = sobre;
    if (p.spinT > 0) this.romperConGiro(p, game);

    // Enemigos (enemigos.js) y jefe
    this.mundo.jugador = { x: p.x + p.w / 2, y: p.y + p.h / 2 };
    for (const w of this.enemigos) {
      if (w.llevado) continue;                     // el caparazón que lleva el jugador se mueve con él
      Enemigos.update(w.e, dt, this.mundo);
      if (w.e.y > this.rows * TILE + 60) w.e.remove = true;   // se cayó del nivel
    }
    this.enemigos = this.enemigos.filter((w) => !w.e.remove);
    if (this.bossRef) this.bossRef.update(dt, this, game, p);
    this.actualizarBolas(dt, game);
    for (const c of this.coins) c.update(dt);
    this.coins = this.coins.filter((c) => c.alive);
    for (const it of this.items) it.update(dt, this);
    this.items = this.items.filter((it) => it.alive);

    game.colisionesJugador(this);
    this.cam.seguir(p, this, dt);

    // Poste de meta: al llegar, termina el nivel
    if (!this.meta && p.x + p.w >= this.goalX) {
      this.meta = true;
      game.sfx("meta");
    }
  }

  // Dibuja el nivel completo con la cámara actual
  dibujar(game) {
    const cam = this.cam;
    dibujarFondo(cam, this.pal, this.temaKey, this.hora);
    // El área de diseño se desplaza según la pantalla (OY); el HUD se dibuja aparte, arriba
    ctx.save();
    ctx.translate(0, OY);
    // Decoración de bloques.js (arbustos, flores, árboles, rocas): detrás de los bloques y de los personajes
    for (const d of this.decor) {
      const x = d.c * TILE - cam.x;
      if (x < -TILE || x > W) continue;
      drawSprite(Bloques.sprite(d.ch), x, d.r * TILE - cam.y);
    }
    // Tiles visibles
    const c0 = Math.max(0, Math.floor(cam.x / TILE));
    const c1 = Math.min(this.cols - 1, Math.floor((cam.x + W) / TILE) + 1);
    for (let r = 0; r < this.rows; r++) {
      for (let c = c0; c <= c1; c++) {
        const t = this.tiles[r][c];
        if (t === ".") continue;
        const x = c * TILE - cam.x, y = r * TILE - cam.y;
        this.dibujarTile(t, x, y, c, r);
      }
    }
    // Plataformas móviles (tablones) y que caen (piedra): tres bloques de ancho
    for (const pl of this.plats) {
      if (!pl.vivo) continue;
      for (let k = 0; k < pl.w / TILE; k++) {
        drawSprite(Bloques.sprite(pl.t === "movil" ? "W|1000" : "X"), pl.x + k * TILE - cam.x, pl.y - cam.y);
      }
    }
    // Monedas: arte de bloques.js (8 frames de giro), centradas en su hitbox
    for (const c of this.coins) {
      drawSprite(Bloques.sprite("o" + (Math.floor(c.anim) % 8)), c.x + c.w / 2 - 8 - cam.x, c.y + c.h / 2 - 8 - cam.y);
    }
    for (const it of this.items) {
      const sp = objetoSprite(it.tipo);
      drawSprite(sp, it.x + it.w / 2 - sp.lw / 2 - cam.x, it.y + it.h - sp.lh - cam.y);
    }
    // Enemigos dibujados por enemigos.js, en coordenadas del mundo
    ctx.save();
    ctx.translate(-cam.x, 0);
    for (const w of this.enemigos) Enemigos.draw(ctx, w.e);
    ctx.restore();
    if (this.bossRef) this.dibujarJefe(this.bossRef, cam);
    this.dibujarBolas(cam);
    this.dibujarJugador(game, cam);
    dibujarParticulas(cam);
    ctx.restore();
  }

  // Bloques con el arte de bloques.js. El borde de un terreno depende de los vecinos que dan al aire
  dibujarTile(t, x, y, c, r) {
    if (t === "T") {
      // Tubería: boca arriba (P/Q) y cuerpo debajo (p/q); la mitad derecha tiene tubo a la izquierda
      const cuerpo = tileAt(this, c, r - 1) === "T", derecha = tileAt(this, c - 1, r) === "T";
      drawSprite(Bloques.sprite(cuerpo ? (derecha ? "q" : "p") : (derecha ? "Q" : "P")), x, y);
    } else if (t === "F") {
      // Poste de meta: la bandera va en el bloque de arriba; el resto es poste
      if (tileAt(this, c, r - 1) === "F") this.dibujarPoste(x, y);
      else drawSprite(Bloques.sprite("E"), x, y);
    } else if (t === "G") {
      drawSprite(Bloques.sprite(this.terreno + "|" + this.aireDe(c, r)), x, y);
    } else if (t === "S") {
      drawSprite(Bloques.sprite("X"), x, y);        // piedra suelta
    } else if (t === "H") {
      drawSprite(Bloques.sprite("^"), x, y);        // pinchos
    } else if (t === "V") {
      drawSprite(Bloques.sprite("~"), x, y);        // lava
    } else if (t === "L") {
      drawSprite(Bloques.sprite("L"), x, y);        // escalera
    } else if (t === "D") {
      drawSprite(Bloques.sprite("-"), x, y);        // plataforma de una dirección
    } else if (t === "M") {
      drawSprite(muelleSprite(), x, y);             // muelle
    } else {
      drawSprite(Bloques.sprite({ B: "=", Q: "?", U: "x" }[t]), x, y);   // ladrillo, interrogación, usado
    }
  }

  // Lados que dan al aire (arriba, izquierda, derecha, abajo): "1" = aire, "0" = bloque
  aireDe(c, r) {
    const aire = (cc, rr) => (SOLIDOS[tileAt(this, cc, rr)] ? "0" : "1");
    return aire(c, r - 1) + aire(c - 1, r) + aire(c + 1, r) + aire(c, r + 1);
  }

  // Poste de la meta: en las columnas 2 a 4 del tile, igual que el poste de la bandera de bloques.js
  dibujarPoste(x, y) {
    rect(x + 2, y, 2, 16, PAL.w);
    rect(x + 3, y, 1, 16, PAL.gr);
  }

  // Bolas de fuego (flor de fuego): avanzan, rebotan en el suelo y se apagan al chocar con un muro,
  // al tocar un enemigo o un jefe, o al cabo de un rato
  actualizarBolas(dt, game) {
    for (const b of this.bolas) {
      b.t += dt;
      if (b.t > BOLA.vida) { b.dead = true; continue; }
      if (this.solidoEn(b.x + Math.sign(b.vx) * (b.w / 2 + 1), b.y)) { b.dead = true; continue; }
      b.x += b.vx * dt;
      // Vertical: al tocar el suelo rebota; tras varios rebotes se apaga
      b.vy += GRAVITY * dt;
      const pie = b.y + b.h / 2 + b.vy * dt;
      if (b.vy > 0 && this.solidoEn(b.x, pie)) {
        b.y = Math.floor(pie / TILE) * TILE - b.h / 2;
        b.vy = BOLA.rebote;
        if (++b.rebotes > 4) { b.dead = true; continue; }
      } else {
        b.y += b.vy * dt;
      }
      if (b.y > this.rows * TILE + 40) { b.dead = true; continue; }
      const caja = { x: b.x - b.w / 2, y: b.y - b.h / 2, w: b.w, h: b.h };
      // Enemigos: caen igual que con la estrella
      for (const w of this.enemigos) {
        const e = w.e;
        if (w.llevado || e.dead || e.remove) continue;
        const eb = Enemigos.box(e);
        if (eb && aabb(caja, eb)) {
          e.dead = true; e.deadT = 0; e.vx = 0; e.vy = 0;
          game.puntos(200);
          game.efectoEnemigo(eb.x + eb.w / 2, eb.y + eb.h / 2);
          b.dead = true;
          break;
        }
      }
      // Jefe: cada bola cuenta como un pisotón (con la misma protección entre golpes)
      if (!b.dead && this.bossRef && this.bossRef.alive && aabb(caja, this.bossRef.caja())) {
        this.bossRef.pisado(this.player, game);
        b.dead = true;
      }
    }
    this.bolas = this.bolas.filter((b) => !b.dead);
  }

  // Bola de fuego: disco naranja con centro amarillo que parpadea al girar
  dibujarBolas(cam) {
    for (const b of this.bolas) {
      const x = Math.round(b.x - cam.x - b.w / 2), y = Math.round(b.y - cam.y - b.h / 2);
      rect(x + 1, y, 4, 6, PAL.o);
      rect(x, y + 1, 6, 4, PAL.o);
      rect(x + 2, y + 2, 2, 2, Math.floor(b.t * 16) % 2 ? PAL.y : PAL.w);
    }
  }

  // Jefe dibujado por jefes.js (con sus proyectiles y su barra de vida), en coordenadas del mundo
  dibujarJefe(b, cam) {
    ctx.save();
    ctx.translate(-cam.x, 0);
    Jefes.dibujar(ctx, b.j, performance.now() / 1000, { barra: true });
    ctx.restore();
  }

  dibujarJugador(game, cam) {
    const p = this.player;
    if (p.hurtT > 0 && Math.floor(p.hurtT * 14) % 2 === 0) return; // parpadeo de daño
    // Pivote en los pies (centro del hitbox): ahí se aplican el giro, la inclinación y el aplastamiento
    const px = p.x + p.w / 2 - cam.x, py = p.y + p.h - cam.y;
    const aplasta = p.aterrizajeT > 0;
    // Las piernas avanzan con la distancia recorrida; al correr avanzan más deprisa
    dibujarProtagonista(px, py, p.h, {
      estado: POSE_PROTA[p.pose] || "quieto",
      dir: p.facing,
      tiempo: p.zancada / (p.pose === "correr" ? 50 : 60),
      sx: p.pose === "giro" ? Math.cos((PHYS.spinTime - p.spinT) * 15) : aplasta ? 1.15 : 1,
      sy: p.pose === "agachado" ? 0.72 : aplasta ? 0.85 : 1,
      inclina: p.pose === "frenado" ? p.facing * 0.12 : 0,
      camisa: p.fire ? "fuego" : undefined,
    });
    // Estrella: destello de colores sobre la cabeza
    if (p.star > 0) {
      const c = [PAL.r, PAL.y, PAL.lb, PAL.g][Math.floor(p.animT * 16) % 4];
      rect(px - 1, py - p.h - 4, 2, 2, c);
    }
  }
}

/* =====================================================================
   15. JUEGO: estados, colisiones y progreso
   Estados: "titulo" | "selMundo" | "overworld" | "nivel" | "pausa"
            | "muerte" | "nivelOK" | "mundoOK" | "gameover" | "final" | "minijuego"
   ===================================================================== */
class Game {
  constructor() {
    this.estado = "titulo";
    this.mundoIdx = 0;        // índice en MUNDOS
    this.nivelIdx = 0;        // índice en MUNDOS[mundoIdx].niveles
    this.lvl = null;          // Level en ejecución
    this.vidas = 3;
    this.monedas = 0;
    this.score = 0;
    this.timerEstado = 0;     // para pantallas que pasan solas (muerte, nivelOK...)
    this.selMundo = 0;        // cursor en la pantalla de selección de mundo
    this.ov = null;           // Overworld activo
    this.completados = {};    // "mundo:fase" -> true
    this.bonus = {};          // "mundo:fase" -> casa de minijuegos ya jugada
    this.reserva = { seta: 0, estrella: 0, flor: 0, pluma: 0 };   // potenciadores guardados (tecla Q)
    this.pruebaTodo = false;  // modo prueba: todos los mundos y fases abiertos (ITEM en la selección de mundo)
    this.mini = null;         // minijuego en curso
    this.cargarProgreso();
  }

  // ---------- Progreso (localStorage, envuelto en try/catch) ----------
  cargarProgreso() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      this.completados = d.completados || {};
      this.bonus = d.bonus || {};
      this.reserva = Object.assign({ seta: 0, estrella: 0, flor: 0, pluma: 0 }, d.reserva);
      this.mundoIdx = clamp(d.mundoIdx || 0, 0, MUNDOS.length - 1);
      this.vidas = clamp(d.vidas || 3, 1, 99);
      this.monedas = d.monedas || 0;
      this.score = d.score || 0;
    } catch (e) { /* save corrupto o bloqueado: empezamos de cero */ }
  }
  guardarProgreso() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        completados: this.completados, bonus: this.bonus, reserva: this.reserva,
        mundoIdx: this.mundoIdx, vidas: this.vidas, monedas: this.monedas, score: this.score,
      }));
    } catch (e) { /* sin almacenamiento: el juego sigue funcionando */ }
  }
  borrarProgreso() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* nada que borrar */ }
    this.completados = {}; this.bonus = {}; this.reserva = { seta: 0, estrella: 0, flor: 0, pluma: 0 };
    this.mundoIdx = 0; this.vidas = 3; this.monedas = 0; this.score = 0;
  }

  // Una fase está desbloqueada si es la primera del mundo (y el mundo está abierto) o la anterior está completada
  nivelDesbloqueado(mIdx, ref) {
    if (this.pruebaTodo) return true;
    if (ref === 0) return this.mundoDesbloqueado(mIdx);
    return this.completados[mIdx + ":" + (ref - 1)] === true;
  }
  mundoDesbloqueado(mIdx) {
    if (this.pruebaTodo || mIdx === 0) return true;
    // Cada mundo se desbloquea al completar el castillo del anterior
    const prev = MUNDOS[mIdx - 1];
    const castillo = prev.niveles.length - 1;
    return this.completados[(mIdx - 1) + ":" + castillo] === true;
  }

  // ---------- Utilidades llamadas por las entidades ----------
  puntos(n) { this.score += n; }
  sfx(n) { tocar(n); }
  efectoEnemigo(x, y) { emitir(x + 6, y + 6, 8, [PAL.w, PAL.y], { up: 90, spread: 90, life: 0.4 }); }

  // Golpe contra un bloque sobre la cabeza del jugador
  golpearDesdeAbajo(p) {
    const r = Math.floor((p.y - 1) / TILE);
    const c0 = Math.floor((p.x + 2) / TILE), c1 = Math.floor((p.x + p.w - 2) / TILE);
    for (const c of [c0, c1]) {
      const t = tileAt(this.lvl, c, r);
      if (t === "Q" || t === "B") { this.lvl.golpearBloque(c, r, p, this); return; }
    }
  }

  // Recoge un caparazón parado con X; con X de nuevo lo lanza hacia donde mira.
  // Devuelve true si la X se usó con un caparazón (así no dispara la flor de fuego)
  manejarCaparazon(lvl, p) {
    if (p.carrying) {
      const w = p.carrying;
      w.llevado = false;
      p.carrying = null;
      // Sale justo delante del jugador, sin solaparse con su cuerpo (si no, el caparazón nos daña al salir)
      const caja = Enemigos.box(w.e);
      w.e.x = p.x + p.w / 2 + p.facing * (p.w / 2 + (caja ? caja.w / 2 : 8) + 2);
      w.e.state = "kicked";
      w.e.dir = p.facing;
      w.e.vx = p.facing * 320;
      w.e.harmful = true;
      w.e.timer = 6;
      this.sfx("patear");
      return true;
    }
    for (const w of lvl.enemigos) {
      const e = w.e;
      if (e.type !== "caracol" || e.state !== "shell" || w.llevado) continue;
      const b = Enemigos.box(e);
      if (b && aabb({ x: p.x - 4, y: p.y, w: p.w + 8, h: p.h }, b)) {
        w.llevado = true;
        p.carrying = w;
        this.sfx("moneda");
        return true;
      }
    }
    return false;
  }

  // Con la flor de fuego, X lanza una bola de fuego hacia donde mira (como mucho BOLA.max a la vez)
  lanzarBola(lvl, p) {
    if (lvl.bolas.length >= BOLA.max) return;
    const dir = p.facing;
    lvl.bolas.push({
      x: p.x + p.w / 2 + dir * (p.w / 2 + 2), y: p.y + p.h * 0.6,
      vx: dir * BOLA.vx, vy: 0, w: BOLA.w, h: BOLA.h, t: 0, rebotes: 0, dead: false,
    });
    this.sfx("patear");
  }

  // Colisiones del jugador con objetos, monedas, enemigos, jefe y meta
  colisionesJugador(lvl) {
    const p = lvl.player;
    const hitbox = { x: p.x, y: p.y, w: p.w, h: p.h };

    // Caparazón llevado: se queda delante del jugador
    if (p.carrying) {
      const e = p.carrying.e;
      e.x = p.x + p.w / 2 + p.facing * (p.w / 2 + 10);
      e.y = p.y + p.h - e.h / 2;
    }
    // X: con un caparazón cerca lo recoge o lo patea; si no, la flor de fuego lanza una bola
    if (consume("run") && !this.manejarCaparazon(lvl, p) && p.fire) this.lanzarBola(lvl, p);
    if (consume("item")) this.usarReserva(p);

    // Objetos de bloque ?
    for (const it of lvl.items) {
      if (!aabb(hitbox, it)) continue;
      it.alive = false;
      if (it.tipo === "hongo") { p.setBig(true); this.puntos(1000); }
      else if (it.tipo === "flor") { p.setBig(true); p.fire = true; this.puntos(1000); }
      else if (it.tipo === "pluma") { p.cape = true; p.glideT = PHYS.glideTime; this.puntos(1000); }
      else if (it.tipo === "estrella") { p.star = 10; this.puntos(1000); }
      this.sfx(it.tipo === "estrella" ? "estrella" : "hongo");
    }

    // Pinchos (hacen daño) y lava (mata) en los tiles que toca el jugador
    this.peligrosTiles(lvl, p);

    // Monedas
    for (const c of lvl.coins) {
      if (!c.alive) continue;
      if (aabb(hitbox, c)) {
        c.alive = false;
        this.monedas++;
        this.puntos(100);
        if (this.monedas % 100 === 0) { this.vidas++; this.sfx("vida"); }
        else this.sfx("moneda");
      }
    }

    // Caparazón lanzado: derriba a los demás enemigos que toca
    for (const w of lvl.enemigos) {
      if (w.llevado || !Enemigos.harmful(w.e)) continue;
      const bs = Enemigos.box(w.e);
      if (!bs) continue;
      for (const o of lvl.enemigos) {
        const bo = o !== w && !o.e.dead && !o.e.remove ? Enemigos.box(o.e) : null;
        if (bo && aabb(bs, bo)) {
          o.e.dead = true; o.e.deadT = 0; o.e.vx = 0; o.e.vy = 0;
          this.puntos(200);
          this.efectoEnemigo(bo.x + bo.w / 2, bo.y + bo.h / 2);
        }
      }
    }

    // Enemigos (enemigos.js): según el tipo, se pisan, se patean o hacen daño
    for (const w of lvl.enemigos) {
      const e = w.e;
      if (w.llevado || e.remove) continue;
      const b = Enemigos.box(e);
      if (!b || !aabb(hitbox, b)) continue;
      // Con estrella, el enemigo cae al tocarlo
      if (p.star > 0) {
        if (!e.dead) {
          e.dead = true; e.deadT = 0; e.vx = 0; e.vy = 0;
          this.puntos(200);
          this.efectoEnemigo(b.x + b.w / 2, b.y + b.h / 2);
        }
        continue;
      }
      const cayendo = p.vy > 0 && p.prevBottom <= b.y + 4;     // venía de arriba
      const dir = p.x + p.w / 2 < b.x + b.w / 2 ? -1 : 1;      // lado desde el que llega
      const res = Enemigos.onTouch(e, { falling: cayendo, dir: dir });
      if (res === "bounce") {
        // Se apoya justo sobre el enemigo: el rebote no lo deja solapado (ni cuenta como daño)
        p.y = b.y - p.h;
        p.vy = p.spinT > 0 ? -PHYS.jumpV * 0.9 : -PHYS.jumpV * 0.7;
        p.spinT = 0;
        this.puntos(100);
        this.sfx("pisar");
      } else if (res === "kick") {
        this.sfx("patear");
      } else if (res === "hurt") {
        this.recibirDano(p);
      }
    }

    // Jefe: se le pisa la cabeza para quitarle una vida; su cuerpo y sus proyectiles hacen daño
    const jefe = lvl.bossRef;
    if (jefe && jefe.alive) {
      const caja = jefe.caja();
      if (p.vy > 0 && p.prevBottom <= caja.y + 6 && aabb(hitbox, caja)) {
        jefe.pisado(p, this);
        p.y = caja.y - p.h;
        p.vy = p.spinT > 0 ? -PHYS.jumpV * 0.8 : -PHYS.jumpV * 0.55;
        p.spinT = 0;
      } else if (p.star <= 0 && Jefes.toca(jefe.j, hitbox)) {
        this.recibirDano(p);
      }
    }

    // Bloquear la meta del castillo hasta derrotar al jefe
    if (lvl.boss && lvl.bossRef && lvl.bossRef.alive && p.x + p.w >= lvl.goalX) {
      p.x = lvl.goalX - p.w - 1;
      p.vx = 0;
      lvl.avisoT = 1.5;   // aviso: hay que derrotar al jefe
    }
  }

  // Lava (mata) en los tiles que toca la caja del jugador. Los pinchos se miran al caer (ver Player.update)
  peligrosTiles(lvl, p) {
    const c0 = Math.floor(p.x / TILE), c1 = Math.floor((p.x + p.w - 0.01) / TILE);
    const r0 = Math.floor(p.y / TILE), r1 = Math.floor((p.y + p.h - 0.01) / TILE);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      if (tileAt(lvl, c, r) === "V") { p.dead = true; return; }
    }
  }

  // Usa un potenciador guardado (tecla Q o botón ITEM): el primero que tenga efecto
  usarReserva(p) {
    const r = this.reserva;
    let usado = null;
    if (r.estrella > 0 && p.star <= 0) { r.estrella--; p.star = 10; usado = "estrella"; }
    else if (r.flor > 0 && !p.fire) { r.flor--; p.setBig(true); p.fire = true; usado = "flor"; }
    else if (r.seta > 0 && !p.big) { r.seta--; p.setBig(true); usado = "seta"; }
    else if (r.pluma > 0 && !p.cape) { r.pluma--; p.cape = true; p.glideT = PHYS.glideTime; usado = "pluma"; }
    if (!usado) { this.sfx("golpe"); return; }
    this.sfx(usado === "estrella" ? "estrella" : "hongo");
    emitir(p.x + p.w / 2, p.y + p.h / 2, 8, [PAL.y, PAL.w], { up: 90, spread: 80, life: 0.4 });
  }

  // Suma los premios de un minijuego: vidas y monedas al momento; potenciadores a la reserva (máx. 9)
  premiar(premios) {
    for (const { tipo, n } of premios) {
      if (tipo === "vida") this.vidas = Math.min(99, this.vidas + n);
      else if (tipo === "moneda") { this.monedas += n; this.puntos(100 * n); }
      else this.reserva[tipo] = Math.min(9, this.reserva[tipo] + n);
    }
    this.guardarProgreso();
  }

  // Casa de minijuegos del mapa: abre el minijuego que le toca a esa casa
  empezarMinijuego(mIdx, fase) {
    this.mundoIdx = mIdx;
    const orden = MUNDOS[mIdx].bonus.indexOf(fase);   // la primera casa de cada mundo, la segunda...
    this.mini = new Minijuego(this, MINIJUEGOS[(mIdx * 2 + orden) % MINIJUEGOS.length], mIdx + ":" + fase);
    this.estado = "minijuego";
  }

  // Al terminar el minijuego: se dan los premios, la casa queda hecha y vuelve el mapa
  terminarMinijuego(premios, clave) {
    this.premiar(premios);
    this.bonus[clave] = true;
    this.guardarProgreso();
    this.mini = null;
    this.volverAlMapa(this.ov ? this.ov.cur : 0);
  }

  // Daño del jugador (usa el estado del jugador para decidir)
  recibirDano(p) {
    const res = p.golpear();
    if (res === "muere") this.iniciarMuerte();
    else if (res !== "ignorado") this.sfx("golpe");
  }

  // ---------- Flujo de nivel ----------
  empezarNivel(mIdx, nIdx) {
    this.mundoIdx = mIdx;
    this.nivelIdx = nIdx;
    const mundo = MUNDOS[mIdx];
    this.lvl = new Level(mundo.niveles[nIdx], mundo);
    this.estado = "nivel";
  }

  iniciarMuerte() {
    if (this.estado === "muerte") return; // evita descontar dos vidas en el mismo frame
    const p = this.lvl.player;
    p.dead = true;
    p.pose = "muerto";
    p.vx = 0;
    p.vy = -320;   // rebote de muerte (sin colisiones)
    this.estado = "muerte";
    this.timerEstado = 2.4;
    this.sfx("muerte");
    this.vidas--;
  }

  // Llamado por el bucle: termina nivel, muerte o pantallas
  actualizarEstado(dt) {
    if (this.estado === "nivel") {
      const lvl = this.lvl;
      lvl.actualizar(dt, this);
      // Muerte por caída, por tiempo agotado o por enemigo (ya gestionada en colisiones)
      if (lvl.player.dead) {
        this.iniciarMuerte();
        return;
      }
      if (lvl.meta) {
        this.timerEstado = 1.6;
        this.estado = "nivelOK";
        this.sfx("meta");
      }
      return;
    }
    this.timerEstado -= dt;
    if (this.estado === "muerte" && this.lvl) {
      const pl = this.lvl.player;
      pl.vy += GRAVITY * dt;
      pl.y += pl.vy * dt;
      pl.animT += dt;
    }
    if (this.estado === "muerte" && this.timerEstado <= 0) {
      if (this.vidas <= 0) {
        this.estado = "gameover";
        this.timerEstado = 4;
      } else {
        this.empezarNivel(this.mundoIdx, this.nivelIdx);
      }
    }
    if (this.estado === "nivelOK" && this.timerEstado <= 0) {
      this.completarNivel();
    }
    // Tras el castillo, el siguiente mundo queda abierto en la selección
    if (this.estado === "mundoOK" && this.timerEstado <= 0) {
      this.mundoIdx = Math.min(this.mundoIdx + 1, MUNDOS.length - 1);
      this.selMundo = this.mundoIdx;
      this.estado = "selMundo";
    }
    if (this.estado === "gameover" && this.timerEstado <= 0) {
      this.vidas = 3;
      this.volverAlMapa();
    }
  }

  // Marca el nivel como completado y decide el siguiente paso
  completarNivel() {
    const mundo = MUNDOS[this.mundoIdx];
    const nivel = mundo.niveles[this.nivelIdx];
    const castillo = this.nivelIdx === mundo.niveles.length - 1;
    this.completados[this.mundoIdx + ":" + this.nivelIdx] = true;
    this.guardarProgreso();
    if (castillo && this.mundoIdx === MUNDOS.length - 1) {
      this.estado = "final";
    } else if (castillo) {
      this.estado = "mundoOK";
      this.timerEstado = 3;
      this.sfx("meta");
    } else {
      this.volverAlMapa();
    }
  }

  // Vuelve al mapa del mundo actual (overworld); cursor: nodo donde queda el jugador
  volverAlMapa(cursor) {
    this.lvl = null;
    this.ov = new Overworld(this, this.mundoIdx, cursor);
    this.estado = "overworld";
  }
}

/* =====================================================================
   19. MINIJUEGOS DE LAS CASAS DEL MAPA
   Cada casa juega un minijuego y gana premios: vidas (1UP), setas,
   estrellas, flores, plumas y monedas. Los potenciadores van a la reserva.
   Tipos: "tragaperras" (3 carretes), "cofres" (elige uno) y "recoge" (cesta).
   ===================================================================== */
const MINIJUEGOS = ["tragaperras", "cofres", "recoge"];
const SPRITE_POTENCIADOR = { seta: "hongo", estrella: "estrella", flor: "flor", pluma: "pluma" };
const NOMBRE_PREMIO = { vida: "1UP", seta: "SETA", estrella: "ESTRELLA", flor: "FLOR", pluma: "PLUMA", moneda: "MONEDAS" };

// Elige una clave de {clave: peso} al azar según los pesos
function elegirPonderado(pesos) {
  const total = Object.values(pesos).reduce((a, b) => a + b, 0);
  let x = Math.random() * total;
  for (const k in pesos) { x -= pesos[k]; if (x < 0) return k; }
  return Object.keys(pesos)[0];
}

// Enter o salto confirman en los minijuegos
function pulsa() { return consume("enter") || consume("jump"); }

// Dibuja un símbolo centrado en (cx, cy): potenciador, 1UP o moneda
function dibujarSimbolo(tipo, cx, cy) {
  if (tipo === "moneda") {
    drawSprite(Bloques.sprite("o0"), cx - 8, cy - 8);
  } else if (tipo === "vida") {
    rect(cx - 9, cy - 6, 18, 12, PAL.k);
    rect(cx - 8, cy - 5, 16, 10, PAL.g);
    txt("1UP", cx, cy - 3, PAL.w, "center");
  } else if (tipo === "bomba") {
    drawSprite(getSprite("bomba", circuloRows(5, "c"), { c: PAL.k }), cx - 5, cy - 5);
    rect(cx + 2, cy - 8, 2, 3, PAL.o);
  } else {
    const sp = objetoSprite(SPRITE_POTENCIADOR[tipo]);
    drawSprite(sp, cx - sp.lw / 2, cy - sp.lh / 2);
  }
}

class Minijuego {
  constructor(game, tipo, clave) {
    this.g = game;
    this.tipo = tipo;         // "tragaperras" | "cofres" | "recoge"
    this.clave = clave;       // "mundo:fase" de la casa, para no repetirla
    this.fase = "intro";      // intro -> juego -> resultado
    this.t = 0;
    this.premios = [];        // [{tipo, n}] que se entregan al salir
    this.textoFinal = "";
    this.esperaT = 0;
    if (tipo === "tragaperras") {
      this.carretes = [0, 1, 2].map(() => ({ pos: rndi(0, 5), reloj: 0, parado: false, valor: null }));
      this.paso = ["seta", "estrella", "flor", "pluma", "moneda", "vida"];   // orden de los símbolos al girar
    } else if (tipo === "cofres") {
      this.sel = 1;
      this.abierto = false;
      const premio = elegirPonderado({ vida: 1, seta: 2, estrella: 2, flor: 2, pluma: 2 });
      this.contenido = [0, 1, 2].map(() => ({ tipo: "moneda", n: rndi(2, 4) }));
      this.contenido[rndi(0, 2)] = { tipo: premio, n: premio === "vida" ? 1 : 2 };
    } else {
      this.tiempoJuego = 20;
      this.cesta = W / 2;
      this.caen = [];
      this.reloj = 0;
      this.recogidos = {};
      this.aviso = "";
      this.avisoT = 0;
    }
  }

  // Devuelve true cuando el jugador sale del minijuego (los premios ya están en this.premios)
  update(dt) {
    this.t += dt;
    if (this.fase === "intro") {
      if (this.t > 1.2 || pulsa()) { this.fase = "juego"; this.t = 0; }
      return false;
    }
    if (this.fase === "resultado") return pulsa();
    if (this.tipo === "tragaperras") this.updateTragaperras(dt);
    else if (this.tipo === "cofres") this.updateCofres(dt);
    else this.updateRecoge(dt);
    return false;
  }

  /* ----- Tragaperras: cada pulsación para un carrete; tres iguales dan el premio gordo ----- */
  updateTragaperras(dt) {
    if (this.esperaT > 0) {
      this.esperaT -= dt;
      if (this.esperaT <= 0) this.evaluarTragaperras();
      return;
    }
    for (const c of this.carretes) {
      if (c.parado) continue;
      c.reloj += dt;
      while (c.reloj > 0.08) { c.reloj -= 0.08; c.pos = (c.pos + 1) % this.paso.length; }
    }
    if (pulsa()) {
      const c = this.carretes.find((cc) => !cc.parado);
      if (c) {
