    // Miró y Gaudí: perro que se lanza a ladrar, sol negro que rebota y serpiente de trencadís
    perro:          { w: 26, h: 16, vel: 40, pisable: true },
    sol_negro:      { w: 14, h: 14, vel: 46, pisable: false },
    serpiente:      { w: 26, h: 10, vel: 30, pisable: true }
  };

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }

  function create(tipo, x, y, opciones) {
    const d = DEFS[tipo];
    if (!d) throw new Error('Enemigo desconocido: ' + tipo);
    const dir = (opciones && opciones.dir) || -1;
    return {
      type: tipo, x: x, y: y, base: y, homeX: x, homeY: y,
      w: d.w, h: d.h,
      vx: dir * d.vel, vy: 0, dir: dir,
      t: Math.random() * 3, ph: Math.random() * 6.28,
      onGround: false, state: 'walk', timer: Math.random() * 2, cool: 1 + Math.random(),
      reposo: false, lunging: false, lungeT: 0, jumpT: Math.random() * 2,
      diveT: 0, dvx: 0, dvy: 0, alerta: false,
      lx: 0, sway: 0, up: 0,
      dead: false, deadT: 0, remove: false, harmful: false
    };
  }

  // ¿Hay pared delante de la caja? Mira arriba y en medio: un bloque a cualquiera de esas alturas frena.
  // (La base no se mira: el suelo del otro lado de un hueco no debe frenar la caída.)
  function paredEn(mundo, x, e) {
    return mundo.solid(x, e.y - e.h / 2 + 2) || mundo.solid(x, e.y);
  }

  // Física de caminante: gravedad, paredes, suelo por baldosas y giro en los bordes.
  // Un caparazón lanzado no gira en los bordes: cae. Para chocar con las paredes cuenta
  // como si tuviera el ancho de un bloque, así puede caer por un hueco de dos bloques.
  function caminar(e, dt, mundo) {
    const tile = mundo.tile || 16;
    e.vy = Math.min(e.vy + GRAV * dt, MAX_CAIDA);

    const nx = e.x + e.vx * dt;
    const media = e.state === 'kicked' ? tile / 2 : e.w / 2;
    const frente = nx + (e.vx >= 0 ? 1 : -1) * media;
    if (paredEn(mundo, frente, e)) e.vx = -e.vx;
    else e.x = nx;

    let ny = e.y + e.vy * dt;
    const pie = ny + e.h / 2;
    e.onGround = false;
    if (e.vy >= 0 && mundo.solid(e.x, pie)) {
      ny = Math.floor(pie / tile) * tile - e.h / 2;
      e.vy = 0;
      e.onGround = true;
    }
    e.y = ny;

    if (e.onGround && e.vx !== 0 && e.state !== 'dive' && e.state !== 'kicked') {
      const d = e.vx > 0 ? 1 : -1;
      if (!mundo.solid(e.x + d * (e.w / 2 + 3), e.y + e.h / 2 + 3)) e.vx = -e.vx; // no girar al vacío
    }
    if (e.vx !== 0) e.dir = e.vx > 0 ? 1 : -1;
  }

  // Cerebro de cada tipo: decide la velocidad y los saltos (la física la pone caminar)
  function cerebro(e, dt, mundo, j) {
    const d = DEFS[e.type];
    const cerca = j ? Math.abs(j.x - e.x) : 9999;
    const haciaJ = j ? (j.x >= e.x ? 1 : -1) : e.dir;
    e.timer -= dt;
    e.cool -= dt;
    e.jumpT -= dt;

    switch (e.type) {
      case 'esqueleto': {
        if (e.timer <= 0) {
          if (e.reposo) { e.reposo = false; e.timer = 1.5 + Math.random() * 2; }
          else if (Math.random() < 0.4) { e.reposo = true; e.timer = 0.6; }
          else e.timer = 1.5 + Math.random() * 2;
        }
        e.alerta = cerca < 170;
        let v = e.reposo ? 0 : d.vel;
        if (e.alerta) { e.dir = haciaJ; v = 95; }
        e.vx = e.dir * v;
        if (e.onGround && e.jumpT <= 0 && (cerca < 200 || Math.random() < 0.004)) {
          e.vy = -360; e.jumpT = 1.8 + Math.random() * 1.5;
        }
        break;
      }
      case 'erizo_zombie': {
        if (e.lunging) {
          e.lungeT -= dt;
          e.vx = e.dir * 150;
          if (e.lungeT <= 0) { e.lunging = false; e.cool = 3; e.vx = 0; }
          break;
        }
        if (cerca < 110 && e.cool <= 0 && j) {
          e.lunging = true; e.lungeT = 0.5; e.dir = haciaJ; e.vx = e.dir * 150;
          break;
        }
        const tambaleo = 0.5 + 0.5 * Math.sin(e.t * 4);
        if (cerca < 200 && j) e.dir = haciaJ;
        e.vx = e.dir * (14 + tambaleo * 16);
        break;
      }
      case 'caracol_zombie': {
        if (e.timer <= 0) { e.reposo = !e.reposo; e.timer = e.reposo ? 1.4 : 2.2; }
        if (cerca < 140 && j) e.dir = haciaJ;
        const cerca2 = cerca < 140;
        e.vx = e.reposo ? 0 : e.dir * (cerca2 ? 38 : d.vel);
        break;
      }
      case 'hormiga': {
        if (e.timer <= 0 && e.onGround) {
          e.vy = -240;
          e.timer = 0.55 + Math.random() * 0.3;
          if (j && cerca < 200) e.dir = haciaJ;
          else if (Math.random() < 0.3) e.dir = -e.dir;
        }
        e.vx = e.dir * d.vel;
        break;
      }
      case 'pinguino': {
        // anda contoneándose; si te acercas, se tira de barriga y se desliza
        if (e.lunging) {
          e.lungeT -= dt;
          e.vx = e.dir * 120;
          if (e.lungeT <= 0) { e.lunging = false; e.cool = 2.5; }
          break;
        }
        if (cerca < 120 && e.cool <= 0 && j) { e.lunging = true; e.lungeT = 0.7; e.dir = haciaJ; break; }
        e.vx = e.dir * d.vel * (0.7 + 0.3 * Math.abs(Math.sin(e.t * 9)));
        break;
      }
      case 'cangrejo': {
        // de lado y a golpes de pinza: se acelera cuando te tiene cerca
        if (cerca < 150 && j) e.dir = haciaJ;
        e.vx = e.dir * (cerca < 150 ? d.vel * 1.8 : d.vel);
        break;
      }
      case 'escorpion': {
        // avanza despacio y, si estás cerca, para y lanza el aguijón (no se puede pisar)
        if (e.lunging) {
          e.lungeT -= dt;
          e.vx = 0;
          if (e.lungeT <= 0) { e.lunging = false; e.cool = 1.6; }
          break;
        }
        if (cerca < 70 && e.cool <= 0 && j) { e.lunging = true; e.lungeT = 0.5; e.dir = haciaJ; e.vx = 0; break; }
        if (cerca < 160 && j) e.dir = haciaJ;
        e.vx = e.dir * d.vel;
        break;
      }
      case 'seta': {
        // paseo lento; cuando se gira en un borde, se queda un momento mirando
        e.vx = e.reposo ? 0 : e.dir * d.vel;
        if (e.timer <= 0) { e.reposo = !e.reposo; e.timer = e.reposo ? 0.8 : 2.4; }
        break;
      }
      case 'jabali': {
        // carga en línea recta cuando te ve delante; si no, trota de un lado a otro
        if (e.lunging) {
          e.lungeT -= dt;
          e.vx = e.dir * 150;
          if (e.lungeT <= 0) { e.lunging = false; e.cool = 2.2; e.vx = 0; }
          break;
        }
        if (cerca < 150 && e.cool <= 0 && j) { e.lunging = true; e.lungeT = 0.9; e.dir = haciaJ; break; }
        e.vx = e.dir * d.vel;
        break;
      }
      case 'pez': {
        // nada a ras de agua y de vez en cuando salta fuera en un arco
        if (e.onGround && e.jumpT <= 0) {
          e.vy = -(300 + Math.random() * 90);
          e.jumpT = 1.4 + Math.random() * 1.6;
          if (j && cerca < 200) e.dir = haciaJ;
        }
        e.vx = e.dir * d.vel;
        break;
      }
      case 'silla': {
        // Silla con pipa: avanza y da brincos de vez en cuando; si estás cerca, se gira hacia ti
        if (cerca < 160 && j) e.dir = haciaJ;
        e.vx = e.dir * d.vel;
        if (e.onGround && e.jumpT <= 0) { e.vy = -340; e.jumpT = 1.4 + Math.random() * 1.2; }
        break;
      }
      case 'perro': {
        // Perro de Miró: trota; si te tiene cerca, ladra y se lanza contra ti
        if (e.lunging) {
          e.lungeT -= dt;
          e.vx = e.dir * 175;
          if (e.lungeT <= 0) { e.lunging = false; e.cool = 2.2; e.vx = 0; }
          break;
        }
        if (cerca < 120 && e.cool <= 0 && j) { e.lunging = true; e.lungeT = 0.45; e.dir = haciaJ; e.vx = e.dir * 175; break; }
        if (cerca < 200 && j) e.dir = haciaJ;
        e.vx = e.dir * d.vel;
        break;
      }
      case 'sol_negro': {
        // Sol negro de Miró: rebota en el suelo como una pelota, y cada salto tiene una altura distinta
        e.vx = e.dir * d.vel;
        if (e.onGround && e.jumpT <= 0) { e.vy = -(300 + Math.random() * 110); e.jumpT = 0.15; }
        break;
      }
      case 'arana': {
        // espera colgada; cuando pasas por debajo, salta sobre ti
        if (e.onGround && e.cool <= 0 && cerca < 60 && j) {
          e.vy = -320; e.vx = haciaJ * 70; e.cool = 2.0;
        }
        e.vx *= 0.92;
        break;
      }
    }
  }

  function kick(e, dir) {
    e.state = 'kicked';
    e.vx = dir * 320;
    e.dir = dir;
    e.harmful = true;
    e.timer = 6;
  }

  function updAbeja(e, dt, mundo, j) {
    if (e.dead) {
      e.vy += GRAV * 0.6 * dt;
      e.y += e.vy * dt;
      if (e.y > mundo.abismo) e.remove = true;
      return;
    }
    if (e.state === 'dive') {
      e.diveT -= dt;
      e.x += e.dvx * dt;
      e.y += e.dvy * dt;
      e.dir = e.dvx >= 0 ? 1 : -1;
      if (e.diveT <= 0 || e.y > mundo.buceoMax) e.state = 'return';
      return;
    }
    if (e.state === 'return') {
      const dx = e.homeX - e.x, dy = e.homeY - e.y;
      const L = Math.hypot(dx, dy) || 1;
      const s = 140 * dt;
      if (L <= s) { e.x = e.homeX; e.y = e.homeY; e.state = 'walk'; e.cool = 3 + Math.random() * 2; }
      else { e.x += dx / L * s; e.y += dy / L * s; }
      e.dir = dx >= 0 ? 1 : -1;
      return;
    }
    // vuelo en onda
    e.cool -= dt;
    const nx = e.x + e.vx * dt;
    if (mundo.solid(nx + (e.vx > 0 ? 1 : -1) * e.w / 2, e.y)) e.vx = -e.vx;
    else e.x = nx;
    e.dir = e.vx >= 0 ? 1 : -1;
    e.y = e.base + Math.sin(e.t * 3 + e.ph) * 18;
    e.homeY = e.base;
    if (j && e.cool <= 0 && Math.abs(j.x - e.x) < 260 && j.y > e.y) {
      e.state = 'dive';
      e.diveT = 0.9;
      e.homeX = e.x;
      const dx = j.x - e.x, dy = j.y - e.y;
      const L = Math.hypot(dx, dy) || 1;
      e.dvx = dx / L * 190;
      e.dvy = dy / L * 190;
    }
  }

  function updPlanta(e, dt, j) {
    const zombie = !!DEFS[e.type].zombie;
    const ciclo = zombie ? 2.4 : 3.2;
    const f = (e.t % ciclo) / ciclo;   // escondida, sube, abierta, baja
    let up = 0;
    if (f < 0.25) up = 0;
    else if (f < 0.45) up = smooth((f - 0.25) / 0.2);
    else if (f < 0.75) up = 1;
    else if (f < 0.95) up = 1 - smooth((f - 0.75) / 0.2);
    e.up = up;
    if (zombie) {
      const cerca = j ? Math.abs(j.x - e.x) : 9999;
      const objetivo = (up > 0.7 && cerca < 90 && j) ? clamp((j.x - e.x) * 0.4, -14, 14) : 0;
      e.lx += (objetivo - e.lx) * Math.min(1, dt * 8);
      e.sway = Math.sin(e.t * 4) * 2.5 * up;
    } else {
      e.lx = 0;
      e.sway = 0;
    }
  }

  // Voladores sin gravedad: murciélago (zigzag rápido), medusa (flota despacio) y fantasma
  // (persigue al jugador y atraviesa paredes). Al morir caen como la abeja.
  function updVolador(e, dt, mundo, j) {
    if (e.dead) {
      e.vy += GRAV * 0.6 * dt;
      e.y += e.vy * dt;
      if (e.y > mundo.abismo) e.remove = true;
      return;
    }
    const tile = mundo.tile || 16;
    if (e.type === 'fantasma' && j) {
      const dx = j.x - e.x, dy = j.y - e.y;
      const L = Math.hypot(dx, dy) || 1;
      const s = Math.min(DEFS.fantasma.vel, L) * dt;
      e.x += dx / L * s;
      e.y += dy / L * s + Math.sin(e.t * 2) * 0.3;
      e.dir = dx >= 0 ? 1 : -1;
      return;
    }
    if (e.type === 'murcielago' || e.type === 'cuervo' || e.type === 'pajaro_miro') {
      e.timer -= dt;
      if (e.timer <= 0) { e.vx = -e.vx * (0.6 + Math.random() * 0.8); e.timer = 0.6 + Math.random() * 0.8; }
      e.y = e.base + Math.sin(e.t * 7) * 16;
    } else if (e.type === 'pez_nadador') {
      // nada a su altura meciéndose; con el jugador cerca, la cambia poco a poco hacia la suya
      if (j && Math.abs(j.x - e.x) < 110) e.base += clamp(j.y - e.base, -1, 1) * 14 * dt;
      e.y = e.base + Math.sin(e.t * 2.2) * 4;
    } else {
      e.y = e.base + Math.sin(e.t * 1.5) * 10;     // medusa: sube y baja sin prisa
    }
    const nx = e.x + e.vx * dt;
    if (mundo.solid(nx + (e.vx > 0 ? 1 : -1) * e.w / 2, e.y)) e.vx = -e.vx;
    else e.x = nx;
    e.dir = e.vx >= 0 ? 1 : -1;
    e.homeY = e.base;
  }

  // Estrella fugaz (Van Gogh): cae en diagonal desde el cielo, sin chocar con nada, y se apaga al tocar el suelo
  function updEstrellaFugaz(e, dt, mundo) {
    if (e.dead) { e.vy += GRAV * 0.6 * dt; e.y += e.vy * dt; if (e.y > mundo.abismo) e.remove = true; return; }
    if (!e.caida) {
      e.caida = true; e.timer = 8;
      e.vy = DEFS.estrella_fugaz.vel * 0.8;
      if (Math.random() < 0.5) { e.vx = -e.vx; e.dir = -e.dir; }   // a veces cae hacia la derecha
    }
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    e.timer -= dt;
    if (e.timer <= 0 || mundo.solid(e.x, e.y + e.h / 2)) e.remove = true;
  }

  // Luna creciente (Van Gogh, "La noche estrellada"): da vueltas en órbita alrededor del sitio donde aparece
  function updLuna(e, dt, mundo) {
    if (e.dead) { e.vy += GRAV * 0.6 * dt; e.y += e.vy * dt; if (e.y > mundo.abismo) e.remove = true; return; }
    const a = e.t * 1.4 + e.ph;
    const x = e.homeX + Math.cos(a) * 24;
    e.dir = x >= e.x ? 1 : -1;
    e.x = x;
    e.y = e.homeY + Math.sin(a) * 12;
  }

  // Saltarines (pez y bola de lava): tiro parabólico sin chocar con nada; desaparecen al volver a su altura de salida
  function updSaltarin(e, dt) {
    e.vy = Math.min(e.vy + 700 * dt, MAX_CAIDA);
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    if (e.vx) e.dir = e.vx > 0 ? 1 : -1;
    if (e.vy > 0 && e.y > e.homeY + 4) e.remove = true;
  }

  // Nubarrón: te sigue desde arriba, meciéndose por delante y por detrás de ti, y cada pocos segundos lanza un erizo
  function updNubarron(e, dt, j, mundo) {
    e.lanza = false;
    if (e.dead) {
      e.vy += GRAV * 0.6 * dt;
      e.y += e.vy * dt;
      if (e.y > mundo.abismo) e.remove = true;
      return;
    }
    const objetivo = j ? j.x + Math.sin(e.t * 0.7) * 70 : e.x;
    e.vx += (clamp((objetivo - e.x) * 1.6, -120, 120) - e.vx) * Math.min(1, dt * 2);
    e.x += e.vx * dt;
    e.y = e.base + Math.sin(e.t * 2) * 4;
    e.dir = j && j.x < e.x ? -1 : 1;
    e.cool -= dt;
    if (e.brazo > 0) e.brazo -= dt;
    if (j && e.cool <= 0 && Math.abs(j.x - e.x) < 180) {
      e.lanza = true;
      e.cool = 3 + Math.random() * 1.5;
      e.brazo = 0.35;
    }
  }

  function update(e, dt, mundo) {
    if (e.remove) return;
    e.t += dt;
    const j = mundo.jugador || null;
    const d = DEFS[e.type];

    if (d.salta) {
      if (e.dead) { e.vy += GRAV * 0.6 * dt; e.y += e.vy * dt; if (e.y > mundo.abismo) e.remove = true; return; }
      updSaltarin(e, dt);
      return;
    }
    if (d.nube) { updNubarron(e, dt, j, mundo); return; }
    if (d.planta) { updPlanta(e, dt, j); return; }
    if (e.type === 'abeja') { updAbeja(e, dt, mundo, j); return; }
    if (e.type === 'estrella_fugaz') { updEstrellaFugaz(e, dt, mundo); return; }
    if (e.type === 'luna') { updLuna(e, dt, mundo); return; }
    if (d.vuela) { updVolador(e, dt, mundo, j); return; }

    if (e.dead) {
      e.deadT += dt;
      if (e.deadT > 0.6) e.remove = true;
      return;
    }
    if (e.state === 'kicked') {
      e.timer -= dt;
      if (e.timer <= 0) e.remove = true;
      caminar(e, dt, mundo);
      return;
    }
    if (e.state === 'shell') {
      e.vx = 0;
      e.timer -= dt;
      if (e.timer <= 0) { e.state = 'walk'; e.vx = e.dir * d.vel; }
      caminar(e, dt, mundo);
      return;
    }
    cerebro(e, dt, mundo, j);
    caminar(e, dt, mundo);
  }

  // Reacción al contacto con el jugador
  function onTouch(e, p) {
    p = p || {};
    const dir = p.dir || 1;
    const d = DEFS[e.type];
    if (e.remove || e.dead) return 'none';
    if (d.planta) return (e.up > 0.3) ? 'hurt' : 'none';
    if (e.state === 'kicked') return 'hurt';

    if (d.concha) {
      if (e.state === 'shell') {
        kick(e, dir);
        return p.falling ? 'bounce' : 'kick';
      }
      if (p.falling) { e.state = 'shell'; e.vx = 0; e.timer = 4; return 'bounce'; }
      return 'hurt';
    }

    // Los que no se pisan (escorpión, pez, medusa, fantasma) siempre hacen daño
    if (!d.pisable) return 'hurt';

    // erizo, abeja, esqueleto, erizo zombi, hormiga, pingüino, cangrejo, seta, jabalí, murciélago, araña
    if (p.falling) {
      e.dead = true; e.deadT = 0; e.vx = 0; e.vy = 0;
      return 'bounce';
    }
    return 'hurt';
  }

  function headOffset(e) {
    return { x: e.lx + e.sway, y: 12 - e.up * 38 };
  }

  function box(e) {
    const d = DEFS[e.type];
    if (d.planta) {
      if (e.up <= 0.3) return null;
      const hd = headOffset(e);
      return { x: e.x + hd.x - 8, y: e.y + hd.y - 8, w: 16, h: 16 };
    }
    return { x: e.x - e.w / 2, y: e.y - e.h / 2, w: e.w, h: e.h };
  }

  function harmful(e) {
    return !!e.harmful && !e.remove;
  }

  /* ---------- Dibujo con volumen ----------
     Cada forma lleva un degradado radial (luz arriba a la izquierda, sombra abajo a la derecha),
     un contorno oscuro suave y una sombra en el suelo. Todo en Canvas 2D, sin imágenes. */

  // Elipse con degradado radial: cols = [luz, medio, sombra]
  function esfera(c, x, y, rx, ry, cols, rot) {
    c.save();
    c.translate(x, y);
    if (rot) c.rotate(rot);
    c.scale(rx, ry);
    const g = c.createRadialGradient(-0.35, -0.45, 0.05, 0, 0, 1.05);
    g.addColorStop(0, cols[0]);
    g.addColorStop(0.55, cols[1]);
    g.addColorStop(1, cols[2]);
    c.fillStyle = g;
    c.beginPath(); c.arc(0, 0, 1, 0, Math.PI * 2); c.fill();
    c.restore();
  }

  function contorno(c, x, y, rx, ry, grosor) {
    c.save();
    c.strokeStyle = 'rgba(43,29,20,0.75)';
    c.lineWidth = grosor || 1.2;
    c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.stroke();
    c.restore();
  }

  function sombraSuelo(c, x, y, rx, ry, fuerza) {
    const a = fuerza || 0.35;
    esfera(c, x, y, rx, ry, [
      'rgba(30,15,50,' + a + ')',
      'rgba(30,15,50,' + (a * 0.6) + ')',
      'rgba(30,15,50,0)'
    ]);
  }

  /* Paletas: cambian el color sin cambiar la forma (zombis = mismo dibujo, otros tonos) */
  const PAL = {
    erizo: {
      cuerpo: ['#d89a66', '#8f5e3b', '#4a2c18'], vientre: ['#fbe2b8', '#e0b07a', '#b5844f'],
      pua: '#3d2212', pua2: '#7a4a2a', ojo: '#1a1a1a', ojoBlanco: true
    },
    erizo_zombie: {
      cuerpo: ['#c2d69e', '#7f9a66', '#3e5230'], vientre: ['#dfe8c4', '#a9bd8a', '#5c7044'],
      pua: '#2a3620', pua2: '#55663e', ojo: '#ff4d4d', ojoBlanco: false
    },
    caracol: {
      cuerpo: ['#dcefb0', '#b8d66a', '#6f8f35'], concha: ['#ffd594', '#e39b3c', '#8a4f16'],
      linea: 'rgba(90,50,12,0.85)', brillo: 'rgba(255,245,220,0.7)'
    },
    caracol_zombie: {
      cuerpo: ['#d6dcc0', '#8c9c74', '#4a5a3a'], concha: ['#b8a88a', '#7a6a4c', '#3a2e20'],
      linea: 'rgba(30,20,10,0.85)', brillo: 'rgba(230,220,200,0.45)'
    },
    planta: {
      cabeza: ['#ff9a9e', '#e5484d', '#8a1a20'], tallo: '#2f8f4e',
      maceta: ['#5cc47f', '#2f8f4e', '#1a5a30'], borde: ['#6fd08f', '#2f8f4e'], borde2: '#1f6b39'
    },
    planta_zombie: {
      cabeza: ['#d4e2a6', '#8aa05a', '#3d4f25'], tallo: '#5d6b3a',
      maceta: ['#9a9f88', '#5b614d', '#2e3226'], borde: ['#b5ba9e', '#5b614d'], borde2: '#2a2e20'
    }
  };

  function dibujarErizo(c, e, t, pal) {
    const rebote = !e.dead && e.onGround ? Math.abs(Math.sin(t * 12)) * 1.2 : 0;
    c.translate(e.x, e.y - rebote);
    c.scale(e.dir, 1);

    // púas: cada una con una cara iluminada y otra en sombra
    const pt = (ang, r) => [Math.cos(ang) * (17 + r), Math.sin(ang) * (12 + r) + 2];
    for (let i = 0; i < 7; i++) {
      const a = Math.PI * (1.12 + i * 0.12);
      const tip = pt(a, 9), p1 = pt(a - 0.12, 0), p2 = pt(a + 0.12, 0), pm = pt(a - 0.05, 0);
      c.fillStyle = pal.pua;
      c.beginPath(); c.moveTo(p1[0], p1[1]); c.lineTo(tip[0], tip[1]); c.lineTo(pm[0], pm[1]); c.fill();
      c.fillStyle = pal.pua2;
      c.beginPath(); c.moveTo(pm[0], pm[1]); c.lineTo(tip[0], tip[1]); c.lineTo(p2[0], p2[1]); c.fill();
    }

    esfera(c, 0, 2, 17, 12, pal.cuerpo);
    contorno(c, 0, 2, 17, 12);
    esfera(c, 3, 8, 11, 5, pal.vientre);
    esfera(c, 16, 5, 5, 3.5, pal.vientre);
    c.fillStyle = '#222';
    c.beginPath(); c.arc(20, 4, 1.6, 0, Math.PI * 2); c.fill();
    esfera(c, -5, -4, 5, 2.2, ['rgba(255,240,220,0.55)', 'rgba(255,240,220,0.15)', 'rgba(255,240,220,0)']);

    if (e.dead) {
      c.strokeStyle = '#222'; c.lineWidth = 1.6;
      c.beginPath();
      c.moveTo(5, -4); c.lineTo(11, 1); c.moveTo(11, -4); c.lineTo(5, 1);
      c.stroke();
    } else if (pal.ojoBlanco) {
      esfera(c, 8, -1, 3, 3.2, ['#ffffff', '#f2f2f2', '#b8b8c4']);
      esfera(c, 9, -1, 1.9, 1.9, ['#3a3a3a', '#1a1a1a', '#000000']);
      c.fillStyle = '#ffffff';
      c.beginPath(); c.arc(9.8, -1.9, 0.6, 0, Math.PI * 2); c.fill();
    } else {
      // ojo zombi: brillo rojo
      esfera(c, 8, -1, 2.8, 2.8, ['#ffd0d0', pal.ojo, '#5a0000']);
    }

    if (!e.dead) {
      [-7, 6].forEach(function (x0, i) {
        const sw = Math.sin(t * 12 + i * Math.PI) * 2.5;
        esfera(c, x0 + sw * 0.3, 13, 3.5, 2.5, ['#7a5034', '#5a3a22', '#2e1c10']);
      });
    }
  }

  function caparazon(c, x, y, r, giro, pal) {
    esfera(c, x, y, r, r, pal.concha);
    contorno(c, x, y, r, r, 1.6);
    c.save();
    c.translate(x, y);
    c.rotate(giro);
    c.strokeStyle = pal.linea;
    c.lineWidth = 1.6;
    c.beginPath(); c.arc(0, 0, r * 0.55, 0, Math.PI * 1.6); c.stroke();
    c.beginPath(); c.arc(0, 0, r * 0.25, 0, Math.PI * 1.2); c.stroke();
    c.strokeStyle = pal.brillo;
    c.lineWidth = 1.2;
    c.beginPath(); c.arc(0, 0, r * 0.8, Math.PI * 1.2, Math.PI * 1.7); c.stroke();
    c.restore();
  }

  function dibujarCaracol(c, e, t, pal) {
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    if (e.state === 'walk') {
      esfera(c, 4, 7, 15, 5, pal.cuerpo);
      esfera(c, 13, 0, 6, 5.5, pal.cuerpo);
      c.strokeStyle = pal.cuerpo[2]; c.lineWidth = 2;
      c.beginPath(); c.moveTo(12, -4); c.lineTo(12, -10); c.moveTo(16, -4); c.lineTo(18, -9); c.stroke();
      esfera(c, 12, -10, 2.2, 2.2, ['#ffffff', '#f0f0f0', '#a8a8b8']);
      esfera(c, 18, -9, 2.2, 2.2, ['#ffffff', '#f0f0f0', '#a8a8b8']);
      c.fillStyle = '#222';
      c.beginPath(); c.arc(12.6, -10, 1, 0, Math.PI * 2); c.arc(18.6, -9, 1, 0, Math.PI * 2); c.fill();
      caparazon(c, -3, -2, 11, 0, pal);
    } else {
      const giro = e.state === 'kicked' ? t * 18 : 0;
      caparazon(c, 0, 2, 11, giro, pal);
    }
  }

  function dibujarAbeja(c, e, t) {
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    if (e.dead) c.rotate(1.4);
    const aleteo = e.dead ? 1 : 0.35 + 0.65 * Math.abs(Math.sin(t * 36));
    esfera(c, -2, -8, 7, 4.5 * aleteo, ['rgba(255,255,255,0.95)', 'rgba(210,235,250,0.8)', 'rgba(110,150,185,0.7)'], -0.3);
    esfera(c, 0, 0, 11, 8, ['#fff3b0', '#f5c53c', '#a77a12']);
    c.save();
    c.beginPath(); c.ellipse(0, 0, 11, 8, 0, 0, Math.PI * 2); c.clip();
    c.fillStyle = '#2a2a2a';
    c.fillRect(-4, -9, 3, 18);
    c.fillRect(3, -9, 3, 18);
    c.restore();
    contorno(c, 0, 0, 11, 8, 1);
    c.fillStyle = '#2a2a2a';
    c.beginPath(); c.moveTo(-10, -1); c.lineTo(-15, 0); c.lineTo(-10, 1); c.fill();
    esfera(c, 6, -2, 3, 3, ['#ffffff', '#f2f2f2', '#b8b8c4']);
    esfera(c, 7, -2, 1.6, 1.6, ['#3a3a3a', '#111111', '#000000']);
    c.fillStyle = '#ffffff';
    c.beginPath(); c.arc(7.6, -2.6, 0.5, 0, Math.PI * 2); c.fill();
  }

  function dibujarPlanta(c, e, t, pal) {
    const hd = headOffset(e);
    c.translate(e.x, e.y);

    if (e.up > 0.02) {
      c.strokeStyle = pal.tallo; c.lineWidth = 5;
      c.beginPath(); c.moveTo(0, 6); c.lineTo(hd.x, hd.y); c.stroke();
      c.strokeStyle = 'rgba(200,255,210,0.3)'; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(-1.5, 6); c.lineTo(hd.x - 1.5, hd.y); c.stroke();
    }

    c.save();
    c.translate(hd.x, hd.y);
    const abre = 0.35 + 0.65 * Math.abs(Math.sin(t * (e.type === 'planta_zombie' ? 6 : 4)));
    esfera(c, 0, 0, 9, 9, pal.cabeza);
    contorno(c, 0, 0, 9, 9);
    esfera(c, -4, -4, 1.8, 1.8, ['#ffffff', '#ffffff', '#dddddd']);
    esfera(c, 3, -5, 1.5, 1.5, ['#ffffff', '#ffffff', '#dddddd']);
    esfera(c, 0, 4, 6, 1.5 + abre * 3.5, ['#5a1a22', '#3a0d12', '#1a0508']);
    c.fillStyle = '#fff';
    [-3, 0, 3].forEach(function (x) {
      c.beginPath(); c.moveTo(x - 1, 2.6); c.lineTo(x + 1, 2.6); c.lineTo(x, 4.2); c.fill();
    });
    if (e.type === 'planta_zombie') {
      // hilo de baba que cuelga de la boca
      c.strokeStyle = 'rgba(220,240,180,0.8)'; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(-2, 7); c.lineTo(-2, 9 + abre * 3); c.stroke();
    }
    c.restore();

    const gp = c.createLinearGradient(-9, 0, 9, 0);
    gp.addColorStop(0, pal.maceta[0]);
    gp.addColorStop(0.35, pal.maceta[1]);
    gp.addColorStop(1, pal.maceta[2]);
    c.fillStyle = gp;
    c.fillRect(-9, 0, 18, 18);
    const gr = c.createLinearGradient(0, -4, 0, 3);
    gr.addColorStop(0, pal.borde[0]);
    gr.addColorStop(1, pal.borde[1]);
    c.fillStyle = gr;
    c.fillRect(-12, -4, 24, 7);
    c.strokeStyle = pal.borde2; c.lineWidth = 1.2;
    c.strokeRect(-12, -4, 24, 7);
  }

  function dibujarEsqueleto(c, e, t) {
    const paso = Math.sin(t * 10);
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    const hueso = ['#fffdf2', '#e8e2cc', '#9c9478'];

    // piernas que se mueven al andar
    c.strokeStyle = '#e8e2cc'; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-3, 6); c.lineTo(-3 + paso * 3, 15); c.stroke();
    c.beginPath(); c.moveTo(3, 6); c.lineTo(3 - paso * 3, 15); c.stroke();
    // brazos
    c.beginPath(); c.moveTo(-4, -8); c.lineTo(-7 - paso * 2, 0); c.stroke();
    c.beginPath(); c.moveTo(4, -8); c.lineTo(8 + paso * 2, -1); c.stroke();
    // columna
    for (let i = 0; i < 4; i++) esfera(c, 0, -2 + i * 4.5, 2.8, 2, hueso);
    // costillas
    c.strokeStyle = 'rgba(120,110,80,0.8)'; c.lineWidth = 1.2;
    for (let i = 0; i < 3; i++) {
      c.beginPath(); c.arc(0, -5 + i * 4, 6, 0.3, Math.PI - 0.3); c.stroke();
    }
    // cráneo
    esfera(c, 0, -14, 7, 6.5, hueso);
    contorno(c, 0, -14, 7, 6.5, 1);
    // cuencas: rojas si te persiguen
    esfera(c, 2.5, -15, 2.6, 3, ['#2a2a2a', '#111111', '#000000']);
    if (e.alerta) esfera(c, 2.5, -15, 1.3, 1.3, ['#ffb0b0', '#e0202a', '#8a0a10']);
    // mandíbula con dientes
    esfera(c, 1, -8, 4.5, 2.2, hueso);
    c.strokeStyle = 'rgba(120,110,80,0.8)'; c.lineWidth = 0.8;
    [-2, 0, 2].forEach(function (x) { c.beginPath(); c.moveTo(x + 1, -9.5); c.lineTo(x + 1, -7); c.stroke(); });
  }

  function dibujarHormiga(c, e, t) {
    const pasos = Math.sin(t * 24);
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    // patas, tres pares que se alternan
    c.strokeStyle = '#3a1a0c'; c.lineWidth = 1.4; c.lineCap = 'round';
    [-4, 0, 4].forEach(function (x, i) {
      const s = (i % 2 ? 1 : -1) * pasos;
      c.beginPath(); c.moveTo(x, 2); c.lineTo(x + s * 2, 8); c.lineTo(x + 4 + s, 9); c.stroke();
      c.beginPath(); c.moveTo(x, -2); c.lineTo(x - s * 2, -8); c.lineTo(x + 4 - s, -9); c.stroke();
    });
    // abdomen, tórax y cabeza
    esfera(c, -8, 0, 6, 5, ['#e07a4a', '#9a3a1e', '#3a1408']);
    esfera(c, 0, 0, 4.5, 3.8, ['#e07a4a', '#9a3a1e', '#3a1408']);
    esfera(c, 8, 0, 3.8, 3.4, ['#e8895a', '#a8452a', '#3a1408']);
    // antenas
    c.strokeStyle = '#3a1408'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(10, -2); c.quadraticCurveTo(12, -8, 16 + pasos, -7); c.stroke();
    c.beginPath(); c.moveTo(10, -2); c.quadraticCurveTo(13, -6, 17 - pasos, -3); c.stroke();
    // ojo
    c.fillStyle = '#ffffff';
    c.beginPath(); c.arc(9, -1.5, 1.2, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#111';
    c.beginPath(); c.arc(9.4, -1.5, 0.7, 0, Math.PI * 2); c.fill();
  }

  // Pingüino (hielo): anda contoneándose; cuando se tira de barriga, se queda plano
  function dibujarPinguino(c, e, t) {
    const paso = Math.sin(t * 9);
    const tirado = e.lunging;
    c.translate(e.x, e.y + (tirado ? 6 : Math.abs(paso) * 0.8));
    c.scale(e.dir, 1);
    if (!tirado) {
      c.fillStyle = '#ffa62b';                                   // patas
      esfera(c, -3, 12, 4, 2, ['#ffd08a', '#f08a1a', '#a85a0c'], 0);
      esfera(c, 4, 12, 4, 2, ['#ffd08a', '#f08a1a', '#a85a0c'], 0);
    }
    esfera(c, 0, 0, 10, 12, ['#4a5a78', '#1e2a3e', '#0c1424']);  // espalda azul oscura
    contorno(c, 0, 0, 10, 12);
    esfera(c, 1, 3, 6.5, 8.5, ['#ffffff', '#f0f4f8', '#b8c4d4']); // barriga
    esfera(c, -9, 2 + paso * 1.5, 2.6, 6, ['#2a3a52', '#1e2a3e', '#0c1424']); // aleta
    esfera(c, 4, -6, 2.6, 2.8, ['#ffffff', '#f2f2f2', '#b8b8c4']);  // ojo
    esfera(c, 5, -6, 1.4, 1.4, ['#3a3a3a', '#111111', '#000000']);
    c.fillStyle = '#ffa62b';                                     // pico
    c.beginPath(); c.moveTo(8, -3); c.lineTo(14, -1); c.lineTo(8, 0); c.fill();
  }

  // Cangrejo (agua): de lado, con pinzas que se abren y se cierran
  function dibujarCangrejo(c, e, t) {
    const pinza = Math.sin(t * 8);
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    c.strokeStyle = '#8a2516'; c.lineWidth = 1.4; c.lineCap = 'round';
    [-6, 0, 6].forEach(function (x, i) {                         // patas
      const s = (i % 2 ? 1 : -1) * Math.sin(t * 14);
      c.beginPath(); c.moveTo(x - 1, 4); c.lineTo(x + 2 + s, 9); c.stroke();
      c.beginPath(); c.moveTo(-x + 1, 4); c.lineTo(-x - 2 - s, 9); c.stroke();
    });
    c.strokeStyle = '#e0523a'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(-4, -3); c.lineTo(-5, -8); c.moveTo(4, -3); c.lineTo(5, -8); c.stroke();
    esfera(c, 0, 2, 12, 6.5, ['#ff9a7a', '#e0523a', '#8a2516']);
    contorno(c, 0, 2, 12, 6.5);
    esfera(c, -5, -9, 2.2, 2.2, ['#ffffff', '#f0f0f0', '#a8a8b8']);
    esfera(c, 5, -9, 2.2, 2.2, ['#ffffff', '#f0f0f0', '#a8a8b8']);
    c.fillStyle = '#222';
    c.beginPath(); c.arc(-5, -9, 0.9, 0, Math.PI * 2); c.arc(5, -9, 0.9, 0, Math.PI * 2); c.fill();
    // brazos y pinzas
    c.strokeStyle = '#e0523a'; c.lineWidth = 2.2;
    c.beginPath(); c.moveTo(-9, 0); c.lineTo(-15, -4); c.stroke();
    c.beginPath(); c.moveTo(9, 0); c.lineTo(15, -4); c.stroke();
    const abre = 1.5 + 1.5 * pinza;
    esfera(c, -17, -6 - abre * 0.5, 4, 2.8, ['#ffb49a', '#e0523a', '#8a2516']);
    esfera(c, 17, -6 - abre * 0.5, 4, 2.8, ['#ffb49a', '#e0523a', '#8a2516']);
  }

  // Seta (bosque): gorro rojo con lunares, pasea y a veces se para a mirar
  function dibujarSeta(c, e, t) {
    const sube = e.reposo ? 0 : Math.abs(Math.sin(t * 10)) * 1;
    c.translate(e.x, e.y - sube);
    c.scale(e.dir, 1);
    esfera(c, 0, 4, 5, 6, ['#fff6e6', '#ead7b4', '#9c7c52']);   // pie
    esfera(c, 0, -3, 9, 6.5, ['#ff8a8a', '#d8302f', '#7a1212']); // gorro
    contorno(c, 0, -3, 9, 6.5);
    esfera(c, -4, -6, 2, 1.6, ['#ffffff', '#ffffff', '#dddddd']);  // lunares
    esfera(c, 3, -7, 1.7, 1.3, ['#ffffff', '#ffffff', '#dddddd']);
    esfera(c, 0, -1, 1.4, 1.1, ['#ffffff', '#ffffff', '#dddddd']);
    c.fillStyle = '#222';                                          // ojos
    c.beginPath(); c.arc(-2, 4, 1, 0, Math.PI * 2); c.arc(2.5, 4, 1, 0, Math.PI * 2); c.fill();
  }

  // Jabalí (bosque): cuerpo peludo, colmillos y ojo rojo cuando carga
  function dibujarJabali(c, e, t) {
    const trote = e.lunging ? Math.sin(t * 30) : Math.sin(t * 10);
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    c.strokeStyle = '#3e2a1e'; c.lineWidth = 2.4; c.lineCap = 'round';
    [-8, -2, 5, 10].forEach(function (x, i) {                    // patas
      const s = (i % 2 ? 1 : -1) * trote;
      c.beginPath(); c.moveTo(x, 6); c.lineTo(x + s * 1.5, 11); c.stroke();
    });
    esfera(c, -1, 0, 14, 9, ['#a8826a', '#7a5a44', '#3e2a1e']);
    contorno(c, -1, 0, 14, 9);
    c.strokeStyle = '#4a3020'; c.lineWidth = 1.2;                // cerdas del lomo
    for (let i = 0; i < 5; i++) {
      const x = -8 + i * 4;
      c.beginPath(); c.moveTo(x, -8); c.lineTo(x + 1.5, -11); c.stroke();
    }
    esfera(c, 12, 2, 7, 6.5, ['#b8927a', '#86604a', '#3e2a1e']);  // cabeza
    esfera(c, 18, 4, 3.5, 2.6, ['#f2b8a0', '#d08a70', '#8a4a38']); // hocico
    c.fillStyle = '#4a2a1a';
    c.beginPath(); c.arc(17, 3.5, 0.6, 0, Math.PI * 2); c.arc(19.5, 3.5, 0.6, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff8e0';                                     // colmillo
    c.beginPath(); c.moveTo(14, 6); c.lineTo(19, 2.5); c.lineTo(15.5, 7.5); c.fill();
    esfera(c, 11, -1, 1.7, 1.7, e.lunging ? ['#ffb0b0', '#ff3030', '#8a0a0a'] : ['#ffffff', '#f2f2f2', '#888']);
    if (!e.lunging) esfera(c, 11.6, -1, 0.9, 0.9, ['#444', '#111', '#000']);
  }

  // Murciélago (cueva): alas que aletean y ojos rojos
  function dibujarMurcielago(c, e, t) {
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    if (e.dead) c.rotate(1.4);
    const ala = e.dead ? 0 : Math.sin(t * 18);
    c.fillStyle = '#2e2442';
    c.beginPath(); c.moveTo(-2, -1); c.quadraticCurveTo(-10, -9 + ala * 4, -15, -3 + ala * 2);
    c.lineTo(-11, 1); c.quadraticCurveTo(-7, 1, -2, 2); c.fill();
    c.beginPath(); c.moveTo(2, -1); c.quadraticCurveTo(9, -8 - ala * 3, 13, -2 - ala);
    c.lineTo(9, 1); c.quadraticCurveTo(6, 1, 2, 2); c.fill();
    esfera(c, 0, 0, 5.5, 4.5, ['#6a5a8a', '#3e3058', '#1a1228']);
    contorno(c, 0, 0, 5.5, 4.5, 1);
    c.fillStyle = '#2e2442';                                    // orejas
    c.beginPath(); c.moveTo(-3, -3); c.lineTo(-4, -7); c.lineTo(-1, -4); c.fill();
    c.beginPath(); c.moveTo(1, -3); c.lineTo(2, -7); c.lineTo(4, -4); c.fill();
    esfera(c, 3, -1, 1.5, 1.5, ['#ffd0d0', '#ff4040', '#7a0000']);
    c.fillStyle = '#fff';                                        // colmillitos
    c.beginPath(); c.moveTo(2, 2); c.lineTo(2.6, 3.8); c.lineTo(3.2, 2); c.fill();
  }

  // Araña (cueva/castillo): patas que se mueven; se ve el hilo cuando salta
  function dibujarArana(c, e, t) {
    if (!e.onGround && !e.dead) {
      c.strokeStyle = 'rgba(230,230,230,0.55)'; c.lineWidth = 0.8;
      c.beginPath(); c.moveTo(e.x, e.y - e.h / 2); c.lineTo(e.x, e.y - 60); c.stroke();
    }
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    const mueve = e.onGround ? Math.sin(t * 16) : 0.4;
    c.strokeStyle = '#2a2a32'; c.lineWidth = 1.3; c.lineCap = 'round';
    [-3, 0, 3, 6].forEach(function (x, i) {
      const s = (i % 2 ? 1 : -1) * mueve;
      c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 2 + s, -5); c.lineTo(x + 6, -6 + s); c.stroke();
      c.beginPath(); c.moveTo(x, 1); c.lineTo(x + 2 - s, 6); c.lineTo(x + 6, 7 - s); c.stroke();
    });
    esfera(c, -4, 0, 5, 5.5, ['#5a5a66', '#2a2a32', '#0c0c12']);   // abdomen
    esfera(c, 4, -1, 3.8, 3.4, ['#6a6a76', '#2a2a32', '#0c0c12']); // cabeza
    contorno(c, 4, -1, 3.8, 3.4, 1);
    c.fillStyle = '#ff3c3c';                                      // ojos
    [[6.5, -2.5], [6.5, 0], [5, -3.6], [3, -3.2]].forEach(function (p) {
      c.beginPath(); c.arc(p[0], p[1], 0.8, 0, Math.PI * 2); c.fill();
    });
  }

  // Pez (agua): salta fuera del agua en arco y mueve la cola
  function dibujarPez(c, e, t) {
    const cola = Math.sin(t * 20);
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    c.rotate(Math.max(-0.8, Math.min(0.8, e.vy / 350)));          // la nariz sigue el salto
    c.fillStyle = '#e0782a';                                      // cola
    c.beginPath(); c.moveTo(-7, 0); c.lineTo(-13, -5 + cola * 2); c.lineTo(-13, 5 + cola * 2); c.fill();
    c.fillStyle = '#e8924a';                                      // aleta de arriba
    c.beginPath(); c.moveTo(-1, -4); c.lineTo(3, -9); c.lineTo(5, -4); c.fill();
    esfera(c, 0, 0, 10, 5.5, ['#ffe2a0', '#f09a3a', '#8a4a10']);
    contorno(c, 0, 0, 10, 5.5);
    esfera(c, 5, -1.5, 2, 2, ['#ffffff', '#f2f2f2', '#b8b8c4']);
    c.fillStyle = '#111';
    c.beginPath(); c.arc(5.6, -1.5, 0.9, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#8a4a10'; c.lineWidth = 0.9;               // boca
    c.beginPath(); c.moveTo(9, 1); c.lineTo(10, 1.5); c.stroke();
  }

  // Nubarrón: nube con cara y un jinete amarillo encima que levanta el brazo con un erizo al lanzarlo
  function dibujarNubarron(c, e, t) {
    c.translate(e.x, e.y);
    const blanca = ['#ffffff', '#eef4ff', '#9fb0d0'];
    esfera(c, 0, -8, 5.5, 5.5, ['#fff4c0', '#f2c040', '#9a6a10']);       // jinete
    contorno(c, 0, -8, 5.5, 5.5, 0.9);
    for (const ox of [-2, 2]) {
      esfera(c, ox + e.dir * 0.8, -9, 1.6, 1.8, ['#ffffff', '#f2f2f2', '#b8b8c4']);
      c.fillStyle = '#111';
      c.beginPath(); c.arc(ox + e.dir * 1.3, -8.8, 0.8, 0, Math.PI * 2); c.fill();
    }
    if (e.brazo > 0) {                                                  // erizo en alto, a punto de lanzarlo
      c.fillStyle = '#b8302a';
      for (let k = 0; k < 8; k++) {
        const a = (k * Math.PI) / 4;
        c.beginPath(); c.moveTo(e.dir * 5 + Math.cos(a) * 5.5, -17 + Math.sin(a) * 5.5);
        c.lineTo(e.dir * 5 + Math.cos(a + 0.3) * 3, -17 + Math.sin(a + 0.3) * 3);
        c.lineTo(e.dir * 5 + Math.cos(a - 0.3) * 3, -17 + Math.sin(a - 0.3) * 3); c.fill();
      }
      esfera(c, e.dir * 5, -17, 3.5, 3.5, ['#ff9a8a', '#e04a3a', '#801810']);
    }
    esfera(c, -9, 2, 7, 5.5, blanca);
    esfera(c, 9, 2, 7, 5.5, blanca);
    esfera(c, 0, 0, 10, 7, blanca);
    c.fillStyle = '#2a2a40';
    c.beginPath(); c.arc(-3, 0, 1.1, 0, Math.PI * 2); c.arc(3, 0, 1.1, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#2a2a40'; c.lineWidth = 0.8;
    c.beginPath(); c.arc(0, 2, 2.2, 0.2, Math.PI - 0.2); c.stroke();
  }

  // Bola de lava: brasa con halo, ojos y una estela de llamas en sentido contrario al movimiento
  function dibujarBolaLava(c, e, t) {
    c.translate(e.x, e.y);
    const halo = c.createRadialGradient(0, 0, 2, 0, 0, 12);
    halo.addColorStop(0, 'rgba(255,170,60,0.55)');
    halo.addColorStop(1, 'rgba(255,170,60,0)');
    c.fillStyle = halo;
    c.beginPath(); c.arc(0, 0, 12, 0, Math.PI * 2); c.fill();
    const sentido = e.vy > 0 ? -1 : 1;
    for (let k = 1; k <= 3; k++) {
      c.fillStyle = k === 1 ? '#ffb030' : k === 2 ? '#ff7a1a' : '#d03a10';
      c.beginPath(); c.ellipse(Math.sin(t * 20 + k) * 0.8, sentido * (4 + k * 2.5), 4 - k, 3 - k * 0.6, 0, 0, Math.PI * 2); c.fill();
    }
    esfera(c, 0, 0, 6, 6, ['#fff3a0', '#ff8a1a', '#a01800']);
    c.fillStyle = '#3a0800';
    c.beginPath(); c.arc(-2, -0.5, 1, 0, Math.PI * 2); c.arc(2, -0.5, 1, 0, Math.PI * 2); c.fill();
  }

  // Escorpión (desierto): cola curvada que se lanza hacia ti cuando estás cerca
  function dibujarEscorpion(c, e, t) {
    const pinza = Math.sin(t * 6);
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    const picando = e.lunging;
    const tipX = picando ? 9 : -6, tipY = picando ? -4 : -18;
    c.strokeStyle = '#b8702e'; c.lineWidth = 2.6; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-8, 0); c.quadraticCurveTo(-17, -6, -12, -14);
    c.quadraticCurveTo(-8, -20, tipX, tipY); c.stroke();
    c.fillStyle = '#2a1a0a';                                      // aguijón
    c.beginPath(); c.arc(tipX, tipY, 1.6, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#8a4a16'; c.lineWidth = 1.2;                 // patas
    [-4, 0, 4].forEach(function (x, i) {
      const s = (i % 2 ? 1 : -1) * Math.sin(t * 12) * (e.vx ? 1 : 0);
      c.beginPath(); c.moveTo(x, 4); c.lineTo(x + s, 9); c.stroke();
      c.beginPath(); c.moveTo(x, 4); c.lineTo(x - s, 9); c.stroke();
    });
    esfera(c, -2, 2, 8, 4.5, ['#f0b070', '#b8702e', '#5a3010']);  // cuerpo
    contorno(c, -2, 2, 8, 4.5, 1);
    c.strokeStyle = '#8a4a16'; c.lineWidth = 1.8;                 // pinzas
    c.beginPath(); c.moveTo(6, 1); c.lineTo(13, -2 + pinza); c.stroke();
    c.beginPath(); c.moveTo(6, 3); c.lineTo(13, 4 - pinza); c.stroke();
    esfera(c, 13, -2 + pinza, 2.4, 1.8, ['#ffd0a0', '#c87a38', '#6a3a14']);
    esfera(c, 13, 4 - pinza, 2.4, 1.8, ['#ffd0a0', '#c87a38', '#6a3a14']);
    c.fillStyle = '#111';
    c.beginPath(); c.arc(6, 0, 0.9, 0, Math.PI * 2); c.arc(8, 0, 0.9, 0, Math.PI * 2); c.fill();
  }

  // Medusa (agua): campana translúcida y tentáculos ondulantes
  function dibujarMedusa(c, e, t) {
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    c.strokeStyle = 'rgba(200,170,240,0.8)'; c.lineWidth = 1.4; c.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const x = -6 + i * 3;
      c.beginPath(); c.moveTo(x, 2);
      c.quadraticCurveTo(x + Math.sin(t * 3 + i) * 3, 7, x + Math.sin(t * 2.5 + i * 1.3) * 2, 13);
      c.stroke();
    }
    esfera(c, 0, -3, 10, 8, ['rgba(245,225,255,0.9)', 'rgba(190,150,230,0.72)', 'rgba(120,80,170,0.5)']);
    contorno(c, 0, -3, 10, 8, 1);
    esfera(c, -3, -6, 3.5, 2.5, ['rgba(255,255,255,0.8)', 'rgba(255,255,255,0.2)', 'rgba(255,255,255,0)']);
    esfera(c, 3, -2, 1.4, 1.4, ['#ffffff', '#ffffff', '#c8b0e0']);
  }

  // Fantasma (castillo): cuerpo blanco con cola ondulada, medio transparente
  function dibujarFantasma(c, e, t) {
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    c.globalAlpha = 0.78 + 0.22 * Math.sin(t * 5);
    c.fillStyle = 'rgba(232,240,255,0.92)';
    c.beginPath();
    c.arc(0, -4, 10, Math.PI, 0);
    c.lineTo(10, 10);
    for (let i = 0; i < 4; i++) {
      const x = 10 - (i + 1) * 5;
      c.quadraticCurveTo(x + 2.5, 10 + (i % 2 ? 3 : -2) + Math.sin(t * 4 + i) * 1.5, x, 10);
    }
    c.closePath(); c.fill();
    c.strokeStyle = 'rgba(90,110,160,0.7)'; c.lineWidth = 1; c.stroke();
    c.fillStyle = '#1a2440';                                      // ojos y boca
    c.beginPath(); c.ellipse(-3.5, -4, 1.8, 2.6, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(3.5, -4, 1.8, 2.6, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(0, 1.5, 2.2, 1.6, 0, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 1;
  }

  // Cuervo (Van Gogh, "Campo de trigo con cuervos"): negro azulado con brillo; bate las alas en zigzag
  function dibujarCuervo(c, e, t) {
    const ala = e.dead ? 0 : Math.sin(t * 16);
    const punta = -4 + ala * 5;                 // la punta del ala sube y baja con el aleteo
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    if (e.dead) c.rotate(1.2);
    c.fillStyle = '#14172a';
    // ala del fondo, más oscura, asomando detrás del cuerpo
    c.beginPath(); c.moveTo(-2, -2); c.quadraticCurveTo(-6, punta - 4, -11, punta - 1); c.quadraticCurveTo(-7, punta + 3, -3, 1); c.fill();
    // cola en abanico
    c.beginPath(); c.moveTo(-4, -1); c.lineTo(-13, -3 + ala * 0.5); c.lineTo(-12, 0.5); c.lineTo(-13, 2.5); c.lineTo(-4, 1.5); c.fill();
    esfera(c, 0, 0, 6.5, 4.4, ['#56669c', '#262c46', '#0b0d18']);
    contorno(c, 0, 0, 6.5, 4.4, 1);
    // ala de delante, con dos plumas separadas por una muesca
    c.fillStyle = '#1d2030';
    c.beginPath(); c.moveTo(-1, -1.5); c.quadraticCurveTo(-5, punta - 4, -11, punta); c.lineTo(-7, punta + 2.5); c.lineTo(-10, punta + 4.5); c.quadraticCurveTo(-5, punta + 4, -1, 2); c.fill();
    c.strokeStyle = 'rgba(130,150,210,0.4)'; c.lineWidth = 0.6;
    c.beginPath(); c.moveTo(-3, 0); c.quadraticCurveTo(-7, punta + 0.5, -10, punta + 0.5); c.stroke();
    // cabeza, pico y ojo
    esfera(c, 5, -2.6, 3.1, 2.9, ['#6a7ab0', '#2a3050', '#0c0e18']);
    c.fillStyle = '#e89a2a';   // pico
    c.beginPath(); c.moveTo(7.6, -3.4); c.lineTo(11.2, -2.4); c.lineTo(7.6, -1.2); c.fill();
    esfera(c, 6, -3.4, 1.3, 1.3, ['#ffffff', '#ffffff', '#cfd3e0']);
    c.fillStyle = '#111'; c.beginPath(); c.arc(6.5, -3.3, 0.7, 0, Math.PI * 2); c.fill();
  }

  // Hoja de girasol: forma de gota con su nervio central; crece con la planta
  function hojaGirasol(c, x, y, ang, largo) {
    c.save();
    c.translate(x, y); c.rotate(ang);
    c.fillStyle = '#4fa84a';
    c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(largo * 0.5, -largo * 0.45, largo, 0); c.quadraticCurveTo(largo * 0.5, largo * 0.45, 0, 0); c.fill();
    c.strokeStyle = '#2f6a2c'; c.lineWidth = 0.6;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(largo * 0.8, 0); c.stroke();
    c.restore();
  }

  // Girasol (Van Gogh): planta que sube del trigo; la cabeza es un disco de pétalos con semillas en espiral
  function dibujarGirasol(c, e, t) {
    const hd = headOffset(e);
    c.translate(e.x, e.y);
    c.lineCap = 'round';
    if (e.up > 0.02) {
      // tallo de dos tonos: un trazo oscuro y otro más claro encima
      c.strokeStyle = '#2f6a2c'; c.lineWidth = 3.4;
      c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(1.5, hd.y * 0.5, hd.x, hd.y); c.stroke();
      c.strokeStyle = '#5cb552'; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(-0.6, 0); c.quadraticCurveTo(0.9, hd.y * 0.5, hd.x - 0.6, hd.y); c.stroke();
      hojaGirasol(c, hd.x * 0.3, hd.y * 0.4, Math.PI + 0.45, 7 * e.up);   // hoja de la izquierda
      hojaGirasol(c, hd.x * 0.6, hd.y * 0.65, -0.5, 6 * e.up);            // hoja de la derecha
    }
    c.save();
    c.translate(hd.x, hd.y);
    c.rotate(Math.sin(t * 2) * 0.15);
    // dos corolas de pétalos: la de atrás más oscura y desplazada media vuelta
    for (let capa = 0; capa < 2; capa++) {
      c.fillStyle = capa ? '#ffd23f' : '#e09a12';
      for (let k = 0; k < 12; k++) {
        const a = (k + capa * 0.5) * Math.PI / 6;
        const r = capa ? 7 : 8.4;
        c.beginPath(); c.ellipse(Math.cos(a) * r, Math.sin(a) * r, 3.7, 1.9, a, 0, Math.PI * 2); c.fill();
      }
    }
    esfera(c, 0, 0, 5.2, 5.2, ['#9a6424', '#5a3a14', '#2a1a08']);
    // semillas en espiral (ángulo áureo), claras y oscuras alternas
    for (let i = 0; i < 16; i++) {
      const r = 0.7 + Math.sqrt(i) * 0.9;
      const a = i * 2.39996;
      c.fillStyle = i % 3 ? '#ffe9a0' : '#3a2410';
      c.beginPath(); c.arc(Math.cos(a) * r, Math.sin(a) * r, 0.6, 0, Math.PI * 2); c.fill();
    }
    c.restore();
  }

  // Ciprés (Van Gogh): llama oscura que se mece y da pasos con sus raíces; trazos de pincel y ceño enfadado
  function dibujarCipres(c, e, t) {
    const mece = Math.sin(t * 3) * 1.2;
    const paso = Math.sin(t * 8) * 1.6;
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    // raíces que alternan al andar
    c.fillStyle = '#0c2a18';
    c.beginPath(); c.ellipse(-3 + paso * 0.6, 16, 2.8, 1.7, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(3 - paso * 0.6, 16, 2.8, 1.7, 0, 0, Math.PI * 2); c.fill();
    // cuerpo: llama que se estrecha hacia arriba; la punta se mece
    const cuerpo = c.createLinearGradient(0, -18, 0, 15);
    cuerpo.addColorStop(0, '#4fa35a'); cuerpo.addColorStop(0.55, '#1d5a30'); cuerpo.addColorStop(1, '#0c2a18');
    c.fillStyle = cuerpo;
    c.beginPath(); c.moveTo(mece * 0.5, -18);
    c.bezierCurveTo(6.5, -10, 7.5, 6, 5.2, 15); c.lineTo(-5.2, 15);
    c.bezierCurveTo(-7.5, 6, -6.5, -10, mece * 0.5, -18);
    c.fill();
    c.strokeStyle = '#0a2014'; c.lineWidth = 1; c.stroke();
    // trazos de pincel curvos, como los de sus cipreses
    c.strokeStyle = 'rgba(190,240,140,0.55)'; c.lineWidth = 1.1;
    c.beginPath(); c.arc(-1.2 + mece * 0.3, -10, 2.4, 0.6, 3.6); c.stroke();
    c.beginPath(); c.arc(1.6 + mece * 0.3, -2, 2.1, 2.8, 5.6); c.stroke();
    c.beginPath(); c.arc(-1 + mece * 0.4, 6, 2.3, 0.4, 3.4); c.stroke();
    // ojos amarillos con ceño (parece enfadado)
    c.fillStyle = '#ffe066';
    c.beginPath(); c.ellipse(-2 + mece * 0.3, -3, 1.6, 1.9, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(2 + mece * 0.3, -3, 1.6, 1.9, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#0a1a0c';
    c.beginPath(); c.arc(-1.8 + mece * 0.3, -2.8, 0.8, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(2.2 + mece * 0.3, -2.8, 0.8, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#0a1a0c'; c.lineWidth = 0.9;
    c.beginPath(); c.moveTo(-4.2, -6.4); c.lineTo(-0.8, -5.2); c.moveTo(4.2, -6.4); c.lineTo(0.8, -5.2); c.stroke();
  }

  // Espiral (Van Gogh, "Noche estrellada"): remolino de trazos azules y amarillos que rueda por el suelo
  function dibujarEspiral(c, e, t) {
    c.translate(e.x, e.y);
    const luz = c.createRadialGradient(-2.5, -2.5, 1, 0, 0, 9.5);
    luz.addColorStop(0, '#fff7b0'); luz.addColorStop(0.45, '#f2c230'); luz.addColorStop(0.8, '#3d6fc8'); luz.addColorStop(1, '#14286b');
    c.fillStyle = luz;
    c.beginPath(); c.arc(0, 0, 9, 0, Math.PI * 2); c.fill();
    // tres brazos del remolino que giran con el enemigo
    c.save();
    c.rotate(t * 3 * e.dir);
    c.lineCap = 'round'; c.lineWidth = 1.3;
    const brazos = ['#9cc4ff', '#14286b', '#fff06a'];
    for (let b = 0; b < 3; b++) {
      c.strokeStyle = brazos[b];
      c.beginPath();
      for (let a = 0; a < Math.PI * 2.9; a += 0.25) {
        const r = 0.8 + a * 0.85;
        const ang = a + b * Math.PI * 2 / 3;
        if (a === 0) c.moveTo(Math.cos(ang) * r, Math.sin(ang) * r); else c.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
      }
      c.stroke();
    }
    c.restore();
    // brillo de estrella y contorno azul oscuro
    c.fillStyle = 'rgba(255,255,255,0.85)';
    c.beginPath(); c.arc(-3.2, -3.2, 1.1, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#0d1d4d'; c.lineWidth = 0.9;
    c.beginPath(); c.arc(0, 0, 9, 0, Math.PI * 2); c.stroke();
  }

  function dibujarTipo(c, e) {
    const t = e.t;
    switch (e.type) {
      case 'erizo':          return dibujarErizo(c, e, t, PAL.erizo);
      case 'erizo_zombie':   return dibujarErizo(c, e, t, PAL.erizo_zombie);
      case 'caracol':        return dibujarCaracol(c, e, t, PAL.caracol);
      case 'caracol_zombie': return dibujarCaracol(c, e, t, PAL.caracol_zombie);
      case 'abeja':          return dibujarAbeja(c, e, t);
      case 'planta':         return dibujarPlanta(c, e, t, PAL.planta);
      case 'planta_zombie':  return dibujarPlanta(c, e, t, PAL.planta_zombie);
      case 'esqueleto':      return dibujarEsqueleto(c, e, t);
      case 'hormiga':        return dibujarHormiga(c, e, t);
      case 'pinguino':       return dibujarPinguino(c, e, t);
      case 'cangrejo':       return dibujarCangrejo(c, e, t);
      case 'pez':            return dibujarPez(c, e, t);
      case 'medusa':         return dibujarMedusa(c, e, t);
      case 'escorpion':      return dibujarEscorpion(c, e, t);
      case 'seta':           return dibujarSeta(c, e, t);
      case 'jabali':         return dibujarJabali(c, e, t);
      case 'murcielago':     return dibujarMurcielago(c, e, t);
      case 'arana':          return dibujarArana(c, e, t);
      case 'fantasma':       return dibujarFantasma(c, e, t);
      case 'nubarron':       return dibujarNubarron(c, e, t);
      case 'pez_saltarin':   return dibujarPez(c, e, t);
      case 'pez_nadador':    return dibujarPez(c, e, t);
      case 'bola_lava':      return dibujarBolaLava(c, e, t);
      case 'cuervo':         return dibujarCuervo(c, e, t);
      case 'girasol':        return dibujarGirasol(c, e, t);
      case 'cipres':         return dibujarCipres(c, e, t);
      case 'espiral':        return dibujarEspiral(c, e, t);
      case 'reloj_blando':   return dibujarRelojBlando(c, e, t);
      case 'elefante':       return dibujarElefante(c, e, t);
      case 'pajaro_miro':    return dibujarPajaroMiro(c, e, t);
      case 'personaje_miro': return dibujarPersonajeMiro(c, e, t);
      case 'lagarto':        return dibujarLagarto(c, e, t);
      case 'silla':          return dibujarSilla(c, e, t);
      case 'estrella_fugaz': return dibujarEstrellaFugaz(c, e, t);
      case 'luna':           return dibujarLuna(c, e, t);
      case 'perro':          return dibujarPerro(c, e, t);
      case 'sol_negro':      return dibujarSolNegro(c, e, t);
      case 'serpiente':      return dibujarSerpiente(c, e, t);
    }
  }

  // Reloj blando (Dalí, "La persistencia de la memoria"): esfera de bolsillo que se escurre sobre una rama
  function dibujarRelojBlando(c, e, t) {
    const gota = Math.sin(t * 3) * 0.8;          // la gota se alarga y se encoge despacio
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    // rama seca con un nudo
    c.strokeStyle = '#6a4a2a'; c.lineWidth = 2; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-9, -6.5); c.lineTo(9, -6.5); c.stroke();
    c.lineWidth = 1; c.beginPath(); c.arc(4, -6.5, 1.1, 0, Math.PI * 2); c.stroke();
    // gota que se escurre por el borde de la rama
    c.strokeStyle = '#b9a46a'; c.lineWidth = 3.2;
    c.beginPath(); c.moveTo(3.5, 3.4); c.quadraticCurveTo(6.6, 4.8, 6.2, 9 + gota); c.stroke();
    c.strokeStyle = '#f0e2b0'; c.lineWidth = 2.2;
    c.beginPath(); c.moveTo(3.5, 3.4); c.quadraticCurveTo(6.6, 4.8, 6.2, 9 + gota); c.stroke();
    c.fillStyle = '#f0e2b0';
    c.beginPath(); c.arc(6.2, 9.8 + gota, 1.5, 0, Math.PI * 2); c.fill();
    // esfera: cara crema con borde dorado
    esfera(c, 0, -1, 6.6, 5.6, ['#fffbe6', '#f0e2b0', '#b9a46a']);
    contorno(c, 0, -1, 6.6, 5.6, 0.9);
    // marcas de las horas
    c.strokeStyle = '#5a4a2a'; c.lineWidth = 0.7;
    c.beginPath();
    for (let k = 0; k < 4; k++) {
      const a = k * Math.PI / 2;
      c.moveTo(Math.cos(a) * 4.2, -1 + Math.sin(a) * 3.6);
      c.lineTo(Math.cos(a) * 3.5, -1 + Math.sin(a) * 3.0);
    }
    c.stroke();
    // manecillas: la de los minutos gira despacio
    c.strokeStyle = '#2a2a3a'; c.lineWidth = 0.9;
    c.beginPath(); c.moveTo(0, -1); c.lineTo(Math.cos(t * 0.6) * 2.8, -1 + Math.sin(t * 0.6) * 2.8); c.stroke();
    c.beginPath(); c.moveTo(0, -1); c.lineTo(Math.cos(t * 0.1 - 1.2) * 2, -1 + Math.sin(t * 0.1 - 1.2) * 2); c.stroke();
  }

  // Elefante de Dalí: patas largas y finas que avanzan a pasos, un obelisco en el lomo y una trompa que cuelga
  function dibujarElefante(c, e, t) {
    const paso = Math.sin(t * 6) * 2.2;
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    c.lineCap = 'round'; c.lineJoin = 'round';
    // cola fina con mechón
    c.strokeStyle = '#b9ae9e'; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(-8.5, -4); c.quadraticCurveTo(-12, -2, -11, 3 + paso * 0.3); c.stroke();
    c.fillStyle = '#b9ae9e'; c.beginPath(); c.arc(-11, 3.8 + paso * 0.3, 1.2, 0, Math.PI * 2); c.fill();
    // patas largas con rodilla y pie; las del fondo son más oscuras y van en contrafase
    const pata = function (x, fase, col) {
      c.strokeStyle = col; c.lineWidth = 1.7;
      c.beginPath(); c.moveTo(x, 1); c.lineTo(x + fase * 0.5, 8); c.lineTo(x + fase * 1.2, 14.5); c.stroke();
      c.fillStyle = col; c.beginPath(); c.ellipse(x + fase * 1.2, 15, 2, 1, 0, 0, Math.PI * 2); c.fill();
    };
    pata(-2.5, -paso, '#a89c8a'); pata(2.5, paso, '#a89c8a');
    pata(-5.5, -paso, '#d8cfc4'); pata(5, paso, '#d8cfc4');
    // cuerpo redondo con sombra
    esfera(c, 0, -2, 9.5, 6.2, ['#fbf6ec', '#e6dccb', '#a99b84']);
    contorno(c, 0, -2, 9.5, 6.2, 0.9);
    // obelisco en el lomo: prisma con su punta, cara iluminada y cara en sombra
    c.fillStyle = '#efe6d4';
    c.fillRect(-4.4, -15.5, 1.6, 8.5);
    c.beginPath(); c.moveTo(-4.4, -15.5); c.lineTo(-2.8, -19); c.lineTo(-2.8, -15.5); c.fill();
    c.fillStyle = '#a99b84';
    c.fillRect(-2.8, -15.5, 1.6, 8.5);
    c.beginPath(); c.moveTo(-2.8, -15.5); c.lineTo(-2.8, -19); c.lineTo(-1.2, -15.5); c.fill();
    c.fillStyle = '#e0b04a'; c.beginPath(); c.arc(-2.8, -19.4, 0.8, 0, Math.PI * 2); c.fill();
    // oreja grande y cabeza, más pequeña que el cuerpo
    c.fillStyle = '#e3bfb0';
    c.beginPath(); c.ellipse(4.6, -6.4, 3.2, 4.4, -0.25, 0, Math.PI * 2); c.fill();
    esfera(c, 7.4, -7.2, 3.7, 3.5, ['#fbf6ec', '#e6dccb', '#a99b84']);
    contorno(c, 7.4, -7.2, 3.7, 3.5, 0.8);
    // colmillo y ojo con brillo
    c.strokeStyle = '#fffdf5'; c.lineWidth = 0.9;
    c.beginPath(); c.moveTo(9, -4); c.quadraticCurveTo(10.8, -3.6, 11.2, -2); c.stroke();
    c.fillStyle = '#2a2a3a'; c.beginPath(); c.arc(8.6, -8, 0.7, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#ffffff'; c.beginPath(); c.arc(8.85, -8.25, 0.25, 0, Math.PI * 2); c.fill();
    // trompa que cuelga del morro, con dos tonos y la punta hacia delante
    c.lineCap = 'round';
    c.strokeStyle = '#a89c8a'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(10.6, -5.4); c.quadraticCurveTo(14, -4.6, 13.2, 0.4); c.quadraticCurveTo(12.8, 3.6, 15.4, 4.2); c.stroke();
    c.strokeStyle = '#e6dccb'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(10.6, -5.4); c.quadraticCurveTo(14, -4.6, 13.2, 0.4); c.quadraticCurveTo(12.8, 3.6, 15.4, 4.2); c.stroke();
  }

  // Pájaro de Miró: trazo negro, cuerpo rojo, cresta y pico amarillo; el ala negra bate al volar en zigzag
  function dibujarPajaroMiro(c, e, t) {
    const ala = e.dead ? 0 : Math.sin(t * 14);
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    c.strokeStyle = '#1a1a1a'; c.lineWidth = 1.4; c.lineCap = 'round'; c.lineJoin = 'round';
    // cola en horquilla
    c.beginPath(); c.moveTo(-3.5, 1.5); c.lineTo(-9, -0.5); c.moveTo(-3.5, 2.5); c.lineTo(-9, 3.8); c.stroke();
    // ala negra en media luna que sube y baja desde el hombro
    c.fillStyle = '#1a1a1a';
    c.beginPath(); c.moveTo(-1.5, -0.5); c.quadraticCurveTo(-3, -6.5 + ala * 2.5, -8, -6 + ala * 3.5); c.quadraticCurveTo(-5, -2.5, -1.5, 1.5); c.fill();
    // cuerpo rojo con contorno negro
    c.fillStyle = '#d8322b';
    c.beginPath(); c.arc(0, 1, 4.6, 0, Math.PI * 2); c.fill(); c.stroke();
    // cresta, pico amarillo y ojo
    c.beginPath(); c.moveTo(-1.2, -3.4); c.quadraticCurveTo(-0.6, -5.6, 1.8, -4.8); c.stroke();
    c.fillStyle = '#ffc21a';
    c.beginPath(); c.moveTo(4, -0.2); c.lineTo(8.2, 1.2); c.lineTo(4, 2.8); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(2, -0.5, 1.4, 0, Math.PI * 2); c.fill(); c.stroke();
    c.fillStyle = '#1a1a1a'; c.beginPath(); c.arc(2.3, -0.4, 0.75, 0, Math.PI * 2); c.fill();
  }

  // Figura de Miró: trazo negro, torso azul, cabeza amarilla con un punto rojo; camina con los brazos en alto
  function dibujarPersonajeMiro(c, e, t) {
    const paso = Math.sin(t * 9) * 2.5;
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    c.strokeStyle = '#1a1a1a'; c.lineWidth = 1.4; c.lineCap = 'round'; c.lineJoin = 'round';
    // piernas: las rodillas se doblan al andar
    c.beginPath();
    c.moveTo(-1.5, 3); c.lineTo(-3 + paso, 7.5); c.lineTo(-3.4 + paso * 1.3, 11);
    c.moveTo(1.5, 3); c.lineTo(3 - paso, 7.5); c.lineTo(3.4 - paso * 1.3, 11);
    c.stroke();
    // brazos en alto que se alternan
    c.beginPath();
    c.moveTo(-2.5, -2.5); c.lineTo(-5.5, -6 - paso * 0.6);
    c.moveTo(2.5, -2.5); c.lineTo(5.5, -6 + paso * 0.6);
    c.stroke();
    // torso azul de Miró con borde negro
    c.fillStyle = '#2f6fd8';
    c.beginPath(); c.moveTo(-3, -4.2); c.lineTo(3, -4.2); c.lineTo(2, 4); c.lineTo(-2, 4); c.closePath(); c.fill(); c.stroke();
    // cabeza amarilla con antena y punto rojo
    c.fillStyle = '#ffc21a';
    c.beginPath(); c.arc(0, -8.2, 3.2, 0, Math.PI * 2); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(0, -11.4); c.lineTo(0.8, -13.6); c.stroke();
    c.fillStyle = '#d8322b';
    c.beginPath(); c.arc(0.9, -8.4, 0.9, 0, Math.PI * 2); c.fill();
  }

  // Lagarto de trencadís (Gaudí, el dragón del Park Güell): cuerpo de teselas de colores, cresta y cola que ondula
  function dibujarLagarto(c, e, t) {
    const paso = Math.sin(t * 10) * 1.4;
    const ondula = Math.sin(t * 6);
    const colores = ['#ffd27a', '#2f9fc8', '#ec6a4a', '#ffffff', '#f2a7c0'];
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    c.lineCap = 'round';
    // cola en S que ondula
    c.strokeStyle = '#2a5a3a'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(-7, -1); c.quadraticCurveTo(-12, -4 + ondula * 1.2, -16, -0.5 + ondula * 0.8); c.stroke();
    c.strokeStyle = '#3fa36b'; c.lineWidth = 1.8;
    c.beginPath(); c.moveTo(-7, -1); c.quadraticCurveTo(-12, -4 + ondula * 1.2, -16, -0.5 + ondula * 0.8); c.stroke();
    // patas: las del fondo, más oscuras, van en contrafase
    c.strokeStyle = '#2a5a3a'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(-1, 1); c.lineTo(-2 - paso, 6); c.moveTo(6, 1); c.lineTo(6 + paso, 6); c.stroke();
    c.strokeStyle = '#3fa36b'; c.lineWidth = 1.7;
    c.beginPath(); c.moveTo(-5, 1); c.lineTo(-6 + paso, 6); c.moveTo(3, 1); c.lineTo(3 - paso, 6); c.stroke();
    // cuerpo: sombreado y teselas recortadas a la forma del cuerpo
    esfera(c, 0, -1, 9, 4.6, ['#5fc08a', '#2f8f5a', '#1d5a38']);
    c.save();
    c.beginPath(); c.ellipse(0, -1, 9, 4.6, 0, 0, Math.PI * 2); c.clip();
    for (let fila = 0; fila < 3; fila++) {
      for (let col = 0; col < 7; col++) {
        c.fillStyle = colores[(col * 3 + fila * 2) % colores.length];
        c.fillRect(-8.5 + col * 2.6 + (fila % 2) * 1.3, -4.5 + fila * 2.6, 2.2, 2.2);
      }
    }
    c.restore();
    // cresta de teselas en el lomo, que vibra al andar
    for (let k = 0; k < 4; k++) {
      const x = -5 + k * 3.2;
      const alto = 2.2 + (k % 2) * 0.8 + Math.sin(t * 8 + k) * 0.3;
      c.fillStyle = colores[(k + 1) % colores.length];
      c.beginPath(); c.moveTo(x - 1.4, -4.2); c.lineTo(x, -4.2 - alto); c.lineTo(x + 1.4, -4.2); c.closePath(); c.fill();
    }
    // cabeza con hocico, ojo dorado y sonrisa
    esfera(c, 8, -2.4, 3.8, 3, ['#7fd6a2', '#3fa36b', '#1d5a38']);
    contorno(c, 8, -2.4, 3.8, 3, 0.8);
    c.fillStyle = '#ffd27a'; c.beginPath(); c.arc(9.2, -3.4, 0.95, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#1a1a1a'; c.beginPath(); c.arc(9.4, -3.4, 0.45, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#1d5a38'; c.lineWidth = 0.6;
    c.beginPath(); c.moveTo(9.6, -1.4); c.quadraticCurveTo(10.8, -0.9, 11.6, -1.9); c.stroke();
    c.fillStyle = '#ffd27a'; c.fillRect(6.2, -4.4, 1.6, 1.6);   // una tesela en la cabeza
  }

  // Silla con pipa (Van Gogh): silla de paja con su pipa humeante; al brincar recoge las patas
  function dibujarSilla(c, e, t) {
    const recogida = e.onGround ? 0 : 2.5;
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    c.lineCap = 'round';
    // patas de atrás, más oscuras
    c.strokeStyle = '#4a2f18'; c.lineWidth = 1.3;
    c.beginPath(); c.moveTo(-6, 3); c.lineTo(-6.6, 8 - recogida); c.moveTo(6, 3); c.lineTo(6.6, 8 - recogida); c.stroke();
    // respaldo: dos postes y dos listones
    c.strokeStyle = '#5a3a1e'; c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(-6, 2); c.lineTo(-6, -9); c.moveTo(6, 2); c.lineTo(6, -9); c.stroke();
    c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(-6, -8); c.lineTo(6, -8); c.moveTo(-6, -4.5); c.lineTo(6, -4.5); c.stroke();
    // dos ojos en el respaldo
    c.fillStyle = '#fffbe6';
    c.beginPath(); c.arc(-2.4, -6.4, 1.6, 0, Math.PI * 2); c.arc(2.4, -6.4, 1.6, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#1a1a1a';
    c.beginPath(); c.arc(-2.1, -6.2, 0.7, 0, Math.PI * 2); c.arc(2.7, -6.2, 0.7, 0, Math.PI * 2); c.fill();
    // asiento de paja: amarillo con el tejido cruzado
    c.fillStyle = '#e8c24a'; c.strokeStyle = '#b8901e'; c.lineWidth = 0.6;
    c.beginPath(); c.ellipse(0, 2.5, 7.5, 2.8, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-5, 1.2); c.lineTo(-2, 3.8); c.moveTo(0, 0.8); c.lineTo(3, 3.8); c.moveTo(4.5, 1); c.lineTo(6.2, 2.6); c.stroke();
    // patas de delante
    c.strokeStyle = '#6b4424'; c.lineWidth = 1.8;
    c.beginPath(); c.moveTo(-5, 4.5); c.lineTo(-5.4, 9 - recogida); c.moveTo(5, 4.5); c.lineTo(5.4, 9 - recogida); c.stroke();
    // pipa sobre el asiento, con su humo
    c.fillStyle = '#7a4522';
    c.beginPath(); c.arc(4.5, 1, 1.9, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#4a2a14'; c.lineWidth = 1.3;
    c.beginPath(); c.moveTo(5.9, 0.4); c.lineTo(9.4, -1.4); c.stroke();
    for (let k = 0; k < 3; k++) {
      c.fillStyle = 'rgba(235,235,235,' + (0.9 - k * 0.22) + ')';
      c.beginPath(); c.arc(9.6 + Math.sin(t * 3 + k * 1.7) * 0.9, -2.6 - k * 2.8, 1.1 + k * 0.5, 0, Math.PI * 2); c.fill();
    }
  }

  // Estrella fugaz (Van Gogh): estrella amarilla con halo y cola de luz; la cola va detrás del movimiento
  function dibujarEstrellaFugaz(c, e, t) {
    const sy = e.vy >= 0 ? 1 : -1;     // hacia dónde cae: la cola va hacia el lado contrario
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    const halo = c.createRadialGradient(0, 0, 1, 0, 0, 11);
    halo.addColorStop(0, 'rgba(255,250,190,0.9)'); halo.addColorStop(1, 'rgba(255,250,190,0)');
    c.fillStyle = halo;
    c.beginPath(); c.arc(0, 0, 11, 0, Math.PI * 2); c.fill();
    const cola = c.createLinearGradient(0, 0, -18, -9 * sy);
    cola.addColorStop(0, 'rgba(255,236,140,0.95)'); cola.addColorStop(1, 'rgba(255,236,140,0)');
    c.fillStyle = cola;
    c.beginPath(); c.moveTo(-1, -3 * sy); c.lineTo(-18, -9 * sy); c.lineTo(-1, 3 * sy); c.closePath(); c.fill();
    // cuerpo: estrella de cinco puntas que gira
    c.save();
    c.rotate(t * 2.5);
    c.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? 2.9 : 6.4, a = i * Math.PI / 5 - Math.PI / 2;
      if (i) c.lineTo(Math.cos(a) * r, Math.sin(a) * r); else c.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    c.closePath();
    c.fillStyle = '#fff2a0'; c.fill();
    c.strokeStyle = '#c98f10'; c.lineWidth = 0.9; c.lineJoin = 'round'; c.stroke();
    c.restore();
    // cara: dos ojos y una sonrisa torcida
    c.fillStyle = '#5a3a0a';
    c.beginPath(); c.arc(-1.9, -0.7, 0.7, 0, Math.PI * 2); c.arc(1.9, -0.7, 0.7, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#5a3a0a'; c.lineWidth = 0.7;
    c.beginPath(); c.moveTo(-1.6, 1.4); c.quadraticCurveTo(0.2, 2.6, 1.6, 1.2); c.stroke();
  }

  // Luna creciente (Van Gogh): media luna amarilla con halo y cara de enfado; gira en órbita
  function dibujarLuna(c, e, t) {
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    const halo = c.createRadialGradient(0, 0, 3, 0, 0, 14);
    halo.addColorStop(0, 'rgba(255,246,170,' + (0.6 + 0.2 * Math.sin(t * 3)) + ')'); halo.addColorStop(1, 'rgba(255,246,170,0)');
    c.fillStyle = halo;
    c.beginPath(); c.arc(0, 0, 14, 0, Math.PI * 2); c.fill();
    // la media luna: un círculo al que se le quita otro desplazado a la derecha
    c.beginPath(); c.arc(0, 0, 8, -0.8, 0.8, true); c.arc(3, 0, 6.2, 1.14, -1.14, false); c.closePath();
    c.fillStyle = '#f7e16a'; c.fill();
    c.strokeStyle = '#8a6a10'; c.lineWidth = 0.9; c.stroke();
    // cara: ojos y cejas de enfado
    c.fillStyle = '#4a3408';
    c.beginPath(); c.arc(-5, -1.8, 0.8, 0, Math.PI * 2); c.arc(-5, 1.8, 0.8, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#4a3408'; c.lineWidth = 0.7;
    c.beginPath(); c.moveTo(-6.4, -3.6); c.lineTo(-4.2, -2.8); c.moveTo(-6.4, 3.6); c.lineTo(-4.2, 2.8); c.stroke();
  }

  // Perro que ladra a la luna (Miró): silueta negra con la cola y la oreja rojas y un ojo azul; se lanza ladrando
  function dibujarPerro(c, e, t) {
    const galope = Math.sin(t * 12) * 2.4;
    c.translate(e.x, e.y);
    c.scale(e.dir, 1);
    c.lineCap = 'round'; c.lineJoin = 'round';
    // cola en alto, roja
    c.strokeStyle = '#d8322b'; c.lineWidth = 2.2;
    c.beginPath(); c.moveTo(-9, -1.5); c.quadraticCurveTo(-13, -7, -11, -9.5); c.stroke();
    // patas en contrafase: dos de delante y dos de atrás
    c.strokeStyle = '#1a1a1a'; c.lineWidth = 1.8;
    c.beginPath();
    c.moveTo(-6, 1.5); c.lineTo(-7 + galope, 7.5);
    c.moveTo(-3.5, 1.5); c.lineTo(-2.5 - galope, 7.5);
    c.moveTo(4, 1.5); c.lineTo(3.5 - galope, 7.5);
    c.moveTo(6.5, 1.5); c.lineTo(7.5 + galope, 7.5);
    c.stroke();
    // cuerpo alargado y cabeza con el hocico abierto
    c.fillStyle = '#1a1a1a';
    c.beginPath(); c.ellipse(-0.5, 0, 8.5, 4.4, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(7.6, -3.8, 4.2, 3.4, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.moveTo(9.8, -4.6); c.lineTo(13.6, -3.2); c.lineTo(9.8, -1.6); c.closePath(); c.fill();
    // oreja roja y ojo azul
    c.fillStyle = '#d8322b';
    c.beginPath(); c.moveTo(5.4, -6.4); c.lineTo(4.4, -10); c.lineTo(8.6, -7.4); c.closePath(); c.fill();
    c.fillStyle = '#2f6fd8'; c.beginPath(); c.arc(8.2, -4.6, 1.1, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#ffffff'; c.beginPath(); c.arc(8.5, -4.9, 0.35, 0, Math.PI * 2); c.fill();
    // ladridos: tres trazos delante del hocico cuando se lanza
    if (e.lunging) {
      c.strokeStyle = '#1a1a1a'; c.lineWidth = 1;
      for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(15 + k * 2, -6 + k * 2.6); c.lineTo(17 + k * 2, -6 + k * 2.6); c.stroke(); }
    }
  }

  // Sol negro (Miró): disco negro con rayos amarillos y rojos; se estira al subir y se aplasta al caer
  function dibujarSolNegro(c, e, t) {
    const estira = Math.max(-0.22, Math.min(0.22, -e.vy / 700));
    const rx = 6.2 * (1 - estira * 0.5), ry = 6.2 * (1 + estira);
    c.translate(e.x, e.y);

    // brazo derecho: carámbano que puede alzarse
    g.save(); g.translate(9, -36); g.rotate(o.brazo);
    poligono(g, [[-2.5, 0], [2.5, 0], [0, 20]], c[0], 0.7);

    // cabeza de cristal con corona de carámbanos
    [-6, -3, 0, 3, 6].forEach(function (x, i) {
      const alto = i === 2 ? 11 : 7;

    });
    poligono(g, [[0, -66], [8, -56], [6, -46], [-6, -46], [-8, -56]], grad(g, -8, -66, 8, -46, c), 0.9);
    linea(g, [[0, -66], [0, -46]], 'rgba(255,255,255,0.7)', 0.6);
    // ojos rasgados y boca
    poligono(g, [[-5, -57], [-1, -55], [-5, -54]], d.ojos, 0.3);
